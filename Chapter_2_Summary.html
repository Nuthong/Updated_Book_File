<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Chapter 2: Application Layer</title>

<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>

:root{
  color-scheme: light;
  --paper:#F6F4EE;
  --bg:#F6F4EE;
  --panel:#FFFFFF;
  --border:#DCD6C7;
  --text:#2A2A26;
  --text-soft:#6B6558;
  --navy:#1B3A5C;
  --navy-deep:#0F2740;
  --accent:#1B3A5C;
  --accent2:#2B6CB0;
  --accent-soft:#EAF1FA;
  --correct:#256D46;
  --correct-soft:#E7F3EB;
  --incorrect:#B3341F;
  --incorrect-soft:#FBEAE6;
  --flag:#B7862C;
  --flag-soft:#FBF1DA;
  --unanswered:#9A9486;
  --fontScale:1;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:'Sarabun',"Segoe UI",sans-serif;
  background:var(--paper);
  color:var(--text);
}
header{
  background:var(--navy-deep);
  border-bottom:4px solid var(--flag);
  box-shadow:0 2px 10px rgba(15,39,64,0.25);
  padding:16px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  position:sticky;
  top:0;
  z-index:10;
}
header h1{
  font-size:18px;
  margin:0;
  color:#F2EFE6;
  font-weight:700;
}
header .subtitle{
  font-size:12.5px;
  color:#C9C2AE;
  margin-top:2px;
}
.header-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.layout{
  display:flex;
  max-width:1200px;
  margin:0 auto;
  gap:20px;
  padding:20px;
}
.sidebar{width:250px;flex-shrink:0;}
.sidebar-panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:6px;
  padding:16px;
  position:sticky;
  top:80px;
  box-shadow:0 2px 8px rgba(15,39,64,0.06);
  max-height:calc(100vh - 100px);
  overflow-y:auto;
}
.sidebar-panel h3{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--text-soft);
  margin:0 0 10px 0;
  font-weight:600;
}
.toc-list{list-style:none;margin:0;padding:0;}
.toc-list li{margin-bottom:2px;}
.toc-list a{
  display:block;
  padding:7px 10px;
  border-radius:4px;
  color:var(--text);
  text-decoration:none;
  font-size:13px;
  border-left:3px solid transparent;
}
.toc-list a:hover{background:var(--accent-soft);color:var(--accent2);}
.toc-list a.active{background:var(--accent-soft);color:var(--navy);border-left:3px solid var(--navy);font-weight:600;}
main{flex:1;min-width:0;}
.section-card{
  background:var(--panel);
  border:1px solid var(--border);
  border-left:4px solid var(--navy);
  border-radius:6px;
  padding:24px;
  margin-bottom:18px;
  box-shadow:0 2px 10px rgba(15,39,64,0.06);
  scroll-margin-top:80px;
}
.section-card h2{
  margin:0 0 14px 0;
  font-size:18px;
  color:var(--navy-deep);
  padding-bottom:10px;
  border-bottom:2px solid var(--border);
}
.section-card h3{
  font-size:15px;
  color:var(--navy);
  margin:20px 0 10px 0;
}
.section-card .body-text{
  font-size:14.5px;
  line-height:1.9;
  white-space:pre-wrap;
}
.callout{
  margin:16px 0;
  padding:14px 16px;
  border-radius:6px;
  border-left:4px solid;
  font-size:14px;
  line-height:1.8;
}
.callout-note{background:var(--accent-soft);border-color:var(--accent2);}
.callout-example{background:#F4F2E8;border-color:var(--flag);}
.callout-warning{background:var(--incorrect-soft);border-color:var(--incorrect);}
.callout-formula{
  background:var(--navy-deep);
  color:#EAF1FA;
  border-color:var(--flag);
  font-family:'JetBrains Mono',monospace;
  overflow-x:auto;
}
.callout-title{
  font-weight:700;
  font-size:12.5px;
  text-transform:uppercase;
  letter-spacing:.04em;
  margin-bottom:8px;
  display:block;
}
.callout-note .callout-title{color:var(--accent2);}
.callout-example .callout-title{color:var(--flag);}
.callout-warning .callout-title{color:var(--incorrect);}
.callout-formula .callout-title{color:#C9DCF0;}
.image-block{
  margin:18px 0;
  text-align:center;
}
.image-block img{
  max-width:100%;
  height:auto;
  border-radius:6px;
  border:1px solid var(--border);
  box-shadow:0 2px 10px rgba(15,39,64,0.08);
}
.image-block .image-caption{
  font-size:12.5px;
  color:var(--text-soft);
  margin-top:8px;
  font-style:italic;
}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:13.5px;}
table th{background:var(--navy-deep);color:#F2EFE6;padding:9px 12px;text-align:left;}
table td{padding:8px 12px;border-bottom:1px solid var(--border);}
table tr:nth-child(even) td{background:#F4F2E8;}
@media (max-width:800px){
  .layout{flex-direction:column;}
  .sidebar{width:100%;}
  .sidebar-panel{position:static;max-height:none;}
}

</style>
<style>

/* ===== Readability & diagram enhancements ===== */
#readProgress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--flag),var(--accent2));width:0%;z-index:999;transition:width .12s ease;}

#backToTop{
  position:fixed;bottom:24px;right:24px;width:44px;height:44px;border-radius:50%;
  background:var(--navy-deep);color:#F2EFE6;border:none;cursor:pointer;font-size:18px;
  box-shadow:0 4px 14px rgba(15,39,64,0.3);display:none;align-items:center;justify-content:center;
  z-index:998;opacity:0;transition:opacity .2s ease, transform .2s ease;
}
#backToTop:hover{transform:translateY(-2px);}
#backToTop.show{display:flex;opacity:1;}

#fontCtrl{display:flex;gap:6px;align-items:center;}
#fontCtrl button{
  border:1.5px solid rgba(242,239,230,0.5);background:rgba(255,255,255,0.9);color:var(--navy);
  width:32px;height:32px;border-radius:4px;font-size:13px;cursor:pointer;font-weight:700;
  font-family:'Sarabun',sans-serif;
}
#fontCtrl button:hover{background:#fff;}

.section-card{opacity:0;transform:translateY(14px);transition:opacity .55s ease, transform .55s ease;}
.section-card.revealed{opacity:1;transform:translateY(0);}
@media (prefers-reduced-motion: reduce){
  .section-card{opacity:1;transform:none;transition:none;}
}

.section-card .body-text{font-size:calc(14.5px * var(--fontScale)) !important;}
.section-card h2{font-size:calc(18px * var(--fontScale)) !important;}
.section-card h3{font-size:calc(15px * var(--fontScale)) !important;}
.callout{font-size:calc(14px * var(--fontScale)) !important;}
table{font-size:calc(13.5px * var(--fontScale)) !important;}

.callout-note .callout-title::before{content:"📝 ";}
.callout-example .callout-title::before{content:"💡 ";}
.callout-warning .callout-title::before{content:"⚠️ ";}
.callout-formula .callout-title::before{content:"∑ ";}

/* ==== Animated sequence / flow diagrams ==== */
.diagram-block{
  margin:20px 0;padding:16px 18px 14px;background:#FBFAF6;border:1px solid var(--border);
  border-radius:8px;
}
.diagram-block h4{
  margin:0 0 12px 0;font-size:calc(14.5px * var(--fontScale));color:var(--navy-deep);
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
}
.diagram-play-btn{
  border:1.5px solid var(--accent2);background:#fff;color:var(--accent2);padding:5px 12px;
  border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Sarabun',sans-serif;
  flex-shrink:0;
}
.diagram-play-btn:hover{background:var(--accent-soft);}
.diagram-svg-wrap{overflow-x:auto;}
.diagram-svg{display:block;margin:0 auto;min-width:420px;}
.diagram-actor-label{font-family:'Sarabun',sans-serif;font-size:11.5px;font-weight:600;fill:var(--navy-deep);}
.diagram-lifeline{stroke:var(--border);stroke-width:1.5;stroke-dasharray:3,3;}
.diagram-node-box{fill:var(--panel);stroke:var(--navy);stroke-width:1.3;}
.diagram-arrow-path{fill:none;stroke:var(--accent2);stroke-width:2;marker-end:url(#arrowhead);}
.diagram-arrow-label{font-family:'JetBrains Mono',monospace;font-size:10.5px;fill:var(--navy-deep);}
.diagram-glow-dot{fill:var(--flag);filter:url(#glowFilter);opacity:0;}
.diagram-steps-list{list-style:none;margin:12px 0 0;padding:0;font-size:calc(13px * var(--fontScale));line-height:1.7;}
.diagram-steps-list li{padding:6px 10px;border-left:3px solid transparent;border-radius:4px;transition:background .3s ease, border-color .3s ease;}
.diagram-steps-list li.step-active{background:var(--accent-soft);border-left-color:var(--flag);}
.diagram-steps-list .step-num{
  display:inline-block;width:20px;height:20px;border-radius:50%;background:var(--navy);color:#fff;
  text-align:center;line-height:20px;font-size:11px;margin-right:8px;font-family:'JetBrains Mono',monospace;
}

</style>
</head>

<filter id="glowFilter" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.2" result="blur"></feGaussianBlur><feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter>

<script>
const SECTIONS = [{"title": "หลักการของ Network Application", "body": "การสร้างแอปพลิเคชันเครือข่ายคือการเขียนโปรแกรมที่รันบน **end system ต่างๆ** แล้วสื่อสารกันผ่านเครือข่าย โดย**ไม่ต้อง**เขียนซอฟต์แวร์ให้กับอุปกรณ์ใน network core (router, switch) เพราะอุปกรณ์เหล่านั้นไม่รัน user application — การออกแบบนี้ทำให้พัฒนา/เผยแพร่แอปใหม่ได้อย่างรวดเร็ว", "blocks": [{"type": "subheading", "content": "สถาปัตยกรรมของแอปพลิเคชัน: Client-Server vs P2P"}, {"type": "table", "content": "<table><tr><th>ลักษณะ</th><th>Client-Server</th><th>Peer-to-Peer (P2P)</th></tr><tr><td>Server</td><td>always-on host, IP address ถาวร มักอยู่ใน data center</td><td>ไม่มี server ตลอดเวลา (no always-on server)</td></tr><tr><td>การเชื่อมต่อ</td><td>client ติดต่อ server, client ไม่คุยกันเอง</td><td>end system คุยกันโดยตรง (arbitrary end systems)</td></tr><tr><td>IP address</td><td>client อาจเชื่อมต่อไม่ต่อเนื่อง, dynamic IP ได้</td><td>peer เชื่อมต่อไม่ต่อเนื่อง เปลี่ยน IP ได้เช่นกัน</td></tr><tr><td>Scalability</td><td>จำกัดตาม capacity ของ server</td><td>self-scalability — peer ใหม่นำทั้ง capacity และ demand เข้ามา</td></tr><tr><td>การจัดการ</td><td>ง่ายกว่า</td><td>ซับซ้อนกว่า (complex management)</td></tr><tr><td>ตัวอย่าง</td><td>HTTP, IMAP, FTP</td><td>P2P file sharing (BitTorrent), streaming, VoIP (Skype)</td></tr></table>"}, {"type": "subheading", "content": "Process, Socket และการระบุตัวตน"}, {"type": "note", "content": "**Process** คือโปรแกรมที่กำลังรันอยู่ใน host — process ในเครื่องเดียวกันสื่อสารกันด้วย inter-process communication (กำหนดโดย OS) ส่วน process ต่างเครื่องสื่อสารกันด้วยการแลกเปลี่ยนข้อความ (messages) โดย **client process** คือ process ที่ริเริ่มการสื่อสาร ส่วน **server process** คือ process ที่รอรับการติดต่อ (แอปแบบ P2P มีทั้ง client process และ server process ในตัวเอง)"}, {"type": "note", "content": "**Socket** คือ \"ประตู\" (door) ระหว่าง application process กับ transport-layer infrastructure — process ส่ง/รับ message ผ่าน socket ของตัวเอง ฝั่ง sending process \"ผลัก\" message ออกทางประตู แล้วอาศัย transport infrastructure ฝั่งตรงข้ามนำ message ไปส่งที่ socket ของ receiving process (ต้องมี socket ทั้ง 2 ฝั่ง) — ส่วน socket **อยู่ภายใต้การควบคุมของ app developer** ในขณะที่ transport layer ลงไปถึง physical layer ถูกควบคุมโดย OS"}, {"type": "warning", "content": "การระบุ process เพื่อรับข้อความ ต้องใช้ **ทั้ง IP address และ port number** — เพราะ IP address อย่างเดียวไม่พอ (host หนึ่งเครื่องรันหลาย process พร้อมกันได้) ตัวอย่าง: HTTP server ใช้ port 80, mail server ใช้ port 25 เช่น ส่ง HTTP message ไปยัง gaia.cs.umass.edu ต้องระบุ IP `128.119.245.12` และ port `80`"}, {"type": "subheading", "content": "องค์ประกอบของ Application-layer Protocol"}, {"type": "note", "content": "Application-layer protocol กำหนด: **ประเภทข้อความ** (เช่น request, response), **message syntax** (มี field อะไรบ้าง คั่นอย่างไร), **message semantics** (ความหมายของข้อมูลในแต่ละ field), และ **กฎเกณฑ์ว่าเมื่อไหร่/อย่างไรที่ process จะส่ง/ตอบสนองข้อความ** แบ่งเป็น **open protocol** (นิยามใน RFC ทุกคนเข้าถึงได้ ทำให้ interoperable เช่น HTTP, SMTP) และ **proprietary protocol** (เช่น Skype, Zoom)"}]}, {"title": "Transport Service ที่แอปพลิเคชันต้องการ", "body": "แอปพลิเคชันแต่ละประเภทต้องการคุณสมบัติของ transport service ต่างกัน ขึ้นกับ 4 มิติหลัก: throughput, data integrity, timing, security", "blocks": [{"type": "table", "content": "<table><tr><th>มิติ</th><th>รายละเอียด</th></tr><tr><td>Throughput</td><td>บางแอป (เช่น multimedia) ต้องการ throughput ขั้นต่ำจึงจะ \"ใช้งานได้จริง\" ส่วนแอปแบบ \"elastic\" ใช้ throughput เท่าที่ได้รับ</td></tr><tr><td>Data integrity</td><td>บางแอป (file transfer, web transaction) ต้องการ reliable data transfer 100% ส่วนบางแอป (เช่น audio) ทนต่อการสูญเสียข้อมูลบางส่วนได้ (loss-tolerant)</td></tr><tr><td>Timing</td><td>บางแอป (Internet telephony, interactive games) ต้องการ delay ต่ำจึงจะใช้งานได้</td></tr><tr><td>Security</td><td>encryption, data integrity ฯลฯ</td></tr></table>"}, {"type": "subheading", "content": "ความต้องการของแอปทั่วไป"}, {"type": "table", "content": "<table><tr><th>Application</th><th>Throughput</th><th>Data Loss</th><th>Time Sensitive?</th></tr><tr><td>File transfer/download</td><td>elastic</td><td>no loss</td><td>no</td></tr><tr><td>E-mail</td><td>elastic</td><td>no loss</td><td>no</td></tr><tr><td>Web documents</td><td>elastic</td><td>no loss</td><td>no</td></tr><tr><td>Real-time audio/video</td><td>audio 5Kbps–1Mbps, video 10Kbps–5Mbps</td><td>loss-tolerant</td><td>yes, 10's msec</td></tr><tr><td>Streaming audio/video</td><td>เหมือนข้างต้น</td><td>loss-tolerant</td><td>yes, few secs</td></tr><tr><td>Interactive games</td><td>Kbps+</td><td>loss-tolerant</td><td>yes, 10's msec</td></tr><tr><td>Text messaging</td><td>elastic</td><td>no loss</td><td>yes and no</td></tr></table>"}, {"type": "subheading", "content": "TCP vs UDP: บริการที่ Internet Transport Protocol ให้"}, {"type": "table", "content": "<table><tr><th>คุณสมบัติ</th><th>TCP</th><th>UDP</th></tr><tr><td>Reliable transport</td><td>✓ มี</td><td>✗ ไม่มี (unreliable data transfer)</td></tr><tr><td>Flow control</td><td>✓ มี (sender ไม่ overwhelm receiver)</td><td>✗ ไม่มี</td></tr><tr><td>Congestion control</td><td>✓ มี (throttle sender เมื่อ network overload)</td><td>✗ ไม่มี</td></tr><tr><td>Connection setup</td><td>✓ ต้องมี (connection-oriented)</td><td>✗ ไม่ต้อง</td></tr><tr><td>Timing/throughput/security</td><td>✗ ไม่การันตี</td><td>✗ ไม่การันตี</td></tr></table>"}, {"type": "warning", "content": "**คำถามคลาสสิก**: ในเมื่อ UDP ไม่ให้ความน่าเชื่อถืออะไรเลย ทำไมยังต้องมี UDP? — เพราะแอปบางประเภท (เช่น streaming, การเล่นเกม, DNS) ต้องการความเร็วและไม่ต้องการ overhead ของ connection setup/flow control/congestion control ของ TCP ยอมรับการสูญเสีย packet บางส่วนได้ดีกว่ายอมให้ delay สูงจาก retransmission"}, {"type": "table", "content": "<table><tr><th>Application</th><th>Application-layer Protocol</th><th>Transport Protocol</th></tr><tr><td>File transfer/download</td><td>FTP [RFC 959]</td><td>TCP</td></tr><tr><td>E-mail</td><td>SMTP [RFC 5321]</td><td>TCP</td></tr><tr><td>Web documents</td><td>HTTP [RFC 7230, 9110]</td><td>TCP</td></tr><tr><td>Internet telephony</td><td>SIP, RTP หรือ proprietary</td><td>TCP หรือ UDP</td></tr><tr><td>Streaming audio/video</td><td>HTTP [RFC 7230], DASH</td><td>TCP</td></tr><tr><td>Interactive games</td><td>WOW, FPS (proprietary)</td><td>UDP หรือ TCP</td></tr></table>"}, {"type": "subheading", "content": "Securing TCP: TLS"}, {"type": "note", "content": "Socket แบบ TCP/UDP ธรรมดา (\"vanilla\") **ไม่มีการเข้ารหัส** — รหัสผ่านที่ส่งผ่าน socket แบบนี้จะเดินทางผ่านอินเทอร์เน็ตแบบ cleartext (ข้อความธรรมดา ไม่เข้ารหัส) จึงต้องใช้ **TLS (Transport Layer Security)** ซึ่งให้ encrypted TCP connection, data integrity และ end-point authentication — TLS ถูก implement ที่ **application layer** (แอปใช้ TLS library ซึ่งใช้ TCP อีกทีหนึ่ง) รายละเอียดเพิ่มเติมอยู่ใน Chapter 8"}]}, {"title": "Web และ HTTP", "body": "**HTTP (HyperText Transfer Protocol)** คือ application-layer protocol ของเว็บ ทำงานแบบ client/server model โดย web page ประกอบด้วย **objects** หลายชิ้น (HTML file, JPEG image, audio ฯลฯ) แต่ละชิ้นระบุด้วย URL เช่น `www.someschool.edu/someDept/pic.gif` (host name + path name)", "blocks": [{"type": "subheading", "content": "กลไกพื้นฐานของ HTTP"}, {"type": "note", "content": "HTTP ใช้ **TCP**: client เปิด TCP connection ไปยัง server (สร้าง socket) ที่ **port 80**, server accept connection, จากนั้นแลกเปลี่ยน HTTP message กัน แล้วปิด TCP connection ในที่สุด\n\nHTTP เป็น protocol แบบ **stateless** — server **ไม่เก็บข้อมูล**เกี่ยวกับ request ที่ผ่านมาของ client เลย ทำให้แต่ละ HTTP request เป็นอิสระจากกัน (ข้อดี: ถ้า server/client ล่ม ไม่ต้องกังวลเรื่อง state ที่ไม่สอดคล้องกัน; protocol ที่รักษา state จะซับซ้อนกว่ามาก)"}, {"type": "subheading", "content": "Non-persistent vs Persistent HTTP"}, {"type": "table", "content": "<table><tr><th>ลักษณะ</th><th>Non-persistent HTTP</th><th>Persistent HTTP (HTTP/1.1)</th></tr><tr><td>TCP connection</td><td>เปิดใหม่ทุกครั้งที่ขอ object และปิดทันทีหลังส่ง 1 object</td><td>server เปิด connection ค้างไว้ ส่งหลาย object ผ่าน connection เดียวกันได้</td></tr><tr><td>จำนวน RTT</td><td>ต้องใช้ 2 RTT ต่อ object (1 สำหรับเปิด TCP + 1 สำหรับ HTTP request/response)</td><td>อาจใช้เพียง 1 RTT รวมสำหรับทุก object ที่อ้างอิง (ลด response time ลงครึ่งหนึ่ง)</td></tr><tr><td>overhead</td><td>OS ต้องสร้าง/ทำลาย TCP connection ซ้ำๆ, browser มักเปิดหลาย connection ขนาน</td><td>ลด overhead ลง</td></tr></table>"}, {"type": "formula", "label": "Non-persistent HTTP Response Time", "content": "$$\\text{Non-persistent HTTP response time} = 2 \\times RTT + \\text{file transmission time}$$\n\nโดย **RTT (Round-Trip Time)** = เวลาที่ packet เล็กๆ เดินทางจาก client ไป server แล้วกลับมา\n\n- **1 RTT แรก**: เปิด TCP connection\n- **1 RTT ที่สอง**: ส่ง HTTP request และรอรับ byte แรกๆ ของ response กลับมา\n- บวกด้วยเวลาส่งไฟล์ (transmission time) ของ object นั้น"}, {"type": "example", "content": "**ตัวอย่างการคำนวณ Non-persistent HTTP**: หน้าเว็บ home.index มี text + รูปอ้างอิง 10 รูป jpeg แต่ละรูปต้องเปิด TCP connection ใหม่ ดังนั้นถ้า 1 RTT = 100 ms และแต่ละ object ใช้เวลาส่ง (transmission time) 10 ms จะได้ response time ต่อ object = $2 \\times 100 + 10 = 210$ ms และถ้าดาวน์โหลดทั้ง 10 รูปแบบ sequential (ไม่ parallel) จะใช้เวลารวมประมาณ $210 \\times 10 = 2100$ ms — นี่คือเหตุผลที่ browser มักเปิดหลาย TCP connection พร้อมกันเพื่อลดเวลารวม"}, {"type": "subheading", "content": "รูปแบบ HTTP Request Message"}, {"type": "note", "content": "HTTP request message เป็น **ASCII (human-readable)** ประกอบด้วย:\n\n1. **Request line**: method (GET, POST, HEAD ฯลฯ), URL, version — เช่น `GET /index.html HTTP/1.1`\n2. **Header lines**: เช่น `Host:`, `User-Agent:`, `Accept:`, `Connection:` แต่ละบรรทัดจบด้วย carriage-return-line-feed (`\\r\\n`)\n3. บรรทัดว่าง (`\\r\\n` เดี่ยวๆ) บอกจุดสิ้นสุดของ header\n4. **Entity body** (สำหรับ POST เป็นต้น)"}, {"type": "table", "content": "<table><tr><th>HTTP Method</th><th>หน้าที่</th></tr><tr><td>GET</td><td>ขอข้อมูล (สามารถส่ง user data แนบท้าย URL หลัง '?' ได้ เช่น `?monkeys&banana`)</td></tr><tr><td>POST</td><td>ส่งข้อมูลจากฟอร์มของผู้ใช้ผ่าน entity body ของ request</td></tr><tr><td>HEAD</td><td>ขอเฉพาะ header ที่จะได้จาก GET (ไม่ขอ body)</td></tr><tr><td>PUT</td><td>อัปโหลดไฟล์ใหม่ไปแทนที่ไฟล์เดิมที่ URL ที่ระบุทั้งหมด</td></tr></table>"}, {"type": "subheading", "content": "รูปแบบ HTTP Response Message"}, {"type": "note", "content": "ประกอบด้วย **status line** (protocol version, status code, status phrase — เช่น `HTTP/1.1 200 OK`), **header lines** (เช่น `Date:`, `Server:`, `Content-Length:`, `Content-Type:`) และ **data** (เช่นไฟล์ HTML ที่ขอ)"}, {"type": "table", "content": "<table><tr><th>Status Code</th><th>ความหมาย</th></tr><tr><td>200 OK</td><td>request สำเร็จ, object แนบมาในข้อความ</td></tr><tr><td>301 Moved Permanently</td><td>object ถูกย้ายที่อยู่ใหม่ (ระบุใน header `Location:`)</td></tr><tr><td>400 Bad Request</td><td>server ไม่เข้าใจ request message</td></tr><tr><td>404 Not Found</td><td>ไม่พบ document ที่ขอบน server นี้</td></tr><tr><td>505 HTTP Version Not Supported</td><td>server ไม่รองรับ HTTP version ที่ระบุ</td></tr></table>"}, {"type": "diagram", "layout": "lifeline", "title": "HTTP Request/Response ผ่าน TCP Connection", "actors": ["Client\n(Browser)", "Web Server"], "steps": [{"from": 0, "to": 1, "label": "SYN", "note": "ขอเปิดการเชื่อมต่อ TCP"}, {"from": 1, "to": 0, "label": "SYN + ACK", "note": "เซิร์ฟเวอร์ตอบรับ"}, {"from": 0, "to": 1, "label": "ACK + HTTP GET", "note": "ยืนยันและส่งคำขอหน้าเว็บ"}, {"from": 1, "to": 0, "label": "HTTP 200 OK + Response", "note": "ส่งเนื้อหาเว็บกลับมา"}]}]}, {"title": "Cookies: การรักษา State ระหว่าง User และ Server", "body": "แม้ HTTP GET/response จะเป็น stateless แต่เว็บไซต์และ browser ใช้ **cookies** เพื่อรักษา \"state\" บางอย่างระหว่างการทำ transaction", "blocks": [{"type": "subheading", "content": "องค์ประกอบของ Cookie (4 ส่วน)"}, {"type": "note", "content": "1. Cookie header line ใน HTTP **response** message (`Set-Cookie:`)\n2. Cookie header line ใน HTTP **request** message ครั้งถัดไป (`Cookie:`)\n3. Cookie file ที่เก็บไว้ใน host ของผู้ใช้ จัดการโดย browser\n4. Back-end database ที่ฝั่ง Web site\n\n**ตัวอย่าง**: เมื่อ Susan เข้าเว็บ e-commerce ครั้งแรก site จะสร้าง unique ID (\"cookie\") และเก็บ entry ใน backend database — จากนั้น HTTP request ทุกครั้งถัดไปจาก Susan จะแนบ cookie ID นี้ ทำให้ site \"จำ\" Susan ได้"}, {"type": "subheading", "content": "First-party vs Third-party Cookies (การติดตามพฤติกรรมผู้ใช้)"}, {"type": "note", "content": "**First-party cookie**: มาจากเว็บไซต์ที่ผู้ใช้เลือกเข้าเยี่ยมชมเอง (เช่น nytimes.com ให้ base HTML file)\n**Third-party cookie**: มาจากเว็บไซต์ที่ผู้ใช้ **ไม่ได้เลือก**เข้าเยี่ยมชมโดยตรง (เช่น AdX.com ที่ฝัง ad มาในหน้า nytimes.com)"}, {"type": "image", "src": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wAARCAIuAwQDASIAAhEBAxEB/8QAHAABAAEFAQEAAAAAAAAAAAAAAAcBAgQFBggD/8QAZBAAAAQDAwYHCgkJBAcFBwQDAAECAwQFEQYSIRMiIzFBUQcUJCYzNDYVFhdUVWFxkZTRMlJidIGho7LSU1Zlg5WksbPiCEJykzVkdYLBw+FDRnOE8Cc3REVjkqIYJSjC8dN2/8QAGQEBAQADAQAAAAAAAAAAAAAAAAUBAwQC/8QANREAAgADBQMKBwEBAQEAAAAAAAECQVEDERQxYRMhUgQFEhVTYpGhouEyM3GSsdHwgUIiwf/aAAwDAQACEQMRAD8A9Ex8fDSuBcjIx3JMN0vLumqlTIiwLHWZDSHb6zZapjX9S5+EVt92Ij/1f8xIhpttbzqW2kKW4sySlKSqajPURFtMcltbRWcVyJvKuVR2MahhSyJj7/7OeUPsXPwh3/2c8ofYufhEV97068jx/sy/cHe9OvI8f7Mv3DViLShz4234fJkqd/8AZzyh9i5+EO/+znlD7Fz8IivvenXkeP8AZl+4O96deR4/2ZfuDEWlBjbfh8mSp3/2c8ofYufhDv8A7OeUPsXPwiK+96deR4/2ZfuDvenXkeP9mX7gxFpQY234fJkqd/8AZzyh9i5+EO/+znlD7Fz8IivvenXkeP8AZl+4O96deR4/2ZfuDEWlBjbfh8mSp3/2c8ofYufhDv8A7OeUPsXPwiK+96deR4/2ZfuDvenXkeP9mX7gxFpQY234fJkqd/8AZzyh9i5+EO/+znlD7Fz8IivvenXkeP8AZl+4O96deR4/2ZfuDEWlBjbfh8mSp3/2c8ofYufhDv8A7OeUPsXPwiK+96deR4/2ZfuDvenXkeP9mX7gxFpQY234fJkqd/8AZzyh9i5+EO/+znlD7Fz8IivvenXkeP8AZl+4O96deR4/2ZfuDEWlBjbfh8mSp3/2c8ofYufhDv8A โดยไม่ต้องติดต่อ origin server ทุกครั้ง — ช่วยลด response time และลด traffic บน access link ขององค์กร", "blocks": [{"type": "subheading", "content": "กลไกการทำงานของ Web Cache"}, {"type": "note", "content": "ผู้ใช้ตั้งค่า browser ให้ชี้ไปที่ web cache (local) — browser จะส่ง HTTP request **ทั้งหมด**ไปที่ cache ก่อน\n\n- ถ้า object อยู่ใน cache แล้ว → cache ส่ง object กลับให้ client ทันที\n- ถ้าไม่มี → cache ขอ object จาก origin server, เก็บสำเนาไว้ใน cache, แล้วส่งต่อให้ client\n\nWeb cache ทำหน้าที่เป็นทั้ง **server** (สำหรับ client ที่ขอ) และ **client** (เมื่อขอไปยัง origin server) เหตุผลที่ต้องมี web caching: ลด response time (cache อยู่ใกล้ client กว่า), ลด traffic บน access link ขององค์กร, และช่วยให้ content provider รายเล็กส่ง content ได้มีประสิทธิภาพมากขึ้น"}, {"type": "formula", "label": "ตัวอย่างการคำนวณ Utilization และ Delay กับ Web Cache", "content": "**สถานการณ์**: access link rate = 1.54 Mbps, RTT (institutional router ↔ origin server) = 2 sec, web object size = 100 Kbits, average request rate = 15 คำขอ/วินาที, avg data rate ไปยัง browser = 1.50 Mbps\n\n**ไม่มี cache**: access link utilization $= 1.50/1.54 = 0.97$ (สูงมาก) → เกิด **queueing delay มหาศาล** (หลักนาที) ที่ access link แม้ Internet delay จะคงที่ 2 วินาที"}, {"type": "example", "content": "**สมมติติดตั้ง web cache ที่มี cache hit rate = 0.4 (40%)**:\n\n- 40% ของ request ถูกตอบโดย cache ด้วย delay ต่ำ (หลัก msec)\n- 60% ที่เหลือต้องไปที่ origin server: rate ผ่าน access link $= 0.6 \\times 1.50 = 0.9$ Mbps\n- access link utilization ใหม่ $= 0.9/1.54 \\approx 0.58$ → queueing delay ต่ำลงมาก (หลัก msec)\n- **average end-end delay** $= 0.6 \\times 2.01\\text{s (origin)} + 0.4 \\times (\\text{~msec, cache}) \\approx 1.2$ วินาที\n\nผลลัพธ์: ติดตั้ง web cache (ราคาถูก) ให้ average delay ต่ำกว่าการซื้อ access link ความเร็วสูงขึ้น 100 เท่า (154 Mbps, ราคาแพงมาก) เสียอีก!"}, {"type": "subheading", "content": "Conditional GET (Browser Caching)"}, {"type": "note", "content": "เป้าหมาย: **ไม่ส่ง object ซ้ำ** ถ้า browser มีสำเนาที่ up-to-date อยู่แล้ว (ลด transmission delay และการใช้ network resource) — client ระบุวันที่ของสำเนาที่ cache ไว้ผ่าน header `If-modified-since: <date>`\n\n- ถ้า object **ไม่ถูกแก้ไข**หลังจากวันที่นั้น → server ตอบกลับด้วย `HTTP/1.0 304 Not Modified` (ไม่มี object แนบมา)\n- ถ้า object **ถูกแก้ไข**หลังจากวันที่นั้น → server ตอบกลับด้วย `HTTP/1.0 200 OK` พร้อมข้อมูลใหม่"}]}, {"title": "HTTP/2 และ HTTP/3", "body": "เป้าหมายหลักของ HTTP/2 คือ**ลด delay** ในการขอ object หลายชิ้นพร้อมกัน โดยแก้ปัญหา Head-of-Line (HOL) Blocking ของ HTTP/1.1", "blocks": [{"type": "subheading", "content": "ปัญหาของ HTTP/1.1: Head-of-Line (HOL) Blocking"}, {"type": "note", "content": "HTTP/1.1 รองรับการส่งหลาย GET request แบบ pipelined ผ่าน TCP connection เดียว แต่ server จะตอบกลับแบบ **FCFS (First-Come-First-Served)** — ผลคือถ้า object เล็กมาทีหลัง object ใหญ่ ก็ต้อง**รอ**ให้ object ใหญ่ส่งเสร็จก่อน (Head-of-Line blocking) นอกจากนี้การ retransmit segment ที่หายไปก็ทำให้ object transmission หยุดชะงัก (stall) ทั้งหมด"}, {"type": "subheading", "content": "HTTP/2: แก้ปัญหาด้วย Frame Interleaving"}, {"type": "note", "content": "HTTP/2 [RFC 7540, 2015] เพิ่มความยืดหยุ่นที่ server:\n\n- methods, status code, header field ส่วนใหญ่**เหมือนเดิม**กับ HTTP/1.1\n- ลำดับการส่ง object กำหนดตาม **priority ที่ client ระบุ** ไม่จำเป็นต้องเป็น FCFS\n- server **push** object ที่ client ยังไม่ได้ขอได้\n- แบ่ง object เป็น **frame** แล้ว **interleave** (สลับส่ง) เพื่อลด HOL blocking\n\nตัวอย่าง: client ขอ 1 object ใหญ่ (O1) และ 3 object เล็ก (O2, O3, O4) — ใน HTTP/1.1, O2/O3/O4 ต้องรอ O1 ส่งเสร็จก่อน แต่ใน HTTP/2 object ถูกแบ่งเป็น frame แล้วสลับส่ง ทำให้ O2/O3/O4 (เล็ก) ถูกส่งถึงเร็ว โดย O1 (ใหญ่) ล่าช้าเพียงเล็กน้อยเท่านั้น — คล้ายหลักการ shortest-job-first ที่ลด average delay"}, {"type": "warning", "content": "แม้ HTTP/2 จะแก้ HOL blocking **ระดับ object** ได้ แต่ยังใช้ **TCP connection เดียว** ทำให้การ recovery จาก packet loss ยังคง**หยุด object ทุกตัวพร้อมกัน** (TCP รับประกัน in-order delivery ทั้ง connection) และ vanilla TCP connection ก็ไม่มี security ในตัวด้วย — ทั้งสองปัญหานี้คือที่มาของ **HTTP/3** ซึ่งเพิ่ม security และทำ error/congestion control แยกต่อ object บน **UDP** แทน TCP (รายละเอียดเพิ่มเติมอยู่ใน transport layer)"}]}, {"title": "E-mail: SMTP และ IMAP", "body": "ระบบอีเมลมี 3 องค์ประกอบหลัก: **user agents**, **mail servers**, และ **SMTP (Simple Mail Transfer Protocol)**", "blocks": [{"type": "subheading", "content": "องค์ประกอบของระบบอีเมล"}, {"type": "note", "content": "**User Agent** (aka \"mail reader\") ใช้แต่ง/แก้ไข/อ่านอีเมล (เช่น Outlook, iPhone mail client) — outgoing/incoming message ถูกเก็บไว้ที่ server\n\n**Mail server**: มี **mailbox** เก็บข้อความที่เข้ามาสำหรับ user และ **outgoing message queue** เก็บข้อความที่รอส่งออก — SMTP protocol ทำงานระหว่าง mail server เพื่อส่งอีเมล โดยฝั่งส่งทำตัวเป็น **client**, ฝั่งรับทำตัวเป็น **server**"}, {"type": "subheading", "content": "SMTP (RFC 5321)"}, {"type": "note", "content": "SMTP ใช้ **TCP** เพื่อส่งอีเมลอย่างน่าเชื่อถือจาก client (mail server ที่ริเริ่มเชื่อมต่อ) ไปยัง server (port **25**) — เป็นการส่งแบบ **direct transfer** (sending server ทำตัวเป็น client ติดต่อตรงไปยัง receiving server) มี 3 ระยะ: **handshaking** (ทักทาย), **transfer** (ส่งข้อความ), **closure** (ปิดการเชื่อมต่อ) ใช้รูปแบบ command/response แบบเดียวกับ HTTP (command เป็น ASCII text, response เป็น status code + phrase)"}, {"type": "example", "content": "**ตัวอย่าง SMTP interaction จริง**:\n```\nS: 220 hamburger.edu\nC: HELO crepes.fr\nS: 250 Hello crepes.fr, pleased to meet you\nC: MAIL FROM: <alice@crepes.fr>\nS: 250 alice@crepes.fr... Sender ok\nC: RCPT TO: <bob@hamburger.edu>\nS: 250 bob@hamburger.edu... Recipient ok\nC: DATA\nS: 354 Enter mail, end with \".\" on a line by itself\nC: Do you like ketchup?\nC: How about pickles?\nC: .\nS: 250 Message accepted for delivery\nC: QUIT\nS: 221 hamburger.edu closing connection\n```\n\nขั้นตอนเต็ม: (1) Alice แต่งอีเมลถึง bob@someschool.edu → (2) Alice's UA ส่งไปที่ mail server ของ Alice ผ่าน SMTP → (3) client-side SMTP เปิด TCP connection ไปยัง mail server ของ Bob → (4)-(5) ข้อความถูกส่งและวางไว้ใน mailbox ของ Bob → (6) Bob เปิด user agent เพื่ออ่านข้อความ"}, {"type": "subheading", "content": "เปรียบเทียบ SMTP กับ HTTP"}, {"type": "table", "content": "<table><tr><th>ลักษณะ</th><th>HTTP</th><th>SMTP</th></tr><tr><td>ทิศทาง</td><td>client pull (client ดึงข้อมูลมา)</td><td>client push (client ผลักข้อมูลไป)</td></tr><tr><td>รูปแบบข้อความ</td><td>ASCII command/response, status code (เหมือนกัน)</td><td>ASCII command/response, status code (เหมือนกัน)</td></tr><tr><td>Object encoding</td><td>แต่ละ object อยู่ใน response message ของตัวเอง</td><td>หลาย object ถูกส่งรวมใน multipart message เดียว</td></tr><tr><td>Connection</td><td>persistent/non-persistent</td><td>ใช้ persistent connection เสมอ</td></tr><tr><td>Encoding</td><td>ไม่จำกัด</td><td>ต้องเป็น 7-bit ASCII เท่านั้น, ใช้ CRLF.CRLF บอกจุดจบข้อความ</td></tr></table>"}, {"type": "subheading", "content": "รูปแบบข้อความอีเมล (RFC 2822) และการรับอีเมล"}, {"type": "note", "content": "**RFC 5321** นิยาม protocol การส่งอีเมล (SMTP) ส่วน **RFC 2822** นิยาม syntax ของตัวข้อความอีเมลเอง (คล้ายกับที่ HTML นิยาม syntax ของเว็บเอกสาร) — email message ประกอบด้วย **header lines** (`To:`, `From:`, `Subject:` — ต่างจาก SMTP command `MAIL FROM:`/`RCPT TO:` นะ) แล้วตามด้วยบรรทัดว่าง แล้วจึงเป็น **body** (ตัวข้อความ, ASCII เท่านั้น)\n\n**การรับอีเมล**: SMTP ใช้สำหรับ**ส่ง/จัดเก็บ**อีเมลที่ mail server ของผู้รับเท่านั้น ส่วนการ**ดึง**อีเมลออกมาอ่านต้องใช้ **mail access protocol** แยกต่างหาก:\n- **IMAP (Internet Mail Access Protocol)** [RFC 3501]: เก็บข้อความไว้บน server, รองรับการดึง/ลบ/จัดโฟลเดอร์ของข้อความบน server\n- **HTTP**: บริการเช่น Gmail, Hotmail, Yahoo!Mail ใช้ web interface ครอบทับ SMTP (สำหรับส่ง) และ IMAP/POP (สำหรับดึง)"}, {"type": "diagram", "layout": "lifeline", "title": "การส่งอีเมลด้วย SMTP", "actors": ["Sender Mail Server", "Receiver Mail Server"], "steps": [{"from": 0, "to": 1, "label": "HELO", "note": "แนะนำตัวเริ่มการเชื่อมต่อ"}, {"from": 0, "to": 1, "label": "MAIL FROM: <a@x.com>", "note": "ระบุผู้ส่ง"}, {"from": 0, "to": 1, "label": "RCPT TO: <b@y.com>", "note": "ระบุผู้รับ"}, {"from": 0, "to": 1, "label": "DATA ... เนื้อหาอีเมล ...", "note": "ส่งเนื้อหาข้อความ"}, {"from": 1, "to": 0, "label": "250 OK / QUIT", "note": "ยืนยันรับสำเร็จและปิดการเชื่อมต่อ"}]}]}, {"title": "DNS: Domain Name System", "body": "**DNS** คือฐานข้อมูลแบบกระจาย (distributed database) ที่ implement เป็น hierarchy ของ name server จำนวนมาก ทำหน้าที่แปลงชื่อ host (ที่มนุษย์อ่านได้) ↔ IP address (ที่ใช้ address packet จริง) แม้จะเป็น **core Internet function** แต่ถูก implement เป็น application-layer protocol", "blocks": [{"type": "subheading", "content": "ทำไม DNS ต้อง Distributed ไม่ Centralized?"}, {"type": "note", "content": "ถ้า centralize DNS ไว้ที่เดียว จะเกิดปัญหา: **single point of failure**, **traffic volume** มหาศาล (Comcast DNS server เพียงรายเดียวรับ 600 พันล้าน query/วัน, Akamai รับ 2.2 ล้านล้าน query/วัน), **distant centralized database** (delay สูงสำหรับผู้ใช้ที่อยู่ไกล), และ **maintenance** ยาก — สรุป: centralized DNS **ไม่ scale**"}, {"type": "subheading", "content": "บริการของ DNS"}, {"type": "note", "content": "- **Hostname-to-IP-address translation** (แปลงชื่อเป็น IP)\n- **Host aliasing** (canonical name และ alias name — เช่น `www.ibm.com` จริงๆ คือ `servereast.backup2.ibm.com`)\n- **Mail server aliasing**\n- **Load distribution**: replicated web server หนึ่งชื่อสามารถแมพไป IP address หลายตัวได้"}, {"type": "subheading", "content": "โครงสร้างฐานข้อมูลแบบลำดับชั้นของ DNS"}, {"type": "table", "content": "<table><tr><th>ระดับ</th><th>หน้าที่</th></tr><tr><td>Root DNS servers</td><td>ผู้ติดต่อสุดท้าย (contact-of-last-resort) เมื่อ name server อื่นแปลงชื่อไม่ได้ — มี 13 \"logical\" root server ทั่วโลก แต่ละตัวถูก replicate หลายร้อยชุด (ในสหรัฐฯ อย่างเดียวมีราว 200 server) จัดการโดย ICANN</td></tr><tr><td>TLD (Top-Level Domain) servers</td><td>รับผิดชอบ .com, .org, .net, .edu และ country code เช่น .cn, .uk, .fr — เช่น Network Solutions ดูแล .com/.net, Educause ดูแล .edu</td></tr><tr><td>Authoritative DNS servers</td><td>DNS server ขององค์กรเอง ให้ hostname-to-IP mapping ที่ \"เป็นทางการ\" สำหรับ host ในองค์กรนั้น</td></tr><tr><td>Local DNS server</td><td>ไม่ได้อยู่ใน hierarchy อย่างเป็นทางการ — เป็นของ ISP แต่ละราย ทำ cache และ forward request</td></tr></table>"}, {"type": "subheading", "content": "Iterated Query vs Recursive Query"}, {"type": "note", "content": "**Iterated query**: server ที่ถูกถามจะตอบกลับด้วย \"ฉันไม่รู้จักชื่อนี้ แต่ให้ไปถาม server นี้แทน\" — client เดินทางไปถามทีละ server เอง (root → TLD → authoritative)\n\n**Recursive query**: ภาระการ resolve ชื่อทั้งหมดตกอยู่ที่ server ที่ถูกถาม (server นั้นไปถามต่อให้เอง แล้วส่งคำตอบสุดท้ายกลับมา) — ข้อเสียคือเพิ่มภาระที่ server ระดับบนของ hierarchy มาก\n\n**ตัวอย่าง**: host ที่ engineering.nyu.edu ต้องการ IP ของ gaia.cs.umass.edu — ผ่าน local DNS server (dns.nyu.edu) → root DNS server → TLD DNS server (.edu) → authoritative DNS server (dns.cs.umass.edu) แล้วส่งคำตอบกลับมาตามลำดับ"}, {"type": "subheading", "content": "DNS Caching"}, {"type": "note", "content": "เมื่อ name server ใดๆ (ไม่จำเป็นต้องเป็น authoritative) เรียนรู้ mapping แล้ว จะ **cache** ไว้ และตอบกลับ query ครั้งถัดไปจาก cache ทันที ช่วยลด response time — cache entry จะหมดอายุ (timeout) ตาม **TTL (Time To Live)** ที่กำหนดไว้ TLD server มักถูก cache ไว้ที่ local name server ทำให้ query ข้าม root server ได้บ่อยครั้ง"}, {"type": "warning", "content": "ข้อเสียของ caching: cached entry **อาจ out-of-date** ได้ — ถ้า host เปลี่ยน IP address จะไม่มีใครใน Internet รู้จนกว่า TTL ของทุก cache entry ที่เกี่ยวข้องจะหมดอายุ ดังนั้น DNS จึงให้บริการแบบ **best-effort name-to-address translation** เท่านั้น ไม่ใช่แบบ real-time ที่แม่นยำ 100%"}, {"type": "subheading", "content": "DNS Resource Records (RR)"}, {"type": "table", "content": "<table><tr><th>Type</th><th>name field</th><th>value field</th></tr><tr><td>A</td><td>hostname</td><td>IP address</td></tr><tr><td>CNAME</td><td>alias name</td><td>canonical (real) name</td></tr><tr><td>NS</td><td>domain (เช่น foo.com)</td><td>hostname ของ authoritative name server สำหรับ domain นี้</td></tr><tr><td>MX</td><td>domain</td><td>ชื่อของ SMTP mail server ที่เกี่ยวข้อง</td></tr></table>"}, {"type": "subheading", "content": "ความปลอดภัยของ DNS"}, {"type": "note", "content": "**DDoS attacks**: bombard root server ด้วย traffic จำนวนมาก (ยังไม่เคยสำเร็จ เพราะมี traffic filtering และ local DNS server cache ช่วยข้าม root server ได้) แต่ bombard TLD server อาจอันตรายกว่า\n\n**Spoofing attacks**: ดักจับ DNS query แล้วตอบกลับด้วยข้อมูลปลอม (DNS cache poisoning) — แก้ไขด้วย **DNSSEC** [RFC 4033] ซึ่งให้บริการ authentication"}, {"type": "diagram", "layout": "lifeline", "title": "การค้นหา DNS แบบ Iterative Query", "actors": ["Client", "Local DNS", "Root DNS", "TLD DNS", "Authoritative DNS"], "steps": [{"from": 0, "to": 1, "label": "Query: www.example.com ?", "note": "client ถาม local DNS"}, {"from": 1, "to": 2, "label": "Query ต่อ", "note": "local DNS ไม่รู้ ถาม root"}, {"from": 2, "to": 1, "label": "Referral → ไปถาม .com TLD", "note": "root ชี้ทางไปยัง TLD"}, {"from": 1, "to": 3, "label": "Query ต่อ", "note": "local DNS ถาม TLD"}, {"from": 3, "to": 1, "label": "Referral → ไปถาม Authoritative", "note": "TLD ชี้ทางไปยัง authoritative"}, {"from": 1, "to": 4, "label": "Query ต่อ", "note": "local DNS ถาม authoritative"}, {"from": 4, "to": 1, "label": "Answer: IP Address", "note": "authoritative ตอบ IP กลับมา"}, {"from": 1, "to": 0, "label": "Answer: IP Address", "note": "local DNS ส่งคำตอบกลับ client (และ cache ไว้)"}]}]}, {"title": "P2P Applications: File Distribution และ BitTorrent", "body": "การกระจายไฟล์แบบ P2P มีคุณสมบัติ scaling ที่ต่างจาก client-server อย่างมาก เพราะแต่ละ peer นำทั้ง **upload capacity** เพิ่มเข้ามาในระบบ ไม่ใช่แค่ demand", "blocks": [{"type": "subheading", "content": "เปรียบเทียบเวลากระจายไฟล์: Client-Server vs P2P"}, {"type": "formula", "label": "นิยามตัวแปร", "content": "$F$ = ขนาดไฟล์ (บิต), $N$ = จำนวน peer ที่ต้องการไฟล์, $u_s$ = upload capacity ของ server, $u_i$ = upload capacity ของ peer $i$, $d_i$ = download capacity ของ peer $i$, $d_{min}$ = download capacity ต่ำสุดในกลุ่ม peer"}, {"type": "formula", "label": "Client-Server Distribution Time", "content": "Server ต้อง**ส่งไฟล์ตามลำดับ** (sequentially) ให้ครบ $N$ ชุด: เวลาส่ง 1 ชุด $= F/u_s$, เวลาส่ง $N$ ชุด $= NF/u_s$\n\nClient แต่ละตัวต้อง download ไฟล์ครบ: เวลา download ขั้นต่ำ $= F/d_{min}$\n\n$$D_{c-s} \\geq \\max\\left\\{\\dfrac{NF}{u_s},\\ \\dfrac{F}{d_{min}}\\right\\}$$\n\n**เพิ่มขึ้นเชิงเส้นตาม $N$** — ยิ่งมี peer เยอะ ยิ่งช้าลงเรื่อยๆ ไม่มีขีดจำกัด"}, {"type": "formula", "label": "P2P Distribution Time", "content": "Server อัปโหลดแค่ **1 ชุด**เท่านั้น: เวลา $= F/u_s$\n\nClient (peer) แต่ละตัวต้อง download ไฟล์ครบ: เวลาขั้นต่ำ $= F/d_{min}$\n\nโดยรวมทุก peer ต้อง download $NF$ บิต แต่ upload rate รวมสูงสุด (จำกัด max download rate ได้) คือ $u_s + \\sum u_i$:\n\n$$D_{P2P} \\geq \\max\\left\\{\\dfrac{F}{u_s},\\ \\dfrac{F}{d_{min}},\\ \\dfrac{NF}{u_s + \\sum u_i}\\right\\}$$\n\nพจน์ที่ 3 ก็เพิ่มตาม $N$ เช่นกัน **แต่ตัวส่วน ($u_s + \\sum u_i$) ก็เพิ่มตาม $N$ ด้วย** เพราะ peer แต่ละตัวนำ upload capacity เข้ามาเพิ่ม — ทำให้ P2P **scale ได้ดีกว่า** client-server มาก"}, {"type": "example", "content": "**ตัวอย่างเปรียบเทียบ**: กำหนด client upload rate $= u$, $F/u = 1$ ชั่วโมง, $u_s = 10u$ (server เร็วกว่า client 10 เท่า), $d_{min} \\geq u_s$\n\n- **Client-server**: เวลาเพิ่มขึ้นตาม $N$ อย่างไม่มีขีดจำกัด — เมื่อ $N$ มากพอ เวลาจะเข้าใกล้ $NF/u_s = N/10$ ชั่วโมง ยิ่ง $N$ มาก ยิ่งช้ามาก\n- **P2P**: เวลาสูงสุดที่ $\\max\\{1, N/(10+N)\\}$ ชั่วโมง — เมื่อ $N$ เพิ่มขึ้น ระบบยังคง**เกือบเสถียร**ที่ประมาณ 1 ชั่วโมง เพราะ peer ใหม่แต่ละตัวนำ upload capacity เข้ามาชดเชย demand ที่เพิ่มขึ้น"}, {"type": "subheading", "content": "กลไกของ BitTorrent"}, {"type": "note", "content": "ไฟล์ถูกแบ่งเป็น **chunk ขนาด 256 Kb** — peer ที่เข้าร่วม **torrent** (กลุ่ม peer ที่แลกเปลี่ยน chunk ของไฟล์เดียวกัน) จะแลกเปลี่ยน chunk กัน โดยมี **tracker** คอยติดตามว่าใครอยู่ใน torrent บ้าง\n\nเมื่อ peer ใหม่ (เช่น Alice) เข้าร่วม: (1) ยังไม่มี chunk ใดๆ (2) ลงทะเบียนกับ tracker เพื่อขอรายชื่อ peer แล้วเชื่อมต่อกับ subset ของ peer (\"neighbors\") (3) ระหว่าง download ก็ upload chunk ให้ peer อื่นไปด้วย (4) peer อาจเปลี่ยนคู่แลกเปลี่ยนไปเรื่อยๆ (churn — peer เข้า-ออกได้ตลอด) (5) เมื่อได้ไฟล์ครบแล้ว peer อาจออกจาก torrent ทันที (selfish) หรืออยู่ต่อเพื่อช่วย seed (altruistic)"}, {"type": "subheading", "content": "Tit-for-Tat: กลไกจูงใจของ BitTorrent"}, {"type": "note", "content": "**การส่ง chunk (Sending)**: Alice จะส่ง chunk ให้กับ 4 peer ที่กำลังส่ง chunk ให้เธอด้วย**อัตราสูงสุด**เท่านั้น (peer อื่นถูก \"choke\" ไม่ได้รับ chunk จาก Alice) — ประเมินใหม่ทุก 10 วินาที นอกจากนี้ทุก 30 วินาที Alice จะสุ่มเลือก peer อื่นมา **\"optimistically unchoke\"** (ลองส่งให้ดูเผื่อเป็นคู่ที่ดีกว่า) ซึ่ง peer ที่ถูกเลือกใหม่อาจได้เข้า top-4 ในภายหลัง\n\n**การขอ chunk (Requesting)**: Alice จะถาม peer แต่ละตัวว่ามี chunk อะไรบ้าง แล้วขอ chunk ที่**หายากที่สุดก่อน** (rarest first) เพื่อให้ chunk กระจายอยู่ทั่วเครือข่ายอย่างสมดุล"}, {"type": "warning", "content": "หลักการ **tit-for-tat** สร้างแรงจูงใจ: peer ที่มี **upload rate สูง** จะหาคู่แลกเปลี่ยนที่ดีกว่าได้ และได้รับไฟล์เร็วกว่า — ทำให้ peer มีแรงจูงใจที่จะ upload (ไม่ใช่แค่ download แบบเอาเปรียบ หรือ \"free-ride\")"}, {"type": "diagram", "layout": "lifeline", "title": "การขอไฟล์แบบ P2P (BitTorrent)", "actors": ["Peer\n(ผู้ขอ)", "Tracker", "Peer อื่นๆ\n(ผู้มีไฟล์)"], "steps": [{"from": 0, "to": 1, "label": "ขอรายชื่อ Peer", "note": "peer ติดต่อ tracker"}, {"from": 1, "to": 0, "label": "ส่งรายชื่อ Peer กลับ", "note": "tracker ตอบ list of peers"}, {"from": 0, "to": 2, "label": "ขอ Piece ของไฟล์", "note": "request chunk จาก peer อื่น"}, {"from": 2, "to": 0, "label": "ส่ง Piece กลับมา", "note": "แลกเปลี่ยนชิ้นไฟล์ (Tit-for-Tat)"}]}]}, {"title": "Video Streaming และ Content Distribution Networks (CDN)", "body": "Video streaming traffic (Netflix, YouTube, Amazon Prime) กินสัดส่วนราว **80% ของ residential ISP traffic** (ข้อมูลปี 2020) ความท้าทายหลักคือ **scale** (เข้าถึงผู้ใช้ราวพันล้านคน) และ **heterogeneity** (ผู้ใช้แต่ละคนมี capability ต่างกัน เช่น wired vs mobile) — แก้ด้วย **distributed, application-level infrastructure**", "blocks": [{"type": "subheading", "content": "การเข้ารหัสวิดีโอ (Video Coding)"}, {"type": "note", "content": "วิดีโอคือลำดับภาพที่แสดงด้วยอัตราคงที่ (เช่น 24 ภาพ/วินาที) การเข้ารหัสใช้ความซ้ำซ้อน (redundancy) เพื่อลดจำนวนบิต:\n\n- **Spatial coding** (ภายในภาพเดียว): เช่น แทนที่จะส่งค่าสีเดียวกัน $N$ ครั้ง ส่งแค่ค่าสี + จำนวนซ้ำ (run-length)\n- **Temporal coding** (ระหว่างภาพต่อเนื่อง): ส่งเฉพาะ**ส่วนต่าง**จาก frame ก่อนหน้า แทนที่จะส่ง frame เต็มทุกครั้ง\n\n**CBR (Constant Bit Rate)**: อัตราการเข้ารหัสคงที่ | **VBR (Variable Bit Rate)**: อัตราเปลี่ยนตามปริมาณ spatial/temporal coding ที่ใช้ในแต่ละช่วง — ตัวอย่างมาตรฐาน: MPEG1 (CD-ROM) 1.5 Mbps, MPEG2 (DVD) 3–6 Mbps, MPEG4 (ใช้บน Internet ทั่วไป) 64Kbps–12Mbps"}, {"type": "subheading", "content": "Streaming Stored Video: ความท้าทายและ Playout Buffering"}, {"type": "note", "content": "ความท้าทายหลัก: bandwidth ระหว่าง server-client **แปรผัน**ตามระดับ congestion ของเครือข่าย ณ เวลานั้น, packet loss/delay จาก congestion ทำให้ playout ช้าลงหรือคุณภาพวิดีโอแย่ลง\n\n**Continuous playout constraint**: การเล่นวิดีโอที่ client ต้อง**ตรงกับ timing ต้นฉบับ** แต่เนื่องจาก network delay **แปรผัน (jitter)** จึงต้องมี **client-side buffer** เพื่อชดเชย — client จะเริ่มเล่นวิดีโอหลังจากสะสม chunk ไว้ในบัฟเฟอร์จำนวนหนึ่งก่อน (playout delay) ความท้าทายอื่นๆ ได้แก่ client interactivity (pause, fast-forward, rewind) และการ retransmit packet ที่สูญหาย"}, {"type": "subheading", "content": "DASH: Dynamic, Adaptive Streaming over HTTP"}, {"type": "note", "content": "**ฝั่ง Server**:\n- แบ่งไฟล์วิดีโอเป็นหลาย **chunk**\n- แต่ละ chunk ถูก encode ที่**หลายอัตราบิตต่างกัน** (multiple rates) เก็บเป็นไฟล์แยกกัน\n- ไฟล์เหล่านี้ถูก replicate ไปยัง CDN node ต่างๆ\n- **manifest file** ให้ URL สำหรับแต่ละ chunk ที่แต่ละอัตรา\n\n**ฝั่ง Client** (\"intelligence\" อยู่ที่ client):\n- ประเมิน bandwidth ระหว่าง server-client เป็นระยะๆ\n- ดู manifest แล้วขอ chunk ทีละชิ้น โดยเลือก**อัตราการเข้ารหัสสูงสุดที่ bandwidth ปัจจุบันรองรับได้**\n- เลือกอัตราต่างกันได้ในแต่ละช่วงเวลา (ตาม bandwidth ที่มี) และเลือก server ต่างกันได้ด้วย (server ที่ \"ใกล้\" หรือมี bandwidth สูงกว่า)\n\nสรุป: **Streaming video = Encoding + DASH + Playout Buffering**"}, {"type": "subheading", "content": "Content Distribution Networks (CDN)"}, {"type": "note", "content": "ปัญหา: จะ stream content (จากวิดีโอนับล้านคลิป) ให้ผู้ใช้พร้อมกันนับแสนคนได้อย่างไร?\n\n**Option 1 — Single mega-server**: มีปัญหา single point of failure, จุด congestion, และ path ที่ยาว/แออัดไปยัง client ที่อยู่ไกล → **ไม่ scale**\n\n**Option 2 — CDN (เก็บสำเนาไว้หลายจุดทั่วโลก)**:\n- **Enter deep**: ฝัง CDN server เข้าไปลึกใน access network ต่างๆ ให้ใกล้ผู้ใช้ที่สุด (ตัวอย่าง Akamai: 240,000 servers ใน 120+ ประเทศ ปี 2015)\n- **Bring home**: ใช้ cluster ขนาดใหญ่จำนวนน้อยกว่า (หลักสิบ) วางไว้ที่ POP (Point of Presence) ใกล้ access network (ตัวอย่าง Limelight)"}, {"type": "image", "src": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wAARCAGYAyADASIAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAUGAwQHAgEI/8QATxAAAQQCAAQEBAMFBAUICQQDAQACAwQFEQYSITETQVFhFCJxgQcykRUjQlKhM2KxwRYkNHLRF0NTVIKSk9IlJlV0lLLC4fA2ZIOzotPx/8QAGgEBAAMBAQEAAAAAAAAAAAAAAAIDBAEFBv/EADMRAAICAQQBAgQFAwQDAQAAAAABAgMRBBIhMRNBUSIyYfAFcYGRsaHB0RQjQuEVJFLx/9oADAMBAAIRAxEAPwD9IoiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIgCIiAIiIAiIg ่อดึง content ในอัตราสูงสุดที่รองรับได้ (4) อาจเปลี่ยนอัตรา/สำเนาที่ใช้ได้ถ้า network path มีการ congest"}]}, {"title": "Socket Programming: TCP และ UDP", "body": "หัวข้อนี้สอนการเขียนโปรแกรม client/server ที่สื่อสารผ่าน socket ด้วยภาษา Python ครอบคลุมทั้ง UDP socket และ TCP socket", "blocks": [{"type": "subheading", "content": "Socket Programming กับ UDP"}, {"type": "note", "content": "UDP **ไม่มี \"connection\"** ระหว่าง client-server: ไม่มี handshaking ก่อนส่งข้อมูล — ฝั่งส่งต้องแนบ IP ปลายทางและ port number ไปกับทุก packet เอง ฝั่งรับก็ดึง IP/port ของผู้ส่งออกมาจาก packet ที่ได้รับ ข้อมูลที่ส่งอาจ**สูญหายหรือมาไม่เรียงลำดับ**ได้ — จากมุมมองแอปพลิเคชัน UDP ให้บริการส่ง \"datagram\" (กลุ่มไบต์) แบบ **unreliable** ระหว่าง client-server process"}, {"type": "example", "content": "**Python UDP Client**:\n```python\nfrom socket import *\nserverName = 'hostname'\nserverPort = 12000\nclientSocket = socket(AF_INET, SOCK_DGRAM)\nmessage = input('Input lowercase sentence:')\nclientSocket.sendto(message.encode(), (serverName, serverPort))\nmodifiedMessage, serverAddress = clientSocket.recvfrom(2048)\nprint(modifiedMessage.decode())\nclientSocket.close()\n```\n\n**Python UDP Server**:\n```python\nfrom socket import *\nserverPort = 12000\nserverSocket = socket(AF_INET, SOCK_DGRAM)\nserverSocket.bind(('', serverPort))\nprint('The server is ready to receive')\nwhile True:\n    message, clientAddress = serverSocket.recvfrom(2048)\n    modifiedMessage = message.decode().upper()\n    serverSocket.sendto(modifiedMessage.encode(), clientAddress)\n```\n\nตัวอย่างนี้: client รับข้อความจาก keyboard ส่งไปยัง server ผ่าน UDP, server แปลงข้อความเป็นตัวพิมพ์ใหญ่ทั้งหมดแล้วส่งกลับ, client แสดงผลลัพธ์"}, {"type": "subheading", "content": "Socket Programming กับ TCP"}, {"type": "note", "content": "เมื่อ client ติดต่อมา server TCP จะสร้าง **socket ใหม่** สำหรับคุยกับ client รายนั้นโดยเฉพาะ (แยกจาก welcoming socket) ทำให้ server คุยกับหลาย client พร้อมกันได้ โดยแยกแยะ client ด้วย source port # และ IP address\n\nขั้นตอน: server ต้องรันอยู่ก่อนและสร้าง **welcoming socket** ไว้ก่อน → client สร้าง TCP socket ระบุ IP/port ของ server → เมื่อ client สร้าง socket, TCP ฝั่ง client จะเริ่ม **establish connection** กับ TCP ฝั่ง server ทันที — จากมุมมองแอปพลิเคชัน TCP ให้บริการ **reliable, in-order byte-stream transfer** (\"pipe\") ระหว่าง client-server process"}, {"type": "example", "content": "**Python TCP Client**:\n```python\nfrom socket import *\nserverName = 'servername'\nserverPort = 12000\nclientSocket = socket(AF_INET, SOCK_STREAM)\nclientSocket.connect((serverName, serverPort))\nsentence = input('Input lowercase sentence:')\nclientSocket.send(sentence.encode())\nmodifiedSentence = clientSocket.recv(1024)\nprint('From Server:', modifiedSentence.decode())\nclientSocket.close()\n```\n\n**Python TCP Server**:\n```python\nfrom socket import *\nserverPort = 12000\nserverSocket = socket(AF_INET, SOCK_STREAM)\nserverSocket.bind(('', serverPort))\nserverSocket.listen(1)\nprint('The server is ready to receive')\nwhile True:\n    connectionSocket, addr = serverSocket.accept()\n    sentence = connectionSocket.recv(1024).decode()\n    capitalizedSentence = sentence.upper()\n    connectionSocket.send(capitalizedSentence.encode())\n    connectionSocket.close()\n```"}, {"type": "warning", "content": "ข้อแตกต่างสำคัญระหว่าง UDP กับ TCP socket: UDP client/server ใช้ `sendto()`/`recvfrom()` และต้องระบุ address ทุกครั้ง เพราะไม่มี \"connection\" ส่วน TCP client ใช้ `connect()` ครั้งเดียวตอนต้น แล้วใช้ `send()`/`recv()` ธรรมดาได้เลยโดยไม่ต้องระบุ address ซ้ำอีก และฝั่ง TCP server ต้อง `listen()` และ `accept()` ก่อนจึงจะได้ socket สำหรับคุยกับ client แต่ละราย"}, {"type": "subheading", "content": "การจัดการ Timeout ด้วย try-except"}, {"type": "note", "content": "บางครั้งโปรแกรมต้องรอ event หลายอย่างพร้อมกัน เช่น รอ reply จาก socket หรือรอ timeout — Python ใช้ `socket.settimeout(N)` เพื่อตั้งเวลารอสูงสุด (วินาที) กับทุก operation ในอนาคตของ socket นั้น ถ้าไม่มี packet มาถึงภายในเวลาที่กำหนด จะ **raise timeout exception** ซึ่งจับได้ด้วย `try/except`\n\n```python\ntry:\n    <do something, e.g. connectionSocket.recv(1024)>\nexcept timeout:\n    <handle the exception, e.g. increment counter>\n```\n\nการยกเลิก timeout: ใช้ `settimeout(None)` (กลับเป็นค่า default รอไม่จำกัด) ส่วน `settimeout(0)` จะเปลี่ยน socket เป็น **non-blocking mode** แทน (คนละความหมายกัน)"}, {"type": "example", "content": "**ตัวอย่างสมมติ (\"เด็กเลี้ยงแกะ\")**: เด็กเลี้ยงแกะเชื่อมต่อ TCP socket ไปยัง server ของชาวบ้านเพื่อแจ้งตำแหน่งหมาป่าเมื่อพบเห็น หากเด็กเชื่อมต่อแล้วไม่ส่งข้อความภายใน 10 วินาที ติดต่อกัน 3 ครั้ง ชาวบ้านจะเลิกฟังเขาตลอดไป — จำลองด้วย `connectionSocket.settimeout(10)` แล้วครอบ `recv()` ด้วย `try/except timeout:` เพื่อนับจำนวนครั้งที่ timeout เกิดขึ้น เมื่อครบ 3 ครั้ง (`counter == 3`) loop จะหยุดทำงาน (server เลิกรับฟัง)"}, {"type": "image", "src": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wAARCAIAAgADASIAAhEBAxEB/8QAHQABAAIDAQEBAQAAAAAAAAAAAAcIBAUGAwIBCf/EAFMQAAEDAwEEBgQJBwgJAgcAAAABAgMEBREGBxIhMQhBUWFxgRMikbEUMjdCUnJ0ocEjMzVic4KyFTQ2kqKztMIWJFNjddHS4fAlRENWZIOVo8P/xAAZAQEAAwEBAAAAAAAAAAAAAAAAAQMEAgX/xAAmEQEBAAIBBAICAwEBAQAAAAAAAQIRAxIhMTIEQRNRIjNxYRSB/9oADAMBAAIRAxEAPwCtoAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAbeh0jqS6UTKy36eutZSyZ3JoKOSRjsKqLhyJhcKip5AagG/8A9AtYf/Kl8/8Ax8v/AEmlqqWooqqSmqoJaeoicrZIpWKx7FTmiovFFA8gAAAAAAAAAAAAAAAAAAAAAAAAekNPNUyJHBE+V68msarl9iGc7Tl7azfdZrgjfpLTPx7gNaD9ex0b1Y9qtcnNFTCofgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA function renderTOC(){
  const toc = document.getElementById("tocList");
  toc.innerHTML = "";
  SECTIONS.forEach((sec, idx)=>{
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = "#section_"+idx;
    a.textContent = sec.title;
    a.dataset.idx = idx;
    li.appendChild(a);
    toc.appendChild(li);
  });
}

function escapeXml(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function fmtTspans(text, x){
  return String(text==null?"":text).split("\n").map(function(line,i){
    return '<tspan x="'+x+'" dy="'+(i===0?0:15)+'">'+escapeXml(line)+'</tspan>';
  }).join("");
}

function renderDiagramBlock(block, secIdx, blockIdx){
  const uid = "dg_"+secIdx+"_"+blockIdx;
  const layout = block.layout || "lifeline";
  const actors = block.actors || [];
  const steps = block.steps || [];
  const n = actors.length;
  const W = 680;
  const margin = 76;
  const nodesX = [];
  for(let i=0;i<n;i++){ nodesX.push(n===1 ? W/2 : margin + i*((W-2*margin)/Math.max(1,n-1))); }
  let inner = "";
  let H = 0;

  if(layout === "flow"){
    const boxY = 50, boxH = 46;
    const boxW = Math.min(128, Math.max(70,(W-2*margin)/Math.max(1,n-1)-14));
    H = 168;
    actors.forEach(function(a,i){
      inner += '<rect class="diagram-node-box" x="'+(nodesX[i]-boxW/2)+'" y="'+boxY+'" width="'+boxW+'" height="'+boxH+'" rx="7"></rect>';
      inner += '<text class="diagram-actor-label" x="'+nodesX[i]+'" y="'+(boxY+boxH/2-6)+'" text-anchor="middle">'+fmtTspans(a, nodesX[i])+'</text>';
    });
    steps.forEach(function(st,i){
      const x1 = nodesX[st.from]+boxW/2+3, x2 = nodesX[st.to]-boxW/2-3;
      const y = boxY+boxH/2;
      const pid = uid+"_p"+i, mid = uid+"_m"+i;
      inner += '<path id="'+pid+'" class="diagram-arrow-path" d="M '+x1+' '+y+' L '+x2+' '+y+'"></path>';
      inner += '<text class="diagram-arrow-label" x="'+((x1+x2)/2)+'" y="'+(boxY-12)+'" text-anchor="middle">'+escapeXml(st.label||"")+'</text>';
      inner += '<circle id="'+mid+'d" class="diagram-glow-dot" r="6.5" cx="'+x1+'" cy="'+y+'">'
             + '<animateMotion id="'+mid+'" begin="indefinite" dur="0.75s" fill="freeze" path="M '+x1+' '+y+' L '+x2+' '+y+'"></animateMotion>'
             + '<animate attributeName="opacity" begin="'+mid+'.begin" dur="0.05s" from="0" to="1" fill="freeze"></animate>'
             + '<animate attributeName="opacity" begin="'+mid+'.end" dur="0.5s" from="1" to="0" fill="freeze"></animate>'
             + '</circle>';
    });
  } else {
    const rowH = 64, topY = 12, boxH = 38;
    H = topY + boxH + steps.length*rowH + 26;
    const boxW = Math.min(160, Math.max(80,(W-2*margin)/Math.max(1,n-1)-10));
    actors.forEach(function(a,i){
      inner += '<rect class="diagram-node-box" x="'+(nodesX[i]-boxW/2)+'" y="'+topY+'" width="'+boxW+'" height="'+boxH+'" rx="7"></rect>';
      inner += '<text class="diagram-actor-label" x="'+nodesX[i]+'" y="'+(topY+boxH/2-6)+'" text-anchor="middle">'+fmtTspans(a, nodesX[i])+'</text>';
      inner += '<line class="diagram-lifeline" x1="'+nodesX[i]+'" y1="'+(topY+boxH)+'" x2="'+nodesX[i]+'" y2="'+(H-8)+'"></line>';
    });
    steps.forEach(function(st,i){
      const y = topY+boxH+22 + i*rowH;
      const x1 = nodesX[st.from], x2 = nodesX[st.to];
      const pid = uid+"_p"+i, mid = uid+"_m"+i;
      inner += '<path id="'+pid+'" class="diagram-arrow-path" d="M '+x1+' '+y+' L '+x2+' '+y+'"></path>';
      inner += '<text class="diagram-arrow-label" x="'+((x1+x2)/2)+'" y="'+(y-9)+'" text-anchor="middle">'+escapeXml(st.label||"")+'</text>';
      inner += '<circle id="'+mid+'d" class="diagram-glow-dot" r="6.5" cx="'+x1+'" cy="'+y+'">'
             + '<animateMotion id="'+mid+'" begin="indefinite" dur="0.75s" fill="freeze" path="M '+x1+' '+y+' L '+x2+' '+y+'"></animateMotion>'
             + '<animate attributeName="opacity" begin="'+mid+'.begin" dur="0.05s" from="0" to="1" fill="freeze"></animate>'
             + '<animate attributeName="opacity" begin="'+mid+'.end" dur="0.5s" from="1" to="0" fill="freeze"></animate>'
             + '</circle>';
    });
  }

  const svg = '<svg class="diagram-svg" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" preserveAspectRatio="xMidYMid meet">'+inner+'</svg>';

  let stepsHtml = '<ol class="diagram-steps-list">';
  steps.forEach(function(st,i){
    stepsHtml += '<li><span class="step-num">'+(i+1)+'</span><strong>'+escapeXml(st.label||"")+'</strong>'+(st.note?(' — '+escapeXml(st.note)):'')+'</li>';
  });
  stepsHtml += '</ol>';

  return '<div class="diagram-block" id="'+uid+'">'
       + '<h4><span>🔀 '+escapeXml(block.title||"")+'</span><button class="diagram-play-btn" data-diagram-id="'+uid+'">&#9654; เล่นแอนิเมชัน / Play animation</button></h4>'
       + '<div class="diagram-svg-wrap">'+svg+'</div>'
       + stepsHtml
       + '</div>';
}

function diagramPlay(containerId){
  const wrap = document.getElementById(containerId);
  if(!wrap) return;
  const svg = wrap.querySelector('svg');
  const paths = svg.querySelectorAll('.diagram-arrow-path');
  const dots = svg.querySelectorAll('.diagram-glow-dot');
  const items = wrap.querySelectorAll('.diagram-steps-list li');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  items.forEach(function(li){ li.classList.remove('step-active'); });
  if(reduced){ return; }
  const stepDur = 850;
  paths.forEach(function(p){
    const len = p.getTotalLength();
    p.style.transition = 'none';
    p.style.strokeDasharray = len;
    p.style.strokeDashoffset = len;
  });
  void svg.getBoundingClientRect();
  paths.forEach(function(p,i){
    setTimeout(function(){
      p.style.transition = 'stroke-dashoffset '+(stepDur-100)+'ms ease';
      p.style.strokeDashoffset = 0;
      const anim = dots[i] ? dots[i].querySelector('animateMotion') : null;
      if(anim){ try{ anim.beginElement(); }catch(e){} }
      if(items[i]) items[i].classList.add('step-active');
    }, i*stepDur);
  });
}

function wireDiagramButtons(){
  document.querySelectorAll('.diagram-play-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ diagramPlay(btn.dataset.diagramId); });
  });
}

function renderContent(){
  const main = document.getElementById("mainArea");
  main.innerHTML = "";
  SECTIONS.forEach((sec, idx)=>{
    const card = document.createElement("div");
    card.className = "section-card";
    card.id = "section_"+idx;
    let html = "<h2>"+sec.title+"</h2>";
    if(sec.body){
      html += '<div class="body-text">'+sec.body+'</div>';
    }
    (sec.blocks || []).forEach((block, bi)=>{
      if(block.type === "note"){
        html += '<div class="callout callout-note"><span class="callout-title">หมายเหตุ / Note</span>'+escapeXml(block.content)+'</div>';
      } else if(block.type === "example"){
        html += '<div class="callout callout-example"><span class="callout-title">ตัวอย่าง / Example</span>'+escapeXml(block.content)+'</div>';
      } else if(block.type === "warning"){
        html += '<div class="callout callout-warning"><span class="callout-title">ข้อควรระวัง / Warning</span>'+escapeXml(block.content)+'</div>';
      } else if(block.type === "formula"){
        html += '<div class="callout callout-formula"><span class="callout-title">'+(block.label || "สูตร / Formula")+'</span>'+escapeXml(block.content)+'</div>';
      } else if(block.type === "subheading"){
        html += '<h3>'+block.content+'</h3>';
      } else if(block.type === "table"){
        html += block.content;
      } else if(block.type === "image"){
        html += '<div class="image-block"><img src="'+block.src+'" alt="'+(block.alt || "")+'" loading="lazy">';
        if(block.caption){
          html += '<div class="image-caption">'+block.caption+'</div>';
        }
        html += '</div>';
      } else if(block.type === "diagram"){
        html += renderDiagramBlock(block, idx, bi);
      }
    });
    card.innerHTML = html;
    main.appendChild(card);
  });

  if(window.renderMathInElement){
    renderMathInElement(main, {
      delimiters: [
        {left: "$$", right: "$$", display: true},
        {left: "$", right: "$", display: false}
      ]
    });
  }
}

function setupScrollSpy(){
  const links = document.querySelectorAll(".toc-list a");
  const sections = document.querySelectorAll(".section-card");
  window.addEventListener("scroll", ()=>{
    let currentIdx = 0;
    sections.forEach((sec, idx)=>{
      const rect = sec.getBoundingClientRect();
      if(rect.top <= 100) currentIdx = idx;
    });
    links.forEach(l=>l.classList.remove("active"));
    if(links[currentIdx]) links[currentIdx].classList.add("active");
  });
}

function setupReveal(){
  const cards = document.querySelectorAll('.section-card');
  if(!('IntersectionObserver' in window)){
    cards.forEach(function(c){ c.classList.add('revealed'); });
    return;
  }
  const io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){ e.target.classList.add('revealed'); io.unobserve(e.target); }
    });
  }, {threshold:0.08, rootMargin:'0px 0px -60px 0px'});
  cards.forEach(function(c){ io.observe(c); });
}

let fontScale = parseFloat(localStorage.getItem('netbook_fontScale')||'1');
function setFontScale(v){
  fontScale = Math.min(1.3, Math.max(0.85, Math.round(v*10)/10));
  try{ localStorage.setItem('netbook_fontScale', fontScale); }catch(e){}
  document.documentElement.style.setProperty('--fontScale', fontScale);
}

function updateProgress(){
  const el = document.documentElement;
  const max = el.scrollHeight - el.clientHeight;
  const pct = max>0 ? (el.scrollTop/max*100) : 0;
  const bar = document.getElementById('readProgress');
  if(bar) bar.style.width = pct+'%';
  const btt = document.getElementById('backToTop');
  if(btt){ if(el.scrollTop>420){ btt.classList.add('show'); } else { btt.classList.remove('show'); } }
}

renderTOC();
renderContent();
setupScrollSpy();
setupReveal();
wireDiagramButtons();
setFontScale(fontScale);

window.addEventListener('scroll', updateProgress);
const backToTopBtn = document.getElementById('backToTop');
if(backToTopBtn){ backToTopBtn.addEventListener('click', function(){ window.scrollTo({top:0,behavior:'smooth'}); }); }
const fontMinusBtn = document.getElementById('fontMinus');
if(fontMinusBtn){ fontMinusBtn.addEventListener('click', function(){ setFontScale(fontScale-0.1); }); }
const fontPlusBtn = document.getElementById('fontPlus');
if(fontPlusBtn){ fontPlusBtn.addEventListener('click', function(){ setFontScale(fontScale+0.1); }); }

</script>
</body>
</html>
