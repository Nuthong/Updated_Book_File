<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Chapter 6: The Link Layer and LANs</title>

<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>

:root{
  color-scheme: light;
  --paper:#F6F4EE;
  --bg:#F6F4EE;
  --panel:#FFFFFF;
  --border:#DCD6C7;
  --text:#2A2A26;
  --text-soft:#6B6558;
  --navy:#1B3A5C;
  --navy-deep:#0F2740;
  --accent:#1B3A5C;
  --accent2:#2B6CB0;
  --accent-soft:#EAF1FA;
  --correct:#256D46;
  --correct-soft:#E7F3EB;
  --incorrect:#B3341F;
  --incorrect-soft:#FBEAE6;
  --flag:#B7862C;
  --flag-soft:#FBF1DA;
  --unanswered:#9A9486;
  --fontScale:1;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:'Sarabun',"Segoe UI",sans-serif;
  background:var(--paper);
  color:var(--text);
}
header{
  background:var(--navy-deep);
  border-bottom:4px solid var(--flag);
  box-shadow:0 2px 10px rgba(15,39,64,0.25);
  padding:16px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  position:sticky;
  top:0;
  z-index:10;
}
header h1{
  font-size:18px;
  margin:0;
  color:#F2EFE6;
  font-weight:700;
}
header .subtitle{
  font-size:12.5px;
  color:#C9C2AE;
  margin-top:2px;
}
.header-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.layout{
  display:flex;
  max-width:1200px;
  margin:0 auto;
  gap:20px;
  padding:20px;
}
.sidebar{width:250px;flex-shrink:0;}
.sidebar-panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:6px;
  padding:16px;
  position:sticky;
  top:80px;
  box-shadow:0 2px 8px rgba(15,39,64,0.06);
  max-height:calc(100vh - 100px);
  overflow-y:auto;
}
.sidebar-panel h3{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--text-soft);
  margin:0 0 10px 0;
  font-weight:600;
}
.toc-list{list-style:none;margin:0;padding:0;}
.toc-list li{margin-bottom:2px;}
.toc-list a{
  display:block;
  padding:7px 10px;
  border-radius:4px;
  color:var(--text);
  text-decoration:none;
  font-size:13px;
  border-left:3px solid transparent;
}
.toc-list a:hover{background:var(--accent-soft);color:var(--accent2);}
.toc-list a.active{background:var(--accent-soft);color:var(--navy);border-left:3px solid var(--navy);font-weight:600;}
main{flex:1;min-width:0;}
.section-card{
  background:var(--panel);
  border:1px solid var(--border);
  border-left:4px solid var(--navy);
  border-radius:6px;
  padding:24px;
  margin-bottom:18px;
  box-shadow:0 2px 10px rgba(15,39,64,0.06);
  scroll-margin-top:80px;
}
.section-card h2{
  margin:0 0 14px 0;
  font-size:18px;
  color:var(--navy-deep);
  padding-bottom:10px;
  border-bottom:2px solid var(--border);
}
.section-card h3{
  font-size:15px;
  color:var(--navy);
  margin:20px 0 10px 0;
}
.section-card .body-text{
  font-size:14.5px;
  line-height:1.9;
  white-space:pre-wrap;
}
.callout{
  margin:16px 0;
  padding:14px 16px;
  border-radius:6px;
  border-left:4px solid;
  font-size:14px;
  line-height:1.8;
}
.callout-note{background:var(--accent-soft);border-color:var(--accent2);}
.callout-example{background:#F4F2E8;border-color:var(--flag);}
.callout-warning{background:var(--incorrect-soft);border-color:var(--incorrect);}
.callout-formula{
  background:var(--navy-deep);
  color:#EAF1FA;
  border-color:var(--flag);
  font-family:'JetBrains Mono',monospace;
  overflow-x:auto;
}
.callout-title{
  font-weight:700;
  font-size:12.5px;
  text-transform:uppercase;
  letter-spacing:.04em;
  margin-bottom:8px;
  display:block;
}
.callout-note .callout-title{color:var(--accent2);}
.callout-example .callout-title{color:var(--flag);}
.callout-warning .callout-title{color:var(--incorrect);}
.callout-formula .callout-title{color:#C9DCF0;}
.image-block{
  margin:18px 0;
  text-align:center;
}
.image-block img{
  max-width:100%;
  height:auto;
  border-radius:6px;
  border:1px solid var(--border);
  box-shadow:0 2px 10px rgba(15,39,64,0.08);
}
.image-block .image-caption{
  font-size:12.5px;
  color:var(--text-soft);
  margin-top:8px;
  font-style:italic;
}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:13.5px;}
table th{background:var(--navy-deep);color:#F2EFE6;padding:9px 12px;text-align:left;}
table td{padding:8px 12px;border-bottom:1px solid var(--border);}
table tr:nth-child(even) td{background:#F4F2E8;}
@media (max-width:800px){
  .layout{flex-direction:column;}
  .sidebar{width:100%;}
  .sidebar-panel{position:static;max-height:none;}
}

</style>
<style>

/* ===== Readability & diagram enhancements ===== */
#readProgress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--flag),var(--accent2));width:0%;z-index:999;transition:width .12s ease;}

#backToTop{
  position:fixed;bottom:24px;right:24px;width:44px;height:44px;border-radius:50%;
  background:var(--navy-deep);color:#F2EFE6;border:none;cursor:pointer;font-size:18px;
  box-shadow:0 4px 14px rgba(15,39,64,0.3);display:none;align-items:center;justify-content:center;
  z-index:998;opacity:0;transition:opacity .2s ease, transform .2s ease;
}
#backToTop:hover{transform:translateY(-2px);}
#backToTop.show{display:flex;opacity:1;}

#fontCtrl{display:flex;gap:6px;align-items:center;}
#fontCtrl button{
  border:1.5px solid rgba(242,239,230,0.5);background:rgba(255,255,255,0.9);color:var(--navy);
  width:32px;height:32px;border-radius:4px;font-size:13px;cursor:pointer;font-weight:700;
  font-family:'Sarabun',sans-serif;
}
#fontCtrl button:hover{background:#fff;}

.section-card{opacity:0;transform:translateY(14px);transition:opacity .55s ease, transform .55s ease;}
.section-card.revealed{opacity:1;transform:translateY(0);}
@media (prefers-reduced-motion: reduce){
  .section-card{opacity:1;transform:none;transition:none;}
}

.section-card .body-text{font-size:calc(14.5px * var(--fontScale)) !important;}
.section-card h2{font-size:calc(18px * var(--fontScale)) !important;}
.section-card h3{font-size:calc(15px * var(--fontScale)) !important;}
.callout{font-size:calc(14px * var(--fontScale)) !important;}
table{font-size:calc(13.5px * var(--fontScale)) !important;}

.callout-note .callout-title::before{content:"📝 ";}
.callout-example .callout-title::before{content:"💡 ";}
.callout-warning .callout-title::before{content:"⚠️ ";}
.callout-formula .callout-title::before{content:"∑ ";}

/* ==== Animated sequence / flow diagrams ==== */
.diagram-block{
  margin:20px 0;padding:16px 18px 14px;background:#FBFAF6;border:1px solid var(--border);
  border-radius:8px;
}
.diagram-block h4{
  margin:0 0 12px 0;font-size:calc(14.5px * var(--fontScale));color:var(--navy-deep);
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
}
.diagram-play-btn{
  border:1.5px solid var(--accent2);background:#fff;color:var(--accent2);padding:5px 12px;
  border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Sarabun',sans-serif;
  flex-shrink:0;
}
.diagram-play-btn:hover{background:var(--accent-soft);}
.diagram-svg-wrap{overflow-x:auto;}
.diagram-svg{display:block;margin:0 auto;min-width:420px;}
.diagram-actor-label{font-family:'Sarabun',sans-serif;font-size:11.5px;font-weight:600;fill:var(--navy-deep);}
.diagram-lifeline{stroke:var(--border);stroke-width:1.5;stroke-dasharray:3,3;}
.diagram-node-box{fill:var(--panel);stroke:var(--navy);stroke-width:1.3;}
.diagram-arrow-path{fill:none;stroke:var(--accent2);stroke-width:2;marker-end:url(#arrowhead);}
.diagram-arrow-label{font-family:'JetBrains Mono',monospace;font-size:10.5px;fill:var(--navy-deep);}
.diagram-glow-dot{fill:var(--flag);filter:url(#glowFilter);opacity:0;}
.diagram-steps-list{list-style:none;margin:12px 0 0;padding:0;font-size:calc(13px * var(--fontScale));line-height:1.7;}
.diagram-steps-list li{padding:6px 10px;border-left:3px solid transparent;border-radius:4px;transition:background .3s ease, border-color .3s ease;}
.diagram-steps-list li.step-active{background:var(--accent-soft);border-left-color:var(--flag);}
.diagram-steps-list .step-num{
  display:inline-block;width:20px;height:20px;border-radius:50%;background:var(--navy);color:#fff;
  text-align:center;line-height:20px;font-size:11px;margin-right:8px;font-family:'JetBrains Mono',monospace;
}

</style>
</head>

<script>
const SECTIONS = [{"title": "ภาพรวม Link Layer: บริการและ Transportation Analogy", "body": "**Link layer** รับผิดชอบการส่ง datagram จาก node หนึ่งไปยัง node ที่**อยู่ติดกันทางกายภาพ**ผ่าน link เดียว — datagram หนึ่งตัวอาจถูกส่งผ่านหลาย link ประเภทต่างกัน (เช่น WiFi ในช่วงแรก แล้วต่อด้วย Ethernet) โดยแต่ละ link protocol ให้บริการต่างกัน", "blocks": [{"type": "subheading", "content": "คำศัพท์พื้นฐาน"}, {"type": "note", "content": "**Node**: host และ router | **Link**: ช่องทางสื่อสารที่เชื่อม node ที่อยู่ติดกันบนเส้นทาง (มีสายหรือไร้สาย) | **Frame**: packet ระดับ layer-2 ที่ห่อหุ้ม (encapsulate) datagram ไว้"}, {"type": "subheading", "content": "Transportation Analogy"}, {"type": "example", "content": "การเดินทางจาก Princeton ไป Lausanne: limo (Princeton→JFK) → เครื่องบิน (JFK→Geneva) → รถไฟ (Geneva→Lausanne)\n\n- **นักท่องเที่ยว** = datagram\n- **ช่วงการเดินทางแต่ละช่วง** = communication link\n- **รูปแบบการเดินทาง** (limo/plane/train) = link-layer protocol\n- **ตัวแทนท่องเที่ยว** = routing algorithm (ผู้วางแผนเส้นทางทั้งหมด)"}, {"type": "subheading", "content": "บริการที่ Link Layer มอบให้"}, {"type": "table", "content": "<table><tr><th>บริการ</th><th>รายละเอียด</th></tr><tr><td>Framing, link access</td><td>ห่อหุ้ม datagram เป็น frame (เพิ่ม header, trailer) และจัดการ channel access ถ้าเป็น shared medium — ใช้ \"MAC address\" ใน frame header ระบุต้นทาง/ปลายทาง (ต่างจาก IP address)</td></tr><tr><td>Reliable delivery</td><td>ระหว่าง node ที่อยู่ติดกัน — มักไม่ค่อยใช้บน link ที่ bit-error ต่ำ (เช่น fiber, copper) แต่มักใช้บน wireless link ที่มี error rate สูง</td></tr><tr><td>Flow control</td><td>จัดจังหวะระหว่าง sending/receiving node ที่อยู่ติดกัน</td></tr><tr><td>Error detection</td><td>ตรวจจับ error จาก signal attenuation, noise — receiver ตรวจพบแล้วอาจสั่ง retransmit หรือทิ้ง frame</td></tr><tr><td>Error correction</td><td>receiver ระบุตำแหน่งและแก้ไข bit error ได้เองโดยไม่ต้อง retransmit</td></tr><tr><td>Half-duplex / Full-duplex</td><td>half-duplex: ทั้งสองฝั่งส่งได้แต่ไม่พร้อมกัน | full-duplex: ส่งพร้อมกันได้ทั้งสองทาง</td></tr></table>"}, {"type": "warning", "content": "**คำถามน่าคิด**: ทำไมต้องมีทั้ง link-level reliability และ end-end reliability (ที่ TCP ทำอยู่แล้ว)? — เพราะ wireless link มี bit-error rate สูงกว่ามาก การแก้ไข error ที่ link เดียวที่มีปัญหาจะมีประสิทธิภาพกว่าการปล่อยให้ TCP ต้อง retransmit ข้อมูลทั้งเส้นทาง end-to-end ทุกครั้งที่มี error เกิดขึ้น"}, {"type": "subheading", "content": "การ Implement Link Layer ใน Host"}, {"type": "note", "content": "Link layer ถูก implement บนชิป (**Network Interface Card / NIC**) ในทุก host — ทำหน้าที่ link + physical layer ผสมผสานทั้ง hardware, software, และ firmware เข้าด้วยกัน (framing, error detection ส่วนใหญ่ทำใน hardware ส่วน higher-level function เช่นการประกอบ addressing info ทำใน software ที่รันบน CPU)\n\n**ฝั่งส่ง**: ห่อหุ้ม datagram เป็น frame, เพิ่ม error-checking bit, reliable data transfer, flow control ฯลฯ\n**ฝั่งรับ**: ตรวจสอบ error, ทำ reliable data transfer/flow control, ดึง datagram ออกมาส่งต่อขึ้น layer บน"}]}, {"title": "Error Detection และ Correction", "body": "เนื่องจากสัญญาณอาจถูกรบกวนระหว่างการส่ง จึงต้องมีกลไกตรวจจับ (และบางครั้งแก้ไข) bit error ที่ link layer — เทคนิคหลักมี 3 แบบ: parity checking, Internet checksum, และ CRC", "blocks": [{"type": "subheading", "content": "หลักการทั่วไปของ Error Detection"}, {"type": "note", "content": "**EDC (Error Detection and Correction bits)** คือ bit เพิ่มเติมที่แนบไปกับข้อมูล $D$ (ซึ่งอาจรวม header field ด้วย) — ผู้รับคำนวณ EDC ใหม่จากข้อมูล $D'$ ที่ได้รับ แล้วเทียบกับ EDC ที่แนบมา ถ้าไม่ตรงกันแสดงว่ามี error\n\n**Error detection ไม่ perfect 100%**: protocol อาจพลาดตรวจจับ error บางกรณีได้ (แม้จะน้อยมาก) — EDC field ที่ใหญ่กว่าจะให้การตรวจจับ/แก้ไขที่ดีกว่า"}, {"type": "subheading", "content": "Parity Checking"}, {"type": "note", "content": "**Single bit parity**: เพิ่ม 1 bit เพื่อทำให้จำนวน bit ที่เป็น 1 ในข้อมูล**เป็นเลขคู่ (even parity)** หรือ**เลขคี่ (odd parity)** — ตรวจจับ single-bit error ได้ แต่**ไม่สามารถแก้ไข**ได้ (ไม่รู้ว่า bit ไหนผิด)\n\n**Two-dimensional parity**: จัดข้อมูลเป็นตาราง (แถว×คอลัมน์) แล้วคำนวณ parity bit ทั้งของแต่ละแถว (row parity) และแต่ละคอลัมน์ (column parity) — ข้อดีคือสามารถ**ตรวจจับและแก้ไข single-bit error ได้โดยไม่ต้อง retransmit** เพราะตำแหน่งของ error สามารถระบุได้จากจุดตัดของแถว-คอลัมน์ที่ parity ผิดทั้งคู่"}, {"type": "subheading", "content": "Internet Checksum"}, {"type": "note", "content": "ใช้ในระดับ transport layer (ทบทวนจาก Chapter 3): มองข้อมูลเป็นลำดับเลขจำนวนเต็ม 16 บิต แล้วบวกกันแบบ **one's complement sum** — วิธีนี้เรียบง่าย คำนวณเร็ว แต่ให้การป้องกันที่**ค่อนข้างอ่อน**เมื่อเทียบกับ CRC"}, {"type": "subheading", "content": "CRC: Cyclic Redundancy Check"}, {"type": "formula", "label": "หลักการของ CRC", "content": "$D$ = ข้อมูล (มองเป็นเลขฐาน 2), $G$ = generator (bit pattern ความยาว $r+1$ บิต ที่กำหนดไว้ล่วงหน้าตามมาตรฐาน)\n\n**ฝั่งส่ง**: คำนวณ $r$-bit CRC ($R$) ที่ทำให้ $\\langle D,R \\rangle = D \\cdot 2^r \\oplus R$ **หารด้วย $G$ ลงตัวพอดี (mod 2)** — สมการหา $R$:\n\n$$R = \\text{remainder}\\left[\\dfrac{D \\cdot 2^r}{G}\\right]$$\n\n**ฝั่งรับ**: รู้ค่า $G$ อยู่แล้ว นำ $\\langle D,R \\rangle$ ที่ได้รับมาหารด้วย $G$ — ถ้าเศษไม่เป็นศูนย์ แปลว่า**พบ error**\n\n**คุณสมบัติ**: สามารถตรวจจับ burst error ที่มีความยาวน้อยกว่า $r+1$ บิตได้ครบทุกกรณี — ใช้กันอย่างแพร่หลายในทางปฏิบัติ (Ethernet, 802.11 WiFi)"}, {"type": "example", "content": "**ตัวอย่างการคำนวณ CRC**: กำหนด generator $G = 1001$ (4 บิต, ดังนั้น $r=3$)\n\nขั้นตอน: นำ $D \\cdot 2^r$ (คือ $D$ ต่อท้ายด้วยเลข 0 จำนวน $r$ ตัว) มาหารแบบ XOR ด้วย $G$ ซ้ำไปเรื่อยๆ (คล้ายการหารยาวปกติ แต่ใช้ XOR แทนการลบ) จนได้เศษ $R$ ที่มีความยาว $r$ บิต — bit ที่ส่งจริงคือ $D$ ต่อท้ายด้วย $R$ ทั้งหมด $d+r$ บิต\n\nที่ฝั่งรับ นำ bit ทั้งหมดที่ได้ ($D',R'$) มาหารด้วย $G$ อีกครั้งด้วยวิธี XOR เดียวกัน — ถ้าเศษเป็น 0 แปลว่าไม่พบ error"}]}, {"title": "Multiple Access Protocols", "body": "เมื่อหลาย node ใช้ **broadcast channel เดียวกัน** (shared medium) จำเป็นต้องมี **multiple access protocol** เป็น distributed algorithm ที่กำหนดว่า node ไหนจะส่งข้อมูลเมื่อไหร่ — สื่อสารเรื่องการแบ่งปันช่องสัญญาณต้องใช้ **ช่องสัญญาณเดียวกันนั่นเอง** (ไม่มี out-of-band channel แยกต่างหาก)", "blocks": [{"type": "subheading", "content": "Multiple Access Protocol ในอุดมคติ"}, {"type": "note", "content": "กำหนด: channel อัตรา $R$ bps ต้องการให้: (1) เมื่อมี node เดียวต้องการส่ง สามารถส่งได้เต็มอัตรา $R$ (2) เมื่อมี $M$ node ต้องการส่งพร้อมกัน แต่ละตัวได้ค่าเฉลี่ย $R/M$ (3) **decentralized เต็มรูปแบบ**: ไม่มี node พิเศษคอยประสานงาน ไม่ต้อง sync clock/slot (4) เรียบง่าย"}, {"type": "subheading", "content": "3 กลุ่มหลักของ MAC Protocol"}, {"type": "table", "content": "<table><tr><th>กลุ่ม</th><th>หลักการ</th><th>ตัวอย่าง</th></tr><tr><td>Channel Partitioning</td><td>แบ่ง channel ออกเป็นส่วนย่อย (time slot, frequency, code) แล้วจัดสรรให้แต่ละ node ใช้แบบ exclusive</td><td>TDMA, FDMA</td></tr><tr><td>Random Access</td><td>ไม่แบ่ง channel, ยอมให้เกิด collision แล้วค่อย \"กู้คืน\" จาก collision</td><td>ALOHA, S-ALOHA, CSMA, CSMA/CD, CSMA/CA</td></tr><tr><td>Taking Turns</td><td>node ผลัดกันส่ง แต่ node ที่มีข้อมูลมากกว่าใช้เวลานานกว่าได้</td><td>Polling, Token Passing</td></tr></table>"}, {"type": "subheading", "content": "Channel Partitioning: TDMA และ FDMA"}, {"type": "note", "content": "**TDMA (Time Division Multiple Access)**: เข้าถึง channel เป็น \"รอบ\" (round) — แต่ละ station ได้ time slot ความยาวคงที่ (= เวลาส่ง 1 packet) ในแต่ละรอบ — slot ที่ไม่มีใครใช้จะ**ว่างเปล่า (idle)** ไป\n\n**FDMA (Frequency Division Multiple Access)**: แบ่ง spectrum ของ channel เป็นแถบความถี่ (frequency band) — แต่ละ station ได้แถบความถี่คงที่ของตัวเอง — เวลาที่ไม่ได้ใช้ในแถบความถี่นั้นก็**ว่างเปล่า**เช่นกัน"}, {"type": "subheading", "content": "Random Access: Slotted ALOHA"}, {"type": "note", "content": "**สมมติฐาน**: frame ทุกตัวขนาดเท่ากัน, เวลาแบ่งเป็น slot เท่าๆ กัน (= เวลาส่ง 1 frame), node เริ่มส่งได้เฉพาะที่ต้นของ slot เท่านั้น (node sync กัน), ถ้ามี 2 node ขึ้นไปส่งพร้อมกันใน slot เดียว ทุก node จะตรวจพบ collision ได้\n\n**หลักการทำงาน**: node ที่มี frame ใหม่ → ส่งใน slot ถัดไปทันที — ถ้าไม่ collide: ส่ง frame ใหม่ใน slot ถัดไปได้เลย — ถ้า collide: retransmit frame ในแต่ละ slot ถัดไปด้วยความน่าจะเป็น $p$ จนกว่าจะสำเร็จ (สุ่ม retransmit เพื่อหลีกเลี่ยงการ collide ซ้ำ)"}, {"type": "formula", "label": "ประสิทธิภาพของ Slotted ALOHA", "content": "สมมติมี $N$ node แต่ละตัวส่งใน slot ด้วยความน่าจะเป็น $p$\n\n$$P(\\text{node หนึ่งสำเร็จใน slot}) = p(1-p)^{N-1}$$\n$$P(\\text{มี node ใดสำเร็จ}) = Np(1-p)^{N-1}$$\n\nเมื่อหาค่า $p^*$ ที่ทำให้ประสิทธิภาพสูงสุด และให้ $N \\to \\infty$:\n\n$$\\text{max efficiency} = \\dfrac{1}{e} \\approx 0.37$$\n\n**สรุป**: ในสถานการณ์ที่ดีที่สุด channel ถูกใช้เพื่อการส่งข้อมูลที่มีประโยชน์เพียง **37% ของเวลาทั้งหมด**เท่านั้น! (อีก 37% เป็น slot ว่าง และ 26% เป็น slot ที่เกิด collision)"}, {"type": "warning", "content": "**Pure (unslotted) ALOHA**: ง่ายกว่า (ไม่ต้อง sync) — node ส่งทันทีที่มี frame — แต่ probability ของการ collide สูงกว่ามาก เพราะ frame ที่ส่งเวลา $t_0$ อาจ overlap กับ frame ที่ส่งในช่วง $[t_0-1, t_0+1]$ ได้ (ช่วงเสี่ยงกว้างเป็น 2 เท่าของ slotted ALOHA) — **ประสิทธิภาพสูงสุดของ Pure ALOHA อยู่ที่เพียง 18%** เท่านั้น"}, {"type": "subheading", "content": "CSMA และ CSMA/CD"}, {"type": "note", "content": "**CSMA (Carrier Sense Multiple Access)**: \"ฟังก่อนส่ง\" — ถ้า channel ว่าง (idle): ส่ง frame ทั้งหมด — ถ้า channel ไม่ว่าง (busy): เลื่อนการส่งออกไป (เหมือนหลักมารยาท \"อย่าขัดจังหวะคนอื่น\")\n\n**ทำไมยังเกิด collision ได้แม้มี carrier sensing?** เพราะ **propagation delay** — เนื่องจากสัญญาณเดินทางไม่เร็วเป็นอนันต์ node สองตัวที่อยู่ห่างกันอาจ**ไม่ได้ยิน**การส่งของกันและกันที่เพิ่งเริ่มต้น จึงคิดว่า channel ว่างทั้งคู่ แล้วส่งพร้อมกัน — collision ทำให้เวลาส่ง frame ทั้งหมดสูญเปล่า ยิ่งระยะห่างมาก ยิ่งมีโอกาส collision สูง\n\n**CSMA/CD (CSMA with Collision Detection)**: ตรวจจับ collision ได้ภายในเวลาสั้นๆ แล้ว**หยุดส่งทันที (abort)** ลดการสูญเสีย channel — ตรวจจับได้ง่ายบน wired link แต่**ยากมาก**บน wireless (เพราะ node ไม่สามารถฟังขณะส่งสัญญาณตัวเองได้พร้อมกัน — สัญญาณของตัวเองจะกลบสัญญาณที่รับเข้ามา)"}, {"type": "formula", "label": "Ethernet CSMA/CD Algorithm", "content": "1. Ethernet รับ datagram จาก network layer, สร้าง frame\n2. ถ้า channel ว่าง: เริ่มส่ง frame; ถ้าไม่ว่าง: รอจนกว่าจะว่างแล้วค่อยส่ง\n3. ถ้าส่งทั้ง frame โดยไม่มี collision: เสร็จสิ้น!\n4. ถ้าตรวจพบการส่งของตัวอื่นระหว่างที่กำลังส่ง: **abort ทันที** และส่ง jam signal\n5. หลัง abort เข้าสู่ **binary (exponential) backoff**: หลัง collision ครั้งที่ $m$ เลือก $K$ แบบสุ่มจาก $\\{0,1,2,...,2^m-1\\}$ แล้วรอ $K \\times 512$ bit time ก่อนกลับไป step 2\n\nยิ่งเกิด collision ซ้ำมาก ยิ่งขยายช่วงการรอให้ยาวขึ้น (ลดโอกาส collide ซ้ำ)"}, {"type": "formula", "label": "ประสิทธิภาพของ CSMA/CD", "content": "ให้ $t_{prop}$ = max propagation delay ระหว่าง 2 node ใดๆ ใน LAN, $t_{trans}$ = เวลาส่ง frame ขนาดใหญ่สุด\n\n**Efficiency เข้าใกล้ 1** เมื่อ $t_{prop} \\to 0$ หรือ $t_{trans} \\to \\infty$ — ประสิทธิภาพดีกว่า ALOHA มาก และยังคงความง่าย ราคาถูก และ decentralized"}, {"type": "subheading", "content": "\"Taking Turns\" Protocols: Polling และ Token Passing"}, {"type": "note", "content": "**Channel partitioning** มีประสิทธิภาพและเป็นธรรมที่ load สูง แต่**ไม่มีประสิทธิภาพที่ load ต่ำ** (delay ในการเข้าถึง channel, จัดสรร bandwidth เพียง $1/N$ แม้มี node active เพียงตัวเดียว) — **Random access** มีประสิทธิภาพที่ load ต่ำ (node เดียวใช้ channel เต็มอัตราได้) แต่ที่ load สูงจะมี overhead จาก collision — **Taking turns** พยายามผสมข้อดีของทั้งสองแบบ\n\n**Polling**: centralized controller \"เชิญ\" node อื่นให้ส่งทีละตัวตามลำดับ — ใช้กับอุปกรณ์ \"โง่\" (dumb device) ทั่วไป (เช่น Bluetooth) ข้อกังวล: polling overhead, latency, และ **single point of failure** (ถ้า master ล่ม ทั้งระบบหยุด)\n\n**Token Passing**: ส่ง token message ไปตามลำดับ node ต่อ node — node ที่ถือ token จึงมีสิทธิ์ส่งได้ ข้อกังวล: token overhead, latency, และ single point of failure เช่นกัน (ถ้า token หายไปต้องมี recovery procedure)"}, {"type": "diagram", "layout": "lifeline", "title": "CSMA/CD: การชนกันของสัญญาณและ Backoff", "actors": ["Host A", "Shared Channel", "Host B"], "steps": [{"from": 0, "to": 1, "label": "Sense: Channel ว่างไหม?", "note": "ทั้งคู่ฟังก่อนส่ง (Carrier Sense)"}, {"from": 2, "to": 1, "label": "Sense: Channel ว่างไหม?", "note": "ทั้งคู่ฟังก่อนส่ง (Carrier Sense)"}, {"from": 0, "to": 1, "label": "เริ่มส่งข้อมูล", "note": "A เริ่มส่งเพราะเห็นว่าว่าง"}, {"from": 2, "to": 1, "label": "เริ่มส่งข้อมูล (พร้อมกัน!)", "note": "B ก็เริ่มส่งพร้อมกันโดยไม่รู้"}, {"from": 1, "to": 0, "label": "Collision! Jam Signal", "note": "ตรวจพบการชนกัน สั่งหยุดทันที"}, {"from": 1, "to": 2, "label": "Collision! Jam Signal", "note": "ทั้งสองฝั่ง random backoff แล้วค่อยส่งใหม่"}]}]}, {"title": "MAC Address และ ARP", "body": "แต่ละ interface บน LAN มีทั้ง **IP address** (layer 3, ใช้ forward ข้าม network) และ **MAC address** (layer 2, ใช้ส่ง frame ระหว่าง interface ที่เชื่อมต่อกันโดยตรงในเครือข่ายเดียวกัน)", "blocks": [{"type": "subheading", "content": "MAC Address คืออะไร"}, {"type": "note", "content": "**MAC address** (หรือ LAN/physical/Ethernet address): ยาว **48 บิต** สำหรับ LAN ส่วนใหญ่ ถูก **burn ไว้ใน ROM ของ NIC** (บางครั้งตั้งค่าผ่าน software ได้) เขียนในรูปแบบ **hexadecimal** เช่น `1A-2F-BB-76-09-AD`\n\n**การจัดสรร**: บริหารโดย **IEEE** — ผู้ผลิตซื้อ \"ส่วน\" ของพื้นที่ MAC address เพื่อรับประกันความไม่ซ้ำกัน\n\n**Analogy**: MAC address เหมือน **Social Security Number** (ติดตัวไปทุกที่, ไม่เปลี่ยนตามที่อยู่) ในขณะที่ IP address เหมือน **ที่อยู่ไปรษณีย์** (เปลี่ยนตามสถานที่ที่อยู่)\n\n**MAC address เป็น flat address จึงเคลื่อนย้ายได้ (portable)**: ย้าย interface จาก LAN หนึ่งไปอีก LAN หนึ่งได้โดยไม่ต้องเปลี่ยน MAC address — ต่างจาก IP address ที่**ไม่ portable** เพราะขึ้นกับ subnet ที่ node เชื่อมต่ออยู่"}, {"type": "subheading", "content": "ARP: Address Resolution Protocol"}, {"type": "note", "content": "**คำถาม**: รู้ IP address ของปลายทางแล้ว จะหา MAC address ได้อย่างไร?\n\n**ARP table**: ทุก IP node (host, router) บน LAN มีตารางเก็บ mapping `<IP address; MAC address; TTL>` — TTL (โดยทั่วไป ~20 นาที) คือเวลาที่ mapping นี้จะถูกลืมไป"}, {"type": "example", "content": "**ตัวอย่างการทำงานของ ARP แบบ step-by-step**: A ต้องการส่ง datagram ไปยัง B แต่ MAC address ของ B ไม่มีใน ARP table ของ A\n\n1. **A broadcast ARP query** ที่มี B's IP address, ส่งด้วย destination MAC = `FF-FF-FF-FF-FF-FF` (broadcast address) — ทุก node บน LAN ได้รับ query นี้\n2. **B ตอบกลับด้วย ARP response** ที่มี MAC address ของตัวเอง ส่งตรงไปยัง A (unicast) เพราะ B รู้ MAC/IP ของ A จาก query ที่ได้รับ\n3. **A ได้รับ reply ของ B แล้วเพิ่ม entry ใหม่ลงใน ARP table ของตัวเอง** จากนี้ A ส่ง frame ไปยัง B ได้โดยตรงโดยไม่ต้องทำ ARP ซ้ำ (จนกว่า entry จะหมดอายุ)"}, {"type": "subheading", "content": "Routing ข้าม Subnet: การเดินทางของ Address ในแต่ละชั้น"}, {"type": "note", "content": "เมื่อ A ส่ง datagram ไปยัง B ที่อยู่คนละ subnet (ผ่าน router R): **IP address ต้นทาง/ปลายทางไม่เปลี่ยนแปลงเลยตลอดเส้นทาง** (ยังคงเป็น A, B เสมอ) แต่ **MAC address ของ frame เปลี่ยนไปทุก hop**:\n\n1. A สร้าง frame โดยมี MAC dest = **MAC ของ R** (เพราะ A รู้ว่าต้องส่งผ่าน first-hop router ก่อน), IP dest ยังคงเป็น B\n2. เมื่อ frame ถึง R, R แกะ frame ออก ดึง datagram ขึ้นไปที่ IP layer, ตรวจสอบ forwarding table แล้วห่อ datagram นั้นเป็น frame **ใหม่** โดยมี MAC source = MAC ของ R (ที่ interface ขาออก) และ MAC dest = **MAC ของ B** (IP ยังคงเหมือนเดิม)\n3. frame ใหม่ถูกส่งไปยัง B โดยตรง — B แกะ frame ดึง datagram ส่งขึ้น IP layer ตามปกติ"}, {"type": "warning", "content": "**ประเด็นสำคัญ**: **MAC address เปลี่ยนทุก hop** (local, per-link) ในขณะที่ **IP address คงที่ตลอดเส้นทาง end-to-end** (global) — นี่คือความแตกต่างพื้นฐานระหว่าง layer 2 กับ layer 3 addressing"}, {"type": "diagram", "layout": "lifeline", "title": "ARP: ถาม-ตอบ MAC Address", "actors": ["Host A", "ทุกอุปกรณ์ใน LAN\n(Broadcast)", "Host B\n(เจ้าของ IP)"], "steps": [{"from": 0, "to": 1, "label": "ARP Request: ใครมี IP นี้?", "note": "ส่งแบบ broadcast ถึงทุกเครื่อง"}, {"from": 1, "to": 2, "label": "กระจายถึงทุกเครื่อง", "note": "รวมถึง Host B ที่เป็นเจ้าของ IP"}, {"from": 2, "to": 0, "label": "ARP Reply: ฉันเอง MAC=...", "note": "ตอบกลับแบบ unicast ตรงถึง Host A"}]}]}, {"title": "Ethernet", "body": "**Ethernet** เป็นเทคโนโลยี LAN แบบมีสายที่ **ครองตลาด** — เป็น LAN technology แรกที่ใช้กันอย่างแพร่หลาย เรียบง่าย ราคาถูก และตามความเร็วให้ทันความต้องการมาตลอด (10 Mbps ถึง 400 Gbps)", "blocks": [{"type": "subheading", "content": "โครงสร้าง Physical Topology: จาก Bus สู่ Switched"}, {"type": "note", "content": "**Bus** (นิยมจนถึงกลางยุค 90s): node ทั้งหมดอยู่ใน **collision domain เดียวกัน** (สามารถ collide กันได้หมด)\n\n**Switched** (ปัจจุบัน): มี link-layer switch ที่ศูนย์กลาง — แต่ละ \"spoke\" รัน Ethernet protocol แยกกัน (node ไม่ collide กันเลย)"}, {"type": "subheading", "content": "โครงสร้าง Ethernet Frame"}, {"type": "table", "content": "<table><tr><th>Field</th><th>รายละเอียด</th></tr><tr><td>Preamble</td><td>7 byte ของ `10101010` ตามด้วย 1 byte `10101011` — ใช้ sync clock rate ระหว่าง sender/receiver</td></tr><tr><td>Destination address</td><td>MAC address ปลายทาง 6 byte</td></tr><tr><td>Source address</td><td>MAC address ต้นทาง 6 byte</td></tr><tr><td>Type</td><td>บอก protocol ชั้นบน (ส่วนใหญ่เป็น IP แต่มีแบบอื่นได้ เช่น Novell IPX, AppleTalk) — ใช้ demultiplex ขึ้นไปที่ฝั่งรับ</td></tr><tr><td>Data (payload)</td><td>IP datagram (หรือ packet ของ network-layer protocol อื่น)</td></tr><tr><td>CRC</td><td>Cyclic Redundancy Check — ถ้าตรวจพบ error, frame จะถูกทิ้ง</td></tr></table>"}, {"type": "note", "content": "**พฤติกรรมของ adapter**: ถ้ารับ frame ที่ destination address ตรงกับตัวเอง หรือเป็น broadcast address (เช่น ARP packet) → ส่ง data ขึ้น network layer — มิฉะนั้น**ทิ้ง frame ไปเลย**"}, {"type": "warning", "content": "**Ethernet เป็นแบบ connectionless และ unreliable**: **connectionless** — ไม่มี handshaking ระหว่าง sending/receiving NIC | **unreliable** — receiving NIC ไม่ส่ง ACK/NAK กลับไปหา sending NIC เลย — ข้อมูลใน frame ที่ถูกทิ้งจะกู้คืนได้ก็ต่อเมื่อ sender ต้นทางใช้ higher-layer reliable data transfer (เช่น TCP) เท่านั้น มิฉะนั้นข้อมูลจะสูญหายไปเลย — Ethernet's MAC protocol คือ **unslotted CSMA/CD with binary backoff**"}, {"type": "note", "content": "**มาตรฐาน 802.3 Ethernet**: มีหลายมาตรฐานย่อย ใช้ **MAC protocol และ frame format เดียวกันหมด** แต่ต่างกันที่ความเร็ว (2 Mbps ถึง 400+ Gbps) และ physical layer media (copper twisted pair, fiber ต่างชนิด — เช่น 100BASE-T2, 100BASE-FX, 100BASE-TX)"}]}, {"title": "Ethernet Switch: Self-Learning และ Forwarding", "body": "**Switch** เป็น link-layer device ที่ **active** (ตรงข้ามกับ hub ที่แค่ broadcast ทุกอย่าง) — ทำ store-and-forward ของ Ethernet frame โดยดูจาก MAC address และเรียนรู้ตำแหน่งของ host ต่างๆ ได้เอง", "blocks": [{"type": "subheading", "content": "คุณสมบัติของ Switch"}, {"type": "note", "content": "Switch ตรวจสอบ MAC address ของ frame ที่เข้ามา แล้ว**เลือก forward ไปยัง 1 หรือหลาย outgoing link**อย่างเจาะจง (ไม่ broadcast ทุกครั้งเหมือน hub) — ในการส่งบน segment แต่ละอัน ยังคงใช้ CSMA/CD ตามปกติ\n\n**Transparent**: host ไม่รู้ตัวเลยว่ามี switch อยู่\n**Plug-and-play, self-learning**: switch ไม่ต้อง config ล่วงหน้าเลย"}, {"type": "subheading", "content": "Multiple Simultaneous Transmissions"}, {"type": "note", "content": "Host แต่ละตัวมี**การเชื่อมต่อโดยตรง (dedicated) กับ switch** — switch มี buffer เก็บ packet — ใช้ Ethernet protocol บน**แต่ละ incoming link แยกกัน** ผลคือ: **ไม่มี collision, full duplex, แต่ละ link เป็น collision domain ของตัวเอง** — เช่น A-to-A' และ B-to-B' ส่งพร้อมกันได้โดยไม่ชนกัน (แต่ A-to-A' กับ C-to-A' ชนกันไม่ได้ เพราะทั้งคู่ต้องการใช้ output link เดียวกันไปยัง A')"}, {"type": "subheading", "content": "Self-Learning: Switch เรียนรู้ Forwarding Table ได้อย่างไร"}, {"type": "note", "content": "**Switch table**: แต่ละ entry คือ `(MAC address ของ host, interface ที่ใช้ไปถึง host นั้น, timestamp)` — คล้าย routing table แต่**ไม่ต้องใช้ routing protocol** ในการสร้าง!"}, {"type": "formula", "label": "อัลกอริทึม Self-Learning และ Forward/Filter", "content": "**เมื่อ frame มาถึง switch**:\n1. บันทึก incoming link + MAC address ของผู้ส่ง (\"เรียนรู้\" ตำแหน่งของผู้ส่ง)\n2. ค้นหา MAC destination address ใน switch table\n3. ถ้าพบ entry สำหรับ destination:\n   - ถ้า destination อยู่บน segment เดียวกับที่ frame มาถึง → **ทิ้ง frame** (ไม่ต้อง forward เพราะ destination ได้รับอยู่แล้วผ่าน broadcast บน segment เดียวกัน)\n   - มิฉะนั้น → **forward** ไปยัง interface ที่ entry ระบุ\n4. ถ้าไม่พบ entry → **flood** (ส่งออกทุก interface ยกเว้น interface ที่ frame เข้ามา)"}, {"type": "example", "content": "**ตัวอย่าง**: A ส่ง frame ถึง A' เป็นครั้งแรก (ตำแหน่ง A' ยังไม่รู้จัก) → switch **flood** ไปทุก interface ยกเว้นที่ A เข้ามา — ขณะเดียวกัน switch บันทึกว่า \"A อยู่ที่ interface 1\" ลง table\n\nเมื่อ A' ตอบกลับ (A' → A): switch เห็น frame นี้เข้ามาจาก interface 4 → บันทึก \"A' อยู่ที่ interface 4\" — และเนื่องจาก destination (A) มีอยู่ใน table แล้ว (interface 1) → switch **ส่งแบบเจาะจง (selective)** ไปที่ interface 1 เท่านั้น ไม่ flood อีกต่อไป"}, {"type": "subheading", "content": "การเชื่อมต่อ Switch หลายตัว"}, {"type": "note", "content": "Self-learning switch สามารถต่อกันเป็นเครือข่ายใหญ่ได้ (switch เชื่อมกับ switch อื่น) — หลักการ self-learning **ทำงานเหมือนเดิมทุกประการ**ไม่ว่าจะมี switch กี่ตัวเชื่อมต่อกัน — switch แต่ละตัวเรียนรู้ว่า host ไหนอยู่ทางไหนได้เองจากการสังเกต source address ของ frame ที่ผ่านเข้ามา"}, {"type": "subheading", "content": "Switches vs Routers"}, {"type": "table", "content": "<table><tr><th>มิติ</th><th>Router</th><th>Switch</th></tr><tr><td>Layer</td><td>Network-layer device (ตรวจสอบ network-layer header)</td><td>Link-layer device (ตรวจสอบ link-layer header)</td></tr><tr><td>รูปแบบการทำงาน</td><td>store-and-forward</td><td>store-and-forward (เหมือนกัน)</td></tr><tr><td>การสร้าง forwarding table</td><td>คำนวณด้วย routing algorithm, ใช้ IP address</td><td>เรียนรู้ด้วยการ flooding + learning, ใช้ MAC address</td></tr></table>"}, {"type": "diagram", "layout": "lifeline", "title": "Switch Self-Learning: การเรียนรู้ Forwarding Table", "actors": ["Host A\n(Port 1)", "Switch", "Host B\n(Port 2)"], "steps": [{"from": 0, "to": 1, "label": "Frame จาก A", "note": "switch เรียนรู้ MAC-A ↔ Port1"}, {"from": 1, "to": 2, "label": "Flood ไปทุก Port", "note": "ยังไม่รู้จัก MAC-B จึงส่งออกทุกพอร์ต"}, {"from": 2, "to": 1, "label": "ตอบกลับจาก B", "note": "switch เรียนรู้ MAC-B ↔ Port2"}, {"from": 1, "to": 0, "label": "ส่งตรงเฉพาะ Port1", "note": "ครั้งต่อไปไม่ต้อง flood อีก"}]}]}, {"title": "VLANs: Virtual Local Area Networks", "body": "เมื่อ LAN มีขนาดใหญ่ขึ้น การรวมทุกอย่างไว้เป็น **broadcast domain เดียว** ก่อให้เกิดปัญหาด้าน scaling, ประสิทธิภาพ, ความปลอดภัย และความเป็นส่วนตัว — **VLAN** ช่วยแก้ปัญหานี้", "blocks": [{"type": "subheading", "content": "แรงจูงใจของ VLAN"}, {"type": "note", "content": "**ปัญหาของ single broadcast domain**: traffic แบบ broadcast ทั้งหมด (ARP, DHCP, unknown MAC) ต้องกระจายไปทั่วทั้ง LAN แม้จะไม่เกี่ยวข้องกับ segment ส่วนใหญ่ก็ตาม — เกิดปัญหาทั้ง scaling, efficiency, security และ privacy\n\n**ปัญหาด้านการบริหารจัดการ**: เช่น user จากแผนก CS ย้ายไปนั่งที่ตึก EE (เชื่อมต่อทางกายภาพเข้ากับ switch ของ EE) แต่ต้องการยังคง**เป็นสมาชิกทาง logic ของ VLAN CS** อยู่เหมือนเดิม"}, {"type": "subheading", "content": "Port-based VLAN"}, {"type": "note", "content": "switch (management software) จัดกลุ่ม **port** ของ switch จริงเพียงตัวเดียวให้กลายเป็น**หลาย VLAN แยกกัน** เช่น port 1-8 = VLAN \"EE\", port 9-15 = VLAN \"CS\" — switch เดียวจึงทำงาน**เสมือนเป็นหลาย virtual switch** พร้อมกัน\n\n**Traffic isolation**: frame จาก/ถึง port 1-8 (VLAN EE) จะไปถึงได้เฉพาะ port 1-8 เท่านั้น — ไม่รั่วไหลข้าม VLAN\n\n**ทางเลือกอื่น**: กำหนด VLAN ตาม **MAC address ของ endpoint** แทนที่จะกำหนดตาม switch port ก็ได้\n\n**การ forward ระหว่าง VLAN**: ต้องทำผ่าน **routing** (เหมือนเป็น switch แยกกันจริงๆ) — ในทางปฏิบัติ vendor มักขาย switch+router รวมกันเป็นอุปกรณ์เดียว\n\n**Dynamic membership**: port สามารถถูกกำหนดใหม่ระหว่าง VLAN ต่างๆ แบบ dynamic ได้"}, {"type": "subheading", "content": "VLAN ที่ครอบคลุมหลาย Switch: 802.1Q"}, {"type": "note", "content": "เมื่อ VLAN เดียวกันต้องกระจายอยู่บนหลาย physical switch จำเป็นต้องมี **trunk port** ที่ทำหน้าที่ส่ง frame ระหว่าง VLAN บน switch ต่างเครื่อง — frame ที่ผ่าน trunk port ต้อง**พก VLAN ID ไปด้วย** (ไม่ใช่ frame 802.1 ธรรมดา) ทำได้ด้วยโปรโตคอล **802.1Q** ที่เพิ่ม header field พิเศษ:\n\n- **Tag Protocol Identifier** (2 byte, ค่า `81-00`)\n- **Tag Control Information** (12-bit VLAN ID field + 3-bit priority field คล้าย IP ToS)\n- **Recomputed CRC** (ต้องคำนวณใหม่เพราะเนื้อหา frame เปลี่ยนไป)"}, {"type": "subheading", "content": "EVPN: Ethernet VPN (aka VXLAN)"}, {"type": "note", "content": "เทคนิคขยาย Layer-2 Ethernet network ให้ครอบคลุมหลาย**data center**ที่อยู่ห่างไกลกันทางภูมิศาสตร์ (เช่น Sunnyvale กับ Bangalore) — Layer-2 switch ถูกเชื่อมต่อกัน**ทาง logic**โดยใช้ **IP เป็น underlay** — Ethernet frame ถูกห่อหุ้ม (tunnel) อยู่ภายใน IP datagram เพื่อส่งข้ามระหว่าง site [RFC 7348]: \"scheme สำหรับ tunnel เพื่อ overlay เครือข่าย Layer 2 บนเครือข่าย Layer 3 ... วิ่งอยู่บนโครงสร้างพื้นฐานเครือข่ายที่มีอยู่แล้ว และให้วิธี 'ยืด' เครือข่าย Layer 2 ออกไปได้\""}]}, {"title": "MPLS: Multiprotocol Label Switching", "body": "**MPLS** มีเป้าหมายให้ IP forwarding **เร็วขึ้น** ในเครือข่ายที่ router รองรับ MPLS โดยใช้ **fixed-length label** แทนการทำ longest-prefix matching แบบดั้งเดิม — ยืมแนวคิดจาก Virtual Circuit (VC) มาผสมผสาน", "blocks": [{"type": "subheading", "content": "หลักการของ MPLS"}, {"type": "note", "content": "**MPLS header** ถูกแทรกอยู่ระหว่าง Ethernet header กับส่วนที่เหลือของ frame (ซึ่งยังคงมี IP header เดิมอยู่ครบ — **IP datagram ยังคง IP address ไว้เหมือนเดิม** ไม่ได้ถูกแทนที่) — MPLS header มี field **label** (20 บิต), Exp (3 บิต), S (1 บิต), TTL (8 บิต)\n\n**เหตุผลที่เร็วกว่า**: ค้นหา forwarding entry ด้วย fixed-length label ทำได้เร็วกว่าการทำ longest-prefix matching บน IP address ที่ผันแปรได้"}, {"type": "subheading", "content": "MPLS-capable Router (Label-Switched Router)"}, {"type": "note", "content": "Forward packet ไปยัง outgoing interface โดยดูจาก**ค่า label เท่านั้น** (ไม่ตรวจสอบ IP address เลย) — MPLS forwarding table**แยกต่างหาก**จาก IP forwarding table\n\n**ความยืดหยุ่น**: MPLS forwarding decision สามารถต่างจาก IP ได้:\n- ใช้ทั้ง source **และ** destination address เพื่อ route flow ที่มีปลายทางเดียวกันไปคนละเส้นทาง (traffic engineering)\n- **Re-route เร็ว**เมื่อ link ล้มเหลว: เตรียม backup path ไว้ล่วงหน้า (pre-computed)"}, {"type": "example", "content": "**เปรียบเทียบ IP routing กับ MPLS routing**: ใน IP routing ธรรมดา เส้นทางไปยัง destination กำหนดโดย destination address เพียงอย่างเดียว — ใน MPLS, entry router (เช่น R4) สามารถเลือกเส้นทาง MPLS ต่างกันไปยัง destination เดียวกันโดยพิจารณาจาก **source address หรือ field อื่นด้วย** — ถือเป็นรูปแบบหนึ่งของ **generalized forwarding** (ซึ่ง MPLS ทำแนวคิดนี้มาก่อน SDN ราว 10 ปี)"}, {"type": "note", "content": "**MPLS Signaling**: ปรับปรุง OSPF/IS-IS link-state flooding protocol ให้พก info เพิ่มเติม (เช่น link bandwidth, bandwidth ที่ถูก \"reserve\" ไว้แล้ว) — entry MPLS router ใช้ **RSVP-TE signaling protocol** เพื่อตั้งค่า MPLS forwarding ที่ router ปลายน้ำ (downstream)"}]}, {"title": "Data Center Networks", "body": "Data center สมัยใหม่มี host หลักหมื่นถึงหลักแสนตัว ที่ทำงานประสานกันอย่างใกล้ชิด รองรับ e-business, content server, search engine และ data mining ขนาดใหญ่", "blocks": [{"type": "subheading", "content": "ความท้าทายของ Data Center"}, {"type": "note", "content": "- หลายแอปพลิเคชันพร้อมกัน แต่ละตัวให้บริการ client จำนวนมหาศาล\n- ต้องการความน่าเชื่อถือสูง (reliability)\n- ต้องจัดการ/สมดุล load หลีกเลี่ยง bottleneck ทั้งด้าน processing, networking, และ data"}, {"type": "subheading", "content": "โครงสร้างเครือข่าย Data Center"}, {"type": "table", "content": "<table><tr><th>องค์ประกอบ</th><th>หน้าที่</th></tr><tr><td>Border routers</td><td>เชื่อมต่อกับภายนอก data center</td></tr><tr><td>Tier-1 switches</td><td>เชื่อมกับ Tier-2 switch ราว 16 ตัวด้านล่าง</td></tr><tr><td>Tier-2 switches</td><td>เชื่อมกับ TOR switch ราว 16 ตัวด้านล่าง</td></tr><tr><td>TOR (Top of Rack) switch</td><td>1 ตัวต่อ 1 rack, ใช้ Ethernet 100G-400G เชื่อมกับ server blade</td></tr><tr><td>Server racks</td><td>20-40 server blade ต่อ rack (แต่ละ blade คือ host หนึ่งตัว)</td></tr></table>"}, {"type": "image", "src": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCAFDAyADASIAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAYHAwQFCAIB/8QAYhAAAQMEAAMCBwoHCgkKBgAHAQIDBAAFBhEHEiETMRQWIkFRYXEIFTJVVoGTldLTI1JTkZSh0RckM0JicoKSluMlNjdEY3ODorEmNDVDdXajsrO0GEVUZHTBRicoZYTC8f/EABkBAQEBAQEBAAAAAAAAAAAAAAABAgMEBf/EADURAQEAAgAEAwcEAQMDBQAAAAABAhEDEiHwMUFRBBNhcaHB0QWBkbEiBhQyFVLxU3LC0uH/2gAMAwEAAhEDEQA/APZdKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoFKUoMct9EaK7IcOkNIK1ewDZquHuJF0YsjN6mWe0QoT7aXULkXVSTyqHMnY7I9daOhupTxMkuRcCvK2VcrzkVTDR/luabT+tQqOSGoEe2FiWGBCabDau31ycqRob307hWsZtnK6cmx8YxepaolviWRbwOkoXdFoK/5vMyN1IjleUAEnHLWABsk3VXT/wqorMzw4udyYtVht7rs1boR28Acrbez1PX4WvUNeutlzCMsdiiBPyae5ZEdUoHNzKHoO/N7dit8kc/eVYlx42R4Fw8CksWMOj4RRdFrQg+gqDJFSjHc6lXC52xiXbYLcO5laI0uLPLyS4lJUEkFCe8BWv5tUpw4m8M0BEKdbUQrklXX3yHMlSh6FHoPYQKtDKQpNg98IKUqdtzjc+OGyNEtKCikebRTzJ9ijUyxkaxytWpSsUOQzLiMyo6wtl5CXG1DuUkjYP5jWWuboUpSgUpSgUpSgUpSgUpSgUpSgVDb1l10j36fbbZZ4klqClvtn35xa8paSogAIV0A1s789TKqxsaxJl3u4jZ8Lu0ggk72lshlOvVprfz1ZNpbpy3uN0Vq4JhKasZcJ5SpNzcKEn1q7HQqTR8wyOQyl5iw2h1pY2laLspSVewhqq14kTOGcbt03WLFlXBY0W4SQXifWR0Sfb1qLY9ieRqtrc3E7xPtkeYjmdjOKUeRJJ847zr1A105I58 : Application-layer Routing"}, {"type": "note", "content": "**Load balancer** รับ external client request จากอินเทอร์เน็ต แล้ว**กระจายงาน**ไปยัง server ภายใน data center ที่เหมาะสม — เมื่อได้ผลลัพธ์กลับมา load balancer ส่งกลับไปยัง client ภายนอก **โดยซ่อนรายละเอียดภายในของ data center ทั้งหมด**ไว้จาก client (client เห็นแค่ endpoint เดียว)"}, {"type": "subheading", "content": "นวัตกรรม Protocol เฉพาะสำหรับ Data Center"}, {"type": "table", "content": "<table><tr><th>Layer</th><th>นวัตกรรม</th></tr><tr><td>Link layer</td><td>RoCE (RDMA over Converged Ethernet) — remote direct memory access ผ่าน Ethernet</td></tr><tr><td>Transport layer</td><td>ECN ใช้ใน congestion control เฉพาะทาง (DCTCP, DCQCN) รวมถึงการทดลอง hop-by-hop backpressure congestion control</td></tr><tr><td>Routing/Management</td><td>SDN ถูกใช้อย่างแพร่หลายทั้งภายในและระหว่าง data center ขององค์กร — จัดวาง service/data ที่เกี่ยวข้องกันให้อยู่ **rack เดียวกันหรือใกล้กัน** เพื่อลดการสื่อสารข้าม Tier-2/Tier-1</td></tr></table>"}, {"type": "warning", "content": "**ตัวอย่างจริง — Google Orion**: SDN control plane ของ Google ใช้ควบคุมทั้ง internal datacenter network (Jupiter) และ wide-area network (B4) — routing (รวม intradomain, iBGP) และ traffic engineering ถูก implement เป็น**application ที่รันอยู่บน Orion core** ไม่ใช่ routing protocol แบบดั้งเดิม — edge-to-edge flow-based control (เช่น CoFlow scheduling) ช่วยตอบสนอง SLA (Service Level Agreement) ตามสัญญา — **แม้แต่ congestion control บางส่วนก็ถูกจัดการผ่าน SDN แทน protocol แบบเดิม** — คำถามเปิด: \"protocol กำลังจะตายไหม?\" (are protocols dying?)"}]}, {"title": "สังเคราะห์ภาพรวม: A Day in the Life of a Web Request", "body": "บทสรุปทั้งเล่มนี้ผสมผสาน protocol จากทุก layer เข้าด้วยกัน ผ่านสถานการณ์จำลอง: นักศึกษาคนหนึ่งเชื่อมต่อ laptop เข้ากับเครือข่ายมหาวิทยาลัย แล้วขอ/รับหน้าเว็บ www.google.com", "blocks": [{"type": "subheading", "content": "ภาพรวมสถานการณ์"}, {"type": "note", "content": "Laptop เคลื่อนที่เข้ามาเชื่อมต่อเครือข่าย → ขอหน้าเว็บ `www.google.com` → ได้รับหน้าเว็บกลับมา — \"ฟังดูง่าย!\" แต่เบื้องหลังมี protocol จากทุก layer ทำงานประสานกันอย่างซับซ้อน"}, {"type": "subheading", "content": "ขั้นตอนที่ 1: เชื่อมต่อเข้าสู่อินเทอร์เน็ตด้วย DHCP"}, {"type": "note", "content": "Laptop ที่เพิ่งเชื่อมต่อต้องได้ IP address ของตัวเอง, IP address ของ first-hop router, และ IP address ของ DNS server — ใช้ **DHCP** เพื่อทำสิ่งนี้\n\nกระบวนการห่อหุ้ม (encapsulation): **DHCP request → UDP → IP → 802.3 Ethernet** — Ethernet frame ถูก broadcast (dest: `FF-FF-FF-FF-FF-FF`) บน LAN แล้วไปถึง router ที่รัน DHCP server — ที่ router: **Ethernet ถูก demux ขึ้นไปที่ IP, IP ถูก demux ขึ้นไปที่ UDP, UDP ถูก demux ขึ้นไปที่ DHCP** ตามลำดับชั้นปกติ"}, {"type": "note", "content": "**ขั้นตอนที่เหลือของกระบวนการทั้งหมด** (ซึ่งครอบคลุมเนื้อหาจากทุกบทที่ผ่านมา) ประกอบด้วย: ARP เพื่อหา MAC address ของ first-hop router, DNS query เพื่อแปลงชื่อ `www.google.com` เป็น IP address, TCP 3-way handshake เพื่อเปิด connection ไปยัง Google server, TLS handshake สำหรับการเข้ารหัส, HTTP GET request/response เพื่อขอหน้าเว็บจริง — ทั้งหมดนี้ต้องอาศัย routing (OSPF/BGP) ที่ทำงานอยู่เบื้องหลังตลอดเวลาเพื่อให้ packet เดินทางไปกลับระหว่าง laptop กับ Google server ได้สำเร็จ"}, {"type": "warning", "content": "สถานการณ์ \"ง่ายๆ\" นี้แสดงให้เห็นว่า **การขอหน้าเว็บเพียงหน้าเดียว** อาศัยการทำงานร่วมกันของ protocol จากทุก layer ทั้ง 5 ชั้น (application, transport, network, link, physical) — ทุก concept ที่เรียนมาตลอดทั้งเล่มไม่ได้แยกกันทำงานโดดๆ แต่ประสานกันอย่างแนบเนียนในทุกครั้งที่เราเปิดเว็บเบราว์เซอร์"}, {"type": "diagram", "layout": "flow", "title": "A Day in the Life: เส้นทาง Web Request ฉบับสมบูรณ์", "actors": ["DHCP\n(ขอ IP)", "ARP\n(หา Gateway MAC)", "DNS\n(หา IP เว็บ)", "TCP\nHandshake", "HTTP\nGET/Response"], "steps": [{"from": 0, "to": 1, "label": "ได้ IP แล้ว", "note": "ขั้นต่อไปหา MAC ของ default gateway"}, {"from": 1, "to": 2, "label": "รู้ Gateway MAC แล้ว", "note": "ส่งคำขอ DNS ผ่าน gateway"}, {"from": 2, "to": 3, "label": "ได้ IP เว็บไซต์แล้ว", "note": function renderTOC(){
  const toc = document.getElementById("tocList");
  toc.innerHTML = "";
  SECTIONS.forEach((sec, idx)=>{
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = "#section_"+idx;
    a.textContent = sec.title;
    a.dataset.idx = idx;
    li.appendChild(a);
    toc.appendChild(li);
  });
}

function escapeXml(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function fmtTspans(text, x){
  return String(text==null?"":text).split("\n").map(function(line,i){
    return '<tspan x="'+x+'" dy="'+(i===0?0:15)+'">'+escapeXml(line)+'</tspan>';
  }).join("");
}

function renderDiagramBlock(block, secIdx, blockIdx){
  const uid = "dg_"+secIdx+"_"+blockIdx;
  const layout = block.layout || "lifeline";
  const actors = block.actors || [];
  const steps = block.steps || [];
  const n = actors.length;
  const W = 680;
  const margin = 76;
  const nodesX = [];
  for(let i=0;i<n;i++){ nodesX.push(n===1 ? W/2 : margin + i*((W-2*margin)/Math.max(1,n-1))); }
  let inner = "";
  let H = 0;

  if(layout === "flow"){
    const boxY = 50, boxH = 46;
    const boxW = Math.min(128, Math.max(70,(W-2*margin)/Math.max(1,n-1)-14));
    H = 168;
    actors.forEach(function(a,i){
      inner += '<rect class="diagram-node-box" x="'+(nodesX[i]-boxW/2)+'" y="'+boxY+'" width="'+boxW+'" height="'+boxH+'" rx="7"></rect>';
      inner += '<text class="diagram-actor-label" x="'+nodesX[i]+'" y="'+(boxY+boxH/2-6)+'" text-anchor="middle">'+fmtTspans(a, nodesX[i])+'</text>';
    });
    steps.forEach(function(st,i){
      const x1 = nodesX[st.from]+boxW/2+3, x2 = nodesX[st.to]-boxW/2-3;
      const y = boxY+boxH/2;
      const pid = uid+"_p"+i, mid = uid+"_m"+i;
      inner += '<path id="'+pid+'" class="diagram-arrow-path" d="M '+x1+' '+y+' L '+x2+' '+y+'"></path>';
      inner += '<text class="diagram-arrow-label" x="'+((x1+x2)/2)+'" y="'+(boxY-12)+'" text-anchor="middle">'+escapeXml(st.label||"")+'</text>';
      inner += '<circle id="'+mid+'d" class="diagram-glow-dot" r="6.5" cx="'+x1+'" cy="'+y+'">'
             + '<animateMotion id="'+mid+'" begin="indefinite" dur="0.75s" fill="freeze" path="M '+x1+' '+y+' L '+x2+' '+y+'"></animateMotion>'
             + '<animate attributeName="opacity" begin="'+mid+'.begin" dur="0.05s" from="0" to="1" fill="freeze"></animate>'
             + '<animate attributeName="opacity" begin="'+mid+'.end" dur="0.5s" from="1" to="0" fill="freeze"></animate>'
             + '</circle>';
    });
  } else {
    const rowH = 64, topY = 12, boxH = 38;
    H = topY + boxH + steps.length*rowH + 26;
    const boxW = Math.min(160, Math.max(80,(W-2*margin)/Math.max(1,n-1)-10));
    actors.forEach(function(a,i){
      inner += '<rect class="diagram-node-box" x="'+(nodesX[i]-boxW/2)+'" y="'+topY+'" width="'+boxW+'" height="'+boxH+'" rx="7"></rect>';
      inner += '<text class="diagram-actor-label" x="'+nodesX[i]+'" y="'+(topY+boxH/2-6)+'" text-anchor="middle">'+fmtTspans(a, nodesX[i])+'</text>';
      inner += '<line class="diagram-lifeline" x1="'+nodesX[i]+'" y1="'+(topY+boxH)+'" x2="'+nodesX[i]+'" y2="'+(H-8)+'"></line>';
    });
    steps.forEach(function(st,i){
      const y = topY+boxH+22 + i*rowH;
      const x1 = nodesX[st.from], x2 = nodesX[st.to];
      const pid = uid+"_p"+i, mid = uid+"_m"+i;
      inner += '<path id="'+pid+'" class="diagram-arrow-path" d="M '+x1+' '+y+' L '+x2+' '+y+'"></path>';
      inner += '<text class="diagram-arrow-label" x="'+((x1+x2)/2)+'" y="'+(y-9)+'" text-anchor="middle">'+escapeXml(st.label||"")+'</text>';
      inner += '<circle id="'+mid+'d" class="diagram-glow-dot" r="6.5" cx="'+x1+'" cy="'+y+'">'
             + '<animateMotion id="'+mid+'" begin="indefinite" dur="0.75s" fill="freeze" path="M '+x1+' '+y+' L '+x2+' '+y+'"></animateMotion>'
             + '<animate attributeName="opacity" begin="'+mid+'.begin" dur="0.05s" from="0" to="1" fill="freeze"></animate>'
             + '<animate attributeName="opacity" begin="'+mid+'.end" dur="0.5s" from="1" to="0" fill="freeze"></animate>'
             + '</circle>';
    });
  }

  const svg = '<svg class="diagram-svg" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" preserveAspectRatio="xMidYMid meet">'+inner+'</svg>';

  let stepsHtml = '<ol class="diagram-steps-list">';
  steps.forEach(function(st,i){
    stepsHtml += '<li><span class="step-num">'+(i+1)+'</span><strong>'+escapeXml(st.label||"")+'</strong>'+(st.note?(' — '+escapeXml(st.note)):'')+'</li>';
  });
  stepsHtml += '</ol>';

  return '<div class="diagram-block" id="'+uid+'">'
       + '<h4><span>🔀 '+escapeXml(block.title||"")+'</span><button class="diagram-play-btn" data-diagram-id="'+uid+'">&#9654; เล่นแอนิเมชัน / Play animation</button></h4>'
       + '<div class="diagram-svg-wrap">'+svg+'</div>'
       + stepsHtml
       + '</div>';
}

function diagramPlay(containerId){
  const wrap = document.getElementById(containerId);
  if(!wrap) return;
  const svg = wrap.querySelector('svg');
  const paths = svg.querySelectorAll('.diagram-arrow-path');
  const dots = svg.querySelectorAll('.diagram-glow-dot');
  const items = wrap.querySelectorAll('.diagram-steps-list li');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  items.forEach(function(li){ li.classList.remove('step-active'); });
  if(reduced){ return; }
  const stepDur = 850;
  paths.forEach(function(p){
    const len = p.getTotalLength();
    p.style.transition = 'none';
    p.style.strokeDasharray = len;
    p.style.strokeDashoffset = len;
  });
  void svg.getBoundingClientRect();
  paths.forEach(function(p,i){
    setTimeout(function(){
      p.style.transition = 'stroke-dashoffset '+(stepDur-100)+'ms ease';
      p.style.strokeDashoffset = 0;
      const anim = dots[i] ? dots[i].querySelector('animateMotion') : null;
      if(anim){ try{ anim.beginElement(); }catch(e){} }
      if(items[i]) items[i].classList.add('step-active');
    }, i*stepDur);
  });
}

function wireDiagramButtons(){
  document.querySelectorAll('.diagram-play-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ diagramPlay(btn.dataset.diagramId); });
  });
}

function renderContent(){
  const main = document.getElementById("mainArea");
  main.innerHTML = "";
  SECTIONS.forEach((sec, idx)=>{
    const card = document.createElement("div");
    card.className = "section-card";
    card.id = "section_"+idx;
    let html = "<h2>"+sec.title+"</h2>";
    if(sec.body){
      html += '<div class="body-text">'+sec.body+'</div>';
    }
    (sec.blocks || []).forEach((block, bi)=>{
      if(block.type === "note"){
        html += '<div class="callout callout-note"><span class="callout-title">หมายเหตุ / Note</span>'+block.content+'</div>';
      } else if(block.type === "example"){
        html += '<div class="callout callout-example"><span class="callout-title">ตัวอย่าง / Example</span>'+block.content+'</div>';
      } else if(block.type === "warning"){
        html += '<div class="callout callout-warning"><span class="callout-title">ข้อควรระวัง / Warning</span>'+block.content+'</div>';
      } else if(block.type === "formula"){
        html += '<div class="callout callout-formula"><span class="callout-title">'+(block.label || "สูตร / Formula")+'</span>'+block.content+'</div>';
      } else if(block.type === "subheading"){
        html += '<h3>'+block.content+'</h3>';
      } else if(block.type === "table"){
        html += block.content;
      } else if(block.type === "image"){
        html += '<div class="image-block"><img src="'+block.src+'" alt="'+(block.alt || "")+'" loading="lazy">';
        if(block.caption){
          html += '<div class="image-caption">'+block.caption+'</div>';
        }
        html += '</div>';
      } else if(block.type === "diagram"){
        html += renderDiagramBlock(block, idx, bi);
      }
    });
    card.innerHTML = html;
    main.appendChild(card);
  });

  if(window.renderMathInElement){
    renderMathInElement(main, {
      delimiters: [
        {left: "$$", right: "$$", display: true},
        {left: "$", right: "$", display: false}
      ]
    });
  }
}

function setupScrollSpy(){
  const links = document.querySelectorAll(".toc-list a");
  const sections = document.querySelectorAll(".section-card");
  window.addEventListener("scroll", ()=>{
    let currentIdx = 0;
    sections.forEach((sec, idx)=>{
      const rect = sec.getBoundingClientRect();
      if(rect.top <= 100) currentIdx = idx;
    });
    links.forEach(l=>l.classList.remove("active"));
    if(links[currentIdx]) links[currentIdx].classList.add("active");
  });
}

function setupReveal(){
  const cards = document.querySelectorAll('.section-card');
  if(!('IntersectionObserver' in window)){
    cards.forEach(function(c){ c.classList.add('revealed'); });
    return;
  }
  const io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){ e.target.classList.add('revealed'); io.unobserve(e.target); }
    });
  }, {threshold:0.08, rootMargin:'0px 0px -60px 0px'});
  cards.forEach(function(c){ io.observe(c); });
}

let fontScale = parseFloat(localStorage.getItem('netbook_fontScale')||'1');
function setFontScale(v){
  fontScale = Math.min(1.3, Math.max(0.85, Math.round(v*10)/10));
  try{ localStorage.setItem('netbook_fontScale', fontScale); }catch(e){}
  document.documentElement.style.setProperty('--fontScale', fontScale);
}

function updateProgress(){
  const el = document.documentElement;
  const max = el.scrollHeight - el.clientHeight;
  const pct = max>0 ? (el.scrollTop/max*100) : 0;
  const bar = document.getElementById('readProgress');
  if(bar) bar.style.width = pct+'%';
  const btt = document.getElementById('backToTop');
  if(btt){ if(el.scrollTop>420){ btt.classList.add('show'); } else { btt.classList.remove('show'); } }
}

renderTOC();
renderContent();
setupScrollSpy();
setupReveal();
wireDiagramButtons();
setFontScale(fontScale);

window.addEventListener('scroll', updateProgress);
const backToTopBtn = document.getElementById('backToTop');
if(backToTopBtn){ backToTopBtn.addEventListener('click', function(){ window.scrollTo({top:0,behavior:'smooth'}); }); }
const fontMinusBtn = document.getElementById('fontMinus');
if(fontMinusBtn){ fontMinusBtn.addEventListener('click', function(){ setFontScale(fontScale-0.1); }); }
const fontPlusBtn = document.getElementById('fontPlus');
if(fontPlusBtn){ fontPlusBtn.addEventListener('click', function(){ setFontScale(fontScale+0.1); }); }

</script>
