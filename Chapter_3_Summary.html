<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Chapter 3: Transport Layer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>

:root{
  color-scheme: light;
  --paper:#F6F4EE;
  --bg:#F6F4EE;
  --panel:#FFFFFF;
  --border:#DCD6C7;
  --text:#2A2A26;
  --text-soft:#6B6558;
  --navy:#1B3A5C;
  --navy-deep:#0F2740;
  --accent:#1B3A5C;
  --accent2:#2B6CB0;
  --accent-soft:#EAF1FA;
  --correct:#256D46;
  --correct-soft:#E7F3EB;
  --incorrect:#B3341F;
  --incorrect-soft:#FBEAE6;
  --flag:#B7862C;
  --flag-soft:#FBF1DA;
  --unanswered:#9A9486;
  --fontScale:1;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:'Sarabun',"Segoe UI",sans-serif;
  background:var(--paper);
  color:var(--text);
}
header{
  background:var(--navy-deep);
  border-bottom:4px solid var(--flag);
  box-shadow:0 2px 10px rgba(15,39,64,0.25);
  padding:16px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  position:sticky;
  top:0;
  z-index:10;
}
header h1{
  font-size:18px;
  margin:0;
  color:#F2EFE6;
  font-weight:700;
}
header .subtitle{
  font-size:12.5px;
  color:#C9C2AE;
  margin-top:2px;
}
.header-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.layout{
  display:flex;
  max-width:1200px;
  margin:0 auto;
  gap:20px;
  padding:20px;
}
.sidebar{width:250px;flex-shrink:0;}
.sidebar-panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:6px;
  padding:16px;
  position:sticky;
  top:80px;
  box-shadow:0 2px 8px rgba(15,39,64,0.06);
  max-height:calc(100vh - 100px);
  overflow-y:auto;
}
.sidebar-panel h3{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--text-soft);
  margin:0 0 10px 0;
  font-weight:600;
}
.toc-list{list-style:none;margin:0;padding:0;}
.toc-list li{margin-bottom:2px;}
.toc-list a{
  display:block;
  padding:7px 10px;
  border-radius:4px;
  color:var(--text);
  text-decoration:none;
  font-size:13px;
  border-left:3px solid transparent;
}
.toc-list a:hover{background:var(--accent-soft);color:var(--accent2);}
.toc-list a.active{background:var(--accent-soft);color:var(--navy);border-left:3px solid var(--navy);font-weight:600;}
main{flex:1;min-width:0;}
.section-card{
  background:var(--panel);
  border:1px solid var(--border);
  border-left:4px solid var(--navy);
  border-radius:6px;
  padding:24px;
  margin-bottom:18px;
  box-shadow:0 2px 10px rgba(15,39,64,0.06);
  scroll-margin-top:80px;
}
.section-card h2{
  margin:0 0 14px 0;
  font-size:18px;
  color:var(--navy-deep);
  padding-bottom:10px;
  border-bottom:2px solid var(--border);
}
.section-card h3{
  font-size:15px;
  color:var(--navy);
  margin:20px 0 10px 0;
}
.section-card .body-text{
  font-size:14.5px;
  line-height:1.9;
  white-space:pre-wrap;
}
.callout{
  margin:16px 0;
  padding:14px 16px;
  border-radius:6px;
  border-left:4px solid;
  font-size:14px;
  line-height:1.8;
}
.callout-note{background:var(--accent-soft);border-color:var(--accent2);}
.callout-example{background:#F4F2E8;border-color:var(--flag);}
.callout-warning{background:var(--incorrect-soft);border-color:var(--incorrect);}
.callout-formula{
  background:var(--navy-deep);
  color:#EAF1FA;
  border-color:var(--flag);
  font-family:'JetBrains Mono',monospace;
  overflow-x:auto;
}
.callout-title{
  font-weight:700;
  font-size:12.5px;
  text-transform:uppercase;
  letter-spacing:.04em;
  margin-bottom:8px;
  display:block;
}
.callout-note .callout-title{color:var(--accent2);}
.callout-example .callout-title{color:var(--flag);}
.callout-warning .callout-title{color:var(--incorrect);}
.callout-formula .callout-title{color:#C9DCF0;}
.image-block{
  margin:18px 0;
  text-align:center;
}
.image-block img{
  max-width:100%;
  height:auto;
  border-radius:6px;
  border:1px solid var(--border);
  box-shadow:0 2px 10px rgba(15,39,64,0.08);
}
.image-block .image-caption{
  font-size:12.5px;
  color:var(--text-soft);
  margin-top:8px;
  font-style:italic;
}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:13.5px;}
table th{background:var(--navy-deep);color:#F2EFE6;padding:9px 12px;text-align:left;}
table td{padding:8px 12px;border-bottom:1px solid var(--border);}
table tr:nth-child(even) td{background:#F4F2E8;}
@media (max-width:800px){
  .layout{flex-direction:column;}
  .sidebar{width:100%;}
  .sidebar-panel{position:static;max-height:none;}
}

</style>
<style>

/* ===== Readability & diagram enhancements ===== */
#readProgress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--flag),var(--accent2));width:0%;z-index:999;transition:width .12s ease;}

#backToTop{
  position:fixed;bottom:24px;right:24px;width:44px;height:44px;border-radius:50%;
  background:var(--navy-deep);color:#F2EFE6;border:none;cursor:pointer;font-size:18px;
  box-shadow:0 4px 14px rgba(15,39,64,0.3);display:none;align-items:center;justify-content:center;
  z-index:998;opacity:0;transition:opacity .2s ease, transform .2s ease;
}
#backToTop:hover{transform:translateY(-2px);}
#backToTop.show{display:flex;opacity:1;}

#fontCtrl{display:flex;gap:6px;align-items:center;}
#fontCtrl button{
  border:1.5px solid rgba(242,239,230,0.5);background:rgba(255,255,255,0.9);color:var(--navy);
  width:32px;height:32px;border-radius:4px;font-size:13px;cursor:pointer;font-weight:700;
  font-family:'Sarabun',sans-serif;
}
#fontCtrl button:hover{background:#fff;}

.section-card{opacity:0;transform:translateY(14px);transition:opacity .55s ease, transform .55s ease;}
.section-card.revealed{opacity:1;transform:translateY(0);}
@media (prefers-reduced-motion: reduce){
  .section-card{opacity:1;transform:none;transition:none;}
}

.section-card .body-text{font-size:calc(14.5px * var(--fontScale)) !important;}
.section-card h2{font-size:calc(18px * var(--fontScale)) !important;}
.section-card h3{font-size:calc(15px * var(--fontScale)) !important;}
.callout{font-size:calc(14px * var(--fontScale)) !important;}
table{font-size:calc(13.5px * var(--fontScale)) !important;}

.callout-note .callout-title::before{content:"📝 ";}
.callout-example .callout-title::before{content:"💡 ";}
.callout-warning .callout-title::before{content:"⚠️ ";}
.callout-formula .callout-title::before{content:"∑ ";}

/* ==== Animated sequence / flow diagrams ==== */
.diagram-block{
  margin:20px 0;padding:16px 18px 14px;background:#FBFAF6;border:1px solid var(--border);
  border-radius:8px;
}
.diagram-block h4{
  margin:0 0 12px 0;font-size:calc(14.5px * var(--fontScale));color:var(--navy-deep);
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
}
.diagram-play-btn{
  border:1.5px solid var(--accent2);background:#fff;color:var(--accent2);padding:5px 12px;
  border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Sarabun',sans-serif;
  flex-shrink:0;
}
.diagram-play-btn:hover{background:var(--accent-soft);}
.diagram-svg-wrap{overflow-x:auto;}
.diagram-svg{display:block;margin:0 auto;min-width:420px;}
.diagram-actor-label{font-family:'Sarabun',sans-serif;font-size:11.5px;font-weight:600;fill:var(--navy-deep);}
.diagram-lifeline{stroke:var(--border);stroke-width:1.5;stroke-dasharray:3,3;}
.diagram-node-box{fill:var(--panel);stroke:var(--navy);stroke-width:1.3;}
.diagram-arrow-path{fill:none;stroke:var(--accent2);stroke-width:2;marker-end:url(#arrowhead);}
.diagram-arrow-label{font-family:'JetBrains Mono',monospace;font-size:10.5px;fill:var(--navy-deep);}
.diagram-glow-dot{fill:var(--flag);filter:url(#glowFilter);opacity:0;}
.diagram-steps-list{list-style:none;margin:12px 0 0;padding:0;font-size:calc(13px * var(--fontScale));line-height:1.7;}
.diagram-steps-list li{padding:6px 10px;border-left:3px solid transparent;border-radius:4px;transition:background .3s ease, border-color .3s ease;}
.diagram-steps-list li.step-active{background:var(--accent-soft);border-left-color:var(--flag);}
.diagram-steps-list .step-num{
  display:inline-block;width:20px;height:20px;border-radius:50%;background:var(--navy);color:#fff;
  text-align:center;line-height:20px;font-size:11px;margin-right:8px;font-family:'JetBrains Mono',monospace;
}

</style>
</head>

<filter id="glowFilter" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.2" result="blur"></feGaussianBlur><feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter>
</defs>
</svg>

: ใช้ข้อมูลใน header เพื่อส่ง segment ที่มาถึงไปยัง socket ที่ถูกต้อง\n\n**วิธี demux**: host รับ IP datagram ที่มี source/destination IP address — แต่ละ datagram บรรทุก transport-layer segment 1 ชิ้น ซึ่งมี source/destination port number — host ใช้**ทั้ง IP address และ port number**เพื่อนำ segment ไปยัง socket ที่ถูกต้อง"}, {"type": "table", "content": "<table><tr><th>Protocol</th><th>วิธี Demux</th></tr><tr><td>UDP (Connectionless)</td><td>ใช้ **destination port number เท่านั้น** — IP/UDP datagram ที่มี dest port เดียวกัน แต่ source IP/port ต่างกัน จะถูกส่งไปยัง socket เดียวกัน</td></tr><tr><td>TCP (Connection-oriented)</td><td>ใช้ **4-tuple ครบชุด**: source IP, source port, dest IP, dest port — server รองรับหลาย TCP socket พร้อมกันได้ แต่ละ socket ผูกกับ client ที่ต่างกัน แม้ dest IP/port จะเหมือนกันทุกตัว (เช่น web server พอร์ต 80) ก็ยังแยก socket ตาม source IP/port ของแต่ละ client ได้</td></tr></table>"}, {"type": "warning", "content": "Multiplexing/Demultiplexing เกิดขึ้นที่**ทุก layer** ของ protocol stack ไม่ใช่แค่ transport layer เท่านั้น — แต่ในบริบทนี้เรามุ่งเน้นที่ transport layer เป็นหลัก"}]}, {"title": "UDP: User Datagram Protocol [RFC 768]", "body": "UDP คือ **\"no frills\"** transport protocol ที่ให้บริการแบบ **best-effort** เท่านั้น แต่ก็มีข้อดีเฉพาะตัวที่ทำให้ยังจำเป็นต้องมีอยู่", "blocks": [{"type": "subheading", "content": "ทำไมยังต้องมี UDP?"}, {"type": "note", "content": "- **ไม่ต้องสร้าง connection** ก่อนส่งข้อมูล (ซึ่งอาจเพิ่ม RTT delay)\n- **เรียบง่าย**: ไม่ต้องเก็บ connection state ที่ sender/receiver\n- **header เล็ก** (มีเพียง 4 field)\n- **ไม่มี congestion control**: UDP สามารถส่งข้อมูลได้เร็วเท่าที่ต้องการ ทำงานต่อได้แม้เครือข่ายมีการ congest\n\nUDP ใช้กับ: streaming multimedia apps (ทนต่อการสูญเสียข้อมูล, sensitive กับ rate), DNS, SNMP, HTTP/3 — ถ้าต้องการ reliable transfer บน UDP (เช่น HTTP/3) จะต้องเพิ่ม reliability และ congestion control **เองที่ application layer**"}, {"type": "subheading", "content": "โครงสร้าง UDP Segment Header"}, {"type": "note", "content": "UDP header มีเพียง 4 field หลัก (รวม 8 byte): **source port #**, **dest port #**, **length** (ความยาวรวมของ UDP segment รวม header เป็น byte), **checksum** — ตามด้วย application data (payload)"}, {"type": "subheading", "content": "UDP Checksum: การตรวจจับข้อผิดพลาด"}, {"type": "formula", "label": "หลักการ Internet Checksum", "content": "เป้าหมาย: ตรวจจับ error (bit ที่ถูกพลิก) ใน segment ที่ส่งไป\n\n**ฝั่งส่ง**: มองเนื้อหาของ UDP segment (รวม header field และ IP address) เป็นลำดับของเลขจำนวนเต็ม 16 บิต แล้วบวกกัน (แบบ **one's complement sum**) ผลลัพธ์นำไปใส่ใน checksum field\n\n**ฝั่งรับ**: คำนวณ checksum ของ segment ที่ได้รับ แล้วเทียบกับค่าใน checksum field:\n- ไม่เท่ากัน → พบ error แน่นอน\n- เท่ากัน → ไม่พบ error (แต่ก็**อาจยังมี error ที่ตรวจไม่พบได้**)"}, {"type": "example", "content": "**ตัวอย่างการบวกเลข 16 บิตแบบ one's complement**:\n```\n  1110011001100110\n+ 1101010101010101\n-------------------\n 11011101110101011  (18 บิต — เกิด carry ออกนอก 16 บิต)\n```\nเมื่อมี carry ออกจากบิตซ้ายสุด (wraparound) ต้องนำ carry นั้นไปบวกกลับเข้าไปในผลรวม 16 บิตอีกครั้ง ได้ **sum** แล้วนำ sum ไปหา one's complement (กลับบิตทั้งหมด 0↔1) จะได้ค่า **checksum** สุดท้าย"}, {"type": "warning", "content": "**Internet checksum ให้การป้องกันที่ค่อนข้าง \"อ่อน\" (weak protection)** — เป็นไปได้ที่ตัวเลขจะเปลี่ยนไป (bit ถูกพลิก) แต่ **checksum กลับไม่เปลี่ยน** เลย เช่น ถ้าตัวเลขหนึ่งเพิ่มขึ้น 1 และอีกตัวลดลง 1 พอดี ผลรวมจะเท่าเดิม ทำให้ checksum ตรวจจับ error แบบนี้ไม่ได้ — นี่คือเหตุผลที่ layer อื่น (เช่น link layer มี CRC ที่แข็งแรงกว่า) ต้องมีกลไกตรวจสอบเพิ่มเติม"}, {"type": "subheading", "content": "สรุป UDP"}, {"type": "note", "content": "UDP เป็น protocol แบบ **\"no frills\"**: segment อาจสูญหายหรือมาไม่เรียงลำดับได้ (\"send and hope for the best\") แต่ก็มีข้อดี: ไม่ต้อง setup/handshaking (ไม่เสีย RTT), ทำงานต่อได้แม้ network service มีปัญหา, มี checksum ช่วยเรื่อง reliability บ้าง และแอปพลิเคชันสามารถสร้างฟังก์ชันเพิ่มเติมทับ UDP ได้ที่ application layer (เช่น HTTP/3)"}, {"type": "diagram", "layout": "lifeline", "title": "UDP: ส่งข้อมูลแบบไม่มีการเชื่อมต่อ (Connectionless)", "actors": ["Client", "Server"], "steps": [{"from": 0, "to": 1, "label": "UDP Datagram #1", "note": "ส่งทันทีไม่ต้อง handshake"}, {"from": 0, "to": 1, "label": "UDP Datagram #2", "note": "ส่งต่อโดยไม่รอ ACK — อาจถึงไม่ครบหรือไม่เรียงลำดับ"}]}]}, {"title": "หลักการของ Reliable Data Transfer (rdt)", "body": "หัวข้อนี้พัฒนา protocol การส่งข้อมูลแบบเชื่อถือได้ (rdt) ทีละขั้น โดยเริ่มจาก channel ที่สมบูรณ์แบบ แล้วค่อยๆ เพิ่มความซับซ้อนของ channel ที่ไม่น่าเชื่อถือ (bit error, packet loss) ใช้ **Finite State Machine (FSM)** ในการอธิบาย protocol แต่ละเวอร์ชัน", "blocks": [{"type": "subheading", "content": "แนวคิดพื้นฐาน: Reliable Channel บน Unreliable Channel"}, {"type": "note", "content": "Sender และ receiver **ไม่รู้ \"state\" ของกันและกัน** เลย เว้นแต่จะสื่อสารกันผ่านข้อความ (เปรียบเหมือนมีม่านกั้นระหว่างสองฝั่ง) — sender ไม่สามารถ \"มองทะลุ\" ไปดูได้ว่า receiver ได้รับ segment หรือไม่ ต้องอาศัย receiver ส่งสัญญาณกลับมาบอกเท่านั้น นี่คือเหตุผลว่าทำไมต้องมี **protocol** ระหว่างกัน\n\nความซับซ้อนของ rdt protocol ขึ้นกับลักษณะของ unreliable channel ว่า **สูญเสีย/บิดเบือน/เรียงลำดับผิด** ข้อมูลได้หรือไม่"}, {"type": "subheading", "content": "rdt 1.0: Channel ที่สมบูรณ์แบบ (ไม่มี error ไม่มี loss)"}, {"type": "note", "content": "ในกรณีนี้ ไม่ต้องมีกลไกพิเศษใดๆ — sender ส่งข้อมูลเข้า channel ตรงๆ, receiver อ่านข้อมูลจาก channel ตรงๆ"}, {"type": "subheading", "content": "rdt 2.0: Channel ที่มี Bit Error"}, {"type": "note", "content": "ใช้ **checksum** ตรวจจับ bit error แล้วใช้กลไก:\n- **ACK (Acknowledgement)**: receiver บอก sender ว่าได้รับ packet ถูกต้อง\n- **NAK (Negative Acknowledgement)**: receiver บอก sender ว่า packet มี error → sender **retransmit**\n\nใช้แบบ **stop-and-wait**: sender ส่ง packet 1 ตัวแล้วรอ response ก่อนส่งตัวถัดไป"}, {"type": "warning", "content": "**ข้อบกพร่องร้ายแรงของ rdt 2.0**: ถ้า ACK/NAK เอง**เกิดความเสียหาย** (corrupted) sender จะไม่รู้ว่าเกิดอะไรขึ้นที่ฝั่ง receiver — จะ retransmit เฉยๆ ก็ไม่ได้ เพราะอาจเป็นการส่ง**ซ้ำโดยไม่จำเป็น** (duplicate) ทำให้ receiver รับข้อมูลซ้ำ"}, {"type": "subheading", "content": "rdt 2.1 และ rdt 2.2: แก้ปัญหา ACK/NAK เสียหาย"}, {"type": "note", "content": "**rdt 2.1**: เพิ่ม **sequence number** (0 หรือ 1 พอ เพราะเป็น stop-and-wait) ลงใน packet — ถ้า sender ได้รับ ACK/NAK ที่เสียหาย จะ retransmit packet ปัจจุบันซ้ำ receiver ใช้ sequence number ตรวจจับ**ของซ้ำ** (duplicate) และไม่ deliver ข้อมูลซ้ำขึ้นไปชั้นบน\n\n**rdt 2.2**: เป็นเวอร์ชัน **NAK-free** — ใช้ ACK เท่านั้น โดย receiver จะส่ง ACK ของ packet ล่าสุดที่ได้รับถูกต้อง (ระบุ seq # ชัดเจน) หาก sender ได้รับ ACK ซ้ำ (duplicate ACK) จะตีความเหมือนได้รับ NAK คือ retransmit packet ปัจจุบัน — **TCP ใช้แนวทางนี้** (NAK-free)"}, {"type": "subheading", "content": "rdt 3.0: Channel ที่มีทั้ง Error และ Loss"}, {"type": "note", "content": "เพิ่มความสามารถรับมือกับ **packet ที่หายไปทั้งก้อน** (ทั้ง data หรือ ACK) โดยใช้ **countdown timer**: sender รอ ACK ใน \"เวลาที่สมเหตุสมผล\" ถ้าไม่ได้รับภายในเวลานั้นจะ **timeout แล้ว retransmit** — ถ้า packet/ACK แค่ล่าช้า (ไม่ได้หาย) การ retransmit จะกลายเป็นข้อมูลซ้ำ แต่ sequence number ที่มีอยู่แล้วช่วยจัดการปัญหานี้ได้"}, {"type": "formula", "label": "ประสิทธิภาพของ rdt3.0 (Stop-and-Wait) — Utilization", "content": "$$U_{sender} = \\dfrac{L/R}{RTT + L/R}$$\n\nโดย $L$ = ขนาด packet (บิต), $R$ = transmission rate, $RTT$ = round-trip time"}, {"type": "example", "content": "**ตัวอย่าง**: link 1 Gbps, propagation delay 15 ms (RTT ≈ 30 ms), packet 8000 บิต\n\n$$d_{trans} = \\dfrac{8000}{10^9} = 8\\ \\mu\\text{s} = 0.008\\ \\text{ms}$$\n\n$$U_{sender} = \\dfrac{0.008}{30 + 0.008} \\approx 0.00027 = 0.027\\%$$\n\n**ผลลัพธ์**: ใช้งาน link เพียง 0.027% เท่านั้น! Stop-and-wait ทำให้ประสิทธิภาพแย่มากบน link ความเร็วสูง — **protocol เองกลายเป็นตัวจำกัดประสิทธิภาพของโครงสร้างพื้นฐาน** ไม่ใช่ตัวเครือข่ายเอง"}, {"type": "subheading", "content": "Pipelining: เพิ่ม Utilization"}, {"type": "note", "content": "**Pipelining**: sender อนุญาตให้มี packet หลายตัว **\"in-flight\"** (ส่งไปแล้วแต่ยังไม่ได้รับ ACK) พร้อมกัน — ต้องขยาย range ของ sequence number และต้องมี buffer ที่ sender และ/หรือ receiver ตัวอย่าง: pipelining 3 packet พร้อมกันช่วยเพิ่ม utilization ได้ **3 เท่า** เมื่อเทียบกับ stop-and-wait — มี 2 รูปแบบหลักของ pipelined protocol คือ **Go-Back-N (GBN)** และ **Selective Repeat (SR)**"}]}, {"title": "Pipelined Protocols: Go-Back-N และ Selective Repeat", "body": "ทั้งสอง protocol ใช้หลักการ pipelining แต่ต่างกันที่วิธี ACK และการจัดการ retransmission", "blocks": [{"type": "subheading", "content": "Go-Back-N (GBN)"}, {"type": "note", "content": "**Sender**: มี \"window\" ขนาด $N$ ของ packet ที่ส่งไปแล้วแต่ยัง**ไม่ได้ ACK** ต่อเนื่องกัน ใช้ **cumulative ACK**: `ACK(n)` หมายถึง ACK ทุก packet ที่มี seq # ≤ n — เมื่อได้รับ ACK(n) จะเลื่อน window ไปเริ่มที่ n+1 มี timer สำหรับ packet ที่เก่าที่สุดที่ยังไม่ได้ ACK เมื่อ timeout(n) เกิดขึ้น จะ **retransmit packet n และทุก packet ที่มี seq # สูงกว่าในหน้าต่างทั้งหมด**\n\n**Receiver**: ใช้ **ACK-only** — ส่ง ACK สำหรับ packet ที่ถูกต้องล่าสุดที่**เรียงลำดับถูกต้อง** (highest in-order) เสมอ อาจสร้าง duplicate ACK ได้ จำแค่ `rcv_base` เมื่อได้รับ packet ที่ไม่เรียงลำดับ (out-of-order) จะ**ทิ้ง (discard)** ไม่ buffer แล้วส่ง ACK ซ้ำของ packet ล่าสุดที่ถูกต้อง"}, {"type": "example", "content": "**ตัวอย่าง GBN ในทางปฏิบัติ** (window N=4): sender ส่ง pkt0, pkt1, pkt2, pkt3 — สมมติ pkt2 หาย\n\n- receiver รับ pkt0 → ส่ง ack0\n- receiver รับ pkt1 → ส่ง ack1\n- receiver รับ pkt3 (แต่ pkt2 ยังไม่มา) → **ทิ้ง pkt3** แล้วส่ง ack1 ซ้ำ (เพราะ pkt1 คือ in-order ล่าสุด)\n- เมื่อ **timeout ของ pkt2** เกิดขึ้น → sender ต้อง **ส่งใหม่ทั้งหมดตั้งแต่ pkt2, pkt3, pkt4, pkt5** (Go-Back-N — ย้อนกลับไปเริ่มจาก packet ที่หาย) แม้ pkt3-5 เคยถูกส่งไปแล้วก็ตาม → เสียเวลามาก"}, {"type": "subheading", "content": "Selective Repeat (SR)"}, {"type": "note", "content": "**Receiver**: ACK **แยกทีละ packet** ที่ได้รับถูกต้อง (ไม่ใช่ cumulative) — packet ที่ไม่เรียงลำดับจะถูก **buffer ไว้** (ไม่ทิ้ง) เพื่อรอส่งขึ้นชั้นบนตามลำดับที่ถูกต้องภายหลัง\n\n**Sender**: มี (แนวคิด) timer แยกสำหรับแต่ละ packet ที่ยังไม่ได้ ACK — เมื่อ timeout จะ **retransmit เฉพาะ packet ตัวนั้นตัวเดียว** (ไม่ต้องส่งซ้ำทั้งหมดเหมือน GBN)"}, {"type": "example", "content": "**ตัวอย่าง SR ในทางปฏิบัติ** (window N=4): เหมือนสถานการณ์เดิม pkt2 หาย\n\n- receiver รับ pkt0, pkt1 → ส่ง ack0, ack1 ตามปกติ\n- receiver รับ pkt3 → **buffer ไว้** แล้วส่ง ack3\n- เมื่อ timeout ของ pkt2 → sender **retransmit เฉพาะ pkt2** เท่านั้น (ไม่แตะ pkt3, pkt4, pkt5 ที่ถูกส่งไปแล้วและได้ ACK แล้ว)\n- เมื่อ pkt2 มาถึง receiver → deliver pkt2, pkt3, pkt4, pkt5 (ที่ buffer ไว้) ขึ้นชั้นบนพร้อมกันทันที → **มีประสิทธิภาพกว่า GBN มาก**"}, {"type": "warning", "content": "**ปัญหาของ SR**: ถ้า window size ใหญ่เกินไปเมื่อเทียบกับขนาดพื้นที่ sequence number จะเกิดความกำกวม — receiver **ไม่สามารถแยกแยะ**ระหว่าง \"packet ใหม่\" กับ \"packet เก่าที่ถูกส่งซ้ำ (retransmit)\" ที่บังเอิญมี sequence number ตรงกัน (เพราะ sequence number วนกลับมาซ้ำ) เนื่องจาก receiver มองไม่เห็นฝั่ง sender เลย (เหมือนมีม่านกั้น) จึงต้องมีเงื่อนไข: **window size ≤ ครึ่งหนึ่งของขนาด sequence number space** จึงจะหลีกเลี่ยงปัญหานี้ได้"}, {"type": "diagram", "layout": "lifeline", "title": "Pipelined Transfer พร้อม Retransmission (Go-Back-N)", "actors": ["Sender", "Receiver"], "steps": [{"from": 0, "to": 1, "label": "ส่ง pkt0", "note": "ส่งแบบ pipeline ไม่รอ ACK ทีละตัว"}, {"from": 1, "to": 0, "label": "ACK0", "note": "receiver ตอบรับ pkt0"}, {"from": 0, "to": 1, "label": "ส่ง pkt1", "note": "ส่งต่อทันที"}, {"from": 0, "to": 1, "label": "ส่ง pkt2", "note": "note: ACK1 หายระหว่างทาง (ไม่ได้รับ)"}, {"from": 0, "to": 1, "label": "Timeout! ส่งซ้ำ pkt1", "note": "Go-Back-N: ต้องส่งซ้ำทุก packet ตั้งแต่จุดที่ time out"}, {"from": 0, "to": 1, "label": "ส่งซ้ำ pkt2", "note": "ส่งซ้ำต่อเนื่องจนกว่าจะได้ ACK ครบ"}]}]}, {"title": "TCP: โครงสร้าง Segment และ Sequence/ACK Numbers", "body": "TCP [RFC 793, 1122, 2018, 5681, 7323] เป็น protocol แบบ **point-to-point** (ผู้ส่ง 1 ราย ผู้รับ 1 ราย), **reliable in-order byte stream** (ไม่มี \"message boundary\"), **full duplex** (ข้อมูลไหลได้ 2 ทิศทางพร้อมกันในการเชื่อมต่อเดียว), และเป็น **connection-oriented** (ต้อง handshake ก่อนแลกเปลี่ยนข้อมูล)", "blocks": [{"type": "subheading", "content": "โครงสร้าง TCP Segment Header"}, {"type": "table", "content": "<table><tr><th>Field</th><th>ความหมาย</th></tr><tr><td>Source/Dest port #</td><td>ระบุ process ต้นทาง/ปลายทาง</td></tr><tr><td>Sequence number</td><td>นับจาก**ไบต์**ของ byte stream (ไม่ใช่นับ segment!) — คือหมายเลขไบต์แรกในข้อมูลของ segment นี้</td></tr><tr><td>Acknowledgement number</td><td>seq # ของ**ไบต์ถัดไปที่คาดว่าจะได้รับ** (คือ cumulative ACK)</td></tr><tr><td>A bit (ACK flag)</td><td>ระบุว่า segment นี้เป็น ACK</td></tr><tr><td>Receive window (rwnd)</td><td>จำนวนไบต์ที่ receiver ยินดีรับ — ใช้ทำ flow control</td></tr><tr><td>Head length</td><td>ความยาวของ TCP header</td></tr><tr><td>Flags (RST, SYN, FIN)</td><td>ใช้จัดการ connection (setup/teardown)</td></tr><tr><td>Flags (C, E)</td><td>ใช้แจ้งเตือน congestion (ECN)</td></tr><tr><td>Checksum</td><td>Internet checksum ตรวจ error</td></tr><tr><td>Options</td><td>ความยาวแปรผัน (เช่น MSS negotiation)</td></tr></table>"}, {"type": "example", "content": "**ตัวอย่าง Telnet scenario**: User พิมพ์ตัวอักษร 'C' บน Host A ที่เชื่อมต่อกับ Host B ผ่าน telnet\n\n1. Host A ส่ง `Seq=42, ACK=79, data='C'` (byte 'C' อยู่ที่ตำแหน่ง seq 42)\n2. Host B ตอบกลับด้วยการ ACK รับ 'C' และ echo กลับ: `Seq=79, ACK=43, data='C'` (ACK=43 คือ 42+1 หมายถึง \"ฉันรอไบต์ที่ 43 ถัดไป\")\n3. Host A ตอบกลับด้วยการ ACK รับ echoed 'C': `Seq=43, ACK=80` (ACK=80 คือ 79+1)\n\n**สังเกต**: ACK number ของ segment ที่ตอบกลับ = seq number ของ segment ที่กระตุ้นให้เกิด ACK นั้น **บวก 1** เสมอ (เพราะ ACK number คือ \"ไบต์ถัดไปที่คาดหวัง\")"}, {"type": "subheading", "content": "TCP RTT Estimation และ Timeout"}, {"type": "note", "content": "การตั้งค่า TCP timeout เป็นเรื่องยาก: ต้อง**นานกว่า RTT** แต่ RTT ก็แปรผันตลอดเวลา — ถ้าตั้ง**สั้นเกินไป**จะเกิด premature timeout (retransmit โดยไม่จำเป็น) ถ้าตั้ง**นานเกินไป**จะตอบสนองต่อ segment ที่หายไปช้าเกินไป"}, {"type": "formula", "label": "การประมาณค่า RTT ด้วย EWMA", "content": "**SampleRTT**: เวลาที่วัดได้จริงจากการส่ง segment จนถึงได้รับ ACK (ไม่นับ retransmission)\n\nเนื่องจาก SampleRTT แปรผันมาก จึงใช้ **Exponential Weighted Moving Average (EWMA)** เพื่อ \"ปรับให้เรียบ\":\n\n$$EstimatedRTT = (1-\\alpha) \\times EstimatedRTT + \\alpha \\times SampleRTT$$\n\nโดยทั่วไปใช้ $\\alpha = 0.125$ — อิทธิพลของ sample เก่าจะลดลงแบบ exponential"}, {"type": "formula", "label": "การคำนวณ Timeout Interval", "content": "$$DevRTT = (1-\\beta) \\times DevRTT + \\beta \\times |SampleRTT - EstimatedRTT|$$\n\n(โดยทั่วไป $\\beta = 0.25$) — DevRTT คือ EWMA ของค่าเบี่ยงเบนของ SampleRTT จาก EstimatedRTT\n\n$$TimeoutInterval = EstimatedRTT + 4 \\times DevRTT$$\n\nถ้า EstimatedRTT แปรปรวนมาก (DevRTT สูง) จะได้ \"safety margin\" ที่ใหญ่ขึ้นตามไปด้วย เพื่อลดโอกาสเกิด premature timeout"}]}, {"title": "TCP Reliable Data Transfer", "body": "TCP สร้าง reliable data transfer service บนบริการ IP ที่ไม่น่าเชื่อถือ โดยใช้ sequence number, cumulative ACK, และกลไก retransmission ที่ผสมผสาน timeout กับ fast retransmit", "blocks": [{"type": "subheading", "content": "TCP Sender และ Receiver แบบ Simplified"}, {"type": "note", "content": "**เหตุการณ์ที่ sender ต้องจัดการ**:\n1. **ข้อมูลมาจาก application**: สร้าง segment พร้อม seq # (คือหมายเลข byte-stream ของ byte แรกใน segment) → เริ่ม timer ถ้ายังไม่ทำงาน (timer คือของ segment ที่เก่าที่สุดที่ยังไม่ได้ ACK)\n2. **timeout**: retransmit segment ที่ทำให้เกิด timeout → restart timer\n3. **ได้รับ ACK**: ถ้า ACK รับรอง segment ที่ยังไม่เคยถูก ACK มาก่อน → update ว่าอะไรถูก ACK แล้ว → เริ่ม timer ใหม่ถ้ายังมี segment ที่ค้าง ACK อยู่"}, {"type": "subheading", "content": "TCP Receiver: การสร้าง ACK [RFC 5681]"}, {"type": "table", "content": "<table><tr><th>เหตุการณ์ที่ Receiver</th><th>การกระทำ</th></tr><tr><td>Segment มาถึงตามลำดับ (in-order), seq ตรงกับที่คาดหวัง, ข้อมูลก่อนหน้า ACK แล้วทั้งหมด</td><td>**Delayed ACK**: รอสูงสุด 500ms เผื่อมี segment ถัดไปมา ถ้าไม่มีจึงส่ง ACK</td></tr><tr><td>Segment มาถึงตามลำดับ, seq ตรงกับที่คาดหวัง, มี segment อื่นที่ค้าง ACK อยู่</td><td>ส่ง **cumulative ACK ทันที** (ACK ทั้งสอง segment รวมกัน)</td></tr><tr><td>Segment มาถึงไม่ตามลำดับ (seq สูงกว่าที่คาดหวัง — เจอ gap)</td><td>ส่ง **duplicate ACK ทันที** ระบุ seq # ของไบต์ถัดไปที่คาดหวัง</td></tr><tr><td>Segment ที่มาถึงเติมเต็ม gap ได้บางส่วนหรือทั้งหมด</td><td>ส่ง ACK **ทันที** ถ้า segment เริ่มต้นตรงกับขอบล่างของ gap</td></tr></table>"}, {"type": "subheading", "content": "TCP Fast Retransmit"}, {"type": "note", "content": "ปัญหา: การรอ **timeout** เพื่อ detect packet loss ใช้เวลานานเกินไป — TCP จึงใช้กลไกเสริม **Fast Retransmit**: ถ้า sender ได้รับ ACK ซ้ำ **3 ครั้ง** สำหรับข้อมูลเดิม (\"triple duplicate ACK\") จะ**สันนิษฐานว่า segment ที่มี seq # เล็กที่สุดที่ยังไม่ได้ ACK นั้นหายไป** แล้ว retransmit ทันที **โดยไม่ต้องรอ timeout**"}, {"type": "example", "content": "**ตัวอย่าง Fast Retransmit**: sender ส่ง 5 segment ติดกัน สมมติ segment ตัวที่ 2 หายไป\n\n- receiver ได้รับ segment 1 → ส่ง ACK รอ segment 2\n- segment 3, 4, 5 มาถึง (แต่ segment 2 ยังไม่มา) → receiver ส่ง **duplicate ACK** (ACK เดิม) ซ้ำ 3 ครั้ง (สำหรับ segment 3, 4, 5)\n- sender เห็น ACK ซ้ำ 3 ครั้ง → รู้ว่า segment ที่ถัดจาก ACK นั้นน่าจะหายไป (เพราะมี segment สูงกว่าถึง 3 ตัวมาถึง receiver แล้ว) → **retransmit ทันที** โดยไม่รอ timeout"}, {"type": "subheading", "content": "การจัดการ Loss/ACK ที่ล่าช้าหรือหาย"}, {"type": "note", "content": "**Lost ACK scenario**: segment ถูกส่งแต่ ACK หาย → เมื่อ timeout จะ retransmit segment เดิม แล้วรอบนี้ ACK มาถึงปกติ\n\n**Premature timeout**: segment 2 ตัวถูกส่งและ ACK ตามปกติ แต่ timer ของ segment แรก timeout ก่อนเวลาอันควร (ทั้งที่จริงๆ ไม่ได้หาย) → sender retransmit segment แรกซ้ำ → receiver (ที่ได้รับ segment ทั้ง 2 ตัวแล้ว) จะตอบด้วย**cumulative ACK ครอบคลุมทั้ง 2 segment** ไม่ใช่แค่ segment แรกที่ถูกส่งซ้ำ\n\n**Cumulative ACK ชดเชย ACK ที่หาย**: ถ้า ACK ของ segment แรกหายไป แต่ ACK (cumulative) ของ segment ที่สองมาถึง sender ก็จะรู้ว่าทั้ง 2 segment ถูกส่งถึงเรียบร้อยแล้ว โดยไม่ต้องรอ ACK ของ segment แรกเลย"}]}, {"title": "TCP Flow Control และ Connection Management", "body": "**Flow control** เป็นกลไกที่ต่างจาก congestion control — flow control ป้องกันไม่ให้ **sender ส่งเร็วเกินกว่าที่ receiver รับไหว** (ปัญหาระหว่าง sender 1 ราย กับ receiver 1 ราย) ในขณะที่ congestion control ป้องกันไม่ให้ **sender หลายรายส่งเร็วเกินกว่าที่เครือข่ายรับไหว**", "blocks": [{"type": "subheading", "content": "กลไก Flow Control ของ TCP"}, {"type": "note", "content": "TCP receiver \"advertise\" พื้นที่ buffer ที่ว่างผ่าน field **rwnd (receive window)** ใน TCP header — ขนาด `RcvBuffer` ถูกตั้งผ่าน socket option (ค่า default ทั่วไปคือ 4096 byte แต่ OS สมัยใหม่ปรับขนาดอัตโนมัติได้) sender จะ**จำกัดปริมาณข้อมูลที่ยังไม่ได้ ACK (\"in-flight\") ให้ไม่เกินค่า rwnd ที่ได้รับ** เพื่อรับประกันว่า receive buffer จะไม่ overflow"}, {"type": "warning", "content": "**Flow control ≠ Congestion control**: Flow control แก้ปัญหา \"receiver รับไม่ทัน\" (เหมือนวลีภาษาอังกฤษ \"no one can drink from a firehose\") ส่วน congestion control แก้ปัญหา \"เครือข่ายรับภาระไม่ไหว\" — ทั้งสองใช้กลไกคนละแบบและแก้ปัญหาคนละระดับ"}, {"type": "subheading", "content": "TCP Connection Management: 3-Way Handshake"}, {"type": "note", "content": "ก่อนแลกเปลี่ยนข้อมูล sender/receiver ต้อง **handshake** เพื่อ (1) ตกลงกันว่าทั้งคู่ต้องการสร้าง connection และ (2) ตกลง connection parameter (เช่น initial sequence number)\n\n**ทำไมต้อง 3-way ไม่ใช่ 2-way?** — 2-way handshake มีปัญหา: หาก message สูญหายหรือถูกส่งซ้ำ (retransmit) อาจเกิด **half-open connection** (server เชื่อว่าเชื่อมต่อแล้วแต่ client ไม่รู้เรื่อง) หรือแย่กว่านั้นคือ **data ซ้ำถูกยอมรับ** เพราะ request เก่าที่ถูกส่งซ้ำมาถึงหลัง connection เดิมปิดไปแล้ว"}, {"type": "table", "content": "<table><tr><th>ขั้นตอน</th><th>ฝ่ายที่ทำ</th><th>รายละเอียด</th></tr><tr><td>1. SYN</td><td>Client → Server</td><td>เลือก initial seq # x, ส่ง TCP segment ที่มี `SYNbit=1, Seq=x` (ไม่มีข้อมูล) — client เข้าสถานะ SYN_SENT</td></tr><tr><td>2. SYNACK</td><td>Server → Client</td><td>server จัดสรร buffer, เลือก initial seq # y, ตอบกลับด้วย `SYNbit=1, Seq=y, ACKbit=1, ACKnum=x+1` — server เข้าสถานะ SYN_RCVD</td></tr><tr><td>3. ACK</td><td>Client → Server</td><td>client ส่ง `ACKbit=1, ACKnum=y+1` (segment นี้อาจพ่วงข้อมูลจริงไปด้วยได้เลย) — ทั้งสองฝั่งเข้าสถานะ **ESTAB** (established)</td></tr></table>"}, {"type": "image", "src": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wAARCAHKArwDASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAABAECAwUGBwAI/8QARhAAAgECBQIEAwYFAgYBAwIHAQIDBBEABRIhMUFRBhMiYRRxgQcjMpGhsUJSwdHwFeEWJDNicvFDFzSCCCVTkiayRHOi/8QAGgEAAwEBAQEAAAAAAAAAAAAAAAECAwQFBv/EACoRAAICAgICAwEAAgICAwAAAAABAhEhMQMSQVEEEyJhBXEyQhSRFSNS/9oADAMBAAIRAxEAPwD54EsqyiYO4kuDqB3v3vh9XUvVzNNIBrfdiosCe9sMaP8A3vhunkX+WEB5Ta549h1wWlUslMYpDYD8IA2wFazYcDsDgAmjqJI5UcltK7XXkjFzlrfEPLJCzqyIQkaDc32Py2vih1eni64LyeWeLNImp5FRidN5PwgEb3wqGjWJks2bOzS1reVoBiRt5JbWBAX27nFG6S0MzKxBJX0srBlKE87d8Hw5jV5VntFVKqPUxBXKzNqQgi+k9wRbbHmjpM41PTKsFVOTIkC/hjB30D8th74ENoq1mnjk8+O7eWNIa17DgYFjopnYNo2H82xOLmilhppjEpaWUnSWXj2FsEVVHXVs3w8YYzH8K9x7d8DYqKEQSUvrJGx2Gxx5KiZyHJDacRCmYTss2oFT6u4xZQUy+WUZNLLbe3P+2KQjrn2N+IPD8yNlviOKlikpx51NKbp5t9ij22Y8EE72vzbHXvENf4R+GNU+a5fllVDGGKNKoup4Fh122I3x8n0b1uUVkVZR1UsE8JJSSI6WU2tcH5G2IJKiWWZ5nZmkclmdt2JPUk7k4iSVlpSo7bXfaH4aH/Tr3YgGwSEsSfYYyNb40aefVQxyNJc+udFCn2tzjH5fltfMPiVoKqWLazJAzKfrbFtTZRm9dOEpcnrpHNtvJI26c2xmuq2bfW35BMx8Z5vMTEskdIqk2SCNV0njnnGfnzeqZneWaSR2FtbNcjtvjTZp9n3izzpJxkVR/MVDKWH0vfGQrKWakqJaaqieGeJtDxyCzKe1sdalFqkcrhJPIZSzZjOgaSY+U5ClgwFhh09IVheUSKKiNtQ0iw56YBpKlYk8mQkL0bscWU8yJRuxkRmcabLbjGDtM64qLidRyP7XqXMoWpPE "subheading", "content": "การปิด TCP Connection"}, {"type": "note", "content": "Client และ server แต่ละฝั่งปิด connection ของตัวเองแยกกัน โดยส่ง TCP segment ที่มี **FIN bit = 1** — อีกฝั่งตอบกลับด้วย ACK เมื่อได้รับ FIN, ACK นั้นสามารถรวมกับ FIN ของตัวเองได้เลย (piggyback) รองรับกรณี **FIN พร้อมกันทั้งสองฝั่ง** ได้เช่นกัน — ฝั่งที่ปิดก่อนจะเข้าสถานะ TIMED_WAIT รออีก 2×MSL (Maximum Segment Lifetime) ก่อนปิดสนิท เพื่อรองรับกรณี FIN/ACK ที่อาจถูกส่งซ้ำมาช้า"}, {"type": "diagram", "layout": "lifeline", "title": "TCP Three-Way Handshake (การจับมือสามทาง)", "actors": ["Client\n(ไคลเอนต์)", "Server\n(เซิร์ฟเวอร์)"], "steps": [{"from": 0, "to": 1, "label": "SYN (seq=x)", "note": "ไคลเอนต์ขอเริ่มการเชื่อมต่อ / requests to open a connection"}, {"from": 1, "to": 0, "label": "SYN + ACK (seq=y, ack=x+1)", "note": "เซิร์ฟเวอร์ตอบรับและขอเชื่อมต่อกลับ / acknowledges and synchronizes"}, {"from": 0, "to": 1, "label": "ACK (ack=y+1)", "note": "ไคลเอนต์ยืนยัน เริ่มส่งข้อมูลได้ / confirms, data transfer begins"}]}, {"type": "diagram", "layout": "lifeline", "title": "การปิด TCP Connection (4-Way Termination)", "actors": ["Client", "Server"], "steps": [{"from": 0, "to": 1, "label": "FIN", "note": "ไคลเอนต์ขอปิดการเชื่อมต่อ"}, {"from": 1, "to": 0, "label": "ACK", "note": "เซิร์ฟเวอร์รับทราบ"}, {"from": 1, "to": 0, "label": "FIN", "note": "เซิร์ฟเวอร์ขอปิดฝั่งของตัวเองเช่นกัน"}, {"from": 0, "to": 1, "label": "ACK", "note": "ไคลเอนต์ยืนยัน ปิด connection สมบูรณ์"}]}]}, {"title": "หลักการของ Congestion Control", "body": "**Congestion** หมายถึง \"มี sender จำนวนมากเกินไปที่ส่งข้อมูลเร็วเกินไปสำหรับเครือข่ายที่จะรับมือไหว\" อาการที่พบ: delay ยาวนาน (queueing ที่ router buffer) และ packet loss (buffer overflow ที่ router)", "blocks": [{"type": "subheading", "content": "ต้นทุน (Costs) ของ Congestion — Insight จาก 3 Scenario"}, {"type": "note", "content": "**Scenario 1** (router buffer ไม่จำกัด, ไม่มี retransmission): เมื่อ arrival rate ($\\lambda_{in}$) เข้าใกล้ $R/2$ (ครึ่งหนึ่งของ capacity เพราะมี 2 flow แชร์กัน) → **delay จะเพิ่มขึ้นอย่างมาก** (เข้าใกล้อนันต์) แม้ throughput สูงสุดจะเท่ากับ $R/2$ พอดี\n\n**Scenario 2** (router buffer จำกัด, ต้อง retransmit เมื่อ packet หาย): แม้ในกรณีอุดมคติที่สุด (รู้แน่ชัดว่า packet ไหนหาย) throughput สูงสุดที่ทำได้ก็ยังคง $R/2$ แต่**การ retransmit ที่ไม่จำเป็น** (เช่นจาก premature timeout) จะทำให้ \"เสีย\" capacity ไปเปล่าๆ — ยิ่งใกล้ congestion ยิ่งต้องทำงานมากขึ้น (ส่งซ้ำ) เพื่อให้ได้ throughput เท่าเดิม\n\n**Scenario 3** (multi-hop path, มี sender 4 ราย): เมื่อ arrival rate ของ flow หนึ่งเพิ่มขึ้นจนทำให้เกิด congestion ที่ router ต้นทาง (upstream) แล้วถูก drop ที่ router ถัดไป (downstream) — **capacity และ buffer ที่ router ต้นทางใช้ไปแล้วสำหรับ packet นั้นถูกทิ้งเปล่า** เพราะ packet ไม่มีทางไปถึงปลายทางอยู่ดี นี่คือต้นทุนที่ซ่อนอยู่ของ congestion"}, {"type": "table", "content": "<table><tr><th>Insight</th><th>รายละเอียด</th></tr><tr><td>1</td><td>throughput ไม่มีทางเกิน capacity ของเครือข่ายได้</td></tr><tr><td>2</td><td>delay เพิ่มขึ้นเมื่อเข้าใกล้ capacity</td></tr><tr><td>3</td><td>loss/retransmission ลด throughput ที่ใช้งานได้จริง (effective throughput)</td></tr><tr><td>4</td><td>retransmission ที่ไม่จำเป็น (unneeded duplicates) ยิ่งลด throughput ลงไปอีก</td></tr><tr><td>5</td><td>capacity/buffer ต้นทางที่ใช้ไปกับ packet ที่สุดท้ายถูก drop ที่อื่น = เสียเปล่าโดยสิ้นเชิง</td></tr></table>"}, {"type": "subheading", "content": "แนวทางควบคุม Congestion 2 แบบ"}, {"type": "table", "content": "<table><tr><th>แนวทาง</th><th>วิธีการ</th><th>ตัวอย่าง</th></tr><tr><td>End-end congestion control</td><td>ไม่มี feedback ชัดเจนจากเครือข่าย — sender **อนุมาน**ภาวะ congestion จาก loss/delay ที่สังเกตได้เอง</td><td>TCP (แบบดั้งเดิม)</td></tr><tr><td>Network-assisted congestion control</td><td>router ให้ feedback โดยตรงแก่ host ที่ส่ง/รับ (บอกระดับ congestion หรือกำหนด sending rate ให้ชัดเจน)</td><td>TCP ECN, ATM, DECbit</td></tr></table>"}]}, {"title": "TCP Congestion Control: AIMD, Slow Start และ CUBIC", "body": "TCP ใช้แนวทาง **end-end congestion control** โดยปรับ sending rate ผ่านตัวแปร **cwnd (congestion window)** ตามภาวะ congestion ที่สังเกตได้จาก packet loss", "blocks": [{"type": "subheading", "content": "AIMD: Additive Increase, Multiplicative Decrease"}, {"type": "note", "content": "หลักการ: sender เพิ่ม sending rate ไปเรื่อยๆ จนกว่าจะเกิด packet loss (สัญญาณของ congestion) จากนั้นลด rate ลง\n\n- **Additive Increase**: เพิ่ม sending rate ทีละ **1 MSS (Maximum Segment Size) ทุกๆ 1 RTT** จนกว่าจะพบ loss\n- **Multiplicative Decrease**: เมื่อพบ loss ให้**ลด sending rate ลงครึ่งหนึ่งทันที**\n\nพฤติกรรมนี้เรียกว่า **\"AIMD sawtooth\"** (รูปฟันเลื่อย) เพราะ rate จะค่อยๆ เพิ่มแบบเชิงเส้นแล้วตกฮวบทันทีเมื่อเจอ loss ซ้ำไปเรื่อยๆ — เป็นการ \"probe\" หา bandwidth ที่ใช้ได้"}, {"type": "warning", "content": "**รายละเอียดของ Multiplicative Decrease**: ขึ้นกับวิธีตรวจพบ loss\n- ตรวจพบผ่าน **triple duplicate ACK** (TCP Reno) → cwnd ลดลงเหลือ**ครึ่งหนึ่ง**\n- ตรวจพบผ่าน **timeout** (TCP Tahoe) → cwnd ลดลงเหลือ **1 MSS** (รุนแรงกว่ามาก)\n\n**ทำไมต้องเป็น AIMD?** เพราะเป็น distributed asynchronous algorithm ที่พิสูจน์แล้วว่า optimize อัตราการไหลของ flow ทั้งเครือข่ายได้ และมีคุณสมบัติ stability ที่ดี"}, {"type": "formula", "label": "ข้อจำกัดของ Sending Rate ผ่าน cwnd", "content": "TCP ส่งข้อมูลแบบ \"ส่ง cwnd byte แล้วรอ RTT เพื่อรับ ACK แล้วค่อยส่งต่อ\":\n\n$$\\text{TCP rate} \\approx \\dfrac{cwnd}{RTT} \\text{ bytes/sec}$$\n\nและ TCP sender จำกัดปริมาณข้อมูล in-flight ไม่ให้เกิน cwnd:\n\n$$LastByteSent - LastByteAcked \\leq cwnd$$\n\n`cwnd` ถูกปรับแบบ dynamic ตามภาวะ congestion ที่สังเกตได้ — นี่คือกลไกหลักของ TCP congestion control"}, {"type": "subheading", "content": "TCP Slow Start"}, {"type": "note", "content": "เมื่อ connection เริ่มต้นใหม่ TCP จะเพิ่ม sending rate แบบ **exponential** (ไม่ใช่ linear แบบ additive increase) จนกว่าจะเจอ loss event แรก:\n\n- เริ่มต้นด้วย `cwnd = 1 MSS`\n- **เพิ่ม cwnd เป็น 2 เท่าทุกๆ 1 RTT** (ทำได้โดยเพิ่ม cwnd ทีละ 1 MSS ทุกครั้งที่ได้รับ ACK — ผลรวมต่อ RTT คือ 2 เท่า)\n\nสรุป: อัตราเริ่มต้นช้า แต่**เร่งขึ้นแบบ exponential อย่างรวดเร็ว**"}, {"type": "subheading", "content": "จาก Slow Start สู่ Congestion Avoidance"}, {"type": "note", "content": "คำถาม: เมื่อไหร่ที่ควรเปลี่ยนจากการเพิ่มแบบ exponential (slow start) เป็นแบบ linear (congestion avoidance)?\n\n**คำตอบ**: เมื่อ `cwnd` มีค่าถึง **ครึ่งหนึ่ง**ของค่าก่อนเกิด timeout ครั้งล่าสุด — implement ผ่านตัวแปร `ssthresh` (slow start threshold): เมื่อเกิด loss event, `ssthresh` จะถูกตั้งเป็น `cwnd/2` (ค่า cwnd ก่อนเกิด loss) จากนั้นถ้า `cwnd < ssthresh` จะยังอยู่ใน slow start (เพิ่มแบบ exponential) แต่ถ้า `cwnd > ssthresh` จะเข้าสู่ **congestion avoidance** (เพิ่มแบบ linear หรือ additive increase)"}, {"type": "subheading", "content": "สรุป State Machine ของ TCP Congestion Control"}, {"type": "table", "content": "<table><tr><th>State</th><th>เงื่อนไข/Event</th><th>การกระทำ</th></tr><tr><td>Slow Start</td><td>เริ่มต้น connection หรือหลัง timeout</td><td>`cwnd = 1 MSS`, `ssthresh = 64KB`, เพิ่ม cwnd แบบ exponential เมื่อได้รับ new ACK</td></tr><tr><td>Slow Start → Congestion Avoidance</td><td>`cwnd > ssthresh`</td><td>เปลี่ยนไปเพิ่มแบบ linear (1 MSS ต่อ RTT)</td></tr><tr><td>Congestion Avoidance</td><td>ได้รับ new ACK</td><td>`cwnd = cwnd + MSS × (MSS/cwnd)` (เพิ่มทีละน้อยต่อ ACK รวมแล้วเท่ากับ 1 MSS ต่อ RTT)</td></tr><tr><td>ใดๆ → Slow Start</td><td>เกิด timeout</td><td>`ssthresh = cwnd/2`, `cwnd = 1 MSS`, retransmit segment ที่หาย</td></tr><tr><td>ใดๆ → Fast Recovery</td><td>`dupACKcount == 3` (triple duplicate ACK)</td><td>`ssthresh = cwnd/2`, `cwnd = ssthresh + 3`, retransmit segment ที่หาย</td></tr><tr><td>Fast Recovery → Congestion Avoidance</td><td>ได้รับ new ACK</td><td>`cwnd = ssthresh`</td></tr></table>"}, {"type": "subheading", "content": "TCP CUBIC: ทางเลือกที่ดีกว่า AIMD"}, {"type": "note", "content": "แนวคิด: หลังจากลด cwnd ลงครึ่งหนึ่งเมื่อเจอ loss ที่ $W_{max}$ (ค่า cwnd ตอนที่เกิด loss) มีความเป็นไปได้สูงว่า**สภาพ congestion ของ bottleneck link ยังไม่เปลี่ยนไปมากนัก** — ดังนั้นแทนที่จะเพิ่มแบบเชิงเส้นสม่ำเสมอเหมือน AIMD, CUBIC จะ:\n\n- **เพิ่มเร็ว**ในช่วงแรก (ให้กลับไปใกล้ $W_{max}$ อย่างรวดเร็ว)\n- **เพิ่มช้าลง (ระมัดระวัง)** เมื่อใกล้ถึง $W_{max}$\n\nโดยใช้ฟังก์ชัน **cube (กำลังสาม)** ของระยะห่างระหว่างเวลาปัจจุบันกับจุดเวลา $K$ (จุดที่คาดว่า cwnd จะถึง $W_{max}$) — ยิ่งไกลจาก $K$ ยิ่งเพิ่มเร็ว ยิ่งใกล้ $K$ ยิ่งเพิ่มช้า (ระมัดระวัง)\n\n**TCP CUBIC เป็นค่า default ใน Linux และเป็น TCP ที่นิยมใช้มากที่สุดในเว็บเซิร์ฟเวอร์ยอดนิยม** — ให้ throughput สูงกว่า classic TCP (AIMD) ในหลายสถานการณ์"}]}, {"title": "Bottleneck Link, Delay-based Congestion Control และ ECN", "body": "การทำความเข้าใจ congestion ควรโฟกัสที่ **bottleneck link** — ลิงก์ที่ \"คอขวด\" ที่สุดบนเส้นทาง end-to-end", "blocks": [{"type": "subheading", "content": "TCP กับ Bottleneck Link"}, {"type": "note", "content": "TCP (ทั้ง classic และ CUBIC) จะเพิ่ม sending rate ไปเรื่อยๆ จนกว่าจะเกิด packet loss ที่ output ของ router ใดสักตัว — นั่นคือ **bottleneck link** (queue เกือบไม่ว่างเลย บางครั้ง overflow จนเกิด packet loss)\n\n**Insight สำคัญ**: เมื่อ bottleneck link เกิด congestion แล้ว **การเพิ่ม TCP sending rate ต่อไปจะไม่ทำให้ end-end throughput เพิ่มขึ้นอีก** — แต่กลับจะทำให้ **RTT ที่วัดได้เพิ่มขึ้น** แทน (เพราะ queue ที่ bottleneck ยาวขึ้น) เป้าหมายที่แท้จริงคือ **\"keep the end-end pipe just full, but not fuller\"** (เติมท่อให้เต็มพอดี ไม่ล้น)"}, {"type": "subheading", "content": "Delay-based TCP Congestion Control"}, {"type": "formula", "label": "แนวคิด Delay-based Approach", "content": "$$\\text{measured throughput} = \\dfrac{\\text{จำนวนไบต์ที่ส่งใน RTT ล่าสุด}}{RTT_{measured}}$$\n\nให้ $RTT_{min}$ = ค่า RTT ต่ำสุดที่เคยวัดได้ (แทนสภาพ path ที่ไม่มี congestion) — throughput ที่ไม่มี congestion เมื่อใช้ congestion window $cwnd$ คือ $cwnd/RTT_{min}$\n\n- ถ้า measured throughput **ใกล้เคียงมาก** กับค่าที่ไม่มี congestion → **เพิ่ม cwnd แบบ linear** (เพราะ path ยังไม่ congest)\n- ถ้า measured throughput **ต่ำกว่ามาก** → **ลด cwnd แบบ linear** (เพราะ path กำลัง congest)"}, {"type": "note", "content": "แนวทางนี้ช่วยให้ควบคุม congestion ได้**โดยไม่ต้องบังคับให้เกิด packet loss** ก่อน (ต่างจาก AIMD/CUBIC ที่ต้องรอให้เกิด loss ก่อนถึงจะรู้ว่า congest) — เป้าหมายคือเพิ่ม throughput สูงสุด (\"keep the pipe full\") พร้อมกับรักษา delay ให้ต่ำ (\"but not fuller\") **BBR** ของ Google เป็นตัวอย่างที่ใช้แนวทาง delay-based นี้ (deploy บน backbone network ภายในของ Google)"}, {"type": "subheading", "content": "Explicit Congestion Notification (ECN)"}, {"type": "note", "content": "เป็นตัวอย่างของ **network-assisted congestion control** ที่ TCP มักใช้ในทางปฏิบัติ: ใช้ 2 บิตใน field ToS ของ IP header ที่ **router จะทำเครื่องหมาย (mark)** เพื่อบ่งบอกภาวะ congestion (นโยบายการ mark กำหนดโดยผู้ดูแลเครือข่ายเอง) — สัญญาณ congestion จะถูกส่งไปถึงปลายทาง แล้ว destination จะตั้ง **ECE bit** ใน ACK segment เพื่อแจ้งเตือน sender กลับมา — กลไกนี้ต้องอาศัยทั้ง IP (mark ECN bit) และ TCP (mark C, E bit) ทำงานร่วมกัน"}]}, {"title": "TCP Fairness", "body": "**เป้าหมายของ fairness**: ถ้ามี $K$ TCP session แชร์ bottleneck link ที่มี bandwidth $R$ ร่วมกัน แต่ละ session ควรได้ **average rate = R/K** โดยประมาณ", "blocks": [{"type": "subheading", "content": "TCP แฟร์หรือไม่?"}, {"type": "note", "content": "**คำตอบ**: TCP แฟร์**ภายใต้สมมติฐานอุดมคติ** เท่านั้น — คือทุก session มี **RTT เท่ากัน** และมีจำนวน session คงที่อยู่ใน congestion avoidance เพียงอย่างเดียว (ไม่มี slow start เข้ามาแทรก)\n\n**เหตุผลเชิงกราฟิก**: บนกราฟ throughput ของ connection 1 (แกน x) เทียบกับ connection 2 (แกน y) — additive increase ทำให้ throughput ของทั้งคู่เพิ่มขึ้นแบบขนานกัน (slope = 1) ในขณะที่ multiplicative decrease ลด throughput ของทั้งคู่ลงตามสัดส่วนเดิม — ผลลัพธ์ในระยะยาวคือวิถีการเคลื่อนที่จะถูกดึงเข้าหาเส้น **equal bandwidth share** (throughput เท่ากันทั้งคู่) โดยธรรมชาติ"}, {"type": "subheading", "content": "แต่แอปพลิเคชันทุกตัวต้อง \"แฟร์\" เหมือนกันหมดไหม?"}, {"type": "note", "content": "**Fairness กับ Parallel TCP Connections**: แอปพลิเคชันสามารถเปิดหลาย TCP connection ไปยัง host เดียวกันพร้อมกันได้ (เช่น web browser ทำแบบนี้) — ถ้า link มี rate $R$ และมี 9 connection ที่มีอยู่แล้ว: แอปใหม่ที่ขอ 1 TCP connection จะได้แค่ $R/10$ แต่แอปที่ขอ **11 TCP connection พร้อมกัน** จะได้ถึง $R/2$! — เห็นได้ชัดว่าการเปิดหลาย connection คือการ \"เอาเปรียบ\" fairness mechanism ของ TCP\n\n**Fairness กับ UDP**: แอปพลิเคชัน multimedia จำนวนมากไม่ใช้ TCP เพราะไม่ต้องการให้ rate ถูก \"บีบ\" (throttle) โดย congestion control — จึงใช้ UDP แทน (ส่ง audio/video ด้วย rate คงที่ ยอมรับการสูญเสีย packet ได้)"}, {"type": "warning", "content": "**ไม่มี \"ตำรวจอินเทอร์เน็ต\"** (\"Internet police\") ที่คอยบังคับให้ทุก sender ต้องใช้ congestion control อย่างเป็นธรรม — TCP fairness เป็นเพียง**พฤติกรรมที่เกิดขึ้นเองโดยธรรมชาติ**จาก AIMD algorithm ของ TCP เท่านั้น แอปพลิเคชันที่เลือกใช้ UDP หรือเปิด parallel connection จำนวนมากสามารถ \"แซง\" ผู้ใช้ TCP รายอื่นที่ทำตามกติกาได้ตามกฎหมาย"}]}, {"title": "วิวัฒนาการของ Transport Layer: QUIC และ HTTP/3", "body": "TCP และ UDP เป็น transport protocol หลักของอินเทอร์เน็ตมานานกว่า 40 ปี แต่ scenario การใช้งานสมัยใหม่ท้าทายข้อจำกัดของ TCP แบบเดิม", "blocks": [{"type": "subheading", "content": "ความท้าทายที่ผลักดันวิวัฒนาการของ Transport Layer"}, {"type": "table", "content": "<table><tr><th>Scenario</th><th>ความท้าทาย</th></tr><tr><td>Long, fat pipes (การส่งข้อมูลปริมาณมาก)</td><td>มี packet จำนวนมาก \"in-flight\" พร้อมกัน — packet loss ทำให้ pipeline หยุดชะงักทั้งหมด</td></tr><tr><td>Wireless networks</td><td>packet loss เกิดจาก noisy wireless link และการเคลื่อนที่ (mobility) แต่ TCP ตีความ loss แบบนี้เป็น congestion loss อย่างผิดๆ</td></tr><tr><td>Long-delay links</td><td>RTT ยาวมาก ทำให้ AIMD ปรับตัวช้า</td></tr><tr><td>Data center networks</td><td>ต้องการ latency ต่ำมาก</td></tr><tr><td>Background traffic flows</td><td>flow แบบ \"background\" ที่ควรมี priority ต่ำ</td></tr></table>"}, {"type": "note", "content": "แนวโน้มสำคัญ: การย้าย function ของ transport layer บางส่วนไปอยู่ที่ **application layer** โดยรันอยู่บน **UDP** แทน — ตัวอย่างที่โดดเด่นที่สุดคือ **HTTP/3 กับ QUIC**"}, {"type": "subheading", "content": "QUIC: Quick UDP Internet Connections"}, {"type": "note", "content": "QUIC เป็น **application-layer protocol ที่รันอยู่บน UDP** เป้าหมายคือเพิ่มประสิทธิภาพของ HTTP — ถูก deploy อย่างกว้างขวางบน server และแอปของ Google (Chrome, YouTube mobile app) QUIC นำแนวคิดที่เรียนในบทนี้มาปรับใช้:\n\n- **Error control และ congestion control**: อัลกอริทึมคล้ายกับที่ TCP ใช้ (ตามที่ QUIC specification ระบุไว้ว่า \"ผู้ที่คุ้นเคยกับ TCP loss detection และ congestion control จะพบอัลกอริทึมที่คล้ายคลึงกันที่นี่\")\n- **Connection establishment**: รวม reliability, congestion control, authentication, encryption state ไว้ในการ**handshake เดียว ใช้เวลาแค่ 1 RTT** (แทนที่จะต้องทำ TCP handshake + TLS handshake แยกกัน 2 รอบ)\n- **Multiple streams**: หลาย application-level \"stream\" ถูก multiplex อยู่บน QUIC connection **เดียว** — แต่ละ stream มี reliable data transfer และ security แยกกัน แต่ใช้ **congestion control ร่วมกัน**"}, {"type": "table", "content": "<table><tr><th>ด้าน</th><th>HTTP/2 บน TCP (แบบเดิม)</th><th>HTTP/3 บน QUIC (ใหม่)</th></tr><tr><td>Handshake</td><td>2 รอบแยกกัน: TCP handshake (reliability, congestion control) + TLS handshake (authentication, encryption) = ใช้เวลา 2 RTT</td><td>1 รอบเดียว รวมทุกอย่างไว้ด้วยกัน = ใช้เวลา 1 RTT</td></tr><tr><td>Head-of-Line (HOL) Blocking</td><td>เมื่อ segment 1 stream เกิด error/loss การ retransmit จะบล็อกทุก stream บน TCP connection เดียวกันทั้งหมด</td><td>แต่ละ stream มี reliable data transfer แยกกัน — error ใน 1 stream **ไม่บล็อก** stream อื่นเลย</td></tr></table>"}, {"type": "warning", "content": "การที่ QUIC แยก reliable data transfer เป็นรายสตรีม คือกุญแจสำคัญที่แก้ปัญหา **HOL blocking ระดับ connection** ที่ HTTP/2 บน TCP ยังคงมีอยู่ (แม้ HTTP/2 จะแก้ HOL blocking ระดับ object ได้แล้วก็ตาม ตามที่กล่าวถึงใน Chapter 2) — นี่คือเหตุผลหลักที่ HTTP/3 เลือกใช้ QUIC บน UDP แทน TCP โดยตรง"}]}, {"title": "สรุปท้ายบท: Chapter 3", "body": "บทนี้ครอบคลุมหลักการเบื้องหลัง transport-layer service ทั้งหมด พร้อมการ implement จริงในอินเทอร์เน็ต ก่อนจะก้าวเข้าสู่ network layer ในบทถัดไป", "blocks": [{"type": "subheading", "content": "หลักการที่ครอบคลุมในบทนี้"}, {"type": "note", "content": "- **Multiplexing/Demultiplexing**: การรวม/แยกข้อมูลระหว่างหลาย socket โดยใช้ port number (และ IP address สำหรับ TCP)\n- **Reliable Data Transfer**: หลักการพื้นฐาน (rdt1.0–3.0), pipelining (GBN, SR)\n- **Flow Control**: ป้องกัน sender ส่งเร็วเกินกว่า receiver จะรับไหว\n- **Congestion Control**: ป้องกัน sender ส่งเร็วเกินกว่าเครือข่ายจะรับไหว"}, {"type": "subheading", "content": "การ Implement จริงในอินเทอร์เน็ต"}, {"type": "note", "content": "- **UDP**: connectionless, no-frills, best-effort\n- **TCP**: connection-oriented, reliable, in-order byte stream พร้อม flow control และ congestion control (AIMD, slow start, CUBIC, delay-based approaches)\n- **วิวัฒนาการ**: QUIC/HTTP3 ย้าย function บางส่วนของ transport layer ไปที่ application layer บน UDP เพื่อแก้ปัญหาที่ TCP ดั้งเดิมทำได้ไม่ดีนัก"}, {"type": "note", "content": "**ก้าวต่อไป**: จากบทนี้ที่อยู่ใน \"edge\" ของเครือข่าย (application และ transport layer) บทถัดไปจะเข้าสู่ **network core** ผ่าน 2 บทเกี่ยวกับ network layer: **data plane** (การ forward packet จริง) และ **control plane** (การกำหนดเส้นทาง/routing)"}]}];

function renderTOC(){
  const toc = document.getElementById("tocList");
  toc.innerHTML = "";
  SECTIONS.forEach((sec, idx)=>{
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = "#section_"+idx;
    a.textContent = sec.title;
    a.dataset.idx = idx;
    li.appendChild(a);
    toc.appendChild(li);
  });
}

function escapeXml(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function fmtTspans(text, x){
  return String(text==null?"":text).split("\n").map(function(line,i){
    return '<tspan x="'+x+'" dy="'+(i===0?0:15)+'">'+escapeXml(line)+'</tspan>';
  }).join("");
}

function renderDiagramBlock(block, secIdx, blockIdx){
  const uid = "dg_"+secIdx+"_"+blockIdx;
  const layout = block.layout || "lifeline";
  const actors = block.actors || [];
  const steps = block.steps || [];
  const n = actors.length;
  const W = 680;
  const margin = 76;
  const nodesX = [];
  for(let i=0;i<n;i++){ nodesX.push(n===1 ? W/2 : margin + i*((W-2*margin)/Math.max(1,n-1))); }
  let inner = "";
  let H = 0;

  if(layout === "flow"){
    const boxY = 50, boxH = 46;
    const boxW = Math.min(128, Math.max(70,(W-2*margin)/Math.max(1,n-1)-14));
    H = 168;
    actors.forEach(function(a,i){
      inner += '<rect class="diagram-node-box" x="'+(nodesX[i]-boxW/2)+'" y="'+boxY+'" width="'+boxW+'" height="'+boxH+'" rx="7"></rect>';
      inner += '<text class="diagram-actor-label" x="'+nodesX[i]+'" y="'+(boxY+boxH/2-6)+'" text-anchor="middle">'+fmtTspans(a, nodesX[i])+'</text>';
    });
    steps.forEach(function(st,i){
      const x1 = nodesX[st.from]+boxW/2+3, x2 = nodesX[st.to]-boxW/2-3;
      const y = boxY+boxH/2;
      const pid = uid+"_p"+i, mid = uid+"_m"+i;
      inner += '<path id="'+pid+'" class="diagram-arrow-path" d="M '+x1+' '+y+' L '+x2+' '+y+'"></path>';
      inner += '<text class="diagram-arrow-label" x="'+((x1+x2)/2)+'" y="'+(boxY-12)+'" text-anchor="middle">'+escapeXml(st.label||"")+'</text>';
      inner += '<circle id="'+mid+'d" class="diagram-glow-dot" r="6.5" cx="'+x1+'" cy="'+y+'">'
             + '<animateMotion id="'+mid+'" begin="indefinite" dur="0.75s" fill="freeze" path="M '+x1+' '+y+' L '+x2+' '+y+'"></animateMotion>'
             + '<animate attributeName="opacity" begin="'+mid+'.begin" dur="0.05s" from="0" to="1" fill="freeze"></animate>'
             + '<animate attributeName="opacity" begin="'+mid+'.end" dur="0.5s" from="1" to="0" fill="freeze"></animate>'
             + '</circle>';
    });
  } else {
    const rowH = 64, topY = 12, boxH = 38;
    H = topY + boxH + steps.length*rowH + 26;
    const boxW = Math.min(160, Math.max(80,(W-2*margin)/Math.max(1,n-1)-10));
    actors.forEach(function(a,i){
      inner += '<rect class="diagram-node-box" x="'+(nodesX[i]-boxW/2)+'" y="'+topY+'" width="'+boxW+'" height="'+boxH+'" rx="7"></rect>';
      inner += '<text class="diagram-actor-label" x="'+nodesX[i]+'" y="'+(topY+boxH/2-6)+'" text-anchor="middle">'+fmtTspans(a, nodesX[i])+'</text>';
      inner += '<line class="diagram-lifeline" x1="'+nodesX[i]+'" y1="'+(topY+boxH)+'" x2="'+nodesX[i]+'" y2="'+(H-8)+'"></line>';
    });
    steps.forEach(function(st,i){
      const y = topY+boxH+22 + i*rowH;
      const x1 = nodesX[st.from], x2 = nodesX[st.to];
      const pid = uid+"_p"+i, mid = uid+"_m"+i;
      inner += '<path id="'+pid+'" class="diagram-arrow-path" d="M '+x1+' '+y+' L '+x2+' '+y+'"></path>';
      inner += '<text class="diagram-arrow-label" x="'+((x1+x2)/2)+'" y="'+(y-9)+'" text-anchor="middle">'+escapeXml(st.label||"")+'</text>';
      inner += '<circle id="'+mid+'d" class="diagram-glow-dot" r="6.5" cx="'+x1+'" cy="'+y+'">'
             + '<animateMotion id="'+mid+'" begin="indefinite" dur="0.75s" fill="freeze" path="M '+x1+' '+y+' L '+x2+' '+y+'"></animateMotion>'
             + '<animate attributeName="opacity" begin="'+mid+'.begin" dur="0.05s" from="0" to="1" fill="freeze"></animate>'
             + '<animate attributeName="opacity" begin="'+mid+'.end" dur="0.5s" from="1" to="0" fill="freeze"></animate>'
             + '</circle>';
    });
  }

  const svg = '<svg class="diagram-svg" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" preserveAspectRatio="xMidYMid meet">'+inner+'</svg>';

  let stepsHtml = '<ol class="diagram-steps-list">';
  steps.forEach(function(st,i){
    stepsHtml += '<li><span class="step-num">'+(i+1)+'</span><strong>'+escapeXml(st.label||"")+'</strong>'+(st.note?(' — '+escapeXml(st.note)):'')+'</li>';
  });
  stepsHtml += '</ol>';

  return '<div class="diagram-block" id="'+uid+'">'
       + '<h4><span>🔀 '+escapeXml(block.title||"")+'</span><button class="diagram-play-btn" data-diagram-id="'+uid+'">&#9654; เล่นแอนิเมชัน / Play animation</button></h4>'
       + '<div class="diagram-svg-wrap">'+svg+'</div>'
       + stepsHtml
       + '</div>';
}

function diagramPlay(containerId){
  const wrap = document.getElementById(containerId);
  if(!wrap) return;
  const svg = wrap.querySelector('svg');
  const paths = svg.querySelectorAll('.diagram-arrow-path');
  const dots = svg.querySelectorAll('.diagram-glow-dot');
  const items = wrap.querySelectorAll('.diagram-steps-list li');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  items.forEach(function(li){ li.classList.remove('step-active'); });
  if(reduced){ return; }
  const stepDur = 850;
  paths.forEach(function(p){
    const len = p.getTotalLength();
    p.style.transition = 'none';
    p.style.strokeDasharray = len;
    p.style.strokeDashoffset = len;
  });
  void svg.getBoundingClientRect();
  paths.forEach(function(p,i){
    setTimeout(function(){
      p.style.transition = 'stroke-dashoffset '+(stepDur-100)+'ms ease';
      p.style.strokeDashoffset = 0;
      const anim = dots[i] ? dots[i].querySelector('animateMotion') : null;
      if(anim){ try{ anim.beginElement(); }catch(e){} }
      if(items[i]) items[i].classList.add('step-active');
    }, i*stepDur);
  });
}

function wireDiagramButtons(){
  document.querySelectorAll('.diagram-play-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ diagramPlay(btn.dataset.diagramId); });
  });
}

function renderContent(){
  const main = document.getElementById("mainArea");
  main.innerHTML = "";
  SECTIONS.forEach((sec, idx)=>{
    const card = document.createElement("div");
    card.className = "section-card";
    card.id = "section_"+idx;
    let html = "<h2>"+sec.title+"</h2>";
    if(sec.body){
      html += '<div class="body-text">'+sec.body+'</div>';
    }
    (sec.blocks || []).forEach((block, bi)=>{
      if(block.type === "note"){
        html += '<div class="callout callout-note"><span class="callout-title">หมายเหตุ / Note</span>'+escapeXml(block.content)+'</div>';
      } else if(block.type === "example"){
        html += '<div class="callout callout-example"><span class="callout-title">ตัวอย่าง / Example</span>'+escapeXml(block.content)+'</div>';
      } else if(block.type === "warning"){
        html += '<div class="callout callout-warning"><span class="callout-title">ข้อควรระวัง / Warning</span>'+escapeXml(block.content)+'</div>';
      } else if(block.type === "formula"){
        html += '<div class="callout callout-formula"><span class="callout-title">'+(block.label || "สูตร / Formula")+'</span>'+escapeXml(block.content)+'</div>';
      } else if(block.type === "subheading"){
        html += '<h3>'+block.content+'</h3>';
      } else if(block.type === "table"){
        html += block.content;
      } else if(block.type === "image"){
        html += '<div class="image-block"><img src="'+block.src+'" alt="'+(block.alt || "")+'" loading="lazy">';
        if(block.caption){
          html += '<div class="image-caption">'+block.caption+'</div>';
        }
        html += '</div>';
      } else if(block.type === "diagram"){
        html += renderDiagramBlock(block, idx, bi);
      }
    });
    card.innerHTML = html;
    main.appendChild(card);
  });

  if(window.renderMathInElement){
    renderMathInElement(main, {
      delimiters: [
        {left: "$$", right: "$$", display: true},
        {left: "$", right: "$", display: false}
      ]
    });
  }
}

function setupScrollSpy(){
  const links = document.querySelectorAll(".toc-list a");
  const sections = document.querySelectorAll(".section-card");
  window.addEventListener("scroll", ()=>{
    let currentIdx = 0;
    sections.forEach((sec, idx)=>{
      const rect = sec.getBoundingClientRect();
      if(rect.top <= 100) currentIdx = idx;
    });
    links.forEach(l=>l.classList.remove("active"));
    if(links[currentIdx]) links[currentIdx].classList.add("active");
  });
}

function setupReveal(){
  const cards = document.querySelectorAll('.section-card');
  if(!('IntersectionObserver' in window)){
    cards.forEach(function(c){ c.classList.add('revealed'); });
    return;
  }
  const io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){ e.target.classList.add('revealed'); io.unobserve(e.target); }
    });
  }, {threshold:0.08, rootMargin:'0px 0px -60px 0px'});
  cards.forEach(function(c){ io.observe(c); });
}

let fontScale = parseFloat(localStorage.getItem('netbook_fontScale')||'1');
function setFontScale(v){
  fontScale = Math.min(1.3, Math.max(0.85, Math.round(v*10)/10));
  try{ localStorage.setItem('netbook_fontScale', fontScale); }catch(e){}
  document.documentElement.style.setProperty('--fontScale', fontScale);
}

function updateProgress(){
  const el = document.documentElement;
  const max = el.scrollHeight - el.clientHeight;
  const pct = max>0 ? (el.scrollTop/max*100) : 0;
  const bar = document.getElementById('readProgress');
  if(bar) bar.style.width = pct+'%';
  const btt = document.getElementById('backToTop');
  if(btt){ if(el.scrollTop>420){ btt.classList.add('show'); } else { btt.classList.remove('show'); } }
}

renderTOC();
renderContent();
setupScrollSpy();
setupReveal();
wireDiagramButtons();
setFontScale(fontScale);

window.addEventListener('scroll', updateProgress);
const backToTopBtn = document.getElementById('backToTop');
if(backToTopBtn){ backToTopBtn.addEventListener('click', function(){ window.scrollTo({top:0,behavior:'smooth'}); }); }
const fontMinusBtn = document.getElementById('fontMinus');
if(fontMinusBtn){ fontMinusBtn.addEventListener('click', function(){ setFontScale(fontScale-0.1); }); }
const fontPlusBtn = document.getElementById('fontPlus');
if(fontPlusBtn){ fontPlusBtn.addEventListener('click', function(){ setFontScale(fontScale+0.1); }); }

</script>
