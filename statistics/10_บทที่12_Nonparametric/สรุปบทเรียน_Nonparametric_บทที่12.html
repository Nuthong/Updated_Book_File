function fracGCD(a,b){
  a = a<0n ? -a : a;
  b = b<0n ? -b : b;
  while(b){ const t = a % b; a = b; b = t; }
  return a === 0n ? 1n : a;
}

class Frac{
  constructor(n, d=1n){
    if(d === 0n) throw new Error("หารด้วยศูนย์");
    if(d < 0n){ n = -n; d = -d; }
    const g = fracGCD(n,d);
    this.n = n / g;
    this.d = d / g;
  }
  toNumber(){ return Number(this.n) / Number(this.d); }
  isInt(){ return this.d === 1n; }
}

function isqrtBig(n){
  if(n < 0n) throw new Error("negative");
  if(n < 2n) return n;
  let x = n, y = (x + 1n) / 2n;
  while(y < x){ x = y; y = (x + n / x) / 2n; }
  return x;
}

// Value: {kind:'frac', frac:Frac} or {kind:'float', v:number}
function VF(frac){ return {kind:'frac', frac}; }
function VN(v){ return {kind:'float', v}; }
function toNum(val){ return val.kind === 'frac' ? val.frac.toNumber() : val.v; }

function fracFromDecimalToken(tok){
  if(tok.indexOf(".") === -1){
    return new Frac(BigInt(tok), 1n);
  }
  const [intPart, fracPart] = tok.split(".");
  const denom = 10n ** BigInt(fracPart.length);
  const numer = BigInt((intPart === "" ? "0" : intPart) + fracPart);
  return new Frac(numer, denom);
}

function vAdd(a,b){
  if(a.kind==='frac' && b.kind==='frac') return VF(new Frac(a.frac.n*b.frac.d + b.frac.n*a.frac.d, a.frac.d*b.frac.d));
  return VN(toNum(a)+toNum(b));
}
function vSub(a,b){
  if(a.kind==='frac' && b.kind==='frac') return VF(new Frac(a.frac.n*b.frac.d - b.frac.n*a.frac.d, a.frac.d*b.frac.d));
  return VN(toNum(a)-toNum(b));
}
function vMul(a,b){
  if(a.kind==='frac' && b.kind==='frac') return VF(new Frac(a.frac.n*b.frac.n, a.frac.d*b.frac.d));
  return VN(toNum(a)*toNum(b));
}
function vDiv(a,b){
  if(a.kind==='frac' && b.kind==='frac'){
    if(b.frac.n === 0n) throw new Error("หารด้วยศูนย์");
    return VF(new Frac(a.frac.n*b.frac.d, a.frac.d*b.frac.n));
  }
  const bn = toNum(b);
  if(bn === 0) throw new Error("หารด้วยศูนย์");
  return VN(toNum(a)/bn);
}
function vNeg(a){
  if(a.kind==='frac') return VF(new Frac(-a.frac.n, a.frac.d));
  return VN(-a.v);
}

function vSqrt(a){
  if(a.kind==='frac' && a.frac.n >= 0n){
    const sn = isqrtBig(a.frac.n);
    const sd = isqrtBig(a.frac.d);
    if(sn*sn === a.frac.n && sd*sd === a.frac.d){
      return VF(new Frac(sn, sd));
    }
  }
  const num = toNum(a);
  if(num < 0) throw new Error("ไม่สามารถถอดรากที่สองของจำนวนติดลบได้");
  return VN(Math.sqrt(num));
}

function vNthRoot(n, a){
  const nNum = toNum(n);
  if(!Number.isInteger(nNum) || nNum <= 0) throw new Error("ลำดับรากต้องเป็นจำนวนเต็มบวก");
  if(a.kind==='frac' && a.frac.n >= 0n){
    // try exact integer nth root of numerator and denominator
    const tryRoot = (val)=>{
      if(val === 0n) return 0n;
      let lo=0n, hi=val;
      while(lo<=hi){
        const mid=(lo+hi)/2n;
        let p=1n;
        for(let i=0;i<nNum;i++) p*=mid;
        if(p===val) return mid;
        if(p<val) lo=mid+1n; else hi=mid-1n;
      }
      return null;
    };
    const rn = tryRoot(a.frac.n);
    const rd = tryRoot(a.frac.d);
    if(rn !== null && rd !== null){
      return VF(new Frac(rn, rd));
    }
  }
  const num = toNum(a);
  return VN(Math.sign(num) * Math.pow(Math.abs(num), 1/nNum));
}

function vPow(base, exp){
  if(base.kind==='frac' && exp.kind==='frac' && exp.frac.isInt()){
    let e = exp.frac.n;
    const neg = e < 0n;
    if(neg) e = -e;
    let resultN = 1n, resultD = 1n;
    let bn = base.frac.n, bd = base.frac.d;
    for(let i=0n;i<e;i++){ resultN *= bn; resultD *= bd; }
    if(neg){
      if(resultN === 0n) throw new Error("หารด้วยศูนย์");
      return VF(new Frac(resultD, resultN));
    }
    return VF(new Frac(resultN, resultD));
  }
  if(exp.kind==='frac' && exp.frac.d === 2n && exp.frac.n === 1n){
    return vSqrt(base);
  }
  const b = toNum(base), e = toNum(exp);
  return VN(Math.pow(b,e));
}

function vFactorial(a){
  if(a.kind!=='frac' || !a.frac.isInt() || a.frac.n < 0n) throw new Error("ต้องเป็นจำนวนเต็มไม่ติดลบ");
  let n = a.frac.n, result = 1n;
  for(let i=2n;i<=n;i++) result *= i;
  return VF(new Frac(result,1n));
}

function bigFactorial(n){
  let result = 1n;
  for(let i=2n;i<=n;i++) result *= i;
  return result;
}

function vNPr(n,r){
  if(n.kind!=='frac'||!n.frac.isInt()||r.kind!=='frac'||!r.frac.isInt()) throw new Error("ต้องเป็นจำนวนเต็ม");
  const N=n.frac.n, R=r.frac.n;
  if(R<0n||R>N||N<0n) throw new Error("ค่าพารามิเตอร์ไม่ถูกต้อง");
  return VF(new Frac(bigFactorial(N)/bigFactorial(N-R),1n));
}
function vNCr(n,r){
  if(n.kind!=='frac'||!n.frac.isInt()||r.kind!=='frac'||!r.frac.isInt()) throw new Error("ต้องเป็นจำนวนเต็ม");
  const N=n.frac.n, R=r.frac.n;
  if(R<0n||R>N||N<0n) throw new Error("ค่าพารามิเตอร์ไม่ถูกต้อง");
  return VF(new Frac(bigFactorial(N)/(bigFactorial(R)*bigFactorial(N-R)),1n));
}

function vAbs(a){
  if(a.kind==='frac') return VF(new Frac(a.frac.n<0n?-a.frac.n:a.frac.n, a.frac.d));
  return VN(Math.abs(a.v));
}
function vRound(a){
  const num = toNum(a);
  return VF(new Frac(BigInt(Math.round(num)),1n));
}

function vMean(list){
  if(list.length===0) throw new Error("ต้องมีอย่างน้อย 1 ค่า");
  let sum = list[0];
  for(let i=1;i<list.length;i++) sum = vAdd(sum, list[i]);
  return vDiv(sum, VF(new Frac(BigInt(list.length),1n)));
}
function vVariance(list, sample){
  const m = vMean(list);
  let sumSq = VF(new Frac(0n,1n));
  list.forEach(x=>{
    const d = vSub(x,m);
    sumSq = vAdd(sumSq, vMul(d,d));
  });
  const denom = sample ? list.length-1 : list.length;
  if(denom<=0) throw new Error("ข้อมูลไม่พอสำหรับคำนวณ sample stdev");
  return vDiv(sumSq, VF(new Frac(BigInt(denom),1n)));
}
function vStdev(list){ return vSqrt(vVariance(list, true)); }
function vStdevp(list){ return vSqrt(vVariance(list, false)); }

function formatFloat(x){
  if(!isFinite(x)) return x > 0 ? "Infinity" : (x < 0 ? "-Infinity" : "NaN");
  if(Number.isInteger(x) && Math.abs(x) < 1e15) return x.toString();
  let s = x.toPrecision(10);
  if(s.indexOf('e') === -1 && s.indexOf('.') !== -1){
    s = s.replace(/0+$/,'').replace(/\.$/,'');
  }
  return s;
}

function valueToDisplayString(val){
  if(val.kind==='frac') return val.frac.isInt() ? val.frac.n.toString() : val.frac.n.toString()+"/"+val.frac.d.toString();
  return formatFloat(val.v);
}

let lcDisplayMode = 'frac';

function valueToModeString(val, mode){
  if(mode === 'decimal'){
    const num = val.kind==='frac' ? val.frac.toNumber() : val.v;
    return formatFloat(num);
  }
  return valueToDisplayString(val);
}

const RESERVED_CONSTS = new Set(["pi","e","ans"]);

let lineCalcVars = {};
let lineCalcAns = null;


function lcTokenize(str){
  const tokens = [];
  let i = 0;
  while(i < str.length){
    const c = str[i];
    if(c === " " || c === "\t"){ i++; continue; }
    if("+-*/^!(),=".indexOf(c) !== -1){
      tokens.push(c);
      i++;
      continue;
    }
    if("×÷".indexOf(c) !== -1){
      tokens.push(c === "×" ? "*" : "/");
      i++;
      continue;
    }
    if(/[0-9.]/.test(c)){
      let j = i;
      while(j < str.length && /[0-9.]/.test(str[j])) j++;
      tokens.push({type:"num", val:str.slice(i,j)});
      i = j;
      continue;
    }
    if(/[a-zA-Z_]/.test(c)){
      let j = i;
      while(j < str.length && /[a-zA-Z0-9_]/.test(str[j])) j++;
      tokens.push({type:"id", val:str.slice(i,j)});
      i = j;
      continue;
    }
    throw new Error("อักขระไม่ถูกต้อง: " + c);
  }
  return tokens;
}

function lcParse(tokens){
  let pos = 0;
  function peek(){ return tokens[pos]; }
  function isOp(t, s){ return t === s; }
  function next(){ return tokens[pos++]; }

  function parseExpr(){
    let left = parseTerm();
    while(isOp(peek(),"+") || isOp(peek(),"-")){
      const op = next();
      const right = parseTerm();
      left = op === "+" ? vAdd(left,right) : vSub(left,right);
    }
    return left;
  }
  function parseTerm(){
    let left = parseSigned();
    while(isOp(peek(),"*") || isOp(peek(),"/")){
      const op = next();
      const right = parseSigned();
      left = op === "*" ? vMul(left,right) : vDiv(left,right);
    }
    return left;
  }
  function parseSigned(){
    if(isOp(peek(),"-")){ next(); return vNeg(parseSigned()); }
    if(isOp(peek(),"+")){ next(); return parseSigned(); }
    return parsePower();
  }
  function parsePower(){
    let base = parsePostfix();
    if(isOp(peek(),"^")){
      next();
      const exp = parseSigned();
      base = vPow(base, exp);
    }
    return base;
  }
  function parsePostfix(){
    let val = parsePrimary();
    while(isOp(peek(),"!")){
      next();
      val = vFactorial(val);
    }
    return val;
  }
  function parseArgs(){
    const args = [parseExpr()];
    while(isOp(peek(),",")){
      next();
      args.push(parseExpr());
    }
    return args;
  }
  function parsePrimary(){
    const tok = peek();
    if(tok === undefined) throw new Error("รูปแบบสมการไม่ถูกต้อง");
    if(isOp(tok,"(")){
      next();
      const val = parseExpr();
      if(!isOp(peek(),")")) throw new Error("วงเล็บไม่ครบ");
      next();
      return val;
    }
    if(typeof tok === "object" && tok.type === "num"){
      next();
      return VF(fracFromDecimalToken(tok.val));
    }
    if(typeof tok === "object" && tok.type === "id"){
      next();
      const name = tok.val.toLowerCase();
      if(RESERVED_FUNCS.has(name)){
        if(!isOp(peek(),"(")) throw new Error("ต้องมีวงเล็บหลังฟังก์ชัน "+name);
        next();
        const args = parseArgs();
        if(!isOp(peek(),")")) throw new Error("วงเล็บไม่ครบ");
        next();
        return applyFunc(name, args);
      }
      if(name === "pi") return VN(Math.PI);
      if(name === "e") return VN(Math.E);
      if(name === "ans"){
        if(lineCalcAns === null) throw new Error("ยังไม่มีผลลัพธ์ก่อนหน้า");
        return lineCalcAns;
      }
      if(Object.prototype.hasOwnProperty.call(lineCalcVars, name)){
        return lineCalcVars[name];
      }
      throw new Error("ไม่พบตัวแปร "+tok.val);
    }
    throw new Error("รูปแบบสมการไม่ถูกต้อง");
  }

  const result = parseExpr();
  if(pos !== tokens.length) throw new Error("รูปแบบสมการไม่ถูกต้อง");
  return result;
}

function toRad(val){
  const n = toNum(val);
  return isDeg ? n*Math.PI/180 : n;
}
function fromRad(rad){
  return isDeg ? rad*180/Math.PI : rad;
}

function applyFunc(name, args){
  switch(name){
    case "sin": return VN(Math.sin(toRad(args[0])));
    case "cos": return VN(Math.cos(toRad(args[0])));
    case "tan": return VN(Math.tan(toRad(args[0])));
    case "asin": return VN(fromRad(Math.asin(toNum(args[0]))));
    case "acos": return VN(fromRad(Math.acos(toNum(args[0]))));
    case "atan": return VN(fromRad(Math.atan(toNum(args[0]))));
    case "sqrt": return vSqrt(args[0]);
    case "nthroot": return vNthRoot(args[0], args[1]);
    case "abs": return vAbs(args[0]);
    case "round": return vRound(args[0]);
    case "ln": {
      const v = toNum(args[0]);
      if(v<=0) throw new Error("ln ต้องรับค่าบวก");
      return VN(Math.log(v));
    }
    case "log": {
      const v = toNum(args[0]);
      if(v<=0) throw new Error("log ต้องรับค่าบวก");
      return VN(Math.log10(v));
    }
    case "mean": return vMean(args);
    case "stdev": return vStdev(args);
    case "stdevp": return vStdevp(args);
    case "npr": return vNPr(args[0],args[1]);
    case "ncr": return vNCr(args[0],args[1]);
    default: throw new Error("ไม่รู้จักฟังก์ชัน "+name);
  }
}

function lineCalcEvaluate(str){
  str = str.trim();
  const assignMatch = str.match(/^([a-zA-Z_][a-zA-Z0-9_]*)\s*=\s*(.+)$/);
  if(assignMatch && !RESERVED_FUNCS.has(assignMatch[1].toLowerCase()) && !RESERVED_CONSTS.has(assignMatch[1].toLowerCase())){
    const varName = assignMatch[1].toLowerCase();
    const tokens = lcTokenize(assignMatch[2]);
    if(tokens.length===0) throw new Error("กรุณาพิมพ์สมการ");
    const val = lcParse(tokens);
    lineCalcVars[varName] = val;
    lineCalcAns = val;
    return {display: varName+" = "+valueToDisplayString(val), val, prefix: varName+" = "};
  }
  const tokens = lcTokenize(str);
  if(tokens.length===0) throw new Error("กรุณาพิมพ์สมการ");
  const val = lcParse(tokens);
  lineCalcAns = val;
  return {display: valueToDisplayString(val), val, prefix: ""};
}

function lineCalcRenderEmpty(){
  const hist = document.getElementById("linecalcHistory");
  if(hist.children.length === 0){
    hist.innerHTML = '<div class="linecalc-empty">ยังไม่มีการคำนวณ พิมพ์สมการแล้วกด Enter</div>';
  }
}

let lcRoot = [];
let lcCursor = {container: lcRoot, index: 0};

function lcCharTok(ch){ return {type:'char', ch}; }
function lcFracTok(){ return {type:'frac', num:[], den:[]}; }

function lcFindParent(root, target){
  for(let i=0;i<root.length;i++){
    const tok = root[i];
    if(tok.type==='frac'){
      if(tok.num === target) return {parentContainer:root, parentIndex:i, slot:'num', fracToken:tok};
      if(tok.den === target) return {parentContainer:root, parentIndex:i, slot:'den', fracToken:tok};
      const r1 = lcFindParent(tok.num, target);
      if(r1) return r1;
      const r2 = lcFindParent(tok.den, target);
      if(r2) return r2;
    }
  }
  return null;
}

function lcSerializeContainer(container){
  let s = "";
  container.forEach(tok=>{
    if(tok.type==='char') s += tok.ch;
    else if(tok.type==='frac'){
      const numStr = lcSerializeContainer(tok.num) || "0";
      const denStr = lcSerializeContainer(tok.den) || "1";
      s += "(" + numStr + ")/(" + denStr + ")";
    }
  });
  return s;
}

function lcEscapeHtml(ch){
  if(ch === "<") return "&lt;";
  if(ch === ">") return "&gt;";
  if(ch === "&") return "&amp;";
  return ch;
}

function lcRenderContainer(container){
  let html = "";
  for(let i=0;i<=container.length;i++){
    if(container === lcCursor.container && i === lcCursor.index){
      html += '<span class="lc-cursor"></span>';
    }
    if(i < container.length){
      const tok = container[i];
      if(tok.type==='char'){
        html += '<span class="lc-char">'+lcEscapeHtml(tok.ch)+'</span>';
      } else if(tok.type==='frac'){
        html += '<span class="lc-frac"><span class="lc-frac-num">'+lcRenderContainer(tok.num)+'</span><span class="lc-frac-den">'+lcRenderContainer(tok.den)+'</span></span>';
      }
    }
  }
  return html;
}

function lcRender(){
  const field = document.getElementById("linecalcInput");
  if(lcRoot.length === 0){
    field.innerHTML = '<span class="lc-placeholder">เช่น 1/3 + 1/6</span><span class="lc-cursor"></span>';
  } else {
    field.innerHTML = lcRenderContainer(lcRoot);
  }
}

function lcInsertText(text, cursorOffset){
  const {container, index} = lcCursor;
  const toks = [...text].map(lcCharTok);
  container.splice(index, 0, ...toks);
  const off = cursorOffset !== undefined ? cursorOffset : text.length;
  lcCursor = {container, index: index+off};
  lcRender();
}

function lcInsertFunc(name){
  lcInsertText(name+"()", name.length+1);
}
function lcInsertNFunc(name){
  lcInsertText(name+"(,)", name.length+1);
}
function lcInsertFrac(){
  const frac = lcFracTok();
  const {container, index} = lcCursor;
  container.splice(index, 0, frac);
  lcCursor = {container: frac.num, index: 0};
  lcRender();
}
function lcBackspace(){
  const {container, index} = lcCursor;
  if(index > 0){
    container.splice(index-1, 1);
    lcCursor = {container, index: index-1};
    lcRender();
    return;
  }
  const info = lcFindParent(lcRoot, container);
  if(info){
    if(info.fracToken.num.length===0 && info.fracToken.den.length===0){
      info.parentContainer.splice(info.parentIndex,1);
      lcCursor = {container: info.parentContainer, index: info.parentIndex};
    } else {
      lcCursor = {container: info.parentContainer, index: info.parentIndex};
    }
    lcRender();
  }
}
function lcMoveCursor(dir){
  dir = dir < 0 ? -1 : 1;
  const {container, index} = lcCursor;
  if(dir === -1){
    if(index > 0){
      const prevTok = container[index-1];
      if(prevTok.type==='frac'){
        lcCursor = {container: prevTok.den, index: prevTok.den.length};
      } else {
        lcCursor = {container, index: index-1};
      }
    } else {
      const info = lcFindParent(lcRoot, container);
      if(info){
        if(info.slot === 'den'){
          lcCursor = {container: info.fracToken.num, index: info.fracToken.num.length};
        } else {
          lcCursor = {container: info.parentContainer, index: info.parentIndex};
        }
      }
    }
  } else {
    if(index < container.length){
      const curTok = container[index];
      if(curTok.type==='frac'){
        lcCursor = {container: curTok.num, index:0};
      } else {
        lcCursor = {container, index: index+1};
      }
    } else {
      const info = lcFindParent(lcRoot, container);
      if(info){
        if(info.slot === 'num'){
          lcCursor = {container: info.fracToken.den, index:0};
        } else {
          lcCursor = {container: info.parentContainer, index: info.parentIndex+1};
        }
      }
    }
  }
  lcRender();
}
function lcLoadFlatString(str){
  lcRoot.length = 0;
  [...str].forEach(ch=>lcRoot.push(lcCharTok(ch)));
  lcCursor = {container: lcRoot, index: lcRoot.length};
  lcRender();
}
function lcClear(){
  lcRoot.length = 0;
  lcCursor = {container: lcRoot, index: 0};
  lcRender();
}

function lineCalcSubmit(){
  const str = lcSerializeContainer(lcRoot).trim();
  if(str === "") return;
  const hist = document.getElementById("linecalcHistory");
  const emptyMsg = hist.querySelector(".linecalc-empty");
  if(emptyMsg) emptyMsg.remove();
  const line = document.createElement("div");
  line.setAttribute("data-raw", str);
  line.title = "คลิกเพื่อแก้ไขบรรทัดนี้";
  let entry = {rawStr: str, val: null, prefix: "", lineEl: line};
  try{
    const result = lineCalcEvaluate(str);
    line.className = "linecalc-line";
    line.innerHTML = '<span class="lc-input">'+escHtml(str)+'</span> <span class="lc-result">'+escHtml(result.prefix+valueToModeString(result.val, lcDisplayMode))+'</span>';
    entry.val = result.val;
    entry.prefix = result.prefix;
  } catch(e){
    line.className = "linecalc-line lc-error";
    line.innerHTML = '<span class="lc-input">'+escHtml(str)+'</span> <span class="lc-result">ผิดพลาด: '+escHtml(e.message)+'</span>';
  }
  line.addEventListener("click", ()=>{
    lcLoadFlatString(line.getAttribute("data-raw"));
    document.getElementById("linecalcInput").focus();
  });
  hist.appendChild(line);
  lcHistoryEntries.push(entry);
  hist.scrollTop = hist.scrollHeight;
  lcClear();
}

function lcRefreshHistoryDisplay(){
  lcHistoryEntries.forEach(entry=>{
    if(entry.val === null) return;
    const resultEl = entry.lineEl.querySelector(".lc-result");
    if(resultEl) resultEl.textContent = entry.prefix + valueToModeString(entry.val, lcDisplayMode);
  });
}

const LC_ALLOWED_CHARS = "0123456789+-*/^!(),.=abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ_";

document.getElementById("linecalcInput").addEventListener("keydown", (e)=>{
  if(e.key === "Enter"){
    e.preventDefault();
    lineCalcSubmit();
  } else if(e.key === "Backspace"){
    e.preventDefault();
    lcBackspace();
  } else if(e.key === "ArrowLeft"){
    e.preventDefault();
    lcMoveCursor(-1);
  } else if(e.key === "ArrowRight"){
    e.preventDefault();
    lcMoveCursor(1);
  } else if(e.key.length === 1 && LC_ALLOWED_CHARS.indexOf(e.key) !== -1){
    e.preventDefault();
    lcInsertText(e.key);
  } else if(e.key === "×" || e.key === "÷"){
    e.preventDefault();
    lcInsertText(e.key);
  }
});

document.getElementById("linecalcClearBtn").addEventListener("click", ()=>{
  document.getElementById("linecalcHistory").innerHTML = "";
  lineCalcVars = {};
  lineCalcAns = null;
  lcHistoryEntries = [];
  lcClear();
  lineCalcRenderEmpty();
});

document.getElementById("linecalcModeToggle").addEventListener("click", ()=>{
  lcDisplayMode = lcDisplayMode === 'frac' ? 'decimal' : 'frac';
  const btn = document.getElementById("linecalcModeToggle");
  btn.textContent = lcDisplayMode === 'frac' ? "แสดงผล: เศษส่วน" : "แสดงผล: ทศนิยม";
  lcRefreshHistoryDisplay();
});

document.querySelectorAll(".lc-kbtab").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".lc-kbtab").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".lc-kbpanel").forEach(p=>p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("lc-kb-"+btn.getAttribute("data-kb")).classList.add("active");
  });
});

document.querySelectorAll(".lc-kbpanel button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    if(btn.hasAttribute("data-ins")){
      lcInsertText(btn.getAttribute("data-ins"));
    } else if(btn.hasAttribute("data-ins-cursor")){
      const text = btn.getAttribute("data-ins-cursor");
      const cur = parseInt(btn.getAttribute("data-cursor"));
      lcInsertText(text, cur);
    } else if(btn.hasAttribute("data-func")){
      lcInsertFunc(btn.getAttribute("data-func"));
    } else if(btn.hasAttribute("data-nfunc")){
      lcInsertNFunc(btn.getAttribute("data-nfunc"));
    } else if(btn.hasAttribute("data-frac")){
      lcInsertFrac();
    } else if(btn.hasAttribute("data-minus")){
      lcInsertText("-");
    } else if(btn.hasAttribute("data-backspace")){
      lcBackspace();
    } else if(btn.hasAttribute("data-cursor-left")){
      lcMoveCursor(-1);
    } else if(btn.hasAttribute("data-cursor-right")){
      lcMoveCursor(1);
    } else if(btn.hasAttribute("data-enter")){
      lineCalcSubmit();
    }
    document.getElementById("linecalcInput").focus();
  });
});

lcRender();
lineCalcRenderEmpty();
</script>
