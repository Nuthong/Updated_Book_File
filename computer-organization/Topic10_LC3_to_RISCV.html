.callout code, .body-text code{

<script>
const SECTIONS = [{"title": "ภาพรวม Topic 10 และพจนานุกรมคำสั่ง LC-3 ↔ RV32I", "body": "หลังจากเข้าใจหลักการครบจาก LC-3 (16-bit เครื่องสอน) ครั้งนี้เราข้ามไปสู่ ISA จริงระดับอุตสาหกรรม — RISC-V RV32I (32-bit, มาตรฐานเปิด, มี toolchain ครบ) โดยทำ \"พจนานุกรม\" แมปทุกแนวคิด LC-3 เป็น RV32I, ดูสิ่งที่ LC-3 ไม่มีและ RISC-V เติมเต็ม, และเขียนโปรแกรม LC-3 ใหม่เป็น RV32I", "blocks": [{"type": "note", "content": "เมื่อจบครั้งนี้ ผู้เรียนจะสามารถ\n- อธิบายเหตุผลที่ก้าวจาก LC-3 ไป RISC-V RV32I และข้อดีของ ISA แบบ modular/เปิด\n- แมปคำสั่ง LC-3 ↔ RV32I (ADD→add, BR→beq/bne, JSR→jal, TRAP→ecall)\n- อธิบายสิ่งที่ LC-3 ขาด (x0, ABI, mul/shift/float, little-endian) และเขียนโปรแกรม LC-3 ใหม่เป็น RV32I"}, {"type": "formula", "label": "จำไว้ประโยคเดียว", "content": "ถ้าจำได้ประโยคเดียว\nก้าวจาก LC-3 ไป RISC-V ไม่ใช่การเริ่มใหม่ แต่เป็นแนวคิดเดิมที่ขยายให้ใช้งานจริงได้"}, {"type": "note", "content": "แผนเดินทางของบทนี้ (10.1 → 10.5)\n10.1 ตอบว่า \"ทำไมต้องย้าย\" — LC-3 ให้หลักการอะไรไว้ ขาดอะไร และ RV32I เติมเต็มตรงไหน พร้อมตารางเทียบครบทุกมิติ โปรแกรมแรกที่เขียนคู่กันสองภาษา และบันไดอ่านโค้ด RV32I สามระดับ\n10.2 ตอบว่า \"คำสั่ง LC-3 ที่ฉันรู้จัก เขียนเป็น RV32I ว่าอย่างไร\" — ตารางแมปครบทั้งกลุ่มคำนวณ/ลอจิก/หน่วยความจำ (ตอนที่ 1) และกลุ่ม address/branch/control (ตอนที่ 2)\n10.3 ตอบว่า \"RV32I มีอะไรที่ LC-3 ไม่เคยมี\" — รีจิสเตอร์แบบมีบทบาท (ABI), calling convention ผ่าน sp/ra, คูณ/หาร/เลื่อนบิต/ทศนิยม และแนวคิด modular ISA\n10.4 ตอบว่า \"ข้อมูลวางในหน่วยความจำแบบไหน\" — little-endian, การอ้างที่อยู่รายไบต์ และตัวอย่างเขียนโปรแกรม LC-3 เดิมใหม่เป็น RV32I เต็มโปรแกรม\n10.5 รวมแบบฝึกหัดไล่จากง่ายไปยาก ใช้วัดว่าข้ามสะพานสำเร็จแล้วหรือยัง"}, {"type": "example", "content": "เครื่องมือ RISC-V ลองเล่นจริง (เปิดควบคู่ตั้งแต่ Topic นี้เป็นต้นไป)\n\nVenus — เขียน RISC-V assembly แล้วรันในเบราว์เซอร์ ดูค่า register/memory ทีละคำสั่ง (ไม่ต้องติดตั้ง)\nrvcodec.js — พิมพ์คำสั่ง RV32I แล้วเห็นการเข้ารหัสเป็นบิตแยกทุกฟิลด์ (ถอดกลับจากเลขฐานสิบหกก็ได้)\nCompiler Explorer — เขียนภาษา C แล้วดูมันกลายเป็น RISC-V assembly แบบสด (เลือก compiler เป็น RISC-V rv32/rv64)\nRipes — โปรแกรมเดสก์ท็อป เห็น datapath / pipeline / cache เคลื่อนไหวจริง (เหมาะมากกับ Topic 12–13)"}, {"type": "note", "content": "ลองเล่นเอง: คลิกคำสั่ง LC-3 เพื่อดูว่าเขียนเป็น RISC-V RV32I อย่างไร และต่างกันตรงไหน — เป็น \"พจนานุกรม\" ย่อของทั้ง Topic นี้"}, {"type": "image", "alt": "LC-3 → RISC-V (RV32I) — พจนานุกรมคำสั่งแบบคลิกดู", "src": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAvAAAAGgCAIAAABDosRHAAAAAXNSR0IArs4c6QAAIABJREFUeJzsnXtYU1e68F8ue3NJ5JIACWkwoBDLRVHgCMwH6sBo6WdFR+wU7Yg9aLVVRqUV622kOKgteLwVW6mXU7FVHIXpoB6jlkwxPA3wAQJi1ASFSCQESMIl4bI3ge+PcFMTLorj5azf4/OYhLXXetfaa73r3e9619omPT09AAAAvb3Q/6G3kzDRtve2d5m0d0J7J3TrAIFAIBAIBOKlYG4G1pb6f70UKxNLvNfExET/p/7/waSnpwfApLe3V2/KAJjUK3tbtCamJmBtCVYWYGUJmLnJcOUgEAgEAoFAvDDI7t6OTujogvZO6O0FG0ovk24C0GfWmJiYAPSa9PT06gEAkoQqmYmVJbAZyIJBIBAIBALxKlKr6O3sAnd2L2YOeoPGxMTERKfr0Ttmurp6b1ebTGID1RpZMwgEAoFAIF5d2tp7H9SCj3uvBdbnqjHp7tYBmJBkb0WVie8UZMogEAgEAoF4PSgX905z78XMTQB6TfWhM1UymOzysuVCIBAIBAKBGDWT3oIqWV8csGlvLyhUYGVpglaaEAgEAoFAvEZMoJhY4tCght5eMO0koFVrgqKAEQgEAoFAvHa4ME1aNNBFgGl7R68JMmYQCAQCgUC8npiYmGg7e021nSbWli9bFgQCgUAgEIhnwsoCtJ0mpu1dYGXxsmVBIBAIBAKBeCasLaGjE0w7OsEKeWgQCAQCgUC8nlhZQnsnmHfrTNCbDRAIBAKBQLymYOYm3TowfdliIBAIBAKBQDwvyKBBIN58JGd/TVif+9OtZ7m2q+RmwvrrSVmq8RcLgUAgxg/zly0AAoF44ajEiqICHb5YB2A25ouVqrICBZVFvhDJEAgEYpxAHhoEAoFAIBCvPchDg0C8+bi/F7DFX8fkjt09AwAU2+BAsOCM6VpNYZakTEMJWcz1nvAsZSIQCMRYQQYNAjF2ujQ3L93ll7aoCJwZ5Br5ngvnhR7m1KY4v6vwTEkH1cc1LjEwkD7Ky3TyX2/+cFmDB3mvjpr8LrRc+erXJOrkuDiXkTLQKUvuX7he91Cpo9Jp7qDIK1RTHTxHElIluCTJL9VocKuJPvjDU3fzVfa0uf9Wg6ZN2UGAGZWOo6O1EIj/hSCD5o2mrTbp/Ty+CpiLwzK2sF47Ld92LTd6h1wDlCUnIv8y9Zm8Cy8CZc3eT37jSXv6vuZJczI5O4+Gho7Wzhgzt4/9lpanBQBVgWTXVw6ZqZNHZSQoxV/tuCvCMSJPTZ36xzWcpvxLsiIf1mfDX9XVcmUXf/91LdH3XT6aotpKindsv1s2EDd8fTQXjTuK7z+8nqNx3pkbHv7a9XUEAvHcjM2gabt0/b1dCgAAZ49v/xnobTShTlly/0K2tKhSVa8kNWBKpdt6BXMiF08O5VoNk7+ypPKHTJlIrKlXEhqiB6daMl3tp8/1XLaU5TwmQceATrD93I7rPUN/wnGMxqHNfM/7sXJrbq780+0qAAD71X+f/6Fr389t4vtnTknyS1 -3 เป็น \"สนามฝึก\" เพราะมันเล็กพอจะมองเห็นทุกบิตในเครื่องได้ทั้งเครื่อง แต่เมื่อเข้าใจหลักการแล้ว เราต้องก้าวไปสู่ ISA ที่ใช้งานจริงในอุตสาหกรรมและวงวิชาการ นั่นคือ RISC-V RV32I หน้านี้สรุปว่า LC-3 ให้อะไรเรา และทำไมมันถึงพอแค่ระดับ \"เครื่องสอน\"", "blocks": [{"type": "subheading", "content": "LC-3 คืออะไร — และมันถูกออกแบบมาเพื่อ \"สอน\""}, {"type": "note", "content": "• เครื่องสอน (educational machine) ขนาด 16-bit ทุกอย่างกว้าง 16 บิต ทั้งคำสั่ง (instruction), รีจิสเตอร์, และที่อยู่หน่วยความจำ (address) จึงเข้าถึงหน่วยความจำได้ในวงจำกัด\n• รีจิสเตอร์ทั่วไป 8 ตัว (R0-R7)\n• ชุดคำสั่งเล็กมาก ราว 15 opcode เช่น ADD, AND, NOT, LD/ST, LDR/STR, LDI/STI, LEA, BR, JMP/JSR, TRAP ครบพอจะเขียนโปรแกรมพื้นฐานได้ แต่จงใจตัดความซับซ้อนออกเพื่อให้นักศึกษาเห็นภาพรวม\n• ความกว้างคำสั่งคงที่ 16 บิต มี opcode 4 บิตด้านบน ทำให้ถอดรหัส (decode) ด้วยมือได้ง่าย เหมาะกับการเรียนเรื่อง datapath และ FSM ของหน่วยควบคุม"}, {"type": "note", "content": "จุดแข็งของ LC-3\nเล็ก โปร่งใส ไม่มีรายละเอียดกวนใจ เหมาะกับการ \"เห็นทั้งเครื่อง\" ตั้งแต่ logic gate, datapath, control ไปจนถึง assembly — เป็นบันไดขั้นแรกที่ดีเยี่ยม"}, {"type": "subheading", "content": "ข้อจำกัดที่ทำให้ LC-3 ไปต่อไม่ได้"}, {"type": "note", "content": "• ไม่มี toolchain ระดับใช้งานจริง โดยทั่วไปมีแค่ assembler/simulator สำหรับการเรียน ไม่มีคอมไพเลอร์ภาษา C ที่ใช้ในงานจริง, ไม่มี OS, ไม่มี ecosystem ของเครื่องมือ\n• ไม่มี career transfer ไม่มีชิป LC-3 ขายในตลาด ทักษะ LC-3 ไม่ถ่ายโอนตรงไปเป็นงานในอุตสาหกรรม มันคือ \"ภาษาในห้องเรียน\"\n• สเกลไม่ขึ้น 16 บิต + รีจิสเตอร์น้อย + คำสั่งน้อย ทำให้ต่อยอดไปเรื่อง pipeline จริง, cache, virtual memory แบบที่เครื่องสมัยใหม่ใช้ได้ลำบาก ถ้าจะเรียนเรื่องเหล่านี้ต้องเปลี่ยนเครื่องอยู่ดี"}, {"type": "image", "alt": "แผนภาพประกอบ", "src": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAACTAAAAIZCAIAAAAUERWCAAAAAXNSR0IArs4c6QAAIABJREFUeJzs3X9wU+ed+PsPCTpOKjmtZG5ke63Bte4X7B1sT8dip9bsxu5ubNoYvo1DiksCDQlZILngpAHSAk3BzYLbBmcTYFrDFId8ScJCS0wLJjc2s7Uyd6zcRu63ttnaeNe+ZuXaFsXStpbS9RHB948jG/+QjA0Y+cf7NZ2OI pe": "note", "content": "ทำไมต้องรู้ + CPU ใช้ยังไง\nความกว้างของ address และคำสั่งไม่ใช่แค่ตัวเลขบนกระดาษ แต่เป็นข้อจำกัดทางฟิสิกส์ที่เดินสายไปทั้ง datapath จริง: CPU ต้องมีเส้นลวด (bus) และตัวบวกใน PC/MAR กว้างเท่าจำนวนบิตของ address ถ้ากว้าง 16 บิต วงจรจะแตะหน่วยความจำได้แค่ $2^{16}$ ตำแหน่ง ไม่ว่าจะติดแรมมาเท่าไร ดังนั้นการเลือกกระโดดไป 32 บิตคือการขยาย \"ระยะเอื้อม\" ของทั้งชิป — เข้าใจจุดนี้แล้วจะเห็นว่าทำไม ISA สมัยใหม่ถึงเป็น 32/64 บิต และทำไมโปรแกรมจริง (ที่กินหน่วยความจำระดับ GiB) ถึงรันบน LC-3 ไม่ได้"}, {"type": "note", "content": "ลองทำทีละขั้น: LC-3 ใช้ address กว้าง 16 บิต ส่วน RV32I ใช้ 32 บิต จงคำนวณว่าแต่ละเครื่องระบุที่อยู่หน่วยความจำได้กี่ตำแหน่ง และ RV32I มากกว่า LC-3 กี่เท่า"}, {"type": "example", "content": "กดดูวิธีทำทีละขั้น\nขั้น 1) จำนวนตำแหน่งที่ address n บิตระบุได้ = 2^n (แต่ละบิตมี 2 ค่า → n บิตได้ 2^n รูปแบบ)\nขั้น 2) LC-3 : n = 16 → 2^16 = 65,536 ตำแหน่ง = 64 Ki (word 16 บิต → ~64 KiB)\nขั้น 3) RV32I: n = 32 → 2^32 = 4,294,967,296 ตำแหน่ง = 4 Gi (byte-addressable → 4 GiB)\nขั้น 4) มากกว่ากี่เท่า = 2^32 / 2^16 = 2^(32-16) = 2^16 = 65,536 เท่า\nสรุป: เพิ่ม address จาก 16 เป็น 32 บิต (บวกอีก 16 บิต) ขยายพื้นที่ที่อยู่ขึ้น 2^16 = 65,536 เท่า"}, {"type": "example", "content": "ลองทาย: ระหว่าง LC-3 (16-bit) กับ RV32I (32-bit) อันไหนเข้าถึงหน่วยความจำได้กว้างกว่า และเพราะอะไร\nRV32I เพราะที่อยู่กว้าง 32 บิต ครอบคลุมพื้นที่ที่อยู่ได้ถึงระดับ 4 GiB ขณะที่ LC-3 ใช้ที่อยู่ 16 บิต จึงเข้าถึงได้เพียง 2 ยกกำลัง 16 ตำแหน่ง (ระดับ 64 Ki word) เท่านั้น"}, {"type": "subheading", "content": "เทียบกันชัด ๆ: LC-3 กับ RV32I ครบทุกมิติ"}, {"type": "note", "content": "ก่อนเจาะรายละเอียดในหัวข้อถัด ๆ ไป ดูภาพรวมความต่างทั้งหมดในตารางเดียวก่อน จะได้เห็นว่า \"สะพาน\" ที่เรากำลังข้ามยาวแค่ไหน"}, {"type": "table", "content": "<table>\n<thead>\n<tr><th>มิติ</th><th>LC-3 (เครื่องสอน)</th><th>RV32I (ISA จริง)</th></tr>\n</thead>\n<tbody>\n<tr><td>ความกว้างของข้อมูล/รีจิสเตอร์</td><td>16 บิต</td><td>32 บิต</td></tr>\n<tr><td>ความกว้างของคำสั่ง</td><td>16 บิตคงที่</td><td>32 บิตคงที่ (ในฐาน I)</td></tr>\n<tr><td>จำนวน/ชื่อรีจิสเตอร์</td><td>8 ตัว: R0–R7</td><td>32 ตัว: x0–x31 โดย x0 อ่านได้ค่า 0 เสมอ และมีชื่อตามบทบาท (ABI) เช่น zero, ra, sp, a0, t0</td></tr>\n<tr><td>ขนาด address space</td><td>$2^{16}$ = 65,536 ตำแหน่ง (อ้างทีละ word 16 บิต)</td><td>$2^{32}$ ไบต์ = 4 GiB (อ้างเป็นรายไบต์)</td></tr>\n<tr><td>จำนวนคำสั่ง</td><td>ราว 15 opcode</td><td>ราว 40 คำสั่งในฐาน (ยังไม่นับส่วนขยาย)</td></tr>\n<tr><td>ความกว้าง immediate</td><td>5 บิตใน ADD/AND (−16 ถึง +15) และ offset 6/9/11 บิตใน load/store/branch</td><td>12 บิตในกลุ่มคำนวณ/load/store (−2048 ถึง +2047) และ 20 บิตใน lui/jal</td></tr>\n<tr><td>คูณ/หาร</td><td>ไม่มี — ต้องเขียนลูปบวกซ้ำเอง</td><td>ฐาน I ไม่มีเช่นกัน แต่เติมส่วนขยาย M ได้ทันที (mul, div, rem)</td></tr>\n<tr><td>เลื่อนบิต</td><td>ไม่มีคำสั่งเลื่อนบิตเลย (เลื่อนซ้าย 1 ตำแหน่ง = ADD ตัวเองหนึ่งครั้ง)</td><td>มีครบ: sll, srl, sra และแบบ immediate slli, srli, srai</td></tr>\n<tr><td>วิธีเรียกระบบ</td><td>TRAP พร้อมเวกเตอร์ เช่น x20 (GETC), x21 (OUT), x25 (HALT)</td><td>ecall คำสั่งเดียว โดยใส่หมายเลขบริการไว้ในรีจิสเตอร์ (เช่น a0 ตามแบบแผนของ Venus)</td></tr>\n</tbody>\n</table>"}, {"type": "note", "content": "วิธีอ่านตารางนี้ให้ได้ประโยชน์ ทำตามลำดับ 3 ขั้น:\n\n1. จำคู่ตัวเลข \"เชิงขนาด\" ก่อน: ความกว้าง 16 → 32 บิต และรีจิสเตอร์ 8 → 32 ตัว สองคู่นี้คือหัวใจของการย้าย\n2. แถวคูณ/หาร เลื่อนบิต และ immediate คือความต่าง \"เชิงความสามารถ\" — หัวข้อ 10.3 จะเจาะทีละเรื่อง\n3. แถว TRAP ↔ ecall คือความต่าง \"เชิงวิธีคุยกับระบบ\" — หัวข้อ 10.2 (ตอนที่ 2) จะเจาะต่อ"}, {"type": "subheading", "content": "ตัวอย่างแรกให้เห็นภาพ: โปรแกรมเดียวกัน เขียนสองภาษา"}, {"type": "note", "content": "โจทย์: บวกเลข 1 ถึง 5 แล้วเก็บผลรวมลงตัวแปรในหน่วยความจำ — ด้านล่างคือโปรแกรม \"เดียวกัน\" สองฉบับ อ่านคู่กันบรรทัดต่อบรรทัดจะเห็นทั้งความเหมือนของแนวคิดและความต่างของรายละเอียด"}, {"type": "table", "content": "<pre style=\"font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--navy-deep);color:#EAF1FA;padding:14px 16px;border-radius:6px;border-left:4px solid var(--flag);overflow-x:auto;white-space:pre;\">; ฉบับ LC-3: รวม 1+2+3+4+5 เก็บลง RESULT\n        .ORIG x3000\n        AND R1, R1, #0      ; R1 = sum = 0\n        AND R2, R2, #0      ; ล้าง R2 ก่อน (ไม่มีรีจิสเตอร์ค่าศูนย์)\n        ADD R2, R2, #1      ; R2 = i = 1\nLOOP    ADD R1, R1, R2      ; sum = sum + i\n        ADD R2, R2, #1      ; i = i + 1\n        ADD R3, R2, #-6     ; R3 = i - 6 (ตั้ง condition code)\n        BRn LOOP            ; ถ้า R3 ติดลบ (i ยังไม่ถึง 6) วนต่อ\n        ST  R1, RESULT      ; เก็บ sum ลงตัวแปร RESULT\n        HALT                ; จบโปรแกรมผ่าน TRAP x25\nRESULT  .FILL x0000\n        .END</pre>"}, {"type": "table", "content": "<pre style=\"font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--navy-deep);color:#EAF1FA;padding:14px 16px;border-radius:6px;border-left:4px solid var(--flag);overflow-x:auto;white-space:pre;\"># ฉบับ RISC-V RV32I: รวม 1+2+3+4+5 เก็บลง result\n        .data\nresult: .word 0\n        .text\n        addi t0, zero, 0    # t0 = sum = 0 (zero คือ x0 อ่านได้ 0 เสมอ)\n        addi t1, zero, 1    # t1 = i = 1 (คำสั่งเดียวจบ)\n        addi t2, zero, 5    # t2 = ค่าสุดท้ายที่ต้องบวก\nloop:   add  t0, t0, t1     # sum = sum + i\n        addi t1, t1, 1      # i = i + 1\n        bge  t2, t1, loop   # ถ้า i ยังไม่เกิน 5 วนต่อ (เทียบรีจิสเตอร์ตรง ๆ)\n        la   t3, result     # เอา \"ที่อยู่\" ของ result มาไว้ใน t3\n        sw   t0, 0(t3)      # เก็บ sum ลงหน่วยความจำตำแหน่ง t3 + 0\n        addi a0, zero, 10   # หมายเลขบริการ exit (แบบแผนของ Venus)\n        ecall               # เรียกระบบ — ญาติของ TRAP นั่นเอง</pre>"}, {"type": "note", "content": "อ่านทีละขั้นพร้อมคำอธิบาย (ขั้นเดียวกันของสองฉบับอยู่แถวเดียวกัน):"}, {"type": "table", "content": "<table>\n<thead>\n<tr><th>ขั้น</th><th>LC-3</th><th>RV32I</th><th>คำอธิบาย</th></tr>\n</thead>\n<tbody>\n<tr><td>1</td><td><code>AND R1, R1, #0</code></td><td><code>addi t0, zero, 0</code></td><td>ตั้ง sum = 0 — LC-3 ต้อง AND กับ 0 เพื่อล้างค่าเก่า RV32I บวก 0 กับรีจิสเตอร์ zero ได้เลย</td></tr>\n<tr><td>2</td><td><code>AND R2, R2, #0</code> แล้ว <code>ADD R2, R2, #1</code></td><td><code>addi t1, zero, 1</code></td><td>ตั้ง i = 1 — LC-3 ใช้ 2 คำสั่ง (ล้างก่อน ค่อยบวก) RV32I คำสั่งเดียว</td></tr>\n<tr><td>3</td><td>— (ฝังเลขไว้ใน <code>#-6</code> ของขั้น 6)</td><td><code>addi t2, zero, 5</code></td><td>RV32I เตรียมค่าเพดาน 5 ไว้ในรีจิสเตอร์เพื่อใช้เทียบตรง ๆ</td></tr>\n<tr><td>4</td><td><code>LOOP ADD R1, R1, R2</code></td><td><code>loop: add t0, t0, t1</code></td><td>หัวใจลูป: sum ← sum + i — สองฉบับเหมือนกันแทบทุกตัวอักษร</td></tr>\n<tr><td>5</td><td><code>ADD R2, R2, #1</code></td><td><code>addi t1, t1, 1</code></td><td>i ← i + 1</td></tr>\n<tr><td>6</td><td><code>ADD R3, R2, #-6</code> แล้ว <code>BRn LOOP</code></td><td><code>bge t2, t1, loop</code></td><td>ตัดสินใจวนต่อ — LC-3 ต้องลบทิ้งไว้ใน R3 ให้ condition code ติดลบก่อน แล้วค่อย BRn (2 คำสั่ง เปลืองรีจิสเตอร์ 1 ตัว) RV32I เทียบสองรีจิสเตอร์จบในคำสั่ง branch เดียว</td></tr>\n<tr><td>7</td><td><code>ST R1, RESULT</code></td><td><code>la t3, result</code> แล้ว <code>sw t0, 0(t3)</code></td><td>เก็บผลลงหน่วยความจำ — LC-3 อ้าง label ตรง ๆ ได้เพราะ ST เป็น PC-relative (รัศมีราว 256 word) RV32I ต้องเอาที่อยู่เข้ารีจิสเตอร์ก่อนแล้ว store ผ่าน base + offset แลกกับระยะเอื้อมทั้ง 4 GiB</td></tr>\n<tr><td>8</td><td><code>HALT</code></td><td><code>addi a0, zero, 10</code> แล้ว <code>ecall</code></td><td>จบโปรแกรม — HALT ของ LC-3 คือ TRAP x25 ส่วน RV32I ใช้ ecall กับหมายเลขบริการ</td></tr>\n</tbody>\n</table>"}, {"type": "note", "content": "สามจุดต่างสำคัญที่ต้องเก็บจากตัวอย่างนี้:\n\n1. รีจิสเตอร์ค่าศูนย์ (x0/zero) — LC-3 ไม่มี จึงต้องล้างรีจิสเตอร์ด้วย AND #0 ก่อนเสมอ RV32I ตั้งค่าคงที่ใด ๆ ได้ในคำสั่งเดียวด้วย addi rd, zero, ค่า\n2. branch เทียบรีจิสเตอร์ตรง ๆ — LC-3 ตัดสินใจจาก condition code (N, Z, P) ที่คำสั่งก่อนหน้าตั้งไว้ จึงต้องคำนวณผลต่างทิ้งไว้ก่อนหนึ่งคำสั่ง RV32I ใส่การเปรียบเทียบไว้ในตัว branch เอง (beq, bne, bge, blt)\n3. เข้าถึงหน่วยความจำผ่านรีจิสเตอร์ฐาน — LC-3 โหลด/เก็บอ้าง label ใกล้ ๆ ได้ตรง ๆ RV32I ต้องมีที่อยู่ในรีจิสเตอร์ก่อนแล้วบวก offset ซึ่งดูเพิ่มขั้นตอน แต่ทำให้เอื้อมถึงหน่วยความจำได้ทั้ง 4 GiB\n\nก่อนเปิดเฉลย ลองไล่ค่า t0 (sum) กับ t1 (i) ของฝั่ง RV32I ในกระดาษทดเองสักหนึ่งรอบ"}, {"type": "example", "content": "กดดูวิธีทำทีละขั้น\nตารางไล่ค่าฝั่ง RV32I (ทุกรอบของลูป)\nรอบ | หลัง add (t0 = sum) | หลัง addi (t1 = i) | bge: t2 ≥ t1 ? | ไปไหนต่อ\n 1 | t0 = 1 | t1 = 2 | 5 ≥ 2 จริง | กลับไป loop\n 2 | t0 = 3 | t1 = 3 | 5 ≥ 3 จริง | กลับไป loop\n 3 | t0 = 6 | t1 = 4 | 5 ≥ 4 จริง | กลับไป loop\n 4 | t0 = 10 | t1 = 5 | 5 ≥ 5 จริง | กลับไป loop\n 5 | t0 = 15 | t1 = 6 | 5 ≥ 6 เท็จ | หลุดลูป\n \nฝั่ง LC-3 ให้ผลเดินคู่กันเป๊ะ: R1 (sum) ไล่ 1, 3, 6, 10, 15\nและ R3 = i − 6 ไล่ −4, −3, −2, −1, 0\nรอบสุดท้าย R3 = 0 → condition code เป็น Z (ไม่ใช่ N) → BRn ไม่กระโดด → หลุดลูป\n \nทั้งสองฉบับจึงเก็บค่า 15 ลงตัวแปร (RESULT ฝั่ง LC-3, result ฝั่ง RV32I)"}, {"type": "note", "content": "สังเกต: โครงสร้างลูป (ตั้งค่า → บวกสะสม → เพิ่มตัวนับ → ตรวจเงื่อนไข) เหมือนกันทุกประการ — สิ่งที่ต่างคือ \"เครื่องมือ\" ที่แต่ละ ISA มีให้ใช้ในแต่ละขั้น"}, {"type": "diagram", "layout": "flow", "title": "Instruction Cycle เปรียบเทียบ: LC-3 vs RISC-V", "actors": ["Fetch", "Decode", "Execute"], "steps": [{"from": 0, "to": 1, "label": "ทั้งสอง ISA ดึงคำสั่งจาก Memory เหมือนกัน", "note": ""}, {"from": 1, "to": 2, "label": "ต่างกันที่รูปแบบ encoding และจำนวน Register (8 vs 32)", "note": ""}]}]}, {"title": "10.1 (ต่อ) RISC-V RV32I — ISA จริงที่ \"ง่ายพอจะเป็นอันแรก\"", "body": "หน้านี้อธิบายว่า RV32I (ฐาน 32-bit integer ของ RISC-V) ให้สิ่งที่ LC-3 ขาด พร้อมกับยังคงความ \"ง่าย\" พอจะเป็น ISA แรกของผู้เรียนได้", "blocks": [{"type": "subheading", "content": "RV32I ให้อะไรที่ LC-3 ไม่ให้"}, {"type": "note", "content": "• 32-bit จริง ข้อมูล/รีจิสเตอร์/ที่อยู่กว้าง 32 บิต มีรีจิสเตอร์ทั่วไป 32 ตัว (x0-x31 โดย x0 ผูกค่าเป็นศูนย์เสมอ) ความกว้างคำสั่งฐานคงที่ 32 บิต\n• ISA แบบ modular และเปิด (open standard) RISC-V แยกเป็น \"ฐาน + ส่วนขยาย\" RV32I คือฐานจำนวนเต็ม แล้วค่อยเติม M (คูณ/หาร), A (atomic), F/D (floating-point), C (compressed) ฯลฯ ต่อเมื่อจำเป็น ตัว spec เป็นมาตรฐานเปิดที่ใครก็นำไปออกแบบได้โดยไม่ติดค่าลิขสิทธิ์ ISA จึงเป็นทั้งมาตรฐานอุตสาหกรรมและงานวิชาการ\n• toolchain ครบจริง ใช้ได้กับ GCC และ LLVM/Clang, รัน Linux ได้, มี simulator/emulator หลายระดับ เช่น Spike (golden model อ้างอิง), QEMU (emulation ทั้งระบบ) และ Ripes (visualizer เชิงการศึกษา ที่เห็น pipeline/datapath)\n• career transfer จริง ทักษะ RISC-V ถ่ายโอนตรงไปสู่ชิปและงานจริงในตลาด ต่างจาก LC-3 ที่อยู่แค่ในห้องเรียน"}, {"type": "note", "content": "สเกลได้โดยไม่เปลี่ยน ISA\nจุดเด่นที่สุดสำหรับการสอน: เริ่มจาก RV32I ระดับ intro แล้วไต่ไปจนถึง microarchitecture ละเอียดบน gem5 (simulator งานวิจัยสถาปัตยกรรม) ได้ โดยยังเป็น ISA เดิม ไม่ต้องทิ้งของเก่าทิ้งเหมือนตอนเลิกใช้ LC-3"}, {"type": "subheading", "content": "ทำไม RV32I subset ถึงยัง \"ง่ายพอ\" เป็น ISA แรก"}, {"type": "note", "content": "ถึงจะเป็น ISA จริง แต่ฐาน RV32I มีจำนวนคำสั่งไม่มาก (อยู่ในระดับไม่กี่สิบคำสั่ง) จัดกลุ่มเป็นไม่กี่รูปแบบ (format) ตามหลักการ — กลุ่ม R (register-register), I (immediate/load), S (store), B (branch), U (upper immediate) และ J (jump) — ความสม่ำเสมอนี้ทำให้ถอดรหัสและสอนเป็นระบบได้ และเทียบเคียงกับคำสั่ง LC-3 ที่คุ้นเคยได้ตรงตัว"}, {"type": "table", "content": "<pre style=\"font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--navy-deep);color:#EAF1FA;padding:14px 16px;border-radius:6px;border-left:4px solid var(--flag);overflow-x:auto;white-space:pre;\"># LC-3: บวก R1 = R2 + R3\nADD R1, R2, R3</pre>"}, {"type": "table", "content": "<pre style=\"font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--navy-deep);color:#EAF1FA;padding:14px 16px;border-radius:6px;border-left:4px solid var(--flag);overflow-x:auto;white-space:pre;\"># RISC-V RV32I: บวก x1 = x2 + x3 (รูปแบบ R-type)\nadd x1, x2, x3</pre>"}, {"type": "note", "content": "แนวคิด register-register เดิมยังอยู่ เปลี่ยนแค่ชื่อรีจิสเตอร์และความกว้าง ผู้เรียนจึง \"ย้ายความรู้\" จาก LC-3 มา RV32I ได้ทันที"}, {"type": "note", "content": "ทำไมต้องรู้ + CPU ใช้ยังไง\nISA คือ \"สัญญา\" ที่ฮาร์ดแวร์กับซอฟต์แวร์ตกลงกัน CPU ทุกตัวถูกออกแบบมาให้ถอดรหัส (decode) และ execute ตามชุดคำสั่งของ ISA หนึ่งชุดเป๊ะ ๆ การรู้ว่าฐาน RV32I มีคำสั่งไม่กี่สิบตัวและจัดเป็นไม่กี่ format สำคัญมาก เพราะความสม่ำเสมอของ format นี่แหละคือสิ่งที่ทำให้วงจร decoder ในฮาร์ดแวร์เล็กและเร็ว (ตัดฟิลด์ opcode/rs1/rs2/rd ออกจากตำแหน่งบิตเดิมได้เสมอ) โครงสร้างเดียวกันนี้เป็นรากของ datapath และ pipeline ที่จะเรียนต่อ ขาดความเข้าใจ ISA แล้วต่อยอดไป microarchitecture จริงไม่ได้เลย"}, {"type": "note", "content": "ลองทำทีละขั้น: LC-3 ใช้ 3 บิตเลือกรีจิสเตอร์ ส่วน RV32I ใช้ 5 บิต — คำนวณว่าแต่ละแบบเลือกรีจิสเตอร์ได้กี่ตัว และเหตุใด RV32I จึงต้องใช้ 5 บิต"}, {"type": "example", "content": "กดดูวิธีทำทีละขั้น\nขั้น 1) จำนวนรีจิสเตอร์ที่เลือกได้ = 2^(จำนวนบิตของ field)\n เพราะ n บิต แทนรูปแบบต่างกันได้ 2^n แบบ แต่ละแบบชี้รีจิสเตอร์ 1 ตัว\nขั้น 2) LC-3: field กว้าง 3 บิต → เลือกได้ 2^3 = 8 ตัว → ตรงกับ R0–R7 พอดี\nขั้น 3) RV32I: ต้องเลือก 32 ตัว (x0–x31)\n ถ้าใช้ 4 บิต ได้ 2^4 = 16 ตัว → น้อยไป เลือกไม่ครบ\n ถ้าใช้ 5 บิต ได้ 2^5 = 32 ตัว → พอดีกับ x0–x31\nขั้น 4) สรุป: 5 บิตคือจำนวนบิตน้อยที่สุดที่พอเลือกครบ 32 ตัว\n ในคำสั่ง R-type จึงมี field เลือกรีจิสเตอร์ 3 ชุด (rd, rs1, rs2) ชุดละ 5 บิต = 15 บิต"}, {"type": "image", "alt": "แผนภาพประกอบ", "src": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABRwAAATCCAIAAABQQ73NAAAAAXNSR0IArs4c6QAAIABJREFUeJzs3Xtc1HXe//8XCgPGYAIm6EKhmMleCl6Bu0LuwtUmdq3apel6Ss3UCtu0g6h5KDRPpOAJVNJkKc+W6f6CtkVvXbBfhdaG3UC7QBLSYAU8gC2DygzI748PICIqjMBnmHnc/9jbez4zzDyBNeY57/fn/bGpqakRAAAAAADQcp3UDgAAAAAAQEdFqQYAAAAAwESUagAAAAAATESpBgAAAADARJRqAAAAAABMRKkGAAAAAMBElGoAAAAAAExEqQYAAAAAwESUagAAAAAATESpBgAAAADARJRqAAAAAABMRKkGAAAAAMBElGoAAAAAAExEqQYAAAAAwESUagAAAAAATESpBgAAAADARJRqAAAAAABMRKkGAAAAAMBElGoAAAAAAExEqQYAAAAAwESUagAAAAAATGSrdgAAAGDJkneVFOReUzsFAKhs2lIvO3sbtVOgTVCqAQBAG6q8Xn1dX612CgBQWU1NjQil2jKx/BsAAAAAABMxUw0AANrD0y/8orung9opAKBdfbHl3PVyVutYOEo /53/77//DP77r4eBAeb04Px2amQuFlyKxpXhcRJWhUmu12kN6Q67BcJj/uAPAXvtL7K///aspEdH8m7//bce/e9fDSaBSDQAAsB0ZWTlHs3KOvsW0bQDAv0CsqQYAAAAAQCFCNQAAAAAAChGqAQAAAABQiFANAAAAAIBChGoAAAAAABQiVAMAAAAAoBChGgAAAAAAhQjVAAAAAAAoRKgGAAAAAEAhQjUAAAAAAAoRqgEAAAAAUIhQDQAAAACAQoRqAAAAAAAUIlQDAAAAAKAQoRoAAAAAAIUI1QAAAAAAKESoBgAAAABAIUI1AAAAAAAKEaoBAAAAAFCIUA0AAAAAgEKEagAAAAAAFCJUAwAAAACgEKEaAAAAAACFCNUAAAAAAChEqAYAAAAAQCFCNQAAAAAAChGqAQAAAABQiFANAAAAAIBChGoAAAAAABQiVAMAAAAAoBChGgAAAAAAhQjVAAAAAAAoRKgGAAAAAEAhQjUAAAAAAAoRqgEAAAAAUIhQDQAAAACAQoRqAAAAAAAUIlQDAAAAAKAQoRoAAAAAAIUI1QAAAAAAKESoBgAAAABAIUI1AAAAAAAKEaoBAAAAAFCIUA0AAAAAgEKEagAAAAAAFCJUAwAAAACgEKEaAAAAAACFCNUAAAAAAChEqAYAAAAAQCFCNQAAAAAAChGqAQAAAABQiFANAAAAAIBChGoAAAAAABQiVAMAAAAAoBChGgAAAAAAhQjVAAAAAAAoRKgGAAAAAEAhQjUAAAAAAAoRqgEAAAAAUIhQDQAAAACAQoRqAAAAAAAUIlQDAAAAAKAQoRoAAAAAAIX+1bseAAAAB9Ff4n+N/b+/vutRAACAFX+JH8R/mgnVAACk8c/Dr/55+NW7HgUAADjomP4NAAAAAIBCVKoBAFjxr//h7zN1/OMIAMCB9g//eID+sf67X3755V2PAQAAAACA9xLTvwEAAAAAUIhQDQAAAACAQoRqAAAAAAAUIlQDAAAAAKAQoRoAAAAAAIUI1QAAAAAAKESoBgAAAABAIUI1AAAAAAAKEaoBAAAAAFCIUA0AAAAAgEKEagAAAAAAFCJUAwAAAACgEKEaAAAAAACFCNUAAAAAAChEqAYAAAAAQCFCNQAAAAAAChGqAQAAAABQiFANAAAAAIBChGoAAAAAABQiVAMAAAAAoBChGgAAAAAAhQjVAAAAAAAoRKgGAAAAAEAhQjUAAAAAAAoRqgEAAAAAUIhQDQAAAACAQoRqAAAAAAAUIlQDAAAAAKAQoRoAAAAAAIUI1QAAAAAAKESoBgAAAABAIUI1AAAAAAAKEaoBAAAAAFCIUA0AAAAAgEKEagAAAAAAFCJUAwAAAACgEKEaAAAAAACFCNUAAAAAAChEqAYAAAAAQCFCNQAAAAAAChGqAQAAAABQiFANAAAAAIBChGoAAAAAABT6/44cWMk7bN56AAAAAElFTkSuQmCC"}, {"type": "subheading", "content": "บันไดอ่านโค้ด RV32I: ไต่สามระดับก่อนข้ามสะพาน"}, {"type": "note", "content": "จะรู้ว่า \"ย้ายความรู้\" สำเร็จหรือยัง ต้องลองอ่านโค้ด RV32I จริง ๆ ด้านล่างคือโจทย์สามระดับ จากง่ายไปยาก ก่อนทำทุกข้อให้ใช้วิธีอ่านชุดเดียวกันนี้:\n\n1. อ่านชื่อคำสั่ง (mnemonic) ก่อน ว่าอยู่กลุ่มไหน: คำนวณ (add/addi), หน่วยความจำ (lw/sw) หรือควบคุมทิศทาง (beq/jal)\n2. หาปลายทางของผลลัพธ์: กลุ่มคำนวณและ load เขียนผลลงรีจิสเตอร์ตัวแรก (rd) แต่ sw เขียนลง \"หน่วยความจำ\" ไม่ใช่รีจิสเตอร์\n3. ไล่ค่าทีละบรรทัดลงตารางบนกระดาษทด — อย่าอ่านรวดเดียวแล้วเดาผลรวม เพราะจุดพลาดส่วนใหญ่มาจากการข้ามบรรทัด"}, {"type": "subheading", "content": "ระดับ 1 (ง่าย): คำนวณล้วน 2 บรรทัด"}, {"type": "note", "content": "โจทย์: หลังรันโค้ดนี้ x6 มีค่าเท่าไร"}, {"type": "table", "content": "<pre style=\"font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--navy-deep);color:#EAF1FA;padding:14px 16px;border-radius:6px;border-left:4px solid var(--flag);overflow-x:auto;white-space:pre;\">addi x5, x0, 7      # x5 = 0 + 7\nadd  x6, x5, x5     # x6 = x5 + x5</pre>"}, {"type": "note", "content": "ลองไล่ค่าในหัวก่อนสักครั้ง แล้วค่อยเปิดเฉลย"}, {"type": "example", "content": "กดดูวิธีทำทีละขั้น\nบรรทัด | ผลของบรรทัด | ค่าในรีจิสเตอร์หลังรัน\naddi x5, x0, 7 | x5 = x0 + 7 = 0 + 7 | x5 = 7\nadd x6, x5, x5 | x6 = x5 + x5 = 7 + 7 | x5 = 7, x6 = 14\n \nคำตอบ: x6 = 14"}, {"type": "note", "content": "สังเกต: add rd, rs, rs (บวกตัวเอง) คือสำนวนมาตรฐานของ \"คูณ 2\" — LC-3 ก็ใช้ท่าเดียวกัน (ADD R1, R1, R1) เพราะทั้งคู่ไม่มีคำสั่งคูณในฐาน"}, {"type": "subheading", "content": "ระดับ 2 (กลาง): มี lw/sw เข้ามาเกี่ยว"}, {"type": "note", "content": "สมมุติหน่วยความจำเริ่มต้นตามผังนี้ (RV32I อ้างที่อยู่เป็นรายไบต์ และ word หนึ่งกิน 4 ไบต์ ที่อยู่ของ word ถัดไปจึงกระโดดทีละ 4)"}, {"type": "table", "content": "<pre style=\"font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--navy-deep);color:#EAF1FA;padding:14px 16px;border-radius:6px;border-left:4px solid var(--flag);overflow-x:auto;white-space:pre;\">ที่อยู่ (hex) | ค่า (word 32 บิต) | หมายเหตุ\n0x1000       | 10               | ตัวตั้งตัวแรก\n0x1004       | 20               | ตัวตั้งตัวที่สอง\n0x1008       | ?                | ช่องว่างรอผลลัพธ์</pre>"}, {"type": "note", "content": "โจทย์: หลังรันโค้ดนี้ x28 มีค่าเท่าไร และหน่วยความจำตำแหน่ง 0x1008 เก็บค่าอะไร"}, {"type": "table", "content": "<pre style=\"font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--navy-deep);color:#EAF1FA;padding:14px 16px;border-radius:6px;border-left:4px solid var(--flag);overflow-x:auto;white-space:pre;\">lui  x5, 1          # x5 = 1 × 2^12 = 0x1000 (สร้างที่อยู่ฐาน)\nlw   x6, 0(x5)      # x6 = ค่าใน M[x5 + 0]\nlw   x7, 4(x5)      # x7 = ค่าใน M[x5 + 4]\nadd  x28, x6, x7    # บวกสองค่าที่โหลดมา\nsw   x28, 8(x5)     # เขียน x28 ลง M[x5 + 8]</pre>"}, {"type": "note", "content": "ลองวาดผังหน่วยความจำแล้วไล่ทีละบรรทัดก่อนเปิดเฉลย"}, {"type": "example", "content": "กดดูวิธีทำทีละขั้น\nบรรทัด | คิดอย่างไร | ผลลัพธ์\nlui x5, 1 | x5 = 1 × 2^12 = 4096 | x5 = 0x00001000\nlw x6, 0(x5) | อ่าน word ที่ 0x1000 + 0 = 0x1000 | x6 = 10\nlw x7, 4(x5) | อ่าน word ที่ 0x1000 + 4 = 0x1004 | x7 = 20\nadd x28, x6, x7 | 10 + 20 | x28 = 30\nsw x28, 8(x5) | เขียน 30 ลงที่อยู่ 0x1000 + 8 = 0x1008 | M[0x1008] = 30\n \nคำตอบ: x28 = 30 และ M[0x1008] = 30"}, {"type": "note", "content": "สังเกต: lw/sw ของ RV32I คือญาติของ LDR/STR ใน LC-3 (base + offset เหมือนกัน) ต่างกันที่ offset ของ RV32I นับเป็น \"ไบต์\" — จะเจาะเรื่องนี้เต็ม ๆ ในหัวข้อ 10.4"}, {"type": "subheading", "content": "ระดับ 3 (ยาก): ลูปสั้นที่มี beq กับ jal"}, {"type": "note", "content": "โจทย์: ลูปนี้รันบรรทัด addi x5, x5, 2 ทั้งหมดกี่รอบก่อนหลุดออกไปที่ done และตอนจบ x5 มีค่าเท่าไร"}, {"type": "table", "content": "<pre style=\"font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--navy-deep);color:#EAF1FA;padding:14px 16px;border-radius:6px;border-left:4px solid var(--flag);overflow-x:auto;white-space:pre;\">        addi x5, x0, 0      # x5 = ตัวนับ เริ่มที่ 0\n        addi x6, x0, 8      # x6 = ค่าเป้าหมาย\nloop:   addi x5, x5, 2      # เพิ่มตัวนับทีละ 2\n        beq  x5, x6, done   # ถ้า x5 เท่ากับ x6 ให้ออกจากลูป\n        jal  x0, loop       # กระโดดกลับไป loop เสมอ\ndone:   # (โปรแกรมส่วนถัดไป)</pre>"}, {"type": "note", "content": "กรอกคำตอบรอบของคุณก่อน แล้วค่อยเปิดตารางไล่ค่า"}, {"type": "example", "content": "กดดูวิธีทำทีละขั้น\nสองบรรทัดแรก (รันครั้งเดียว): x5 = 0, x6 = 8\n \nรอบ | หลัง addi x5, x5, 2 | beq x5, x6, done ? | คำสั่งถัดไป\n 1 | x5 = 2 | 2 ≠ 8 → ไม่กระโดด | jal กลับไป loop\n 2 | x5 = 4 | 4 ≠ 8 → ไม่กระโดด | jal กลับไป loop\n 3 | x5 = 6 | 6 ≠ 8 → ไม่กระโดด | jal กลับไป loop\n 4 | x5 = 8 | 8 = 8 → กระโดด! | ไปที่ done\n \nคำตอบ: addi ถูกรัน 4 รอบ และ x5 จบที่ 8\nหมายเหตุ: jal x0, loop คือ \"กระโดดไม่มีเงื่อนไข\" — ปกติ jal จะเก็บ\nที่อยู่กลับไว้ใน rd แต่พอ rd = x0 ค่าที่เก็บถูกทิ้ง เหลือแค่การกระโดด\n(เทียบได้กับ BRnzp ของ LC-3)"}, {"type": "note", "content": "สังเกต: ลูปนี้คือโครงเดียวกับลูป LC-3 ทุกประการ (นับ → เทียบ → วน) ถ้าอ่านระดับ 3 ได้สบาย แปลว่าพร้อมเข้า \"ตารางแมปคำสั่ง\" ของหัวข้อ 10.2 แล้ว"}, {"type": "example", "content": "ฝึกต่อใน Venus ได้ทันที\nเอาโค้ดทั้งสามระดับไปวางใน Venus แล้วกด step ทีละคำสั่ง ดูค่ารีจิสเตอร์เปลี่ยนจริง ๆ เทียบกับตารางไล่ค่าที่คุณทำเอง — ถ้าตรงกันทุกบรรทัด แปลว่าเทคนิค \"ไล่ค่าลงตาราง\" ของคุณใช้การได้แล้ว"}]}, {"title": "10.2 ตารางแมปคำสั่ง: LC-3 ↔ RV32I (ตอนที่ 1)", "body": "หัวข้อนี้สร้าง \"พจนานุกรม\" (mapping table) ระหว่างคำสั่งของ LC-3 ที่เราคุ้นเคยจาก Topic 1-9 กับคำสั่งจริงของ RISC-V RV32I แนวคิดหลักคือ: ทุกอย่างที่ LC-3 ทำได้ RV32I ก็ทำได้ แต่ RV32I ออกแบบมาให้ \"ตรงไปตรงมา\" และ \"เป็นมาตรฐานอุตสาหกรรม\" มากกว่า", "blocks": [{"type": "note", "content": "ทำไมต้องรู้ + CPU ใช้ยังไง\nตัว CPU จริงไม่ได้ \"เข้าใจ\" คำสั่งเชิงแนวคิด มันถอดรหัส opcode จริงในฮาร์ดแวร์แล้วสั่ง ALU/หน่วยความจำทำงานตามนั้น การเทียบ LC-3 กับ RV32I ทีละคำสั่งทำให้เห็นว่า opcode ที่ RV32I \"มี\" กับ \"ไม่มี\" (เช่นไม่มี NOT โดยตรง) บังคับให้ compiler และ assembler ต้องเลือกลำดับคำสั่งจริงที่ CPU รันได้ ความรู้นี้ขาดไม่ได้เพราะเมื่อไปสร้าง datapath ในโปรเจกต์ปลายภาค คุณต้องรู้ว่าฮาร์ดแวร์ต้องรองรับ opcode ตัวใดบ้าง และคำสั่งที่ \"ดูเหมือนมี\" อย่าง NOT ต้องถูกแทนด้วยวงจร XOR ที่มีอยู่จริง"}, {"type": "note", "content": "ภาพรวมความแตกต่างเชิงโครงสร้าง\nLC-3 มี 16 บิต รีจิสเตอร์ 8 ตัว (R0-R7) ส่วน RV32I มี 32 บิต รีจิสเตอร์ 32 ตัว (x0-x31) โดย x0 ถูกฮาร์ดไวร์เป็นค่า 0 เสมอ ความกว้างที่มากขึ้นและจำนวนรีจิสเตอร์ที่มากขึ้นทำให้ RV32I รองรับโปรแกรมจริงได้โดยไม่ต้องสลับหน่วยความจำบ่อย"}, {"type": "subheading", "content": "กลุ่มที่ 1: เลขคณิตและตรรกะ (Arithmetic / Logic)"}, {"type": "note", "content": "LC-3 มีคำสั่งคำนวณเพียง 3 ตัว: ADD, AND, NOT RV32I มีคำสั่งกลุ่มนี้มากกว่า แต่เราแมปจากของเดิมได้ตรง ๆ"}, {"type": "table", "content": "<table>\n<thead>\n<tr><th>LC-3</th><th>ความหมาย</th><th>RV32I ที่เทียบเท่า</th></tr>\n</thead>\n<tbody>\n<tr><td><code>ADD R1,R2,R3</code></td><td>บวกรีจิสเตอร์</td><td><code>add x1,x2,x3</code></td></tr>\n<tr><td><code>ADD R1,R2,#5</code></td><td>บวกค่าคงที่ (imm5)</td><td><code>addi x1,x2,5</code></td></tr>\n<tr><td><code>AND R1,R2,R3</code></td><td>และระดับบิต</td><td><code>and x1,x2,x3</code></td></tr>\n<tr><td><code>AND R1,R2,#0</code></td><td>เคลียร์เป็น 0</td><td><code>andi x1,x2,0</code> (หรือ <code>mv x1,x0</code>)</td></tr>\n<tr><td><code>NOT R1,R2</code></td><td>กลับบิตทุกบิต</td><td><code>xori x1,x2,-1</code></td></tr>\n</tbody>\n</table>"}, {"type": "note", "content": "จุดที่ต้องเน้น: LC-3 ไม่มีคำสั่ง NOT แยกใน RV32I เพราะ RV32I ไม่มี opcode สำหรับ NOT โดยตรง เราใช้คุณสมบัติทางตรรกะแทน นั่นคือ \"การ XOR ด้วยเลขที่ทุกบิตเป็น 1 เท่ากับการกลับบิต\""}, {"type": "table", "content": "<pre style=\"font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--navy-deep);color:#EAF1FA;padding:14px 16px;border-radius:6px;border-left:4px solid var(--flag);overflow-x:auto;white-space:pre;\">; LC-3\nNOT R1, R2        ; R1 = bitwise-NOT(R2)\n\n# RV32I (equivalent)\nxori x1, x2, -1   # -1 = 0xFFFFFFFF (ทุกบิตเป็น 1) ⇒ กลับทุกบิต</pre>"}, {"type": "note", "content": "เหตุผลที่ -1 ใช้ได้: ในระบบ two's complement ค่า -1 มีรูปแบบบิตเป็น 1 ทั้งหมด เมื่อ XOR แต่ละบิตของ x2 กับ 1 ผลคือบิตนั้นถูกกลับค่า (0→1, 1→0) ตรงตามนิยามของ NOT พอดี ในทางปฏิบัติ assembler ของ RISC-V มี pseudo-instruction not x1, x2 ที่ขยายเป็น xori x1, x2, -1 ให้อัตโนมัติ\n\nลองทำทีละขั้น: ให้ x2 = 0x0000_00A5 (8 บิตล่าง = 1010 0101) จงหาผลของ xori x1, x2, -1 โดยไล่ XOR ทีละบิตกับตัวมาสก์ที่ทุกบิตเป็น 1 แล้วยืนยันว่าผลเท่ากับ bitwise-NOT ของ x2"}, {"type": "example", "content": "กดดูวิธีทำทีละขั้น\nโจทย์: x1 = xori x2, -1 โดย x2 (8 บิตล่าง) = 1010 0101\n \nขั้น 1 เขียน -1 เป็นบิต (mask): -1 = 0xFFFF_FFFF ⇒ ทุกบิตเป็น 1\n 8 บิตล่างของ mask = 1111 1111\n \nขั้น 2 XOR ทีละบิต (a XOR 1 = NOT a เสมอ):\n x2 : 1 0 1 0 0 1 0 1\n mask: 1 1 1 1 1 1 1 1 (XOR)\n ---------------------\n x1 : 0 1 0 1 1 0 1 0\n \nขั้น 3 ตรวจว่าตรงกับ NOT: กลับทุกบิตของ 1010 0101 ⇒ 0101 1010 ✓ ตรงกัน\n \nผล x1 (8 บิตล่าง) = 0101 1010 = 0x5A\n เต็ม 32 บิต: 0x0000_00A5 → 0xFFFF_FF5A (บิตบนที่เคยเป็น 0 กลับเป็น 1 หมด)"}, {"type": "note", "content": "สิ่งที่ควรสังเกต: NOT กระทำทั้ง 32 บิต — บิตบนที่เดิมเป็น 0 ถูกกลับเป็น 1 ทั้งหมดด้วย ไม่ใช่เฉพาะ 8 บิตล่างที่เราไล่ดู"}, {"type": "subheading", "content": "บันไดตัวอย่าง: AND และ ADD จากง่ายไปยาก"}, {"type": "note", "content": "ตัวอย่างที่ 1 (ง่าย): AND แบบรีจิสเตอร์ — แมปตรงตัว\n\nโจทย์: แปล AND R3, R1, R2 ของ LC-3 เป็น RV32I แล้วหาผลลัพธ์ เมื่อ x1 = 0x0000_00CC และ x2 = 0x0000_00AA — ลองเขียนบิต 8 บิตล่างของทั้งสองค่าแล้ว AND ทีละบิตด้วยตัวเองก่อนเปิดเฉลย"}, {"type": "example", "content": "กดดูวิธีทำทีละขั้น\nขั้น 1 แมปคำสั่ง: AND R3, R1, R2 → and x3, x1, x2 (รหัสเครื่อง 0x0020F1B3)\n รูปแบบรีจิสเตอร์เหมือนกันทุกประการ เปลี่ยนแค่ชื่อรีจิสเตอร์ R เป็น x\n \nขั้น 2 ไล่ AND ทีละบิต (a AND b = 1 เฉพาะเมื่อทั้งคู่เป็น 1):\n x1 : 1 1 0 0 1 1 0 0 (0xCC)\n x2 : 1 0 1 0 1 0 1 0 (0xAA) (AND)\n ---------------------\n x3 : 1 0 0 0 1 0 0 0 (0x88)\n \nผล x3 = 0x0000_0088 — เหลือบิต 1 เฉพาะตำแหน่งที่ทั้งสองค่ามีบิต 1 ตรงกัน"}, {"type": "note", "content": "สิ่งที่ควรสังเกต: กลุ่มรีจิสเตอร์-รีจิสเตอร์ (add/and) แปลแบบเปลี่ยนชื่ออย่างเดียว ไม่ต้องตีความอะไรใหม่\n\nตัวอย่างที่ 2 (ง่าย): ADD ทั้งสองรูปแบบ เทียบรหัสเครื่อง"}, {"type": "table", "content": "<table>\n<thead>\n<tr><th>LC-3</th><th>RV32I</th><th>รหัสเครื่อง</th></tr>\n</thead>\n<tbody>\n<tr><td><code>ADD R1,R2,R3</code> (รีจิสเตอร์)</td><td><code>add x1,x2,x3</code></td><td><code>0x003100B3</code></td></tr>\n<tr><td><code>ADD R4,R4,#5</code> (immediate)</td><td><code>addi x4,x4,5</code></td><td><code>0x00520213</code></td></tr>\n</tbody>\n</table>"}, {"type": "note", "content": "ข้อสังเกต: LC-3 ใช้ opcode ADD ตัวเดียวแล้วดูบิตที่ 5 ในตัวคำสั่งเพื่อแยกโหมด ส่วน RV32I แยกเป็นคนละคำสั่งไปเลย (add เป็น R-type, addi เป็น I-type) ผู้แปลจึงต้องเลือกชื่อคำสั่งให้ตรงโหมดเอง\n\nตัวอย่างที่ 3 (กลาง): immediate ที่ใหญ่เกิน LC-3 แต่ RV32I จบในคำสั่งเดียว\n\nโจทย์: ต้องการ x4 = x4 + 100 — ลองคิดก่อนว่า LC-3 เขียน ADD R4, R4, #100 ในคำสั่งเดียวได้หรือไม่ เพราะเหตุใด"}, {"type": "example", "content": "กดดูวิธีทำทีละขั้น\nขั้น 1 ช่วงของ imm5 (LC-3): 5 บิตแบบมีเครื่องหมาย = -16 ถึง +15\n ค่า 100 เกินช่วง → LC-3 ใส่ #100 ในคำสั่งเดียวไม่ได้\n ต้องแตกเป็นหลายคำสั่ง (เช่นบวกทีละ 15 หลายรอบ หรือโหลดค่าจากหน่วยความจำ)\n \nขั้น 2 ช่วงของ imm12 (RV32I): 12 บิตแบบมีเครื่องหมาย = -2048 ถึง +2047\n ค่า 100 อยู่ในช่วงสบาย ๆ\n \nขั้น 3 เขียนคำสั่งเดียวจบ:\n addi x4, x4, 100 (รหัสเครื่อง 0x06420213)"}, {"type": "note", "content": "สิ่งที่ควรสังเกต: immediate ที่กว้างขึ้นจาก 5 บิตเป็น 12 บิต คือเหตุผลเชิงปฏิบัติว่าทำไมโค้ด RV32I มักสั้นกว่า LC-3 เมื่อทำงานกับค่าคงที่"}, {"type": "note", "content": "หลักการ immediate\nLC-3 ใช้ imm5 (5 บิต) ใน ADD/AND ส่วน RV32I ใช้ immediate 12 บิตใน addi/andi/xori ซึ่งถูก sign-extend ก่อนใช้งาน ทำให้ค่าคงที่ที่ใส่ได้ในคำสั่งเดียวมีช่วงกว้างกว่า LC-3 มาก"}, {"type": "subheading", "content": "กลุ่มที่ 2: เข้าถึงหน่วยความจำ (Load / Store)"}, {"type": "note", "content": "นี่คือจุดต่างเชิงปรัชญาที่สำคัญที่สุด LC-3 มีโหมดที่อยู่หลายแบบ (PC-relative และ base+offset) ส่วน RV32I เป็น load-store architecture อย่างเคร่งครัด: คำสั่งคำนวณทำงานกับรีจิสเตอร์เท่านั้น การแตะหน่วยความจำต้องผ่าน load/store เสมอ"}, {"type": "table", "content": "<table>\n<thead>\n<tr><th>LC-3</th><th>โหมด</th><th>RV32I ที่เทียบเท่า</th></tr>\n</thead>\n<tbody>\n<tr><td><code>LDR R1,R2,#off</code></td><td>base + offset</td><td><code>lw x1, off(x2)</code></td></tr>\n<tr><td><code>STR R1,R2,#off</code></td><td>base + offset</td><td><code>sw x1, off(x2)</code></td></tr>\n<tr><td><code>LD R1,LABEL</code></td><td>PC-relative</td><td>ต้องคำนวณที่อยู่ก่อน แล้ว <code>lw</code></td></tr>\n<tr><td><code>ST R1,LABEL</code></td><td>PC-relative</td><td>คำนวณที่อยู่ก่อน แล้ว <code>sw</code></td></tr>\n</tbody>\n</table>"}, {"type": "note", "content": "LDR/STR ของ LC-3 แมปตรงกับ lw/sw ของ RV32I เพราะใช้รูปแบบ base+offset เหมือนกัน:"}, {"type": "table", "content": "<pre style=\"font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--navy-deep);color:#EAF1FA;padding:14px 16px;border-radius:6px;border-left:4px solid var(--flag);overflow-x:auto;white-space:pre;\">; LC-3: โหลดจาก [R2 + 4]\nLDR R1, R2, #4\n\n# RV32I: เหมือนกันแต่ offset เป็น 12 บิต\nlw x1, 4(x2)</pre>"}, {"type": "note", "content": "ส่วน LD/ST ของ LC-3 ที่เป็น PC-relative ไม่มีคู่ตรง ๆ ใน RV32I เพราะ RV32I ไม่มี load/store แบบ PC-relative ในตัวเดียว เราต้องสร้างที่อยู่ของ LABEL ไว้ในรีจิสเตอร์ก่อน (ดูกลุ่ม LEA ในหน้าถัดไป) แล้วจึง lw/sw ผ่าน base register นั้น"}, {"type": "subheading", "content": "ขั้นตอนแปล offset: LC-3 นับเป็น word แต่ RV32I นับเป็น byte"}, {"type": "note", "content": "กับดักอันดับหนึ่งของหน้านี้: หน่วยความจำ LC-3 เป็นแบบ word-addressable (หนึ่งที่อยู่ = หนึ่ง word ขนาด 16 บิต) offset ใน LDR/STR จึงนับเป็น \"จำนวน word\" ส่วน RV32I เป็นแบบ byte-addressable (หนึ่งที่อยู่ = หนึ่ง byte) offset ใน lw/sw จึงนับเป็น \"จำนวน byte\" และหนึ่ง word ของ RV32I กว้าง 32 บิต = 4 byte\n\nขั้นตอนแปล offset (ใช้ได้ทุกครั้ง):\n\n1. อ่าน offset ของ LC-3 — นี่คือ \"ลำดับ element\" นับเป็น word\n2. คูณด้วย 4 — ได้ offset เป็น byte สำหรับ RV32I (เครื่องหมายบวกลบคงเดิม)\n3. ตรวจว่าผลอยู่ในช่วง imm12 (-2048 ถึง +2047) แล้วจึงเขียน lw/sw"}, {"type": "table", "content": "<table>\n<thead>\n<tr><th>LC-3 offset (word)</th><th>คูณ 4</th><th>RV32I offset (byte)</th><th>ตัวอย่างการแปล</th></tr>\n</thead>\n<tbody>\n<tr><td><code>#3</code></td><td>3×4</td><td>12</td><td><code>LDR R1,R2,#3</code> → <code>lw x1, 12(x2)</code></td></tr>\n<tr><td><code>#10</code></td><td>10×4</td><td>40</td><td><code>LDR R1,R2,#10</code> → <code>lw x1, 40(x2)</code></td></tr>\n<tr><td><code>#-2</code></td><td>(-2)×4</td><td>-8</td><td><code>STR R5,R2,#-2</code> → <code>sw x5, -8(x2)</code></td></tr>\n</tbody>\n</table>"}, {"type": "note", "content": "ผังหน่วยความจำรายไบต์ช่วยให้เห็นว่าเลข 12 กับ -8 มาจากไหน (สมมุติ x2 = 0x2000):"}, {"type": "table", "content": "<pre style=\"font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--navy-deep);color:#EAF1FA;padding:14px 16px;border-radius:6px;border-left:4px solid var(--flag);overflow-x:auto;white-space:pre;\">ที่อยู่ (byte)       element   คำสั่งที่แตะช่องนี้\n0x1FF8 - 0x1FFB   [ -2 ]   ← sw x5, -8(x2)   (0x2000 - 8 = 0x1FF8)\n0x1FFC - 0x1FFF   [ -1 ]\n0x2000 - 0x2003   [  0 ]   ← x2 ชี้ที่นี่ (base)\n0x2004 - 0x2007   [ +1 ]\n0x2008 - 0x200B   [ +2 ]\n0x200C - 0x200F   [ +3 ]   ← lw x1, 12(x2)   (0x2000 + 12 = 0x200C)\nแต่ละ element กว้าง 4 byte เพราะ word ของ RV32I คือ 32 บิต</pre>"}, {"type": "subheading", "content": "ตัวอย่างระดับยาก: แปลบล็อก \"โหลด-AND-เก็บ\" ทีละบรรทัด"}, {"type": "note", "content": "โจทย์: โปรแกรม LC-3 ข้างล่างโหลดข้อมูลกับ mask จากหน่วยความจำ นำมา AND กัน แล้วเก็บผลกลับ จงแปลเป็น RV32I ครบทุกบรรทัด — ลองแปลเองก่อนโดยใช้ขั้นตอนคูณ 4 ที่เพิ่งเรียน"}, {"type": "table", "content": "<pre style=\"font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--navy-deep);color:#EAF1FA;padding:14px 16px;border-radius:6px;border-left:4px solid var(--flag);overflow-x:auto;white-space:pre;\">; LC-3 (R2 = base address ของบล็อกข้อมูล)\nLDR R1, R2, #0    ; R1 ← MEM[R2+0]   (ข้อมูล)\nLDR R3, R2, #1    ; R3 ← MEM[R2+1]   (mask)\nAND R4, R1, R3    ; R4 = R1 AND R3\nSTR R4, R2, #2    ; MEM[R2+2] ← R4   (เก็บผล)</pre>"}, {"type": "example", "content": "กดดูวิธีทำทีละขั้น\nบรรทัด 1 LDR R1, R2, #0\n offset 0 word → 0×4 = 0 byte\n ⇒ lw x1, 0(x2) (รหัสเครื่อง 0x00012083)\n \nบรรทัด 2 LDR R3, R2, #1\n offset 1 word → 1×4 = 4 byte ← จุดที่พลาดบ่อยที่สุด\n ⇒ lw x3, 4(x2) (รหัสเครื่อง 0x00412183)\n \nบรรทัด 3 AND R4, R1, R3\n รีจิสเตอร์ล้วน ไม่มี offset ให้คูณ แปลตรงตัว\n ⇒ and x4, x1, x3 (รหัสเครื่อง 0x0030F233)\n \nบรรทัด 4 STR R4, R2, #2\n offset 2 word → 2×4 = 8 byte\n ⇒ sw x4, 8(x2) (รหัสเครื่อง 0x00412423)\n \nโปรแกรม RV32I ฉบับเต็ม:\nlw x1, 0(x2)\nlw x3, 4(x2)\nand x4, x1, x3\nsw x4, 8(x2)"}, {"type": "note", "content": "สิ่งที่ควรสังเกต: โครงสร้างโปรแกรมไม่เปลี่ยนเลย (โหลด-คำนวณ-เก็บ ตามลำดับเดิม) สิ่งที่ต้องระวังมีเรื่องเดียวคือ offset ทุกตัวถูกคูณ 4 ส่วนบรรทัดคำนวณระหว่างรีจิสเตอร์แค่เปลี่ยนชื่อก็จบ"}, {"type": "note", "content": "ทำไมต้อง load-store discipline\nการบังคับให้คำสั่งคำนวณแตะเฉพาะรีจิสเตอร์ ทำให้แต่ละคำสั่งมีงานที่ชัดเจน คงที่ และสั้น เหมาะกับ pipeline (Topic 11+) เพราะขั้นตอน execute ไม่ต้องรอ memory access พร้อมกัน เป็นหัวใจของปรัชญา RISC"}, {"type": "example", "content": "ก่อนไปหน้าถัดไป: LC-3 ใช้ LEA ดึง \"ที่อยู่\" ของ label เข้ารีจิสเตอร์ คุณคิดว่า RV32I ใช้คำสั่งใดทำหน้าที่นี้\nRV32I ใช้คู่ auipc/lui ร่วมกับ addi เพราะ immediate 32 บิตใส่ในคำสั่งเดียว (ที่ยาว 32 บิต) ไม่ได้ ต้องแบ่งเป็น \"ส่วนบน 20 บิต\" และ \"ส่วนล่าง 12 บิต\" รายละเอียดอยู่ในหน้าถัดไป"}]}, {"title": "10.2 ตารางแมปคำสั่ง: LC-3 ↔ RV32I (ตอนที่ 2)", "body": "หน้านี้ต่อจากกลุ่มเลขคณิต/หน่วยความจำ ครอบคลุมกลุ่มที่เปลี่ยน \"แนวคิด\" ชัดเจนที่สุด: การสร้างที่อยู่ (address generation) การกระโดดแบบมีเงื่อนไข (branch) การเรียกซับรูทีน (call/return) และการเรียกระบบ (trap)", "blocks": [{"type": "note", "content": "ทำไมต้องรู้ + CPU ใช้ยังไง\nตารางแมปนี้ไม่ใช่แค่การจำคำสั่ง แต่คือการเข้าใจว่า control unit ของ CPU ตัดสินใจ \"จะทำอะไรต่อ\" อย่างไร วิธีที่ ISA เลือกทำ branch (flag แบบ LC-3 กับ compare-and-branch แบบ RV32I) กำหนดว่าฮาร์ดแวร์ต้องมีรีจิสเตอร์ flag ค้างไว้หรือไม่ ต้องมีตัวเปรียบเทียบใน datapath ตรงไหน และ pipeline ต้องเดาผลกระโดด (branch prediction) อย่างไร ส่วน call/return และ trap คือกลไกที่ CPU ใช้สลับกระแสการทำงานไปยังซับรูทีนหรือ OS จริง ๆ ถ้าไม่เข้าใจว่าที่อยู่กลับ (return address) ถูกเก็บที่ไหน คุณจะ debug stack เสียหายหรือ syscall ไม่ได้เลย"}, {"type": "subheading", "content": "กลุ่มที่ 3: สร้างที่อยู่ / ค่าคงที่ใหญ่ (LEA, immediate ใหญ่)"}, {"type": "note", "content": "LC-3 ใช้ LEA R1, LABEL เพื่อโหลด \"ที่อยู่\" ของ LABEL (คำนวณแบบ PC-relative) เข้ารีจิสเตอร์ ใน RV32I การได้ที่อยู่หรือค่าคงที่ขนาดเต็ม 32 บิต ต้องแบ่งทำสองขั้น เพราะคำสั่งหนึ่งคำสั่งยาว 32 บิต จึงใส่ immediate เต็ม 32 บิตในคำสั่งเดียวไม่ได้"}, {"type": "table", "content": "<table>\n<thead>\n<tr><th>LC-3</th><th>ความหมาย</th><th>RV32I ที่เทียบเท่า</th></tr>\n</thead>\n<tbody>\n<tr><td><code>LEA R1,LABEL</code></td><td>ที่อยู่แบบ PC-relative</td><td><code>auipc x1, hi</code> ; <code>addi x1,x1,lo</code></td></tr>\n<tr><td>(ค่าคงที่ใหญ่)</td><td>โหลดค่าคงที่ 32 บิต</td><td><code>lui x1, hi</code> ; <code>addi x1,x1,lo</code></td></tr>\n</tbody>\n</table>"}, {"type": "note", "content": "• lui x1, imm20 (load upper immediate): วางค่า 20 บิตไว้ที่ \"บิตบน\" ของรีจิสเตอร์ (บิต 31-12) แล้วเติม 0 ที่บิตล่าง ใช้ตั้งค่าคงที่/ที่อยู่แบบ absolute\n• auipc x1, imm20 (add upper immediate to PC): เหมือน lui แต่บวกผลเข้ากับ PC ปัจจุบัน จึงได้ที่อยู่แบบ PC-relative ตรงกับวิญญาณของ LEA ใน LC-3\n• จากนั้นใช้ addi เติม \"ส่วนล่าง 12 บิต\" ให้ครบ"}, {"type": "table", "content": "<pre style=\"font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--navy-deep);color:#EAF1FA;padding:14px 16px;border-radius:6px;border-left:4px solid var(--flag);overflow-x:auto;white-space:pre;\">; LC-3: ดึงที่อยู่ของ DATA แบบ PC-relative\nLEA R1, DATA\n\n# RV32I: PC-relative address ของ symbol\n# assembler ขยาย pseudo-instruction la x1, DATA เป็น 2 คำสั่งนี้\nauipc x1, %pcrel_hi(DATA)\naddi  x1, x1, %pcrel_lo(DATA)</pre>"}, {"type": "note", "content": "หลักการแบ่ง hi/lo\nimmediate ของ RV32I ส่วนล่าง 12 บิตถูก sign-extend (มองเป็นค่ามีเครื่องหมาย) เมื่อนำมาบวก ดังนั้น assembler จะปรับ \"ส่วนบน 20 บิต\" ชดเชยกรณีบิตที่ 11 เป็น 1 โดยอัตโนมัติ ผู้เรียนไม่ต้องคำนวณเอง ให้เข้าใจหลักการ \"บน 20 + ล่าง 12\" ก็พอ"}, {"type": "subheading", "content": "กลุ่มที่ 4: กระโดดแบบมีเงื่อนไข (Branch)"}, {"type": "note", "content": "นี่คือความต่างเชิงแนวคิดที่ใหญ่ที่สุด LC-3 ใช้ condition codes (N, Z, P) ที่ถูกตั้งโดยอัตโนมัติทุกครั้งที่เขียนค่าลงรีจิสเตอร์ แล้ว BRn/BRz/BRp ตรวจ flag เหล่านี้ ส่วน RV32I ใช้ compare-and-branch: ไม่มี flag เก็บไว้ คำสั่ง branch เปรียบเทียบรีจิสเตอร์สองตัว \"ในตัวเดียว\" แล้วตัดสินใจกระโดดทันที\n\nตารางนี้ครบทั้ง 7 ชุดเงื่อนไขของ LC-3 (rs คือรีจิสเตอร์ที่ตั้ง condition code ล่าสุด):"}, {"type": "table", "content": "<table>\n<thead>\n<tr><th>LC-3</th><th>เงื่อนไข (เทียบ rs กับ 0)</th><th>RV32I ที่เทียบเท่า</th><th>pseudo ที่ assembler มีให้</th></tr>\n</thead>\n<tbody>\n<tr><td><code>BRn LABEL</code></td><td>กระโดดถ้าผลล่าสุด น้อยกว่า 0</td><td><code>blt rs,x0,LABEL</code></td><td><code>bltz rs,LABEL</code></td></tr>\n<tr><td><code>BRz LABEL</code></td><td>กระโดดถ้าผลล่าสุด = 0</td><td><code>beq rs,x0,LABEL</code></td><td><code>beqz rs,LABEL</code></td></tr>\n<tr><td><code>BRp LABEL</code></td><td>กระโดดถ้า มากกว่า 0</td><td><code>blt x0,rs,LABEL</code></td><td><code>bgtz rs,LABEL</code></td></tr>\n<tr><td><code>BRnz LABEL</code></td><td>กระโดดถ้า น้อยกว่าหรือเท่ากับ 0</td><td><code>bge x0,rs,LABEL</code></td><td><code>blez rs,LABEL</code></td></tr>\n<tr><td><code>BRnp LABEL</code></td><td>กระโดดถ้า ≠ 0</td><td><code>bne rs,x0,LABEL</code></td><td><code>bnez rs,LABEL</code></td></tr>\n<tr><td><code>BRzp LABEL</code></td><td>กระโดดถ้า มากกว่าหรือเท่ากับ 0</td><td><code>bge rs,x0,LABEL</code></td><td><code>bgez rs,LABEL</code></td></tr>\n<tr><td><code>BRnzp LABEL</code></td><td>กระโดดเสมอ (unconditional)</td><td><code>jal x0,LABEL</code></td><td><code>j LABEL</code></td></tr>\n<tr><td>(เปรียบเทียบ unsigned)</td><td>กระโดดถ้า rs1 น้อยกว่า rs2 แบบไม่มีเครื่องหมาย</td><td><code>bltu rs1,rs2,LABEL</code></td><td>-</td></tr>\n</tbody>\n</table>"}, {"type": "note", "content": "จุดสังเกต 2 จุดจากตาราง: (1) BRp กับ BRnz ต้องสลับ rs ไปฝั่งขวา เพราะ RV32I มีแต่ blt/bge (\"น้อยกว่า\" กับ \"มากกว่าหรือเท่ากับ\") ไม่มี bgt/ble ตรง ๆ — เงื่อนไข \"rs มากกว่า 0\" จึงต้องพลิกเป็น \"0 น้อยกว่า rs\" (2) BRnzp คือเงื่อนไขที่จริงเสมอ เลยกลายเป็น jump ธรรมดา jal x0, LABEL (return address ถูกทิ้งลง x0)\n\nวิธีแปลความคิด: เงื่อนไข LC-3 มักเทียบ \"ผลลัพธ์กับศูนย์\" ใน RV32I เราระบุการเทียบให้ชัด เช่น \"ผลล่าสุดเป็นศูนย์หรือไม่\" กลายเป็นการเทียบรีจิสเตอร์นั้นกับ x0 (ซึ่งเป็น 0 เสมอ)"}, {"type": "table", "content": "<pre style=\"font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--navy-deep);color:#EAF1FA;padding:14px 16px;border-radius:6px;border-left:4px solid var(--flag);overflow-x:auto;white-space:pre;\">; LC-3: ตั้ง CC จาก R1 แล้วกระโดดถ้า R1 == 0\nADD R1, R1, #0\nBRz  ZERO_CASE\n\n# RV32I: compare-and-branch ไม่ต้องตั้ง flag ก่อน\nbeq x1, x0, ZERO_CASE   # ถ้า x1 == 0 ให้กระโดด</pre>"}, {"type": "subheading", "content": "สูตรแปล branch แบบ 1-2-3 (idiom \"เทียบกับศูนย์\")"}, {"type": "note", "content": "RV32I ไม่มี condition code ให้ตรวจ วิธีคิดคือเปลี่ยน \"flag จากผลล่าสุด\" ให้เป็น \"การเทียบรีจิสเตอร์กับ x0\" ตามขั้นตอนนี้:\n\n1. หารีจิสเตอร์ที่ตั้ง CC ล่าสุด: มองย้อนจาก BR ขึ้นไป คำสั่งล่าสุดที่เขียนค่าลงรีจิสเตอร์คือตัวตั้ง N/Z/P — รีจิสเตอร์ตัวนั้นคือ rs ที่เราจะใช้เทียบ\n2. แปลงเงื่อนไข flag เป็นการเทียบกับศูนย์: z คือ \"rs เท่ากับ 0\" · n คือ \"rs น้อยกว่า 0\" · p คือ \"rs มากกว่า 0\"\n3. เลือกคำสั่ง branch จากตารางข้างบน โดยวาง x0 ในตำแหน่งของ \"ศูนย์\"\n\nลองใช้สูตรกับตัวอย่างข้างบน: ขั้น 1 — คำสั่ง ADD R1, R1, #0 เขียนค่าลง R1 ดังนั้น rs คือ x1 · ขั้น 2 — BRz คือเงื่อนไข \"เท่ากับ 0\" · ขั้น 3 — ได้ beq x1, x0, ZERO_CASE และสังเกตว่าบรรทัด ADD R1, R1, #0 ไม่ต้องแปลเลย เพราะหน้าที่เดียวของมันคือตั้ง flag ซึ่ง RV32I ไม่ใช้\n\nลองแทนค่าจริง: ถ้า x1 = 0 — beq เทียบ 0 กับ 0 เท่ากัน จึงกระโดดไป ZERO_CASE · ถ้า x1 = 7 — 7 ไม่เท่ากับ 0 จึงไหลลงบรรทัดถัดไป และไม่มี flag ใดถูกจดจำไว้หลังจากนี้"}, {"type": "note", "content": "signed กับ unsigned\nRV32I แยกชัดเจน: blt/bge เทียบแบบมีเครื่องหมาย (signed) ส่วน bltu/bgeu เทียบแบบไม่มีเครื่องหมาย (unsigned) ขณะที่ N flag ของ LC-3 ตีความผลเป็น signed เสมอ การมีทั้งสองแบบทำให้ RV32I จัดการที่อยู่/ตัวนับแบบไม่มีเครื่องหมายได้ถูกต้อง\nข้อควรระวัง: การเทียบ unsigned ต้องใช้รีจิสเตอร์สองตัวจริง ไม่ควรเทียบกับ x0 เพราะ x0 = 0 ทำให้ผลลัพธ์เป็นค่าคงที่ ไม่มีค่า unsigned ใดน้อยกว่า 0 ดังนั้น bltu rs,x0 เป็นเท็จเสมอ (ไม่กระโดดเลย) ส่วน bgeu rs,x0 เป็นจริงเสมอ (กระโดดทุกครั้ง)"}, {"type": "subheading", "content": "ตัวอย่างระดับกลาง: เลือก blt/bge/bne ให้ตรงโจทย์"}, {"type": "note", "content": "โจทย์ 3 ข้อ — ลองเปิดตารางแล้วเลือกคำสั่งเองก่อนเปิดเฉลย:\n\n1. \"วนกลับไป LOOP ตราบใดที่ตัวนับ x5 ยังไม่เป็นศูนย์\" (LC-3 ใช้ BRnp)\n2. \"ข้ามไป NEG_CASE ถ้าผลลัพธ์ x3 ติดลบ\" (LC-3 ใช้ BRn)\n3. \"ไปทำต่อที่ OK ถ้า index x7 เป็นศูนย์หรือบวก\" (LC-3 ใช้ BRzp)"}, {"type": "example", "content": "กดดูวิธีทำทีละขั้น\nข้อ 1 เงื่อนไข: x5 ≠ 0 → แถว BRnp → bne x5, x0, LOOP\n (ถ้าเผลอใช้ beq จะกลายเป็น \"วนต่อเมื่อเป็นศูนย์\" — กลับด้านพอดี)\n \nข้อ 2 เงื่อนไข: x3 น้อยกว่า 0 (signed) → แถว BRn → blt x3, x0, NEG_CASE\n ต้องใช้ blt ไม่ใช่ bltu เพราะ \"ติดลบ\" มีความหมายเฉพาะแบบ signed\n \nข้อ 3 เงื่อนไข: x7 มากกว่าหรือเท่ากับ 0 → แถว BRzp → bge x7, x0, OK\n bge รวมกรณี \"เท่ากับ 0\" ไว้ในตัวแล้ว ไม่ต้องมี beq เพิ่มอีกคำสั่ง"}, {"type": "note", "content": "สิ่งที่ควรสังเกต: ทุกข้อใช้สูตรเดียวกัน — ระบุ rs ก่อน แปลงเงื่อนไขเป็นการเทียบกับศูนย์ แล้วเปิดตารางเลือกคำสั่ง"}, {"type": "subheading", "content": "ลองทำทีละขั้น: แปลลูป LC-3 ที่ใช้ condition code เป็น RV32I compare-and-branch"}, {"type": "note", "content": "ลองทำทีละขั้น: เรามีลูป LC-3 ที่นับ R2 ลงจนถึง 0 (ทำงานตราบใดที่ R2 มากกว่า 0) จงแปลงเป็น RV32I โดยไม่พึ่ง flag ค้าง"}, {"type": "example", "content": "กดดูวิธีทำทีละขั้น\nโจทย์ LC-3:\nLOOP ADD R2, R2, #-1 ; R2 = R2 - 1 (ตั้ง CC จากผลลัพธ์อัตโนมัติ)\n BRp LOOP ; ถ้าผลลัพธ์ (R2) มากกว่า 0 ให้วนต่อ\n \nขั้น 1) เข้าใจเงื่อนไข BRp ของ LC-3\n BRp วน \"ถ้าผลล่าสุด มากกว่า 0\" — ผลล่าสุดคือค่าใหม่ของ R2\n LC-3 ตีความเป็น signed เสมอ ดังนั้นเงื่อนไขคือ R2 (signed) มากกว่า 0\n \nขั้น 2) RV32I ไม่มี flag ค้าง ต้องเทียบรีจิสเตอร์กับค่าที่ใช้เทียบตรง ๆ\n \"R2 มากกว่า 0\" ในภาษา compare-and-branch = \"0 น้อยกว่า R2\"\n RV32I ไม่มีคำสั่ง bgt โดยตรง แต่สลับลำดับตัวถูกเทียบได้:\n a มากกว่า b เท่ากับ b น้อยกว่า a -> ใช้ blt โดยวาง 0 เป็น rs1\n \nขั้น 3) เลือกคำสั่ง: blt rs1, rs2 วนถ้า rs1 (signed) น้อยกว่า rs2\n ต้องการวนถ้า 0 น้อยกว่า x2 -> blt x0, x2, LOOP\n \nขั้น 4) ประกอบร่าง (addi ทำหน้าที่ ADD #-1 โดยไม่ต้องตั้ง flag)\nLOOP: addi x2, x2, -1 # x2 = x2 - 1\n blt x0, x2, LOOP # วนถ้า 0 น้อยกว่า x2 (คือ x2 มากกว่า 0)\n \nตรวจทาน: ถ้า x2 กลายเป็น 0 -> 0 น้อยกว่า 0 เป็นเท็จ -> ออกลูป ถูกต้อง\n ถ้า x2 = 3 -> 0 น้อยกว่า 3 จริง -> วนต่อ ถูกต้อง"}, {"type": "subheading", "content": "ตัวอย่างระดับยาก: ลูปนับถอยหลังเต็มโปรแกรม พร้อมตาราง trace"}, {"type": "note", "content": "โจทย์: โปรแกรม LC-3 ข้างล่างโหลดค่าตัวนับจากหน่วยความจำแล้วนับถอยหลังจนถึงศูนย์ จงแปลเป็น RV32I ทั้งโปรแกรม — บรรทัด LD ให้ใช้เทคนิค la จากกลุ่มที่ 3 เพราะ RV32I ไม่มี load แบบ PC-relative ในคำสั่งเดียว ลองร่างคำแปลเองก่อนเปิดเฉลย"}, {"type": "table", "content": "<pre style=\"font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--navy-deep);color:#EAF1FA;padding:14px 16px;border-radius:6px;border-left:4px solid var(--flag);overflow-x:auto;white-space:pre;\">; LC-3\n      LD  R2, COUNT     ; R2 ← MEM[COUNT]  (PC-relative จบในคำสั่งเดียว)\nLOOP  ADD R2, R2, #-1   ; นับลง (ตั้ง CC อัตโนมัติ)\n      BRp LOOP          ; วนถ้าผลยังมากกว่า 0\n      ...\nCOUNT .FILL #3</pre>"}, {"type": "example", "content": "กดดูวิธีทำทีละขั้น\nบรรทัด 1 LD R2, COUNT — RV32I ไม่มีคู่ตรง ต้องแตกเป็น 2 จังหวะ:\n (1) สร้างที่อยู่ COUNT แบบ PC-relative: la x1, COUNT\n (assembler ขยายเป็น auipc x1, hi ตามด้วย addi x1, x1, lo)\n (2) โหลดค่าผ่าน base register: lw x2, 0(x1)\n \nบรรทัด 2 ADD R2, R2, #-1 → addi x2, x2, -1 (รหัสเครื่อง 0xFFF10113)\n ไม่มีการตั้ง flag ใด ๆ — ผลลัพธ์อยู่ใน x2 เฉย ๆ\n \nบรรทัด 3 BRp LOOP → แถว BRp ในตาราง: blt x0, x2, LOOP\n (\"x2 มากกว่า 0\" พลิกเป็น \"0 น้อยกว่า x2\")\n branch ถอยหลัง 4 byte: offset = -4 (รหัสเครื่อง 0xFE204EE3)\n \nโปรแกรม RV32I ฉบับเต็ม:\n la x1, COUNT # x1 = ที่อยู่ของ COUNT\n lw x2, 0(x1) # x2 = 3\nLOOP: addi x2, x2, -1 # นับลง\n blt x0, x2, LOOP # วนถ้า x2 ยังมากกว่า 0"}, {"type": "note", "content": "ตาราง trace ค่ารีจิสเตอร์สองรอบแรก (COUNT = 3 ดังนั้นหลัง lw ได้ x2 = 3):"}, {"type": "table", "content": "<table>\n<thead>\n<tr><th>รอบ</th><th>x2 ก่อน addi</th><th>x2 หลัง addi</th><th>เช็คของ blt: 0 น้อยกว่า x2 หรือไม่</th><th>ผลของ branch</th></tr>\n</thead>\n<tbody>\n<tr><td>1</td><td>3</td><td>2</td><td>0 น้อยกว่า 2 → จริง</td><td>กระโดดกลับ LOOP</td></tr>\n<tr><td>2</td><td>2</td><td>1</td><td>0 น้อยกว่า 1 → จริง</td><td>กระโดดกลับ LOOP</td></tr>\n<tr><td>3 (แถม)</td><td>1</td><td>0</td><td>0 น้อยกว่า 0 → เท็จ</td><td>ไหลออกจากลูป</td></tr>\n</tbody>\n</table>"}, {"type": "note", "content": "สิ่งที่ควรสังเกต: LC-3 ใช้ 3 คำสั่ง แต่ RV32I ใช้ 5 คำสั่งจริง (la นับเป็น 2) — สิ่งที่แลกมาคือทุกคำสั่งเรียบง่าย ถอดรหัสไว และไม่มีสถานะ flag แอบแฝงให้ pipeline ต้องพะวง"}, {"type": "subheading", "content": "กลุ่มที่ 5: เรียกซับรูทีนและกลับ (Call / Return)"}, {"type": "table", "content": "<table>\n<thead>\n<tr><th>LC-3</th><th>ความหมาย</th><th>RV32I ที่เทียบเท่า</th></tr>\n</thead>\n<tbody>\n<tr><td><code>JSR LABEL</code></td><td>เรียกซับรูทีน (PC-relative)</td><td><code>jal x1, LABEL</code></td></tr>\n<tr><td><code>JSRR R2</code></td><td>เรียกซับรูทีน (ผ่านรีจิสเตอร์)</td><td><code>jalr x1, 0(x2)</code></td></tr>\n<tr><td><code>RET</code></td><td>กลับจากซับรูทีน</td><td><code>jalr x0, 0(x1)</code></td></tr>\n</tbody>\n</table>"}, {"type": "note", "content": "หลักร่วม: ทั้งสอง ISA เก็บ \"ที่อยู่กลับ\" (return address) ไว้ในรีจิสเตอร์ LC-3 ใช้ R7 ส่วน RV32I ใช้ x1 (ชื่อ ra = return address) ตามข้อตกลงเรียกใช้ (calling convention)\n\n• jal x1, LABEL: กระโดดไป LABEL พร้อมเก็บที่อยู่ของคำสั่งถัดไปลงใน x1 (เทียบเท่า JSR ที่เก็บ R7)\n• jalr x1, 0(x2): กระโดดไปที่อยู่ในรีจิสเตอร์ x2 พร้อมเก็บ return address ลง x1 (เทียบเท่า JSRR)\n• RET ของ LC-3 จริง ๆ คือกระโดดกลับไปที่ R7 ใน RV32I คือ jalr x0, 0(x1) คือกระโดดกลับไปที่ ra โดยทิ้ง return address ใหม่ (เขียนลง x0 ซึ่งไม่เก็บค่า) assembler มี pseudo-instruction ret ให้"}, {"type": "table", "content": "<pre style=\"font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--navy-deep);color:#EAF1FA;padding:14px 16px;border-radius:6px;border-left:4px solid var(--flag);overflow-x:auto;white-space:pre;\"># RV32I: รูปแบบเรียกและกลับมาตรฐาน\njal  x1, my_func   # ra (x1) = ที่อยู่กลับ, แล้วกระโดดเข้า my_func\n...\nmy_func:\n  ...\n  jalr x0, 0(x1)   # = ret : กระโดดกลับไปยัง ra</pre>"}, {"type": "subheading", "content": "ไล่ค่า ra ทีละขั้นด้วยที่อยู่จริง (สมมุติ jal อยู่ที่ 0x1000)"}, {"type": "note", "content": "โจทย์: jal x1, my_func อยู่ที่ address 0x1000 และ my_func อยู่ที่ 0x1010 (ห่างไป +16 byte) — ลองทายก่อนว่า x1 (ra) จะได้ค่าอะไร แล้ว ret จะพากลับไปที่ไหน"}, {"type": "example", "content": "กดดูวิธีทำทีละขั้น\naddress คำสั่ง สิ่งที่เกิดขึ้น\n0x1000 jal x1, my_func ขั้น 1 ra ← PC + 4 = 0x1000 + 4 = 0x1004\n (รหัสเครื่อง 0x010000EF) ขั้น 2 PC ← 0x1000 + 16 = 0x1010 (เข้า my_func)\n0x1004 (คำสั่งถัดไป) ← จุดที่โปรแกรมจะกลับมาทำต่อ\n ...\n0x1010 my_func: ... ตัวซับรูทีนทำงาน (ห้ามเขียนทับ x1 ระหว่างนี้)\n0x1014 jalr x0, 0(x1) ขั้น 3 PC ← x1 + 0 = 0x1004 (นี่คือ ret)\n (รหัสเครื่อง 0x00008067) return address ใหม่ถูกทิ้งลง x0\n \nสรุป: ra เก็บ \"ที่อยู่ของคำสั่งถัดจาก jal\" เสมอ (PC ของ jal บวก 4)\n ไม่ใช่ที่อยู่ของ jal เอง และไม่ใช่ที่อยู่ของ my_func"}, {"type": "note", "content": "สิ่งที่ควรสังเกต: LC-3 ทำแบบเดียวกันเป๊ะ (JSR เก็บ PC ที่เพิ่มค่าแล้วลง R7) ต่างแค่ RV32I บวก 4 เพราะหนึ่งคำสั่งยาว 4 byte ส่วน LC-3 บวก 1 เพราะนับที่อยู่เป็น word"}, {"type": "subheading", "content": "กลุ่มที่ 6: เรียกบริการระบบ (Trap)"}, {"type": "table", "content": "<table>\n<thead>\n<tr><th>LC-3</th><th>ความหมาย</th><th>RV32I ที่เทียบเท่า</th></tr>\n</thead>\n<tbody>\n<tr><td><code>TRAP x25</code> (HALT)</td><td>เรียกบริการ OS/firmware</td><td><code>ecall</code></td></tr>\n<tr><td><code>GETC/OUT/PUTS</code></td><td>บริการ I/O ผ่าน trap vector</td><td><code>ecall</code> (ผ่าน OS convention)</td></tr>\n</tbody>\n</table>"}, {"type": "note", "content": "LC-3 ใช้ TRAP พร้อม trap vector (เช่น x20=GETC, x21=OUT, x25=HALT) เพื่อข้ามไปยังรูทีนบริการในระบบปฏิบัติการเล็ก ๆ ของ LC-3 RV32I ใช้คำสั่งเดียวคือ ecall (environment call) เพื่อ \"ขอบริการจากสภาพแวดล้อม\" ไม่ว่าจะเป็น OS หรือ runtime โดย หมายเลขบริการและพารามิเตอร์ถูกส่งผ่านรีจิสเตอร์ตามข้อตกลง (เช่น a7 ระบุหมายเลข syscall, a0-a6 เป็นอาร์กิวเมนต์) ไม่ได้ฝังไว้ในตัวคำสั่งแบบ trap vector ของ LC-3\n\nขั้นตอนเรียกบริการใน RV32I (ตามข้อตกลงของ simulator เช่น RARS):\n\n1. ใส่อาร์กิวเมนต์ลง a0 (และ a1, a2, ... ถ้าบริการนั้นต้องการเพิ่ม)\n2. ใส่หมายเลขบริการลง a7\n3. เรียก ecall — สภาพแวดล้อมอ่าน a7 แล้วทำบริการนั้นให้ เสร็จแล้วกลับมาทำงานต่อ"}, {"type": "table", "content": "<table>\n<thead>\n<tr><th>บริการ</th><th>a7</th><th>อาร์กิวเมนต์ / ผลลัพธ์</th><th>trap vector ของ LC-3 ที่เทียบเคียง</th></tr>\n</thead>\n<tbody>\n<tr><td>พิมพ์จำนวนเต็ม</td><td>1</td><td>a0 = ค่าที่จะพิมพ์</td><td>(LC-3 ไม่มีตรง ๆ ต้องเขียนเอง)</td></tr>\n<tr><td>พิมพ์สตริง</td><td>4</td><td>a0 = ที่อยู่สตริง</td><td><code>TRAP x22</code> (PUTS)</td></tr>\n<tr><td>อ่านจำนวนเต็ม</td><td>5</td><td>ผลกลับมาใน a0</td><td>(ไม่มีตรง ๆ)</td></tr>\n<tr><td>จบโปรแกรม</td><td>10</td><td>-</td><td><code>TRAP x25</code> (HALT)</td></tr>\n<tr><td>พิมพ์อักขระ</td><td>11</td><td>a0 = รหัสอักขระ</td><td><code>TRAP x21</code> (OUT)</td></tr>\n<tr><td>อ่านอักขระ</td><td>12</td><td>ผลกลับมาใน a0</td><td><code>TRAP x20</code> (GETC)</td></tr>\n</tbody>\n</table>"}, {"type": "warning", "content": "ecall ไม่ใช่คำสั่ง “จบโปรแกรม”\nจุดที่สับสนกันมากที่สุดคือคิดว่าเห็น ecall แล้วโปรแกรมหยุด ความจริงคือ ecall แปลว่า “ขอบริการจากระบบ” เฉย ๆ พอระบบทำเสร็จก็คืนการควบคุมกลับมาที่คำสั่งถัดไปแล้วเดินต่อตามปกติ เหมือนการเรียกฟังก์ชัน — สิ่งที่ตัดสินว่าเกิดอะไรขึ้นคือ เลขใน a7 ไม่ใช่ตัวคำสั่ง ecall มีบริการเดียวในตารางที่ไม่คืนกลับมาคือหมายเลข 10 (จบโปรแกรม) เทียบได้กับ LC-3 ที่ TRAP x21 (OUT) กลับมาทำต่อ แต่ TRAP x25 (HALT) ไม่กลับ"}, {"type": "note", "content": "ลองดูโปรแกรมที่เรียก ecall สี่ครั้งติดกัน แล้วเดาว่าบรรทัดไหนได้ทำงานบ้าง"}, {"type": "table", "content": "<pre style=\"font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--navy-deep);color:#EAF1FA;padding:14px 16px;border-radius:6px;border-left:4px solid var(--flag);overflow-x:auto;white-space:pre;\">li   a0, 11\nli   a7, 1\necall            # ครั้งที่ 1 พิมพ์ 11 แล้วทำต่อ\nli   a0, 32\nli   a7, 11\necall            # ครั้งที่ 2 พิมพ์ช่องว่าง แล้วทำต่อ\nli   a0, 99\nli   a7, 1\necall            # ครั้งที่ 3 พิมพ์ 99 แล้วทำต่อ\nli   a7, 10\necall            # ครั้งที่ 4 จบโปรแกรม -- หยุดจริง\nli   a0, 777     # สามบรรทัดนี้ไม่มีวันได้ทำงาน\nli   a7, 1\necall</pre>"}, {"type": "example", "content": "กดดูวิธีทำทีละขั้น\nรันจริง 11 คำสั่ง จากทั้งหมด 14 คำสั่งในไฟล์\nหน้าจอพิมพ์ออกมา: 11 99\n \necall ครั้งที่ 1, 2, 3 ทำบริการเสร็จแล้ว \"กลับมา\" ทำคำสั่งถัดไปทุกครั้ง\necall ครั้งที่ 4 (a7 = 10) ไม่กลับ โปรแกรมจบตรงนั้น\nสามบรรทัดสุดท้ายจึงไม่ถูกแตะเลย\n \nข้อสังเกต: ecall ทั้งสี่ครั้งมีรหัสเครื่องเหมือนกันเป๊ะคือ 0x00000073\nสิ่งที่ทำให้ครั้งที่ 4 ต่างออกไปคือค่าใน a7 ล้วน ๆ"}, {"type": "note", "content": "ตัวอย่าง: แปล TRAP x21 (OUT — พิมพ์อักขระใน R0) เป็น RV32I"}, {"type": "table", "content": "<pre style=\"font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--navy-deep);color:#EAF1FA;padding:14px 16px;border-radius:6px;border-left:4px solid var(--flag);overflow-x:auto;white-space:pre;\">; LC-3: พิมพ์ตัวอักษร 'A'\nLD   R0, ACHAR    ; R0 = 65 (รหัส ASCII ของ 'A')\nTRAP x21          ; OUT: พิมพ์อักขระใน R0\n\n# RV32I (ข้อตกลง RARS)\naddi a0, x0, 65   # a0 = 65 = 'A'              (รหัสเครื่อง 0x04100513)\naddi a7, x0, 11   # a7 = 11 = บริการพิมพ์อักขระ  (รหัสเครื่อง 0x00B00893)\necall             #                             (รหัสเครื่อง 0x00000073)</pre>"}, {"type": "note", "content": "สิ่งที่ควรสังเกต: หมายเลขบริการย้ายจาก \"ในตัวคำสั่ง\" (x21 ฝังอยู่ใน TRAP) ไปอยู่ \"ในรีจิสเตอร์\" (11 อยู่ใน a7) — ecall จึงมีรหัสเครื่องค่าเดียวคือ 0x00000073 ไม่ว่าจะเรียกบริการใดก็ตาม"}, {"type": "note", "content": "แนวคิดร่วม: ยกการควบคุมให้ระดับสูงกว่า\nทั้ง TRAP และ ecall คือการ \"หยุดทำงานปกติชั่วคราว แล้วยกการควบคุมให้ซอฟต์แวร์ระดับสูงกว่า (OS/environment)\" ต่างกันที่ LC-3 ระบุบริการด้วยเลขในตัวคำสั่ง ส่วน RV32I ระบุด้วยค่าในรีจิสเตอร์ ทำให้ ecall เดียวรองรับบริการได้ไม่จำกัด"}]}, {"title": "10.3 จาก 8 Register สู่ 32 Register และ ABI", "body": "", "blocks": [{"type": "note", "content": "ทำไมต้องรู้ + CPU ใช้ยังไง\ncalling convention คือกติกาที่ทำให้โค้ดจากคนละไฟล์/คนละภาษา/คนละ compiler เรียกฟังก์ชันกันได้จริงบน CPU ตัวเดียวกัน CPU เองไม่รู้จัก \"ฟังก์ชัน\" — มันเห็นแค่คำสั่ง jal/jalr ที่กระโดดไป-กลับ และ register file 32 ตัวที่ทุกส่วนของโปรแกรมใช้ร่วมกัน ถ้าไม่มีข้อตกลงว่าใครรักษาค่า register ตัวไหน ค่าจะถูกทับพังทันทีที่ call ข้ามฟังก์ชัน ความรู้เรื่อง caller/callee-saved กับ stack frame จึงเป็นสิ่งที่ทำให้ recursion, การเรียกซ้อน, และ OS/library ทำงานถูกต้องบนฮาร์ดแวร์จริง ขาดไม่ได้เพราะทุกโปรแกรมที่คอมไพล์ออกมาต้องเคารพกติกานี้"}, {"type": "note", "content": "LC-3 มี register แค่ 8 ตัว (R0–R7 ใช้ 3 บิตเลือก) ส่วน RISC-V RV32I มี 32 register (x0–x31 ใช้ 5 บิตเลือก เพราะ $2^5 = 32$) register แต่ละตัวกว้าง 32 บิตเท่าความกว้างของ word การมี register มากขึ้นไม่ได้แปลว่า \"หรูหรา\" เฉย ๆ แต่ช่วยลดการ spill ค่าลง memory: compiler เก็บตัวแปรที่ใช้บ่อยไว้บน register ได้มากกว่า โปรแกรมจึงเข้า/ออก memory น้อยลง (ซึ่งช้ากว่า register มาก)"}, {"type": "subheading", "content": "ตัวอย่างขั้นง่าย: งานเดียวกันบน 8 register เทียบ 32 register"}, {"type": "note", "content": "โจทย์: ฟังก์ชันหนึ่งรับตัวแปร 6 ตัว a, b, c, d, e, f แล้วต้องคำนวณ total = (a+b) + (c+d) + (e+f) โดยมีเงื่อนไขว่า a ถึง f ต้องมีค่าครบเหมือนเดิมหลังคำนวณ (โค้ดส่วนถัดไปจะใช้ต่อ)\n\nฝั่ง RV32I (32 register): อาร์กิวเมนต์ทั้ง 6 ตัวมาใน a0–a5 ตามข้อตกลง ABI อยู่แล้ว และยังมี register ว่างเหลือเฟือให้ผลรวมย่อย — ทั้งงานจบใน register ไม่แตะ memory เลย"}, {"type": "table", "content": "<pre style=\"font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--navy-deep);color:#EAF1FA;padding:14px 16px;border-radius:6px;border-left:4px solid var(--flag);overflow-x:auto;white-space:pre;\"># RV32I: a..f อยู่ใน a0–a5 อยู่แล้ว\nadd t0, a0, a1     # t0 = a+b\nadd t1, a2, a3     # t1 = c+d\nadd t2, a4, a5     # t2 = e+f\nadd t0, t0, t1     # t0 = (a+b)+(c+d)\nadd t0, t0, t2     # t0 = total  (a0–a5 ยังครบทุกตัว ใช้ต่อได้ทันที)</pre>"}, {"type": "note", "content": "ฝั่ง LC-3 (8 register): R6 เป็น stack pointer และ R7 เป็น return address (กติกาจาก Topic 8) สมมติ R2–R5 ถือค่าอื่นของโปรแกรมอยู่ เหลือ scratch แค่ R0 กับ R1 — ตัวแปรทั้ง 6 จึงต้องอาศัยอยู่ใน memory (label A ถึง F) และผลรวมย่อยก็ไม่มีที่อยู่ ต้อง spill ลง memory ชั่วคราว (label T1, T2)"}, {"type": "table", "content": "<pre style=\"font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--navy-deep);color:#EAF1FA;padding:14px 16px;border-radius:6px;border-left:4px solid var(--flag);overflow-x:auto;white-space:pre;\">; LC-3: register ไม่พอ ทุกค่าต้องเดินทางเข้า/ออก memory\nLD  R0, A          ; (1)  R0 = a\nLD  R1, B          ; (2)  R1 = b\nADD R0, R0, R1     ; (3)  R0 = a+b\nST  R0, T1         ; (4)  spill! เก็บ a+b ลง memory\nLD  R0, C          ; (5)\nLD  R1, D          ; (6)\nADD R0, R0, R1     ; (7)  R0 = c+d\nST  R0, T2         ; (8)  spill อีกรอบ\nLD  R0, E          ; (9)\nLD  R1, F          ; (10)\nADD R0, R0, R1     ; (11) R0 = e+f\nLD  R1, T1         ; (12) โหลด a+b กลับมา\nADD R0, R0, R1     ; (13) R0 = (e+f)+(a+b)\nLD  R1, T2         ; (14) โหลด c+d กลับมา\nADD R0, R0, R1     ; (15) R0 = total</pre>"}, {"type": "note", "content": "ลองนับเองก่อนเปิดเฉลย: แต่ละฝั่งใช้กี่คำสั่ง และแตะ memory ฝั่งข้อมูล (โหลด/สโตร์) กี่ครั้ง"}, {"type": "example", "content": "กดดูวิธีทำทีละขั้น\nขั้น 1) นับฝั่ง LC-3:\n คำสั่งทั้งหมด = 15 คำสั่ง\n โหลดข้อมูล (LD) = 8 ครั้ง (A B C D E F และ T1 T2 ที่ spill ไว้)\n สโตร์ข้อมูล (ST) = 2 ครั้ง (spill ลง T1, T2)\n รวมแตะ memory ฝั่งข้อมูล = 10 ครั้ง\n \nขั้น 2) นับฝั่ง RV32I:\n คำสั่งทั้งหมด = 5 คำสั่ง\n แตะ memory ฝั่งข้อมูล = 0 ครั้ง\n \nขั้น 3) วิเคราะห์สาเหตุ: ปัญหาไม่ใช่ว่าโค้ด LC-3 เขียนไม่เก่ง\n แต่ค่าที่ต้อง \"มีชีวิตพร้อมกัน\" มีสูงสุด 9 ค่า (a..f หกตัว\n + ผลรวมย่อยอีกสามตัว) มากกว่า register ที่ว่างจริง\n จึงถูกบังคับให้ spill เสมอ ส่วน RV32I มี 32 ตัว\n ค่าทั้งหมดอาศัยอยู่บน register ได้ถาวรตลอดฟังก์ชัน"}, {"type": "table", "content": "<table>\n<thead>\n<tr><th></th><th>LC-3 (8 register)</th><th>RV32I (32 register)</th></tr>\n</thead>\n<tbody>\n<tr><td>จำนวนคำสั่ง</td><td>15</td><td>5</td></tr>\n<tr><td>แตะ memory ฝั่งข้อมูล</td><td>10 ครั้ง</td><td>0 ครั้ง</td></tr>\n</tbody>\n</table>"}, {"type": "note", "content": "สิ่งที่ควรสังเกต: ความต่างไม่ได้อยู่ที่จำนวนคำสั่งอย่างเดียว แต่อยู่ที่การแตะ memory ซึ่งช้ากว่า register หลายเท่า — จำนวน register ที่มากพอทำให้ compiler ตัด traffic ส่วนนี้ทิ้งได้ทั้งก้อน"}, {"type": "note", "content": "x0: register ที่ถูก hardwired เป็นศูนย์\nx0 อ่านได้ค่า 0 เสมอ และเขียนทับไม่ได้ (เขียนลงไปก็หายไป) LC-3 ไม่มีของแบบนี้ ประโยชน์มหาศาล: ทำ NOP ได้ด้วย addi x0,x0,0, ก็อปปี้ค่า register ด้วย add x6,x7,x0, และเทียบกับศูนย์ด้วย beq x5,x0,LABEL โดยไม่ต้องเปลือง register จริงเก็บค่าคงที่ 0"}, {"type": "subheading", "content": "ABI: register แต่ละตัวมีหน้าที่ (ตามข้อตกลง)"}, {"type": "note", "content": "ในฮาร์ดแวร์ x1–x31 เหมือนกันหมด (x0 พิเศษเพราะเป็นศูนย์) แต่ระดับซอฟต์แวร์มี ABI (Application Binary Interface) กำหนด \"ชื่อเรียก\" และ \"หน้าที่\" ของแต่ละ register เป็นข้อตกลงร่วม ทำให้โค้ดจากคนละทีม/คนละ compiler เรียกกันได้ LC-3 ไม่มีมาตรฐานแบบนี้ (ใน Topic 8 เราตั้งกติกา save/restore กันเอง)"}, {"type": "table", "content": "<table>\n<thead>\n<tr><th>register</th><th>ชื่อ ABI</th><th>หน้าที่</th><th>ใครรักษาค่า</th></tr>\n</thead>\n<tbody>\n<tr><td>x0</td><td>zero</td><td>ค่าศูนย์เสมอ</td><td>— (คงที่)</td></tr>\n<tr><td>x1</td><td>ra</td><td>return address</td><td>caller-saved</td></tr>\n<tr><td>x2</td><td>sp</td><td>stack pointer</td><td>callee-saved</td></tr>\n<tr><td>x3</td><td>gp</td><td>global pointer</td><td>reserved — ตั้งค่าตอน startup คงค่าทั้งโปรแกรม (compiler ไม่จัดสรรเป็นตัวแปร)</td></tr>\n<tr><td>x4</td><td>tp</td><td>thread pointer</td><td>reserved — ตั้งค่าตอน startup คงค่าทั้งโปรแกรม (compiler ไม่จัดสรรเป็นตัวแปร)</td></tr>\n<tr><td>x5–x7</td><td>t0–t2</td><td>temporary</td><td>caller-saved</td></tr>\n<tr><td>x8</td><td>s0 / fp</td><td>saved / frame pointer</td><td>callee-saved</td></tr>\n<tr><td>x9</td><td>s1</td><td>saved</td><td>callee-saved</td></tr>\n<tr><td>x10–x17</td><td>a0–a7</td><td>argument / return value</td><td>caller-saved</td></tr>\n<tr><td>x18–x27</td><td>s2–s11</td><td>saved</td><td>callee-saved</td></tr>\n<tr><td>x28–x31</td><td>t3–t6</td><td>temporary</td><td>caller-saved</td></tr>\n</tbody>\n</table>"}, {"type": "note", "content": "สรุปจำง่าย: argument และ return value ไปทาง a0–a7 (a0/a1 ยังใช้รับค่าคืน), temporary t0–t6, saved s0–s11, return address อยู่ที่ ra, stack pointer อยู่ที่ sp, และ fp (เป็นชื่อแฝงของ s0) ใช้ชี้ frame ปัจจุบัน"}, {"type": "subheading", "content": "Caller-saved vs Callee-saved"}, {"type": "note", "content": "หัวใจของ calling convention คือกติกาว่า \"ใครรับผิดชอบเก็บค่า register ข้าม subroutine call\"\n\n• Caller-saved (เช่น t0–t6, a0–a7, ra): subroutine ที่ถูกเรียก (callee) มีสิทธิ์ทับค่าได้ตามใจ ถ้า caller ยังต้องใช้ค่าหลัง call ต้องเซฟเองก่อนเรียก\n• Callee-saved (เช่น s0–s11, sp): callee ถ้าจะใช้ register กลุ่มนี้ ต้องเซฟค่าเดิมลง stack ตอนเข้า แล้ว restore คืนก่อน return — caller จึงมั่นใจได้ว่าค่ายังอยู่ครบหลัง call"}, {"type": "note", "content": "ทำไมแบ่งสองกลุ่ม\nเป็นการประนีประนอม (trade-off): ถ้าทุก register เป็น callee-saved จะเซฟ/รีสโตร์เปลือง แม้ค่าที่ caller ไม่สนใจแล้ว ถ้าทุกตัวเป็น caller-saved ก็เซฟเปลืองอีกแบบ การแบ่งครึ่งให้ compiler เลือกวางตัวแปร \"อายุยาว\" ไว้ใน s-register และตัวแปร \"อายุสั้น\" ไว้ใน t-register ลดงานเซฟโดยรวม"}, {"type": "subheading", "content": "บันไดขั้นกลาง: เลือกกลุ่ม register ให้ถูกใน 3 สถานการณ์"}, {"type": "note", "content": "ขั้นตอนตัดสินใจ (ใช้ได้ทุกครั้ง):\n\n1. ถามก่อนว่าค่านี้เป็นอาร์กิวเมนต์ที่จะส่งให้ (หรือค่าคืนจาก) ฟังก์ชันหรือไม่ — ถ้าใช่ ต้องใช้ a0–a7 เท่านั้น เพราะ callee จะไปหาที่นั่นตามข้อตกลง\n2. ถ้าไม่ใช่ ถามต่อว่าค่านี้ต้องรอดข้ามการเรียกฟังก์ชัน (call) หรือไม่ — ถ้าไม่ข้าม ใช้ t0–t6 (ถูกที่สุด ไม่มีภาระเซฟ)\n3. ถ้าต้องรอดข้าม call ใช้ s0–s11 แล้วทำหน้าที่ callee ให้ครบ: เซฟค่าเดิมลง stack ก่อนใช้ และ restore ก่อน return\n\nสถานการณ์ 1 — ค่าชั่วคราว: ต้องคำนวณ address ของสมาชิก array คือ base + i×4 ใช้เสร็จภายใน 2-3 บรรทัดถัดไป และช่วงนั้นไม่มีการเรียกฟังก์ชันเลย ควรใช้ register กลุ่มไหน ลองตอบก่อนเปิดเฉลย"}, {"type": "example", "content": "กดดูเฉลย\nใช้ t-register เช่น t0 — ค่าอายุสั้นและไม่มี call มาคั่น จึงไม่มีใครมีสิทธิ์ทับระหว่างทาง ถ้าไปใช้ s0 จะต้องเสียคำสั่งเซฟ/รีสโตร์ลง stack ฟรี ๆ ทั้งที่ไม่ได้ความปลอดภัยอะไรเพิ่ม"}, {"type": "note", "content": "สถานการณ์ 2 — ค่าที่ต้องรอดข้าม call: ผลรวมสะสม sum ในลูปที่มีการเรียก subroutine print ทุกรอบ sum ต้องมีค่าถูกต้องตั้งแต่รอบแรกจนจบลูป ควรเก็บไว้กลุ่มไหน"}, {"type": "example", "content": "กดดูเฉลย\nใช้ s-register เช่น s1 — print เป็น callee ที่มีสิทธิ์ทับ t-register กับ a-register ทุกตัวตามกติกา caller-saved ถ้าเก็บ sum ใน t0 ค่าอาจหายหลังกลับจาก print แต่ถ้า print จะใช้ s1 มันมีหน้าที่เซฟ/รีสโตร์คืนให้ ค่า sum จึงรอดแน่นอนทุกรอบ"}, {"type": "note", "content": "สถานการณ์ 3 — อาร์กิวเมนต์: กำลังจะเรียกฟังก์ชัน area(w, h) ต้องวาง w กับ h ไว้ที่ไหน และผลลัพธ์จะกลับมาทางไหน"}, {"type": "example", "content": "กดดูเฉลย\nวาง w ใน a0 และ h ใน a1 (อาร์กิวเมนต์ตัวที่ 1 และ 2 ตามลำดับ) ผลลัพธ์กลับมาใน a0 — นี่ไม่ใช่เรื่องรสนิยม แต่เป็นข้อตกลง ABI: ถ้าเอา w ไปวางใน t0 ฝั่ง area จะไม่มีทางรู้ว่าอาร์กิวเมนต์อยู่ไหน เพราะ area อาจถูก compile มาจากไฟล์อื่นที่ไม่เคยเห็นโค้ดของเราเลย"}, {"type": "note", "content": "สิ่งที่ควรสังเกต: คำถามเดียวที่ตัดสินเกือบทุกกรณีคือ \"ค่านี้ต้องรอดข้าม call ไหม\" — ไม่ข้ามไป t, ข้ามไป s, ส่วน a มีไว้ส่งของเข้า-ออกฟังก์ชันเท่านั้น อย่าใช้เก็บของยาว ๆ"}, {"type": "table", "content": "<pre style=\"font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--navy-deep);color:#EAF1FA;padding:14px 16px;border-radius:6px;border-left:4px solid var(--flag);overflow-x:auto;white-space:pre;\"># โครงร่าง subroutine RISC-V ตามมาตรฐาน ABI\nfunc:\n    addi sp, sp, -16     # จองเฟรมบน stack (sp เป็น callee-saved)\n    sw   ra, 12(sp)      # เซฟ return address (ra) ถ้าจะเรียก subroutine ต่อ\n    sw   s0, 8(sp)       # เซฟ s0 เพราะเป็น callee-saved และเรากำลังจะใช้\n    # ... ตัวงาน ...\n    lw   s0, 8(sp)       # restore s0 คืน\n    lw   ra, 12(sp)      # restore ra\n    addi sp, sp, 16      # คืนพื้นที่ stack\n    ret                  # = jalr x0, 0(ra)</pre>"}, {"type": "note", "content": "ลองทำทีละขั้น: สมมติเข้า func ตอน sp = 0x8000 และ ra ถือค่า 0x40C (ที่อยู่ที่ต้องกลับไป) ไล่ค่า sp และค่าที่ถูกเซฟลง stack ทีละคำสั่ง จนถึง ret"}, {"type": "example", "content": "กดดูวิธีทำทีละขั้น\nเริ่ม: sp = 0x8000, ra = 0x40C, ค่าเดิมของ s0 สมมติ = 0x11\n \naddi sp, sp, -16 → sp = 0x8000 - 16 = 0x7FF0 (จองเฟรม 16 ไบต์)\nsw ra, 12(sp) → เขียน 0x40C ลง address 0x7FF0+12 = 0x7FFC\nsw s0, 8(sp) → เขียน 0x11 ลง address 0x7FF0+8 = 0x7FF8\n... ตัวงาน ... → โค้ดในนี้จะทับ ra/s0 ในรีจิสเตอร์ยังไงก็ได้\n เพราะค่าจริงถูกสำรองไว้บน stack แล้ว\nlw s0, 8(sp) → อ่าน 0x7FF8 กลับมา → s0 = 0x11 (คืนค่าเดิมของ caller)\nlw ra, 12(sp) → อ่าน 0x7FFC กลับมา → ra = 0x40C\naddi sp, sp, 16 → sp = 0x7FF0 + 16 = 0x8000 (คืน sp เท่าตอนเข้า)\nret (= jalr x0,0(ra)) → กระโดดไป PC = 0x40C (กลับไปหา caller ถูกจุด)\n \nตรวจ: sp กลับมา 0x8000 เท่าเดิม, s0 กลับมา 0x11 เท่าเดิม → เป็น callee-saved ครบถ้วน\n caller จึงมั่นใจได้ว่า sp/s0 ไม่ถูกทำพังหลัง call"}, {"type": "subheading", "content": "ตัวอย่างขั้นยาก: push/pop ผ่าน sp พร้อมผัง stack ตาม address จริง"}, {"type": "note", "content": "โจทย์: ฟังก์ชัน calc ต้องใช้ s0 กับ s1 และมีการเรียกฟังก์ชันลูกข้างใน (จึงต้องเซฟ ra ด้วย) เข้าฟังก์ชันตอน sp = 0x9000, ra = 0x40C, ค่าเดิม s0 = 0x11, s1 = 0x22"}, {"type": "table", "content": "<pre style=\"font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--navy-deep);color:#EAF1FA;padding:14px 16px;border-radius:6px;border-left:4px solid var(--flag);overflow-x:auto;white-space:pre;\">calc:\n    addi sp, sp, -16     # (1) push: จองเฟรม 16 ไบต์ (ABI จัดเฟรมเป็นพหุคูณของ 16)\n    sw   ra, 12(sp)      # (2) เซฟ return address\n    sw   s0, 8(sp)       # (3) เซฟ s0 เดิมของ caller\n    sw   s1, 4(sp)       # (4) เซฟ s1 เดิมของ caller\n    # ... ตัวงาน: เรียกฟังก์ชันลูกได้ ใช้ s0/s1 ได้เต็มที่ ...\n    lw   s1, 4(sp)       # (5) pop: restore ย้อนลำดับ\n    lw   s0, 8(sp)       # (6)\n    lw   ra, 12(sp)      # (7)\n    addi sp, sp, 16      # (8) คืนพื้นที่เฟรม\n    ret</pre>"}, {"type": "note", "content": "ลองวาดผัง stack เองก่อนว่าแต่ละค่าถูกเขียนลง address ไหน แล้วค่อยเทียบกับเฉลย"}, {"type": "example", "content": "กดดูวิธีทำทีละขั้น\nขั้น (1) addi sp, sp, -16 → sp = 0x9000 - 16 = 0x8FF0 (stack โตลงทาง address ต่ำ)\nขั้น (2) sw ra, 12(sp) → เขียน 0x40C ลง address 0x8FF0 + 12 = 0x8FFC\nขั้น (3) sw s0, 8(sp) → เขียน 0x11 ลง address 0x8FF0 + 8 = 0x8FF8\nขั้น (4) sw s1, 4(sp) → เขียน 0x22 ลง address 0x8FF0 + 4 = 0x8FF4\n \nผัง stack หลังขั้น (4) (1 ช่อง = 1 word = 4 ไบต์)\n \n address ค่าที่เก็บ หมายเหตุ\n 0x9000 (เฟรมของ caller) ← sp ตอนเข้า calc เคยชี้ตรงนี้\n 0x8FFC 0x0000040C ra เดิม [เขียนโดยขั้น (2)]\n 0x8FF8 0x00000011 s0 เดิม [เขียนโดยขั้น (3)]\n 0x8FF4 0x00000022 s1 เดิม [เขียนโดยขั้น (4)]\n 0x8FF0 (ช่องเผื่อจัดเฟรม) ← sp ปัจจุบันชี้ตรงนี้ [จากขั้น (1)]\n \nขั้น (5)-(7) lw ย้อนลำดับ → s1 = 0x22, s0 = 0x11, ra = 0x40C กลับครบทุกตัว\nขั้น (8) addi sp, sp, 16 → sp = 0x8FF0 + 16 = 0x9000 เท่าตอนเข้าพอดี\nret → กระโดดกลับไป address 0x40C ของ caller\n \nตรวจ: sp, s0, s1 เหมือนตอนเข้าทุกประการ → เคารพกติกา callee-saved ครบถ้วน"}, {"type": "note", "content": "สิ่งที่ควรสังเกต: pop ต้องย้อนลำดับ push เสมอ และ offset ตอน lw ต้องตรงกับตอน sw ทุกตัว — ถ้าสลับช่องเดียว ค่าที่ restore จะสลับกันทั้งเฟรมโดยไม่มี error ใดเตือนเลย"}, {"type": "example", "content": "ลองทาย: ถ้า subroutine A เก็บค่าไว้ใน t0 แล้วเรียก subroutine B โดยไม่เซฟ t0 หลัง B กลับมา ค่าใน t0 จะยังเชื่อถือได้ไหม\nไม่ได้ เพราะ t0 เป็น caller-saved ตามกติกา B มีสิทธิ์ทับ t0 ได้ A ในฐานะ caller ต้องเซฟ t0 เองก่อนเรียก (หรือเลือกใช้ s-register ซึ่ง callee-saved แทน)"}, {"type": "note", "content": "ลองเล่นเอง: คลิก register ในแผนผังด้านล่างเพื่อทบทวนชื่อ ABI, หน้าที่ และว่าเป็น caller- หรือ callee-saved — กดปุ่มไฮไลต์เฉพาะกลุ่มได้"}, {"type": "image", "alt": "RISC-V Register File — คลิกดูหน้าที่ตาม ABI", "src": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAvAAAAHRCAIAAACD3BojAAAAAXNSR0IArs4c6QAAIABJREFUeJzsvXtUU1fa+P94OUdJIrdwbzRAASsgyOUnZBbRDlSNS0UH8FuwFX2xSlVGxYr1wleKo6jQV7SDtXjhO0Kn4Kv4WpRl1JKOhjUJLi6iEAqhQCBNuAUIJkHOEfz9kYCgAYKXop39Wa4lSfb97Muzn/08+0zq7+8HAAB4+hQG/nj6mJik1jzV9E7SPAbNY3jSBwgEAoFAIBATwtQpQJmu/feUajRpOv500qRJ2p8G/odJ/f39AJOePn2qFWUAJjUrnirVkyZPAsp0MJoGRtMBmzpptHwQCAQCgUAg3hjkk6c9j6GnFzSP4elTMKY+taFPAtCJNZMmTQJ4Oqm//6kWACBJqJVOMpoODGskwSAQCAQCgXgbaWp5+rgXnBhPsamgFWgmTZo0qa+vX6uY6e19Wlk/yZEBNAqSZhAIBAKBQLy9PNI8rWsCd6en0zCdqmbSkyd9AJNI8umD2kmes5Eog0AgEAgE4t2gvOaph9NTbOokgKeTtaYztVJ4f+ZElwuBQCAQCATCYBzfg1qpzg548tOn0NIBRtMnoZMmBAKBQCAQ7xAzqJOm49DaCU+fwuTHBHSrJyErYAQCgUAgEO8cM20mKVXQS8BkTc/TSUiYQSAQCAQC8W4yadIk9eOnk9WPJ1GmT3RZEAgEAoFAIF4Ko2mgfjxpsqYXjKZNdFkQCAQCgUAgXgrKdOh5DJN7HoMR0tAgEAgEAoF4NzGaDprHMPVJ3yT0ZgMEAoFAIBDvKNjUSU/6YPJEFwOBQCAQCATiVUECDQLxh6K3pCxu2+3E3I6JLggCgUD8rkyd6AIgEIjXiqLjvrCFZkdOdDkQCATidwVpaBAIBAKBQLzzIIEGgXgLeNRWdKuhUtEHAAAqsaCpqET56OWSopqw/Gx9mVNebwERCATiLQcdOSH+c3lU08C93iSSE0A3D1j2QdBco4kph6ImbvW9eyoAGuPAjx/Ou1O046AcFi284mNiWPw+Rcmvl2/LGhV9NLq5E7TcKeqkWcx506VGIBCItwok0EwEAv6y7RIVALjPy8lwt53o4owT1aWoq2kVAIBxTn68l6X3m7efPvGF2ztOtat0H+W8KzV5WwOT11lOwDWTiu5mFdBok1Wq9nt3qrhpchVuFrNxpkEl6VXeOMg7fltN6D7LDctSdWNb3lFhPzA/OHfJ1/kVyj4uHt0qCI+Xq4Aadj74r3ORDgmBQLxOxifQPLp+e/nBlmFf4ZPNbU1cWY5r1s1xow9+2/L3lbcvywEA5h8ITVk+sPF91Hbj7IO8O+21CpKAyTQabm5n4uRiERDiFuSCD021V9bEzfmVJ2ivlRMqAmjmRrPm2nFCnANZ5jP0FKshcWUhTwUAWGDyXxI+HJ6UgB++XdIBALj
