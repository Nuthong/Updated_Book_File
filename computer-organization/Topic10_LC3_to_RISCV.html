# x5 = x6 * 2\n# extension M: คูณตรง ๆ ต้องมีฮาร์ดแวร์รองรับ\nmul  x7, x8, x9      # x7 = x8 * x9 (32 บิตล่างของผล)</pre>"}, {"type": "note", "content": "ลองทำทีละขั้น: สมมติ x6 = 6 (เลขไม่มีเครื่องหมาย) จงไล่ค่าบิตของ slli x5, x6, 2 แล้วเทียบว่าตรงกับ \"คูณด้วย $2^2$\" หรือไม่ และดูว่า srli x5, x6, 1 ให้ผลอะไร"}, {"type": "example", "content": "กดดูวิธีทำทีละขั้น\nเขียน x6 = 6 เป็นเลขฐานสองใน 8 บิตล่าง (บิตสูงเป็น 0 หมด):\n x6 = 0000 0110 (= 4 + 2 = 6)\n \nขั้น 1) slli x5, x6, 2 → เลื่อนบิตไปทางซ้าย 2 ตำแหน่ง เติม 0 ทางขวา\n 0000 0110 เลื่อนซ้าย 1 → 0000 1100 (= 12)\n 0000 1100 เลื่อนซ้าย 1 → 0001 1000 (= 24)\n ผล x5 = 0001 1000 = 16 + 8 = 24\nตรวจ: คูณด้วย 2^2 = 6 × 4 = 24 ✓ ตรงกัน (บิตทุกตัวขยับซ้าย 2 = คูณ 4)\n \nขั้น 2) srli x5, x6, 1 → เลื่อนขวา 1 (logical, เติม 0 ทางซ้าย)\n 0000 0110 เลื่อนขวา 1 → 0000 0011 (= 3)\n ผล = 3 = floor(6 / 2) → เลื่อนขวา 1 บิต = หารด้วย 2 (ปัดลง)\n \nประเด็น: barrel shifter ขยับทุกบิตพร้อมกันในคำสั่งเดียว (0..31 ตำแหน่ง)\n LC-3 base ไม่มี ต้องวนลูปบวกซ้ำ/ขยับทีละบิตเอง"}, {"type": "subheading", "content": "ขั้นถัดไป: เลขลบ — srai กับ srli ให้ผลไม่เหมือนกัน"}, {"type": "note", "content": "โจทย์: x6 = -16 จงหาผลของ srai x5, x6, 2 เทียบกับ srli x5, x6, 2 (เลื่อนขวา 2 บิตเท่ากัน ต่างกันแค่บิตที่เติมทางซ้าย)\n\nชวนคิดก่อนเปิดเฉลย: -16 หารด้วย 4 ควรได้ -4 — คำสั่งไหนให้คำตอบนี้ และอีกคำสั่งให้ค่าอะไรแทน"}, {"type": "example", "content": "กดดูวิธีทำทีละขั้น\nขั้น 1) เขียน -16 เป็น two's complement 32 บิต:\n x6 = 1111 1111 1111 1111 1111 1111 1111 0000 = 0xFFFFFFF0\n \nขั้น 2) srai x5, x6, 2 (arithmetic: เติมซ้ำ sign bit = 1 ทางซ้าย)\n ผล = 1111 1111 1111 1111 1111 1111 1111 1100 = 0xFFFFFFFC = -4\n ตรวจ: -16 ÷ 4 = -4 ✓ เครื่องหมายรอด เพราะบิตซ้ายสุดถูกก๊อบปี้เข้ามาแทนที่\n \nขั้น 3) srli x5, x6, 2 (logical: เติม 0 ทางซ้าย)\n ผล = 0011 1111 1111 1111 1111 1111 1111 1100 = 0x3FFFFFFC\n = 1073741820 กลายเป็นเลขบวกมหึมา\n เพราะ 0 สองตัวที่เติมเข้ามาทำลายบิตเครื่องหมายทิ้ง\n \nเทียบบิต: สองผลลัพธ์ต่างกันแค่ 2 บิตซ้ายสุด (11 กับ 00)\n แต่ค่าที่ตีความได้ห่างกันคนละโลก\nสรุป: เลขมีเครื่องหมาย (signed) เลื่อนขวาด้วย srai\n เลขไม่มีเครื่องหมาย/มองเป็นบิตล้วน เลื่อนขวาด้วย srli"}, {"type": "note", "content": "สิ่งที่ควรสังเกต: LC-3 ไม่มีคำสั่งเลื่อนขวาเลยสักแบบ (เลื่อนซ้ายยังพอทำได้ด้วย ADD ตัวเองเข้าตัวเอง) ส่วน RV32I ให้มาทั้งสองแบบใน base เพราะงาน signed กับ unsigned ต้องการพฤติกรรมต่างกันจริง"}, {"type": "subheading", "content": "ขั้นกลาง: คูณด้วยซอฟต์แวร์บน LC-3 เทียบ mul คำสั่งเดียว"}, {"type": "note", "content": "LC-3 base ไม่มีคำสั่งคูณ วิธีพื้นฐานที่สุดคือบวกซ้ำ: อยากได้ R2 = R0 × 12 ก็บวก R0 เข้าผลสะสม 12 ครั้ง"}, {"type": "table", "content": "<pre style=\"font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--navy-deep);color:#EAF1FA;padding:14px 16px;border-radius:6px;border-left:4px solid var(--flag);overflow-x:auto;white-space:pre;\">; LC-3: R2 = R0 × 12  (R1 เริ่มต้นเป็น 12 ใช้เป็นตัวนับ)\n      AND R2, R2, #0     ; R2 = 0 (ผลสะสม)\nLOOP  ADD R2, R2, R0     ; ผลสะสม = ผลสะสม + R0\n      ADD R1, R1, #-1    ; ตัวนับลด 1\n      BRp LOOP           ; ตัวนับยังเป็นบวก → วนต่อ</pre>"}, {"type": "note", "content": "ลองนับเองก่อน: โปรแกรมนี้ execute จริงทั้งหมดกี่คำสั่งกว่าจะได้ผลคูณ"}, {"type": "example", "content": "กดดูวิธีทำทีละขั้น\nขั้น 1) นับคำสั่งที่เขียนในโปรแกรม (static): 4 คำสั่ง\nขั้น 2) นับคำสั่งที่ execute จริง (dynamic) เมื่อตัวคูณ = 12:\n AND ทำ 1 ครั้ง\n ตัวลูป (ADD, ADD, BRp) ทำ 12 รอบ = 12 × 3 = 36 คำสั่ง\n รวม = 1 + 36 = 37 คำสั่ง\nขั้น 3) ประมาณเวลา: LC-3 หนึ่งคำสั่งกินหลายไซเคิล (เดินผ่าน state\n ของ fetch-decode-execute หลายจังหวะ) คิดหยาบ ๆ 5 ไซเคิล/คำสั่ง\n → ราว 37 × 5 = 185 ไซเคิล\nขั้น 4) ฝั่ง RV32IM: mul x7, x8, x9 คือ 1 คำสั่ง\n วงจรคูณในฮาร์ดแวร์จบงานในราว 1-3 ไซเคิล"}, {"type": "table", "content": "<table>\n<thead>\n<tr><th></th><th>LC-3 ลูปบวกซ้ำ</th><th>RV32IM <code>mul</code></th></tr>\n</thead>\n<tbody>\n<tr><td>คำสั่งในโปรแกรม (static)</td><td>4</td><td>1</td></tr>\n<tr><td>คำสั่งที่ execute จริง (คูณด้วย 12)</td><td>37</td><td>1</td></tr>\n<tr><td>ไซเคิลโดยประมาณ</td><td>ราว 185 (คิด 5 ไซเคิล/คำสั่ง)</td><td>1-3</td></tr>\n<tr><td>ถ้าตัวคูณเป็น 1000</td><td>3001 คำสั่ง — โตตามค่าตัวคูณ</td><td>1 คำสั่งเท่าเดิม</td></tr>\n</tbody>\n</table>"}, {"type": "note", "content": "สิ่งที่ควรสังเกต: เวลาทำงานของลูปโตตาม \"ค่า\" ของตัวคูณ ส่วน mul ใช้วงจรคูณจริงจึงใช้เวลาคงที่ — นี่คือเหตุผลที่ extension M คุ้มทรานซิสเตอร์สำหรับงานที่คูณบ่อย"}, {"type": "subheading", "content": "ขั้นยาก: คูณแบบ shift-add ด้วย RV32I ล้วน (ไม่มี extension M ก็คูณฉลาดได้)"}, {"type": "note", "content": "ถ้าชิปมีแค่ RV32I เปล่า ๆ เราไม่จำเป็นต้องบวกซ้ำแบบ LC-3 เพราะมี barrel shift ใน base ให้ใช้อัลกอริทึม shift-add: มองตัวคูณ 5 = 101 ฐานสอง แล้ว 6 × 5 = 6×4 + 6×1 คือบวกเฉพาะตำแหน่งที่บิตของตัวคูณเป็น 1\n\nโจทย์: คูณ 6 × 5 (x10 = 6 เป็นตัวตั้ง, x11 = 5 เป็นตัวคูณ, ผลลัพธ์ลง x12) ด้วยโค้ด 7 บรรทัด"}, {"type": "table", "content": "<pre style=\"font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--navy-deep);color:#EAF1FA;padding:14px 16px;border-radius:6px;border-left:4px solid var(--flag);overflow-x:auto;white-space:pre;\">        addi x12, x0, 0      # ผลสะสม = 0\nLOOP:   andi x5, x11, 1      # ดูบิตต่ำสุดของตัวคูณ\n        beq  x5, x0, SKIP    # บิตเป็น 0 → ไม่ต้องบวก\n        add  x12, x12, x10   # บิตเป็น 1 → บวกตัวตั้งเข้าผลสะสม\nSKIP:   slli x10, x10, 1     # ตัวตั้ง × 2 (เตรียมน้ำหนักของบิตถัดไป)\n        srli x11, x11, 1     # ตัวคูณเลื่อนขวา ทิ้งบิตที่ใช้ไปแล้ว\n        bne  x11, x0, LOOP   # ตัวคูณยังไม่เป็นศูนย์ → วนต่อ</pre>"}, {"type": "note", "content": "ลอง trace เองก่อนว่าแต่ละรอบ x10, x11, x12 เปลี่ยนเป็นค่าอะไร"}, {"type": "example", "content": "กดดูวิธีทำทีละขั้น\nเริ่ม: x10 (ตัวตั้ง) = 6, x11 (ตัวคูณ) = 5 = 101 ฐานสอง, x12 (ผลสะสม) = 0\n \nรอบ 1: x11 = 101 → บิตต่ำสุด = 1\n add → x12 = 0 + 6 = 6\n slli → x10 = 12 srli → x11 = 10 ฐานสอง = 2 ยังไม่ศูนย์ → วนต่อ\nรอบ 2: x11 = 010 → บิตต่ำสุด = 0\n ข้ามการบวก (x12 = 6 เท่าเดิม)\n slli → x10 = 24 srli → x11 = 1 ยังไม่ศูนย์ → วนต่อ\nรอบ 3: x11 = 001 → บิตต่ำสุด = 1\n add → x12 = 6 + 24 = 30\n slli → x10 = 48 srli → x11 = 0 หมดบิต → ออกจากลูป\n \nผลลัพธ์ x12 = 30 = 6 × 5 ✓\nตรวจความหมาย: 30 = 6×1 (จากบิตตำแหน่ง 0) + 6×4 (จากบิตตำแหน่ง 2) = 6 + 24\n \nนับรอบ: วนแค่ 3 รอบ = จำนวนบิตของตัวคูณ 5 (ใช้ 3 บิต)\nเทียบสามวิธี เมื่อตัวคูณ = 1000:\n บวกซ้ำแบบ LC-3 → วน 1000 รอบ (โตตามค่าของตัวคูณ)\n shift-add (RV32I) → วน 10 รอบ (1000 ใช้ 10 บิต — โตตามจำนวนบิต)\n mul (extension M) → 1 คำสั่งจบ (วงจรคูณในฮาร์ดแวร์)"}, {"type": "note", "content": "สิ่งที่ควรสังเกต: shift-add คืออัลกอริทึมเดียวกับที่วงจรคูณในฮาร์ดแวร์ใช้ — ใน Topic 11 จะได้เดินดูเวอร์ชัน \"วงจร\" ของมันทีละจังหวะ ส่วนหน้านี้ให้เห็นมุมซอฟต์แวร์ล้วน: มีแค่ shift กับ add ของ base ก็คูณได้เร็วระดับ \"จำนวนบิต\" แล้ว"}, {"type": "subheading", "content": "Stack discipline ผ่าน sp"}, {"type": "note", "content": "LC-3 ไม่มี stack pointer ที่เป็นมาตรฐาน ใน Topic 8 เรานิยม R6 เป็น stack pointer กันเองตามกติกา RISC-V ยกระดับเรื่องนี้เป็น ABI: sp (x2) คือ stack pointer อย่างเป็นทางการ และ fp (x8 = s0) ชี้ frame ปัจจุบัน stack \"โต\" ลงไปทาง address ต่ำ (grows downward) การ push คือ addi sp, sp, -k แล้ว sw การ pop คือ lw แล้ว addi sp, sp, +k"}, {"type": "note", "content": "ฮาร์ดแวร์ไม่มีคำสั่ง push/pop\nRISC-V ตั้งใจให้ stack เป็น discipline ของซอฟต์แวร์: ใช้ addi ปรับ sp + lw/sw ธรรมดา ไม่มี opcode push/pop แยก สอดคล้องปรัชญา RISC ที่ให้คำสั่งน้อย เรียบง่าย แล้วประกอบเอา ส่วน sp ถูกกำหนดเป็น callee-saved ใน ABI จึงต้องคืนค่าเท่าเดิมก่อน return"}, {"type": "subheading", "content": "Floating point: extension F (และ D)"}, {"type": "note", "content": "LC-3 ไม่มีเลขทศนิยม (floating point) เลย RISC-V แยกเป็น extension เพราะไม่ใช่ทุกชิปต้องการ\n\n• F = single-precision (32 บิต) เพิ่ม register ชุดใหม่ f0–f31 และคำสั่งอย่าง fadd.s, fmul.s, flw/fsw ตามมาตรฐาน IEEE 754\n• D = double-precision (64 บิต) ต่อยอดจาก F\n\nการแยก F/D ออกจาก base ทำให้ไมโครคอนโทรลเลอร์เล็ก ๆ ที่ไม่ต้องใช้ทศนิยม ประหยัดทรานซิสเตอร์ลงได้"}, {"type": "subheading", "content": "Modular ISA: base + extensions"}, {"type": "note ghTAAAAAAAAUkCYAgAAAAAAkALCFAAAAAAAgBQQpgAAAAAAAKSAMAUAAAAAACAFhCkAAAAAAAApIEwBAAAAAABIAWEKAAAAAABACghTAAAAAAAAUkCYAgAAAAAAkALCFAAAAAAAgBQQpgAAAAAAAKSAMAUAAAAAACAFhCkAAAAAAAApIEwBAAAAAABIAWEKAAAAAABACghTAAAAAAAAUkCYAgAAAAAAkIIvr3cDAAAAkvXf8m//W/7tercCAAA8P/8vuBH/r58wBQAAfGb8r0v/d72bAAAAwDQfAAAAAACAVDAyBQAAbHRfUX159pONOMQXAAA8N19N/9J6NyFs06effrrebQAAAAAAAPjMYJoPAAAAAABACghTAAAAAAAAUkCYAgAAAAAAkALCFAAAAAAAgBQQpgAAAAAAAKSAMAUAAAAAACAFhCkAAAAAAAApIEwBAAAAAABIAWEKAAAAAABACghTAAAAAAAAUkCYAgAAAAAAkALCFAAAAAAAgBQQpgAAAAAAAKSAMAUAAAAAACAFhCkAAAAAAAApIEwBAAAAAABIAWEKAAAAAABACghTAAAAAAAAUkCYAgAAAAAAkALCFAAAAAAAgBQQpgAAAAAAAKSAMAUAAAAAACAFhCkAAAAAAAApIEwBAAAAAABIAWEKAAAAAABACghTAAAAAAAAUkCYAgAAAAAAkALCFAAAAAAAgBQQpgAAAAAAAKSAMAUAAAAAACAFhCkAAAAAAAApIEwBAAAAAABIAWEKAAAAAABACghTAAAAAAAAUkCYAgAAAAAAkALCFAAAAAAAgBQQpgAAAAAAAKSAMAUAAAAAACAFhCkAAAAAAAApIEwBAAAAAABIAWEKAAAAAABACghTAAAAAAAAUkCYAgAAAAAAkIL/Dz6fMHGDPXLHAAAAAElFTkSuQmCC"}, {"type": "note", "content": "• RV32I = base integer ISA แค่ ~40 คำสั่ง ทุกชิป RISC-V ต้องมี\n• M = คูณ/หาร, F = float single, D = float double, A = atomic (สำหรับ multi-core/concurrency), C = compressed (คำสั่ง 16 บิตสำหรับคำสั่งที่ใช้บ่อย ช่วยลดขนาดโค้ด)\n\nทิศทางการรันเป็น subset ⊂ superset: โปรแกรมที่เขียนด้วย base ล้วน ๆ รันบนชิปที่มี extension เพิ่มได้สบาย (เล็ก → ใหญ่: รันได้) แต่ถ้าใช้ mul (M) หรือ float (F/D) ไปรันบนชิป RV32I เปล่า ๆ จะเจอ illegal instruction เพราะ CPU ตัวนั้น \"ไม่รู้จัก\" opcode (ใหญ่ → เล็ก: พัง)"}, {"type": "note", "content": "ทำไมต้องรู้ + CPU ใช้ยังไง\nmodular ISA ไม่ใช่แค่เรื่องระบบระเบียบของเอกสาร แต่กำหนดว่าจะมีทรานซิสเตอร์ชุดไหนอยู่บนซิลิคอนจริง: barrel shifter (sll/srl/sra) เป็นวงจรใน ALU ที่ขยับทุกบิตพร้อมกันในหนึ่งรอบสัญญาณนาฬิกา ส่วนตัวคูณ/หาร (M) และหน่วยทศนิยม (F/D) เป็นบล็อกฮาร์ดแวร์ก้อนใหญ่ที่กินพื้นที่และไฟ — ผู้ออกแบบชิปจึง \"เลือกใส่เฉพาะที่จำเป็น\" ไมโครคอนโทรลเลอร์ในเครื่องซักผ้าอาจเอาแค่ RV32I เปล่า ๆ ส่วน CPU ในเซิร์ฟเวอร์ใส่ครบ M/F/D/A ขาดความรู้นี้ไม่ได้ เพราะมันคือจุดที่ \"ชุดคำสั่ง\" กับ\"วงจรจริง\" มาบรรจบกัน และเป็นเหตุผลว่าทำไมโปรแกรมเดียวกันรันได้บนชิปหนึ่งแต่เจอ illegal instruction บนอีกชิป"}]}, {"title": "10.4 Little-Endian, การกำหนดที่อยู่ และตัวอย่างเขียนใหม่", "body": "", "blocks": [{"type": "subheading", "content": "หน้า 1 — โมเดลหน่วยความจำ: LC-3 vs RV32I"}, {"type": "note", "content": "สิ่งแรกที่ต้องปรับมุมมองเมื่อข้ามจาก LC-3 มาสู่ RISC-V RV32I คือ โมเดลหน่วยความจำ (memory model) ว่า \"หนึ่งที่อยู่ (address) ชี้ไปที่อะไร\"."}, {"type": "note", "content": "ทำไมต้องรู้ + CPU ใช้ยังไง\nโมเดลหน่วยความจำและ addressing mode คือหน้าตาจริงของสายไฟที่ต่อระหว่าง CPU กับ RAM ทุกครั้งที่รันคำสั่ง lw/sw วงจร address generation ใน datapath จะบวก base register กับ offset แล้วส่งค่าออก address bus การที่ RV32I เป็น byte-addressable ทำให้ต้องบวกทีละ 4 เพื่อเดินอาเรย์ word และต้องมีวงจรเลือกขนาด (byte/halfword/word) พร้อมตรรกะ sign/zero extend ก่อนเขียนลงรีจิสเตอร์ ส่วน endianness กำหนดว่าฮาร์ดแวร์วางบิตของ word ลงในแต่ละ byte ของหน่วยความจำอย่างไร ถ้าเข้าใจผิดจะอ่านค่าสลับหัวท้ายทันที เรื่องนี้จึงขาดไม่ได้เพราะทุกการเข้าถึงข้อมูลใน CPU ต้องผ่านกลไกนี้"}, {"type": "subheading", "content": "Word-addressable (LC-3) เทียบ Byte-addressable (RV32I)"}, {"type": "note", "content": "• LC-3 เป็น word-addressable: หนึ่งที่อยู่ชี้ไปยังหนึ่ง word ขนาด 16 บิต. การเพิ่มที่อยู่ทีละ 1 (address + 1) คือการเลื่อนไปอีก 1 word เต็ม ๆ. LC-3 จึงไม่มีแนวคิดของการอ่าน \"ครึ่ง word\" หรือ \"ทีละ byte\" ในระดับ ISA พื้นฐาน.\n• RV32I เป็น byte-addressable: หนึ่งที่อยู่ชี้ไปยังหนึ่ง byte (8 บิต). หนึ่ง word ขนาด 32 บิต = 4 byte ดังนั้น word ที่อยู่ติดกันจะห่างกัน 4 (เช่น 0x1000, 0x1004, 0x1008 ...). การเดินผ่านอาเรย์ของ word จึงบวกที่อยู่ทีละ 4 ไม่ใช่ทีละ 1."}, {"type": "note", "content": "เหตุผลที่ byte-addressable ชนะในโลกจริง\nโปรแกรมจริงต้องจัดการข้อมูลหลายขนาด ทั้งตัวอักษร (1 byte), จำนวนเต็มสั้น (2 byte) และ word (4 byte). การกำหนดที่อยู่ทีละ byte ทำให้เข้าถึงข้อมูลแต่ละขนาดได้ตรง ๆ โดยไม่ต้องแกะบิตเอง ซึ่ง LC-3 ในฐานะ ISA เพื่อการสอนเลือกความเรียบง่ายแทน."}, {"type": "subheading", "content": "คำสั่งโหลด/เก็บแยกตามขนาดใน RV32I"}, {"type": "note", "content": "เพราะเข้าถึงทีละ byte ได้ RV32I จึงมีคำสั่ง load/store หลายขนาด แทนที่จะมี LD/ST อย่างเดียวแบบ LC-3:\n\n• lw / sw — load/store word (4 byte)\n• lh / lhu / sh — load/store halfword (2 byte); lh ขยายเครื่องหมาย (sign-extend), lhu ขยายด้วยศูนย์ (zero-extend)\n• lb / lbu / sb — load/store byte (1 byte); lb sign-extend, lbu zero-extend\n\nคำสั่งโหลดที่ดึงข้อมูลขนาดเล็กกว่า 32 บิตเข้ามาเก็บใน register ขนาด 32 บิตเสมอ จึงต้องเลือกว่าจะ \"ขยายเครื่องหมาย\" หรือ \"ขยายด้วยศูนย์\" — จุดนี้ไม่มีใน LC-3 เพราะทุกอย่างเป็น 16 บิตเท่ากันหมด."}, {"type": "subheading", "content": "รูปแบบการกำหนดที่อยู่ (addressing mode): base + offset"}, {"type": "note", "content": "การเข้าถึงหน่วยความจำหลักของ RV32I ใช้รูปแบบ base register + immediate offset เพียงแบบเดียว:"}, {"type": "table", "content": "<pre style=\"font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--navy-deep);color:#EAF1FA;padding:14px 16px;border-radius:6px;border-left:4px solid var(--flag);overflow-x:auto;white-space:pre;\"># RV32I: โหลด word จากที่อยู่ (x10 + 8) มาไว้ที่ x5\nlw   x5, 8(x10)\n# เก็บ word จาก x6 ลงที่อยู่ (x10 + 0)\nsw   x6, 0(x10)</pre>"}, {"type": "note", "content": "immediate offset เป็นค่า 12 บิตแบบมีเครื่องหมาย (signed) จึงครอบคลุมช่วงประมาณ -2048 ถึง +2047 byte รอบ ๆ base register. เทียบกับ LC-3 ที่มีโหมด LDR/STR (base + offset6) ซึ่งเป็นแนวคิดเดียวกัน เพียงแต่ offset แคบกว่าและนับเป็น word."}, {"type": "image", "alt": "แผนภาพประกอบ", "src": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABiEAAA5hCAIAAABvVO5KAAAAAXNSR0IArs4c6QAAIABJREFUeJzs3X9MW2e+7/tnRoORwNaBGpLBmQpnophpAjOp3ETCuRLulWLOaWCUxp3ZF7KPQvbdJXsmIdMpaXWBexXQvYGrScjJCWnPhNw9IXd2gs60pNFAek7MH2P+iC2FWmUKSYtzMl0oxUwAF/a1ieSFtOf+ge1lg3/BIk3SvF/qHxgvr/V4/UB9Pnme7/Odv/3tbwIAAAAAAABQ4btPugEAAAAAAAB45pExAQAAAAAAQC0yJgAAAAAAAKhFxgQAAAAAAAC1yJgAAAAAAACgFhkTAAAAAAAA1CJjAgAAAAAAgFpkTAAAAAAAAFCLjAkAAAAAAABqkTEBAAAAAABALTImAAAAAAAAqEXGBAAAAAAAALXImAAAAAAAAKAWGRMAAAAAAA AApDQmAAAAAFIaEwAAAAApjQkAAACAlMYEAAAAQEpjAgAAACClMQEAAACQ0pgAAAAASGlMAAAAAKQ0JgAAAABSGhMAAAAAKY0JAAAAgJTGBAAAAEBKYwIAAAAgpTEBAAAAkNKYAAAAAEhpTAAAAACkNCYAAAAAUhoTAAAAACmNCQAAAICUxgQAAABASmMCAAAAIKUxAQAAAJDSmAAAAABIaUwAAAAApDQmAAAAAFIaEwAAAAApjQkAAACAlMYEAAAAQEpjAgAAACClMQEAAACQ0pgAAAAASGlMAAAAAKQ0JgAAAABSGhMAAAAAKY0JAAAAgJTGBAAAAEBKYwIAAAAgpTEBAAAAkNKYAAAAAEhpTAAAAACkNCYAAAAAUhoTAAAAACmNCQAAAICUxgQAAABASmMCAAAAIKUxAQAAAJDSmAAAAABIaUwAAAAApDQmAAAAAFL/Bczk2ASiKIgQAAAAAElFTkSuQmCC"}, {"type": "subheading", "content": "ลองทำทีละขั้น: คำนวณที่อยู่สมาชิกอาเรย์ word บน RV32I"}, {"type": "note", "content": "ลองทำทีละขั้น: อาเรย์ A ของจำนวนเต็ม 32 บิต เริ่มที่ base address 0x2000 (เก็บใน x10) จงหาที่อยู่ของ A[5] แล้วเขียนคำสั่งโหลดค่านั้นเข้า x5 พร้อมบอกว่าถ้าเผลอคิดแบบ word-addressable (LC-3) จะพลาดอย่างไร"}, {"type": "example", "content": "กดดูวิธีทำทีละขั้น\nขั้น 1) รู้ขนาดสมาชิก\n แต่ละ word = 32 บิต = 4 byte -> ระยะห่างระหว่างสมาชิก = 4 byte\n \nขั้น 2) สูตร byte-addressable\n addr(A[i]) = base + (ขนาดสมาชิกเป็น byte) × i\n = base + 4 × i\n \nขั้น 3) แทนค่า i = 5\n offset = 4 × 5 = 20 byte = 0x14\n addr(A[5]) = 0x2000 + 0x14 = 0x2014\n \nขั้น 4) เขียนเป็นคำสั่งโหลด (base + immediate offset)\n immediate offset 20 อยู่ในช่วง -2048..+2047 จึงใส่ตรง ๆ ได้\n lw x5, 20(x10) # x5 = A[5] (base x10 = 0x2000, offset 20)\n \nเทียบกับดักความคิดแบบ LC-3 (word-addressable):\n ถ้าคิดว่า \"สมาชิกที่ 5 = base + 5\" จะได้ 0x2005 -> ผิด!\n 0x2005 ตกกลางไบต์ของ A[1] (A[1] กิน byte 0x2004..0x2007)\n ต้องคูณ 4 เสมอเพราะ RV32I นับที่อยู่ทีละ byte ไม่ใช่ทีละ word"}, {"type": "subheading", "content": "บันไดตัวอย่าง: มองหน่วยความจำทีละ byte (ง่าย → ยาก)"}, {"type": "note", "content": "RV32I มาตรฐานเป็น little-endian: เมื่อค่า 32 บิตหนึ่งค่าถูกเก็บลงหน่วยความจำ 4 ช่อง กติกามี 3 ขั้นคงที่:\n\n1. หั่นค่าใน register ออกเป็น 4 byte — ตั้งแต่ byte ต่ำสุด (least-significant) ไปจนถึง byte สูงสุด (most-significant)\n2. วาง byte ต่ำสุดที่ address ต่ำสุด แล้วไล่ byte ถัดไปลง address ถัดไปทีละ 1\n3. ตอนอ่านกลับให้ทำย้อนทาง: byte ที่ address ต่ำสุดคือ byte ต่ำสุดของค่า"}, {"type": "subheading", "content": "ระดับง่าย: sw หนึ่งครั้ง แล้วส่องรายไบต์"}, {"type": "note", "content": "โจทย์: รัน sw x5, 0(x10) โดย x5 = 0x11223344 และ x10 = 0x1000 — หน่วยความจำ 4 ช่องตั้งแต่ 0x1000 จะเก็บ byte อะไรบ้าง. ลองวาดตาราง address กับ byte เองก่อนแล้วค่อยเปิดเฉลย"}, {"type": "example", "content": "กดดูวิธีทำทีละขั้น\nขั้น 1) หั่น 0x11223344 เป็น 4 byte\n จากซ้าย (สูงสุด) → ขวา (ต่ำสุด): 0x11, 0x22, 0x33, 0x44\n \nขั้น 2) little-endian → byte ต่ำสุด 0x44 ลงที่ address ต่ำสุด 0x1000\n \nขั้น 3) ไล่ byte ที่เหลือขึ้นทีละ address:\n 0x1000 ← 0x44\n 0x1001 ← 0x33\n 0x1002 ← 0x22\n 0x1003 ← 0x11"}, {"type": "table", "content": "<table>\n<thead>\n<tr><th>address</th><th>byte ที่เก็บ</th><th>หมายเหตุ</th></tr>\n</thead>\n<tbody>\n<tr><td>0x1000</td><td>0x44</td><td>least-significant byte</td></tr>\n<tr><td>0x1001</td><td>0x33</td><td></td></tr>\n<tr><td>0x1002</td><td>0x22</td><td></td></tr>\n<tr><td>0x1003</td><td>0x11</td><td>most-significant byte</td></tr>\n</tbody>\n</table>"}, {"type": "note", "content": "ข้อสังเกต: เราเขียนเลขฐานสิบหกโดยเห็น 0x11 ก่อนตามสายตา แต่ byte 0x11 กลับไปอยู่ address สูงสุด — ผังหน่วยความจำ little-endian จึงดู \"กลับหัว\" เมื่อเทียบกับลำดับบนกระดาษ"}, {"type": "subheading", "content": "ระดับกลาง: lb กับ lbu อ่าน byte เดียวกัน ได้คนละค่า"}, {"type": "note", "content": "โจทย์: หน่วยความจำที่ 0x1000 เก็บ byte 0xFF รัน lb x5, 0(x10) และ lbu x6, 0(x10) โดย x10 = 0x1000 — x5 กับ x6 เป็นเท่าใดในฐานสิบ. ทายก่อนว่าสองคำสั่งนี้ให้ค่าเท่ากันหรือไม่"}, {"type": "example", "content": "กดดูวิธีทำทีละขั้น\nขั้น 1) อ่าน byte จากหน่วยความจำ: ได้ 0xFF = 1111 1111 (ฐานสอง 8 บิต)\n \nขั้น 2) lb ทำ sign-extend 8 → 32 บิต:\n 2.1 ดูบิตสูงสุดของ byte (บิต 7): เป็น 1 → ตีความว่าติดลบ\n 2.2 คัดลอกบิต 1 ไปเติมบิต 8..31 ทั้งหมด\n 2.3 ได้ x5 = 0xFFFFFFFF = -1 (two's complement 32 บิต)\n ตรวจทาน: 0xFF แบบ 8 บิตมีเครื่องหมาย = 255 - 256 = -1 → ตรงกัน\n \nขั้น 3) lbu ทำ zero-extend 8 → 32 บิต:\n 3.1 เติม 0 ลงบิต 8..31 ทั้งหมด\n 3.2 ได้ x6 = 0x000000FF = 255"}, {"type": "note", "content": "ข้อสังเกต: byte ในหน่วยความจำเป็นก้อนบิตเฉย ๆ ไม่มีเครื่องหมายติดตัว — คำสั่งโหลดต่างหากที่เลือกการตีความ จึงได้ x5 = -1 แต่ x6 = 255 จาก byte เดียวกัน"}, {"type": "subheading", "content": "ระดับกลาง: lh กับ lhu ที่ offset 2"}, {"type": "note", "content": "โจทย์: เก็บ x5 = 0xABCD1234 ด้วย sw x5, 0(x10) โดย x10 = 0x1000 แล้วรัน lh x6, 2(x10) และ lhu x7, 2(x10) — ได้ค่าเท่าใด. เริ่มจากวาดผังรายไบต์ก่อนเสมอ"}, {"type": "example", "content": "กดดูวิธีทำทีละขั้น\nขั้น 1) วางผังรายไบต์ของ 0xABCD1234 (little-endian):\n 0x1000 ← 0x34 0x1001 ← 0x12 0x1002 ← 0xCD 0x1003 ← 0xAB\n \nขั้น 2) offset 2 → halfword คือ byte คู่ 0x1002..0x1003\n byte ต่ำ (address 0x1002) = 0xCD, byte สูง (address 0x1003) = 0xAB\n ประกอบกลับตามกติกา little-endian: halfword = 0xABCD\n \nขั้น 3) lh ทำ sign-extend 16 → 32 บิต:\n บิต 15 ของ 0xABCD = 1 (เพราะ 0xA = 1010) → ติดลบ\n x6 = 0xFFFFABCD = -21555\n ตรวจทาน: 0xABCD = 43981; 43981 - 65536 = -21555 → ตรงกัน\n \nขั้น 4) lhu ทำ zero-extend: x7 = 0x0000ABCD = 43981"}, {"type": "note", "content": "ข้อสังเกต: halfword ก็ยึด little-endian ภายในตัวเอง (byte ต่ำอยู่ address ต่ำ) และ offset 2 หาร 2 ลงตัว จึงเป็นการเข้าถึงแบบ aligned"}, {"type": "subheading", "content": "ระดับยาก: โจทย์ย้อนกลับจาก byte dump"}, {"type": "note", "content": "โจทย์: debugger แสดง byte dump 4 ช่องเรียงตาม address ดังนี้ — 0x2000: 78 56 34 12 (ก) รัน lw x5, 0(x10) โดย x10 = 0x2000 บนเครื่อง little-endian ได้ค่าใด (ข) ถ้า byte ในหน่วยความจำเหมือนเดิมทุกช่อง แต่เครื่องเป็น big-endian จะได้ค่าใด. ลองประกอบ word เองทั้งสองแบบก่อนเปิดเฉลย"}, {"type": "example", "content": "กดดูวิธีทำทีละขั้น\n(ก) little-endian: byte ที่ address ต่ำสุดคือ byte ต่ำสุดของ word\n ขั้น 1) จด byte พร้อม address:\n 0x2000 = 0x78 0x2001 = 0x56 0x2002 = 0x34 0x2003 = 0x12\n ขั้น 2) ประกอบจาก address สูง → ต่ำ (byte สูงของค่าอยู่ address สูง):\n word = 0x12 0x34 0x56 0x78 → 0x12345678\n ขั้น 3) ฐานสิบ: 0x12345678 = 305419896\n \n(ข) big-endian: byte ที่ address ต่ำสุดคือ byte สูงสุดของ word\n ขั้น 1) ประกอบจาก address ต่ำ → สูง ตรง ๆ ตามที่เห็นใน dump:\n word = 0x78 0x56 0x34 0x12 → 0x78563412\n ขั้น 2) ฐานสิบ: 0x78563412 = 2018915346"}, {"type": "table", "content": "<table>\n<thead>\n<tr><th>กติกาเครื่อง</th><th>วิธีประกอบจาก dump</th><th>ค่า word ที่ lw ได้</th></tr>\n</thead>\n<tbody>\n<tr><td>little-endian</td><td>byte ที่ address ต่ำ = byte ต่ำของค่า</td><td>0x12345678</td></tr>\n<tr><td>big-endian</td><td>byte ที่ address ต่ำ = byte สูงของค่า</td><td>0x78563412</td></tr>\n</tbody>\n</table>"}, {"type": "note", "content": "ข้อสังเกต: byte ชุดเดียวกันแท้ ๆ ให้ word คนละค่า — การส่งข้อมูล binary ข้ามเครื่องต่างตระกูลจึงต้องตกลง endianness กันก่อนเสมอ"}, {"type": "subheading", "content": "PC-relative addressing"}, {"type": "note", "content": "ทั้งสอง ISA ใช้ที่อยู่อ้างอิงกับ PC (PC-relative) สำหรับการกระโดด/กระโดดมีเงื่อนไข เพื่อให้โค้ดย้ายที่อยู่ได้ (position-independent) และ encode ระยะกระโดดด้วยบิตน้อย:\n\n• LC-3: BR, JSR, LD, LDI, LEA ใช้ PCoffset9/PCoffset11 บวกเข้ากับ PC ที่ชี้คำสั่งถัดไป.\n• RV32I: คำสั่ง branch (beq, bne, blt, bge, ...) และ jal ใช้ offset ที่บวกกับ ที่อยู่ของคำสั่ง branch เอง (ไม่ใช่ PC+4) เพื่อคำนวณเป้าหมาย. นอกจากนี้ auipc (add upper immediate to PC) ใช้สร้างที่อยู่แบบ PC-relative ช่วงไกล สำหรับเข้าถึงข้อมูลหรือกระโดดไกลคู่กับ jalr.\n\nหลักการสำคัญที่ต้องจำคือ offset ของ branch/jal ใน RV32I เป็นหน่วย byte และ encode เป็นพหุคูณของ 2 (เพราะคำสั่งต้อง align), ส่วนเป้าหมายคิดจากที่อยู่ของคำสั่งกระโดดเอง — ต่างจาก LC-3 ที่บวกกับ \"PC ที่ชี้คำสั่งถัดไปแล้ว\"."}, {"type": "diagram", "layout": "flow", "title": "Little-Endian: การจัดเรียงไบต์ในหน่วยความจำ", "actors": ["ค่า 32-bit", "Byte 0 (ต่ำสุด)\nที่อยู่ต่ำสุด", "Byte 1", "Byte 2", "Byte 3 (สูงสุด)\nที่อยู่สูงสุด"], "steps": [{"from": 0, "to": 1, "label": "ไบต์ที่มีค่าน้อยที่สุดเก็บที่ address ต่ำสุด", "note": ""}, {"from": 1, "to": 2, "label": "เรียงไบต์ถัดไปตามลำดับ", "note": ""}, {"from": 2, "to": 3, "label": "...", "note": ""}, {"from": 3, "to": 4, "label": "ไบต์นัยสำคัญสูงสุดอยู่ address สูงสุด", "note": ""}]}]}, {"title": "10.4 (ต่อ) Little-Endian, ตัวอย่างเขียนใหม่ และเกริ่นโปรเจกต์ปลายภาค", "body": "", "blocks": [{"type": "subheading", "content": "Little-Endian: byte เรียงอย่างไรในหน่วยความจำ"}, {"type": "note", "content": "ทำไมต้องรู้ + CPU ใช้ยังไง\nหน่วยความจำจริงเก็บทีละ byte และมี address เป็นเลข byte ทุกครั้งที่ CPU รัน sw/lw/lbu วงจร load-store จริงต้องรู้ว่าจะวาง byte ไหนไว้ที่ address ใด endianness คือกฎที่ฮาร์ดแวร์ใช้เชื่อมค่าใน register 32 บิตกับ 4 ช่อง byte ในหน่วยความจำ ขาดไม่ได้เพราะถ้าออกแบบ CPU ในโปรเจกต์แล้ววาง byte ผิดลำดับ การอ่านกลับด้วยขนาดต่างกัน (เช่นเขียนเป็น word แต่อ่านเป็น byte) จะได้ค่าผิดทันที และโปรแกรมทดสอบอย่างลูปบวกอาเรย์จะพัง แม้เลขคณิตในระดับ word จะดูถูกก็ตาม"}, {"type": "note", "content": "เมื่อ word มีหลาย byte (RV32I word = 4 byte) ต้องตกลงว่า byte ตัวไหนเก็บที่ address ต่ำสุด. RV32I มาตรฐานเป็น little-endian: byte ที่มีนัยสำคัญน้อยที่สุด (least-significant byte) เก็บที่ address ต่ำสุด.\n\nสมมติ register เก็บค่า word 0x11223344 แล้ว sw ลงที่ address A:"}, {"type": "table", "content": "<pre style=\"font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--navy-deep);color:#EAF1FA;padding:14px 16px;border-radius:6px;border-left:4px solid var(--flag);overflow-x:auto;white-space:pre;\">ค่าในรีจิสเตอร์ : 0x11223344  (11 = byte สูงสุด, 44 = byte ต่ำสุด)\n\nที่อยู่ (little-endian):\n  A+0 :  0x44   ← least-significant byte ที่ address ต่ำสุด\n  A+1 :  0x33\n  A+2 :  0x22\n  A+3 :  0x11   ← most-significant byte ที่ address สูงสุด</pre>"}, {"type": "note", "content": "ผลที่ตามมาในทางปฏิบัติ: ถ้าเก็บค่า 0x11223344 ด้วย sw แล้วอ่านกลับด้วย lbu ที่ A+0 จะได้ 0x44 ไม่ใช่ 0x11. ประเด็น endianness สำคัญเฉพาะเมื่อเข้าถึงข้อมูลก้อนเดียวกัน \"ด้วยขนาดต่างกัน\" หรือส่งข้อมูลข้ามเครื่อง ไม่กระทบเลขคณิตปกติที่อ่าน/เขียนเป็น word เต็มทั้งคู่.\n\nLC-3 ไม่มีประเด็นนี้ เพราะ word ขนาด 16 บิตเป็นหน่วยที่อยู่เดียวที่เล็กที่สุด — ไม่มีการแยก byte ในระดับที่อยู่."}, {"type": "example", "content": "ทายก่อนดู: เก็บ 0x000000FF ด้วย sw ที่ address A แล้ว lbu จาก A+0 และ A+3 ได้ค่าใด\nA+0 ได้ 0xFF (least-significant byte อยู่ address ต่ำสุดในระบบ little-endian), ส่วน A+3 ได้ 0x00 (most-significant byte)."}, {"type": "subheading", "content": "ขั้นตอนแปลโปรแกรม LC-3 → RV32I อย่างเป็นระบบ (5 ขั้น)"}, {"type": "note", "content": "การแปลทีละบรรทัดแบบตามใจมักหลุดเรื่อง offset หรือ condition code ให้เดินตามขั้นตอนคงที่ 5 ขั้นนี้ทุกครั้ง:\n\n1. แมปตัวแปร → รีจิสเตอร์: ทำตารางก่อนว่ารีจิสเตอร์ LC-3 แต่ละตัวถือค่าอะไร แล้วจับคู่กับรีจิสเตอร์ RV32I ให้ครบก่อนแปลโค้ดแม้แต่บรรทัดเดียว\n2. แปลงคำสั่งเข้าถึงหน่วยความจำ (offset × 4): LDR/STR → lw/sw โดยคูณ offset ด้วย 4 เพราะ LC-3 นับ offset เป็น word แต่ RV32I นับเป็น byte — รวมถึงการเลื่อนตัวชี้ +1 ต้องกลายเป็น +4\n3. แปลง branch: LC-3 กระโดดตาม condition code (N/Z/P) ที่คำสั่งก่อนหน้าตั้งไว้ แต่ RV32I เปรียบเทียบรีจิสเตอร์คู่หนึ่งในตัวคำสั่ง branch เอง — ต้องหาว่า condition code นั้นมาจากรีจิสเตอร์ตัวไหน แล้วเขียนการเปรียบเทียบให้ชัด (บ่อยครั้งคือเทียบกับ x0)\n4. แปลง call/return: JSR label → jal x1, label (ที่อยู่ย้อนกลับไปอยู่ x1 แทน R7) และ RET → jalr x0, 0(x1)\n5. ตรวจด้วย trace: เลือกข้อมูลทดสอบเล็ก ๆ เดินโปรแกรมทั้งสองเวอร์ชันเทียบค่าทุกตัวแปรทุกรอบ — ค่าตรงกันทุกจุดตรวจจึงถือว่าแปลเสร็จ"}, {"type": "subheading", "content": "ระดับง่าย: แปลคำสั่งเข้าถึงหน่วยความจำหนึ่งบรรทัด (ฝึกขั้น 2)"}, {"type": "note", "content": "โจทย์: แปล LDR R4, R2, #3 ของ LC-3 (R2 เป็น base ของอาเรย์ word) เป็น RV32I โดยกำหนดแมป R4 → x14 และ R2 → x12. ลองคิด offset เป็น byte ก่อนเปิดเฉลย"}, {"type": "example", "content": "กดดูวิธีทำทีละขั้น\nขั้น 1) ใช้ตารางแมป: R4 → x14, R2 → x12\n \nขั้น 2) แปลง offset: LC-3 นับเป็น word → 3 word\n RV32I นับเป็น byte → 3 × 4 = 12 byte\n \nขั้น 3) เขียนคำสั่ง: lw x14, 12(x12)\n ตรวจช่วง immediate: 12 อยู่ในช่วง -2048..+2047 → ใส่ตรง ๆ ได้"}, {"type": "note", "content": "ข้อสังเกต: ตัวเลข offset ห้ามยกข้ามมาทั้งดุ้น — ข้อมูลชนิด word ต้องคูณ 4 เสมอ"}, {"type": "subheading", "content": "ระดับกลาง: แปลง branch ที่พึ่ง condition code (ฝึกขั้น 3)"}, {"type": "note", "content": "โจทย์: แปลท่อน LC-3 สองบรรทัดนี้ (วนกลับเมื่อ R2 ยังเป็นบวก) เป็น RV32I โดยแมป R2 → x11"}, {"type": "table", "content": "<pre style=\"font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--navy-deep);color:#EAF1FA;padding:14px 16px;border-radius:6px;border-left:4px solid var(--flag);overflow-x:auto;white-space:pre;\">        ADD R2, R2, #-1     ; ตั้ง condition code จากผลลัพธ์\n        BRp LOOP            ; กระโดดเมื่อผลลัพธ์ล่าสุดเป็นบวก</pre>"}, {"type": "note", "content": "ตัวช่วยคิด: BRp ดู \"ผลของคำสั่งก่อนหน้า\" แต่ RV32I ต้องระบุเองว่าเทียบรีจิสเตอร์ตัวไหนกับตัวไหน"}, {"type": "example", "content": "กดดูวิธีทำทีละขั้น\nขั้น 1) หาที่มาของ condition code: ADD เขียนผลลง R2 → เงื่อนไข p คือ \"R2 เป็นบวก\"\n \nขั้น 2) เขียนเงื่อนไขเป็นการเปรียบเทียบรีจิสเตอร์:\n R2 เป็นบวก ↔ x11 มากกว่า 0 ↔ x0 น้อยกว่า x11 (แบบมีเครื่องหมาย)\n \nขั้น 3) เลือกคำสั่ง branch: blt กระโดดเมื่อ operand แรกน้อยกว่า operand ที่สอง\n addi x11, x11, -1\n blt x0, x11, loop # กระโดดเมื่อ 0 น้อยกว่า x11 คือ x11 ยังเป็นบวก"}, {"type": "note", "content": "ข้อสังเกต: ใน RV32I การลบหนึ่งกับการตัดสินใจกระโดดเป็นคนละคำสั่งกันชัดเจน ไม่มี condition code แอบส่งข้อมูลให้กัน"}, {"type": "subheading", "content": "ตัวอย่างเขียนใหม่: บวกสมาชิกอาเรย์ด้วยลูป (LC-3 → RV32I)"}, {"type": "note", "content": "โจทย์: มีอาเรย์จำนวนเต็ม N ตัว ต้องการผลรวม (sum) ของสมาชิกทุกตัว. เปรียบเทียบแบบ side-by-side. นี่คือระดับยากของบันได — เราจะเดินครบทั้ง 5 ขั้นกับโปรแกรมนี้ ตั้งแต่แมปรีจิสเตอร์จนถึงตรวจด้วย trace.\n\nฝั่ง LC-3 — base address ใน R1, ตัวนับ N ใน R2, ผลรวมใน R0. เดินตัวชี้ทีละ 1 (word-addressable):"}, {"type": "table", "content": "<pre style=\"font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--navy-deep);color:#EAF1FA;padding:14px 16px;border-radius:6px;border-left:4px solid var(--flag);overflow-x:auto;white-space:pre;\">; LC-3: sum = ผลรวมของอาเรย์ N ตัว\n; R1 = ที่อยู่ฐานของอาเรย์, R2 = N (จำนวนตัว), R0 = ผลรวม\n        AND R0, R0, #0      ; R0 ← 0 (เคลียร์ผลรวม)\n        ADD R2, R2, #0      ; ตั้ง condition code จาก R2 (ตัวนับ) ก่อนเข้าลูป\nLOOP    BRz DONE            ; ถ้า R2 == 0 จบลูป\n        LDR R3, R1, #0      ; R3 ← Mem[R1]  (อ่านสมาชิกปัจจุบัน)\n        ADD R0, R0, R3      ; R0 ← R0 + R3\n        ADD R1, R1, #1      ; เลื่อนตัวชี้ +1 word (word-addressable)\n        ADD R2, R2, #-1     ; R2 ← R2 - 1\n        BRnzp LOOP          ; วนกลับ\nDONE    HALT</pre>"}, {"type": "note", "content": "ฝั่ง RV32I — base ใน x10, N ใน x11, ผลรวมใน x12. เดินตัวชี้ทีละ 4 byte (byte-addressable, word = 4 byte):"}, {"type": "table", "content": "<pre style=\"font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--navy-deep);color:#EAF1FA;padding:14px 16px;border-radius:6px;border-left:4px solid var(--flag);overflow-x:auto;white-space:pre;\"># RV32I: sum = ผลรวมของอาเรย์ N ตัว\n# x10 = ที่อยู่ฐานของอาเรย์, x11 = N, x12 = ผลรวม\n        addi x12, x0, 0      # x12 ← 0 (เคลียร์ผลรวม)\nloop:   beq  x11, x0, done   # ถ้า N == 0 จบลูป\n        lw   x13, 0(x10)     # x13 ← Mem[x10] (อ่าน word ปัจจุบัน)\n        add  x12, x12, x13   # x12 ← x12 + x13\n        addi x10, x10, 4     # เลื่อนตัวชี้ +4 byte (= 1 word)\n        addi x11, x11, -1    # N ← N - 1\n        jal  x0, loop        # วนกลับ (กระโดดไม่เก็บที่อยู่ย้อนกลับ)\ndone:   # ผลรวมอยู่ใน x12</pre>"}, {"type": "subheading", "content": "เดินตามขั้นทั้ง 5 กับโปรแกรมนี้"}, {"type": "note", "content": "ขั้น 1 — แมปตัวแปร → รีจิสเตอร์ (ทำก่อนแปลทุกบรรทัด):"}, {"type": "table", "content": "<table>\n<thead>\n<tr><th>ความหมายของตัวแปร</th><th>LC-3</th><th>RV32I</th></tr>\n</thead>\n<tbody>\n<tr><td>ผลรวม (sum)</td><td>R0</td><td>x12</td></tr>\n<tr><td>ตัวชี้อาเรย์ (base)</td><td>R1</td><td>x10</td></tr>\n<tr><td>ตัวนับ N</td><td>R2</td><td>x11</td></tr>\n<tr><td>ค่าสมาชิกชั่วคราว</td><td>R3</td><td>x13</td></tr>\n</tbody>\n</table>"}, {"type": "note", "content": "ขั้น 2 — แปลงคำสั่งเข้าถึงหน่วยความจำ (offset × 4):"}, {"type": "table", "content": "<table>\n<thead>\n<tr><th>LC-3</th><th>RV32I</th><th>เหตุผล</th></tr>\n</thead>\n<tbody>\n<tr><td><code>LDR R3, R1, #0</code></td><td><code>lw x13, 0(x10)</code></td><td>offset 0 word = 0 × 4 = 0 byte</td></tr>\n<tr><td><code>ADD R1, R1, #1</code></td><td><code>addi x10, x10, 4</code></td><td>เลื่อนตัวชี้ 1 word = 4 byte</td></tr>\n</tbody>\n</table>"}, {"type": "note", "content": "ขั้น 3 — แปลง branch:"}, {"type": "table", "content": "<table>\n<thead>\n<tr><th>LC-3</th><th>RV32I</th><th>เหตุผล</th></tr>\n</thead>\n<tbody>\n<tr><td><code>BRz DONE</code></td><td><code>beq x11, x0, done</code></td><td>เงื่อนไข z มาจากคำสั่งที่แตะ R2 (ตัวนับ) → เทียบ x11 กับ x0 ตรง ๆ</td></tr>\n<tr><td><code>BRnzp LOOP</code></td><td><code>jal x0, loop</code></td><td>กระโดดเสมอ ไม่ต้องเก็บที่อยู่ย้อนกลับ จึงทิ้งลง x0</td></tr>\n</tbody>\n</table>"}, {"type": "note", "content": "ขั้น 4 — แปลง call/return: โปรแกรมนี้ไม่มี JSR/RET จึงไม่มีอะไรต้องแปลงในขั้นนี้ (ถ้ามี ให้ใช้กติกา JSR label → jal x1, label และ RET → jalr x0, 0(x1))\n\nขั้น 5 — ตรวจด้วย trace: ใช้ข้อมูลทดสอบอาเรย์ [10, 20, 30] ที่ base 0x2000 และ N = 3 จดค่ารีจิสเตอร์และเหตุการณ์หน่วยความจำทุกสิ้นรอบของลูป:"}, {"type": "table", "content": "<table>\n<thead>\n<tr><th>จุดตรวจ</th><th>x10 (ตัวชี้)</th><th>x11 (N)</th><th>x12 (sum)</th><th>x13 (ค่าที่โหลด)</th><th>เหตุการณ์หน่วยความจำในรอบ</th></tr>\n</thead>\n<tbody>\n<tr><td>ก่อนเข้าลูป</td><td>0x2000</td><td>3</td><td>0</td><td>—</td><td>—</td></tr>\n<tr><td>จบรอบ 1</td><td>0x2004</td><td>2</td><td>10</td><td>10</td><td>อ่าน Mem[0x2000] = 10</td></tr>\n<tr><td>จบรอบ 2</td><td>0x2008</td><td>1</td><td>30</td><td>20</td><td>อ่าน Mem[0x2004] = 20</td></tr>\n<tr><td>จบรอบ 3</td><td>0x200C</td><td>0</td><td>60</td><td>30</td><td>อ่าน Mem[0x2008] = 30</td></tr>\n</tbody>\n</table>"}, {"type": "note", "content": "พอเข้ารอบ 4 คำสั่ง beq x11, x0, done เห็น x11 = 0 จึงกระโดดออก ได้ x12 = 60 ตรงกับ 10 + 20 + 30 — เดินฝั่ง LC-3 ด้วยข้อมูลเดียวกันก็ต้องจบที่ R0 = 60 เช่นกัน ถ้าไม่ตรงแปลว่าพลาดขั้นใดขั้นหนึ่ง. อยากไล่รายคำสั่งเต็ม ๆ ให้ทำโจทย์ trace ต่อไปนี้\n\nลองทำทีละขั้น: ให้อาเรย์อยู่ที่ base x10 = 0x2000 มีสมาชิก 3 ตัวคือ [10, 20, 30] (แต่ละ word = 4 byte) เริ่ม x11 = 3 (N) จง trace ลูป RV32I ข้างบนทีละรอบ ไล่ค่า x10 (ตัวชี้), x11 (N) และ x12 (ผลรวม) จนถึง done"}, {"type": "example", "content": "กดดูวิธีทำทีละขั้น\nเริ่มต้น: x12 = 0 (addi x12, x0, 0)\n x10 = 0x2000 x11 = 3\nMem: [0x2000]=10 [0x2004]=20 [0x2008]=30 (ห่างกัน 4 byte ต่อ word)\n \nรอบ 1: beq x11,x0 → 3 ไม่เท่า 0 → ไม่จบ\n lw x13, 0(x10) → x13 = Mem[0x2000] = 10\n add x12,x12,x13 → x12 = 0 + 10 = 10\n addi x10,x10,4 → x10 = 0x2000 + 4 = 0x2004\n addi x11,x11,-1 → x11 = 3 - 1 = 2\n jal x0, loop → วนกลับ\n \nรอบ 2: beq x11,x0 → 2 ไม่เท่า 0 → ไม่จบ\n lw x13, 0(x10) → x13 = Mem[0x2004] = 20\n add x12,x12,x13 → x12 = 10 + 20 = 30\n addi x10,x10,4 → x10 = 0x2008\n addi x11,x11,-1 → x11 = 1\n jal x0, loop\n \nรอบ 3: beq x11,x0 → 1 ไม่เท่า 0 → ไม่จบ\n lw x13, 0(x10) → x13 = Mem[0x2008] = 30\n add x12,x12,x13 → x12 = 30 + 30 = 60\n addi x10,x10,4 → x10 = 0x200C\n addi x11,x11,-1 → x11 = 0\n jal x0, loop\n \nรอบ 4: beq x11,x0 → 0 เท่ากับ 0 → กระโดดไป done\ndone: ผลรวม x12 = 60 (= 10+20+30 ✓)"}, {"type": "note", "content": "จุดที่ต่างกันชัดเจน\n(1) LC-3 เดินตัวชี้ ADD R1,R1,#1 แต่ RV32I เดิน addi x10,x10,4 เพราะ word ห่างกัน 4 byte. (2) เคลียร์ค่าศูนย์: LC-3 ใช้ AND Rx,Rx,#0 ส่วน RV32I ใช้ addi xN,x0,0 โดยอาศัย x0 ที่เป็นศูนย์เสมอ. (3) การวนลูปไม่มีเงื่อนไขใน RV32I ใช้ jal x0,loop (ทิ้ง return address ไว้ที่ x0)."}, {"type": "image", "alt": "แผนภาพประกอบ", "src": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABvwAAAXECAIAAACObT4UAAAAAXNSR0IArs4c6QAAIABJREFUeJzs3W9w1OeB4PkH22oykUgsiYkEQWsO3RqUNaLqBLOHZi/WZg8lGcOWiaeMje3FxhmMXQFPBZwq7NwZXhiqxjCVgDcmrpizx4m9uNbGd8E3F9jdiBcrba3FViF7B8yUWDzCgCYGzYwkx2plzL1o1BIgJCG11N1Pfz7lSvWv9evuh1bKzHzz/Jl26dKlAAAAAAAQi5uyPQAAAAAAgEwSPQEAAACAqIieAAAAAEBURE8AAAAAICqiJwAAAAAQFdETAAAAAI function renderTOC(){
  const toc = document.getElementById("tocList");
  toc.innerHTML = "";
  SECTIONS.forEach((sec, idx)=>{
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = "#section_"+idx;
    const hasDiagram = (sec.blocks||[]).some(function(b){ return b.type === "diagram"; });
    a.textContent = (hasDiagram ? "🔀 " : "") + sec.title;
    a.dataset.idx = idx;
    li.appendChild(a);
    toc.appendChild(li);
  });
}

function setupTocPanel(){
  const panel = document.getElementById("tocPanel");
  if(panel && window.matchMedia("(max-width:800px)").matches){
    panel.removeAttribute("open");
  }
}

function escapeXml(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function mdFormat(s){
  let t = escapeXml(s);
  t = t.replace(/`([^`\n]+?)`/g, "<code>$1</code>");
  t = t.replace(/\*\*([^*\n]+?)\*\*/g, "<strong>$1</strong>");
  return t;
}
function computeReadingTime(){
  const main = document.getElementById("mainArea");
  const chars = (main.textContent || "").replace(/\s+/g, "").length;
  return Math.max(1, Math.round(chars / 900));
}
function fmtTspans(text, x){
  return String(text==null?"":text).split("\n").map(function(line,i){
    return '<tspan x="'+x+'" dy="'+(i===0?0:15)+'">'+escapeXml(line)+'</tspan>';
  }).join("");
}

function renderDiagramBlock(block, secIdx, blockIdx){
  const uid = "dg_"+secIdx+"_"+blockIdx;
  const layout = block.layout || "lifeline";
  const actors = block.actors || [];
  const steps = block.steps || [];
  const n = actors.length;
  const W = 680;
  const margin = 76;
  const nodesX = [];
  for(let i=0;i<n;i++){ nodesX.push(n===1 ? W/2 : margin + i*((W-2*margin)/Math.max(1,n-1))); }
  let inner = "";
  let H = 0;

  if(layout === "flow"){
    const boxY = 50, boxH = 46;
    const boxW = Math.min(128, Math.max(70,(W-2*margin)/Math.max(1,n-1)-14));
    H = 168;
    actors.forEach(function(a,i){
      inner += '<rect class="diagram-node-box" x="'+(nodesX[i]-boxW/2)+'" y="'+boxY+'" width="'+boxW+'" height="'+boxH+'" rx="7"></rect>';
      inner += '<text class="diagram-actor-label" x="'+nodesX[i]+'" y="'+(boxY+boxH/2-6)+'" text-anchor="middle">'+fmtTspans(a, nodesX[i])+'</text>';
    });
    steps.forEach(function(st,i){
      const x1 = nodesX[st.from]+boxW/2+3, x2 = nodesX[st.to]-boxW/2-3;
      const y = boxY+boxH/2;
      const pid = uid+"_p"+i, mid = uid+"_m"+i;
      inner += '<path id="'+pid+'" class="diagram-arrow-path" d="M '+x1+' '+y+' L '+x2+' '+y+'"></path>';
      inner += '<text class="diagram-arrow-label" x="'+((x1+x2)/2)+'" y="'+(boxY-12)+'" text-anchor="middle">'+escapeXml(st.label||"")+'</text>';
      inner += '<circle id="'+mid+'d" class="diagram-glow-dot" r="6.5" cx="'+x1+'" cy="'+y+'">'
             + '<animateMotion id="'+mid+'" begin="indefinite" dur="0.75s" fill="freeze" path="M '+x1+' '+y+' L '+x2+' '+y+'"></animateMotion>'
             + '<animate attributeName="opacity" begin="'+mid+'.begin" dur="0.05s" from="0" to="1" fill="freeze"></animate>'
             + '<animate attributeName="opacity" begin="'+mid+'.end" dur="0.5s" from="1" to="0" fill="freeze"></animate>'
             + '</circle>';
    });
  } else {
    const rowH = 64, topY = 12, boxH = 38;
    H = topY + boxH + steps.length*rowH + 26;
    const boxW = Math.min(160, Math.max(80,(W-2*margin)/Math.max(1,n-1)-10));
    actors.forEach(function(a,i){
      inner += '<rect class="diagram-node-box" x="'+(nodesX[i]-boxW/2)+'" y="'+topY+'" width="'+boxW+'" height="'+boxH+'" rx="7"></rect>';
      inner += '<text class="diagram-actor-label" x="'+nodesX[i]+'" y="'+(topY+boxH/2-6)+'" text-anchor="middle">'+fmtTspans(a, nodesX[i])+'</text>';
      inner += '<line class="diagram-lifeline" x1="'+nodesX[i]+'" y1="'+(topY+boxH)+'" x2="'+nodesX[i]+'" y2="'+(H-8)+'"></line>';
    });
    steps.forEach(function(st,i){
      const y = topY+boxH+22 + i*rowH;
      const x1 = nodesX[st.from], x2 = nodesX[st.to];
      const pid = uid+"_p"+i, mid = uid+"_m"+i;
      inner += '<path id="'+pid+'" class="diagram-arrow-path" d="M '+x1+' '+y+' L '+x2+' '+y+'"></path>';
      inner += '<text class="diagram-arrow-label" x="'+((x1+x2)/2)+'" y="'+(y-9)+'" text-anchor="middle">'+escapeXml(st.label||"")+'</text>';
      inner += '<circle id="'+mid+'d" class="diagram-glow-dot" r="6.5" cx="'+x1+'" cy="'+y+'">'
             + '<animateMotion id="'+mid+'" begin="indefinite" dur="0.75s" fill="freeze" path="M '+x1+' '+y+' L '+x2+' '+y+'"></animateMotion>'
             + '<animate attributeName="opacity" begin="'+mid+'.begin" dur="0.05s" from="0" to="1" fill="freeze"></animate>'
             + '<animate attributeName="opacity" begin="'+mid+'.end" dur="0.5s" from="1" to="0" fill="freeze"></animate>'
             + '</circle>';
    });
  }

  const svg = '<svg class="diagram-svg" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" preserveAspectRatio="xMidYMid meet">'+inner+'</svg>';

  let stepsHtml = '<ol class="diagram-steps-list">';
  steps.forEach(function(st,i){
    stepsHtml += '<li><span class="step-num">'+(i+1)+'</span><strong>'+escapeXml(st.label||"")+'</strong>'+(st.note?(' — '+escapeXml(st.note)):'')+'</li>';
  });
  stepsHtml += '</ol>';

  return '<div class="diagram-block" id="'+uid+'">'
       + '<h4><span>🔀 '+escapeXml(block.title||"")+'</span><button class="diagram-play-btn" data-diagram-id="'+uid+'">&#9654; เล่นแอนิเมชัน / Play animation</button></h4>'
       + '<div class="diagram-svg-wrap">'+svg+'</div>'
       + stepsHtml
       + '</div>';
}

function diagramPlay(containerId){
  const wrap = document.getElementById(containerId);
  if(!wrap) return;
  const svg = wrap.querySelector('svg');
  const paths = svg.querySelectorAll('.diagram-arrow-path');
  const dots = svg.querySelectorAll('.diagram-glow-dot');
  const items = wrap.querySelectorAll('.diagram-steps-list li');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  items.forEach(function(li){ li.classList.remove('step-active'); });
  if(reduced){ return; }
  const stepDur = 850;
  paths.forEach(function(p){
    const len = p.getTotalLength();
    p.style.transition = 'none';
    p.style.strokeDasharray = len;
    p.style.strokeDashoffset = len;
  });
  void svg.getBoundingClientRect();
  paths.forEach(function(p,i){
    setTimeout(function(){
      p.style.transition = 'stroke-dashoffset '+(stepDur-100)+'ms ease';
      p.style.strokeDashoffset = 0;
      const anim = dots[i] ? dots[i].querySelector('animateMotion') : null;
      if(anim){ try{ anim.beginElement(); }catch(e){} }
      if(items[i]) items[i].classList.add('step-active');
    }, i*stepDur);
  });
}

function wireDiagramButtons(){
  document.querySelectorAll('.diagram-play-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ diagramPlay(btn.dataset.diagramId); });
  });
}

function renderContent(){
  const main = document.getElementById("mainArea");
  main.innerHTML = "";
  SECTIONS.forEach((sec, idx)=>{
    const card = document.createElement("div");
    card.className = "section-card";
    card.id = "section_"+idx;
    let html = "<h2>"+sec.title+"</h2>";
    if(sec.body){
      html += '<div class="body-text">'+mdFormat(sec.body)+'</div>';
    }
    (sec.blocks || []).forEach((block, bi)=>{
      if(block.type === "note"){
        html += '<div class="callout callout-note"><span class="callout-title">หมายเหตุ / Note</span>'+mdFormat(block.content)+'</div>';
      } else if(block.type === "example"){
        html += '<div class="callout callout-example"><span class="callout-title">ตัวอย่าง / Example</span>'+mdFormat(block.content)+'</div>';
      } else if(block.type === "warning"){
        html += '<div class="callout callout-warning"><span class="callout-title">ข้อควรระวัง / Warning</span>'+mdFormat(block.content)+'</div>';
      } else if(block.type === "formula"){
        html += '<div class="callout callout-formula"><span class="callout-title">'+(block.label || "สูตร / Formula")+'</span>'+mdFormat(block.content)+'</div>';
      } else if(block.type === "subheading"){
        html += '<h3>'+mdFormat(block.content)+'</h3>';
      } else if(block.type === "table"){
        html += block.content;
      } else if(block.type === "image"){
        html += '<div class="image-block"><img src="'+block.src+'" alt="'+(block.alt || "")+'" loading="lazy">';
        if(block.caption){
          html += '<div class="image-caption">'+block.caption+'</div>';
        }
        html += '</div>';
      } else if(block.type === "diagram"){
        html += renderDiagramBlock(block, idx, bi);
      }
    });
    card.innerHTML = html;
    main.appendChild(card);
  });

  if(window.renderMathInElement){
    renderMathInElement(main, {
      delimiters: [
        {left: "$$", right: "$$", display: true},
        {left: "$", right: "$", display: false}
      ]
    });
  }
}

function setupScrollSpy(){
  const links = document.querySelectorAll(".toc-list a");
  const sections = document.querySelectorAll(".section-card");
  window.addEventListener("scroll", ()=>{
    let currentIdx = 0;
    sections.forEach((sec, idx)=>{
      const rect = sec.getBoundingClientRect();
      if(rect.top <= 100) currentIdx = idx;
    });
    links.forEach(l=>l.classList.remove("active"));
    if(links[currentIdx]) links[currentIdx].classList.add("active");
  });
}

function setupReveal(){
  const cards = document.querySelectorAll('.section-card');
  if(!('IntersectionObserver' in window)){
    cards.forEach(function(c){ c.classList.add('revealed'); });
    return;
  }
  const io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){ e.target.classList.add('revealed'); io.unobserve(e.target); }
    });
  }, {threshold:0.08, rootMargin:'0px 0px -60px 0px'});
  cards.forEach(function(c){ io.observe(c); });
}

let fontScale = parseFloat(localStorage.getItem('netbook_fontScale')||'1');
function setFontScale(v){
  fontScale = Math.min(1.3, Math.max(0.85, Math.round(v*10)/10));
  try{ localStorage.setItem('netbook_fontScale', fontScale); }catch(e){}
  document.documentElement.style.setProperty('--fontScale', fontScale);
}

function updateProgress(){
  const el = document.documentElement;
  const max = el.scrollHeight - el.clientHeight;
  const pct = max>0 ? (el.scrollTop/max*100) : 0;
  const bar = document.getElementById('readProgress');
  if(bar) bar.style.width = pct+'%';
  const btt = document.getElementById('backToTop');
  if(btt){ if(el.scrollTop>420){ btt.classList.add('show'); } else { btt.classList.remove('show'); } }
}

renderTOC();
renderContent();
setupScrollSpy();
setupReveal();
setupTocPanel();
wireDiagramButtons();
setFontScale(fontScale);
const readTimeBadge = document.getElementById('readTimeBadge');
if(readTimeBadge){ readTimeBadge.textContent = '⏱ ~' + computeReadingTime() + ' นาทีในการอ่าน / min read'; }

window.addEventListener('scroll', updateProgress);
const backToTopBtn = document.getElementById('backToTop');
if(backToTopBtn){ backToTopBtn.addEventListener('click', function(){ window.scrollTo({top:0,behavior:'smooth'}); }); }
const fontMinusBtn = document.getElementById('fontMinus');
if(fontMinusBtn){ fontMinusBtn.addEventListener('click', function(){ setFontScale(fontScale-0.1); }); }
const fontPlusBtn = document.getElementById('fontPlus');
if(fontPlusBtn){ fontPlusBtn.addEventListener('click', function(){ setFontScale(fontScale+0.1); }); }

</script>
