<script>
const SECTIONS = [{"title": "ภาพรวม Wireless และ Mobile Networks", "body": "ปัจจุบันมีผู้ใช้โทรศัพท์มือถือ (wireless) มากกว่าโทรศัพท์บ้าน (fixed) ในอัตราส่วน 10 ต่อ 1 (ข้อมูลปี 2019) และมีอุปกรณ์เชื่อมต่อ mobile-broadband มากกว่า fixed-broadband ในอัตราส่วน 5 ต่อ 1 — บทนี้แยกความท้าทาย 2 เรื่องที่**แตกต่างกันแต่เกี่ยวข้องกัน**", "blocks": [{"type": "subheading", "content": "Wireless vs Mobility: สองความท้าทายที่แตกต่างกัน"}, {"type": "table", "content": "<table><tr><th>ความท้าทาย</th><th>คำนิยาม</th></tr><tr><td>Wireless</td><td>การสื่อสารผ่าน wireless link (ไม่มีสาย) — เกี่ยวกับคุณสมบัติทางกายภาพของสัญญาณและ MAC protocol</td></tr><tr><td>Mobility</td><td>การจัดการผู้ใช้ที่เคลื่อนที่และเปลี่ยนจุดเชื่อมต่อ (point of attachment) กับเครือข่ายไปเรื่อยๆ</td></tr></table>"}, {"type": "warning", "content": "**Wireless ไม่ได้แปลว่า mobile เสมอไป**: อุปกรณ์ wireless อาจอยู่กับที่ (เช่น WiFi router ในบ้านที่เชื่อมกับ desktop) ในขณะที่อุปกรณ์ mobile ก็อาจใช้สายก็ได้ (เช่น laptop ที่ต่อสาย Ethernet แล้วถูกยกย้ายที่) — สองมิตินี้เป็นอิสระจากกัน"}, {"type": "subheading", "content": "องค์ประกอบของเครือข่ายไร้สาย"}, {"type": "table", "content": "<table><tr><th>องค์ประกอบ</th><th>รายละเอียด</th></tr><tr><td>Wireless host</td><td>laptop, smartphone, IoT — รันแอปพลิเคชัน อาจอยู่กับที่หรือเคลื่อนที่</td></tr><tr><td>Base station</td><td>เชื่อมต่อกับเครือข่ายมีสายตามปกติ ทำหน้าที่ relay ส่ง packet ระหว่างเครือข่ายมีสายกับ wireless host ใน \"พื้นที่\" ของตัวเอง เช่น cell tower, 802.11 access point</td></tr><tr><td>Wireless link</td><td>เชื่อมต่อ mobile กับ base station (หรือใช้เป็น backbone link ก็ได้) — มี multiple access protocol ประสานการเข้าถึง link, มีอัตราส่ง/ระยะทาง/ย่านความถี่หลากหลาย</td></tr></table>"}, {"type": "subheading", "content": "โหมดการทำงาน: Infrastructure vs Ad Hoc"}, {"type": "note", "content": "**Infrastructure mode**: base station เชื่อมต่อ mobile เข้าสู่เครือข่ายมีสาย — **Handoff**: เมื่อ mobile เปลี่ยน base station ที่ใช้เชื่อมต่อเข้าเครือข่ายมีสาย\n\n**Ad hoc mode**: ไม่มี base station เลย — node ส่งสัญญาณถึงกันได้เฉพาะที่อยู่ในระยะ link coverage เท่านั้น node ต้อง**จัดระเบียบตัวเอง**เป็นเครือข่าย (route ระหว่างกันเอง)"}, {"type": "subheading", "content": "อนุกรมวิธานของเครือข่ายไร้สาย"}, {"type": "table", "content": "<table><tr><th></th><th>Single Hop</th><th>Multiple Hops</th></tr><tr><td>มี Infrastructure (เช่น AP)</td><td>host เชื่อมต่อกับ base station (WiFi, cellular) ซึ่งเชื่อมต่อกับอินเทอร์เน็ตวงกว้าง</td><td>host อาจต้อง relay ผ่าน wireless node หลายตัวก่อนถึงอินเทอร์เน็ตวงกว้าง (mesh net)</td></tr><tr><td>ไม่มี Infrastructure</td><td>ไม่มี base station, ไม่เชื่อมต่ออินเทอร์เน็ตวงกว้าง (Bluetooth, ad hoc net)</td><td>ไม่มี base station, ไม่เชื่อมต่ออินเทอร์เน็ตวงกว้าง อาจต้อง relay เพื่อไปถึง wireless node อื่น (MANET, VANET)</td></tr></table>"}]}, {"title": "คุณสมบัติของ Wireless Link", "body": "Wireless link มีความท้าทายเฉพาะตัวที่ link แบบมีสายไม่มี ทั้ง fading, multipath, noise และ hidden terminal — สิ่งเหล่านี้ทำให้การออกแบบ protocol ต้องระมัดระวังเป็นพิเศษ", "blocks": [{"type": "subheading", "content": "Fading (Attenuation): การลดทอนของสัญญาณ"}, {"type": "formula", "label": "Free Space Path Loss", "content": "สัญญาณวิทยุ**ลดทอนกำลัง (attenuate)** ขณะเดินทางในอวกาศ (\"path loss\"):\n\n$$\\text{Free space path loss} \\propto (fd)^2$$\n\nโดย $f$ = ความถี่, $d$ = ระยะทาง — **ความถี่สูงขึ้นหรือระยะทางไกลขึ้น → path loss มากขึ้น** (สัญญาณอ่อนลงเร็วกว่า)"}, {"type": "subheading", "content": "Multipath Propagation"}, {"type": "note", "content": "สัญญาณวิทยุ**สะท้อน**จากพื้นดิน สิ่งก่อสร้าง ฯลฯ ทำให้สัญญาณเดินทางถึงปลายทางผ่านหลายเส้นทาง (line-of-sight + reflected path) **มาถึงในเวลาที่ต่างกันเล็กน้อย** — ทำให้เกิดการซ้อนทับ/รบกวนกันเองของสัญญาณ\n\n**Coherence time**: ระยะเวลาที่ 1 บิตยังคง \"อยู่\" ใน channel ก่อนจะถูกรับได้ — จำกัดอัตราส่งข้อมูลสูงสุด (เพราะ coherence time ของแต่ละบิตต้อง**ไม่ทับซ้อนกัน**) — ค่านี้**แปรผกผัน**กับความถี่และความเร็วของ receiver (ยิ่งความถี่สูง/receiver เคลื่อนที่เร็ว coherence time ยิ่งสั้น)"}, {"type": "subheading", "content": "Noise: Signal-to-Noise Ratio (SNR) และ Bit Error Rate (BER)"}, {"type": "note", "content": "**สัญญาณรบกวน**เกิดจากแหล่งอื่นบนความถี่เดียวกัน (มอเตอร์, เครื่องใช้ไฟฟ้า ฯลฯ) — **SNR (Signal-to-Noise Ratio)** ยิ่งสูง ยิ่งง่ายที่จะแยกสัญญาณจาก noise (สิ่งที่ดี)\n\n**Trade-off ระหว่าง SNR กับ BER**: ในระดับ physical layer เดียวกัน เพิ่มกำลังส่ง → เพิ่ม SNR → ลด BER (Bit Error Rate) ได้ — แต่ SNR อาจเปลี่ยนแปลงตามการเคลื่อนที่ของ mobile ทำให้ต้อง **ปรับ physical layer แบบ dynamic** (เปลี่ยนเทคนิค modulation/rate) — เช่น QAM256 ให้ throughput สูง (8 Mbps) แต่ต้องการ SNR สูง, BPSK ให้ throughput ต่ำ (1 Mbps) แต่ทนต่อ SNR ต่ำได้ดีกว่า"}, {"type": "subheading", "content": "Hidden Terminal Problem"}, {"type": "note", "content": "สถานการณ์: node A และ B ได้ยินกัน, B และ C ได้ยินกัน แต่ **A และ C ไม่ได้ยินกันเลย** — ทำให้ A และ C ไม่รู้ตัวว่ากำลังรบกวนกันที่ B (เพราะทั้งคู่ \"เห็น\" channel ว่างจากมุมมองของตัวเอง แต่จริงๆ สัญญาณของทั้งคู่ชนกันที่ B) — ปัญหานี้ยังเกิดจาก signal attenuation ด้วย (สัญญาณของ C อาจแรงพอที่ B รับได้ แต่อ่อนเกินกว่า A จะรับรู้ถึงการมีอยู่)\n\nนี่คือปัญหาสำคัญที่ทำให้ wireless MAC protocol ต้องออกแบบต่างจาก wired Ethernet (CSMA/CD ธรรมดาใช้ไม่ได้ผลดีในสถานการณ์นี้)"}]}, {"title": "CDMA: Code Division Multiple Access", "body": "**CDMA** เป็นเทคนิค multiple access ที่ให้ผู้ใช้ทุกคน**แชร์ความถี่เดียวกัน**พร้อมกัน โดยแยกแต่ละคนด้วย \"รหัส\" (code) เฉพาะตัวแทน (แทนที่จะแยกด้วยเวลาหรือความถี่แบบ TDMA/FDMA)", "blocks": [{"type": "subheading", "content": "หลักการของ CDMA"}, {"type": "note", "content": "แต่ละผู้ใช้ได้รับ **\"chipping sequence\"** (code) เฉพาะตัว — ผู้ใช้ทุกคนแชร์ความถี่เดียวกัน แต่เข้ารหัสข้อมูลด้วย code ของตัวเอง — ถ้า code ของแต่ละคน **\"orthogonal\"** ต่อกัน (ตั้งฉากกันทางคณิตศาสตร์) หลายคนสามารถ**ส่งพร้อมกันได้โดยรบกวนกันน้อยมาก**\n\n**Encoding**: inner product ของ (ข้อมูลต้นฉบับ) × (chipping sequence)\n**Decoding**: summed inner-product ของ (ข้อมูลที่เข้ารหัสแล้ว) × (chipping sequence เดิม)"},  **CSMA/CA** สำหรับ multiple access และมีทั้งเวอร์ชัน infrastructure-based และ ad hoc"}, {"type": "subheading", "content": "สถาปัตยกรรม 802.11 LAN"}, {"type": "note", "content": "**Basic Service Set (BSS)** (aka \"cell\") ในโหมด infrastructure ประกอบด้วย: wireless host + **access point (AP)** (base station) — ในโหมด ad hoc มีแค่ host เท่านั้น (ไม่มี AP)\n\n**Channel**: spectrum แบ่งเป็น channel ที่ความถี่ต่างกัน — ผู้ดูแลระบบเลือกความถี่ของ AP เอง — อาจเกิด **interference** ได้ถ้า AP ข้างเคียงเลือก channel เดียวกัน (เช่น ย่าน 2.4 GHz มี 11 channel ที่ overlap กันบางส่วน)"}, {"type": "subheading", "content": "Association: การเข้าร่วม BSS"}, {"type": "note", "content": "Host ที่เพิ่งมาถึงต้อง **associate** กับ AP ก่อนใช้งานได้:\n\n1. สแกน channel ต่างๆ ฟัง **beacon frame** ที่มีชื่อ AP (SSID) และ MAC address\n2. เลือก AP ที่จะ associate ด้วย\n3. อาจทำ authentication (รายละเอียดใน Chapter 8)\n4. โดยทั่วไปรัน DHCP เพื่อขอ IP address ใน subnet ของ AP นั้น\n\n**Active scanning**: host broadcast Probe Request → AP ตอบ Probe Response → host ส่ง Association Request ไปยัง AP ที่เลือก → AP ตอบ Association Response\n\n**Passive scanning**: AP ส่ง beacon frame เป็นระยะๆ (host ไม่ต้อง probe เอง) → host เลือก AP แล้วส่ง Association Request → AP ตอบ Association Response"}, {"type": "subheading", "content": "IEEE 802.11 MAC Protocol: CSMA/CA"}, {"type": "note", "content": "**ทำไมไม่ใช้ CSMA/CD เหมือน Ethernet?**\n\n- **ตรวจจับ collision ยากมาก**: สัญญาณที่ส่งออกไปแรงกว่าสัญญาณที่รับเข้ามามาก (fading) จึงฟังขณะส่งไม่ได้\n- แม้จะฟังได้ ก็**ตรวจไม่พบ collision ทุกกรณี** เพราะปัญหา hidden terminal และ fading\n\nดังนั้น 802.11 ใช้กลยุทธ์**หลีกเลี่ยง (avoidance)** แทนการ**ตรวจจับ (detection)**: **CSMA/CA (Collision Avoidance)**"}, {"type": "formula", "label": "อัลกอริทึม CSMA/CA", "content": "**ฝั่งผู้ส่ง**:\n1. ถ้าตรวจว่า channel ว่างเป็นเวลา **DIFS** (DCF Inter-Frame Space) → ส่ง frame ทั้งหมด (ไม่มี collision detection)\n2. ถ้าตรวจว่า channel busy → เริ่ม **random backoff timer**; timer นับถอยหลังขณะ channel ว่าง; ส่งเมื่อ timer หมด\n3. ถ้าไม่ได้รับ ACK → เพิ่มช่วง random backoff แล้วทำซ้ำขั้นตอนที่ 2\n\n**ฝั่งผู้รับ**: ถ้าได้รับ frame ถูกต้อง → ส่ง ACK กลับหลัง **SIFS** (Short Inter-Frame Space, สั้นกว่า DIFS) — ต้องมี ACK เพราะปัญหา hidden terminal ทำให้ sender ไม่สามารถรับรู้ผลลัพธ์ของการส่งได้ด้วยตัวเอง"}, {"type": "subheading", "content": "RTS/CTS: การจอง Channel ล่วงหน้า"}, {"type": "note", "content": "แนวคิด: sender \"จอง\" การใช้ channel สำหรับ data frame ด้วย packet ขนาดเล็ก\n\n1. Sender ส่ง **RTS (Request-to-Send)** ไปยัง base station (ด้วย CSMA ปกติ) — RTS อาจ collide กันได้ แต่เนื่องจากสั้นมาก ความเสียหายน้อย\n2. BS ตอบกลับด้วย **CTS (Clear-to-Send)** แบบ broadcast — **ทุก node ได้ยิน CTS นี้** (แก้ปัญหา hidden terminal เพราะทุกคนรู้ว่า channel ถูกจองแล้ว แม้จะไม่ได้ยิน RTS ต้นฉบับ)\n3. Sender ส่ง data frame\n4. Station อื่นเลื่อนการส่งของตัวเองออกไป (defer) จนกว่าการส่งจะเสร็จ"}, {"type": "subheading", "content": "โครงสร้าง 802.11 Frame และการ Addressing"}, {"type": "note", "content": "Frame ของ 802.11 มี **4 address field** (มากกว่า Ethernet ที่มีแค่ 2):\n\n- **Address 1**: MAC address ของ wireless host/AP ที่จะรับ frame นี้\n- **Address 2**: MAC address ของ wireless host/AP ที่ส่ง frame นี้\n- **Address 3**: MAC address ของ router interface ที่ AP เชื่อมต่ออยู่ (ใช้เชื่อมโยงกับฝั่ง wired network)\n- **Address 4**: ใช้เฉพาะใน ad hoc mode เท่านั้น\n\n**เหตุผลที่ต้องมี 4 address**: เพราะ frame ต้องเดินทางผ่าน 2 ช่วง (wireless host ↔ AP ↔ wired network) และแต่ละช่วงต้องการระบุทั้งต้นทาง/ปลายทางของตัวเอง — ต่างจาก Ethernet frame ที่มีแค่ source/destination address 2 ตัวเท่านั้น เพราะเป็นการเดินทางแบบ hop เดียว"}, {"type": "subheading", "content": "ความสามารถขั้นสูง: Rate Adaptation และ Power Management"}, {"type": "note", "content": "**Rate Adaptation**: base station/mobile **ปรับอัตราส่งแบบ dynamic** ตามระยะทาง/SNR ที่เปลี่ยนไป — เมื่อ mobile เคลื่อนที่ห่างจาก base station → SNR ลดลง → BER เพิ่มขึ้น → เมื่อ BER สูงเกินไป จะสลับไปใช้อัตราส่งที่**ต่ำลงแต่ BER ต่ำกว่า** (เช่น จาก QAM256 → QAM16 → BPSK)\n\n**Power Management**: node แจ้ง AP ว่า \"จะไปนอนจนกว่าจะถึง beacon frame ถัดไป\" — AP จะไม่ส่ง frame มาระหว่างนี้ — node ตื่นก่อน beacon frame ถัดไป — beacon frame มีรายการของ mobile ที่มี frame รอส่งอยู่ (AP-to-mobile) — ถ้ามี frame รออยู่ node จะตื่นค้างไว้ ถ้าไม่มีจะกลับไปนอนต่อจนถึง beacon frame ถัดไป (ช่วยประหยัดแบตเตอรี่)"}, {"type": "diagram", "layout": "lifeline", "title": "WiFi Association: การเข้าร่วม BSS", "actors": ["Client", "Access Point (AP)"], "steps": [{"from": 0, "to": 1, "label": "Probe Request", "note": "client ค้นหา AP ที่มีอยู่"}, {"from": 1, "to": 0, "label": "Probe Response", "note": "AP ตอบกลับพร้อมข้อมูล network"}, {"from": 0, "to": 1, "label": "Authentication Request", "note": "ขอยืนยันตัวตน"}, {"from": 1, "to": 0, "label": "Authentication Response", "note": "AP อนุมัติ"}, {"from": 0, "to": 1, "label": "Association Request", "note": "ขอเข้าร่วม BSS"}, {"from": 1, "to": 0, "label": "Association Response", "note": "AP ตอบรับ เข้าร่วมสำเร็จ"}]}, {"type": "diagram", "layout": "lifeline", "title": "RTS/CTS: การจอง Channel ล่วงหน้า", "actors": ["Sender", "AP", "ทุกเครื่องในเครือข่าย"], "steps": [{"from": 0, "to": 1, "label": "RTS (Request to Send)", "note": "sender ขอจอง channel"}, {"from": 1, "to": 2, "label": "CTS (Clear to Send)", "note": "AP broadcast บอกทุกเครื่องให้เงียบไว้"}, {"from": 0, "to": 1, "label": "DATA", "note": "sender ส่งข้อมูลได้โดยไม่ชนกับใคร (แก้ Hidden Terminal)"}, {"from": 1, "to": 0, "label": "ACK", "note": "AP ยืนยันรับข้อมูลสำเร็จ"}]}]}, {"title": "Bluetooth และ Personal Area Networks", "body": "**Bluetooth** เป็น Personal Area Network (PAN) ระยะสั้น (น้อยกว่า 10 เมตร) ใช้ทดแทนสาย (mouse, keyboard, headphones) แบบ ad hoc ไม่ต้องมี infrastructure", "blocks": [{"type": "subheading", "content": "โครงสร้างของ Bluetooth Piconet"}, {"type": "note", "content": "ทำงานที่ย่านความถี่ **2.4-2.5 GHz ISM radio band** ความเร็วสูงสุด 3 Mbps — ใช้สถาปัตยกรรม **master controller / client device**: master polls client และให้สิทธิ์ในการตอบกลับ (transmission) — device ในเครือข่ายแบ่งเป็น: **Master (M)**, **Client (C)** (active), **Parked (P)** (inactive, \"หลับ\" เพื่อประหยัดแบตเตอรี่)\n\n**การแบ่งเวลาและความถี่**: TDM ด้วย time slot ยาว 625 μsec ต่อ slot — FDM: sender ใช้ 79 ความถี่ channel ตามลำดับ pseudo-random ที่เปลี่ยนไปทุก slot (**spread spectrum**) — อุปกรณ์ที่ไม่ได้อยู่ใน piconet เดียวกันจะรบกวนได้แค่บาง slot เท่านั้น (ไม่รบกวนตลอดเวลา)\n\n**Parked mode**: client สามารถ \"หลับ\" (park) แล้วตื่นภายหลังเพื่อประหยัดแบตเตอรี่\n**Bootstrapping**: node ประกอบตัวเองเข้าเป็น piconet แบบ plug-and-play"}]}, {"title": "เครือข่ายเซลลูลาร์ 4G/5G", "body": "4G/5G cellular network คือคำตอบสำหรับ mobile Internet ระดับ wide-area — ปัจจุบันอุปกรณ์เชื่อมต่อ mobile-broadband มากกว่า fixed-broadband ถึง 5 เท่า (ปี 2019) มาตรฐานกำหนดโดย **3GPP (3rd Generation Partnership Project)**", "blocks": [{"type": "subheading", "content": "ความเหมือนและความต่างจากอินเทอร์เน็ตแบบมีสาย"}, {"type": "table", "content": "<table><tr><th>ด้าน</th><th>รายละเอียด</th></tr><tr><td>คล้ายกัน</td><td>มีการแยก edge/core (แต่อยู่ภายใต้ carrier เดียวกัน), เป็น \"network of networks\" ระดับโลก, ใช้ protocol ที่คุ้นเคย (HTTP, DNS, TCP, UDP, IP, NAT), แยก data/control plane, ใช้ SDN, Ethernet, tunneling</td></tr><tr><td>ต่างกัน</td><td>link layer แบบไร้สายเฉพาะทาง, mobility เป็นบริการระดับ \"first-class\" (ไม่ใช่แค่ส่วนเสริม), มี user identity ผ่าน SIM card, มีโมเดลธุรกิจแบบ subscription, มีแนวคิด \"home network\" กับ \"visited/roaming network\" ชัดเจน, มีโครงสร้าง authentication และ inter-carrier settlement ระดับโลก</td></tr></table>"}, {"type": "subheading", "content": "องค์ประกอบสถาปัตยกรรม 4G LTE"}, {"type": "table", "content": "<table><tr><th>องค์ประกอบ</th><th>บทบาท</th></tr><tr><td>Mobile device (UE - User Equipment)</td><td>smartphone/tablet/laptop/IoT ที่มีวิทยุ 4G LTE — มี 64-bit IMSI เก็บไว้บน SIM card</td></tr><tr><td>Base station (eNode-B)</td><td>อยู่ที่ \"ขอบ\" ของเครือข่าย carrier — จัดการ radio resource และ mobile device ใน \"cell\" ของตัวเอง, ประสาน device authentication — มีบทบาท active ใน mobility และประสานงานกับ base station ข้างเคียง</td></tr><tr><td>Serving Gateway (S-GW), PDN Gateway (P-GW)</td><td>อยู่บน data path ระหว่าง mobile กับอินเทอร์เน็ต — P-GW ทำหน้าที่คล้าย gateway router ทั่วไป ให้บริการ NAT — ใช้ tunneling อย่างกว้างขวางระหว่าง element ต่างๆ</td></tr><tr><td>Home Subscriber Service (HSS)</td><td>เก็บข้อมูลของ mobile device ที่มี HSS เครือข่ายนี้เป็น \"home network\" — ทำงานร่วมกับ MME ใน device authentication</td></tr><tr><td>Mobility Management Entity (MME)</td><td>ประสาน device authentication กับ home HSS, จัดการ handover ระหว่าง cell, ติดตาม/paging ตำแหน่ง device, ตั้งค่า tunnel (path) จาก mobile device ไปยัง P-GW</td></tr></table>"}, {"type": "subheading", "content": "Radio Access Network: OFDMA"}, {"type": "note", "content": "เชื่อมต่อ UE กับ eNode-B ผ่านหลายย่านความถี่ (600, 700, 850, 1500, 1700, 1900, 2100, 2600, 3500 MHz) มี upstream/downstream channel แยกกัน\n\n**OFDMA (Orthogonal Frequency Division Multiple Access)**: ผสมผสาน FDM + TDM — **Physical Resource Block (PRB)**: บล็อก 7×12 = 84 resource element เป็นหน่วยพื้นฐานของการ schedule การส่ง — **Transmission Time Interval (TTI)**: 1 ms — สามารถส่งให้ผู้ใช้หลายคน (UE) พร้อมกันได้โดยแบ่งบล็อกของ resource element ให้แต่ละคนภายใน 1 PRB — รองรับความเร็วได้ถึงหลักร้อย Mbps ต่อผู้ใช้"}, {"type": "subheading", "content": "การแยก Data Plane / Control Plane ใน LTE"}, {"type": "note", "content": "**Control plane**: protocol ใหม่สำหรับ mobility management, security, authentication — เกี่ยวข้องกับ base station, MME, HSS, S-GW, P-GW\n\n**Data plane**: protocol ใหม่ที่ link/physical layer — ใช้ **IP tunnel อย่างกว้างขวาง**เพื่อรองรับ mobility\n\n**LTE data-plane protocol stack (first hop)**: Packet Data Convergence (header compression, encryption) → Radio Link Control/RLC (fragmentation/reassembly, reliable transfer) → Medium Access (จัดการ radio slot ผ่าน OFDM)\n\n**LTE data-plane ใน packet core**: mobile datagram ถูกห่อหุ้มด้วย **GTP (GPRS Tunneling Protocol)** ส่งอยู่ภายใน UDP ไปยัง S-GW → S-GW re-tunnel ไปยัง P-GW — เมื่อ mobile เคลื่อนที่ **มีเพียง endpoint ของ tunnel เท่านั้นที่เปลี่ยน** (ไม่ต้องเปลี่ยนโครงสร้างอื่น)"}, {"type": "subheading", "content": "5G: แรงจูงใจและเทคโนโลยีวิทยุใหม่"}, {"type": "note", "content": "**เป้าหมาย 5G**: เพิ่ม peak bitrate 10 เท่า, ลด latency 10 เท่า, เพิ่ม traffic capacity 100 เท่า เมื่อเทียบกับ 4G\n\n**5G NR (New Radio)**: ใช้ 2 ย่านความถี่: **FR1** (450 MHz–6 GHz) และ **FR2** (24-52 GHz, millimeter wave) — **ไม่ backward-compatible กับ 4G** — ใช้ **MIMO** (เสาอากาศทิศทางหลายต้น) — ความถี่ millimeter wave ให้อัตราส่งสูงกว่ามาก แต่ครอบคลุมระยะทางสั้นกว่า — ต้องใช้ **pico-cell** (เส้นผ่านศูนย์กลาง 10-100 m) และวาง base station ใหม่จำนวนมากและหนาแน่น\n\n**3 use case หลักของ 5G** [ITU-R M.2083-0]: **eMBB** (enhanced Mobile Broadband), **mMTC** (massive Machine Type Communications), **URLLC** (Ultra-Reliable Low-Latency Communications) — ครอบคลุม industry vertical มากมาย เช่น manufacturing, transport, health, agriculture"}, {"type": "subheading", "content": "5G: สถาปัตยกรรมแบบ SDN/Microservice"}, {"type": "note", "content": "4G mobile core ใช้ \"boxes and protocols\" เฉพาะทาง (HSS, MME, S-GW, P-GW เป็น network element แยกจากกันชัดเจน) — **5G ใช้สถาปัตยกรรมแบบ microservice** ที่ยืดหยุ่นกว่ามาก โดยแยกฟังก์ชันด้าน communication, computation, และ data ให้กระจายอยู่ใน **data center หลายระดับ**: Far Edge DC (ใกล้ RAN ที่สุด), Edge DC, Core DC — control plane แบ่งตามความเร่งด่วน: real-time (<1ms), near real-time (>ms), non-real-time (>>ms)"}]}, {"title": "Mobility Management: หลักการพื้นฐาน", "body": "การจัดการ mobility ต้องแก้ปัญหาพื้นฐาน: เมื่อ mobile node เปลี่ยนตำแหน่งไปเรื่อยๆ จะ**ติดต่อหา**และ**ส่งข้อมูลถึง**มันได้อย่างไร", "blocks": [{"type": "subheading", "content": "แนวทางการจัดการ Mobility"}, {"type": "note", "content": "**แนวทางที่ 1 — ให้ network (router) จัดการ**: router ประกาศ address ของ mobile node ที่มาเยือนผ่านการแลกเปลี่ยน routing table ปกติ (Internet routing ทำสิ่งนี้ได้อยู่แล้วโดยไม่ต้องแก้ไขอะไรเลย! routing table ระบุตำแหน่งของแต่ละ mobile ผ่าน longest prefix matching) — **แต่ไม่ scale** ไปถึงระดับ mobile นับพันล้านเครื่องได้\n\n**แนวทางที่ 2 — ให้ end-system จัดการ**: ฟังก์ชันอยู่ที่ \"ขอบ\" (edge) แทน — แบ่งเป็น 2 แบบ:\n- **Indirect routing**: การสื่อสารจาก correspondent ไปยัง mobile ผ่าน home network ก่อน แล้วจึง forward ไปยัง mobile ที่อยู่ต่างที่\n- **Direct routing**: correspondent ได้รับ foreign address ของ mobile แล้วส่งตรงไปเลย"}, {"type": "subheading", "content": "ความสำคัญของ \"Home\": Analogy การหาเพื่อนที่ย้ายที่อยู่บ่อย"}, {"type": "example", "content": "**ถ้าเพื่อนของคุณย้ายที่อยู่บ่อยมาก จะหาเขาเจอได้อย่างไร?** ตัวเลือก: ค้นสมุดโทรศัพท์ทุกเล่ม? รอให้เขาบอกเอง? โทรถามพ่อแม่เขา? — **ความสำคัญของการมี \"บ้าน (home)\"**: เป็นแหล่งข้อมูลที่แน่ชัดเกี่ยวกับตัวคุณ เป็นที่ที่คนอื่นสามารถค้นหาตำแหน่งปัจจุบันของคุณได้เสมอ — แนวคิดนี้เป็นรากฐานของ mobility management ทั้งใน 4G/5G และ Mobile IP"}, {"type": "subheading", "content": "Home Network / Visited Network: 4G/5G"}, {"type": "note", "content": "**Home network**: เครือข่ายที่ mobile มี (paid) service plan อยู่ (เช่น Verizon, Orange) — **HSS ของ home network** เก็บข้อมูล identity และบริการ\n\n**Visited network**: เครือข่ายอื่นใดที่ไม่ใช่ home network — มี**ข้อตกลงบริการ (service agreement)** กับ home network เพื่อให้บริการ mobile ที่มาเยือน (roaming)\n\n**SIM card**: เก็บข้อมูล identity ระดับโลกรวมถึงข้อมูล home network — ทำให้ mobile roaming ไปเครือข่ายอื่นได้โดยยังคงยืนยันตัวตนกับ home network ได้เสมอ"}, {"type": "warning", "content": "**ISP/WiFi ไม่มีแนวคิด \"global home\" แบบ 4G/5G**: credential (username/password) ของ ISP เก็บไว้ที่ device หรือผู้ใช้เอง — เครือข่ายต่างกันต้องการ credential ต่างกัน (มีข้อยกเว้นบางกรณี เช่น eduroam ที่ใช้ credential เดียวข้ามสถาบัน) — แม้จะมีสถาปัตยกรรมแบบ Mobile IP ที่รองรับ mobility คล้าย 4G ได้ แต่**ในทางปฏิบัติไม่ค่อยถูกใช้จริง**สำหรับ WiFi"}, {"type": "subheading", "content": "การ Registration: Home ต้องรู้ว่าคุณอยู่ที่ไหน"}, {"type": "note", "content": "**ขั้นตอน**: (1) mobile associate กับ visited mobility manager ของเครือข่ายที่มาเยือน (2) visited mobility manager ลงทะเบียนตำแหน่งของ mobile กับ home HSS — **ผลลัพธ์**: visited mobility manager รู้จัก mobile นี้ และ home HSS รู้ตำแหน่งปัจจุบันของ mobile"}, {"type": "subheading", "content": "Indirect Routing vs Direct Routing"}, {"type": "table", "content": "<table><tr><th>รูปแบบ</th><th>กลไก</th><th>ข้อดี/ข้อเสีย</th></tr><tr><td>Indirect Routing</td><td>Correspondent ใช้ home address เป็น destination เสมอ → home gateway รับ datagram แล้ว forward (tunnel) ไปยัง visited gateway → visited gateway ส่งต่อให้ mobile จริง</td><td>**โปร่งใสต่อ correspondent** (ไม่ต้องรู้ว่า mobile ย้ายไปไหน) — แต่เกิด **triangle routing** (เส้นทางอ้อมผ่าน home เสมอ ไม่มีประสิทธิภาพ) — รองรับการ**ย้าย visited network ระหว่างการสื่อสาร**ได้ (connection ที่กำลังดำเนินอยู่ เช่น TCP ยังคงอยู่ได้ต่อเนื่อง เพราะ home network ยังคง forward ต่อไปยัง network ใหม่)</td></tr><tr><td>Direct Routing</td><td>Correspondent ติดต่อ home HSS ก่อนเพื่อขอ \"care-of address\" (ตำแหน่ง visited network ปัจจุบัน) → ส่งตรงไปยัง visited network address นั้นเลย</td><td>**แก้ปัญหา triangle routing** ได้ (เส้นทางสั้นกว่า) — แต่ **ไม่โปร่งใส**ต่อ correspondent (ต้องขอ care-of-address ก่อนทุกครั้ง) — ถ้า mobile เปลี่ยน visited network ระหว่างทาง ต้องมีกลไกเพิ่มเติมที่ซับซ้อนกว่าเพื่อจัดการ</td></tr></table>"}]}, {"title": "Mobility Management ในทางปฏิบัติ: 4G/5G Handover", "body": "การจัดการ mobility ใน 4G/5G ครอบคลุม 4 งานหลัก: base station association, control-plane configuration, data-plane configuration, และ mobile handover", "blocks": [{"type": "subheading", "content": "4 ขั้นตอนหลักของ Mobility ใน 4G"}, {"type": "table", "content": "<table><tr><th>ขั้นตอน</th><th>รายละเอียด</th></tr><tr><td>1. Base station association</td><td>mobile ให้ IMSI ระบุตัวตน/home network ของตัวเอง</td></tr><tr><td>2. Control-plane configuration</td><td>MME และ home HSS สร้าง control-plane state ยืนยันว่า mobile อยู่ใน visited network — mobile คุยกับ MME ท้องถิ่นผ่าน BS control-plane channel, MME ใช้ IMSI ติดต่อ home HSS เพื่อดึงข้อมูล authentication/encryption/network service</td></tr><tr><td>3. Data-plane configuration</td><td>MME ตั้งค่า forwarding tunnel ให้ mobile — visited และ home network สร้าง tunnel จาก home P-GW ไปยัง mobile — S-GW to BS tunnel: เมื่อ mobile เปลี่ยน base station แค่เปลี่ยน endpoint IP ของ tunnel — S-GW to home P-GW tunnel: implement indirect routing — ใช้ **GTP (GPRS Tunneling Protocol)** ห่อ datagram ของ mobile ไว้ใน UDP</td></tr><tr><td>4. Mobile handover</td><td>mobile เปลี่ยนจุดเชื่อมต่อ (point of attachment) ไปยัง visited network</td></tr></table>"}, {"type": "subheading", "content": "กระบวนการ Handover ระหว่าง Base Station ในเครือข่ายเดียวกัน"}, {"type": "formula", "label": "ขั้นตอน Handover แบบเต็ม", "content": "1. **source BS** เลือก **target BS** แล้วส่ง Handover Request message ไปยัง target BS\n2. **target BS** pre-allocate radio time slot ล่วงหน้า แล้วตอบกลับด้วย HR ACK พร้อมข้อมูลสำหรับ mobile\n3. **source BS** แจ้ง mobile ว่ามี BS ใหม่ — mobile เริ่มส่งผ่าน BS ใหม่ได้ทันที (สำหรับ mobile แล้ว handover ดูเหมือน**เสร็จสมบูรณ์**แล้ว)\n4. **source BS** หยุดส่ง datagram ให้ mobile โดยตรง แต่ **forward ไปยัง target BS แทน** (ซึ่งจะส่งต่อให้ mobile ผ่าน radio channel)\n5. **target BS** แจ้ง MME ว่าตัวเองเป็น BS ใหม่สำหรับ mobile นี้\n6. **MME** สั่งให้ **S-GW เปลี่ยน tunnel endpoint** เป็น target BS (ตัวใหม่)\n7. **target BS** ACK กลับไปยัง source BS: handover เสร็จสมบูรณ์แล้ว, source BS สามารถ**ปลดปล่อย resource**ได้ — จากนี้ datagram ของ mobile ไหลผ่าน tunnel ใหม่จาก target BS ไปยัง S-GW โดยตรง"}, {"type": "diagram", "layout": "lifeline", "title": "4G/5G Handover ระหว่าง Base Station", "actors": ["Mobile\n(UE)", "Base Station\nเดิม", "Base Station\nใหม่"], "steps": [{"from": 0, "to": 1, "label": "รายงานสัญญาณอ่อนลง", "note": "Measurement ": "home agent ห่อ packet ส่งไปยัง foreign network"}, {"from": 2, "to": 3, "label": "ส่งมอบข้อมูล (Decapsulate)", "note": "foreign agent แกะ packet ส่งให้ mobile host"}, {"from": 3, "to": 0, "label": "ตอบกลับโดยตรง (Direct Routing)", "note": "ฝั่งตอบกลับไม่ต้องผ่าน home agent"}]}]}, {"title": "ผลกระทบของ Wireless/Mobility ต่อ Higher-Layer Protocol และสรุปท้ายบท", "body": "แม้ในทางทฤษฎีผลกระทบของ wireless/mobility ต่อ protocol ชั้นบนควรจะน้อยมาก แต่ในทางปฏิบัติกลับมีผลด้าน performance อย่างมีนัยสำคัญ", "blocks": [{"type": "subheading", "content": "ผลกระทบเชิงทฤษฎี vs เชิงปฏิบัติ"}, {"type": "note", "content": "**เชิงตรรกะ ผลกระทบควรน้อยมาก**: best-effort service model ยังคงเหมือนเดิมไม่เปลี่ยนแปลง — TCP และ UDP สามารถ (และก็ทำจริง) รันบน wireless/mobile ได้ตามปกติ\n\n**แต่ในเชิง performance กลับมีผลกระทบมาก**:\n- Packet loss/delay จาก bit-error (packet ถูกทิ้งเพราะ error, delay จากการ retransmit ที่ link layer) และ **handover loss** (สูญเสียข้อมูลระหว่างเปลี่ยน base station)\n- **TCP ตีความ packet loss ว่าเป็น congestion เสมอ** — ทำให้ **ลด congestion window โดยไม่จำเป็น** เมื่อ loss แท้จริงมาจาก wireless bit-error ไม่ใช่ network congestion — ผลคือ throughput ต่ำกว่าที่ควรจะเป็น\n- **Delay impairment** สำหรับ real-time traffic (เสียง/วิดีโอ) ที่ sensitive ต่อความล่าช้า\n- **Bandwidth เป็นทรัพยากรที่หายาก**บน wireless link เมื่อเทียบกับ wired link"}, {"type": "subheading", "content": "สรุปท้ายบท: Chapter 7"}, {"type": "note", "content": "บทนี้ครอบคลุม:\n\n**Wireless**: คุณสมบัติของ wireless link (fading, multipath, noise, hidden terminal), CDMA, WiFi 802.11 (สถาปัตยกรรม, CSMA/CA, frame format), Bluetooth, เครือข่ายเซลลูลาร์ 4G/5G (สถาปัตยกรรม LTE, OFDMA, การแยก data/control plane, การพัฒนาสู่ 5G)\n\n**Mobility**: หลักการจัดการ mobility (indirect vs direct routing), การ implement จริงใน 4G/5G (registration, handover), Mobile IP, และผลกระทบของ mobility ต่อ protocol ชั้นบน\n\nบทนี้เป็นบทสุดท้ายที่กล่าวถึง link layer โดยตรง — บทถัดไป (Chapter 8) จะเข้าสู่หัวข้อ **Network function renderTOC(){
  const toc = document.getElementById("tocList");
  toc.innerHTML = "";
  SECTIONS.forEach((sec, idx)=>{
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = "#section_"+idx;
    const hasDiagram = (sec.blocks||[]).some(function(b){ return b.type === "diagram"; });

    panel.removeAttribute("open");
  }
}

function escapeXml(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function mdFormat(s){
  let t = escapeXml(s);
  t = t.replace(/`([^`\n]+?)`/g, "<code>$1</code>");
  t = t.replace(/\*\*([^*\n]+?)\*\*/g, "<strong>$1</strong>");
  return t;
}
function computeReadingTime(){
  const main = document.getElementById("mainArea");
  const chars = (main.textContent || "").replace(/\s+/g, "").length;
  return Math.max(1, Math.round(chars / 900));
}
function fmtTspans(text, x){
  return String(text==null?"":text).split("\n").map(function(line,i){
    return '<tspan x="'+x+'" dy="'+(i===0?0:15)+'">'+escapeXml(line)+'</tspan>';
  }).join("");
}

function renderDiagramBlock(block, secIdx, blockIdx){
  const uid = "dg_"+secIdx+"_"+blockIdx;
  const layout = block.layout || "lifeline";
  const actors = block.actors || [];
  const steps = block.steps || [];
  const n = actors.length;
  const W = 680;
  const margin = 76;
  const nodesX = [];
  for(let i=0;i<n;i++){ nodesX.push(n===1 ? W/2 : margin + i*((W-2*margin)/Math.max(1,n-1))); }
  let inner = "";
  let H = 0;

  if(layout === "flow"){
    const boxY = 50, boxH = 46;
    const boxW = Math.min(128, Math.max(70,(W-2*margin)/Math.max(1,n-1)-14));
    H = 168;
    actors.forEach(function(a,i){
      inner += '<rect class="diagram-node-box" x="'+(nodesX[i]-boxW/2)+'" y="'+boxY+'" width="'+boxW+'" height="'+boxH+'" rx="7"></rect>';
      inner += '<text class="diagram-actor-label" x="'+nodesX[i]+'" y="'+(boxY+boxH/2-6)+'" text-anchor="middle">'+fmtTspans(a, nodesX[i])+'</text>';
    });
    steps.forEach(function(st,i){
      const x1 = nodesX[st.from]+boxW/2+3, x2 = nodesX[st.to]-boxW/2-3;
      const y = boxY+boxH/2;
      const pid = uid+"_p"+i, mid = uid+"_m"+i;
      inner += '<path id="'+pid+'" class="diagram-arrow-path" d="M '+x1+' '+y+' L '+x2+' '+y+'"></path>';
      inner += '<text class="diagram-arrow-label" x="'+((x1+x2)/2)+'" y="'+(boxY-12)+'" text-anchor="middle">'+escapeXml(st.label||"")+'</text>';
      inner += '<circle id="'+mid+'d" class="diagram-glow-dot" r="6.5" cx="'+x1+'" cy="'+y+'">'
             + '<animateMotion id="'+mid+'" begin="indefinite" dur="0.75s" fill="freeze" path="M '+x1+' '+y+' L '+x2+' '+y+'"></animateMotion>'
             + '<animate attributeName="opacity" begin="'+mid+'.begin" dur="0.05s" from="0" to="1" fill="freeze"></animate>'
             + '<animate attributeName="opacity" begin="'+mid+'.end" dur="0.5s" from="1" to="0" fill="freeze"></animate>'
             + '</circle>';
    });
  } else {
    const rowH = 64, topY = 12, boxH = 38;
    H = topY + boxH + steps.length*rowH + 26;
    const boxW = Math.min(160, Math.max(80,(W-2*margin)/Math.max(1,n-1)-10));
    actors.forEach(function(a,i){
      inner += '<rect class="diagram-node-box" x="'+(nodesX[i]-boxW/2)+'" y="'+topY+'" width="'+boxW+'" height="'+boxH+'" rx="7"></rect>';
      inner += '<text class="diagram-actor-label" x="'+nodesX[i]+'" y="'+(topY+boxH/2-6)+'" text-anchor="middle">'+fmtTspans(a, nodesX[i])+'</text>';
      inner += '<line class="diagram-lifeline" x1="'+nodesX[i]+'" y1="'+(topY+boxH)+'" x2="'+nodesX[i]+'" y2="'+(H-8)+'"></line>';
    });
    steps.forEach(function(st,i){
      const y = topY+boxH+22 + i*rowH;
      const x1 = nodesX[st.from], x2 = nodesX[st.to];
      const pid = uid+"_p"+i, mid = uid+"_m"+i;
      inner += '<path id="'+pid+'" class="diagram-arrow-path" d="M '+x1+' '+y+' L '+x2+' '+y+'"></path>';
      inner += '<text class="diagram-arrow-label" x="'+((x1+x2)/2)+'" y="'+(y-9)+'" text-anchor="middle">'+escapeXml(st.label||"")+'</text>';
      inner += '<circle id="'+mid+'d" class="diagram-glow-dot" r="6.5" cx="'+x1+'" cy="'+y+'">'
             + '<animateMotion id="'+mid+'" begin="indefinite" dur="0.75s" fill="freeze" path="M '+x1+' '+y+' L '+x2+' '+y+'"></animateMotion>'
             + '<animate attributeName="opacity" begin="'+mid+'.begin" dur="0.05s" from="0" to="1" fill="freeze"></animate>'
             + '<animate attributeName="opacity" begin="'+mid+'.end" dur="0.5s" from="1" to="0" fill="freeze"></animate>'
             + '</circle>';
    });
  }

  const svg = '<svg class="diagram-svg" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" preserveAspectRatio="xMidYMid meet">'+inner+'</svg>';

  let stepsHtml = '<ol class="diagram-steps-list">';
  steps.forEach(function(st,i){
    stepsHtml += '<li><span class="step-num">'+(i+1)+'</span><strong>'+escapeXml(st.label||"")+'</strong>'+(st.note?(' — '+escapeXml(st.note)):'')+'</li>';
  });
  stepsHtml += '</ol>';

  return '<div class="diagram-block" id="'+uid+'">'
       + '<h4><span>🔀 '+escapeXml(block.title||"")+'</span><button class="diagram-play-btn" data-diagram-id="'+uid+'">&#9654; เล่นแอนิเมชัน / Play animation</button></h4>'
       + '<div class="diagram-svg-wrap">'+svg+'</div>'
       + stepsHtml
       + '</div>';
}

function diagramPlay(containerId){
  const wrap = document.getElementById(containerId);
  if(!wrap) return;
  const svg = wrap.querySelector('svg');
  const paths = svg.querySelectorAll('.diagram-arrow-path');
  const dots = svg.querySelectorAll('.diagram-glow-dot');
  const items = wrap.querySelectorAll('.diagram-steps-list li');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  items.forEach(function(li){ li.classList.remove('step-active'); });
  if(reduced){ return; }
  const stepDur = 850;
  paths.forEach(function(p){
    const len = p.getTotalLength();
    p.style.transition = 'none';
    p.style.strokeDasharray = len;
    p.style.strokeDashoffset = len;
  });
  void svg.getBoundingClientRect();
  paths.forEach(function(p,i){
    setTimeout(function(){
      p.style.transition = 'stroke-dashoffset '+(stepDur-100)+'ms ease';
      p.style.strokeDashoffset = 0;
      const anim = dots[i] ? dots[i].querySelector('animateMotion') : null;
      if(anim){ try{ anim.beginElement(); }catch(e){} }
      if(items[i]) items[i].classList.add('step-active');
    }, i*stepDur);
  });
}

function wireDiagramButtons(){
  document.querySelectorAll('.diagram-play-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ diagramPlay(btn.dataset.diagramId); });
  });
}

function renderContent(){
  const main = document.getElementById("mainArea");
  main.innerHTML = "";
  SECTIONS.forEach((sec, idx)=>{
    const card = document.createElement("div");
    card.className = "section-card";
    card.id = "section_"+idx;
    let html = "<h2>"+sec.title+"</h2>";
    if(sec.body){
      html += '<div class="body-text">'+mdFormat(sec.body)+'</div>';
    }
    (sec.blocks || []).forEach((block, bi)=>{
      if(block.type === "note"){
        html += '<div class="callout callout-note"><span class="callout-title">หมายเหตุ / Note</span>'+mdFormat(block.content)+'</div>';
      } else if(block.type === "example"){
        html += '<div class="callout callout-example"><span class="callout-title">ตัวอย่าง / Example</span>'+mdFormat(block.content)+'</div>';
      } else if(block.type === "warning"){
        html += '<div class="callout callout-warning"><span class="callout-title">ข้อควรระวัง / Warning</span>'+mdFormat(block.content)+'</div>';
      } else if(block.type === "formula"){
        html += '<div class="callout callout-formula"><span class="callout-title">'+(block.label || "สูตร / Formula")+'</span>'+mdFormat(block.content)+'</div>';
      } else if(block.type === "subheading"){
        html += '<h3>'+mdFormat(block.content)+'</h3>';
      } else if(block.type === "table"){
        html += block.content;
      } else if(block.type === "image"){
        html += '<div class="image-block"><img src="'+block.src+'" alt="'+(block.alt || "")+'" loading="lazy">';
        if(block.caption){
          html += '<div class="image-caption">'+block.caption+'</div>';
        }
        html += '</div>';
      } else if(block.type === "diagram"){
        html += renderDiagramBlock(block, idx, bi);
      }
    });
    card.innerHTML = html;
    main.appendChild(card);
  });

  if(window.renderMathInElement){
    renderMathInElement(main, {
      delimiters: [
        {left: "$$", right: "$$", display: true},
        {left: "$", right: "$", display: false}
      ]
    });
  }
}

function setupScrollSpy(){
  const links = document.querySelectorAll(".toc-list a");
  const sections = document.querySelectorAll(".section-card");
  window.addEventListener("scroll", ()=>{
    let currentIdx = 0;
    sections.forEach((sec, idx)=>{
      const rect = sec.getBoundingClientRect();
      if(rect.top <= 100) currentIdx = idx;
    });
    links.forEach(l=>l.classList.remove("active"));
    if(links[currentIdx]) links[currentIdx].classList.add("active");
  });
}

function setupReveal(){
  const cards = document.querySelectorAll('.section-card');
  if(!('IntersectionObserver' in window)){
    cards.forEach(function(c){ c.classList.add('revealed'); });
    return;
  }
  const io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){ e.target.classList.add('revealed'); io.unobserve(e.target); }
    });
  }, {threshold:0.08, rootMargin:'0px 0px -60px 0px'});
  cards.forEach(function(c){ io.observe(c); });
}

let fontScale = parseFloat(localStorage.getItem('netbook_fontScale')||'1');
function setFontScale(v){
  fontScale = Math.min(1.3, Math.max(0.85, Math.round(v*10)/10));
  try{ localStorage.setItem('netbook_fontScale', fontScale); }catch(e){}
  document.documentElement.style.setProperty('--fontScale', fontScale);
}

function updateProgress(){
  const el = document.documentElement;
  const max = el.scrollHeight - el.clientHeight;
  const pct = max>0 ? (el.scrollTop/max*100) : 0;
  const bar = document.getElementById('readProgress');
  if(bar) bar.style.width = pct+'%';
  const btt = document.getElementById('backToTop');
  if(btt){ if(el.scrollTop>420){ btt.classList.add('show'); } else { btt.classList.remove('show'); } }
}

renderTOC();
renderContent();
setupScrollSpy();
setupReveal();
setupTocPanel();
wireDiagramButtons();
setFontScale(fontScale);
const readTimeBadge = document.getElementById('readTimeBadge');
if(readTimeBadge){ readTimeBadge.textContent = '⏱ ~' + computeReadingTime() + ' นาทีในการอ่าน / min read'; }

window.addEventListener('scroll', updateProgress);
const backToTopBtn = document.getElementById('backToTop');
if(backToTopBtn){ backToTopBtn.addEventListener('click', function(){ window.scrollTo({top:0,behavior:'smooth'}); }); }
const fontMinusBtn = document.getElementById('fontMinus');
if(fontMinusBtn){ fontMinusBtn.addEventListener('click', function(){ setFontScale(fontScale-0.1); }); }
const fontPlusBtn = document.getElementById('fontPlus');
if(fontPlusBtn){ fontPlusBtn.addEventListener('click', function(){ setFontScale(fontScale+0.1); }); }

</script>
</body>
