<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<title>แบบฝึกหัด Kana: Hiragana ⇄ Katakana</title>
<style>

:root{
  color-scheme: light dark;
  --paper:#F6F4EE;
  --panel:#FFFFFF;
  --border:#DCD6C7;
  --text:#2A2A26;
  --text-soft:#6B6558;
  --navy:#1B3A5C;
  --navy-deep:#0F2740;
  --accent:#1B3A5C;
  --accent2:#2B6CB0;
  --accent-soft:#EAF1FA;
  --correct:#256D46;
  --correct-soft:#E7F3EB;
  --incorrect:#B3341F;
  --incorrect-soft:#FBEAE6;
  --flag:#B7862C;
  --flag-soft:#FBF1DA;
  --unanswered:#9A9486;
  --cream:#F4F2E8;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#12161d; --panel:#1b212b; --border:#333c48;
    --text:#e4e7ec; --text-soft:#9aa5b3; --navy:#7fb0e0; --navy-deep:#0b1420;
    --accent:#7fb0e0; --accent2:#8ec1f2; --accent-soft:#1c2b3d;
    --correct:#7fd0a0; --correct-soft:#173323;
    --incorrect:#f0958a; --incorrect-soft:#33201d;
    --flag:#e3bd74; --flag-soft:#332a17; --unanswered:#8b93a0; --cream:#232922;
  }
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Sarabun',"Segoe UI",sans-serif;background:var(--paper);color:var(--text);}
header{
  background:var(--navy-deep);border-bottom:4px solid var(--flag);
  box-shadow:0 2px 10px rgba(15,39,64,0.25);padding:16px 20px;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
  position:sticky;top:0;z-index:10;
}
header h1{font-size:18px;margin:0;color:#F2EFE6;font-weight:700;}
header .subtitle{font-size:12px;color:#C9C2AE;margin-top:2px;}
.back-to-books{display:inline-block;font-size:12px;color:#C9DCF0;text-decoration:none;margin-bottom:6px;opacity:0.85;}
.back-to-books:hover{opacity:1;text-decoration:underline;}
.mode-toggle{display:flex;border:1px solid rgba(242,239,230,0.4);border-radius:6px;overflow:hidden;background:rgba(242,239,230,0.08);}
.mode-toggle button{border:none;background:transparent;color:#F2EFE6;padding:8px 16px;cursor:pointer;font-size:14px;font-family:'Sarabun',sans-serif;}
.mode-toggle button.active{background:var(--flag);color:#1B1300;font-weight:700;}
.script-toggle button{font-weight:700;font-size:15px;}
.script-toggle button.active{background:var(--accent2);color:#fff;}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.toolbar select, .toolbar button{
  border:1.5px solid var(--border);background:var(--panel);border-radius:4px;padding:6px 10px;
  font-size:13px;color:var(--text);cursor:pointer;font-family:'Sarabun',sans-serif;
}
.timer-box{
  display:flex;align-items:center;gap:6px;border:1.5px solid rgba(242,239,230,0.4);border-radius:4px;
  padding:6px 10px;background:rgba(255,255,255,0.95);font-variant-numeric:tabular-nums;
  font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--navy-deep);
}
.layout{display:flex;max-width:1200px;margin:0 auto;gap:20px;padding:20px;}
.sidebar{width:230px;flex-shrink:0;}
.sidebar-panel{
  background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:16px;
  margin-bottom:16px;position:sticky;top:76px;box-shadow:0 2px 8px rgba(15,39,64,0.06);
  max-height:calc(100vh - 96px);overflow-y:auto;
}
.sidebar-panel h3{
  font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-soft);margin:0 0 10px 0;font-weight:600;
}
.nav-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:10px;}
.nav-cell{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:4px;
  background:var(--unanswered);color:#fff;font-size:11px;cursor:pointer;font-family:'JetBrains Mono',monospace;
  opacity:0.55;
}
.nav-cell.answered{background:var(--accent2);opacity:1;}
.nav-cell.correct{background:var(--correct);opacity:1;}
.nav-cell.incorrect{background:var(--incorrect);opacity:1;}
.nav-cell.current{background:var(--flag);opacity:1;color:#1B1300;font-weight:700;}
.legend{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--text-soft);margin-bottom:10px;}
.legend .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;}
.score-box{text-align:center;padding-top:8px;border-top:1px solid var(--border);}
.score-box .big{font-size:24px;font-weight:700;color:var(--navy-deep);font-family:'JetBrains Mono',monospace;}
.cat-select-btns{display:flex;gap:6px;margin-bottom:8px;}
.cat-select-btns button{flex:1;font-size:11.5px;padding:5px;border:1px solid var(--border);background:var(--panel);border-radius:4px;cursor:pointer;color:var(--text);}
.cat-section-label{font-family:'JetBrains Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--flag);margin:10px 0 4px;}
.cat-item{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 0;cursor:pointer;}
.cat-item .cat-chars{color:var(--text-soft);font-size:12px;}
main{flex:1;min-width:0;}
.q-card{
  background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--navy);border-radius:6px;
  padding:22px;margin-bottom:16px;box-shadow:0 2px 10px rgba(15,39,64,0.06);scroll-margin-top:80px;
}
.q-index{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-soft);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
.q-prompt{font-size:16px;margin-bottom:14px;line-height:1.6;}
.q-prompt .kanji-big{font-size:34px;font-weight:700;color:var(--navy-deep);}
.sub-item{margin-bottom:12px;padding:10px 12px;border-radius:4px;border:1.5px solid var(--border);background:var(--paper);}
.sub-item.correct{border-color:var(--correct);background:var(--correct-soft);}
.sub-item.incorrect{border-color:var(--incorrect);background:var(--incorrect-soft);}
.sub-item label{display:block;font-size:12.5px;color:var(--text-soft);margin-bottom:6px;}
.sub-item select, .sub-item input{
  width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:4px;font-size:15px;
  font-family:'Sarabun',sans-serif;background:var(--panel);color:var(--text);
}
.hint-box{
  margin-top:10px;padding:12px 14px;border-radius:4px;border-left:3px solid var(--flag);
  background:var(--flag-soft);font-size:13px;white-space:pre-wrap;line-height:1.8;color:var(--text);
}
.stroke-btn, .footer-actions button.secondary{
  display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--navy);background:var(--panel);
  color:var(--navy);padding:6px 12px;border-radius:4px;font-size:12.5px;cursor:pointer;
  font-family:'Sarabun',sans-serif;font-weight:600;
}
.stroke-btn:hover{background:var(--accent-soft);}
.stroke-anim-wrap{
  margin-top:12px;padding:14px;border-radius:6px;border:1.5px solid var(--border);background:var(--cream);
  display:flex;flex-direction:column;align-items:center;gap:8px;
}
.stroke-anim-svg{width:170px;height:170px;background:var(--panel);border-radius:6px;border:1px solid var(--border);}
.kv-stroke{fill:none;stroke:var(--navy-deep);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;}
.kv-num-bg{fill:var(--flag);stroke:var(--navy-deep);stroke-width:0.8;}
.kv-num-text{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:9px;fill:var(--navy-deep);text-anchor:middle;dominant-baseline:central;}
.kv-dot{fill:#fff;stroke:var(--incorrect);stroke-width:1.5;opacity:0;}
.stroke-play-btn{
  border:1.5px solid var(--accent2);background:var(--panel);color:var(--accent2);padding:5px 12px;
  border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Sarabun',sans-serif;
}
.stroke-play-btn:hover{background:var(--accent-soft);}
.stroke-caption{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-soft);letter-spacing:.04em;}
.answer-block{margin-top:6px;padding:12px 14px;border-radius:4px;border-left:3px solid var(--accent2);background:var(--accent-soft);font-size:14px;}
.explain-block{margin-top:16px;padding-top:14px;border-top:1px dashed var(--border);}
.explain-block h4{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 6px 0;color:var(--text-soft);}
.explain-block .formula{background:var(--navy-deep);color:#EAF1FA;border-radius:4px;padding:12px;font-size:13px;white-space:pre-wrap;margin-bottom:10px;line-height:1.8;}
.explain-block .steps{font-size:13px;line-height:1.8;white-space:pre-wrap;}
.footer-actions{display:flex;justify-content:flex-start;align-items:center;margin-top:16px;flex-wrap:wrap;gap:8px;}
.footer-actions .check-btn{border:none;background:var(--navy);color:#fff;padding:10px 20px;border-radius:4px;font-size:14px;cursor:pointer;font-family:'Sarabun',sans-serif;font-weight:600;}
.footer-actions .check-btn:hover{background:var(--accent2);}
.reveal-box{margin-top:14px;padding:12px 14px;border-radius:4px;border-left:3px solid var(--incorrect);background:var(--incorrect-soft);}
.reveal-title{font-weight:700;font-size:12.5px;text-transform:uppercase;color:var(--incorrect);display:block;margin-bottom:6px;}
.reveal-line{font-size:13.5px;margin-top:2px;}
.flash-card{
  background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:40px 20px;
  min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 2px 14px rgba(15,39,64,0.08);cursor:pointer;margin-bottom:16px;
}
.flash-progress{position:absolute;margin-top:-380px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-soft);}
.flash-char{font-size:96px;font-weight:700;color:var(--navy-deep);line-height:1;}
.flash-char.small{font-size:56px;margin-bottom:10px;}
.flash-hint{font-size:13px;color:var(--text-soft);margin-top:14px;}
.flash-reading{font-size:20px;font-weight:600;color:var(--accent2);margin-bottom:6px;}
.flash-mnemo{font-size:13px;color:var(--text-soft);text-align:center;max-width:340px;margin-top:6px;line-height:1.6;}
.flash-controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.flash-controls button{border:1.5px solid var(--navy);background:var(--panel);color:var(--navy);padding:9px 18px;border-radius:6px;font-size:13.5px;cursor:pointer;font-family:'Sarabun',sans-serif;font-weight:600;}
.flash-controls button.secondary{border-color:var(--border);color:var(--text-soft);}
.flash-controls button:hover{background:var(--accent-soft);}
.row-tip-banner{
  background:var(--accent-soft);border-left:4px solid var(--accent2);border-radius:6px;
  padding:12px 16px;margin-bottom:16px;font-size:13.5px;line-height:1.7;color:var(--text);
}
@media (max-width:800px){
  .layout{flex-direction:column;}
  .sidebar{width:100%;position:static;}
  .sidebar-panel{position:static;max-height:none;}
  .nav-grid{grid-template-columns:repeat(8,1fr);}
}

</style>
</head>
<body>

<header>
  <div>
    <a class="back-to-books" href="../index.html">&larr; ห้องสมุดทั้งหมด / All Books</a>
    <h1>แบบฝึกหัด Kana <span id="scriptLabel"></span></h1>
    <div class="subtitle">ลำดับขีดจาก KanjiVG (CC BY-SA) — สลับ Hiragana/Katakana ได้ที่ปุ่มขวา</div>
  </div>
  <div class="toolbar">
    <div class="mode-toggle script-toggle" id="scriptToggle">
      <button id="btnKatakana" class="active">カタカナ</button>
      <button id="btnHiragana">ひらがな</button>
    </div>
    <div class="mode-toggle">
      <button id="btnExerciseMode" class="active">แบบฝึกหัด</button>
      <button id="btnAnswerMode">เฉลย</button>
      <button id="btnFlashcardMode">Flashcard</button>
    </div>
    <button id="resetAllBtn" style="border:1.5px solid var(--flag);color:var(--flag);">↺ ทำใหม่ทั้งชุด</button>
    <select id="orderSelect">
      <option value="original">เรียงตามต้นฉบับ</option>
      <option value="shuffle">สลับข้อ</option>
      <option value="weak">ฝึกจุดอ่อนก่อน</option>
    </select>
    <select id="timerModeSelect">
      <option value="stopwatch">นับขึ้น</option>
      <option value="countdown">นับถอยหลัง</option>
    </select>
    <input type="number" id="countdownMinutes" placeholder="นาที" min="1" style="width:70px;padding:6px;border:1px solid var(--border);border-radius:6px;">
    <div class="timer-box">
      <span id="timerDisplay">00:00</span>
      <button id="timerStartBtn">เริ่ม</button>
      <button id="timerPauseBtn">พัก</button>
      <button id="timerResetBtn">รีเซ็ต</button>
    </div>
  </div>
</header>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"></svg>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-panel">
      <h3>สารบัญข้อ</h3>
      <div class="nav-grid" id="navGrid"></div>
      <div class="legend">
        <span><span class="dot" style="background:var(--unanswered)"></span>ยังไม่ตอบ</span>
        <span><span class="dot" style="background:var(--accent2)"></span>ตอบบางส่วน</span>
        <span><span class="dot" style="background:var(--correct)"></span>ถูกต้อง</span>
        <span><span class="dot" style="background:var(--incorrect)"></span>ไม่ถูกต้อง</span>
      </div>
      <div class="score-box" id="scoreBox" style="display:none;">
        <div>คะแนน</div>
        <div class="big" id="scoreText">0/0</div>
      </div>
    </div>
    <div class="sidebar-panel">
      <h3>เลือกหมวดหมู่ (วรรค)</h3>
      <div class="cat-select-btns">
        <button id="catSelectAllBtn" type="button">เลือกทั้งหมด</button>
        <button id="catSelectNoneBtn" type="button">เหลือหมวดเดียว</button>
      </div>
      <div id="catPanelBody" class="cat-panel-body"></div>
    </div>
  </div>
  <main id="mainArea"></main>
</div>

<script>
const KANA = {"rows": [{"id": "a", "section": "พื้นฐาน", "label": "a", "tip": "5 เสียงสระหลัก a-i-u-e-o คือฐานของทุกแถว จำแถวนี้แม่นก่อน แถวอื่นคือ \"พยัญชนะ+สระชุดนี้\" ทั้งหมด", "chars": [{"hira": "あ", "kata": "ア", "romaji": "a", "mnemoHira": "เส้นโค้งท้ายม้วนคล้ายเสียง \"อา~\" ตอนอ้าปากกว้าง", "mnemoKata": "เหมือนหลังคาเต็นท์ทรงแหลม ปลายตวัดลง — \"อา\"คนกางแขนรับ"}, {"hira": "い", "kata": "イ", "romaji": "i", "mnemoHira": "สองขีดสั้นยืนเอียงคู่กัน เหมือนคนสองคน (i, i)", "mnemoKata": "คล้าย い แต่มีมุมเหลี่ยม เหมือนคนกำลังเดินก้าวขา"}, {"hira": "う", "kata": "ウ", "romaji": "u", "mnemoHira": "หลังคาโค้งมีจุดเล็กบนหัว เหมือนนกกำลังก้มจิก \"อุ\"", "mnemoKata": "เหมือน う แต่มีหมวกแหลมด้านบน คล้ายจมูกเรือ"}, {"hira": "え", "kata": "エ", "romaji": "e", "mnemoHira": "เส้นโค้งบิดคล้ายคนกำลังเอี้ยวตัว งอแขน", "mnemoKata": "รูปตัว I ขวางมีขีดบนล่าง เหมือนคานเหล็กก่อสร้าง (エ = เอ)"}, {"hira": "お", "kata": "オ", "romaji": "o", "mnemoHira": "มีห่วงเล็กคล้ายโบว์ผูกอยู่มุมขวา จำว่า \"โอ้! โบว์สวย\"", "mnemoKata": "คล้ายต้นไม้มีกิ่งกางออก คล้าย 才(ความสามารถ)"}]}, {"id": "ka", "section": "พื้นฐาน", "label": "ka", "tip": "ทุกตัวออกเสียงตรงไปตรงมา (ka-ki-ku-ke-ko) ไม่มีข้อยกเว้น จำง่ายที่สุดแถวหนึ่ง", "chars": [{"hira": "か", "kata": "カ", "romaji": "ka", "mnemoHira": "เหมือนตัว k คว่ำมีหางม้วนสั้นด้านขวา — \"คา\"", "mnemoKata": "เหมือนมีดพร้า/เคียว รูปตัว force มีขีดทะลุ"}, {"hira": "き", "kata": "キ", "romaji": "ki", "mnemoHira": "มีห่วงเล็กด้านล่าง คล้ายกุญแจ \"key\" (คีย์=คิ)", "mnemoKata": "คล้าย き แต่เหลี่ยมกว่า ไม่มีห่วง เหมือนกิ่งไม้กางออก"}, {"hira": "く", "kata": "ク", "romaji": "ku", "mnemoHira": "เส้นหักมุมเดียวคล้ายปากนกกำลังจิก หรือติ๊กถูก (く=ku)", "mnemoKata": "คล้าย く มีขีดสั้นเพิ่มด้านบน เหมือนติ๊กถูกมีหาง"}, {"hira": "け", "kata": "ケ", "romaji": "ke", "mnemoHira": "คล้าย き ผสมกับขีดตั้ง เหมือนธงปักบนพื้น", "mnemoKata": "คล้าย ク มีขีดยาวขึ้นด้านบนซ้าย เหมือนคนแบกของ"}, {"hira": "こ", "kata": "コ", "romaji": "ko", "mnemoHira": "สองขีดแนวนอนโค้งเล็กน้อย เหมือนงูสองตัวนอนคู่กัน (โคะ)" function escapeHtml(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function pickDistractors(pool, exclude, n){
  const uniq = Array.from(new Set(pool));
  const candidates = uniq.filter(x=>x!==exclude);
  return shuffleArray(candidates).slice(0,n);
}

function buildQuestions(script){
  const questions = [];
  const isHira = script === "hiragana";
  const allRomaji = [];
  const allChars = [];
  KANA.rows.forEach(row=>{
    row.chars.forEach(c=>{
      allRomaji.push(c.romaji);
      allChars.push(isHira ? c.hira : c.kata);
    });
  });

  let flatIdx = 0;
  KANA.rows.forEach(row=>{
    row.chars.forEach(c=>{
      const char = isHira ? c.hira : c.kata;
      const mnemo = isHira ? c.mnemoHira : c.mnemoKata;
      const formula = "เทคนิคจำแถวนี้ ("+row.label+"): "+row.tip+"\n\nเทคนิคจำตัวนี้: "+mnemo;
      const typeA = (flatIdx % 2 === 0);
      if(typeA){
        const options = shuffleArray([c.romaji].concat(pickDistractors(allRomaji, c.romaji, 5)));
        questions.push({
          prompt: 'ตัวอักษรนี้อ่านว่าอย่างไร: <span class="kanji-big">「'+char+'」</span>',
          subs: [{label:"เลือกคำตอบที่ถูกต้อง", options:options, correctAnswer:c.romaji}],
          formula: formula, mnemo: mnemo,
          steps: '「'+char+'」 อยู่ในแถว '+row.label+'-row จึงอ่านว่า "'+c.romaji+'"',
          char: char, reading: c.romaji, cat: row.id, qtype:"read"
        });
      } else {
        const options = shuffleArray([char].concat(pickDistractors(allChars, char, 5)));
        questions.push({
          prompt: 'เสียงอ่าน "'+c.romaji+'" ตรงกับตัวอักษรตัวใด',
          subs: [{label:"เลือกคำตอบที่ถูกต้อง", options:options, correctAnswer:char}],
          formula: formula, mnemo: mnemo,
          steps: 'เสียง "'+c.romaji+'" ตรงกับตัวอักษร 「'+char+'」 ในแถว '+row.label+'-row',
          char: char, reading: c.romaji, cat: row.id, qtype:"recognize"
        });
      }
      flatIdx++;
    });
  });

  const groups = KANA.confusables[script] || [];
  groups.forEach(group=>{
    const target = group[Math.floor(Math.random()*group.length)];
    let targetReading = null, targetCat = null;
    KANA.rows.forEach(row=>{
      row.chars.forEach(c=>{
        const ch = isHira ? c.hira : c.kata;
        if(ch === target){ targetReading = c.romaji; targetCat = row.id; }
      });
    });
    if(!targetReading) return;
    const others = group.filter(x=>x!==target);
    const need = Math.max(0, 4-others.length);
    const extra = pickDistractors(allChars, target, need+2).filter(x=>group.indexOf(x)===-1).slice(0,need);
    const options = shuffleArray([target].concat(others, extra)).slice(0,Math.min(6, group.length+extra.length+1));
    questions.push({
      prompt: '⚠️ ตัวที่หน้าตาคล้ายกัน — เสียง "'+targetReading+'" ตรงกับตัวอักษรตัวใด',
      subs: [{label:"สังเกตรายละเอียดให้ดี", options:options, correctAnswer:target}],
      formula: "จุดสังเกต: "+group.join(" / ")+" หน้าตาคล้ายกันมาก ต้องดูรายละเอียดปลายเส้น/มุมให้ชัด",
      mnemo: "", steps: 'เสียง "'+targetReading+'" ตรงกับ 「'+target+'」',
      char: target, reading: targetReading, cat: targetCat, qtype:"confusable"
    });
  });

  return questions;
}

function buildCatMeta(script){
  const isHira = script === "hiragana";
  return KANA.rows.map(row=>({
    id: row.id, section: row.section, label: row.label,
    chars: row.chars.map(c=> isHira ? c.hira : c.kata)
  }));
}

function renderStrokeAnim(char, uid, hidden){
  const data = KANA.strokes[char];
  if(!data) return "";
  let inner = "";
  data.strokes.forEach((s,i)=>{
    inner += '<path id="'+uid+'_s'+i+'" class="kv-stroke" d="'+s.d+'"></path>';
  });
  data.strokes.forEach((s,i)=>{
    const mid = uid+"_m"+i;
    inner += '<circle class="kv-num-bg" cx="'+s.x0+'" cy="'+s.y0+'" r="6.5"></circle>';
    inner += '<text class="kv-num-text" x="'+s.x0+'" y="'+s.y0+'">'+(i+1)+'</text>';
    inner += '<circle id="'+mid+'d" class="kv-dot" r="3">'
           + '<animateMotion id="'+mid+'" begin="indefinite" dur="0.5s" fill="freeze" path="'+s.d+'"></animateMotion>'
           + '<animate attributeName="opacity" begin="'+mid+'.begin" dur="0.05s" from="0" to="1" fill="freeze"></animate>'
           + '<animate attributeName="opacity" begin="'+mid+'.end" dur="0.4s" from="1" to="0" fill="freeze"></animate>'
           + '</circle>';
  });
  return '<div class="stroke-anim-wrap" id="'+uid+'"'+(hidden?' style="display:none"':'')+'>'
       + '<svg viewBox="'+data.vb+'" class="stroke-anim-svg">'+inner+'</svg>'
       + '<button class="stroke-play-btn" data-target="'+uid+'">&#9654; เล่นลำดับขีด ('+data.strokes.length+' ขีด)</button>'
       + '</div>';
}

function playStrokeAnim(uid){
  const box = document.getElementById(uid);
  if(!box) return;
  const svg = box.querySelector("svg");
  const paths = svg.querySelectorAll(".kv-stroke");
  const dots = svg.querySelectorAll(".kv-dot");
  paths.forEach(p=>{
    const len = p.getTotalLength();
    p.style.transition = "none";
    p.style.strokeDasharray = len;
    p.style.strokeDashoffset = len;
  });
  void svg.getBoundingClientRect();
  const stepDur = 550;
  paths.forEach((p,i)=>{
    setTimeout(()=>{
      p.style.transition = "stroke-dashoffset "+(stepDur-100)+"ms ease";
      p.style.strokeDashoffset = 0;
      const anim = dots[i] ? dots[i].querySelector("animateMotion") : null;
      if(anim){ try{ anim.beginElement(); }catch(e){} }
    }, i*stepDur);
  });
}

function wireStrokeButtons(root){
  root.querySelectorAll(".stroke-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const box = document.getElementById(btn.dataset.box);
      if(box) box.style.display = box.style.display==="none" ? "flex" : "none";
    });
  });
  root.querySelectorAll(".stroke-play-btn").forEach(btn=>{
    btn.addEventListener("click", ()=> playStrokeAnim(btn.dataset.target));
  });
}

let currentScript = "katakana";
let mode = "exercise";
let QUESTIONS = buildQuestions(currentScript);
let CAT_META = buildCatMeta(currentScript);
let selectedCats = new Set(CAT_META.map(c=>c.id));
let order = "original";
let flashPos = 0;
let flashFlipped = false;

let progressState = { katakana:{userAnswers:{}, checked:{}}, hiragana:{userAnswers:{}, checked:{}} };
let userAnswers = progressState.katakana.userAnswers;
let checked = progressState.katakana.checked;

let masteryWrong = {};
try{ masteryWrong = JSON.parse(localStorage.getItem("kana_mastery_wrong")||"{}"); }catch(e){}
function saveMastery(){ try{ localStorage.setItem("kana_mastery_wrong", JSON.stringify(masteryWrong)); }catch(e){} }
function masteryKey(script, char){ return script+"_"+char; }
function recordResult(qIdx, correct){
  const q = QUESTIONS[qIdx];
  const key = masteryKey(currentScript, q.char);
  if(!correct){ masteryWrong[key] = (masteryWrong[key]||0) + 1; saveMastery(); }
}

function filteredIndexes(){
  const arr=[];
  QUESTIONS.forEach((q,i)=>{ if(selectedCats.has(q.cat)) arr.push(i); });
  return arr;
}
function computeDisplayIndexes(){
  const base = filteredIndexes();
  if(order==="shuffle") return shuffleArray(base);
  if(order==="weak"){
    return base.slice().sort((a,b)=>{
      const wa = masteryWrong[masteryKey(currentScript, QUESTIONS[a].char)] || 0;
      const wb = masteryWrong[masteryKey(currentScript, QUESTIONS[b].char)] || 0;
      return wb - wa;
    });
  }
  return base;
}
let displayIndexes = computeDisplayIndexes();

let timerMode = "stopwatch";
let timerSeconds = 0;
let timerLimit = 0;
let timerInterval = null;
let timerRunning = false;

function formatTime(sec){
  const m = Math.floor(sec/60).toString().padStart(2,"0");
  const s = Math.floor(sec%60).toString().padStart(2,"0");
  return m+":"+s;
}
function updateTimerDisplay(){
  const displaySec = timerMode==="countdown" ? Math.max(timerLimit - timerSeconds, 0) : timerSeconds;
  document.getElementById("timerDisplay").textContent = formatTime(displaySec);
  if(timerMode==="countdown" && timerLimit>0 && timerSeconds>=timerLimit){
    stopTimer();
    document.getElementById("timerDisplay").textContent = "หมดเวลา";
  }
}
function startTimer(){
  if(timerRunning) return;
  if(timerMode==="countdown"){
    const mins = parseFloat(document.getElementById("countdownMinutes").value);
    if(mins>0 && timerLimit===0) timerLimit = mins*60;
  }
  timerRunning = true;
  timerInterval = setInterval(()=>{ timerSeconds++; updateTimerDisplay(); },1000);
}
function stopTimer(){ timerRunning = false; clearInterval(timerInterval); }
function resetTimer(){
  stopTimer(); timerSeconds = 0; timerLimit = 0;
  document.getElementById("countdownMinutes").value = "";
  updateTimerDisplay();
}
document.getElementById("timerStartBtn").onclick = startTimer;
document.getElementById("timerPauseBtn").onclick = stopTimer;
document.getElementById("timerResetBtn").onclick = resetTimer;
document.getElementById("timerModeSelect").onchange = (e)=>{ timerMode = e.target.value; resetTimer(); };

function subKey(qIdx, subIdx){ return qIdx+"_"+subIdx; }
function checkSubAnswer(q, subIdx, value){
  return String(value) === String(q.subs[subIdx].correctAnswer);
}
function questionStatus(qIdx){
  const q = QUESTIONS[qIdx];
  const total = q.subs.length;
  let answeredCount = 0, correctCount = 0;
  for(let s=0;s<total;s++){
    const key = subKey(qIdx,s);
    if(userAnswers[key] !== undefined && userAnswers[key] !== ""){
      answeredCount++;
      if(checked[qIdx] && checkSubAnswer(q,s,userAnswers[key])) correctCount++;
    }
  }
  if(!checked[qIdx]) return answeredCount===0 ? "unanswered" : "partial";
  return correctCount===total ? "correct" : "incorrect";
}
function isFullyCorrect(qIdx){ return questionStatus(qIdx) === "correct"; }

function renderNavGrid(){
  const nav = document.getElementById("navGrid");
  nav.innerHTML = "";
  displayIndexes.forEach((qIdx, pos)=>{
    const cell = document.createElement("div");
    cell.className = "nav-cell";
    if(mode==="flashcard"){
      if(pos===flashPos) cell.classList.add("current");
    } else {
      const status = questionStatus(qIdx);
      if(status==="partial") cell.classList.add("answered");
      if(status==="correct") cell.classList.add("correct");
      if(status==="incorrect") cell.classList.add("incorrect");
    }
    cell.textContent = pos+1;
    cell.onclick = ()=>{
      if(mode==="flashcard"){
        flashPos = pos; flashFlipped = false; renderFlashcard();
      } else {
        const target = document.getElementById("qcard_"+qIdx);
        if(target) target.scrollIntoView({behavior:"smooth", block:"start"});
      }
    };
    nav.appendChild(cell);
  });
}

function renderCatPanel(){
  const body = document.getElementById("catPanelBody");
  if(!body) return;
  let html = "";
  let lastSection = null;
  CAT_META.forEach(cat=>{
    if(cat.section !== lastSection){
      html += '<div class="cat-section-label">'+cat.section+'</div>';
      lastSection = cat.section;
    }
    const isChecked = selectedCats.has(cat.id) ? "checked" : "";
    html += '<label class="cat-item"><input type="checkbox" data-cat="'+cat.id+'" '+isChecked+'> '
          + cat.label + ' <span class="cat-chars">'+cat.chars.join("")+'</span></label>';
  });
  body.innerHTML = html;
  body.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', (e)=>{
      const cid = e.target.getAttribute('data-cat');
      if(e.target.checked) selectedCats.add(cid); else selectedCats.delete(cid);
      onCatFilterChanged();
    });
  });
}
function onCatFilterChanged(){
  if(selectedCats.size===0){
    CAT_META.forEach(c=>selectedCats.add(c.id));
    renderCatPanel();
  }
  displayIndexes = computeDisplayIndexes();
  flashPos = 0; flashFlipped = false;
  render();
}
document.getElementById("catSelectAllBtn").addEventListener('click', ()=>{
  CAT_META.forEach(c=>selectedCats.add(c.id));
  renderCatPanel();
  onCatFilterChanged();
});
document.getElementById("catSelectNoneBtn").addEventListener('click', ()=>{
  selectedCats.clear();
  selectedCats.add(CAT_META[0].id);
  renderCatPanel();
  onCatFilterChanged();
});

function rowBanner(q){
  const rowMeta = CAT_META.find(c=>c.id===q.cat);
  const rowFull = KANA.rows.find(r=>r.id===q.cat);
  if(!rowMeta || !rowFull) return "";
  const banner = document.createElement("div");
  banner.className = "row-tip-banner";
  banner.innerHTML = "<strong>วรรค "+rowMeta.label+"</strong> ("+rowMeta.chars.join(" ")+")<br>"+escapeHtml(rowFull.tip);
  return banner;
}

function renderExercise(){
  const main = document.getElementById("mainArea");
  main.innerHTML = "";
  let lastCat = null;
  displayIndexes.forEach((qIdx, pos)=>{
    const q = QUESTIONS[qIdx];
    if(q.cat !== lastCat && order==="original"){
      const b = rowBanner(q);
      if(b) main.appendChild(b);
      lastCat = q.cat;
    }
    const isChecked = !!checked[qIdx];
    const card = document.createElement("div");
    card.className = "q-card";
    card.id = "qcard_"+qIdx;
    let html = '<div class="q-index">ข้อ '+(pos+1)+'</div>';
    html += '<div class="q-prompt">'+q.prompt+'</div>';
    q.subs.forEach((sub, subIdx)=>{
      const key = subKey(qIdx, subIdx);
      const lockedClass = isChecked ? " locked" : "";
      let stateClass = "";
      if(isChecked && userAnswers[key] !== undefined && userAnswers[key] !== ""){
        stateClass = checkSubAnswer(q, subIdx, userAnswers[key]) ? " correct" : " incorrect";
      }
      html += '<div class="sub-item'+lockedClass+stateClass+'" id="sitem_'+key+'"><label>'+sub.label+'</label>';
      const disabledAttr = isChecked ? "disabled" : "";
      html += '<select data-key="'+key+'" '+disabledAttr+'><option value="">-- เลือก --</option>';
      sub.options.forEach(opt=>{
        const selectedAttr = userAnswers[key]===opt ? "selected" : "";
        html += '<option value="'+escapeHtml(opt)+'" '+selectedAttr+'>'+escapeHtml(opt)+'</option>';
      });
      html += '</select></div>';
    });
    html += '<div class="footer-actions">';
    if(!isChecked) html += '<button class="check-btn" data-qidx="'+qIdx+'">ตรวจคำตอบข้อนี้</button>';
    html += '<button class="secondary hint-btn" data-qidx="'+qIdx+'">💡 เทคนิคจำ</button>';
    html += '<button class="secondary stroke-btn" data-box="strokebox_'+qIdx+'">✍️ ลำดับขีด</button>';
    html += '</div>';
    html += '<div class="hint-box" id="hintbox_'+qIdx+'" style="display:none">'+escapeHtml(q.formula)+'</div>';
    html += renderStrokeAnim(q.char, "strokebox_"+qIdx, true);
    if(isChecked && !isFullyCorrect(qIdx)){
      html += '<div class="reveal-box"><span class="reveal-title">เฉลยคำตอบที่ถูกต้อง</span>';
      q.subs.forEach(sub=>{
        html += '<div class="reveal-line"><b>'+sub.label+':</b> '+escapeHtml(sub.correctAnswer)+'</div>';
      });
      html += '</div>';
    }
    card.innerHTML = html;
    main.appendChild(card);
  });

  main.querySelectorAll("select").forEach(el=>{
    el.addEventListener("change", (e)=>{
      const key = e.target.getAttribute("data-key");
      userAnswers[key] = e.target.value;
      renderNavGrid();
    });
  });
  main.querySelectorAll(".check-btn").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      const qIdx = parseInt(e.target.getAttribute("data-qidx"));
      checked[qIdx] = true;
      recordResult(qIdx, isFullyCorrect(qIdx));
      renderExercise();
    });
  });
  main.querySelectorAll(".hint-btn").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      const qIdx = e.target.getAttribute("data-qidx");
      const box = document.getElementById("hintbox_"+qIdx);
      box.style.display = box.style.display==="none" ? "block" : "none";
    });
  });
  wireStrokeButtons(main);
  renderNavGrid();
  updateScore();
}

function renderAnswers(){
  const main = document.getElementById("mainArea");
  main.innerHTML = "";
  let lastCat = null;
  displayIndexes.forEach((qIdx, pos)=>{
    const q = QUESTIONS[qIdx];
    if(q.cat !== lastCat && order==="original"){
      const b = rowBanner(q);
      if(b) main.appendChild(b);
      lastCat = q.cat;
    }
    const card = document.createElement("div");
    card.className = "q-card";
    card.id = "qcard_"+qIdx;
    let html = '<div class="q-index">ข้อ '+(pos+1)+'</div>';
    html += '<div class="q-prompt">'+q.prompt+'</div>';
    q.subs.forEach(sub=>{
      html += '<div class="sub-item"><label>'+sub.label+'</label>';
      html += '<div class="answer-block"><strong>คำตอบ:</strong> '+escapeHtml(sub.correctAnswer)+'</div></div>';
    });
    html += '<div class="explain-block"><h4>วิธีจำ</h4>';
    html += '<div class="formula">'+escapeHtml(q.formula)+'</div>';
    html += '<div class="steps">'+escapeHtml(q.steps)+'</div></div>';
    html += renderStrokeAnim(q.char, "ansstroke_"+qIdx, false);
    card.innerHTML = html;
    main.appendChild(card);
  });
  document.getElementById("scoreBox").style.display = "none";
  wireStrokeButtons(main);
  renderNavGrid();
}

function renderFlashcard(){
  const main = document.getElementById("mainArea");
  main.innerHTML = "";
  if(displayIndexes.length===0){
    main.innerHTML = '<div class="q-card">ไม่มีตัวอักษรในหมวดที่เลือก กรุณาเลือกอย่างน้อย 1 หมวด</div>';
    renderNavGrid();
    return;
  }
  if(flashPos >= displayIndexes.length) flashPos = 0;
  const qIdx = displayIndexes[flashPos];
  const q = QUESTIONS[qIdx];
  const card = document.createElement("div");
  card.className = "flash-card";
  let html = '<div class="flash-progress">บัตรที่ '+(flashPos+1)+' / '+displayIndexes.length+'</div>';
  html += '<div id="flashFace" style="display:flex;flex-direction:column;align-items:center;width:100%;">';
  if(!flashFlipped){
    html += '<div class="flash-char">'+q.char+'</div>';
    html += '<div class="flash-hint">แตะเพื่อดูเฉลย</div>';
  } else {
    html += '<div class="flash-char small">'+q.char+'</div>';
    html += '<div class="flash-reading">อ่านว่า "'+q.reading+'"</div>';
    if(q.mnemo) html += '<div class="flash-mnemo">'+escapeHtml(q.mnemo)+'</div>';
    html += renderStrokeAnim(q.char, "flashstroke_"+qIdx, false);
  }
  html += '</div>';
  card.innerHTML = html;
  card.querySelector('#flashFace').addEventListener('click', (e)=>{
    if(e.target.closest('.stroke-play-btn')) return;
    flashFlipped = !flashFlipped;
    renderFlashcard();
  });
  main.appendChild(card);
  wireStrokeButtons(main);

  const controls = document.createElement('div');
  controls.className = 'flash-controls';
  controls.innerHTML = '<button id="flashPrevBtn">← ก่อนหน้า</button>'
    + '<button id="flashFlipBtn">พลิกบัตร</button>'
    + '<button id="flashNextBtn">ถัดไป →</button>'
    + '<button id="flashShuffleBtn" class="secondary">🔀 สุ่มลำดับ</button>';
  main.appendChild(controls);
  document.getElementById('flashPrevBtn').onclick = ()=>{ flashPos=(flashPos-1+displayIndexes.length)%displayIndexes.length; flashFlipped=false; renderFlashcard(); };
  document.getElementById('flashNextBtn').onclick = ()=>{ flashPos=(flashPos+1)%displayIndexes.length; flashFlipped=false; renderFlashcard(); };
  document.getElementById('flashFlipBtn').onclick = ()=>{ flashFlipped=!flashFlipped; renderFlashcard(); };
  document.getElementById('flashShuffleBtn').onclick = ()=>{ displayIndexes=shuffleArray(displayIndexes); flashPos=0; flashFlipped=false; renderFlashcard(); };

  document.getElementById("scoreBox").style.display = "none";
  renderNavGrid();
}

function updateScore(){
  const scoreBox = document.getElementById("scoreBox");
  const scoreText = document.getElementById("scoreText");
  let correctCount = 0;
  QUESTIONS.forEach((q, qIdx)=>{ if(checked[qIdx] && isFullyCorrect(qIdx)) correctCount++; });
  scoreText.textContent = correctCount + "/" + QUESTIONS.length;
  scoreBox.style.display = "block";
}

function resetAll(){
  progressState[currentScript].userAnswers = {};
  progressState[currentScript].checked = {};
  userAnswers = progressState[currentScript].userAnswers;
  checked = progressState[currentScript].checked;
  render();
}
document.getElementById("resetAllBtn").addEventListener("click", resetAll);

function render(){
  if(mode==="exercise") renderExercise();
  else if(mode==="answer") renderAnswers();
  else renderFlashcard();
}

function setActiveModeBtn(id){
  ["btnExerciseMode","btnAnswerMode","btnFlashcardMode"].forEach(btnId=>{
    document.getElementById(btnId).classList.toggle("active", btnId===id);
  });
}
document.getElementById("btnExerciseMode").onclick = ()=>{ mode="exercise"; setActiveModeBtn("btnExerciseMode"); render(); };
document.getElementById("btnAnswerMode").onclick = ()=>{ mode="answer"; setActiveModeBtn("btnAnswerMode"); render(); };
document.getElementById("btnFlashcardMode").onclick = ()=>{ mode="flashcard"; flashPos=0; flashFlipped=false; setActiveModeBtn("btnFlashcardMode"); render(); };

function updateScriptLabel(){
  document.getElementById("scriptLabel").textContent = currentScript==="hiragana" ? "— ひらがな Hiragana" : "— カタカナ Katakana";
}
function switchScript(script){
  if(script === currentScript) return;
  currentScript = script;
  QUESTIONS = buildQuestions(currentScript);
  CAT_META = buildCatMeta(currentScript);
  userAnswers = progressState[currentScript].userAnswers;
  checked = progressState[currentScript].checked;
  displayIndexes = computeDisplayIndexes();
  flashPos = 0; flashFlipped = false;
  updateScriptLabel();
  document.getElementById("btnKatakana").classList.toggle("active", script==="katakana");
  document.getElementById("btnHiragana").classList.toggle("active", script==="hiragana");
  renderCatPanel();
  render();
}
document.getElementById("btnKatakana").onclick = ()=> switchScript("katakana");
document.getElementById("btnHiragana").onclick = ()=> switchScript("hiragana");

document.getElementById("orderSelect").onchange = (e)=>{
  order = e.target.value;
  displayIndexes = computeDisplayIndexes();
  flashPos = 0;
  render();
};

updateScriptLabel();
renderCatPanel();
displayIndexes = computeDisplayIndexes();
render();
updateTimerDisplay();

</script>
</body>
</html>
