<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>OSI Model 7 Layer &amp; IPv4 Subnetting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>

:root{
  color-scheme: light;
  --paper:#F6F4EE;
  --bg:#F6F4EE;
  --panel:#FFFFFF;
  --border:#DCD6C7;
  --text:#2A2A26;
  --text-soft:#6B6558;
  --navy:#1B3A5C;
  --navy-deep:#0F2740;
  --accent:#1B3A5C;
  --accent2:#2B6CB0;
  --accent-soft:#EAF1FA;
  --correct:#256D46;
  --correct-soft:#E7F3EB;
  --incorrect:#B3341F;
  --incorrect-soft:#FBEAE6;
  --flag:#B7862C;
  --flag-soft:#FBF1DA;
  --unanswered:#9A9486;
  --fontScale:1;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:'Sarabun',"Segoe UI",sans-serif;
  background:var(--paper);
  color:var(--text);
}
header{
  background:var(--navy-deep);
  border-bottom:4px solid var(--flag);
  box-shadow:0 2px 10px rgba(15,39,64,0.25);
  padding:16px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  position:sticky;
  top:0;
  z-index:10;
}
header h1{
  font-size:18px;
  margin:0;
  color:#F2EFE6;
  font-weight:700;
}
header .subtitle{
  font-size:12.5px;
  color:#C9C2AE;
  margin-top:2px;
}
.header-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.layout{
  display:flex;
  max-width:1200px;
  margin:0 auto;
  gap:20px;
  padding:20px;
}
.sidebar{width:250px;flex-shrink:0;}
.sidebar-panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:6px;
  padding:16px;
  position:sticky;
  top:80px;
  box-shadow:0 2px 8px rgba(15,39,64,0.06);
  max-height:calc(100vh - 100px);
  overflow-y:auto;
}
.sidebar-panel h3{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--text-soft);
  margin:0 0 10px 0;
  font-weight:600;
}
.toc-list{list-style:none;margin:0;padding:0;}
.toc-list li{margin-bottom:2px;}
.toc-list a{
  display:block;
  padding:7px 10px;
  border-radius:4px;
  color:var(--text);
  text-decoration:none;
  font-size:13px;
  border-left:3px solid transparent;
}
.toc-list a:hover{background:var(--accent-soft);color:var(--accent2);}
.toc-list a.active{background:var(--accent-soft);color:var(--navy);border-left:3px solid var(--navy);font-weight:600;}
main{flex:1;min-width:0;}
.section-card{
  background:var(--panel);
  border:1px solid var(--border);
  border-left:4px solid var(--navy);
  border-radius:6px;
  padding:24px;
  margin-bottom:18px;
  box-shadow:0 2px 10px rgba(15,39,64,0.06);
  scroll-margin-top:80px;
}
.section-card h2{
  margin:0 0 14px 0;
  font-size:18px;
  color:var(--navy-deep);
  padding-bottom:10px;
  border-bottom:2px solid var(--border);
}
.section-card h3{
  font-size:15px;
  color:var(--navy);
  margin:20px 0 10px 0;
}
.section-card .body-text{
  font-size:14.5px;
  line-height:1.9;
  white-space:pre-wrap;
}
.callout{
  margin:16px 0;
  padding:14px 16px;
  border-radius:6px;
  border-left:4px solid;
  font-size:14px;
  line-height:1.8;
}
.callout-note{background:var(--accent-soft);border-color:var(--accent2);}
.callout-example{background:#F4F2E8;border-color:var(--flag);}
.callout-warning{background:var(--incorrect-soft);border-color:var(--incorrect);}
.callout-formula{
  background:var(--navy-deep);
  color:#EAF1FA;
  border-color:var(--flag);
  font-family:'JetBrains Mono',monospace;
  overflow-x:auto;
}
.callout-title{
  font-weight:700;
  font-size:12.5px;
  text-transform:uppercase;
  letter-spacing:.04em;
  margin-bottom:8px;
  display:block;
}
.callout-note .callout-title{color:var(--accent2);}
.callout-example .callout-title{color:var(--flag);}
.callout-warning .callout-title{color:var(--incorrect);}
.callout-formula .callout-title{color:#C9DCF0;}
.image-block{
  margin:18px 0;
  text-align:center;
}
.image-block img{
  max-width:100%;
  height:auto;
  border-radius:6px;
  border:1px solid var(--border);
  box-shadow:0 2px 10px rgba(15,39,64,0.08);
}
.image-block .image-caption{
  font-size:12.5px;
  color:var(--text-soft);
  margin-top:8px;
  font-style:italic;
}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:13.5px;}
table th{background:var(--navy-deep);color:#F2EFE6;padding:9px 12px;text-align:left;}
table td{padding:8px 12px;border-bottom:1px solid var(--border);}
table tr:nth-child(even) td{background:#F4F2E8;}
@media (max-width:800px){
  .layout{flex-direction:column;}
  .sidebar{width:100%;}
  .sidebar-panel{position:static;max-height:none;}
}

</style>
<style>

/* ===== Readability & diagram enhancements ===== */
#readProgress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--flag),var(--accent2));width:0%;z-index:999;transition:width .12s ease;}

#backToTop{
  position:fixed;bottom:24px;right:24px;width:44px;height:44px;border-radius:50%;
  background:var(--navy-deep);color:#F2EFE6;border:none;cursor:pointer;font-size:18px;
  box-shadow:0 4px 14px rgba(15,39,64,0.3);display:none;align-items:center;justify-content:center;
  z-index:998;opacity:0;transition:opacity .2s ease, transform .2s ease;
}
#backToTop:hover{transform:translateY(-2px);}
#backToTop.show{display:flex;opacity:1;}

#fontCtrl{display:flex;gap:6px;align-items:center;}
#fontCtrl button{
  border:1.5px solid rgba(242,239,230,0.5);background:rgba(255,255,255,0.9);color:var(--navy);
  width:32px;height:32px;border-radius:4px;font-size:13px;cursor:pointer;font-weight:700;
  font-family:'Sarabun',sans-serif;
}
#fontCtrl button:hover{background:#fff;}

.section-card{opacity:0;transform:translateY(14px);transition:opacity .55s ease, transform .55s ease;}
.section-card.revealed{opacity:1;transform:translateY(0);}
@media (prefers-reduced-motion: reduce){
  .section-card{opacity:1;transform:none;transition:none;}
}

.section-card .body-text{font-size:calc(14.5px * var(--fontScale)) !important;}
.section-card h2{font-size:calc(18px * var(--fontScale)) !important;}
.section-card h3{font-size:calc(15px * var(--fontScale)) !important;}
.callout{font-size:calc(14px * var(--fontScale)) !important;}
table{font-size:calc(13.5px * var(--fontScale)) !important;}

.callout-note .callout-title::before{content:"📝 ";}
.callout-example .callout-title::before{content:"💡 ";}
.callout-warning .callout-title::before{content:"⚠️ ";}
.callout-formula .callout-title::before{content:"∑ ";}

/* ==== Animated sequence / flow diagrams ==== */
.diagram-block{
  margin:20px 0;padding:16px 18px 14px;background:#FBFAF6;border:1px solid var(--border);
  border-radius:8px;
}
.diagram-block h4{
  margin:0 0 12px 0;font-size:calc(14.5px * var(--fontScale));color:var(--navy-deep);
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
}
.diagram-play-btn{
  border:1.5px solid var(--accent2);background:#fff;color:var(--accent2);padding:5px 12px;
  border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Sarabun',sans-serif;
  flex-shrink:0;
}
.diagram-play-btn:hover{background:var(--accent-soft);}
.diagram-svg-wrap{overflow-x:auto;}
.diagram-svg{display:block;margin:0 auto;min-width:420px;}
.diagram-actor-label{font-family:'Sarabun',sans-serif;font-size:11.5px;font-weight:600;fill:var(--navy-deep);}
.diagram-lifeline{stroke:var(--border);stroke-width:1.5;stroke-dasharray:3,3;}
.diagram-node-box{fill:var(--panel);stroke:var(--navy);stroke-width:1.3;}
.diagram-arrow-path{fill:none;stroke:var(--accent2);stroke-width:2;marker-end:url(#arrowhead);}
.diagram-arrow-label{font-family:'JetBrains Mono',monospace;font-size:10.5px;fill:var(--navy-deep);}
.diagram-glow-dot{fill:var(--flag);filter:url(#glowFilter);opacity:0;}
.diagram-steps-list{list-style:none;margin:12px 0 0;padding:0;font-size:calc(13px * var(--fontScale));line-height:1.7;}
.diagram-steps-list li{padding:6px 10px;border-left:3px solid transparent;border-radius:4px;transition:background .3s ease, border-color .3s ease;}
.diagram-steps-list li.step-active{background:var(--accent-soft);border-left-color:var(--flag);}
.diagram-steps-list .step-num{
  display:inline-block;width:20px;height:20px;border-radius:50%;background:var(--navy);color:#fff;
  text-align:center;line-height:20px;font-size:11px;margin-right:8px;font-family:'JetBrains Mono',monospace;
}

</style>
</head>

<filter id="glowFilter" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.2" result="blur"></feGaussianBlur><feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter>
</defs>
</svg>

: Application, Presentation, Session, Transport, Network, Data Link, Physical"}, {"type": "subheading", "content": "การแบ่งกลุ่มการทำงาน: Host Layers vs Media Layers"}, {"type": "note", "content": "Host Layers (Layer 7-4): เกี่ยวข้องกับแอปพลิเคชันและการสื่อสารระหว่างต้นทาง-ปลายทาง (Application-to-Application) ทำงานอยู่บนเครื่อง Host โดยตรง"}, {"type": "note", "content": "Media Layers (Layer 3-1): รับผิดชอบการนำส่งข้อมูลผ่านตัวกลาง (End-to-End Delivery) ทำหน้าที่หาเส้นทางและนำส่งข้อมูลจริงผ่านสื่อกลาง (Bits)"}]}, {"title": "2. Layer 7-5: กลุ่ม Application, Presentation, Session", "body": "สามเลเยอร์บนสุดของ OSI Model ล้วนมี PDU (หน่วยข้อมูล) เป็น Data เหมือนกัน แต่ทำหน้าที่ต่างกัน", "blocks": [{"type": "subheading", "content": "Layer 7: Application Layer"}, {"type": "table", "content": "<table><tr><th>หัวข้อ</th><th>รายละเอียด</th></tr><tr><td>Core Mission</td><td>จุดเชื่อมต่อระหว่างโปรแกรมประยุกต์กับเครือข่าย (ไม่ใช่ตัวโปรแกรมเอง แต่เป็นบริการที่โปรแกรมเรียกใช้ในการสื่อสาร)</td></tr><tr><td>Key Protocols</td><td>FTP, HTTP, SMTP, POP3</td></tr><tr><td>PDU</td><td>Data</td></tr></table>"}, {"type": "subheading", "content": "Layer 6: Presentation Layer"}, {"type": "table", "content": "<table><tr><th>หัวข้อ</th><th>รายละเอียด</th></tr><tr><td>Core Mission</td><td>ทำหน้าที่ 'นักแปล' (Translator) แปลงรูปแบบข้อมูล และเข้ารหัสข้อมูล (Encryption) ให้พร้อมส่งเข้าตัวกลาง</td></tr><tr><td>Key Formats/Standards</td><td>ASCII Text, EBCDIC, Binary, JPEG</td></tr><tr><td>PDU</td><td>Data</td></tr></table>"}, {"type": "subheading", "content": "Layer 5: Session Layer"}, {"type": "table", "content": "<table><tr><th>หัวข้อ</th><th>รายละเอียด</th></tr><tr><td>Core Mission</td><td>ควบคุมการสนทนา (Dialog Controller) ทำหน้าที่เปิด (Establish) คงไว้ (Maintain) และปิด (Terminate) การเชื่อมต่อระหว่างสองฝั่ง</td></tr><tr><td>Key APIs/Protocols</td><td>Socket, Windows Socket, API</td></tr><tr><td>PDU</td><td>Data</td></tr></table>"}]}, {"title": "3. Layer 4: Transport Layer", "body": "Transport Layer ทำหน้าที่ตัดแบ่งข้อมูลก้อนใหญ่เป็นชิ้นเล็ก ๆ (Segmentation) และควบคุมความน่าเชื่อถือในการส่งข้อมูลจากต้นทางถึงปลายทาง (End-to-End Delivery) หน่วยข้อมูลของ Layer นี้เรียกว่า Segment", "blocks": [{"type": "table", "content": "<table><tr><th>หัวข้อ</th><th>รายละเอียด</th></tr><tr><td>Core Mission</td><td>ตัดแบ่งข้อมูลเป็นชิ้นเล็ก (Segmentation) และควบคุมการส่งข้อมูลให้ครบถ้วนถูกต้อง (Error Recovery/Reliability)</td></tr><tr><td>Key Protocols</td><td>TCP (Reliable/Connection-Oriented), UDP (Fast/Connectionless)</td></tr><tr><td>PDU</td><td>Segment (เซกเมนต์)</td></tr></table>"}, {"type": "subheading", "content": "TCP vs UDP"}, {"type": "table", "content": "<table><tr><th>คุณสมบัติ</th><th>TCP</th><th>UDP</th></tr><tr><td>รูปแบบการเชื่อมต่อ</td><td>Connection-oriented (3-Way Handshake)</td><td>Connectionless (ส่งได้เลย)</td></tr><tr><td>ความน่าเชื่อถือ</td><td>สูงมาก (การันตีการส่งมอบ)</td><td>ต่ำ (Best-Effort ไม่รับประกัน)</td></tr><tr><td>การเรียงลำดับ</td><td>มี Sequence Number</td><td>ไม่มี (ข้อมูลอาจถึงสลับลำดับ)</td></tr><tr><td>การตรวจสอบ Error</td><td>ส่งใหม่เมื่อข้อมูลสูญหาย (Retransmission)</td><td>ทิ้งข้อมูลที่พัง ไม่ส่งใหม่ (Discard)</td></tr><tr><td>เหมาะสำหรับ</td><td>Web Browsing (HTTP/S), Email, File Transfer</td><td>Live Streaming, VoIP, Online Gaming</td></tr></table>"}, {"type": "example", "content": "เปรียบเทียบ: TCP เหมือนรถบรรทุกขนของมีระบบติดตามและยืนยันของถึงปลายทางแน่นอน ส่วน UDP เหมือนมอเตอร์ไซค์ที่วิ่งเร็วแต่ไม่รับประกันว่าของจะถึงครบ"}, {"type": "diagram", "layout": "lifeline", "title": "TCP 3-Way Handshake (ทบทวน Layer 4)", "actors": ["Client", "Server"], "steps": [{"from": 0, "to": 1, "label": "SYN", "note": "ขอเริ่มเชื่อมต่อ"}, {"from": 1, "to": 0, "label": "SYN + ACK", "note": "ตอบรับและ synchronize กลับ"}, {"from": 0, "to": 1, "label": "ACK", "note": "ยืนยัน เริ่มส่งข้อมูลที่ Layer 4 ได้"}]}]}, {"title": "4. Layer 3: Network Layer", "body": "Network Layer รับผิดชอบการหาเส้นทาง (Routing) และการกำหนดที่อยู่เชิงตรรกะ (Logical Addressing) หน่วยข้อมูลของ Layer นี้เรียกว่า Packet", "blocks": [{"type": "table", "content": "<table><tr><th>หัวข้อ</th><th>รายละเอียด</th></tr><tr><td>Core Mission</td><td>หาเส้นทาง (Routing) และกำหนดที่อยู่เชิงตรรกะ (Logical Addressing) เพื่อส่งข้อมูลข้ามเครือข่ายที่แตกต่างกัน</td></tr><tr><td>Key Protocols/Hardware</td><td>IP Protocol (IP Address), Router (เราท์เตอร์), Layer 3 Switch</td></tr><tr><td>PDU</td><td>Packet (แพ็กเก็ต)</td></tr></table>"}, {"type": "subheading", "content": "การหาเส้นทาง (Routing)"}, {"type": "note", "content": "Router ใช้ Routing Table เพื่อหาเส้นทางที่ดีที่สุด (Best Path Selection) โดยพิจารณาจากตัวชี้วัดต่าง ๆ เช่น Hop Count และความเร็วของเส้นทาง — โปรโตคอลด้านการหาเส้นทางที่พบบ่อยได้แก่ OSPF, EIGRP, BGP"}, {"type": "diagram", "layout": "lifeline", "title": "การเดินทางของ Packet ข้าม Router (Frame เปลี่ยน แต่ Packet เดิม)", "actors": ["Host A", "Router 1", "Router 2", "Host B"], "steps": [{"from": 0, "to": 1, "label": "Frame#1 (MAC A→R1, IP A→B)", "note": "IP ปลายทางไม่เปลี่ยนตลอดเส้นทาง"}, {"from": 1, "to": 2, "label": "Frame#2 (MAC R1→R2, IP เดิม)", "note": "router ห่อ frame ใหม่ทุก hop"}, {"from": 2, "to": 3, "label": "Frame#3 (MAC R2→B, IP เดิม)", "note": "ถึงปลายทางด้วย IP เดิมตั้งแต่ต้น"}]}]}, {"title": "5. Layer 2: Data Link Layer", "body": "Data Link Layer ทำหน้าที่นำส่งข้อมูลภายในเครือข่ายท้องถิ่นเดียวกัน (LAN) โดยใช้ MAC Address และตรวจสอบความถูกต้องของข้อมูลด้วย Error Control หน่วยข้อมูลของ Layer นี้เรียกว่า Frame", "blocks": [{"type": "table", "content": "<table><tr><th>หัวข้อ</th><th>รายละเอียด</th></tr><tr><td>Core Mission</td><td>นำส่งข้อมูลด้วย MAC Address ภายในเครือข่ายท้องถิ่นเดียวกัน (Node-to-Node / Hop-to-Hop delivery)</td></tr><tr><td>Key Protocols/Hardware</td><td>Ethernet, MAC Address, Switch (สวิตช์), CSMA/CD, NIC</td></tr><tr><td>PDU</td><td>Frame (เฟรม)</td></tr></table>"}, {"type": "subheading", "content": "โครงสร้าง Frame: Header และ Trailer"}, {"type": "note", "content": "Frame ประกอบด้วย Header (MAC ต้นทาง/ปลายทาง) และ Trailer ที่มี FCS (Frame Check Sequence) สำหรับตรวจสอบความถูกต้องของข้อมูลแบบ Hop-by-Hop — ถ้าข้อมูลถูกรบกวน (Corrupted) ระหว่างทาง Switch ปลายทางของ Hop นั้นจะทิ้ง Frame นั้นทันที"}, {"type": "example", "content": "เปรียบเทียบ: Switch เปรียบเสมือนบุรุษไปรษณีย์ที่ฉลาด (Smart Postman) จดจำว่า MAC Address ไหนอยู่ที่พอร์ตใดในตาราง MAC Address Table เพื่อส่งข้อมูลตรงไปยังปลายทางในวงแลนเดียวกัน"}]}, {"title": "6. Layer 1: Physical Layer", "body": "Physical Layer เป็นชั้นล่างสุด ทำหน้าที่แปลงข้อมูลดิจิทัลให้เป็นสัญญาณไฟฟ้า แสง หรือคลื่นวิทยุ เพื่อส่งผ่านตัวกลางทางกายภาพจริง หน่วยข้อมูลของ Layer นี้เรียกว่า Bits (0 และ 1)", "blocks": [{"type": "table", "content": "<table><tr><th>หัวข้อ</th><th>รายละเอียด</th></tr><tr><td>Core Mission</td><td>แปลงข้อมูลดิจิทัลให้เป็นสัญญาณไฟฟ้า (Electrical Signals) แสง หรือคลื่นเพื่อส่งผ่านตัวกลางทางกายภาพ</td></tr><tr><td>Key Standards/Hardware</td><td>UTP, RJ45, RS232, Hub, Repeater</td></tr><tr><td>PDU</td><td>Bits (บิต)</td></tr></table>"}]}, {"title": "7. ตารางสรุป OSI Model (Master Cheat Sheet)", "body": "ตารางสรุปทั้ง 7 Layer พร้อม PDU, Protocol และอุปกรณ์ที่ทำงานอยู่ในแต่ละชั้น ใช้เป็นตารางอ้างอิงหลักในการทบทวน", "blocks": [{"type": "table", "content": "<table><tr><th>Layer</th><th>Function</th><th>PDU</th><th>Protocols</th><th>Hardware</th></tr><tr><td>7 - Application</td><td>Network Applications</td><td>Data</td><td>HTTP, FTP, SMTP</td><td>PC/Server</td></tr><tr><td>6 - Presentation</td><td>Format & Encryption</td><td>Data</td><td>ASCII, JPEG</td><td>PC/Server</td></tr><tr><td>5 - Session</td><td>Dialog Control</td><td>Data</td><td>API, Sockets</td><td>PC/Server</td></tr><tr><td>4 - Transport</td><td>End-to-End Delivery</td><td>Segment</td><td>TCP, UDP</td><td>Firewall</td></tr><tr><td>3 - Network</td><td>Routing & IP</td><td>Packet</td><td>IP, ICMP</td><td>Router, L3 Switch</td></tr><tr><td>2 - Data Link</td><td>MAC & Local Delivery</td><td>Frame</td><td>Ethernet, IEEE 802.3</td><td>Switch, NIC</td></tr><tr><td>1 - Physical</td><td>Signals & Media</td><td>Bits</td><td>RJ45, UTP Cable</td><td>Hub, Cables</td></tr></table>"}, {"type": "subheading", "content": "เทคนิคช่วยจำ: อุปกรณ์เครือข่ายทำงานอยู่ที่ Layer ไหน"}, {"type": "note", "content": "Top Tier (Layer 3-Network): Router — ทำงานด้วย IP Address"}, {"type": "note", "content": "Middle Tier (Layer 2-Data Link): Switch — ทำงานด้วย MAC Address"}, {"type": "note", "content": "Bottom Tier (Layer 1-Physical): Hub — ทำงานด้วยสัญญาณไฟฟ้าล้วน ๆ ไม่รู้จัก Address ใด ๆ"}, {"type": "subheading", "content": "OSI Model vs TCP/IP Model"}, {"type": "note", "content": "OSI Model เป็น 'มาตรฐานอ้างอิง' (Reference Model) เชิงทฤษฎีที่ใช้อธิบายและสอนแนวคิดเครือข่ายอย่างละเอียด ส่วน TCP/IP Model คือมาตรฐานที่ใช้งานจริงในโลกอินเทอร์เน็ตปัจจุบัน โดยรวม 3 Layer บนของ OSI (Application-Presentation-Session) เข้าเป็น Application Layer เดียว และรวม Data Link กับ Physical เป็น Network Interface Layer เดียว"}]}, {"title": "8. Encapsulation & Decapsulation: การเดินทางของข้อมูล", "body": "เมื่อส่งข้อมูล ข้อมูลจะไหลจาก Layer 7 ลงไป Layer 1 (ขาลง) โดยแต่ละชั้นจะห่อหุ้ม (Encapsulation) Header ของตัวเองทับลงไปเรื่อย ๆ จนกลายเป็น Raw bits (0/1) ที่ส่งผ่านสายเคเบิล ฝั่งผู้รับจะทำกระบวนการย้อนกลับ คือถอด Header ออกทีละชั้น (Decapsulation) จาก Layer 1 ขึ้นไป Layer 7 จนซอฟต์แวร์อ่านข้อมูลนั้นได้ในที่สุด", "blocks": [{"type": "image", "src": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAlgCWAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wAARCAIyA+gDASIAAhEBAxEB/8QAHAABAAEFAQEAAAAAAAAAAAAAAAECAwUGBwQI/8QAZBAAAQMDAQMECA8LCAcHBAEFAQACAwQFEQYSITEHE0FRFBYiYXGRsdEVMjM1UlNUcnN0gZKTstIIFyM0NkJVVpShwUNERWJ1laKzJCU4RoKj4SYnY2TCw+IoN2Xwg4QYR/G0/8QAGwEBAQADAQEBAAAAAAAAAAAAAAECAwQFBgf/xAAuEQEAAgECBQQCAwEAAgMBAAAAAQIRA1EEEhMhMRQyQVIzcQUVImEjNEKBkdH/2gAMAwEAAhEDEQA/APosSOPSm27rVI4KVWCecd1pzjutUogq5x3WnOO61SiCrnHdac47rVKIKucd1pzjutUogp59/ZYjz3JZtcOnKu7b , "caption": "การแบ่งกลุ่ม IPv4 ตามช่วงตัวเลข Octet แรก"}, {"type": "note", "content": "Class D (224-239): ใช้สำหรับ Multicast"}, {"type": "note", "content": "Class E (240-255): สำรองไว้ใช้ในงานวิจัย"}, {"type": "subheading", "content": "สรุปโครงสร้าง Network vs Host ในแต่ละ Class"}, {"type": "table", "content": "<table><tr><th>คุณสมบัติ</th><th>Class A</th><th>Class B</th><th>Class C</th></tr><tr><td>โครงสร้าง Octet</td><td>N.H.H.H</td><td>N.N.H.H</td><td>N.N.N.H</td></tr><tr><td>บิตนำหน้า</td><td>0</td><td>10</td><td>110</td></tr><tr><td>ช่วง IP ชุดแรก</td><td>1 - 126</td><td>128 - 191</td><td>192 - 223</td></tr><tr><td>จำนวน Host รองรับได้</td><td>มากที่สุด (หลักล้าน)</td><td>ปานกลาง (หลักหมื่น)</td><td>น้อยที่สุด (254 เครื่อง)</td></tr><tr><td>Default Subnet Mask</td><td>255.0.0.0</td><td>255.255.0.0</td><td>255.255.255.0</td></tr></table>"}, {"type": "subheading", "content": "Public IP vs Private IP"}, {"type": "note", "content": "Private IP (IP ส่วนตัว/ปลอม): ใช้ภายในองค์กรเท่านั้น ออกอินเทอร์เน็ตไม่ได้โดยตรง ซ้ำกันได้ระหว่างเครือข่ายที่ไม่เชื่อมกัน"}, {"type": "note", "content": "Public IP (IP จริง): ไม่ซ้ำกันทั่วโลก ใช้สื่อสารบนอินเทอร์เน็ตได้โดยตรง"}, {"type": "formula", "label": "ช่วง Private IP ตาม RFC 1918", "content": "Class A: 10.0.0.0 - 10.255.255.255 | Class B: 172.16.0.0 - 172.31.255.255 | Class C: 192.168.0.0 - 192.168.255.255"}, {"type": "warning", "content": "ที่อยู่พิเศษที่ถูกกันไว้ (Reserved): Loopback Address 127.x.x.x (ทดสอบตัวเครื่อง) และ APIPA/Link-Local 169.254.x.x (เครื่องได้เองอัตโนมัติเมื่อ DHCP Server ไม่ทำงาน)"}]}, {"title": "11. Subnet Mask และกลไกการทำงาน", "body": "Subnet Mask เป็นตัวเลข 32-bit ที่ใช้บอกว่า IP Address ส่วนไหนคือ Network ID และส่วนไหนคือ Host ID โดยบิตที่เป็น 1 หมายถึง Network และบิตที่เป็น 0 หมายถึง Host", "blocks": [{"type": "table", "content": "<table><tr><th></th><th>Octet 1</th><th>Octet 2</th><th>Octet 3</th><th>Octet 4</th></tr><tr><td>Human View</td><td>192</td><td>168</td><td>1</td><td>100</td></tr><tr><td>Subnet Mask (/24)</td><td>255</td><td>255</td><td>255</td><td>0</td></tr><tr><td>Binary Mask</td><td>11111111</td><td>11111111</td><td>11111111</td><td>00000000</td></tr></table>"}, {"type": "subheading", "content": "กลไก Logical AND: เครื่องกรองหาเลขหมู่บ้าน"}, {"type": "note", "content": "เพื่อหาว่า Host อยู่เครือข่ายใด คอมพิวเตอร์นำ IP Address มาทำ Logical AND กับ Subnet Mask ทีละบิต: 1 AND 1 = 1, 1 AND 0 = 0, 0 AND 1 = 0, 0 AND 0 = 0 — ผลลัพธ์ที่ได้คือ Network ID (เบอร์หมู่บ้าน)"}, {"type": "subheading", "content": "Magic Number Scale (ไม่ต้องแปลงเลขฐานสองทุกครั้ง)"}, {"type": "formula", "label": "Magic Number (ค่ากำลังของ 2)", "content": "2^7  2^6  2^5  2^4  2^3  2^2  2^1  2^0 | 128  64   32   16    8    4    2    1"}, {"type": "note", "content": "Key Insight: คอมพิวเตอร์มองเลขฐานสองและมีความสามารถจดจำแบบขวนขวนแหลกเสมอ เพื่อตั้งค่า Subnet Mask ได้ทันทีเมื่อบิตจากซ้ายถูกเซ็ตค่าเป็น 1 ต่อเนื่องกัน โดยไม่ต้องแปลงเลขฐานสองใหม่ทุกครั้ง"}]}, {"title": "12. สูตรทองคำ: หาจำนวน Subnet และ Host + FLSM vs VLSM", "body": "ก่อนเริ่มทำ Lab การคำนวณ Subnetting ต้องจำสูตรหลัก 2 สูตรนี้ให้ขึ้นใจ", "blocks": [{"type": "formula", "label": "กฎการหาจำนวน Subnet", "content": "จำนวน Subnet = 2^n | โดย n = จำนวนบิตที่ขอยืมมา (Borrowed Bits)"}, {"type": "formula", "label": "กฎการหาจำนวน Host", "content": "จำนวน Host ใช้งานได้ = 2^n - 2 | โดย n = จำนวนบิต Host ที่เหลืออยู่"}, {"type": "note", "content": "ทำไมต้อง -2 เสมอ: ต้องหักเบอร์แรกสุด (Network Address) และเบอร์สุดท้าย (Broadcast Address) ออกจากจำนวน Host ที่ใช้งานได้จริงเสมอ"}, {"type": "subheading", "content": "FLSM vs VLSM: วิวัฒนาการของประสิทธิภาพ"}, {"type": "table", "content": "<table><tr><th></th><th>FLSM (Fixed Length)</th><th>VLSM (Variable Length)</th></tr><tr><td>แนวคิด</td><td>แบ่งทุก Subnet ให้มีขนาดเท่ากันทั้งหมด (Classful)</td><td>แบ่ง Subnet แต่ละก้อนให้ขนาดต่างกันตามความต้องการจริง (Classless)</td></tr><tr><td>ตัวอย่าง</td><td>ทุก Subnet ได้ 500 Hosts เท่ากันหมด แม้บาง Subnet ต้องการแค่ 200 Hosts</td><td>Subnet ที่ต้องการ 500, 200, 100 Hosts ได้ขนาดพอดีตามที่ต้องการ</td></tr><tr><td>ข้อเสีย/ข้อดี</td><td>สูญเปล่า IP จำนวนมาก (Wasted IP)</td><td>ใช้ IP คุ้มค่าสูงสุด (Maximum Efficiency)</td></tr></table>"}]}, {"title": "13. LAB ตัวอย่าง: การคำนวณ Subnetting จริง", "body": "รวมตัวอย่างการคำนวณ Subnetting แบบ Step-by-step ทั้ง FLSM และ VLSM เพื่อฝึกความเข้าใจ", "blocks": [{"type": "subheading", "content": "LAB 1: Basic FLSM (/26)"}, {"type": "example", "content": "โจทย์: แบ่งเครือข่าย Class C 192.168.100.0/24 ออกเป็น Subnet ย่อย โดยขอยืมบิตมา 2 บิต (กลายเป็น /26) — New Subnet Mask = 255.255.255.192 (มาจาก Magic Number 128+64) — จำนวน Subnets = 2² = 4 เครือข่ายย่อย — จำนวน Hosts = 2⁶ - 2 = 62 เครื่องต่อเครือข่าย"}, {"type": "table", "content": "<table><tr><th>Subnet</th><th>ช่วง Address</th><th>ใช้งานจริง (Host Range)</th></tr><tr><td>Subnet 1</td><td>192.168.100.0 - .63</td><td>1-62</td></tr><tr><td>Subnet 2</td><td>192.168.100.64 - .127</td><td>65-126</td></tr><tr><td>Subnet 3</td><td>192.168.100.128 - .191</td><td>129-190</td></tr><tr><td>Subnet 4</td><td>192.168.100.192 - .255</td><td>193-254</td></tr></table>"}, {"type": "subheading", "content": "LAB 2: การเพิ่ม Subnet ด้วย /27 และ /29"}, {"type": "table", "content": "<table><tr><th></th><th>/27</th><th>/29</th></tr><tr><td>ยืมบิต</td><td>3 บิต</td><td>5 บิต</td></tr><tr><td>Host bits เหลือ</td><td>5 บิต</td><td>3 บิต</td></tr><tr><td>Subnet Mask</td><td>255.255.255.224</td><td>255.255.255.248</td></tr><tr><td>จำนวน Subnets</td><td>2³ = 8</td><td>2⁵ = 32</td></tr><tr><td>จำนวน Hosts</td><td>2⁵-2 = 30</td><td>2³-2 = 6</td></tr><tr><td>Block Size (กระโดดทีละ)</td><td>32 (.0, .32, .64...)</td><td>8 (.0, .8, .16...)</td></tr></table>"}, {"type": "note", "content": "ยิ่งยืมบิตเยอะ Subnet ยิ่งเพิ่มขึ้น แต่พื้นที่ Host จะหดเล็กลงอย่างรวดเร็ว"}, {"type": "subheading", "content": "LAB 3: Advanced VLSM Concept (Tetris Method)"}, {"type": "example", "content": "โจทย์: บริษัทได้ IP 172.16.0.0/16 (Class B) โดยมีความต้องการ: HQ 500 Hosts, Branch A 200 Hosts, Branch B 100 Hosts, WAN Links ต้องการแค่ 2 Hosts ต่อเส้น — กลยุทธ์: หั่นก้อนใหญ่ก่อน (500 Hosts) แล้วนำพื้นที่ที่เหลือมาหั่นย่อยลงเรื่อย ๆ (Tetris Method)"}, {"type": "table", "content": "<table><tr><th>ขั้นตอน</th><th>ความต้องการ</th><th>คำนวณ</th><th>ผลลัพธ์ที่จัดสรร</th></tr><tr><td>Step 1</td><td>500 Hosts</td><td>ต้องการ 9 host bits (2⁹-2=510) เหลือ /23</td><td>172.16.0.0/23</td></tr><tr><td>Step 2</td><td>200 Hosts</td><td>ต้องการ 8 host bits (2⁸-2=254) เหลือ /24</td><td>172.16.4.0/24</td></tr><tr><td>Step 3</td><td>100 Hosts</td><td>ต้องการ 7 host bits (2⁷-2=126) เหลือ /25</td><td>172.16.7.0/25</td></tr></table>"}, {"type": "note", "content": "หลักการ: จัดสรรพื้นที่ให้ความต้องการที่ใหญ่ที่สุดก่อนเสมอ เพื่อให้พื้นที่ IP ถูกใช้งานอย่างคุ้มค่าสูงสุด"}]}, {"title": "14. กฎเหล็กของทุก Subnet, Default Gateway และ NAT", "body": "ในทุก Subnet จะมี IP Address ที่ 'ห้ามนำไปแจกให้เครื่องใช้งาน' อยู่เสมอ 2 ตำแหน่ง คือหัวและท้ายของวง", "blocks": [{"type": "image", "src": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAlgCWAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wAARCAIyA+gDASIAAhEBAxEB/8QAHAABAAICAwEAAAAAAAAAAAAAAAEHBAYCAwUI/8QAYRAAAAUDAAQFDAsMBwYGAgIDAAECAwQFBhEHEiExE0FRlNEUFRYXIlVWYXGRkpMIMlJTVHN0gaGxshgjNDU3OEJys8HC4SQzNkN1g9IlJidGYuJERWNkgvAoomajw/GE/8QAGwEBAQEBAQEBAQAAAAAAAAAAAAEDAgQFBgf/xAA6EQACAQIDBQYGAgAGAgMBAAAAAQIDEQQSURMUITFSBRUzQWGRFiIycYGhNFMGI8HR8PEkQkRi4bH/2gAMAwEAAhEDEQA/APobh3OUvMHDucpeYdYDO5Ts4dzlLzBw7nKXmHWAXB2cO5yl5g4dzlLzDrALg7OHc5S8wcO5yl5h1gFwdnDucpeYOHc5S8w6wC4Ozh3OX6A4dzlLzDrALg7OHc5S8wcO5yl5h1gFwdnDucpeYOHc5S8w6wC4Ozh3OUvMHDucpeYdYBcHZw7nKXmDh3OUvMOsAuDs4dzlLzBw7nKXmHWAXB2cO5yl5g4dzlLzDrALg7OHc5S8wcO5yl5h1gFwdnDucpeYOHc5S8w6wC4Ozh3OUvMHDucpeYdYBcHZw7nKXmDh3OUvMOsAuDs4dzlLzBw7nKXmHWAXB2cO5yl5g4dzlLzDrALg7OHc5S8wcO5yl5h1gFwdnDucpeYOHc5S8w6wC4Ozh3OUvMHDucpeYdYBcHZw7nKXmDh3OUvMOsAuDs4dzlL function renderTOC(){
  const toc = document.getElementById("tocList");
  toc.innerHTML = "";
  SECTIONS.forEach((sec, idx)=>{
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = "#section_"+idx;
    a.textContent = sec.title;
    a.dataset.idx = idx;
    li.appendChild(a);
    toc.appendChild(li);
  });
}

function escapeXml(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function fmtTspans(text, x){
  return String(text==null?"":text).split("\n").map(function(line,i){
    return '<tspan x="'+x+'" dy="'+(i===0?0:15)+'">'+escapeXml(line)+'</tspan>';
  }).join("");
}

function renderDiagramBlock(block, secIdx, blockIdx){
  const uid = "dg_"+secIdx+"_"+blockIdx;
  const layout = block.layout || "lifeline";
  const actors = block.actors || [];
  const steps = block.steps || [];
  const n = actors.length;
  const W = 680;
  const margin = 76;
  const nodesX = [];
  for(let i=0;i<n;i++){ nodesX.push(n===1 ? W/2 : margin + i*((W-2*margin)/Math.max(1,n-1))); }
  let inner = "";
  let H = 0;

  if(layout === "flow"){
    const boxY = 50, boxH = 46;
    const boxW = Math.min(128, Math.max(70,(W-2*margin)/Math.max(1,n-1)-14));
    H = 168;
    actors.forEach(function(a,i){
      inner += '<rect class="diagram-node-box" x="'+(nodesX[i]-boxW/2)+'" y="'+boxY+'" width="'+boxW+'" height="'+boxH+'" rx="7"></rect>';
      inner += '<text class="diagram-actor-label" x="'+nodesX[i]+'" y="'+(boxY+boxH/2-6)+'" text-anchor="middle">'+fmtTspans(a, nodesX[i])+'</text>';
    });
    steps.forEach(function(st,i){
      const x1 = nodesX[st.from]+boxW/2+3, x2 = nodesX[st.to]-boxW/2-3;
      const y = boxY+boxH/2;
      const pid = uid+"_p"+i, mid = uid+"_m"+i;
      inner += '<path id="'+pid+'" class="diagram-arrow-path" d="M '+x1+' '+y+' L '+x2+' '+y+'"></path>';
      inner += '<text class="diagram-arrow-label" x="'+((x1+x2)/2)+'" y="'+(boxY-12)+'" text-anchor="middle">'+escapeXml(st.label||"")+'</text>';
      inner += '<circle id="'+mid+'d" class="diagram-glow-dot" r="6.5" cx="'+x1+'" cy="'+y+'">'
             + '<animateMotion id="'+mid+'" begin="indefinite" dur="0.75s" fill="freeze" path="M '+x1+' '+y+' L '+x2+' '+y+'"></animateMotion>'
             + '<animate attributeName="opacity" begin="'+mid+'.begin" dur="0.05s" from="0" to="1" fill="freeze"></animate>'
             + '<animate attributeName="opacity" begin="'+mid+'.end" dur="0.5s" from="1" to="0" fill="freeze"></animate>'
             + '</circle>';
    });
  } else {
    const rowH = 64, topY = 12, boxH = 38;
    H = topY + boxH + steps.length*rowH + 26;
    const boxW = Math.min(160, Math.max(80,(W-2*margin)/Math.max(1,n-1)-10));
    actors.forEach(function(a,i){
      inner += '<rect class="diagram-node-box" x="'+(nodesX[i]-boxW/2)+'" y="'+topY+'" width="'+boxW+'" height="'+boxH+'" rx="7"></rect>';
      inner += '<text class="diagram-actor-label" x="'+nodesX[i]+'" y="'+(topY+boxH/2-6)+'" text-anchor="middle">'+fmtTspans(a, nodesX[i])+'</text>';
      inner += '<line class="diagram-lifeline" x1="'+nodesX[i]+'" y1="'+(topY+boxH)+'" x2="'+nodesX[i]+'" y2="'+(H-8)+'"></line>';
    });
    steps.forEach(function(st,i){
      const y = topY+boxH+22 + i*rowH;
      const x1 = nodesX[st.from], x2 = nodesX[st.to];
      const pid = uid+"_p"+i, mid = uid+"_m"+i;
      inner += '<path id="'+pid+'" class="diagram-arrow-path" d="M '+x1+' '+y+' L '+x2+' '+y+'"></path>';
      inner += '<text class="diagram-arrow-label" x="'+((x1+x2)/2)+'" y="'+(y-9)+'" text-anchor="middle">'+escapeXml(st.label||"")+'</text>';
      inner += '<circle id="'+mid+'d" class="diagram-glow-dot" r="6.5" cx="'+x1+'" cy="'+y+'">'
             + '<animateMotion id="'+mid+'" begin="indefinite" dur="0.75s" fill="freeze" path="M '+x1+' '+y+' L '+x2+' '+y+'"></animateMotion>'
             + '<animate attributeName="opacity" begin="'+mid+'.begin" dur="0.05s" from="0" to="1" fill="freeze"></animate>'
             + '<animate attributeName="opacity" begin="'+mid+'.end" dur="0.5s" from="1" to="0" fill="freeze"></animate>'
             + '</circle>';
    });
  }

  const svg = '<svg class="diagram-svg" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" preserveAspectRatio="xMidYMid meet">'+inner+'</svg>';

  let stepsHtml = '<ol class="diagram-steps-list">';
  steps.forEach(function(st,i){
    stepsHtml += '<li><span class="step-num">'+(i+1)+'</span><strong>'+escapeXml(st.label||"")+'</strong>'+(st.note?(' — '+escapeXml(st.note)):'')+'</li>';
  });
  stepsHtml += '</ol>';

  return '<div class="diagram-block" id="'+uid+'">'
       + '<h4><span>🔀 '+escapeXml(block.title||"")+'</span><button class="diagram-play-btn" data-diagram-id="'+uid+'">&#9654; เล่นแอนิเมชัน / Play animation</button></h4>'
       + '<div class="diagram-svg-wrap">'+svg+'</div>'
       + stepsHtml
       + '</div>';
}

function diagramPlay(containerId){
  const wrap = document.getElementById(containerId);
  if(!wrap) return;
  const svg = wrap.querySelector('svg');
  const paths = svg.querySelectorAll('.diagram-arrow-path');
  const dots = svg.querySelectorAll('.diagram-glow-dot');
  const items = wrap.querySelectorAll('.diagram-steps-list li');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  items.forEach(function(li){ li.classList.remove('step-active'); });
  if(reduced){ return; }
  const stepDur = 850;
  paths.forEach(function(p){
    const len = p.getTotalLength();
    p.style.transition = 'none';
    p.style.strokeDasharray = len;
    p.style.strokeDashoffset = len;
  });
  void svg.getBoundingClientRect();
  paths.forEach(function(p,i){
    setTimeout(function(){
      p.style.transition = 'stroke-dashoffset '+(stepDur-100)+'ms ease';
      p.style.strokeDashoffset = 0;
      const anim = dots[i] ? dots[i].querySelector('animateMotion') : null;
      if(anim){ try{ anim.beginElement(); }catch(e){} }
      if(items[i]) items[i].classList.add('step-active');
    }, i*stepDur);
  });
}

function wireDiagramButtons(){
  document.querySelectorAll('.diagram-play-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ diagramPlay(btn.dataset.diagramId); });
  });
}

function renderContent(){
  const main = document.getElementById("mainArea");
  main.innerHTML = "";
  SECTIONS.forEach((sec, idx)=>{
    const card = document.createElement("div");
    card.className = "section-card";
    card.id = "section_"+idx;
    let html = "<h2>"+sec.title+"</h2>";
    if(sec.body){
      html += '<div class="body-text">'+sec.body+'</div>';
    }
    (sec.blocks || []).forEach((block, bi)=>{
      if(block.type === "note"){
        html += '<div class="callout callout-note"><span class="callout-title">หมายเหตุ / Note</span>'+escapeXml(block.content)+'</div>';
      } else if(block.type === "example"){
        html += '<div class="callout callout-example"><span class="callout-title">ตัวอย่าง / Example</span>'+escapeXml(block.content)+'</div>';
      } else if(block.type === "warning"){
        html += '<div class="callout callout-warning"><span class="callout-title">ข้อควรระวัง / Warning</span>'+escapeXml(block.content)+'</div>';
      } else if(block.type === "formula"){
        html += '<div class="callout callout-formula"><span class="callout-title">'+(block.label || "สูตร / Formula")+'</span>'+escapeXml(block.content)+'</div>';
      } else if(block.type === "subheading"){
        html += '<h3>'+block.content+'</h3>';
      } else if(block.type === "table"){
        html += block.content;
      } else if(block.type === "image"){
        html += '<div class="image-block"><img src="'+block.src+'" alt="'+(block.alt || "")+'" loading="lazy">';
        if(block.caption){
          html += '<div class="image-caption">'+block.caption+'</div>';
        }
        html += '</div>';
      } else if(block.type === "diagram"){
        html += renderDiagramBlock(block, idx, bi);
      }
    });
    card.innerHTML = html;
    main.appendChild(card);
  });

  if(window.renderMathInElement){
    renderMathInElement(main, {
      delimiters: [
        {left: "$$", right: "$$", display: true},
        {left: "$", right: "$", display: false}
      ]
    });
  }
}

function setupScrollSpy(){
  const links = document.querySelectorAll(".toc-list a");
  const sections = document.querySelectorAll(".section-card");
  window.addEventListener("scroll", ()=>{
    let currentIdx = 0;
    sections.forEach((sec, idx)=>{
      const rect = sec.getBoundingClientRect();
      if(rect.top <= 100) currentIdx = idx;
    });
    links.forEach(l=>l.classList.remove("active"));
    if(links[currentIdx]) links[currentIdx].classList.add("active");
  });
}

function setupReveal(){
  const cards = document.querySelectorAll('.section-card');
  if(!('IntersectionObserver' in window)){
    cards.forEach(function(c){ c.classList.add('revealed'); });
    return;
  }
  const io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){ e.target.classList.add('revealed'); io.unobserve(e.target); }
    });
  }, {threshold:0.08, rootMargin:'0px 0px -60px 0px'});
  cards.forEach(function(c){ io.observe(c); });
}

let fontScale = parseFloat(localStorage.getItem('netbook_fontScale')||'1');
function setFontScale(v){
  fontScale = Math.min(1.3, Math.max(0.85, Math.round(v*10)/10));
  try{ localStorage.setItem('netbook_fontScale', fontScale); }catch(e){}
  document.documentElement.style.setProperty('--fontScale', fontScale);
}

function updateProgress(){
  const el = document.documentElement;
  const max = el.scrollHeight - el.clientHeight;
  const pct = max>0 ? (el.scrollTop/max*100) : 0;
  const bar = document.getElementById('readProgress');
  if(bar) bar.style.width = pct+'%';
  const btt = document.getElementById('backToTop');
  if(btt){ if(el.scrollTop>420){ btt.classList.add('show'); } else { btt.classList.remove('show'); } }
}

renderTOC();
renderContent();
setupScrollSpy();
setupReveal();
wireDiagramButtons();
setFontScale(fontScale);

window.addEventListener('scroll', updateProgress);
const backToTopBtn = document.getElementById('backToTop');
if(backToTopBtn){ backToTopBtn.addEventListener('click', function(){ window.scrollTo({top:0,behavior:'smooth'}); }); }
const fontMinusBtn = document.getElementById('fontMinus');
if(fontMinusBtn){ fontMinusBtn.addEventListener('click', function(){ setFontScale(fontScale-0.1); }); }
const fontPlusBtn = document.getElementById('fontPlus');
if(fontPlusBtn){ fontPlusBtn.addEventListener('click', function(){ setFontScale(fontScale+0.1); }); }

</script>
