<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Chapter 5: Network Layer — Control Plane</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

:root{
  color-scheme: light;
  --paper:#F6F4EE;
  --bg:#F6F4EE;
  --panel:#FFFFFF;
  --border:#DCD6C7;
  --text:#2A2A26;
  --text-soft:#6B6558;
  --navy:#1B3A5C;
  --navy-deep:#0F2740;
  --accent:#1B3A5C;
  --accent2:#2B6CB0;
  --accent-soft:#EAF1FA;
  --correct:#256D46;
  --correct-soft:#E7F3EB;
  --incorrect:#B3341F;
  --incorrect-soft:#FBEAE6;
  --flag:#B7862C;
  --flag-soft:#FBF1DA;
  --unanswered:#9A9486;
  --fontScale:1;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:'Sarabun',"Segoe UI",sans-serif;
  background:var(--paper);
  color:var(--text);
}
header{
  background:var(--navy-deep);
  border-bottom:4px solid var(--flag);
  box-shadow:0 2px 10px rgba(15,39,64,0.25);
  padding:16px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  position:sticky;
  top:0;
  z-index:10;
}
header h1{
  font-size:18px;
  margin:0;
  color:#F2EFE6;
  font-weight:700;
}
header .subtitle{
  font-size:12.5px;
  color:#C9C2AE;
  margin-top:2px;
}
.header-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.layout{
  display:flex;
  max-width:1200px;
  margin:0 auto;
  gap:20px;
  padding:20px;
}
.sidebar{width:250px;flex-shrink:0;}
.sidebar-panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:6px;
  padding:16px;
  position:sticky;
  top:80px;
  box-shadow:0 2px 8px rgba(15,39,64,0.06);
  max-height:calc(100vh - 100px);
  overflow-y:auto;
}
.sidebar-panel h3{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--text-soft);
  margin:0 0 10px 0;
  font-weight:600;
}
.toc-list{list-style:none;margin:0;padding:0;}
.toc-list li{margin-bottom:2px;}
.toc-list a{
  display:block;
  padding:7px 10px;
  border-radius:4px;
  color:var(--text);
  text-decoration:none;
  font-size:13px;
  border-left:3px solid transparent;
}
.toc-list a:hover{background:var(--accent-soft);color:var(--accent2);}
.toc-list a.active{background:var(--accent-soft);color:var(--navy);border-left:3px solid var(--navy);font-weight:600;}
main{flex:1;min-width:0;}
.section-card{
  background:var(--panel);
  border:1px solid var(--border);
  border-left:4px solid var(--navy);
  border-radius:6px;
  padding:24px;
  margin-bottom:18px;
  box-shadow:0 2px 10px rgba(15,39,64,0.06);
  scroll-margin-top:80px;
}
.section-card h2{
  margin:0 0 14px 0;
  font-size:18px;
  color:var(--navy-deep);
  padding-bottom:10px;
  border-bottom:2px solid var(--border);
}
.section-card h3{
  font-size:15px;
  color:var(--navy);
  margin:20px 0 10px 0;
}
.section-card .body-text{
  font-size:14.5px;
  line-height:1.9;
  white-space:pre-wrap;
}
.callout{
  margin:16px 0;
  padding:14px 16px;
  border-radius:6px;
  border-left:4px solid;
  font-size:14px;
  line-height:1.8;
}
.callout-note{background:var(--accent-soft);border-color:var(--accent2);}
.callout-example{background:#F4F2E8;border-color:var(--flag);}
.callout-warning{background:var(--incorrect-soft);border-color:var(--incorrect);}
.callout-formula{
  background:var(--navy-deep);
  color:#EAF1FA;
  border-color:var(--flag);
  font-family:'JetBrains Mono',monospace;
  overflow-x:auto;
}
.callout-title{
  font-weight:700;
  font-size:12.5px;
  text-transform:uppercase;
  letter-spacing:.04em;
  margin-bottom:8px;
  display:block;
}
.callout-note .callout-title{color:var(--accent2);}
.callout-example .callout-title{color:var(--flag);}
.callout-warning .callout-title{color:var(--incorrect);}
.callout-formula .callout-title{color:#C9DCF0;}
.image-block{
  margin:18px 0;
  text-align:center;
}
.image-block img{
  max-width:100%;
  height:auto;
  border-radius:6px;
  border:1px solid var(--border);
  box-shadow:0 2px 10px rgba(15,39,64,0.08);
}
.image-block .image-caption{
  font-size:12.5px;
  color:var(--text-soft);
  margin-top:8px;
  font-style:italic;
}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:13.5px;}
table th{background:var(--navy-deep);color:#F2EFE6;padding:9px 12px;text-align:left;}
table td{padding:8px 12px;border-bottom:1px solid var(--border);}
table tr:nth-child(even) td{background:#F4F2E8;}
@media (max-width:800px){
  .layout{flex-direction:column;}
  .sidebar{width:100%;}
  .sidebar-panel{position:static;max-height:none;}
}

</style>
<style>

/* ===== Readability & diagram enhancements ===== */
#readProgress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--flag),var(--accent2));width:0%;z-index:999;transition:width .12s ease;}

#backToTop{
  position:fixed;bottom:24px;right:24px;width:44px;height:44px;border-radius:50%;
  background:var(--navy-deep);color:#F2EFE6;border:none;cursor:pointer;font-size:18px;
  box-shadow:0 4px 14px rgba(15,39,64,0.3);display:none;align-items:center;justify-content:center;
  z-index:998;opacity:0;transition:opacity .2s ease, transform .2s ease;
}
#backToTop:hover{transform:translateY(-2px);}
#backToTop.show{display:flex;opacity:1;}

#fontCtrl{display:flex;gap:6px;align-items:center;}
#fontCtrl button{
  border:1.5px solid rgba(242,239,230,0.5);background:rgba(255,255,255,0.9);color:var(--navy);
  width:32px;height:32px;border-radius:4px;font-size:13px;cursor:pointer;font-weight:700;
  font-family:'Sarabun',sans-serif;
}
#fontCtrl button:hover{background:#fff;}

.section-card{opacity:0;transform:translateY(14px);transition:opacity .55s ease, transform .55s ease;}
.section-card.revealed{opacity:1;transform:translateY(0);}
@media (prefers-reduced-motion: reduce){
  .section-card{opacity:1;transform:none;transition:none;}
}

.section-card .body-text{font-size:calc(14.5px * var(--fontScale)) !important;}
.section-card h2{font-size:calc(18px * var(--fontScale)) !important;}
.section-card h3{font-size:calc(15px * var(--fontScale)) !important;}
.callout{font-size:calc(14px * var(--fontScale)) !important;}
table{font-size:calc(13.5px * var(--fontScale)) !important;}

.callout-note .callout-title::before{content:"📝 ";}
.callout-example .callout-title::before{content:"💡 ";}
.callout-warning .callout-title::before{content:"⚠️ ";}
.callout-formula .callout-title::before{content:"∑ ";}

/* ==== Animated sequence / flow diagrams ==== */
.diagram-block{
  margin:20px 0;padding:16px 18px 14px;background:#FBFAF6;border:1px solid var(--border);
  border-radius:8px;
}
.diagram-block h4{
  margin:0 0 12px 0;font-size:calc(14.5px * var(--fontScale));color:var(--navy-deep);
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
}
.diagram-play-btn{
  border:1.5px solid var(--accent2);background:#fff;color:var(--accent2);padding:5px 12px;
  border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Sarabun',sans-serif;
  flex-shrink:0;
}
.diagram-play-btn:hover{background:var(--accent-soft);}
.diagram-svg-wrap{overflow-x:auto;}
.diagram-svg{display:block;margin:0 auto;min-width:420px;}
.diagram-actor-label{font-family:'Sarabun',sans-serif;font-size:11.5px;font-weight:600;fill:var(--navy-deep);}
.diagram-lifeline{stroke:var(--border);stroke-width:1.5;stroke-dasharray:3,3;}
.diagram-node-box{fill:var(--panel);stroke:var(--navy);stroke-width:1.3;}
.diagram-arrow-path{fill:none;stroke:var(--accent2);stroke-width:2;marker-end:url(#arrowhead);}
.diagram-arrow-label{font-family:'JetBrains Mono',monospace;font-size:10.5px;fill:var(--navy-deep);}
.diagram-glow-dot{fill:var(--flag);filter:url(#glowFilter);opacity:0;}
.diagram-steps-list{list-style:none;margin:12px 0 0;padding:0;font-size:calc(13px * var(--fontScale));line-height:1.7;}
.diagram-steps-list li{padding:6px 10px;border-left:3px solid transparent;border-radius:4px;transition:background .3s ease, border-color .3s ease;}
.diagram-steps-list li.step-active{background:var(--accent-soft);border-left-color:var(--flag);}
.diagram-steps-list .step-num{
  display:inline-block;width:20px;height:20px;border-radius:50%;background:var(--navy);color:#fff;
  text-align:center;line-height:20px;font-size:11px;margin-right:8px;font-family:'JetBrains Mono',monospace;
}

</style>
</head>

<script>
const SECTIONS = [{"title": "ภาพรวม Control Plane: Per-Router vs SDN", "body": "**Routing** (การกำหนดเส้นทางจาก source ถึง destination) เป็นหน้าที่ของ **control plane** ซึ่งมี 2 แนวทางหลักในการ implement", "blocks": [{"type": "table", "content": "<table><tr><th>แนวทาง</th><th>รายละเอียด</th></tr><tr><td>Per-router control plane (แบบดั้งเดิม)</td><td>routing algorithm component ทำงานอยู่ **ในตัว router แต่ละตัวเอง** และสื่อสารกันเองเพื่อคำนวณ forwarding table</td></tr><tr><td>Logically centralized control (SDN)</td><td>**remote controller** คำนวณและติดตั้ง forwarding table เข้าไปในทุก router โดยตรงจากส่วนกลาง</td></tr></table>"}, {"type": "subheading", "content": "Graph Abstraction สำหรับ Routing"}, {"type": "note", "content": "เครือข่ายถูกจำลองเป็น graph $G = (N, E)$ โดย $N$ = เซตของ router, $E$ = เซตของ link — แต่ละ link $(a,b)$ มี **cost** $c_{a,b}$ ที่กำหนดโดยผู้ดูแลเครือข่าย (อาจเป็นค่าคงที่ 1 เสมอ, แปรผกผันกับ bandwidth, หรือแปรผกผันกับระดับ congestion ก็ได้)"}, {"type": "subheading", "content": "การจำแนกประเภท Routing Algorithm"}, {"type": "table", "content": "<table><tr><th>มิติ</th><th>ประเภท A</th><th>ประเภท B</th></tr><tr><td>ข้อมูลที่ใช้</td><td>**Global**: ทุก router รู้ topology และ link cost ทั้งหมด (\"link state\" algorithm)</td><td>**Decentralized**: router รู้แค่ link cost ไปยัง neighbor ของตัวเองเท่านั้น คำนวณแบบวนซ้ำ แลกเปลี่ยนข้อมูลกับ neighbor (\"distance vector\" algorithm)</td></tr><tr><td>ความเร็วการเปลี่ยนแปลง</td><td>**Static**: route เปลี่ยนช้าตามเวลา</td><td>**Dynamic**: route เปลี่ยนเร็วกว่า อาจ update เป็นระยะหรือตอบสนองต่อการเปลี่ยน link cost</td></tr></table>"}]}, {"title": "Link-State Routing: อัลกอริทึมของ Dijkstra", "body": "อัลกอริทึมของ **Dijkstra** เป็นตัวอย่างคลาสสิกของ link-state algorithm — เป็นแบบ **centralized**: ทุก node รู้ topology และ link cost ของทั้งเครือข่าย (ได้จากการ \"link-state broadcast\") แล้วคำนวณเส้นทางที่ cost ต่ำสุดจาก node ต้นทางไปยังทุก node อื่น", "blocks": [{"type": "formula", "label": "สัญลักษณ์ที่ใช้", "content": "- $c_{x,y}$: ต้นทุนของ link ตรงจาก $x$ ไป $y$ (= $\\infty$ ถ้าไม่ได้เป็นเพื่อนบ้านโดยตรง)\n- $D(v)$: ค่าประมาณปัจจุบันของต้นทุนเส้นทางถูกที่สุดจาก source ไปยัง $v$\n- $p(v)$: node ก่อนหน้า (predecessor) บนเส้นทางจาก source ไปยัง $v$\n- $N'$: เซตของ node ที่รู้เส้นทางถูกที่สุดแน่นอนแล้ว"}, {"type": "formula", "label": "Pseudocode ของ Dijkstra's Algorithm", "content": "```\n1  Initialization:\n2    N' = {u}   /* คำนวณเส้นทางถูกที่สุดจาก u ไปยังทุก node อื่น */\n3    for all nodes v\n4      if v adjacent to u  then D(v) = cu,v\n5      else D(v) = ∞\n8  Loop\n9    find w not in N' such that D(w) is a minimum\n10   add w to N'\n11   update D(v) for all v adjacent to w and not in N':\n12       D(v) = min(D(v), D(w) + cw,v)\n15 until all nodes in N'\n```"}, {"type": "example", "content": "**ตัวอย่างเต็มขั้นตอนแบบ step-by-step**: กราฟมี node $u,v,w,x,y,z$ โดย source = $u$, link cost: $c_{u,v}=5$, $c_{u,x}=1$, $c_{u,w}=\\infty$(ไม่ตรงกัน), $c_{v,x}=2$, $c_{v,w}=3$, $c_{x,w}=3$, $c_{x,y}=1$, $c_{w,y}=1$, $c_{w,z}=5$, $c_{y,z}=2$\n\n| Step | N' | D(v),p(v) | D(w),p(w) | D(x),p(x) | D(y),p(y) | D(z),p(z) |\n|---|---|---|---|---|---|---|\n| 0 | u | 5,u | ∞ | 1,u | ∞ | ∞ |\n| 1 | ux | 2,x | 4,x | — | 2,x | ∞ |\n| 2 | uxy | 2,x | 3,y | — | — | 4,y |\n| 3 | uxyv | — | 3,y | — | — | 4,y |\n| 4 | uxyvw | — | — | — | — | 4,y |\n| 5 | uxyvwz | — | — | — | — | — |\n\n**ผลลัพธ์**: forwarding table ของ $u$: ไปยัง $v$ ใช้ link $(u,v)$ โดยตรง — ไปยัง $x, y, w, z$ ทั้งหมดใช้ link $(u,x)$ (route ผ่าน $x$ ก่อน)"}, {"type": "warning", "content": "**ความซับซ้อน (Complexity)**: มี $n$ node, ในแต่ละ $n$ รอบต้องตรวจสอบทุก node ที่ไม่อยู่ใน $N'$ → รวม $n(n+1)/2$ การเปรียบเทียบ = **$O(n^2)$** (implement แบบมีประสิทธิภาพกว่านี้ได้ $O(n\\log n)$)\n\n**Message complexity**: แต่ละ router ต้อง broadcast link-state ของตัวเองไปยัง $n$ router อื่น รวมเป็น $O(n^2)$ message ทั้งเครือข่าย\n\n**ปัญหา Oscillation**: ถ้า link cost ขึ้นกับปริมาณ traffic (volume-dependent) การ routing อาจเกิด**การแกว่งไปมา (oscillation)** ได้ — เมื่อทุก node เปลี่ยนเส้นทางพร้อมกันตามข้อมูล cost ล่าสุด cost ใหม่ก็จะเปลี่ยนอีก วนเป็นวงจรไม่จบ"}]}, {"title": "Distance-Vector Routing: อัลกอริทึม Bellman-Ford", "body": "**Distance Vector (DV)** เป็นอัลกอริทึมแบบ **decentralized** อาศัยสมการ **Bellman-Ford** ในการคำนวณเส้นทางถูกที่สุดแบบวนซ้ำ โดยที่แต่ละ node รู้แค่ cost ไปยัง neighbor ของตัวเองเท่านั้น", "blocks": [{"type": "formula", "label": "Bellman-Ford Equation", "content": "ให้ $D_x(y)$ = ต้นทุนของเส้นทางถูกที่สุดจาก $x$ ไปยัง $y$ แล้ว:\n\n$$D_x(y) = \\min_v \\{c_{x,v} + D_v(y)\\}$$\n\nโดย $\\min$ คิดจากทุก neighbor $v$ ของ $x$ — $c_{x,v}$ คือต้นทุน link ตรงจาก $x$ ไป $v$ และ $D_v(y)$ คือค่าประมาณของ $v$ เองต่อเส้นทางถูกที่สุดไปยัง $y$"}, {"type": "example", "content": "**ตัวอย่าง**: node $u$ มี neighbor คือ $x, v, w$ โดยรู้ว่า $D_w(z)=3$ (w รู้ทางไป z ด้วยต้นทุน 3), $D_v(z)=5$, $D_x(z)=3$ และ link cost $c_{u,v}=2$, $c_{u,x}=1$, $c_{u,w}=5$\n\n$$D_u(z) = \\min\\{c_{u,v}+D_v(z),\\ c_{u,x}+D_x(z),\\ c_{u,w}+D_w(z)\\} = \\min\\{2+5,\\ 1+3,\\ 5+3\\} = 4$$\n\n**node ที่ทำให้ค่า min เกิดขึ้น (คือ $x$) คือ next-hop บนเส้นทางถูกที่สุดโดยประมาณไปยัง $z$**"}, {"type": "subheading", "content": "หลักการทำงานของ DV Algorithm"}, {"type": "note", "content": "**แนวคิดหลัก**: แต่ละ node ส่ง **distance vector** (ค่าประมาณของตัวเองไปยังทุก destination) ให้ neighbor เป็นระยะ — เมื่อ $x$ ได้รับ DV ใหม่จาก neighbor ใดก็ตาม จะ update DV ของตัวเองด้วยสมการ Bellman-Ford: $D_x(y) \\leftarrow \\min_v\\{c_{x,v} + D_v(y)\\}$ สำหรับทุก $y$\n\nภายใต้เงื่อนไขปกติ ค่าประมาณ $D_x(y)$ จะ**ลู่เข้า (converge)** สู่ค่าจริง $d_x(y)$ ในที่สุด\n\n**ลักษณะสำคัญ**: เป็นแบบ **iterative, asynchronous** (แต่ละรอบการคำนวณเกิดจาก local link cost เปลี่ยน หรือได้รับ DV update จาก neighbor) และ **distributed, self-stopping** (node จะแจ้ง neighbor ก็ต่อเมื่อ DV ของตัวเองเปลี่ยนไปเท่านั้น — ถ้าไม่ได้รับการแจ้งเตือน ก็ไม่ต้องทำอะไร)"}, {"type": "subheading", "content": "Link Cost Changes: \"Good News Travels Fast, Bad News Travels Slow\""}, {"type": "note", "content": "**กรณี link cost ลดลง** (\"good news\"): เมื่อ node ตรวจพบว่า link cost ของตัวเองลดลง จะ update DV และแจ้ง neighbor ทันที ข่าวดีนี้แพร่กระจายได้เร็ว\n\n**กรณี link cost เพิ่มขึ้น** (\"bad news\") — เกิด **Count-to-Infinity Problem**: สมมติ link ระหว่าง $x$-$y$ เพิ่ม cost จาก 4 เป็น 60 โดยที่ $z$ มีเส้นทางอ้อมไป $x$ ผ่าน $y$ ด้วย cost รวม 5 — $y$ เห็นว่า link ตรงไป $x$ แพงขึ้น (60) จึงคำนวณใหม่ว่า \"ทางไป $x$ ผ่าน $z$\" ราคา $1+5=6$ ถูกกว่า → แจ้ง $z$ ว่าตอนนี้ทางไป $x$ ราคา 6 — $z$ ได้ข้อมูลนี้ คำนวณใหม่ว่าทางผ่าน $y$ ราคา $1+6=7$ → แจ้งกลับ $y$ — วนเป็นวงจรค่อยๆ เพิ่มขึ้นทีละ 1 (6, 7, 8, 9, ...) กว่าจะถึงค่าจริงคือ 60 ต้องใช้เวลานานมาก — นี่คือ**ปัญหา count-to-infinity** ที่เป็นจุดอ่อนสำคัญของ distance vector algorithm"}, {"type": "subheading", "content": "เปรียบเทียบ Link State vs Distance Vector"}, {"type": "table", "content": "<table><tr><th>มิติ</th><th>Link State (LS)</th><th>Distance Vector (DV)</th></tr><tr><td>Message complexity</td><td>$O(n^2)$ message (n router ต้อง broadcast ให้กันหมด)</td><td>แลกเปลี่ยนเฉพาะกับ neighbor — เวลาลู่เข้าแปรผันได้มาก</td></tr><tr><td>ความทนทานต่อ error</td><td>router อาจ advertise link cost ผิด แต่แต่ละ router คำนวณ table ของตัวเองเท่านั้น</td><td>router อาจ advertise cost ที่ต่ำผิดปกติ (\"black-holing\" — อ้างว่ามีทางราคาถูกไปทุกที่) — error แพร่กระจายไปทั่วเครือข่ายได้ เพราะ DV ของแต่ละ node ถูกใช้อ้างอิงโดย node อื่น</td></tr><tr><td>ความเร็วในการลู่เข้า</td><td>$O(n^2)$ algorithm, อาจเกิด oscillation</td><td>เวลาแปรผันได้มาก อาจเกิด routing loop และปัญหา count-to-infinity</td></tr></table>"}, {"type": "diagram", "layout": "lifeline", "title": "Distance-Vector Routing: Good News Travels Fast", "actors": ["Router A", "Router B", "Router C"], "steps": [{"from": 0, "to": 1, "label": "ส่ง Distance Vector รอบแรก", "note": "แลกเปลี่ยนตารางระยะทางกับเพื่อนบ้าน"}, {"from": 1, "to": 2, "label": "อัปเดตและส่งต่อ", "note": "B คำนวณใหม่ด้วย Bellman-Ford แล้วส่งต่อ"}, {"from": 2, "to": 1, "label": "Link Cost เปลี่ยน → แจ้งทันที", "note": "Good News Travels Fast"}, {"from": 1, "to": 0, "label": "ส่งต่อ Update", "note": "การอัปเดตแพร่กระจายเร็วเมื่อ cost ลดลง"}]}]}, {"title": "Routing แบบ Scalable: Autonomous Systems, OSPF", "body": "ในโลกจริง อินเทอร์เน็ตประกอบด้วย network จำนวนมากที่มีเจ้าของ/ผู้ดูแลต่างกัน (**administrative autonomy**) และมี destination นับพันล้านจุด — การ routing แบบ \"flat\" (ทุก router เท่ากันหมด) จึงไม่ scale", "blocks": [{"type": "subheading", "content": "Autonomous System (AS): หน่วยของการจัดการ Routing"}, {"type": "note", "content": "อินเทอร์เน็ตถูกแบ่งเป็น **Autonomous System (AS)** หรือ \"domain\" — router ทุกตัวใน AS เดียวกันต้องรัน **intra-domain protocol เดียวกัน** (แต่ AS ต่างกันเลือกใช้ intra-domain protocol ต่างกันได้) **Gateway router** คือ router ที่อยู่ \"ขอบ\" ของ AS ตัวเอง มี link เชื่อมไปยัง router ใน AS อื่น\n\n- **Intra-AS routing** (\"intra-domain\"): routing ระหว่าง router **ภายใน** AS เดียวกัน\n- **Inter-AS routing** (\"inter-domain\"): routing **ระหว่าง** AS ต่างๆ — ดำเนินการโดย gateway router (ซึ่งทำทั้ง intra- และ inter-domain routing)"}, {"type": "subheading", "content": "OSPF: Open Shortest Path First — Intra-AS Routing ที่นิยมที่สุด"}, {"type": "note", "content": "OSPF [RFC 2328] เป็น **classic link-state protocol** ที่ **\"open\"** (เปิดเผยต่อสาธารณะ):\n\n- แต่ละ router \"flood\" (กระจาย) OSPF link-state advertisement ไปยังทุก router ใน AS เดียวกัน (ส่งตรงผ่าน IP ไม่ใช้ TCP/UDP)\n- รองรับหลาย link cost metric ได้ (bandwidth, delay)\n- ทุก router มี topology เต็มรูปแบบ ใช้ **Dijkstra's algorithm** คำนวณ forwarding table\n- ทุก OSPF message มีการ **authenticate** เพื่อป้องกันการบุกรุกที่เป็นอันตราย"}, {"type": "subheading", "content": "Hierarchical OSPF"}, {"type": "note", "content": "OSPF รองรับ**ลำดับชั้น 2 ระดับ**: **local area** และ **backbone**\n\n- Link-state advertisement ถูก flood แค่**ภายใน area เดียวกัน**หรือ**ภายใน backbone**เท่านั้น (ไม่ flood ข้าม area)\n- แต่ละ node รู้ topology โดยละเอียดของ **area ตัวเอง** แต่รู้แค่ \"ทิศทาง\" ในการไปยัง destination ใน area อื่น\n- **Area border router**: \"สรุปย่อ\" (summarize) ระยะทางไปยัง destination ใน area ของตัวเอง แล้ว advertise เข้า backbone\n- **Boundary router**: เชื่อมต่อไปยัง AS อื่น\n- **Backbone router**: รัน OSPF จำกัดเฉพาะใน backbone\n- **Internal router**: flood link-state เฉพาะใน area ของตัวเอง, คำนวณ routing ภายใน area, ส่ง packet ที่ต้องออกนอก area ผ่าน area border router"}]}, {"title": "BGP: Border Gateway Protocol — Routing ระหว่าง ISP", "body": "**BGP** คือ inter-domain routing protocol โดย de facto ของอินเทอร์เน็ต — บางคนเรียกว่า **\"กาวที่ยึดอินเทอร์เน็ตเข้าด้วยกัน\"** เพราะทุก AS ในอินเทอร์เน็ตใช้ BGP protocol เดียวกันในการสื่อสารระหว่างกัน", "blocks": [{"type": "subheading", "content": "หน้าที่หลักของ BGP"}, {"type": "note", "content": "BGP ให้ AS สามารถ **ประกาศการมีอยู่ของตัวเองและ destination ที่ตัวเองไปถึงได้** ให้ทั่วอินเทอร์เน็ตรับรู้ (\"ฉันอยู่ที่นี่ นี่คือสิ่งที่ฉันไปถึงได้ และไปถึงได้อย่างไร\") — BGP ให้แต่ละ AS สามารถ:\n\n1. รับข้อมูล **reachability** จาก AS เพื่อนบ้าน (ผ่าน **eBGP** — external BGP)\n2. กำหนดเส้นทางไปยัง network อื่นตาม reachability info และ **policy**\n3. เผยแพร่ข้อมูล reachability ไปยัง router **ภายใน AS ตัวเอง**ทุกตัว (ผ่าน **iBGP** — internal BGP)\n4. advertise (ประกาศ) ข้อมูล reachability ไปยัง network เพื่อนบ้าน\n\n**Gateway router รันทั้ง eBGP (คุยกับ AS อื่น) และ iBGP (คุยกับ router ภายใน AS ตัวเอง)**"}, {"type": "subheading", "content": "BGP Session และ Path Vector"}, {"type": "note", "content": "**BGP session**: BGP router สองตัว (\"peer\") แลกเปลี่ยน BGP message กันผ่าน **TCP connection กึ่งถาวร** — BGP เป็น **\"path vector\" protocol**: เมื่อ AS3 gateway 3a ประกาศ path `AS3, X` ให้ AS2 gateway 2c หมายความว่า **AS3 สัญญาว่าจะ forward datagram ที่มุ่งไปยัง X ให้เอง**\n\n**BGP message types** [RFC 4271]:\n- **OPEN**: เปิด TCP connection ไปยัง BGP peer ระยะไกล และยืนยันตัวตน\n- **UPDATE**: ประกาศ path ใหม่ (หรือถอน path เก่า)\n- **KEEPALIVE**: รักษา connection ให้มีชีวิตอยู่เมื่อไม่มี UPDATE, ยัง ACK คำขอ OPEN ด้วย\n- **NOTIFICATION**: รายงาน error ใน message ก่อนหน้า, ใช้ปิด connection ด้วย"}, {"type": "subheading", "content": "BGP Route Attributes และ Policy-based Routing"}, {"type": "note", "content": "BGP advertised route ประกอบด้วย **prefix + attributes** — attribute สำคัญ 2 ตัว:\n\n- **AS-PATH**: รายการ AS ทั้งหมดที่ prefix advertisement นี้เดินทางผ่านมา (เช่น `AS2, AS3, X`)\n- **NEXT-HOP**: ระบุ router ภายใน AS ที่เป็น hop ถัดไปสู่ AS ปลายทาง\n\n**Policy-based routing**: gateway ที่ได้รับ route advertisement ใช้ **import policy** เพื่อตัดสินใจ accept/decline path นั้น (เช่น \"ไม่เคย route ผ่าน AS Y\") — policy ของ AS ยังกำหนดด้วยว่าจะ advertise path นี้ต่อไปยัง AS เพื่อนบ้านอื่นหรือไม่"}, {"type": "example", "content": "**ตัวอย่างการ propagate BGP path**: AS2 router 2c ได้รับ path `AS3,X` (ผ่าน eBGP) จาก AS3 router 3a → ตาม policy ของ AS2, 2c ยอมรับ path นี้แล้ว propagate (ผ่าน iBGP) ไปยังทุก router ใน AS2 → ตาม policy ของ AS2, router 2a advertise (ผ่าน eBGP) path `AS2,AS3,X` ไปยัง AS1 router 1c\n\n**เมื่อมีหลายเส้นทาง**: AS1 gateway 1c อาจเรียนรู้ทั้ง path `AS2,AS3,X` (จาก 2a) และ path `AS3,X` (จาก 3a โดยตรง) — ตาม policy AS1 เลือก path `AS3,X` (สั้นกว่า) แล้ว advertise ภายใน AS1 ผ่าน iBGP"}, {"type": "subheading", "content": "Hot Potato Routing"}, {"type": "note", "content": "เมื่อ router ภายใน AS เรียนรู้ว่าสามารถไปยัง destination เดียวกันได้ผ่านหลาย gateway ภายใน AS ของตัวเอง (เช่น 2d รู้ว่าไป X ได้ผ่าน 2a หรือ 2c) จะเลือก **gateway ที่มี intra-domain cost ต่ำที่สุด** — โดย**ไม่สนใจ inter-domain cost เลย** (แม้ path ผ่าน gateway ที่เลือกอาจมี AS hop มากกว่าก็ตาม) — เรียกว่า **hot potato routing** เพราะแนวคิดคือ \"โยนทิ้งให้เร็วที่สุด\" (ส่งข้อมูลออกจาก AS ของตัวเองให้เร็วที่สุด แล้วให้ AS อื่นรับผิดชอบต่อ)"}, {"type": "subheading", "content": "BGP Policy: ตัวอย่างจริงในโลก ISP"}, {"type": "note", "content": "**หลักการ**: ISP มักไม่ต้องการ carry \"transit traffic\" ระหว่าง ISP อื่นสองรายที่ไม่ใช่ลูกค้าของตัวเอง — ตัวอย่าง: B เป็น provider ที่ A (customer) advertise path `A,w` ให้ทั้ง B และ C แต่ **B เลือกไม่ advertise `B,A,w` ต่อให้ C** เพราะ B ไม่ได้รายได้จากการ route traffic ให้ C-A-w (ไม่มีใครในนั้นเป็นลูกค้าของ B) — ผลคือ C ต้อง route ไปหา w ผ่านเส้นทางอื่น (`C,A,w`) โดยไม่ผ่าน B"}, {"type": "subheading", "content": "BGP Route Selection Criteria"}, {"type": "table", "content": "<table><tr><th>ลำดับความสำคัญ</th><th>เกณฑ์</th></tr><tr><td>1</td><td>Local preference value attribute (policy decision)</td></tr><tr><td>2</td><td>AS-PATH ที่สั้นที่สุด</td></tr><tr><td>3</td><td>NEXT-HOP router ที่ใกล้ที่สุด (hot potato routing)</td></tr><tr><td>4</td><td>เกณฑ์เพิ่มเติมอื่นๆ</td></tr></table>"}, {"type": "subheading", "content": "ทำไม Intra-AS กับ Inter-AS Routing ถึงต่างกัน?"}, {"type": "table", "content": "<table><tr><th>มิติ</th><th>Intra-AS</th><th>Inter-AS</th></tr><tr><td>Policy</td><td>ผู้ดูแลรายเดียว จึง policy ไม่ค่อยเป็นประเด็น</td><td>ผู้ดูแลแต่ละ AS ต้องการควบคุมว่า traffic ของตัวเอง route อย่างไร และใครใช้เครือข่ายของตัวเองผ่านทาง</td></tr><tr><td>Scale</td><td>-</td><td>routing แบบลำดับชั้นช่วยลดขนาด table และ update traffic</td></tr><tr><td>Performance</td><td>เน้น performance ได้เต็มที่</td><td>policy สำคัญกว่า performance</td></tr></table>"}, {"type": "diagram", "layout": "lifeline", "title": "BGP: การแลกเปลี่ยนเส้นทางระหว่าง AS", "actors": ["Router ใน AS1", "Router ใน AS2"], "steps": [{"from": 0, "to": 1, "label": "OPEN", "note": "เริ่มเปิด BGP session (eBGP)"}, {"from": 1, "to": 0, "label": "OPEN ACK", "note": "ยืนยัน session"}, {"from": 0, "to": 1, "label": "UPDATE: ประกาศ Path/Prefix", "note": "บอกเส้นทางที่ AS1 ไปถึงได้"}, {"from": 1, "to": 0, "label": "UPDATE: ประกาศ Path กลับ", "note": "AS2 ประกาศเส้นทางของตนเช่นกัน"}]}]}, {"title": "SDN Control Plane", "body": "**Software-Defined Networking (SDN)** คือแนวคิดที่ **ย้ายตรรกะของ control plane ออกจากตัว router ไปอยู่ที่ remote controller** ที่ควบคุมแบบรวมศูนย์ (logically centralized)", "blocks": [{"type": "subheading", "content": "ทำไมต้องมี SDN?"}, {"type": "note", "content": "แต่เดิม network layer ของอินเทอร์เน็ต implement ผ่าน **monolithic router**: ฮาร์ดแวร์ switching + ซอฟต์แวร์ proprietary ที่รัน protocol มาตรฐาน (IP, RIP, IS-IS, OSPF, BGP) บน OS เฉพาะยี่ห้อ (เช่น Cisco IOS) — ประมาณปี 2005 เริ่มมีการคิดใหม่เรื่อง control plane\n\n**เหตุผลที่สนับสนุน logically centralized control plane**:\n- **จัดการเครือข่ายง่ายขึ้น**: หลีกเลี่ยง router misconfiguration, ยืดหยุ่นกว่าในการควบคุม traffic flow\n- **Table-based forwarding** (OpenFlow API) ทำให้ \"programming\" router ได้\n- **การ program แบบรวมศูนย์ง่ายกว่า**: คำนวณ table จากศูนย์กลางแล้วกระจายออกไป เทียบกับการ program แบบกระจาย (ต้องรัน distributed algorithm ในทุก router)\n- **Open (non-proprietary) implementation**: ส่งเสริมนวัตกรรม (\"let 1000 flowers bloom\")"}, {"type": "subheading", "content": "SDN Analogy: การปฏิวัติจาก Mainframe สู่ PC"}, {"type": "note", "content": "**Vertically integrated (แบบเดิม)**: hardware เฉพาะทาง + OS เฉพาะทาง + application เฉพาะทาง — ปิด, proprietary, นวัตกรรมช้า, อุตสาหกรรมเล็ก\n\n**Horizontal (แบบ SDN/PC)**: microprocessor มาตรฐาน (open interface) → OS มาตรฐาน (Windows/Mac/Linux, open interface) → application หลากหลาย — เปิด, open interface, นวัตกรรมเร็ว, อุตสาหกรรมใหญ่"}, {"type": "subheading", "content": "Traffic Engineering: ข้อจำกัดของ Routing แบบดั้งเดิม"}, {"type": "note", "content": "**ปัญหาที่ 1**: ถ้า network operator ต้องการให้ traffic จาก $u$-to-$z$ วิ่งผ่านเส้นทาง $u\\to v\\to w\\to z$ แทนที่จะเป็น $u\\to x\\to y\\to z$ — ด้วย routing แบบดั้งเดิม ต้องไปนิยาม link weight ใหม่ให้ routing algorithm คำนวณเส้นทางตามที่ต้องการ — **link weight เป็นเพียง \"ปุ่มควบคุม\" เดียวที่มีให้ปรับ ควบคุมได้ไม่มากนัก**\n\n**ปัญหาที่ 2**: ถ้าต้องการ**แบ่ง (split)** traffic ระหว่างสองเส้นทาง (load balancing) — ทำไม่ได้เลยด้วย destination-based forwarding แบบดั้งเดิม\n\n**ปัญหาที่ 3**: ถ้าต้องการให้ traffic สีต่างกัน (เช่น blue กับ red) route แตกต่างกันจาก node เดียวกัน — ก็ทำไม่ได้ด้วย destination-based forwarding, LS, หรือ DV routing แบบดั้งเดิม\n\n**Generalized forwarding และ SDN (Chapter 4) สามารถบรรลุการ routing แบบใดก็ได้ที่ต้องการ** เพราะไม่ผูกติดกับการ forward ตาม destination address เพียงอย่างเดียว"}, {"type": "subheading", "content": "ตัวอย่างจริง: Google Orion SDN Control Plane"}, {"type": "note", "content": "สถาปัตยกรรมของ SDN control plane แบ่งเป็นชั้นชัดเจน: **Data Plane** (SDN switch พร้อม OpenFlow Agent) → **Control Plane** (แปลผ่าน OpenFlow Front End เข้าสู่ Flow Manager/Topology Manager/Config Manager ซึ่งทั้งหมดอ้างอิง Network Information Base ที่ศูนย์กลาง) → **Northbound Interface** ให้ application ระดับสูง (เช่น Routing Engine, Orion App) เข้าถึง — ทั้งหมดถูกดูแลด้วย **Management Plane** ที่คอย configure/policy/monitor ทุกชั้น"}, {"type": "image", "src": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAHJAyADASIAAhEBAxEB/8QAHAABAAMBAAMBAAAAAAAAAAAAAAUGBwQBAgMI/8QAYRAAAAUDAAMGDwwIBAQDBgYDAAECAwQFBhEHEiETFRYXMVEUIkFSU1RVYXFzkZKT0dIyMzQ1NlZygZSVsbIII3Shs8Hh4kJXdaJDYmPwN0XDGCQmZILCJThEZYOE0yfx/8QAGgEBAAMBAQEAAAAAAAAAAAAAAAECAwQFBv/EADkRAAIBAgIFCQcEAwEBAQAAAAABAgMRE1EEEhQhMQUyQVJhcYGRoRUjM8HR4fAiNJKxQlOy8Qbi/9oADAMBAAIRAxEAPwD9UgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADwpRJIzUZERdUAeQEcdx0gv/ADKJ6Uh44SUjulE9KQAkgEbwjpHdKJ6Ug4R0julE9KQAkgEbwjpHdKJ6Ug4R0julE9KQAkgEbwjpHdKJ6Ug4R0julE9KQAkgEbwjpHdKJ6Ug4SUjulE9KQAkgEbwjpHdKJ6Ug4R0julE9KQAkgEbwkpHdKJ6Ug4R0julE9KQAkgEbwjpHdKJ6Ug4SUjulE9KQAkgEbwjpHdKJ6Uh9GK5TJLiWmZ8ZxxWwkpcIzMAdwAAAAAAAADwpRJI1KPBFymAPICOO46QX/mUT0pDxwjpHdKJ6UgBJAI3hJSO6UT0pBwjpHdKJ6UgBJAI3hHSO6UT0pBwkpHdKJ6UgBJAI3hHSO6UT0pBwjpHdKJ6UgBJAI3hJSO6UT0pBwjpHdKJ6UgBJAI3hHSO6UT0pBwj 9AAKfb2i+jUCRKmbtOnTpTRsLlS3t0cS31qTxsITNq2vBs+jNUinG8cdozNO6r1lbe+JcAAAAAAyIx41S5h5AAeNUuYNUuYeQAHjVLmHkAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAH/2Q==", "alt": "สถาปัตยกรรม Google Orion SDN control plane", "caption": "ตัวอย่าง SDN control plane จริงในอุตสาหกรรม: Google Orion (2021) แสดงการแยกชั้น Data Plane / Control Plane / Management Plane อย่างชัดเจน พร้อม Northbound Interface ให้ application เข้าถึง"}, {"type": "warning", "content": "**คำถามเปิด**: SDN-computed forwarding table เป็นเพียงตัวอย่างหนึ่งของแนวคิด \"logically-centralized-computed\" เทียบกับ \"protocol-computed\" (แบบดั้งเดิม) — ในอนาคตอาจมีแนวคิดคล้ายกันขยายไปถึง**congestion control แบบ SDN** ด้วย เช่น controller กำหนด sending rate ของแต่ละ sender โดยตรงจากข้อมูล congestion ที่ router รายงานกลับมา — คำถามคือ การ implement ฟังก์ชันเครือข่ายในอนาคตจะเป็นแบบ SDN (centralized) หรือแบบ protocol (distributed) มากกว่ากัน?"}, {"type": "diagram", "layout": "lifeline", "title": "SDN: Controller สั่งงาน Switch ผ่าน OpenFlow", "actors": ["SDN Controller", "OpenFlow Switch"], "steps": [{"from": 1, "to": 0, "label": "Packet-In", "note": "switch เจอ flow ที่ไม่รู้จัก จึงถาม controller"}, {"from": 0, "to": 1, "label": "Flow-Mod (ติดตั้งกฎ)", "note": "controller สั่งติดตั้ง flow rule ใหม่"}, {"from": 1, "to": 0, "label": "Flow-Removed/Stats", "note": "switch รายงานสถานะกลับ"}]}]}, {"title": "ICMP: Internet Control Message Protocol", "body": "**ICMP** ถูกใช้โดย host และ router เพื่อสื่อสารข้อมูลระดับเครือข่ายระหว่างกัน — แม้จะทำงาน \"เหนือ\" IP (ICMP message ถูกห่อหุ้มอยู่ใน IP datagram) แต่ก็ถือเป็นส่วนหนึ่งของ network layer", "blocks": [{"type": "subheading", "content": "หน้าที่ของ ICMP"}, {"type": "note", "content": "- **Error reporting**: แจ้งเมื่อ host/network/port/protocol ปลายทางไปไม่ถึง\n- **Echo request/reply**: ใช้โดยคำสั่ง **ping**\n\nICMP message ประกอบด้วย **type, code** และ 8 byte แรกของ IP datagram ที่ทำให้เกิด error นั้น"}, {"type": "table", "content": "<table><tr><th>Type</th><th>Code</th><th>ความหมาย</th></tr><tr><td>0</td><td>0</td><td>echo reply (ใช้กับ ping)</td></tr><tr><td>3</td><td>0</td><td>destination network unreachable</td></tr><tr><td>3</td><td>1</td><td>destination host unreachable</td></tr><tr><td>3</td><td>2</td><td>destination protocol unreachable</td></tr><tr><td>3</td><td>3</td><td>destination port unreachable</td></tr><tr><td>3</td><td>6</td><td>destination network unknown</td></tr><tr><td>3</td><td>7</td><td>destination host unknown</td></tr><tr><td>8</td><td>0</td><td>echo request (ใช้กับ ping)</td></tr><tr><td>9</td><td>0</td><td>route advertisement</td></tr><tr><td>10</td><td>0</td><td>router discovery</td></tr><tr><td>11</td><td>0</td><td>TTL expired</td></tr><tr><td>12</td><td>0</td><td>bad IP header</td></tr></table>"}, {"type": "subheading", "content": "Traceroute: การใช้ ICMP อย่างชาญฉลาด"}, {"type": "note", "content": "**หลักการทำงานของ traceroute**: source ส่ง UDP segment ชุดละ 3 ตัวไปยัง destination — ชุดที่ 1 มี **TTL=1**, ชุดที่ 2 มี TTL=2 ไปเรื่อยๆ — datagram ในชุดที่ $n$ จะไปถึง router ตัวที่ $n$ บนเส้นทาง แล้ว TTL หมดพอดี → **router นั้นจะทิ้ง datagram แล้วส่ง ICMP message กลับไปยัง source (type 11, code 0 = TTL expired)** — ICMP message นี้อาจรวมชื่อและ IP address ของ router นั้นด้วย\n\n**เงื่อนไขหยุด**: เมื่อ UDP segment ในที่สุดไปถึง destination host จริง destination จะตอบกลับด้วย **ICMP \"port unreachable\" (type 3, code 3)** เพราะ UDP port ที่ traceroute ใช้มักไม่มี process ใดฟังอยู่ — เมื่อ source ได้รับ ICMP message ประเภทนี้ จะรู้ว่าถึงปลายทางแล้วและหยุดส่ง — ระหว่างทาง source บันทึก RTT ของแต่ละ hop จากเวลาที่ ICMP message กลับมาถึง"}, {"type": "diagram", "layout": "lifeline", "title": "Traceroute: ค้นหาเส้นทางด้วย TTL", "actors": ["Source", "Router 1\n(TTL=1)", "Router 2\n(TTL=2)", "Destination\n(TTL=3)"], "steps": [{"from": 0, "to": 1, "label": "Probe (TTL=1)", "note": "ส่ง packet ที่ TTL หมดพอดีที่ hop แรก"}, {"from": 1, "to": 0, "label": "ICMP Time Exceeded", "note": "router 1 ตอบกลับพร้อมระบุตัวตน"}, {"from": 0, "to": 2, "label": "Probe (TTL=2)", "note": "เพิ่ม TTL ทีละ 1"}, {"from": 2, "to": 0, "label": "ICMP Time Exceeded", "note": "router 2 ตอบกลับ"}, {"from": 0, "to": 3, "label": "Probe (TTL=3)", "note": "TTL พอดีถึงปลายทาง"}, {"from": 3, "to": 0, "label": "Port Unreachable", "note": "ปลายทางตอบกลับ แสดงว่าถึงแล้ว"}]}]}, {"title": "Network Management: SNMP และ NETCONF/YANG", "body": "**Network management** ครอบคลุมการ deploy, integrate, และ coordinate ฮาร์ดแวร์/ซอฟต์แวร์/บุคลากรเพื่อ monitor, test, configure, analyze, evaluate และควบคุมทรัพยากรเครือข่าย ให้ตรงตามข้อกำหนดด้าน performance และ QoS แบบ real-time ด้วยต้นทุนที่สมเหตุสมผล", "blocks": [{"type": "subheading", "content": "องค์ประกอบของระบบ Network Management"}, {"type": "table", "content": "<table><tr><th>องค์ประกอบ</th><th>รายละเอียด</th></tr><tr><td>Managed device</td><td>อุปกรณ์ที่มี hardware/software ส่วนประกอบที่จัดการ/config ได้</td></tr><tr><td>Managing server</td><td>application (มักมีมนุษย์ในลูป) ที่ทำหน้าที่บริหารจัดการ</td></tr><tr><td>Network management protocol</td><td>ใช้โดย managing server เพื่อ query/config/manage device และใช้โดย device เพื่อแจ้งข้อมูล/event กลับไปยัง managing server</td></tr></table>"}, {"type": "subheading", "content": "3 แนวทางของ Network Operator"}, {"type": "table", "content": "<table><tr><th>แนวทาง</th><th>ลักษณะ</th></tr><tr><td>CLI (Command Line Interface)</td><td>operator สั่งงาน device ทีละตัวโดยตรง (เช่น ผ่าน ssh)</td></tr><tr><td>SNMP/MIB</td><td>operator query/set ข้อมูลของ device (MIB) ผ่าน Simple Network Management Protocol</td></tr><tr><td>NETCONF/YANG</td><td>แนวทางที่ abstract กว่า มองทั้งเครือข่ายเป็นภาพรวม (network-wide, holistic) เน้นการจัดการ config ของหลาย device พร้อมกัน</td></tr></table>"}, {"type": "subheading", "content": "SNMP: Simple Network Management Protocol"}, {"type": "note", "content": "**2 รูปแบบการสื่อสาร**:\n- **Request/response mode**: manager ส่ง request ไปยัง agent, agent ตอบกลับด้วย response\n- **Trap mode**: agent ส่ง trap message แจ้ง manager เมื่อเกิด event สำคัญ โดยไม่ต้องรอถูกถาม"}, {"type": "table", "content": "<table><tr><th>Message Type</th><th>หน้าที่</th></tr><tr><td>GetRequest, GetNextRequest, GetBulkRequest</td><td>manager-to-agent: \"ขอข้อมูลให้ฉันหน่อย\" (ทีละตัว/ตัวถัดไป/เป็น block)</td></tr><tr><td>SetRequest</td><td>manager-to-agent: กำหนดค่า MIB</td></tr><tr><td>Response</td><td>agent-to-manager: ค่าตอบกลับจาก request</td></tr><tr><td>Trap</td><td>agent-to-manager: แจ้ง manager เมื่อเกิด event ผิดปกติ</td></tr></table>"}, {"type": "note", "content": "**MIB (Management Information Base)**: ข้อมูล operational (และ configuration บางส่วน) ของ managed device ถูกรวบรวมไว้ใน MIB module — มี MIB module มาตรฐานกว่า 400 module ที่นิยามใน RFC (และยังมี vendor-specific MIB อีกมาก) นิยามด้วยภาษา **SMI (Structure of Management Information)**\n\n**ตัวอย่าง MIB variable ของ UDP protocol**: `UDPInDatagrams` (จำนวน datagram ที่ส่งถึงทั้งหมด), `UDPNoPorts` (จำนวน datagram ที่ส่งไม่ถึงเพราะไม่มี application ฟังที่ port นั้น), `UDPOutDatagrams` (จำนวน datagram ที่ส่งออกทั้งหมด)"}, {"type": "subheading", "content": "NETCONF และ YANG"}, {"type": "note", "content": "**NETCONF**: เป้าหมายคือจัดการ/config อุปกรณ์**ทั่วทั้งเครือข่าย**อย่าง active — ทำงานระหว่าง managing server กับ managed device รองรับ: retrieve/set/modify/activate configuration, **atomic-commit action ข้ามหลาย device พร้อมกัน**, query ข้อมูล operational/statistics, subscribe รับ notification จาก device — ใช้รูปแบบ **Remote Procedure Call (RPC)** โดย message เข้ารหัสเป็น **XML** ส่งผ่าน transport ที่ปลอดภัยและเชื่อถือได้ (เช่น TLS)\n\n**ลำดับการทำงาน**: `<hello>` (เริ่ม session, แลกเปลี่ยน capability) → `<rpc>`/`<rpc-reply>` (ทำ operation ต่างๆ ซ้ำได้หลายรอบ) → อาจมี `<notification>` แทรกได้ → `<close-session>` (ปิด session)\n\n**YANG**: ภาษา data modeling ที่ใช้กำหนดโครงสร้าง/syntax/semantics ของข้อมูล NETCONF (คล้าย SMI ของ SNMP) — สามารถสร้าง XML document อธิบาย capability ของ device จาก YANG description ได้ และยังใช้กำหนด**ข้อจำกัด (constraint)** ระหว่างข้อมูลที่ configuration ที่ถูกต้องต้องเป็นไปตาม เพื่อรับประกันความถูกต้อง/ความสอดคล้องของ configuration ที่ส่งผ่าน NETCONF"}, {"type": "table", "content": "<table><tr><th>NETCONF Operation</th><th>คำอธิบาย</th></tr><tr><td>&lt;get-config&gt;</td><td>ดึง configuration ทั้งหมดหรือบางส่วน</td></tr><tr><td>&lt;get&gt;</td><td>ดึงทั้ง configuration state และ operational state</td></tr><tr><td>&lt;edit-config&gt;</td><td>เปลี่ยน configuration ที่ device (รวมถึง running config) — ตอบกลับด้วย &lt;ok&gt; หรือ &lt;rpc-error&gt; พร้อม rollback</td></tr><tr><td>&lt;lock&gt;, &lt;unlock&gt;</td><td>ล็อค/ปลดล็อค configuration datastore เพื่อกันไม่ให้แหล่งอื่น (NETCONF/SNMP/CLI) เข้ามาแก้พร้อมกัน</td></tr><tr><td>&lt;create-subscription&gt;, &lt;notification&gt;</td><td>สมัครรับการแจ้งเตือน event จาก device</td></tr></table>"}]}, {"title": "สรุปท้ายบท: Chapter 5", "body": "บทนี้ครอบคลุม control plane ของ network layer อย่างครบถ้วน จากอัลกอริทึม routing แบบดั้งเดิมไปจนถึงแนวคิด SDN สมัยใหม่", "blocks": [{"type": "subheading", "content": "หัวข้อที่ครอบคลุมในบทนี้"}, {"type": "note", "content": "- **แนวทางของ network control plane**: per-router control (แบบดั้งเดิม) vs logically centralized control (SDN)\n- **Traditional routing algorithms**: link state (Dijkstra) และ distance vector (Bellman-Ford)\n- **การ implement จริงในอินเทอร์เน็ต**: OSPF (intra-AS), BGP (inter-AS)\n- **SDN controllers**: implement จริงเช่น ODL (OpenDaylight), ONOS\n- **ICMP**: error reporting, traceroute\n- **Network management**: SNMP, NETCONF/YANG"}, {"type": "note", "content": "**ก้าวต่อไป**: จบเรื่อง network layer ทั้ง data plane (Chapter 4) และ control plane (Chapter 5) แล้ว บทถัดไปจะเข้าสู่ **link layer** — ชั้นที่รับผิดชอบการส่งข้อมูลระหว่าง node ข้างเคียงโดยตรง (เช่น ผ่าน Ethernet, WiFi)"}]}];

function renderTOC(){
  const toc = document.getElementById("tocList");
  toc.innerHTML = "";
  SECTIONS.forEach((sec, idx)=>{
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = "#section_"+idx;
    a.textContent = sec.title;
    a.dataset.idx = idx;
    li.appendChild(a);
    toc.appendChild(li);
  });
}

function escapeXml(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function fmtTspans(text, x){
  return String(text==null?"":text).split("\n").map(function(line,i){
    return '<tspan x="'+x+'" dy="'+(i===0?0:15)+'">'+escapeXml(line)+'</tspan>';
  }).join("");
}

function renderDiagramBlock(block, secIdx, blockIdx){
  const uid = "dg_"+secIdx+"_"+blockIdx;
  const layout = block.layout || "lifeline";
  const actors = block.actors || [];
  const steps = block.steps || [];
  const n = actors.length;
  const W = 680;
  const margin = 76;
  const nodesX = [];
  for(let i=0;i<n;i++){ nodesX.push(n===1 ? W/2 : margin + i*((W-2*margin)/Math.max(1,n-1))); }
  let inner = "";
  let H = 0;

  if(layout === "flow"){
    const boxY = 50, boxH = 46;
    const boxW = Math.min(128, Math.max(70,(W-2*margin)/Math.max(1,n-1)-14));
    H = 168;
    actors.forEach(function(a,i){
      inner += '<rect class="diagram-node-box" x="'+(nodesX[i]-boxW/2)+'" y="'+boxY+'" width="'+boxW+'" height="'+boxH+'" rx="7"></rect>';
      inner += '<text class="diagram-actor-label" x="'+nodesX[i]+'" y="'+(boxY+boxH/2-6)+'" text-anchor="middle">'+fmtTspans(a, nodesX[i])+'</text>';
    });
    steps.forEach(function(st,i){
      const x1 = nodesX[st.from]+boxW/2+3, x2 = nodesX[st.to]-boxW/2-3;
      const y = boxY+boxH/2;
      const pid = uid+"_p"+i, mid = uid+"_m"+i;
      inner += '<path id="'+pid+'" class="diagram-arrow-path" d="M '+x1+' '+y+' L '+x2+' '+y+'"></path>';
      inner += '<text class="diagram-arrow-label" x="'+((x1+x2)/2)+'" y="'+(boxY-12)+'" text-anchor="middle">'+escapeXml(st.label||"")+'</text>';
      inner += '<circle id="'+mid+'d" class="diagram-glow-dot" r="6.5" cx="'+x1+'" cy="'+y+'">'
             + '<animateMotion id="'+mid+'" begin="indefinite" dur="0.75s" fill="freeze" path="M '+x1+' '+y+' L '+x2+' '+y+'"></animateMotion>'
             + '<animate attributeName="opacity" begin="'+mid+'.begin" dur="0.05s" from="0" to="1" fill="freeze"></animate>'
             + '<animate attributeName="opacity" begin="'+mid+'.end" dur="0.5s" from="1" to="0" fill="freeze"></animate>'
             + '</circle>';
    });
  } else {
    const rowH = 64, topY = 12, boxH = 38;
    H = topY + boxH + steps.length*rowH + 26;
    const boxW = Math.min(160, Math.max(80,(W-2*margin)/Math.max(1,n-1)-10));
    actors.forEach(function(a,i){
      inner += '<rect class="diagram-node-box" x="'+(nodesX[i]-boxW/2)+'" y="'+topY+'" width="'+boxW+'" height="'+boxH+'" rx="7"></rect>';
      inner += '<text class="diagram-actor-label" x="'+nodesX[i]+'" y="'+(topY+boxH/2-6)+'" text-anchor="middle">'+fmtTspans(a, nodesX[i])+'</text>';
      inner += '<line class="diagram-lifeline" x1="'+nodesX[i]+'" y1="'+(topY+boxH)+'" x2="'+nodesX[i]+'" y2="'+(H-8)+'"></line>';
    });
    steps.forEach(function(st,i){
      const y = topY+boxH+22 + i*rowH;
      const x1 = nodesX[st.from], x2 = nodesX[st.to];
      const pid = uid+"_p"+i, mid = uid+"_m"+i;
      inner += '<path id="'+pid+'" class="diagram-arrow-path" d="M '+x1+' '+y+' L '+x2+' '+y+'"></path>';
      inner += '<text class="diagram-arrow-label" x="'+((x1+x2)/2)+'" y="'+(y-9)+'" text-anchor="middle">'+escapeXml(st.label||"")+'</text>';
      inner += '<circle id="'+mid+'d" class="diagram-glow-dot" r="6.5" cx="'+x1+'" cy="'+y+'">'
             + '<animateMotion id="'+mid+'" begin="indefinite" dur="0.75s" fill="freeze" path="M '+x1+' '+y+' L '+x2+' '+y+'"></animateMotion>'
             + '<animate attributeName="opacity" begin="'+mid+'.begin" dur="0.05s" from="0" to="1" fill="freeze"></animate>'
             + '<animate attributeName="opacity" begin="'+mid+'.end" dur="0.5s" from="1" to="0" fill="freeze"></animate>'
             + '</circle>';
    });
  }

  const svg = '<svg class="diagram-svg" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" preserveAspectRatio="xMidYMid meet">'+inner+'</svg>';

  let stepsHtml = '<ol class="diagram-steps-list">';
  steps.forEach(function(st,i){
    stepsHtml += '<li><span class="step-num">'+(i+1)+'</span><strong>'+escapeXml(st.label||"")+'</strong>'+(st.note?(' — '+escapeXml(st.note)):'')+'</li>';
  });
  stepsHtml += '</ol>';

  return '<div class="diagram-block" id="'+uid+'">'
       + '<h4><span>🔀 '+escapeXml(block.title||"")+'</span><button class="diagram-play-btn" data-diagram-id="'+uid+'">&#9654; เล่นแอนิเมชัน / Play animation</button></h4>'
       + '<div class="diagram-svg-wrap">'+svg+'</div>'
       + stepsHtml
       + '</div>';
}

function diagramPlay(containerId){
  const wrap = document.getElementById(containerId);
  if(!wrap) return;
  const svg = wrap.querySelector('svg');
  const paths = svg.querySelectorAll('.diagram-arrow-path');
  const dots = svg.querySelectorAll('.diagram-glow-dot');
  const items = wrap.querySelectorAll('.diagram-steps-list li');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  items.forEach(function(li){ li.classList.remove('step-active'); });
  if(reduced){ return; }
  const stepDur = 850;
  paths.forEach(function(p){
    const len = p.getTotalLength();
    p.style.transition = 'none';
    p.style.strokeDasharray = len;
    p.style.strokeDashoffset = len;
  });
  void svg.getBoundingClientRect();
  paths.forEach(function(p,i){
    setTimeout(function(){
      p.style.transition = 'stroke-dashoffset '+(stepDur-100)+'ms ease';
      p.style.strokeDashoffset = 0;
      const anim = dots[i] ? dots[i].querySelector('animateMotion') : null;
      if(anim){ try{ anim.beginElement(); }catch(e){} }
      if(items[i]) items[i].classList.add('step-active');
    }, i*stepDur);
  });
}

function wireDiagramButtons(){
  document.querySelectorAll('.diagram-play-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ diagramPlay(btn.dataset.diagramId); });
  });
}

function renderContent(){
  const main = document.getElementById("mainArea");
  main.innerHTML = "";
  SECTIONS.forEach((sec, idx)=>{
    const card = document.createElement("div");
    card.className = "section-card";
    card.id = "section_"+idx;
    let html = "<h2>"+sec.title+"</h2>";
    if(sec.body){
      html += '<div class="body-text">'+sec.body+'</div>';
    }
    (sec.blocks || []).forEach((block, bi)=>{
      if(block.type === "note"){
        html += '<div class="callout callout-note"><span class="callout-title">หมายเหตุ / Note</span>'+block.content+'</div>';
      } else if(block.type === "example"){
        html += '<div class="callout callout-example"><span class="callout-title">ตัวอย่าง / Example</span>'+block.content+'</div>';
      } else if(block.type === "warning"){
        html += '<div class="callout callout-warning"><span class="callout-title">ข้อควรระวัง / Warning</span>'+block.content+'</div>';
      } else if(block.type === "formula"){
        html += '<div class="callout callout-formula"><span class="callout-title">'+(block.label || "สูตร / Formula")+'</span>'+block.content+'</div>';
      } else if(block.type === "subheading"){
        html += '<h3>'+block.content+'</h3>';
      } else if(block.type === "table"){
        html += block.content;
      } else if(block.type === "image"){
        html += '<div class="image-block"><img src="'+block.src+'" alt="'+(block.alt || "")+'" loading="lazy">';
        if(block.caption){
          html += '<div class="image-caption">'+block.caption+'</div>';
        }
        html += '</div>';
      } else if(block.type === "diagram"){
        html += renderDiagramBlock(block, idx, bi);
      }
    });
    card.innerHTML = html;
    main.appendChild(card);
  });

  if(window.renderMathInElement){
    renderMathInElement(main, {
      delimiters: [
        {left: "$$", right: "$$", display: true},
        {left: "$", right: "$", display: false}
      ]
    });
  }
}

function setupScrollSpy(){
  const links = document.querySelectorAll(".toc-list a");
  const sections = document.querySelectorAll(".section-card");
  window.addEventListener("scroll", ()=>{
    let currentIdx = 0;
    sections.forEach((sec, idx)=>{
      const rect = sec.getBoundingClientRect();
      if(rect.top <= 100) currentIdx = idx;
    });
    links.forEach(l=>l.classList.remove("active"));
    if(links[currentIdx]) links[currentIdx].classList.add("active");
  });
}

function setupReveal(){
  const cards = document.querySelectorAll('.section-card');
  if(!('IntersectionObserver' in window)){
    cards.forEach(function(c){ c.classList.add('revealed'); });
    return;
  }
  const io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){ e.target.classList.add('revealed'); io.unobserve(e.target); }
    });
  }, {threshold:0.08, rootMargin:'0px 0px -60px 0px'});
  cards.forEach(function(c){ io.observe(c); });
}

let fontScale = parseFloat(localStorage.getItem('netbook_fontScale')||'1');
function setFontScale(v){
  fontScale = Math.min(1.3, Math.max(0.85, Math.round(v*10)/10));
  try{ localStorage.setItem('netbook_fontScale', fontScale); }catch(e){}
  document.documentElement.style.setProperty('--fontScale', fontScale);
}

function updateProgress(){
  const el = document.documentElement;
  const max = el.scrollHeight - el.clientHeight;
  const pct = max>0 ? (el.scrollTop/max*100) : 0;
  const bar = document.getElementById('readProgress');
  if(bar) bar.style.width = pct+'%';
  const btt = document.getElementById('backToTop');
  if(btt){ if(el.scrollTop>420){ btt.classList.add('show'); } else { btt.classList.remove('show'); } }
}

renderTOC();
renderContent();
setupScrollSpy();
setupReveal();
wireDiagramButtons();
setFontScale(fontScale);

window.addEventListener('scroll', updateProgress);
const backToTopBtn = document.getElementById('backToTop');
if(backToTopBtn){ backToTopBtn.addEventListener('click', function(){ window.scrollTo({top:0,behavior:'smooth'}); }); }
const fontMinusBtn = document.getElementById('fontMinus');
if(fontMinusBtn){ fontMinusBtn.addEventListener('click', function(){ setFontScale(fontScale-0.1); }); }
const fontPlusBtn = document.getElementById('fontPlus');
if(fontPlusBtn){ fontPlusBtn.addEventListener('click', function(){ setFontScale(fontScale+0.1); }); }

</script>
