<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Chapter 1: Introduction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>

:root{
  color-scheme: light;
  --paper:#F6F4EE;
  --bg:#F6F4EE;
  --panel:#FFFFFF;
  --border:#DCD6C7;
  --text:#2A2A26;
  --text-soft:#6B6558;
  --navy:#1B3A5C;
  --navy-deep:#0F2740;
  --accent:#1B3A5C;
  --accent2:#2B6CB0;
  --accent-soft:#EAF1FA;
  --correct:#256D46;
  --correct-soft:#E7F3EB;
  --incorrect:#B3341F;
  --incorrect-soft:#FBEAE6;
  --flag:#B7862C;
  --flag-soft:#FBF1DA;
  --unanswered:#9A9486;
  --fontScale:1;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:'Sarabun',"Segoe UI",sans-serif;
  background:var(--paper);
  color:var(--text);
}
header{
  background:var(--navy-deep);
  border-bottom:4px solid var(--flag);
  box-shadow:0 2px 10px rgba(15,39,64,0.25);
  padding:16px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  position:sticky;
  top:0;
  z-index:10;
}
header h1{
  font-size:18px;
  margin:0;
  color:#F2EFE6;
  font-weight:700;
}
header .subtitle{
  font-size:12.5px;
  color:#C9C2AE;
  margin-top:2px;
}
.header-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.layout{
  display:flex;
  max-width:1200px;
  margin:0 auto;
  gap:20px;
  padding:20px;
}
.sidebar{width:250px;flex-shrink:0;}
.sidebar-panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:6px;
  padding:16px;
  position:sticky;
  top:80px;
  box-shadow:0 2px 8px rgba(15,39,64,0.06);
  max-height:calc(100vh - 100px);
  overflow-y:auto;
}
.sidebar-panel h3{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--text-soft);
  margin:0 0 10px 0;
  font-weight:600;
}
.toc-list{list-style:none;margin:0;padding:0;}
.toc-list li{margin-bottom:2px;}
.toc-list a{
  display:block;
  padding:7px 10px;
  border-radius:4px;
  color:var(--text);
  text-decoration:none;
  font-size:13px;
  border-left:3px solid transparent;
}
.toc-list a:hover{background:var(--accent-soft);color:var(--accent2);}
.toc-list a.active{background:var(--accent-soft);color:var(--navy);border-left:3px solid var(--navy);font-weight:600;}
main{flex:1;min-width:0;}
.section-card{
  background:var(--panel);
  border:1px solid var(--border);
  border-left:4px solid var(--navy);
  border-radius:6px;
  padding:24px;
  margin-bottom:18px;
  box-shadow:0 2px 10px rgba(15,39,64,0.06);
  scroll-margin-top:80px;
}
.section-card h2{
  margin:0 0 14px 0;
  font-size:18px;
  color:var(--navy-deep);
  padding-bottom:10px;
  border-bottom:2px solid var(--border);
}
.section-card h3{
  font-size:15px;
  color:var(--navy);
  margin:20px 0 10px 0;
}
.section-card .body-text{
  font-size:14.5px;
  line-height:1.9;
  white-space:pre-wrap;
}
.callout{
  margin:16px 0;
  padding:14px 16px;
  border-radius:6px;
  border-left:4px solid;
  font-size:14px;
  line-height:1.8;
}
.callout-note{background:var(--accent-soft);border-color:var(--accent2);}
.callout-example{background:#F4F2E8;border-color:var(--flag);}
.callout-warning{background:var(--incorrect-soft);border-color:var(--incorrect);}
.callout-formula{
  background:var(--navy-deep);
  color:#EAF1FA;
  border-color:var(--flag);
  font-family:'JetBrains Mono',monospace;
  overflow-x:auto;
}
.callout-title{
  font-weight:700;
  font-size:12.5px;
  text-transform:uppercase;
  letter-spacing:.04em;
  margin-bottom:8px;
  display:block;
}
.callout-note .callout-title{color:var(--accent2);}
.callout-example .callout-title{color:var(--flag);}
.callout-warning .callout-title{color:var(--incorrect);}
.callout-formula .callout-title{color:#C9DCF0;}
.image-block{
  margin:18px 0;
  text-align:center;
}
.image-block img{
  max-width:100%;
  height:auto;
  border-radius:6px;
  border:1px solid var(--border);
  box-shadow:0 2px 10px rgba(15,39,64,0.08);
}
.image-block .image-caption{
  font-size:12.5px;
  color:var(--text-soft);
  margin-top:8px;
  font-style:italic;
}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:13.5px;}
table th{background:var(--navy-deep);color:#F2EFE6;padding:9px 12px;text-align:left;}
table td{padding:8px 12px;border-bottom:1px solid var(--border);}
table tr:nth-child(even) td{background:#F4F2E8;}
@media (max-width:800px){
  .layout{flex-direction:column;}
  .sidebar{width:100%;}
  .sidebar-panel{position:static;max-height:none;}
}

</style>
<style>

/* ===== Readability & diagram enhancements ===== */
#readProgress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--flag),var(--accent2));width:0%;z-index:999;transition:width .12s ease;}

#backToTop{
  position:fixed;bottom:24px;right:24px;width:44px;height:44px;border-radius:50%;
  background:var(--navy-deep);color:#F2EFE6;border:none;cursor:pointer;font-size:18px;
  box-shadow:0 4px 14px rgba(15,39,64,0.3);display:none;align-items:center;justify-content:center;
  z-index:998;opacity:0;transition:opacity .2s ease, transform .2s ease;
}
#backToTop:hover{transform:translateY(-2px);}
#backToTop.show{display:flex;opacity:1;}

#fontCtrl{display:flex;gap:6px;align-items:center;}
#fontCtrl button{
  border:1.5px solid rgba(242,239,230,0.5);background:rgba(255,255,255,0.9);color:var(--navy);
  width:32px;height:32px;border-radius:4px;font-size:13px;cursor:pointer;font-weight:700;
  font-family:'Sarabun',sans-serif;
}
#fontCtrl button:hover{background:#fff;}

.section-card{opacity:0;transform:translateY(14px);transition:opacity .55s ease, transform .55s ease;}
.section-card.revealed{opacity:1;transform:translateY(0);}
@media (prefers-reduced-motion: reduce){
  .section-card{opacity:1;transform:none;transition:none;}
}

.section-card .body-text{font-size:calc(14.5px * var(--fontScale)) !important;}
.section-card h2{font-size:calc(18px * var(--fontScale)) !important;}
.section-card h3{font-size:calc(15px * var(--fontScale)) !important;}
.callout{font-size:calc(14px * var(--fontScale)) !important;}
table{font-size:calc(13.5px * var(--fontScale)) !important;}

.callout-note .callout-title::before{content:"📝 ";}
.callout-example .callout-title::before{content:"💡 ";}
.callout-warning .callout-title::before{content:"⚠️ ";}
.callout-formula .callout-title::before{content:"∑ ";}

/* ==== Animated sequence / flow diagrams ==== */
.diagram-block{
  margin:20px 0;padding:16px 18px 14px;background:#FBFAF6;border:1px solid var(--border);
  border-radius:8px;
}
.diagram-block h4{
  margin:0 0 12px 0;font-size:calc(14.5px * var(--fontScale));color:var(--navy-deep);
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
}
.diagram-play-btn{
  border:1.5px solid var(--accent2);background:#fff;color:var(--accent2);padding:5px 12px;
  border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Sarabun',sans-serif;
  flex-shrink:0;
}
.diagram-play-btn:hover{background:var(--accent-soft);}
.diagram-svg-wrap{overflow-x:auto;}
.diagram-svg{display:block;margin:0 auto;min-width:420px;}
.diagram-actor-label{font-family:'Sarabun',sans-serif;font-size:11.5px;font-weight:600;fill:var(--navy-deep);}
.diagram-lifeline{stroke:var(--border);stroke-width:1.5;stroke-dasharray:3,3;}
.diagram-node-box{fill:var(--panel);stroke:var(--navy);stroke-width:1.3;}
.diagram-arrow-path{fill:none;stroke:var(--accent2);stroke-width:2;marker-end:url(#arrowhead);}
.diagram-arrow-label{font-family:'JetBrains Mono',monospace;font-size:10.5px;fill:var(--navy-deep);}
.diagram-glow-dot{fill:var(--flag);filter:url(#glowFilter);opacity:0;}
.diagram-steps-list{list-style:none;margin:12px 0 0;padding:0;font-size:calc(13px * var(--fontScale));line-height:1.7;}
.diagram-steps-list li{padding:6px 10px;border-left:3px solid transparent;border-radius:4px;transition:background .3s ease, border-color .3s ease;}
.diagram-steps-list li.step-active{background:var(--accent-soft);border-left-color:var(--flag);}
.diagram-steps-list .step-num{
  display:inline-block;width:20px;height:20px;border-radius:50%;background:var(--navy);color:#fff;
  text-align:center;line-height:20px;font-size:11px;margin-right:8px;font-family:'JetBrains Mono',monospace;
}

</style>
</head>

<filter id="glowFilter" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.2" result="blur"></feGaussianBlur><feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter>

<script>
const SECTIONS = [{"title": "ภาพรวม: อินเทอร์เน็ตคืออะไร", "body": "อินเทอร์เน็ต มองได้ 2 มุม: มุม **nuts-and-bolts** (ฮาร์ดแวร์) และมุม **service** (บริการที่ให้แอปพลิเคชัน) เป้าหมายของบทนี้คือให้ภาพรวม คำศัพท์ และ \"ความรู้สึก\" ของระบบเครือข่าย ก่อนจะลงรายละเอียดในบทถัดไป", "blocks": [{"type": "subheading", "content": "มุมมองแบบ Nuts-and-Bolts (ฮาร์ดแวร์)"}, {"type": "note", "content": "อินเทอร์เน็ตประกอบด้วย **billions of connected computing devices** เรียกว่า **hosts** หรือ **end systems** ที่รัน network application อยู่ที่ \"edge\" (ขอบ) ของเครือข่าย hosts เชื่อมต่อกันด้วย **communication links** (fiber, copper, radio, satellite) ซึ่งมี transmission rate เรียกว่า **bandwidth** และ **packet switches** (routers, switches) ทำหน้าที่ forward packet (ก้อนข้อมูล) ไปยังปลายทาง เส้นทางที่ packet เดินทางผ่าน host, access network, ISP ต่างๆ จนถึงปลายทาง เรียกว่า **route** หรือ **path**"}, {"type": "subheading", "content": "อินเทอร์เน็ต = \"network of networks\""}, {"type": "note", "content": "อินเทอร์เน็ตคือเครือข่ายของเครือข่าย (interconnected ISPs) โครงสร้างประกอบด้วย mobile network, home network, enterprise network, datacenter network เชื่อมต่อผ่าน local/regional ISP และ national/global ISP ทั้งหมดถูกควบคุมด้วย **protocols** ที่ทำงานทุกที่ เช่น HTTP (Web), TCP, IP, WiFi, 4G/5G, Ethernet"}, {"type": "subheading", "content": "มุมมองแบบ Service (บริการ)"}, {"type": "note", "content": "อินเทอร์เน็ตคือ **infrastructure ที่ให้บริการแก่แอปพลิเคชัน** เช่น Web, streaming video, teleconferencing, email, games, e-commerce, social media, และ interconnected appliances (IoT) — โครงสร้างพื้นฐานนี้ให้ **programming interface** แก่แอปพลิเคชันที่กระจายอยู่ (distributed apps) คล้ายกับที่ postal service ให้บริการรับส่งจดหมาย โดยมี \"hooks\" ให้แอปฝั่งส่ง/รับเชื่อมต่อเพื่อใช้บริการขนส่งของอินเทอร์เน็ต"}, {"type": "subheading", "content": "Internet Standards"}, {"type": "note", "content": "มาตรฐานของอินเทอร์เน็ตถูกกำหนดโดย **IETF (Internet Engineering Task Force)** ผ่านเอกสารที่เรียกว่า **RFC (Request for Comments)**"}, {"type": "subheading", "content": "ตัวอย่างอุปกรณ์ IoT ที่เชื่อมต่ออินเทอร์เน็ต (\"Fun\" Internet-connected devices)"}, {"type": "note", "content": "นอกจาก host ทั่วไปอย่างคอมพิวเตอร์/มือถือแล้ว อินเทอร์เน็ตยังเชื่อมต่ออุปกรณ์ที่หลากหลายมาก เช่น ตู้เย็นอัจฉริยะ, กรอบรูปดิจิทัล, เครื่องวัดพลังงาน (Tweet-a-watt), เครื่องกระตุ้นหัวใจ, Fitbit, กล้องวงจรปิด, เครื่องปิ้งขนมปังต่ออินเทอร์เน็ต, และรถยนต์ที่เชื่อมต่อเครือข่าย"}, {"type": "image", "src": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wAARCAOsAyADASIAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAIEAQMFBgcI/8QARhAAAgECBAQEAwcEAgIBAgILAQIRAAMEEiExBUFRYRMicfAGMoEUQpGhscHRByPh8VJiFTMkFnKCCENTkiU0sheiwtLi/8QAGgEBAAMBAQEAAAAAAAAAAAAAAAECAwQFBv/EACoRAAICAgICAgMBAAIDAQEAAAABAhEDIRIxBEEyURMiYXEUQgVSgTOx/9oADAMBAAIRAxEAPwD9Fa9TT6mlKFB9TT6mlKAfU0+ppSgH1NPqaUoB9TT6mlKAfU0+ppSgH1NPqaUoB9TT6mlKAfU1hmCiWaB3NRu3BaSefKqjHNqd6huiUrLDYlV/5Go/am5D86rgyTWGO+mtUtlqRYGLYrOX6TQYuASwiOhqniMTZweHe/fuLbsoJZzsBXkOMfGtxbTHh/h2bQBm/iV16QF3GpG/X0qHOuy0YOTpI+hJdW4sqxrW+Mw1vMHxNpcu83AI9a+MYzjuN4hcc3Mdcu2tFkgguwJiFHlAmde3rWnDXfCuC0hUT5i7k5ydJJnt+3asX5UEdC8ObR9juce4VbYK3ELJJ2ytm/MaVqX4n4M1wJ/5K0rEZoYkafWvlNvi1yw2QMCA0kKpJiI9a3PjsRfsklMMqk+YtbmR0rJ+dD0a/wDAl7Z9bscVwGJjwMdYuE7Bbgn8K3+NbKyLgI7Ga+OW2sDHW7gGGS0ICqBqT0B9ZrrDH2QxFu7dsXCMsgGfp2rSHlxkZT8OUej6Q+IY/KYrUblyT5yfrXisN8X4mxZdr9pMXbRsoZTkP7zXouF8awPFknCXZuRLW30Ze0VupXtHO4uPaOlnf/m2vUmshyfvH8ajOnWselCCRdjpmP41JLtxGJDlhGxqG40070gEVILAxLc0/OtiXlfSYPQ1UAiaRI3iptkUi9SqqXmXSZHQ1vS8jmJg9DVkyrROlKVJApSlAKUpQClKUApSlAKUpQClKUApSlAKUpQClKUApSlAKUpQClKUApSlAKUpQClKUApSlAKUpQClKUApSlAKUpQClKUApSlAKUpQClKUApSlAKUpQClKUApSlAKUpQClKUApSlAKUpQClKUApSlAKUpQClKUApSlAKEgCTsKEgCToKqXbpuNAMKPzqG6CVkbzm4+mo5CoA7A8qy206CsMJ1GvSszQSCDXO4zxvBcEwXj4u5BOiWwRmuHoK0ce+JuH/D9gtiGN2/Erh7Wtxj6cq+f4vjq8VvtisUj3MSFEW ำเมื่อส่งหรือรับข้อความนั้น เปรียบเทียบได้กับ human protocol เช่น การทักทาย (\"Hi\" → \"Hi\" → \"Got the time?\" → \"2:00\")", "blocks": [{"type": "note", "content": "Protocol กำหนด **rules** สำหรับ: (1) ข้อความเฉพาะที่ถูกส่ง (specific messages sent) และ (2) action เฉพาะที่ทำเมื่อได้รับข้อความหรือเกิด event อื่น ตัวอย่างเช่น เมื่อ client เปิดเว็บ จะมีการทำ **TCP connection request** ก่อน แล้วจึงส่ง **TCP connection response** กลับ จากนั้นจึงส่ง HTTP GET request (เช่น `GET http://gaia.cs.umass.edu/kurose_ross`) แล้วรอรับไฟล์กลับมา — ทั้งหมดนี้เป็นลำดับที่ protocol กำหนดไว้ตายตัว"}, {"type": "example", "content": "เทียบกับ human protocol: A พูด \"Hi\" → B ตอบ \"Hi\" → A ถาม \"Got the time?\" → B ตอบเวลา นี่คือ format และ order ของข้อความที่ตกลงกันไว้ล่วงหน้า เหมือนกับที่ network protocol กำหนด format/order ของ packet"}, {"type": "diagram", "layout": "lifeline", "title": "การสื่อสารตามโพรโทคอล (A Human Protocol Analogy)", "actors": ["Host A\n(ผู้ส่ง)", "Host B\n(ผู้รับ)"], "steps": [{"from": 0, "to": 1, "label": "Hi! (Connection Request)", "note": "เปิดการสนทนา / initiate the exchange"}, {"from": 1, "to": 0, "label": "Hi! (Response)", "note": "ตอบรับว่าพร้อมสื่อสาร / acknowledge readiness"}, {"from": 0, "to": 1, "label": "ขอเวลาหน่อย? (Data Request)", "note": "ส่งคำขอข้อมูลจริง / send the actual request"}, {"from": 1, "to": 0, "label": "2:00 (Data)", "note": "ส่งข้อมูลตอบกลับ / respond with data"}]}]}, {"title": "Network Edge: Hosts, Access Network, Physical Media", "body": "**Network edge** คือส่วนขอบของเครือข่ายที่ hosts (clients และ servers) เชื่อมต่ออยู่ ในหัวข้อนี้จะพูดถึงวิธีที่ host เชื่อมต่อเข้าสู่เครือข่าย ผ่าน access network และ physical media ต่างๆ", "blocks": [{"type": "subheading", "content": "โครงสร้าง Internet โดยรวม"}, {"type": "note", "content": "**Network edge**: hosts (client/server) มักอยู่รวมกันเป็น data center สำหรับฝั่ง server\n**Access network / Physical media**: ลิงก์แบบมีสาย (wired) หรือไร้สาย (wireless) ที่เชื่อมต่อ host เข้าสู่ router ตัวแรก (edge router)\n**Network core**: routers ที่เชื่อมต่อกันเป็น mesh คือ \"network of networks\""}, {"type": "subheading", "content": "การส่งข้อมูล: Host sending function"}, {"type": "formula", "label": "Transmission Delay ของ 1 Packet", "content": "Host แบ่งข้อความของแอปพลิเคชันเป็น **packets** ขนาด $L$ บิต แล้วส่งเข้า access network ด้วย transmission rate $R$ (เรียกอีกชื่อว่า link capacity หรือ link bandwidth)\n\n$$d_{trans} = \\dfrac{L}{R}$$\n\nโดยที่ $L$ = ความยาว packet (บิต), $R$ = transmission rate ของ link (บิต/วินาที)"}, {"type": "example", "content": "ถ้า packet มีขนาด $L = 10{,}000$ บิต และ transmission rate $R = 100$ Mbps (=$10^8$ bps) จะได้ $d_{trans} = \\dfrac{10{,}000}{10^8} = 0.0001$ วินาที = 0.1 มิลลิวินาที"}, {"type": "subheading", "content": "Access Networks: Cable-based Access"}, {"type": "note", "content": "ใช้ **HFC (Hybrid Fiber Coax)** ส่งข้อมูลและทีวีในความถี่ต่างกันบนสายเคเบิลเดียว ใช้เทคนิค **FDM (Frequency Division Multiplexing)** — แต่ละ channel ถูกส่งในย่านความถี่ (frequency band) ที่แยกกัน โครงข่ายเชื่อมต่อบ้านเรือนไปยัง **cable headend** ผ่าน **CMTS (Cable Modem Termination System)** อัตราส่งข้อมูลแบบ asymmetric: downstream 40 Mbps–1.2 Gbps, upstream 30–100 Mbps บ้านต่างๆ **share** access network ร่วมกัน (ไม่เหมือน DSL)"}, {"type": "subheading", "content": "Access Networks: DSL (Digital Subscriber Line)"}, {"type": "note", "content": "ใช้สายโทรศัพท์เดิมเชื่อมไปยัง **central office** ผ่าน **DSLAM (DSL Access Multiplexer)** ข้อมูลและเสียงส่งในความถี่ต่างกันบนสายเดียวกัน (voice ไปที่ telephone network, data ไปที่ ISP) อัตราส่ง: downstream dedicated 24–52 Mbps, upstream dedicated 3.5–16 Mbps — เป็น **dedicated line** ไม่ share เหมือน cable"}, {"type": "subheading", "content": "Home Network และ Wireless Access"}, {"type": "note", "content": "Home network ทั่วไปรวม **router/firewall/NAT** และ **cable/DSL modem** ไว้ในกล่องเดียว เชื่อมต่อผ่าน WiFi access point (54–450 Mbps) หรือ wired Ethernet (1 Gbps)\n\n**Wireless access network** แบ่งเป็น 2 แบบหลัก:\n- **Wide-area cellular** (4G/5G): ครอบคลุมหลัก 10 กม. อัตรา 10's Mbps ผ่าน base station/cell tower\n- **WLAN (WiFi, 802.11)**: ครอบคลุมในอาคาร ~100 ฟุต อัตรา 11/54/450 Mbps ผ่าน access point"}, {"type": "subheading", "content": "Enterprise Network และ Data Center Network"}, {"type": "note", "content": "**Enterprise network** (บริษัท มหาวิทยาลัย): ผสมทั้ง wired (Ethernet 100Mbps–10Gbps) และ wireless (WiFi 11–450 Mbps) เชื่อมต่อ switch/router หลายตัว\n**Data center network**: ลิงก์ high-bandwidth (10s–100s Gbps) เชื่อมต่อ server หลักร้อยถึงหลักพันตัวเข้าด้วยกันและเข้าสู่อินเทอร์เน็ต"}, {"type": "subheading", "content": "Physical Media"}, {"type": "table", "content": "<table><tr><th>ประเภท</th><th>ตัวอย่าง</th><th>อัตราส่งข้อมูล</th></tr><tr><td>Guided (Twisted Pair)</td><td>Category 5 / Category 6</td><td>Cat5: 100Mbps–1Gbps Ethernet, Cat6: 10Gbps Ethernet</td></tr><tr><td>Guided (Fiber optic)</td><td>glass fiber, แสงคือบิต</td><td>10's–100's Gbps จุดต่อจุด, error rate ต่ำ, ทนสัญญาณรบกวนแม่เหล็กไฟฟ้า</td></tr><tr><td>Guided (Coaxial)</td><td>ตัวนำทองแดง 2 ชั้นซ้อน</td><td>bidirectional, broadband หลายร้อย Mbps ต่อ channel</td></tr><tr><td>Unguided (Radio - WiFi)</td><td>WLAN</td><td>10–100's Mbps, ระยะ 10's เมตร</td></tr><tr><td>Unguided (Radio - Cellular)</td><td>4G/5G</td><td>10's Mbps (4G), ระยะ ~10 กม.</td></tr><tr><td>Unguided (Satellite)</td><td>geostationary / Starlink</td><td>สูงสุด <100Mbps downlink (Starlink), delay geostationary ~270 msec</td></tr></table>"}, {"type": "image", "src": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wAARCADnASwDASIAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAYHAQQFAwII/8QAQBAAAQMDAQYDBgQDBgYDAAAAAQACAwQFEQYSITFBUWETcYEHFCJCkaEjMrHBFVLRJENTYoLwFjNyorLhksLS/8QAGgEBAAIDAQAAAAAAAAAAAAAAAAQFAQIDBv/EAC4RAAICAQMCBAYCAgMAAAAAAAABAgMEESExEkEFE1F ผ่านสื่อเข้าถึง", "note": "Wi-Fi/DSL/Cable"}, {"from": 1, "to": 2, "label": "เข้าสู่เครือข่าย ISP", "note": "access network → ISP"}, {"from": 2, "to": 3, "label": "ส่งต่อผ่าน Backbone", "note": "ISP → Internet core"}, {"from": 3, "to": 4, "label": "ถึงปลายทาง", "note": "routed to destination server"}]}]}, {"title": "Network Core: Packet Switching, Circuit Switching, โครงสร้างอินเทอร์เน็ต", "body": "**Network core** คือ mesh ของ router ที่เชื่อมต่อกัน ทำหน้าที่ forward packet จาก source ไปยัง destination ผ่านลิงก์ต่างๆ บนเส้นทาง มี 2 ฟังก์ชันหลักของ network core คือ **routing** และ **forwarding**", "blocks": [{"type": "subheading", "content": "Routing vs Forwarding"}, {"type": "note", "content": "**Routing** = global action ในการกำหนดเส้นทาง source-to-destination ของ packet ทั้งหมด ใช้ **routing algorithm**\n**Forwarding** (aka switching) = local action ที่ router ทำการย้าย packet ที่มาถึงจาก input link ไปยัง output link ที่เหมาะสม โดยดูจาก **local forwarding table** ที่แม็พ header value → output link"}, {"type": "subheading", "content": "Packet Switching: Store-and-Forward"}, {"type": "formula", "label": "Store-and-Forward Delay", "content": "แต่ละ router ต้องรับ packet **ทั้งก้อน** เข้ามาก่อน (store) จึงจะเริ่มส่งต่อ (forward) ไปยัง link ถัดไปได้ ใช้เวลา $L/R$ วินาทีในการ push packet ขนาด $L$ บิต เข้า link ที่อัตรา $R$ bps ต่อหนึ่ง hop\n\n$$\\text{one-hop transmission delay} = \\dfrac{L}{R}$$"}, {"type": "example", "content": "ตัวอย่าง one-hop: $L = 10$ Kbits, $R = 100$ Mbps → one-hop transmission delay $= \\dfrac{10{,}000}{100 \\times 10^6} = 0.1$ msec"}, {"type": "subheading", "content": "Packet Switching: Queueing"}, {"type": "note", "content": "Queueing เกิดขึ้นเมื่องานมาถึงเร็วกว่าที่ระบบจะให้บริการได้ (arrival rate > service rate) เมื่ออัตราการมาถึงของ packet (bps) เกิน transmission rate ของ output link เป็นระยะเวลาหนึ่ง จะเกิด **queue** รอส่ง และหาก buffer ของ router เต็ม packet ที่มาใหม่จะถูก **dropped (packet loss)**"}, {"type": "image", "src": "data:image tent": "Circuit Switching (ทางเลือกของ Packet Switching)"}, {"type": "note", "content": "**Circuit switching** จอง resource แบบ end-to-end ไว้ล่วงหน้าสำหรับแต่ละ \"call\" ระหว่าง source-destination — ให้ประสิทธิภาพแบบ **guaranteed** (circuit-like) แต่ resource จะ **idle** ถ้าไม่มีการใช้งาน (ไม่ share กับผู้ใช้อื่น) นิยมใช้ใน telephone network ดั้งเดิม\n\nการ multiplex บน circuit switching ทำได้ 2 แบบ:\n- **FDM (Frequency Division Multiplexing)**: แบ่งความถี่เป็นแถบแคบๆ ให้แต่ละ call\n- **TDM (Time Division Multiplexing)**: แบ่งเวลาเป็น slot ให้แต่ละ call ใช้ full bandwidth เฉพาะช่วง slot ของตัวเอง"}, {"type": "example", "content": "**เปรียบเทียบ Circuit Switching vs Packet Switching**: link 1 Gbps, ผู้ใช้แต่ละคนต้องการ 100 Mbps เมื่อ \"active\" และ active เพียง 10% ของเวลา\n\n- **Circuit switching**: รองรับได้แค่ **10 users** (1000Mbps ÷ 100Mbps ต่อคน = จองแบบตายตัว)\n- **Packet switching**: รองรับได้ถึง **35 users** โดยความน่าจะเป็นที่มีมากกว่า 10 คน active พร้อมกัน (เกิน capacity) น้อยกว่า 0.0004 (คำนวณด้วย binomial distribution — เป็นแบบฝึกหัดสำหรับผู้ที่เรียนวิชาความน่าจะเป็นมาแล้ว)"}, {"type": "note", "content": "**Packet switching ดีกว่าเสมอไหม?** ข้อดี: เหมาะกับข้อมูลแบบ \"bursty\", แชร์ resource ได้, ไม่ต้องมี call setup ข้อเสีย: อาจเกิด congestion, packet delay/loss จาก buffer overflow, ต้องมี protocol สำหรับ reliable data transfer และ congestion control เพิ่มเติม"}, {"type": "subheading", "content": "โครงสร้างอินเทอร์เน็ต: Network of Networks"}, {"type": "note", "content": "การเชื่อมต่อ access ISP ทุกคู่โดยตรงไม่ scale เพราะใช้ $O(N^2)$ connections จึงวิวัฒนาการมาเป็นโครงสร้างแบบลำดับชั้น:\n\n1. เชื่อมต่อผ่าน **global transit ISP** เดียว (แต่พอมีการแข่งขันทางธุรกิจ ก็เกิด ISP หลายราย)\n2. ISP หลายรายเชื่อมกันผ่าน **IXP (Internet Exchange Point)** ด้วย **peering link**\n3. เกิด **regional ISP** เชื่อม access net เข้ากับ ISP ใหญ่\n4. เกิด **content provider network** (เช่น Google, Microsoft, Akamai) ที่วางเครือข่ายของตัวเองเพื่อนำ content เข้าใกล้ผู้ใช้\n\nผลลัพธ์สุดท้ายคือโครงสร้างแบบลำดับชั้น: ที่ \"ศูนย์กลาง\" มี **Tier-1 ISP** (เช่น Level 3, Sprint, AT&T, NTT) จำนวนน้อยที่เชื่อมต่อกันครอบคลุมระดับประเทศ/นานาชาติ ร่วมกับ content provider network ส่วนตัวที่มักข้าม (bypass) tier-1/regional ISP ไปเชื่อม data center ของตัวเองเข้าสู่อินเทอร์เน็ตโดยตรง"}, {"type": "diagram", "layout": "lifeline", "title": "Packet Switching แบบ Store-and-Forward", "actors": ["Host A", "Router R1", "Router R2", "Host B"], "steps": [{"from": 0, "to": 1, "label": "ส่ง Packet ทั้งก้อน", "note": "host A ส่งเต็ม packet"}, {"from": 1, "to": 2, "label": "รอรับครบก่อนค่อยส่งต่อ", "note": "Store-and-Forward: R1 ต้องรับครบทั้ง packet ก่อนส่งต่อ"}, {"from": 2, "to": 3, "label": "ส่งต่อถึงปลายทาง", "note": "R2 ส่งต่อให้ host B"}]}]}, {"title": "Performance: Delay, Loss, Throughput", "body": "หัวข้อนี้อธิบายที่มาของ packet delay และ loss อย่างละเอียด พร้อมสูตรคำนวณและตัวอย่างที่ใช้บ่อยในข้อสอบ", "blocks": [{"type": "subheading", "content": "สาเหตุของ Packet Delay และ Loss"}, {"type": "note", "content": "Packet queue อยู่ใน router buffer เพื่อรอ transmission ความยาวของ queue จะเพิ่มขึ้นเมื่อ arrival rate (ชั่วคราว) เกิน output link capacity หาก memory ที่เก็บ queue เต็ม จะเกิด **packet loss**"}, {"type": "formula", "label": "Nodal Delay (4 องค์ประกอบ)", "content": "$$d_{nodal} = d_{proc} + d_{queue} + d_{trans} + d_{prop}$$\n\n- $d_{proc}$ (**nodal processing delay**): เวลาตรวจ bit error + หา output link — โดยทั่วไป < microseconds\n- $d_{queue}$ (**queueing delay**): เวลารอที่ output link ก่อนถูกส่ง ขึ้นกับระดับ congestion ของ router\n- $d_{trans}$ (**transmission delay**): $d_{trans} = \\dfrac{L}{R}$ โดย $L$ = ความยาว packet (บิต), $R$ = transmission rate ของ link (bps)\n- $d_{prop}$ (**propagation delay**): $d_{prop} = \\dfrac{d}{s}$ โดย $d$ = ความยาวลิงก์ทางกายภาพ, $s$ = ความเร็วการแพร่กระจายสัญญาณ (~$2\\times10^8$ m/sec)"}, {"type": "warning", "content": "$d_{trans}$ กับ $d_{prop}$ **ต่างกันโดยพื้นฐาน** — $d_{trans}$ คือเวลา \"ผลัก\" ทั้ง packet เข้า link (ขึ้นกับขนาด packet และอัตราส่ง) ส่วน $d_{prop}$ คือเวลาที่บิตแรก/บิตสุดท้ายเดินทางทางกายภาพจากต้นทางถึงปลายทาง (ขึ้นกับระยะทางและความเร็วแสง/สัญญาณ) — เป็นจุดที่มักเข้าใจผิดในการสอบ"}, {"type": "example", "content": "**Caravan analogy**: caravan (ขบวนรถ) 10 คัน เปรียบเหมือน packet 10 บิต toll booth (ด่านเก็บเงิน) เปรียบเหมือน link แต่ละคันใช้เวลา 12 วินาทีผ่านด่าน (เปรียบเหมือน bit transmission time) และวิ่งด้วยความเร็ว 100 กม./ชม. ระยะทางระหว่าง 2 ด่าน = 100 กม.\n\n- เวลา \"ผลัก\" ทั้งขบวนผ่านด่านแรก (transmission) $= 12 \\times 10 = 120$ วินาที\n- เวลาที่รถคันสุดท้ายเดินทางจากด่าน 1 ถึงด่าน 2 (propagation) $= \\dfrac{100 \\text{ km}}{100 \\text{ km/hr}} = 1$ ชั่วโมง\n- เวลารวมจนกว่าขบวนทั้งหมดจะเรียงแถวที่ด่านที่สอง $= 120\\text{s} + 3600\\text{s} = 3720\\text{s} = 62$ นาที (เพราะรถคันแรกวิ่งไปพร้อมกับที่คันหลังๆ ยังถูกผลักออกจากด่านแรก)"}, {"type": "formula", "label": "Traffic Intensity (Queueing Delay)", "content": "$$\\text{traffic intensity} = \\dfrac{La}{R}$$\n\nโดย $a$ = อัตราการมาถึงเฉลี่ยของ packet (packet/sec), $L$ = ความยาว packet (บิต), $R$ = link bandwidth (bps)\n\n- $La/R \\approx 0$: queueing delay เฉลี่ยน้อย\n- $La/R \\to 1$: queueing delay เฉลี่ยมาก\n- $La/R > 1$: มี \"งาน\" เข้ามามากกว่าที่ระบบให้บริการได้ → queueing delay เฉลี่ย **เป็นอนันต์** (infinite)"}, {"type": "subheading", "content": "traceroute: การวัด delay จริงในอินเทอร์เน็ต"}, {"type": "note", "content": "**traceroute** วัด delay จาก source ไปยัง router แต่ละตัวบนเส้นทางสู่ destination โดยส่ง packet 3 ชุด (มี TTL = i) ไปยัง router ตัวที่ $i$ บนเส้นทาง router นั้นจะส่ง packet กลับมาที่ sender แล้ว sender วัดช่วงเวลาระหว่างส่งกับได้รับตอบกลับ — เครื่องหมาย `* * *` หมายถึงไม่มีการตอบกลับ (probe หาย หรือ router ไม่ตอบ)"}, {"type": "image", "src": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wAAR ที่โปร่งใส\" ทำให้ผู้ออกแบบ protocol ต้อง \"ไล่ตาม\" (catch-up) ปัญหาความปลอดภัยในภายหลัง — ความปลอดภัยจึงเป็นเรื่องที่ต้องพิจารณาในทุก layer", "blocks": [{"type": "subheading", "content": "รูปแบบการโจมตี (Bad Guys)"}, {"type": "note", "content": "**Packet sniffing**: บน broadcast media (shared Ethernet, wireless) network interface ที่ตั้งเป็น promiscuous mode สามารถอ่าน/บันทึก packet ทุกตัวที่ผ่าน (รวมถึงรหัสผ่าน!) — เครื่องมือที่ใช้ทั่วไปคือ **Wireshark** (ใช้ในแล็บท้ายบท)"}, {"type": "image", "src": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wAARCADhAOEDASIAAhEBAxEB/8QAHQAAAgIDAQEBAAAAAAAAAAAAAAcCAwEFBggECf/EAFIQAAECAwMDDQsJBQcFAQAAAAEAAgMEBQYREgcTIRQiMTZBUVJVcYGRkrIWMkJUYXJ0oaKx0QgVFyNik8HC0iQzc4LwJjQ1Q1Nj4yVEZIOj4f/EABoBAAMAAwEAAAAAAAAAAAAAAAABBQIEBgP/xAAyEQACAQEECAQGAwEBAAAAAAAAAQIDBAURExIVITNBUnGhMTJRwRQigZGx8CM0YdHh/9oADAMBAAIRAxEAPwD0ilBbzLhDpVadZmxsk2v2gxFj9JzEu4DSCRdjI3QCAN03ghfJ8oTKbHsnRIdnaPMOg1eqML4kZhudLwL7iQdxziCAdwBx0G4rzpk1rrLP27kpmL+4jEy8U3X4Q7QHczsJ5AUAMKr0zLJa2I6JVK46Vab/AKhk4IMNo8yFoPKbytAMhtp5mJnJmpU3E7ZLosR7iep+K9BwpTwnP5grdSwP6cVloM83USECzIHUT+9rkozzYLj8Fe3IBG8K0UNvJKk/nT31PB/pxUcxB4HtFPQYZkRHD5P/AArS9El/yK+HkCkvDr8w7klgPzFOrMQeB7RRmIPA9op5bFmxE03ILS/CrU47khNCsGQWi8cT3VZ8E4MzB4HtFGZg8D2ijLYZsRRDINQeNqh7H6VkZB7P8Z1LpZ+lNvMweB7RRmoP9Eoy5Czoil+geznGVU68P9Cz9BFnOMKp14f6E2MxB+10lRzED7XWKeVIM6IqfoJs1xhVPvIf6EfQTZrjCqfeQ/0JqamluA7pKjqeW4DukoypCz4Cs+gmzXGVU68P9Cwchdm+M6l14f6E0zKy3Ad0lRMrLcB3SU8mQviICrOQuzvGtS6Yf6VW7IbQfBqtQ/8AmfwTWMpLcB3XKiZSW4DuuUZMg+IgKh+Q2i+DWp7nYwr535Dad4FoJhvnS4P5gm6ZSU4DuuVEyUpwHdcoyZC+JgJp2QuF4NpemS/5FQ/IfFB1loILuWWI/MU6TJSnAd1yomSlOA7rlPIkHxMBGRsi9Yha6Wq1Pc4cIvYfU0rY0+l5V7LRGxqPaCM/BsQoc7jYf/XE1p5wm+ZKU4DuuV8k1Tfq8UrF13AfsHn3EnQkhq0wZ81hflE5yp/MNvZRlKng4QxOtBbCxbmcae83NcDh0360aU+Wua9gc04mnSCN1eA7dTrp62c9FcxzMDmwxiFxIa0Nxc9148hCeXybsp8e ></tr><tr><td>Integrity checks</td><td>digital signature ป้องกัน/ตรวจจับการปลอมแปลงข้อมูล</td></tr><tr><td>Access restriction</td><td>password-protected VPN</td></tr><tr><td>Firewall</td><td>\"middlebox\" เฉพาะทางใน access/core network ทำงานแบบ off-by-default กรอง incoming packet เพื่อจำกัด sender/receiver/application และช่วยตรวจจับ/ตอบสนองต่อ DoS attack</td></tr></table>"}]}, {"title": "Protocol Layers, Service Models และ Encapsulation", "body": "การจัดโครงสร้างระบบเครือข่ายที่ซับซ้อนใช้แนวคิด **layering** โดยแต่ละ layer ให้บริการผ่าน action ภายในของตัวเอง และอาศัยบริการจาก layer ที่อยู่ด้านล่าง", "blocks": [{"type": "subheading", "content": "ทำไมต้อง Layering?"}, {"type": "example", "content": "**เปรียบเทียบกับการเดินทางโดยเครื่องบิน**: การเดินทางประกอบด้วยหลาย service ซ้อนกัน — ticketing service, baggage service, gate service, runway service, routing service เมื่อเปลี่ยน procedure ของ gate service (เช่น เปลี่ยนวิธี boarding) จะ **ไม่กระทบ** ต่อ service อื่นๆ ในระบบ — นี่คือประโยชน์ของ layering"}, {"type": "note", "content": "**ประโยชน์ของ Layering**:\n- โครงสร้างชัดเจน ช่วยระบุความสัมพันธ์ของแต่ละส่วนในระบบ (explicit structure)\n- **Modularization**: การเปลี่ยนแปลง implementation ของ service ใน layer หนึ่ง จะ **โปร่งใส (transparent)** ต่อส่วนอื่นของระบบ ทำให้ maintain/update ระบบง่ายขึ้น"}, {"type": "subheading", "content": "Layered Internet Protocol Stack (5 Layers)"}, {"type": "table", "content": "<table><tr><th>Layer</th><th>หน้าที่</th><th>ตัวอย่าง Protocol</th></tr><tr><td>Application</td><td>รองรับ network application</td><td>HTTP, IMAP, SMTP, DNS</td></tr><tr><td>Transport</td><td>ส่งข้อมูลระหว่าง process-to-process</td><td>TCP, UDP</td></tr><tr><td>Network</td><td>routing ของ datagram จาก source ถึง destination</td><td>IP, routing protocols</td></tr><tr><td>Link</td><td>ส่งข้อมูลระหว่าง element ข้างเคียงในเครือข่าย</td><td>Ethernet, 802.11 (WiFi), PPP</td></tr><tr><td>Physical</td><td>บิต \"บนสาย\"</td><td>-</td></tr></table>"}, {"type": "subheading", "content": "Encapsulation: การห่อหุ้มข้อมูลแต่ละ Layer"}, {"type": "note", "content": "แต่ละ layer จะ **encapsulate** (ห่อหุ้ม) ข้อมูลจาก layer บนด้วย header ของตัวเอง คล้ายกับ **ตุ๊กตาแม่ลูกดก (Matryoshka / stacking dolls)**:\n\n1. Application แลกเปลี่ยน **message (M)** ผ่าน transport layer\n2. Transport layer ห่อหุ้ม $M$ ด้วย header $H_t$ กลายเป็น **segment** $[H_t \\mid M]$ — ใช้เพื่อบริการเช่น reliable delivery\n3. Network layer ห่อหุ้ม $[H_t \\mid M]$ ด้วย header $H_n$ กลายเป็น **datagram** $[H_n \\mid H_t \\mid M]$\n4. Link layer ห่อหุ้ม $[H_n \\mid H_t \\mid M]$ ด้วย header $H_l$ กลายเป็น **frame** $[H_l \\mid H_n \\mid H_t \\mid M]$"}, {"type": "formula", "label": "ลำดับชื่อหน่วยข้อมูลแต่ละ Layer (PDU)", "content": "$$\\text{Application: } M \\quad\\to\\quad \\text{Transport: segment} = [H_t \\mid M] \\quad\\to\\quad \\text{Network: datagram} = [H_n \\mid H_t \\mid M] \\quad\\to\\quad \\text{Link: frame} = [H_l \\mid H_n \\mid H_t \\mid M]$$"}, {"type": "warning", "content": "ที่ router (network layer) จะแกะเฉพาะ $H_n$ ออกดูเพื่อตัดสินใจ forward แต่ **ไม่แกะ** $H_t$ หรือ $M$ — ส่วนที่ switch (link layer) จะแกะเฉพาะ $H_l$ เท่านั้น การเข้าใจว่า layer ไหนแกะ header ระดับไหน เป็นจุดที่มักออกข้อสอบ"}, {"type": "diagram", "layout": "flow", "title": "Encapsulation: การห่อหุ้มข้อมูลผ่าน 5 Layer", "actors": ["Application\nData", "Transport\n+TCP/UDP Header", "Network\n+IP Header", "Link\n+Frame Header/Trailer", "Physical\nBits (0101...)"], "steps": [{"from": 0, "to": 1, "label": "+ Transport Header", "note": "แบ่งเป็น Segment"}, {"from": 1, "to": 2, "label": "+ Network Header", "note": "แบ่งเป็น Datagram/Packet"}, {"from": 2, "to": 3, "label": "+ Link Header/Trailer", "note": "แบ่งเป็น Frame"}, {"from": 3, "to": 4, "label": "แปลงเป็นสัญญาณ", "note": "ส่งเป็น bit ผ่านสื่อกลาง"}]}]}, {"title": "ISO/OSI Reference Model (เนื้อหาเสริม)", "body": "OSI (Open Systems Interconnection) เป็น reference model แบบ 7 ชั้น ซึ่งมี 2 layer ที่ **ไม่พบ** ใน Internet protocol stack (ที่มีเพียง 5 layer)", "blocks": [{"type": "table", "content": "<table><tr><th>Layer (OSI 7-layer)</th><th>หน้าที่</th></tr><tr><td>Application</td><td>รองรับ network application (เหมือน Internet stack)</td></tr><tr><td>Presentation</td><td>ให้แอปพลิเคชันตีความความหมายของข้อมูล เช่น encryption, compression, machine-specific convention</td></tr><tr><td>Session</td><td>synchronization, checkpointing, recovery ของการแลกเปลี่ยนข้อมูล</td></tr><tr><td>Transport</td><td>เหมือน Internet stack</td></tr><tr><td>Network</td><td>เหมือน Internet stack</td></tr><tr><td>Link</td><td>เหมือน Internet stack</td></tr><tr><td>Physical</td><td>เหมือน Internet stack</td></tr></table>"}, {"type": "warning", "content": "**Presentation** และ **Session** layer เป็น 2 layer ที่ Internet protocol stack \"ขาดหายไป\" เมื่อเทียบกับ OSI — หากต้องการบริการเหล่านี้ (เช่น encryption, session recovery) ต้อง **implement เองใน application layer**"}, {"type": "image", "src": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wAARCAOoAyADASIAAhEBAxEB/8QAHAAAAQQDAQAAAAAAAAAAAAAAAgABAwcEBggF/8QAUhAAAQMCBQIEAwUECAEICAYDAQIDEQAEBQYSITEHQRMiUWEIMnEUI0KBkRVSobEWFyQzYnLB0VMYJTRDY3OC4SYnNkSDkqKyNVRkdJPw8UVV/8QAGQEBAQEBAQEAAAAAAAAAAAAAAAECAwQF/8QALBEBAQACAQQCAQQDAAMAAwAAAAECESESMUFRA2EiEzJSYkJxgSMzgnKhsf/aAAwDAQACEQMRAD8A5/8An5qVtO+42oUJ4qdKFEgCtA0oBNSIQZgU6GynmjSnfatQFpI5peGdXrNEVDgzSJhMDmiEn0iBRoEkkjYUM6Uie9IO7d/SrAylEn2pyqBv34ig1AqPMU0yJOwFNh1akqBo1LUEiRvQoWid1E0i4SdI3HvUDSdZgiiMnYx+VCrQSACZ70PiaVb8CqDIKEagQD6Gm1kp3Ik+lB4gXyN+1IxEgQamw6pAACpFAO+80WkbbnenSgKJAp3AARvIjuKOSeIpeHKCNpPNOlMJ2HFFOn00k+9EkjmJPtTgHw/KaIIgFQMRTQFxBMHSacNwJowVGmSolRAG1a14D7JGoHenB1GZFPpBTGmmVpbHr7UDiZ8sTQwlPI3ptZUZSIntTlSijTAmpAykzueKEKAkEEjtTBSkCFbk00lIMk/7U2H8pVvIPvTKGkyVAntFRqVr7yr1plSoQIkVEOpUpknikVjtTJaUUKKiNqjICVjfiijCTyNpoSpSVQBRKUAR5jB7UEidQJMVA5OqY2oeeO1 AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAf/Z", "alt": "แผนภาพ ARPA Network ธันวาคม 1969", "caption": "The ARPA Network, Dec 1969 — ผังเครือข่าย ARPANET ยุคแรกเริ่ม มีเพียง 4 nodes (UCLA, SRI, UCSB, Utah)"}, {"type": "subheading", "content": "1972–1980: Internetworking และเครือข่ายเฉพาะทาง"}, {"type": "note", "content": "- 1970: ALOHAnet (ดาวเทียม ฮาวาย)\n- 1974: Cerf และ Kahn เสนอ architecture สำหรับเชื่อมต่อเครือข่าย\n- 1976: Ethernet ที่ Xerox PARC\n- ปลายยุค 70's: architecture เฉพาะราย เช่น DECnet, SNA, XNA\n- 1979: ARPAnet มี 200 nodes\n\nหลักการ internetworking ของ Cerf/Kahn ที่กำหนด architecture ของอินเทอร์เน็ตปัจจุบัน: **minimalism/autonomy** (ไม่ต้องเปลี่ยนภายในเครือข่ายเดิมเพื่อเชื่อมต่อ), **best-effort service model**, **stateless routing**, **decentralized control**"}, {"type": "subheading", "content": "1980–1990: โปรโตคอลใหม่ เครือข่ายขยายตัว"}, {"type": "note", "content": "- เครือข่ายระดับชาติใหม่: CSnet, BITnet, NSFnet, Minitel — รวม 100,000 hosts\n- 1982: SMTP (email protocol)\n- 1983: TCP/IP ถูกใช้งาน, DNS ถูกกำหนดสำหรับแปลงชื่อเป็น IP address\n- 1985: FTP protocol\n- 1988: TCP congestion control"}, {"type": "subheading", "content": "1990–2000s: การพาณิชย์, เว็บ, แอปใหม่"}, {"type": "note", "content": "- ต้น 1990s: ARPAnet ถูกปลดระวาง, NSF ยกเลิกข้อจำกัดการใช้เชิงพาณิชย์ของ NSFnet (ปลดระวาง 1995)\n- ต้น 1990s: **Web** เกิดขึ้น (แนวคิด hypertext จาก Bush 1945, Nelson 1960's) HTML/HTTP โดย Berners-Lee\n- 1994: Mosaic แล้วตามด้วย Netscape\n- ปลาย 1990s: การพาณิชย์ของ Web\n- ปลาย 1990s–2000s: killer app ใหม่ (instant messaging, P2P file sharing), network security เริ่มเป็นประเด็นสำคัญ, ประมาณ 50 ล้าน hosts, ผู้ใช้กว่า 100 ล้านคน, backbone link ระดับ Gbps"}, {"type": "subheading", "content": "2005–ปัจจุบัน: Scale, SDN, Mobility, Cloud"}, {"type": "note", "content": "- broadband home access แพร่หลาย (10–100's Mbps)\n- 2008: **SDN (Software-Defined Networking)**\n- wireless ความเร็วสูงแพร่หลาย (4G/5G, WiFi)\n- ผู้ให้บริการรายใหญ่ (Google, FB, Microsoft) สร้างเครือข่ายของตัวเอง เพื่อ bypass commercial Internet และเข้าใกล้ผู้ใช้\n- องค์กรต่างๆ ย้ายไปรัน service บน **cloud** (เช่น AWS, Microsoft Azure)\n- 2017: อุปกรณ์มือถือเชื่อมต่อ Internet มากกว่าอุปกรณ์ fixed\n- ~15 พันล้านอุปกรณ์เชื่อมต่ออินเทอร์เน็ต (2023, statista.com)"}]}];

function renderTOC(){
  const toc = document.getElementById("tocList");
  toc.innerHTML = "";
  SECTIONS.forEach((sec, idx)=>{
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = "#section_"+idx;
    a.textContent = sec.title;
    a.dataset.idx = idx;
    li.appendChild(a);
    toc.appendChild(li);
  });
}

function escapeXml(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function fmtTspans(text, x){
  return String(text==null?"":text).split("\n").map(function(line,i){
    return '<tspan x="'+x+'" dy="'+(i===0?0:15)+'">'+escapeXml(line)+'</tspan>';
  }).join("");
}

function renderDiagramBlock(block, secIdx, blockIdx){
  const uid = "dg_"+secIdx+"_"+blockIdx;
  const layout = block.layout || "lifeline";
  const actors = block.actors || [];
  const steps = block.steps || [];
  const n = actors.length;
  const W = 680;
  const margin = 76;
  const nodesX = [];
  for(let i=0;i<n;i++){ nodesX.push(n===1 ? W/2 : margin + i*((W-2*margin)/Math.max(1,n-1))); }
  let inner = "";
  let H = 0;

  if(layout === "flow"){
    const boxY = 50, boxH = 46;
    const boxW = Math.min(128, Math.max(70,(W-2*margin)/Math.max(1,n-1)-14));
    H = 168;
    actors.forEach(function(a,i){
      inner += '<rect class="diagram-node-box" x="'+(nodesX[i]-boxW/2)+'" y="'+boxY+'" width="'+boxW+'" height="'+boxH+'" rx="7"></rect>';
      inner += '<text class="diagram-actor-label" x="'+nodesX[i]+'" y="'+(boxY+boxH/2-6)+'" text-anchor="middle">'+fmtTspans(a, nodesX[i])+'</text>';
    });
    steps.forEach(function(st,i){
      const x1 = nodesX[st.from]+boxW/2+3, x2 = nodesX[st.to]-boxW/2-3;
      const y = boxY+boxH/2;
      const pid = uid+"_p"+i, mid = uid+"_m"+i;
      inner += '<path id="'+pid+'" class="diagram-arrow-path" d="M '+x1+' '+y+' L '+x2+' '+y+'"></path>';
      inner += '<text class="diagram-arrow-label" x="'+((x1+x2)/2)+'" y="'+(boxY-12)+'" text-anchor="middle">'+escapeXml(st.label||"")+'</text>';
      inner += '<circle id="'+mid+'d" class="diagram-glow-dot" r="6.5" cx="'+x1+'" cy="'+y+'">'
             + '<animateMotion id="'+mid+'" begin="indefinite" dur="0.75s" fill="freeze" path="M '+x1+' '+y+' L '+x2+' '+y+'"></animateMotion>'
             + '<animate attributeName="opacity" begin="'+mid+'.begin" dur="0.05s" from="0" to="1" fill="freeze"></animate>'
             + '<animate attributeName="opacity" begin="'+mid+'.end" dur="0.5s" from="1" to="0" fill="freeze"></animate>'
             + '</circle>';
    });
  } else {
    const rowH = 64, topY = 12, boxH = 38;
    H = topY + boxH + steps.length*rowH + 26;
    const boxW = Math.min(160, Math.max(80,(W-2*margin)/Math.max(1,n-1)-10));
    actors.forEach(function(a,i){
      inner += '<rect class="diagram-node-box" x="'+(nodesX[i]-boxW/2)+'" y="'+topY+'" width="'+boxW+'" height="'+boxH+'" rx="7"></rect>';
      inner += '<text class="diagram-actor-label" x="'+nodesX[i]+'" y="'+(topY+boxH/2-6)+'" text-anchor="middle">'+fmtTspans(a, nodesX[i])+'</text>';
      inner += '<line class="diagram-lifeline" x1="'+nodesX[i]+'" y1="'+(topY+boxH)+'" x2="'+nodesX[i]+'" y2="'+(H-8)+'"></line>';
    });
    steps.forEach(function(st,i){
      const y = topY+boxH+22 + i*rowH;
      const x1 = nodesX[st.from], x2 = nodesX[st.to];
      const pid = uid+"_p"+i, mid = uid+"_m"+i;
      inner += '<path id="'+pid+'" class="diagram-arrow-path" d="M '+x1+' '+y+' L '+x2+' '+y+'"></path>';
      inner += '<text class="diagram-arrow-label" x="'+((x1+x2)/2)+'" y="'+(y-9)+'" text-anchor="middle">'+escapeXml(st.label||"")+'</text>';
      inner += '<circle id="'+mid+'d" class="diagram-glow-dot" r="6.5" cx="'+x1+'" cy="'+y+'">'
             + '<animateMotion id="'+mid+'" begin="indefinite" dur="0.75s" fill="freeze" path="M '+x1+' '+y+' L '+x2+' '+y+'"></animateMotion>'
             + '<animate attributeName="opacity" begin="'+mid+'.begin" dur="0.05s" from="0" to="1" fill="freeze"></animate>'
             + '<animate attributeName="opacity" begin="'+mid+'.end" dur="0.5s" from="1" to="0" fill="freeze"></animate>'
             + '</circle>';
    });
  }

  const svg = '<svg class="diagram-svg" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" preserveAspectRatio="xMidYMid meet">'+inner+'</svg>';

  let stepsHtml = '<ol class="diagram-steps-list">';
  steps.forEach(function(st,i){
    stepsHtml += '<li><span class="step-num">'+(i+1)+'</span><strong>'+escapeXml(st.label||"")+'</strong>'+(st.note?(' — '+escapeXml(st.note)):'')+'</li>';
  });
  stepsHtml += '</ol>';

  return '<div class="diagram-block" id="'+uid+'">'
       + '<h4><span>🔀 '+escapeXml(block.title||"")+'</span><button class="diagram-play-btn" data-diagram-id="'+uid+'">&#9654; เล่นแอนิเมชัน / Play animation</button></h4>'
       + '<div class="diagram-svg-wrap">'+svg+'</div>'
       + stepsHtml
       + '</div>';
}

function diagramPlay(containerId){
  const wrap = document.getElementById(containerId);
  if(!wrap) return;
  const svg = wrap.querySelector('svg');
  const paths = svg.querySelectorAll('.diagram-arrow-path');
  const dots = svg.querySelectorAll('.diagram-glow-dot');
  const items = wrap.querySelectorAll('.diagram-steps-list li');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  items.forEach(function(li){ li.classList.remove('step-active'); });
  if(reduced){ return; }
  const stepDur = 850;
  paths.forEach(function(p){
    const len = p.getTotalLength();
    p.style.transition = 'none';
    p.style.strokeDasharray = len;
    p.style.strokeDashoffset = len;
  });
  void svg.getBoundingClientRect();
  paths.forEach(function(p,i){
    setTimeout(function(){
      p.style.transition = 'stroke-dashoffset '+(stepDur-100)+'ms ease';
      p.style.strokeDashoffset = 0;
      const anim = dots[i] ? dots[i].querySelector('animateMotion') : null;
      if(anim){ try{ anim.beginElement(); }catch(e){} }
      if(items[i]) items[i].classList.add('step-active');
    }, i*stepDur);
  });
}

function wireDiagramButtons(){
  document.querySelectorAll('.diagram-play-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ diagramPlay(btn.dataset.diagramId); });
  });
}

function renderContent(){
  const main = document.getElementById("mainArea");
  main.innerHTML = "";
  SECTIONS.forEach((sec, idx)=>{
    const card = document.createElement("div");
    card.className = "section-card";
    card.id = "section_"+idx;
    let html = "<h2>"+sec.title+"</h2>";
    if(sec.body){
      html += '<div class="body-text">'+sec.body+'</div>';
    }
    (sec.blocks || []).forEach((block, bi)=>{
      if(block.type === "note"){
        html += '<div class="callout callout-note"><span class="callout-title">หมายเหตุ / Note</span>'+escapeXml(block.content)+'</div>';
      } else if(block.type === "example"){
        html += '<div class="callout callout-example"><span class="callout-title">ตัวอย่าง / Example</span>'+escapeXml(block.content)+'</div>';
      } else if(block.type === "warning"){
        html += '<div class="callout callout-warning"><span class="callout-title">ข้อควรระวัง / Warning</span>'+escapeXml(block.content)+'</div>';
      } else if(block.type === "formula"){
        html += '<div class="callout callout-formula"><span class="callout-title">'+(block.label || "สูตร / Formula")+'</span>'+escapeXml(block.content)+'</div>';
      } else if(block.type === "subheading"){
        html += '<h3>'+block.content+'</h3>';
      } else if(block.type === "table"){
        html += block.content;
      } else if(block.type === "image"){
        html += '<div class="image-block"><img src="'+block.src+'" alt="'+(block.alt || "")+'" loading="lazy">';
        if(block.caption){
          html += '<div class="image-caption">'+block.caption+'</div>';
        }
        html += '</div>';
      } else if(block.type === "diagram"){
        html += renderDiagramBlock(block, idx, bi);
      }
    });
    card.innerHTML = html;
    main.appendChild(card);
  });

  if(window.renderMathInElement){
    renderMathInElement(main, {
      delimiters: [
        {left: "$$", right: "$$", display: true},
        {left: "$", right: "$", display: false}
      ]
    });
  }
}

function setupScrollSpy(){
  const links = document.querySelectorAll(".toc-list a");
  const sections = document.querySelectorAll(".section-card");
  window.addEventListener("scroll", ()=>{
    let currentIdx = 0;
    sections.forEach((sec, idx)=>{
      const rect = sec.getBoundingClientRect();
      if(rect.top <= 100) currentIdx = idx;
    });
    links.forEach(l=>l.classList.remove("active"));
    if(links[currentIdx]) links[currentIdx].classList.add("active");
  });
}

function setupReveal(){
  const cards = document.querySelectorAll('.section-card');
  if(!('IntersectionObserver' in window)){
    cards.forEach(function(c){ c.classList.add('revealed'); });
    return;
  }
  const io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){ e.target.classList.add('revealed'); io.unobserve(e.target); }
    });
  }, {threshold:0.08, rootMargin:'0px 0px -60px 0px'});
  cards.forEach(function(c){ io.observe(c); });
}

let fontScale = parseFloat(localStorage.getItem('netbook_fontScale')||'1');
function setFontScale(v){
  fontScale = Math.min(1.3, Math.max(0.85, Math.round(v*10)/10));
  try{ localStorage.setItem('netbook_fontScale', fontScale); }catch(e){}
  document.documentElement.style.setProperty('--fontScale', fontScale);
}

function updateProgress(){
  const el = document.documentElement;
  const max = el.scrollHeight - el.clientHeight;
  const pct = max>0 ? (el.scrollTop/max*100) : 0;
  const bar = document.getElementById('readProgress');
  if(bar) bar.style.width = pct+'%';
  const btt = document.getElementById('backToTop');
  if(btt){ if(el.scrollTop>420){ btt.classList.add('show'); } else { btt.classList.remove('show'); } }
}

renderTOC();
renderContent();
setupScrollSpy();
setupReveal();
wireDiagramButtons();
setFontScale(fontScale);

window.addEventListener('scroll', updateProgress);
const backToTopBtn = document.getElementById('backToTop');
if(backToTopBtn){ backToTopBtn.addEventListener('click', function(){ window.scrollTo({top:0,behavior:'smooth'}); }); }
const fontMinusBtn = document.getElementById('fontMinus');
if(fontMinusBtn){ fontMinusBtn.addEventListener('click', function(){ setFontScale(fontScale-0.1); }); }
const fontPlusBtn = document.getElementById('fontPlus');
if(fontPlusBtn){ fontPlusBtn.addEventListener('click', function(){ setFontScale(fontScale+0.1); }); }

</script>
