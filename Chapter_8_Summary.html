<!DOCTYPE html>
<html lang="th">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chapter 8: Security</title>

<style>

:root{
  color-scheme: light;
  --paper:#F6F4EE;
  --bg:#F6F4EE;
  --panel:#FFFFFF;
  --border:#DCD6C7;
  --text:#2A2A26;
  --text-soft:#6B6558;
  --navy:#1B3A5C;
  --navy-deep:#0F2740;
  --accent:#1B3A5C;
  --accent2:#2B6CB0;
  --accent-soft:#EAF1FA;
  --correct:#256D46;
  --correct-soft:#E7F3EB;
  --incorrect:#B3341F;
  --incorrect-soft:#FBEAE6;
  --flag:#B7862C;
  --flag-soft:#FBF1DA;
  --unanswered:#9A9486;
  --fontScale:1;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:'Sarabun',"Segoe UI",sans-serif;
  background:var(--paper);
  color:var(--text);
}
header{
  background:var(--navy-deep);
  border-bottom:4px solid var(--flag);
  box-shadow:0 2px 10px rgba(15,39,64,0.25);
  padding:16px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  position:sticky;
  top:0;
  z-index:10;
}
header h1{
  font-size:18px;
  margin:0;
  color:#F2EFE6;
  font-weight:700;
}
header .subtitle{
  font-size:12.5px;
  color:#C9C2AE;
  margin-top:2px;
}
.header-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.layout{
  display:flex;
  max-width:1200px;
  margin:0 auto;
  gap:20px;
  padding:20px;
}
.sidebar{width:250px;flex-shrink:0;}
.sidebar-panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:6px;
  padding:16px;
  position:sticky;
  top:80px;
  box-shadow:0 2px 8px rgba(15,39,64,0.06);
  max-height:calc(100vh - 100px);
  overflow-y:auto;
}
.sidebar-panel h3{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--text-soft);
  margin:0 0 10px 0;
  font-weight:600;
}
.toc-list{list-style:none;margin:0;padding:0;}
.toc-list li{margin-bottom:2px;}
.toc-list a{
  display:block;
  padding:7px 10px;
  border-radius:4px;
  color:var(--text);
  text-decoration:none;
  font-size:13px;
  border-left:3px solid transparent;
}
.toc-list a:hover{background:var(--accent-soft);color:var(--accent2);}
.toc-list a.active{background:var(--accent-soft);color:var(--navy);border-left:3px solid var(--navy);font-weight:600;}
main{flex:1;min-width:0;}
.section-card{
  background:var(--panel);
  border:1px solid var(--border);
  border-left:4px solid var(--navy);
  border-radius:6px;
  padding:24px;
  margin-bottom:18px;
  box-shadow:0 2px 10px rgba(15,39,64,0.06);
  scroll-margin-top:80px;
}
.section-card h2{
  margin:0 0 14px 0;
  font-size:18px;
  color:var(--navy-deep);
  padding-bottom:10px;
  border-bottom:2px solid var(--border);
}
.section-card h3{
  font-size:15px;
  color:var(--navy);
  margin:20px 0 10px 0;
}
.section-card .body-text{
  font-size:14.5px;
  line-height:1.9;
  white-space:pre-wrap;
}
.callout{
  margin:16px 0;
  padding:14px 16px;
  border-radius:6px;
  border-left:4px solid;
  font-size:14px;
  line-height:1.8;
}
.callout-note{background:var(--accent-soft);border-color:var(--accent2);}
.callout-example{background:#F4F2E8;border-color:var(--flag);}
.callout-warning{background:var(--incorrect-soft);border-color:var(--incorrect);}
.callout-formula{
  background:var(--navy-deep);
  color:#EAF1FA;
  border-color:var(--flag);
  font-family:'JetBrains Mono',monospace;
  overflow-x:auto;
}
.callout-title{
  font-weight:700;
  font-size:12.5px;
  text-transform:uppercase;
  letter-spacing:.04em;
  margin-bottom:8px;
  display:block;
}
.callout-note .callout-title{color:var(--accent2);}
.callout-example .callout-title{color:var(--flag);}
.callout-warning .callout-title{color:var(--incorrect);}
.callout-formula .callout-title{color:#C9DCF0;}
.image-block{
  margin:18px 0;
  text-align:center;
}
.image-block img{
  max-width:100%;
  height:auto;
  border-radius:6px;
  border:1px solid var(--border);
  box-shadow:0 2px 10px rgba(15,39,64,0.08);
}
.image-block .image-caption{
  font-size:12.5px;
  color:var(--text-soft);
  margin-top:8px;
  font-style:italic;
}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:13.5px;}
table th{background:var(--navy-deep);color:#F2EFE6;padding:9px 12px;text-align:left;}
table td{padding:8px 12px;border-bottom:1px solid var(--border);}
table tr:nth-child(even) td{background:#F4F2E8;}
@media (max-width:800px){
  .layout{flex-direction:column;}
  .sidebar{width:100%;}
  .sidebar-panel{position:static;max-height:none;}
}

</style>
<style>

/* ===== Readability & diagram enhancements ===== */
#readProgress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--flag),var(--accent2));width:0%;z-index:999;transition:width .12s ease;}

#backToTop{
  position:fixed;bottom:24px;right:24px;width:44px;height:44px;border-radius:50%;
  background:var(--navy-deep);color:#F2EFE6;border:none;cursor:pointer;font-size:18px;
  box-shadow:0 4px 14px rgba(15,39,64,0.3);display:none;align-items:center;justify-content:center;
  z-index:998;opacity:0;transition:opacity .2s ease, transform .2s ease;
}
#backToTop:hover{transform:translateY(-2px);}
#backToTop.show{display:flex;opacity:1;}

#fontCtrl{display:flex;gap:6px;align-items:center;}
#fontCtrl button{
  border:1.5px solid rgba(242,239,230,0.5);background:rgba(255,255,255,0.9);color:var(--navy);
  width:32px;height:32px;border-radius:4px;font-size:13px;cursor:pointer;font-weight:700;
  font-family:'Sarabun',sans-serif;
}
#fontCtrl button:hover{background:#fff;}

.section-card{opacity:0;transform:translateY(14px);transition:opacity .55s ease, transform .55s ease;}
.section-card.revealed{opacity:1;transform:translateY(0);}
@media (prefers-reduced-motion: reduce){
  .section-card{opacity:1;transform:none;transition:none;}
}

.section-card .body-text{font-size:calc(14.5px * var(--fontScale)) !important;}
.section-card h2{font-size:calc(18px * var(--fontScale)) !important;}
.section-card h3{font-size:calc(15px * var(--fontScale)) !important;}
.callout{font-size:calc(14px * var(--fontScale)) !important;}
table{font-size:calc(13.5px * var(--fontScale)) !important;}

.callout-note .callout-title::before{content:"📝 ";}
.callout-example .callout-title::before{content:"💡 ";}
.callout-warning .callout-title::before{content:"⚠️ ";}
.callout-formula .callout-title::before{content:"∑ ";}

/* ==== Animated sequence / flow diagrams ==== */
.diagram-block{
  margin:20px 0;padding:16px 18px 14px;background:#FBFAF6;border:1px solid var(--border);
  border-radius:8px;
}
.diagram-block h4{
  margin:0 0 12px 0;font-size:calc(14.5px * var(--fontScale));color:var(--navy-deep);
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
}
.diagram-play-btn{
  border:1.5px solid var(--accent2);background:#fff;color:var(--accent2);padding:5px 12px;
  border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Sarabun',sans-serif;
  flex-shrink:0;
}
.diagram-play-btn:hover{background:var(--accent-soft);}
.diagram-svg-wrap{overflow-x:auto;}
.diagram-svg{display:block;margin:0 auto;min-width:420px;}
.diagram-actor-label{font-family:'Sarabun',sans-serif;font-size:11.5px;font-weight:600;fill:var(--navy-deep);}
.diagram-lifeline{stroke:var(--border);stroke-width:1.5;stroke-dasharray:3,3;}
.diagram-node-box{fill:var(--panel);stroke:var(--navy);stroke-width:1.3;}
.diagram-arrow-path{fill:none;stroke:var(--accent2);stroke-width:2;marker-end:url(#arrowhead);}
.diagram-arrow-label{font-family:'JetBrains Mono',monospace;font-size:10.5px;fill:var(--navy-deep);}
.diagram-glow-dot{fill:var(--flag);filter:url(#glowFilter);opacity:0;}
.diagram-steps-list{list-style:none;margin:12px 0 0;padding:0;font-size:calc(13px * var(--fontScale));line-height:1.7;}
.diagram-steps-list li{padding:6px 10px;border-left:3px solid transparent;border-radius:4px;transition:background .3s ease, border-color .3s ease;}
.diagram-steps-list li.step-active{background:var(--accent-soft);border-left-color:var(--flag);}
.diagram-steps-list .step-num{
  display:inline-block;width:20px;height:20px;border-radius:50%;background:var(--navy);color:#fff;
  text-align:center;line-height:20px;font-size:11px;margin-right:8px;font-family:'JetBrains Mono',monospace;
}

</style>
</head>

<script>
const SECTIONS = [{"title": "Network Security คืออะไร", "body": "Network security ครอบคลุมเป้าหมายหลัก 4 ประการ ที่ต้องทำให้ได้พร้อมกันในการสื่อสารที่ \"ปลอดภัย\" ระหว่างสองฝ่าย", "blocks": [{"type": "table", "content": "<table><tr><th>เป้าหมาย</th><th>ความหมาย</th></tr><tr><td>Confidentiality (การรักษาความลับ)</td><td>มีเพียงผู้ส่งและผู้รับที่ตั้งใจเท่านั้นที่ \"เข้าใจ\" เนื้อหาข้อความได้ — ผู้ส่งเข้ารหัส (encrypt), ผู้รับถอดรหัส (decrypt)</td></tr><tr><td>Authentication (การพิสูจน์ตัวตน)</td><td>ผู้ส่งและผู้รับต้องการยืนยันตัวตนของกันและกัน</td></tr><tr><td>Message Integrity (ความถูกต้องของข้อความ)</td><td>ผู้ส่งและผู้รับต้องการมั่นใจว่าข้อความไม่ถูกเปลี่ยนแปลง (ระหว่างทาง หรือภายหลัง) โดยไม่มีการตรวจพบ</td></tr><tr><td>Access and Availability (การเข้าถึงและความพร้อมใช้งาน)</td><td>บริการต้องเข้าถึงได้และพร้อมใช้งานสำหรับผู้ใช้ที่ถูกต้อง</td></tr></table>"}, {"type": "subheading", "content": "Alice, Bob และ Trudy: ตัวละครมาตรฐานของวงการ Security"}, {"type": "note", "content": "**Bob และ Alice** (คู่รัก) ต้องการสื่อสารกันอย่าง \"ปลอดภัย\" ผ่าน channel ที่มี **Trudy** (ผู้บุกรุก) คอยดักฟัง ลบ หรือแทรกข้อความได้\n\n**ในโลกจริง Bob/Alice คือใครได้บ้าง?**: web browser/server สำหรับธุรกรรมออนไลน์, client/server ของธนาคารออนไลน์, DNS server, router ที่แลกเปลี่ยนข้อมูล BGP routing table — โดยพื้นฐานแล้วคือคู่สื่อสารใดๆ ก็ตามในเครือข่าย"}, {"type": "subheading", "content": "\"คนร้าย\" ทำอะไรได้บ้าง?"}, {"type": "table", "content": "<table><tr><th>ประเภทการโจมตี</th><th>รายละเอียด</th></tr><tr><td>Eavesdrop</td><td>ดักฟัง/สกัดกั้นข้อความ</td></tr><tr><td>Active insertion</td><td>แทรกข้อความเข้าไปใน connection โดยตรง</td></tr><tr><td>Impersonation</td><td>ปลอมแปลง (spoof) source address ใน packet (หรือ field ใดๆ ก็ได้ใน packet)</td></tr><tr><td>Hijacking</td><td>\"ยึด\" connection ที่กำลังดำเนินอยู่ โดยตัดผู้ส่ง/ผู้รับออกแล้วสวมรอยแทนที่</td></tr><tr><td>Denial of Service</td><td>ทำให้บริการไม่สามารถถูกใช้งานโดยผู้อื่นได้ (เช่น ทำให้ resource overload)</td></tr></table>"}]}, {"title": "หลักการของ Cryptography", "body": "Cryptography เป็นรากฐานของ network security เกือบทุกด้าน — เริ่มจากภาษาพื้นฐานและวิธีการโจมตี ก่อนเข้าสู่ symmetric key cryptography", "blocks": [{"type": "subheading", "content": "ภาษาพื้นฐานของ Cryptography"}, {"type": "note", "content": "$m$ = plaintext message (ข้อความต้นฉบับ), $K_A(m)$ = ciphertext ที่เข้ารหัสด้วย key $K_A$ — ความสัมพันธ์พื้นฐาน: $m = K_B(K_A(m))$ (ถอดรหัสด้วย key ที่ถูกต้องแล้วได้ข้อความเดิมกลับคืนมา)"}, {"type": "subheading", "content": "วิธีการโจมตีระบบเข้ารหัส (Breaking an Encryption Scheme)"}, {"type": "table", "content": "<table><tr><th>ประเภทการโจมตี</th><th>รายละเอียด</th></tr><tr><td>Cipher-text only attack</td><td>Trudy มีแค่ ciphertext ให้วิเคราะห์ — ใช้ **brute force** (ลองทุก key) หรือ **statistical analysis**</td></tr><tr><td>Known-plaintext attack</td><td>Trudy มี plaintext ที่ตรงกับ ciphertext — เช่นใน monoalphabetic cipher สามารถหาคู่ตัวอักษรที่ถูกแทนที่ได้จากตัวอย่างที่รู้</td></tr><tr><td>Chosen-plaintext attack</td><td>Trudy สามารถเลือก plaintext และรับ ciphertext ที่สอดคล้องกลับมาได้</td></tr></table>"}, {"type": "subheading", "content": "Symmetric Key Cryptography"}, {"type": "note", "content": "Bob และ Alice **ใช้ key เดียวกัน** ($K_S$) ทั้งเข้ารหัสและถอดรหัส — คำถามสำคัญ: **Bob กับ Alice จะตกลง key ร่วมกันได้อย่างไร** (โดยเฉพาะถ้าไม่เคยพบกันมาก่อน)?"}, {"type": "example", "content": "**Monoalphabetic substitution cipher**: แทนที่ตัวอักษรแต่ละตัวด้วยตัวอักษรอื่นตามตารางคงที่\n```\nplaintext:  abcdefghijklmnopqrstuvwxyz\nciphertext: mnbvcxzasdfghjklpoiuytrewq\n```\nเช่น \"bob. i love you. alice\" → \"nkn. s gktc wky. mgsbc\"\n\n**Polyalphabetic cipher (ซับซ้อนกว่า)**: ใช้ substitution cipher หลายชุด ($M_1, M_2, ..., M_n$) สลับกันเป็นวงจร เช่น $n=4$: ใช้ $M_1, M_3, M_4, M_3, M_2$ วนซ้ำไปเรื่อยๆ ทำให้ตัวอักษรเดียวกันในตำแหน่งต่างกันถูกแทนที่ต่างกัน (ยากต่อการวิเคราะห์ทางสถิติมากกว่า monoalphabetic)"}, {"type": "subheading", "content": "DES และ AES: มาตรฐาน Symmetric Key จริงในปัจจุบัน"}, {"type": "table", "content": "<table><tr><th>มาตรฐาน</th><th>รายละเอียด</th></tr><tr><td>DES (Data Encryption Standard)</td><td>มาตรฐานสหรัฐฯ [NIST 1993] — key แบบ symmetric 56 บิต, input แบบ plaintext 64 บิต — เป็น block cipher พร้อม cipher block chaining — DES Challenge แสดงว่าถอดรหัสด้วย brute force ได้ในเวลาไม่ถึง 1 วัน (ไม่มี known good analytic attack) — **3DES**: เข้ารหัส 3 ครั้งด้วย 3 key ต่างกัน เพื่อเพิ่มความปลอดภัย</td></tr><tr><td>AES (Advanced Encryption Standard)</td><td>มาตรฐาน NIST ที่แทนที่ DES (พ.ย. 2001) — ประมวลผลข้อมูลเป็น block ขนาด 128 บิต, ใช้ key ขนาด 128/192/256 บิต — **การ brute-force ที่ใช้เวลา 1 วินาทีบน DES จะใช้เวลาถึง 149 ล้านล้านปีบน AES!**</td></tr></table>"}]}, {"title": "Public Key Cryptography และ RSA", "body": "**Public key cryptography** [Diffie-Hellman 1976, RSA 1978] เป็นแนวทางที่**แตกต่างอย่างสิ้นเชิง**จาก symmetric key — ปฏิวัติวงการ cryptography ที่มีอายุกว่า 2,000 ปีที่เคยพึ่ง symmetric key เพียงอย่างเดียว", "blocks": [{"type": "subheading", "content": "หลักการของ Public Key Cryptography"}, {"type": "note", "content": "ผู้ส่งและผู้รับ**ไม่ต้องแชร์ secret key ร่วมกัน**: **public encryption key** ($K_B^+$) เปิดเผยให้ทุกคนรู้ได้, **private decryption key** ($K_B^-$) รู้เฉพาะผู้รับเท่านั้น\n\nความสัมพันธ์: $m = K_B^-(K_B^+(m))$ — เข้ารหัสด้วย public key ของ Bob, ถอดรหัสได้เฉพาะด้วย private key ของ Bob เท่านั้น"}, {"type": "formula", "label": "ข้อกำหนดของ Public Key Algorithm", "content": "ต้องการฟังก์ชัน $K_B^+()$ และ $K_B^-()$ ที่ทำให้:\n\n1. $K_B^-(K_B^+(m)) = m$\n2. เมื่อรู้ public key $K_B^+$ แล้ว **เป็นไปไม่ได้ในทางปฏิบัติ**ที่จะคำนวณหา private key $K_B^-$\n\n**RSA** (Rivest, Shamir, Adleman) คืออัลกอริทึมที่โด่งดังที่สุดที่ตอบโจทย์นี้ได้"}, {"type": "formula", "label": "พื้นฐาน: Modular Arithmetic", "content": "$x \\bmod n$ = เศษที่เหลือเมื่อหาร $x$ ด้วย $n$\n\nคุณสมบัติสำคัญ:\n$$[(a \\bmod n) + (b \\bmod n)] \\bmod n = (a+b) \\bmod n$$\n$$[(a \\bmod n) \\times (b \\bmod n)] \\bmod n = (a \\times b) \\bmod n$$\n$$\\text{ดังนั้น: } (a \\bmod n)^d \\bmod n = a^d \\bmod n$$\n\n**ตัวอย่าง**: $x=14, n=10, d=2$: $(x \\bmod n)^d \\bmod n = 4^2 \\bmod 10 = 6$ และ $x^d = 14^2 = 196$, $196 \\bmod 10 = 6$ — ตรงกัน!"}, {"type": "formula", "label": "ขั้นตอนการสร้าง RSA Key Pair", "content": "1. เลือกจำนวนเฉพาะขนาดใหญ่ 2 ตัว $p, q$ (เช่น 1024 บิตแต่ละตัว)\n2. คำนวณ $n = pq$, $z = (p-1)(q-1)$\n3. เลือก $e$ (โดย $e<n$) ที่ **ไม่มีตัวประกอบร่วม**กับ $z$ (\"relatively prime\")\n4. เลือก $d$ ที่ทำให้ $ed-1$ หารด้วย $z$ ลงตัวพอดี (กล่าวคือ $ed \\bmod z = 1$)\n5. **Public key** = $(n,e)$ — **Private key** = $(n,d)$"}, {"type": "formula", "label": "การเข้ารหัส/ถอดรหัสด้วย RSA", "content": "**เข้ารหัส** ข้อความ $m$ (โดย $m<n$): $$c = m^e \\bmod n$$\n**ถอดรหัส** ค่าที่ได้รับ $c$: $$m = c^d \\bmod n$$"}, {"type": "example", "content": "**ตัวอย่างเต็ม**: Bob เลือก $p=5, q=7$ → $n=35, z=24$ → $e=5$ (relatively prime กับ 24) → $d=29$ (เพราะ $ed-1 = 144$ หารด้วย 24 ลงตัวพอดี)\n\nเข้ารหัสข้อความ 8-bit: $m = 12$ (bit pattern `0000l000`) → $c = 12^5 \\bmod 35 = 17$\n\nถอดรหัส: $c=17$ → $m = 17^{29} \\bmod 35 = 12$ ✓ ได้ข้อความเดิมกลับคืนมา"}, {"type": "warning", "content": "**ทำไม RSA ปลอดภัย?** เมื่อรู้ public key $(n,e)$ ของ Bob แล้ว การหา $d$ ต้องอาศัยการ**แยกตัวประกอบ $n$**กลับเป็น $p$ และ $q$ — และ **การแยกตัวประกอบของเลขจำนวนมากๆ เป็นปัญหาที่ยากมาก** (ในทางคำนวณ) นี่คือรากฐานความปลอดภัยของ RSA ทั้งหมด"}, {"type": "subheading", "content": "คุณสมบัติพิเศษของ RSA และการใช้งานจริง"}, {"type": "note", "content": "**คุณสมบัติสำคัญ**: $K_B^-(K_B^+(m)) = K_B^+(K_B^-(m))$ — ใช้ private key ก่อนแล้วตามด้วย public key ให้ผลลัพธ์**เดียวกัน**กับใช้ public key ก่อนแล้วตามด้วย private key! (พิสูจน์ได้จาก modular arithmetic โดยตรง) คุณสมบัตินี้เป็นรากฐานสำคัญของ **digital signature**\n\n**RSA ในทางปฏิบัติ — Session Key**: การยกกำลัง (exponentiation) ใน RSA ใช้การคำนวณหนักมาก — **DES เร็วกว่า RSA อย่างน้อย 100 เท่า** — วิธีแก้: ใช้ public key crypto เพื่อสร้าง connection ที่ปลอดภัยก่อน แล้วแลกเปลี่ยน **session key** ($K_S$) แบบ symmetric สำหรับเข้ารหัสข้อมูลจริง — Bob และ Alice ใช้ RSA แลกเปลี่ยน $K_S$ กัน จากนั้นทั้งคู่ใช้ symmetric key cryptography ที่เร็วกว่ามากในการสื่อสารข้อมูลปริมาณมาก"}]}, {"title": "Authentication: การพิสูจน์ตัวตน", "body": "เป้าหมาย: Bob ต้องการให้ Alice \"พิสูจน์\" ตัวตนของเธอ — บทนี้พัฒนา protocol ทีละขั้น โดยแต่ละเวอร์ชันแก้ปัญหาของเวอร์ชันก่อนหน้า แต่ก็เผยจุดอ่อนใหม่", "blocks": [{"type": "table", "content": "<table><tr><th>Protocol</th><th>วิธีการ</th><th>จุดอ่อน</th></tr><tr><td>ap1.0</td><td>Alice พูดว่า \"I am Alice\" เฉยๆ</td><td>Bob มองไม่เห็น Alice จริงๆ ในเครือข่าย — Trudy แค่ประกาศตัวว่าเป็น Alice ก็หลอกได้</td></tr><tr><td>ap2.0</td><td>Alice ส่ง \"I am Alice\" พร้อม source IP address ของตัวเอง</td><td>Trudy สร้าง packet ปลอม (spoof) IP address ของ Alice ได้ง่ายๆ</td></tr><tr><td>ap3.0</td><td>Alice ส่ง \"I am Alice\" พร้อมรหัสผ่านลับ (password) เพื่อ \"พิสูจน์\"</td><td>**Playback attack**: Trudy บันทึก packet ของ Alice ไว้ แล้วนำมาเล่นซ้ำ (replay) ให้ Bob ทีหลัง</td></tr><tr><td>ap3.0 (แก้ไข)</td><td>เข้ารหัส password ก่อนส่ง</td><td>**Playback attack ยังคงใช้ได้ผล!** เพราะ Trudy แค่บันทึก ciphertext ที่เข้ารหัสแล้วไว้ ไม่จำเป็นต้องรู้ password จริงๆ ก็เล่นซ้ำได้</td></tr></table>"}, {"type": "subheading", "content": "ap4.0: แก้ปัญหา Playback ด้วย Nonce"}, {"type": "note", "content": "**Nonce**: ตัวเลข ($R$) ที่ใช้เพียง**ครั้งเดียวในชีวิต** — protocol ap4.0: เพื่อพิสูจน์ว่า Alice \"มีตัวตนจริงในขณะนี้\" (live) Bob ส่ง nonce $R$ ให้ Alice — Alice ต้องส่ง $R$ กลับมาโดยเข้ารหัสด้วย **shared secret key**: $K_{A-B}(R)$\n\nBob จึงมั่นใจว่า Alice \"live\" อยู่จริง และมีเพียง Alice เท่านั้นที่รู้ key สำหรับเข้ารหัส nonce นี้ได้ — **ต้องอาศัย shared symmetric key** ระหว่างสองฝ่ายเป็นเงื่อนไขเบื้องต้น"}, {"type": "subheading", "content": "ap5.0: ใช้ Public Key Cryptography แทน — และช่องโหว่ Man-in-the-Middle"}, {"type": "note", "content": "ap5.0 ใช้ nonce ร่วมกับ public key cryptography แทน symmetric key: Bob คำนวณ $K_A^+(K_A^-(R)) = R$ และรู้ว่ามีเพียง Alice เท่านั้นที่ครอบครอง private key ที่เข้ารหัส $R$ ในลักษณะนี้ได้"}, {"type": "warning", "content": "**Man-in-the-Middle Attack**: Trudy สามารถสวมรอยเป็น Alice (กับ Bob) และสวมรอยเป็น Bob (กับ Alice) **พร้อมกัน**ได้ — Trudy ดักจับการสื่อสารทั้งสองทาง ใช้ public key ของตัวเองแทนที่ public key ของ Alice/Bob จริง โดยที่ทั้งสองฝ่ายไม่รู้ตัวเลย — ผลคือ Trudy สามารถอ่าน (และแก้ไข) ข้อความทั้งหมดที่ Bob กับ Alice \"คิดว่า\" กำลังส่งถึงกันโดยตรง — **ปัญหารากฐาน**: Bob และ Alice ไม่มีทางยืนยันได้ว่า public key ที่ได้รับมานั้นเป็นของอีกฝ่ายจริงๆ (ไม่ใช่ของ Trudy) — นี่คือเหตุผลที่ต้องมี **certificate** และ **Certification Authority (CA)**"}, {"type": "diagram", "layout": "lifeline", "title": "ช่องโหว่ Man-in-the-Middle ใน ap5.0", "actors": ["Alice", "Trudy\n(ผู้ร้าย)", "Bob"], "steps": [{"from": 0, "to": 1, "label": "ส่ง Public Key (คิดว่าส่งให้ Bob)", "note": "Trudy ดักกลางทาง"}, {"from": 1, "to": 2, "label": "ส่ง Public Key ของตัวเอง", "note": "แอบอ้างเป็น Alice"}, {"from": 2, "to": 1, "label": "เข้ารหัสข้อความด้วย Key ของ Trudy", "note": "Bob ไม่รู้ว่าถูกสวมรอย"}, {"from": 1, "to": 0, "label": "ดักอ่านแล้วส่งต่อ", "note": "Trudy อ่านข้อความได้ทั้งหมดโดยทั้งคู่ไม่รู้ตัว"}]}]}, {"title": "Digital Signatures และ Message Digests", "body": "**Digital signature** เป็นเทคนิคทาง cryptography ที่คล้ายลายเซ็นเขียนด้วยมือ: ผู้ส่งเซ็นเอกสารเพื่อยืนยันว่าตนเป็นเจ้าของ/ผู้สร้าง — สามารถ**พิสูจน์และห้ามปฏิเสธได้ (verifiable, nonforgeable)**", "blocks": [{"type": "subheading", "content": "หลักการพื้นฐานของ Digital Signature"}, {"type": "note", "content": "Bob เซ็นข้อความ $m$ โดยเข้ารหัสด้วย **private key ของตัวเอง**: $K_B^-(m)$ — สร้างเป็น \"signed message\"\n\n**การตรวจสอบของ Alice**: เมื่อได้รับ $m$ พร้อมลายเซ็น $K_B^-(m)$ Alice ใช้ **public key ของ Bob** ($K_B^+$) มาถอดรหัสลายเซ็น แล้วเช็คว่า $K_B^+(K_B^-(m)) = m$ หรือไม่\n\n**ถ้าตรงกัน** Alice จึงมั่นใจว่า: (1) Bob เซ็น $m$ จริง (2) ไม่มีใครอื่นเซ็น $m$ ได้ (3) Bob เซ็น $m$ ไม่ใช่ $m'$ อื่น — **Non-repudiation**: Alice สามารถนำ $m$ และลายเซ็น $K_B^-(m)$ ไปฟ้องศาลเพื่อพิสูจน์ว่า Bob เป็นผู้เซ็นจริงได้ (Bob ปฏิเสธไม่ได้)"}, {"type": "subheading", "content": "Message Digest: ลดต้นทุนการเข้ารหัส"}, {"type": "note", "content": "การเข้ารหัสข้อความยาวๆ ด้วย public key นั้น**ใช้การคำนวณหนักมาก** — เป้าหมาย: สร้าง \"ลายนิ้วมือดิจิทัล\" (digital fingerprint) ที่มีความยาวคงที่และคำนวณง่าย — ใช้ **hash function** $H$ กับข้อความ $m$ ได้ **message digest** $H(m)$ ความยาวคงที่"}, {"type": "table", "content": "<table><tr><th>คุณสมบัติของ Hash Function</th></tr><tr><td>Many-to-1 (หลายข้อความอาจ hash ได้ค่าเดียวกัน)</td></tr><tr><td>สร้าง message digest ที่มีขนาดคงที่เสมอ</td></tr><tr><td>เมื่อรู้ค่า message digest $x$ **เป็นไปไม่ได้ในทางคำนวณ**ที่จะหาข้อความ $m$ ที่ทำให้ $x = H(m)$</td></tr></table>"}, {"type": "warning", "content": "**Internet checksum เป็น crypto hash function ที่ \"อ่อนแอ\"**: มีคุณสมบัติบางอย่างคล้าย hash function (ความยาวคงที่, many-to-one) แต่**หาข้อความอื่นที่มี checksum เดียวกันได้ง่ายมาก** — ตัวอย่าง: ข้อความ \"IOU900.19BOB\" กับ \"IOU100.99BOB\" (ค่าต่างกันมาก แต่ตัวเลขบางตำแหน่งบวก/ลบชดเชยกันพอดี) ให้ **checksum เดียวกันทุกประการ** — Internet checksum จึง**ใช้เป็น cryptographic hash function ไม่ได้** ต้องใช้ hash function ที่แข็งแรงกว่า เช่น MD5 หรือ SHA-1"}, {"type": "subheading", "content": "Digital Signature = Signed Message Digest"}, {"type": "note", "content": "แนวทางจริงในทางปฏิบัติ: Bob **ไม่เข้ารหัสข้อความทั้งหมด** แต่เข้ารหัสเฉพาะ **message digest** เท่านั้น\n\n**ฝั่งส่ง (Bob)**: คำนวณ $H(m)$ → เข้ารหัสด้วย private key ได้ $K_B^-(H(m))$ (ลายเซ็นดิจิทัล) → ส่งทั้ง $m$ (plaintext) และลายเซ็นไปด้วยกัน\n\n**ฝั่งรับ (Alice)**: คำนวณ $H(m)$ ของข้อความที่ได้รับเอง → ถอดรหัสลายเซ็นด้วย public key ของ Bob ได้ $H(m)$ ที่ Bob ส่งมา → **เทียบสองค่านี้** ถ้าตรงกัน แสดงว่าข้อความไม่ถูกแก้ไข และมาจาก Bob จริง\n\n**Hash function algorithm ที่นิยมใช้**: **MD5** [RFC 1321] คำนวณ message digest 128 บิตผ่านกระบวนการ 4 ขั้นตอน (ยากที่จะสร้างข้อความอื่นที่มี MD5 hash เดียวกันกับค่าที่กำหนด) — **SHA-1** [NIST FIPS PUB 180-1] มาตรฐานสหรัฐฯ ให้ message digest 160 บิต"}, {"type": "subheading", "content": "การแก้ไข ap5.0: ทำไม Digital Signature ยังไม่พอ?"}, {"type": "warning", "content": "แม้จะมี digital signature แล้ว **Man-in-the-Middle attack ยังคงเกิดขึ้นได้** ถ้า Bob/Alice ไม่มีทางยืนยันได้ว่า public key ที่ได้รับมาเป็นของอีกฝ่ายจริง (ไม่ใช่ของ Trudy) — ปัญหานี้ยังไม่ถูกแก้ด้วยตัว digital signature เอง"}, {"type": "subheading", "content": "ความจำเป็นของ Certified Public Key"}, {"type": "example", "content": "**\"Pizza Prank\" — ตัวอย่างสถานการณ์จริง**: Trudy สร้างอีเมลสั่งพิซซ่าปลอมในนาม Bob (\"กรุณาส่งเปปเปอโรนี 4 ถาดมาให้ผม ขอบคุณ Bob\") แล้ว**เซ็นด้วย private key ของ Trudy เอง** จากนั้นส่ง **public key ของ Trudy** ไปให้ร้านพิซซ่าโดยอ้างว่าเป็น public key ของ Bob — ร้านพิซซ่าตรวจสอบลายเซ็นแล้วเชื่อว่าถูกต้อง (เพราะใช้ public key ที่ Trudy ส่งมาตรวจสอบ ซึ่งตรงกับลายเซ็นของ Trudy เองพอดี) → ส่งพิซซ่า 4 ถาดไปให้ Bob ทั้งที่ **Bob ไม่ชอบเปปเปอโรนีด้วยซ้ำ**\n\nนี่แสดงให้เห็นว่า **การมี digital signature เพียงอย่างเดียวไม่พอ** — ต้องมีวิธีที่**เชื่อถือได้**ในการยืนยันว่า public key ใดเป็นของใครจริงๆ"}, {"type": "subheading", "content": "Certification Authority (CA): ผู้รับรอง Public Key"}, {"type": "note", "content": "**CA**: หน่วยงานที่**ผูก public key เข้ากับตัวตนที่เฉพาะเจาะจง** ($E$)\n\n**กระบวนการ**:\n1. entity (บุคคล, เว็บไซต์, router) ลงทะเบียน public key กับ CA พร้อม \"หลักฐานยืนยันตัวตน\"\n2. CA สร้าง **certificate** ที่ผูกตัวตน $E$ เข้ากับ public key ของ $E$\n3. certificate ที่มี public key ของ $E$ ถูก**เซ็นด้วย private key ของ CA เอง**: CA \"รับรอง\" ว่า \"นี่คือ public key ของ $E$ จริง\"\n\n**เมื่อ Alice ต้องการ public key ของ Bob**: (1) ขอ certificate ของ Bob (จาก Bob เองหรือที่อื่น) (2) ใช้ **public key ของ CA** (ที่เชื่อถือได้อยู่แล้ว) มาตรวจสอบ certificate → ได้ public key ของ Bob ที่**ยืนยันแล้วว่าเป็นของจริง**"}, {"type": "diagram", "layout": "lifeline", "title": "Digital Signature: เซ็นและตรวจสอบ", "actors": ["ผู้ส่ง (Sender)", "ผู้รับ (Receiver)"], "steps": [{"from": 0, "to": 1, "label": "Message + Signed Digest", "note": "เซ็นด้วย Private Key ของผู้ส่ง"}, {"from": 1, "to": 0, "label": "Verified ✓ (ใช้ Public Key ของผู้ส่งตรวจสอบ)", "note": "ยืนยันว่าข้อความไม่ถูกแก้ไขและมาจากผู้ส่งจริง"}]}]}, {"title": "Secure E-mail: การผสมผสาน Confidentiality, Integrity, Authentication", "body": "การส่งอีเมลอย่างปลอดภัยต้องผสมผสานเทคนิคที่เรียนมาทั้งหมดเข้าด้วยกัน: symmetric key (สำหรับความเร็ว), public key (สำหรับแลกเปลี่ยน key และยืนยันตัวตน), และ hash function (สำหรับความถูกต้อง)", "blocks": [{"type": "subheading", "content": "Confidentiality เท่านั้น"}, {"type": "note", "content": "Alice ต้องการส่งอีเมลลับ $m$ ให้ Bob:\n\n1. Alice สร้าง **random symmetric key** ($K_S$)\n2. เข้ารหัสข้อความด้วย $K_S$: $K_S(m)$ (เพื่อความเร็ว)\n3. เข้ารหัส $K_S$ เองด้วย **public key ของ Bob**: $K_B^+(K_S)$\n4. ส่งทั้ง $K_S(m)$ และ $K_B^+(K_S)$ ไปให้ Bob\n\n**ฝั่ง Bob**: ใช้ private key ของตัวเองถอดรหัส $K_B^+(K_S)$ ได้ $K_S$ กลับมา → ใช้ $K_S$ ถอดรหัส $K_S(m)$ ได้ $m$ กลับคืนมา"}, {"type": "subheading", "content": "Integrity และ Authentication เท่านั้น"}, {"type": "note", "content": "Alice ต้องการให้ Bob มั่นใจว่าข้อความไม่ถูกแก้ไขและมาจาก Alice จริง (ไม่จำเป็นต้องลับ):\n\n1. Alice เซ็น hash ของข้อความด้วย private key ของตัวเอง: $K_A^-(H(m))$\n2. ส่งทั้งข้อความต้นฉบับ (แบบเปิดเผย/plaintext) และลายเซ็นไปพร้อมกัน\n\nวิธีนี้ให้ทั้ง**message integrity**และ**authentication** แต่**ไม่มี confidentiality** เลย"}, {"type": "subheading", "content": "รวมทั้ง 3 คุณสมบัติเข้าด้วยกัน"}, {"type": "note", "content": "เพื่อให้ได้ **confidentiality + integrity + authentication** ครบทั้งหมด Alice ใช้ **3 key**:\n\n1. **Private key ของ Alice**: เซ็น hash ของข้อความ $K_A^-(H(m))$\n2. ต่อข้อความต้นฉบับ $m$ เข้ากับลายเซ็นนี้\n3. **Symmetric key ใหม่ ($K_S$)**: เข้ารหัสข้อความ+ลายเซ็นทั้งหมดด้วย $K_S$\n4. **Public key ของ Bob**: เข้ารหัส $K_S$ ด้วย $K_B^+$\n\nฝั่ง Bob ทำขั้นตอนย้อนกลับตามลำดับ: ถอดรหัส $K_S$ ด้วย private key ตัวเอง → ถอดรหัสข้อความ+ลายเซ็นด้วย $K_S$ → ตรวจสอบลายเซ็นด้วย public key ของ Alice → เทียบ hash เพื่อยืนยัน integrity"}]}, {"title": "TLS: Transport Layer Security", "body": "**TLS** เป็น security protocol ที่ deploy อย่างแพร่หลายที่สุด อยู่เหนือ transport layer — รองรับโดยเกือบทุก browser/web server ผ่าน **https (port 443)**", "blocks": [{"type": "note", "content": "TLS ให้บริการครบทั้ง 3 ด้าน: **confidentiality** (ผ่าน symmetric encryption), **integrity** (ผ่าน cryptographic hashing), **authentication** (ผ่าน public key cryptography) — **ใช้เทคนิคทั้งหมดที่เรียนมาในบทนี้!**\n\n**ประวัติ**: เริ่มจากงานวิจัย secure network programming/secure sockets → **SSL (Secure Socket Layer)** ถูกเลิกใช้ (deprecated) ในปี 2015 → **TLS 1.3** [RFC 8446, 2018] คือมาตรฐานปัจจุบัน"}, {"type": "subheading", "content": "สร้าง Toy Protocol \"t-tls\" เพื่อเข้าใจว่าต้องการอะไรบ้าง"}, {"type": "table", "content": "<table><tr><th>ส่วนประกอบ</th><th>หน้าที่</th></tr><tr><td>Handshake</td><td>Alice, Bob ใช้ certificate และ private key เพื่อยืนยันตัวตนซึ่งกันและกัน แลกเปลี่ยนหรือสร้าง shared secret ร่วมกัน</td></tr><tr><td>Key derivation</td><td>ใช้ shared secret มาสร้างชุด key ต่างๆ ที่ต้องใช้</td></tr><tr><td>Data transfer</td><td>ส่งข้อมูลแบบ stream เป็นชุดของ \"record\" (ไม่ใช่แค่ transaction ครั้งเดียว)</td></tr><tr><td>Connection closure</td><td>มีข้อความพิเศษสำหรับปิด connection อย่างปลอดภัย</td></tr></table>"}, {"type": "subheading", "content": "t-tls Handshake และ 4 Cryptographic Keys"}, {"type": "note", "content": "**Handshake phase**: Bob สร้าง TCP connection กับ Alice → ยืนยันว่า Alice เป็น Alice จริง → Bob ส่ง **master secret key (MS)** ไปให้ Alice ซึ่งใช้สร้าง key อื่นๆ ทั้งหมดสำหรับ TLS session — **ปัญหา**: ต้องใช้ถึง 3 RTT ก่อนที่ client จะเริ่มรับข้อมูลได้ (รวม TCP handshake ด้วย)\n\n**หลักการ**: ไม่ควรใช้ key เดียวกันสำหรับหลายฟังก์ชัน cryptographic — ต้องมี key แยกสำหรับ MAC (Message Authentication Code) และ encryption **4 key**:\n- $K_c$: encryption key สำหรับข้อมูลจาก client→server\n- $M_c$: MAC key สำหรับข้อมูลจาก client→server\n- $K_s$: encryption key สำหรับข้อมูลจาก server→client\n- $M_s$: MAC key สำหรับข้อมูลจาก server→client\n\nทั้งหมดสร้างมาจาก **Key Derivation Function (KDF)** ที่รับ master secret (และอาจมีข้อมูลสุ่มเพิ่มเติม) มาสร้าง key ใหม่"}, {"type": "subheading", "content": "การเข้ารหัสข้อมูลแบบ Stream: Record"}, {"type": "warning", "content": "**ปัญหา**: TCP ให้บริการแบบ byte-stream ต่อเนื่อง — ถ้าเข้ารหัสข้อมูลแบบ in-stream แล้ว MAC ควรอยู่ตรงไหน? ถ้าอยู่ท้ายสุด **ไม่มี message integrity เลยจนกว่าข้อมูลทั้งหมดจะมาถึงและ connection ปิดแล้ว** — ทางแก้: แบ่ง stream เป็นชุดของ **\"record\"** แต่ละ record มี MAC (สร้างด้วย $M_c$) ของตัวเอง — ผู้รับสามารถประมวลผลแต่ละ record ได้ทันทีที่มาถึง (ไม่ต้องรอทั้งหมด)\n\n**การโจมตีที่อาจเกิดขึ้นกับ data stream**: **Re-ordering** (man-in-the-middle ดักจับ TCP segment แล้วสลับลำดับโดยแก้ sequence number ใน header ที่ไม่ได้เข้ารหัส), **Replay** — **ทางแก้**: ใช้ TLS sequence number (รวมเข้าไปใน MAC ด้วย) และใช้ nonce"}, {"type": "subheading", "content": "การปิด Connection อย่างปลอดภัย"}, {"type": "warning", "content": "**Truncation attack**: ผู้โจมตีปลอมแปลง TCP connection close segment ทำให้ฝ่ายใดฝ่ายหนึ่ง (หรือทั้งคู่) เข้าใจผิดว่าได้รับข้อมูลครบแล้ว ทั้งที่จริงยังไม่ครบ — **ทางแก้**: กำหนด record type แยกกัน (type 0 = data, type 1 = close) แล้วนำ **type เข้าไปคำนวณใน MAC ด้วย** (ร่วมกับ data และ sequence number) — ทำให้ปลอมแปลง close message ไม่ได้"}, {"type": "subheading", "content": "TLS 1.3: Cipher Suite และ Handshake"}, {"type": "note", "content": "**Cipher suite**: ชุด algorithm สำหรับ key generation, encryption, MAC, digital signature — TLS 1.3 (2018) มีตัวเลือกที่**จำกัดกว่า** TLS 1.2 (2008) มาก (เพียง 5 ตัวเลือกแทน 37 ตัวเลือก) — บังคับใช้ **Diffie-Hellman (DH)** สำหรับ key exchange (แทน DH หรือ RSA เดิม) — ใช้ **authenticated encryption** (รวม encryption + authentication เข้าด้วยกัน แทนการทำแยกกันตามลำดับ) — ส่วนใหญ่อิง AES และ HMAC ที่ใช้ SHA-256/384\n\n**TLS 1.3 Handshake ปกติ (1 RTT)**: (1) client ส่ง TLS hello พร้อมเดา key agreement protocol/parameter และระบุ cipher suite ที่รองรับ (2) server เลือก parameter/cipher suite แล้วส่ง server-signed certificate กลับมา (3) client ตรวจสอบ certificate, สร้าง key แล้วเริ่มส่ง application request ได้เลย (เช่น HTTPS GET)\n\n**TLS 1.3 Handshake แบบ 0-RTT (resumption)**: hello message เริ่มต้นมี **application data ที่เข้ารหัสแล้วแนบมาด้วยเลย** (สำหรับการเชื่อมต่อซ้ำกับ server เดิม) ใช้ \"resumption master secret\" จาก connection ก่อนหน้า — **เร็วกว่ามาก แต่เสี่ยงต่อ replay attack** จึงเหมาะกับ request ที่ไม่เปลี่ยน state ของ server เท่านั้น (เช่น HTTP GET ธรรมดา)"}, {"type": "diagram", "layout": "lifeline", "title": "TLS 1.3 Handshake แบบย่อ", "actors": ["Client", "Server"], "steps": [{"from": 0, "to": 1, "label": "Client Hello (Cipher Suites, Key Share)", "note": "เริ่มเจรจาการเข้ารหัส"}, {"from": 1, "to": 0, "label": "Server Hello + Certificate + Key Share", "note": "server เลือก cipher และส่ง certificate"}, {"from": 0, "to": 1, "label": "Finished", "note": "client ยืนยันพร้อมเข้ารหัส"}, {"from": 1, "to": 0, "label": "Finished", "note": "server ยืนยันกลับ เริ่มส่งข้อมูลแบบเข้ารหัส"}]}]}, {"title": "IPsec: Network-Layer Security", "body": "**IPsec** ให้บริการเข้ารหัส, authentication, และ integrity ระดับ**datagram** — ครอบคลุมทั้ง user traffic และ control traffic (เช่น BGP, DNS message)", "blocks": [{"type": "subheading", "content": "2 โหมดของ IPsec"}, {"type": "table", "content": "<table><tr><th>โหมด</th><th>รายละเอียด</th></tr><tr><td>Transport mode</td><td>เข้ารหัส/authenticate เฉพาะ **payload ของ datagram** เท่านั้น</td></tr><tr><td>Tunnel mode</td><td>เข้ารหัส/authenticate **ทั้ง datagram** (รวม header เดิม) แล้วห่อ (encapsulate) เป็น datagram ใหม่ที่มี IP header ใหม่ tunnel ไปยังปลายทาง</td></tr></table>"}, {"type": "subheading", "content": "2 Protocol ของ IPsec"}, {"type": "table", "content": "<table><tr><th>Protocol</th><th>บริการที่ให้</th></tr><tr><td>AH (Authentication Header) [RFC 4302]</td><td>ให้ source authentication และ data integrity แต่**ไม่ให้ confidentiality**</td></tr><tr><td>ESP (Encapsulation Security Protocol) [RFC 4303]</td><td>ให้ source authentication, data integrity, **และ confidentiality** — **ใช้กันแพร่หลายกว่า AH**</td></tr></table>"}, {"type": "subheading", "content": "Security Association (SA)"}, {"type": "note", "content": "ก่อนส่งข้อมูล ต้องสร้าง **Security Association (SA)** จากฝั่งส่งไปยังฝั่งรับก่อน (SA เป็นแบบ**ทิศทางเดียว**) — ทั้งสองฝั่งเก็บ state information เกี่ยวกับ SA นี้ไว้\n\n**IP เป็น connectionless แต่ IPsec เป็น connection-oriented!** — ข้อมูลที่ router (เช่น R1) เก็บไว้สำหรับ SA แต่ละอันประกอบด้วย: **SPI (Security Parameter Index)** 32-bit identifier, origin/destination SA interface, ประเภทการเข้ารหัสที่ใช้, encryption key, ประเภทการตรวจสอบ integrity ที่ใช้, authentication key"}, {"type": "subheading", "content": "โครงสร้าง IPsec Datagram (ESP Tunnel Mode)"}, {"type": "image", "src": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAQDAwMDAgQDAwMEBAQFBgoGBgUFBgwICQcKDgwPDg4MDQ0PERYTDxAVEQ0NExoTFRcYGRkZDxIbHRsYHRYYGRj/2wBDAQQEBAYFBgsGBgsYEA0QGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBj/wAARCAEkAu4DASIAAhEBAxEB/8QAHQABAAICAwEBAAAAAAAAAAAAAAYHBQgBAwQCCf/EAGQQAAAFAwEDBAsJCgoGCAQHAAABAgMEBQYRBxIhMQgTQdIXGCJRVldhcZSV0xQVMlJVgZGWtBYjNzhCWHV2sdEzNTZTYnKSk7K1CXSho7PBJCU0Q0RUc/AmRWThJzlGY2Wi8f/EABwBAQABBQEBAAAAAAAAAAAAAAABAgMEBQcGCP/EAEkRAAIBAgMDBAwKCAcBAQAAAAABAgMRBBIhBRMxF0FRYQYHFBUiMlRykqLR4jRCU2RxgZGxstIWMzVSYqHh8CQ2Y3OCwcKzI//aAAwDAQACEQMRAD8A3+AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAR69b4tfTy0nbnvCqoplKacbaXIW2pZEpxRISWEkZ7zMugASEBWOuGrDukem0C6otHbq/uuqxadzK3zZIkvKMtvJJPgRcMCzSPIA5AAAAAEdql92rRtQKJZNSqyGK7W0POU+GbazN9LRZcMlEWyWC75lkASIBDajfcqBrZR7ARZ1elR6hAdmrr7LGYMU0bWGnF9Cz2dxf0k8c7plkAADIxtfr1Jte1qjcddlpiU กลงกันไว้ใน SA"}, {"type": "subheading", "content": "การทำงานที่ R1 (ESP Tunnel Mode)"}, {"type": "formula", "label": "ขั้นตอนการสร้าง ESP Tunnel Mode Datagram", "content": "1. ต่อ ESP trailer เข้ากับ datagram ต้นฉบับ (ซึ่งรวม header field เดิมด้วย)\n2. เข้ารหัสผลลัพธ์ทั้งหมดด้วย algorithm/key ที่ระบุใน SA\n3. ต่อ ESP header เข้าด้านหน้าของข้อมูลที่เข้ารหัสแล้ว\n4. สร้าง authentication MAC ด้วย algorithm/key ที่ระบุใน SA\n5. ต่อ MAC เข้าไปสร้างเป็น payload สมบูรณ์\n6. สร้าง IP header ใหม่ ระบุ address ไปยัง tunnel endpoint"}, {"type": "warning", "content": "**IPsec sequence number**: sender เริ่มต้น seq# ที่ 0 สำหรับ SA ใหม่ทุกครั้ง — ทุกครั้งที่ส่ง datagram บน SA นี้ จะเพิ่ม seq# counter — เป้าหมายคือ**ป้องกันไม่ให้ผู้โจมตีดักจับและเล่นซ้ำ (replay) packet ได้** — ฝั่งปลายทางตรวจสอบ duplicate โดย**ไม่ต้องเก็บทุก packet ที่เคยได้รับ** แต่ใช้ \"window\" แทน (ตรวจสอบเฉพาะช่วง sequence number ล่าสุด)"}, {"type": "subheading", "content": "Security Databases: SPD และ SAD"}, {"type": "note", "content": "**SAD (Security Association Database)**: endpoint เก็บ state ของ SA ทั้งหมดไว้ที่นี่ — เมื่อส่ง IPsec datagram, R1 เข้าถึง SAD เพื่อดูว่าต้องประมวลผล datagram อย่างไร — เมื่อ datagram มาถึง R2, R2 ตรวจสอบ SPI แล้ว index เข้า SAD เพื่อประมวลผลตามนั้น → **SAD บอก \"อย่างไร\" (how)**\n\n**SPD (Security Policy Database)**: บอก policy ว่า datagram แบบไหนควรใช้ IPsec หรือไม่ และควรใช้ SA ไหน — อาจอิงจาก source/destination IP address, protocol number → **SPD บอก \"อะไร\" (what)**"}, {"type": "subheading", "content": "IKE: Internet Key Exchange"}, {"type": "note", "content": "การกำหนด IPsec SA แบบ manual (ระบุ SPI, IP, algorithm, key ทุกอย่างด้วยมือ) **ไม่สามารถทำได้จริง**สำหรับ VPN ที่มี endpoint นับร้อย — ใช้ **IKE (Internet Key Exchange)** แทน\n\n**Authentication ผ่าน IKE ทำได้ 2 แบบ**:\n- **PSK (Pre-Shared Key)**: ทั้งสองฝั่งเริ่มด้วย secret ที่ใช้ร่วมกันอยู่แล้ว รัน IKE เพื่อยืนยันตัวตนกันและสร้าง IPsec SA (ทั้ง 2 ทิศทาง) รวมถึง encryption/authentication key\n- **PKI (Public Key Infrastructure)**: ทั้งสองฝั่งเริ่มด้วย public/private key pair และ certificate รัน IKE เพื่อยืนยันตัวตนและได้ IPsec SA — **คล้ายกับ handshake ของ SSL/TLS**\n\n**IKE มี 2 phase**: **Phase 1** สร้าง bidirectional IKE SA (หรือเรียกว่า ISAKMP security association ต่างจาก IPsec SA) มี 2 mode ย่อย: **aggressive mode** (ใช้ message น้อยกว่า) และ **main mode** (ให้ identity protection และยืดหยุ่นกว่า) — **Phase 2**: ใช้ ISAKMP เพื่อเจรจา IPsec SA คู่หนึ่ง (ทั้ง 2 ทิศทาง) อย่างปลอดภัย"}, {"type": "note", "content": "**สรุป IPsec**: ใช้ IKE แลกเปลี่ยน algorithm, secret key, SPI number → ใช้ AH หรือ ESP protocol (หรือทั้งคู่) → AH ให้ integrity+authentication, ESP (พร้อม AH) ให้ encryption เพิ่มด้วย → IPsec peer อาจเป็น end system คู่กัน, router/firewall คู่กัน, หรือ router/firewall กับ end system ก็ได้"}]}, {"title": "Security ในเครือข่ายไร้สายและ Mobile: 802.11 และ 4G/5G", "body": "การ authenticate และเข้ารหัสในเครือข่ายไร้สายมีความท้าทายเฉพาะตัว เพราะ mobile ต้อง associate กับ access point/base station ก่อน แล้วจึง authenticate เข้าสู่เครือข่าย", "blocks": [{"type": "subheading", "content": "802.11 (WiFi): Authentication และ Encryption แบบ WPA3"}, {"type": "note", "content": "Mobile ที่มาถึงต้อง: (1) **associate** กับ access point (ตั้งค่าการสื่อสารผ่าน wireless link) (2) **authenticate** เข้าสู่เครือข่าย — มีขั้นตอนย่อยดังนี้:"}, {"type": "formula", "label": "4 ขั้นตอนของ 802.11 Authentication/Encryption", "content": "**1. Discovery of security capabilities**: AP ประกาศการมีอยู่ของตัวเองและรูปแบบ authentication/encryption ที่รองรับ — device ขอรูปแบบที่ต้องการ — (ในขั้นนี้ device ยัง**ไม่ authenticated** และยังไม่มี encryption key)\n\n**2. Mutual authentication, key derivation**: AS (Authentication Server) และ mobile มี shared secret ร่วมกันอยู่แล้ว (เช่น password) — ทั้งคู่ใช้ shared secret, nonce (ป้องกัน replay attack), และ cryptographic hashing (รับประกัน message integrity) เพื่อยืนยันตัวตนซึ่งกันและกัน — ได้ symmetric session key ร่วมกัน\n\n**3. Shared symmetric key distribution**: session key เดียวกันถูกสร้างขึ้นทั้งที่ mobile และ AS — AS แจ้ง AP เกี่ยวกับ session key นี้ (เช่น สำหรับใช้เข้ารหัสแบบ AES)\n\n**4. Encrypted communication**: การสื่อสารระหว่าง mobile กับ remote host (ผ่าน AP) ถูกเข้ารหัสด้วย key ที่ตกลงกันแล้ว"}, {"type": "note", "content": "**WPA3 Handshake รายละเอียด**: (a) AS สร้าง $Nonce_{AS}$ ส่งให้ mobile (b) mobile รับ $Nonce_{AS}$ สร้าง $Nonce_M$ ของตัวเอง แล้วสร้าง session key $K_{M-AP}$ จาก initial shared secret + $Nonce_{AS}$ + $Nonce_M$ — ส่ง $Nonce_M$ พร้อม HMAC-signed value (ที่คำนวณจาก $Nonce_{AS}$ และ shared secret) กลับไป (c) AS ก็คำนวณ $K_{M-AP}$ แบบเดียวกันได้เอง — ทั้งคู่ได้ session key เดียวกันโดยไม่เคยส่ง key นั้นผ่าน channel เลย\n\n**EAP (Extensible Authentication Protocol)** [RFC 3748]: นิยาม request/response protocol แบบ end-to-end ระหว่าง mobile device กับ AS — ห่อหุ้มผ่าน **EAP over LAN (EAPoL)** ที่ link layer, ส่งต่อจาก AP ไปยัง AS ผ่าน **RADIUS** protocol บน UDP/IP"}, {"type": "subheading", "content": "Authentication และ Encryption ใน 4G LTE"}, {"type": "note", "content": "Mobile ที่มาถึงต้อง: (1) associate กับ BS (ตั้งค่าการสื่อสารผ่าน wireless link 4G) (2) authenticate ตัวเองเข้าสู่เครือข่าย **และ authenticate เครือข่ายกลับด้วย** (mutual)\n\n**ความแตกต่างสำคัญจาก WiFi**: **SIM card** ของ mobile ให้ identity ระดับโลกและเก็บ shared key ไว้ — บริการใน visited network ขึ้นกับ (paid) service subscription ใน home network — **MME (visited network) + HSS (home network) รวมกันเล่นบทบาทคล้าย AS ของ WiFi** — ผู้ยืนยันตัวตนขั้นสุดท้ายคือ **HSS** โดยอาศัยความไว้ใจและความสัมพันธ์ทางธุรกิจระหว่าง visited/home network"}, {"type": "formula", "label": "ขั้นตอนการ Authenticate ใน 4G LTE (5 ขั้นตอน)", "content": "(a) Mobile ส่ง attach message (มี IMSI, visited network info) → relay ผ่าน BS → visited MME → home HSS\n\n(b) HSS ใช้ shared-in-advance secret key ($K_{HSS-M}$) สร้าง **auth_token** และ **expected authentication response** ($xres_{HSS}$) — auth_token มีข้อมูลที่เข้ารหัสด้วย $K_{HSS-M}$ ทำให้ mobile รู้ว่าผู้สร้าง auth_token รู้ shared secret จริง → **mobile ยืนยันตัวตนของเครือข่าย** ได้ (mutual authentication ทิศทางแรก)\n\n(c) Mobile คำนวณ $res_M$ ด้วย secret key ของตัวเอง (คำนวณแบบเดียวกับที่ HSS คำนวณ $xres_{HSS}$) ส่งกลับไปยัง MME\n\n(d) MME เทียบ $res_M$ (จาก mobile) กับ $xres_{HSS}$ (จาก HSS) — ถ้าตรงกัน **mobile ถูกยืนยันตัวตนโดยเครือข่าย** (ทิศทางที่สอง) → MME แจ้ง BS ว่า mobile ผ่านการยืนยันแล้ว พร้อมสร้าง key ให้ BS\n\n(e) Mobile และ BS ได้ key สำหรับเข้ารหัสข้อมูล/control frame ผ่าน 4G wireless channel (อาจใช้ AES)"}, {"type": "subheading", "content": "วิวัฒนาการจาก 4G สู่ 5G Security"}, {"type": "table", "content": "<table><tr><th>ด้าน</th><th>4G</th><th>5G</th></tr><tr><td>ผู้ตัดสินใจ authenticate</td><td>MME ในเครือข่ายที่มาเยือนตัดสินใจ</td><td>**Home network เป็นผู้ตัดสินใจ** (visited MME เป็นแค่ \"middleman\" แต่ยังปฏิเสธได้)</td></tr><tr><td>Key</td><td>ใช้ shared-in-advance key</td><td>สำหรับ IoT: **key ไม่จำเป็นต้อง shared ล่วงหน้า**</td></tr><tr><td>ความเป็นส่วนตัวของ IMSI</td><td>IMSI ของ device ถูกส่งแบบ **cleartext (ไม่เข้ารหัส)** ไปยัง BS</td><td>**ใช้ public key crypto เข้ารหัส IMSI** เพื่อความเป็นส่วนตัวที่ดีขึ้น</td></tr></table>"}]}, {"title": "Firewalls: Operational Security", "body": "**Firewall** แยก (isolate) เครือข่ายภายในองค์กรออกจากอินเทอร์เน็ตวงกว้าง โดยอนุญาตให้ packet บางตัวผ่านได้ และบล็อกตัวอื่นๆ", "blocks": [{"type": "subheading", "content": "ทำไมต้องมี Firewall?"}, {"type": "table", "content": "<table><tr><th>เหตุผล</th><th>ตัวอย่าง</th></tr><tr><td>ป้องกัน Denial-of-Service attack</td><td>SYN flooding: ผู้โจมตีสร้าง TCP connection ปลอมจำนวนมาก จนไม่มี resource เหลือให้ connection จริง</td></tr><tr><td>ป้องกันการแก้ไข/เข้าถึงข้อมูลภายในโดยผิดกฎหมาย</td><td>เช่น ผู้โจมตีแทนที่หน้าเว็บด้วยเนื้อหาอื่น</td></tr><tr><td>อนุญาตเฉพาะการเข้าถึงที่ได้รับอนุญาต</td><td>เฉพาะกลุ่มผู้ใช้/host ที่ยืนยันตัวตนแล้ว</td></tr></table>"}, {"type": "note", "content": "**3 ประเภทของ Firewall**: **stateless packet filter**, **stateful packet filter**, **application gateway**"}, {"type": "subheading", "content": "Stateless Packet Filtering"}, {"type": "note", "content": "กรอง packet **ทีละตัว** โดยตัดสินใจ forward/drop ตาม: source/destination IP address, TCP/UDP source/destination port number, ICMP message type, TCP SYN/ACK bit"}, {"type": "table", "content": "<table><tr><th>Policy</th><th>Firewall Setting</th></tr><tr><td>ไม่ให้เข้าถึงเว็บภายนอก</td><td>drop outgoing packet ทุกตัวที่ไปยัง port 80 ของ IP address ใดๆ</td></tr><tr><td>ไม่ให้ TCP connection เข้ามาจากภายนอก ยกเว้น web server สาธารณะขององค์กร</td><td>drop incoming TCP SYN packet ทุกตัวยกเว้นที่ไปยัง IP 130.207.244.203 port 80</td></tr><tr><td>ป้องกัน web-radio กินแบนด์วิดท์</td><td>drop incoming UDP ทุกตัว ยกเว้น DNS และ router broadcast</td></tr><tr><td>ป้องกัน smurf DoS attack</td><td>drop ICMP packet ทุกตัวที่ไปยัง broadcast address</td></tr><tr><td>ป้องกันไม่ให้เครือข่ายถูก traceroute</td><td>drop outgoing ICMP TTL expired traffic ทุกตัว</td></tr></table>"}, {"type": "subheading", "content": "Access Control List (ACL)"}, {"type": "note", "content": "**ACL**: ตารางกฎที่ apply กับ packet ที่เข้ามาตามลำดับจากบนลงล่าง — แต่ละแถวคือคู่ (action, condition) — **มีลักษณะคล้าย OpenFlow forwarding table** (Chapter 4) มาก — ตัวอย่างกฎทั่วไป: อนุญาต outgoing TCP ที่ source port > 1023, dest port = 80 (HTTP request ออกไปข้างนอก), อนุญาต incoming TCP ที่ source port = 80, มี ACK bit set (HTTP response กลับมา), ปิดท้ายด้วยกฎ deny-all"}, {"type": "warning", "content": "**ข้อจำกัดของ Stateless Filter**: เป็นเครื่องมือที่ \"หยาบ\" เกินไป — อาจยอมรับ packet ที่ **\"ไม่สมเหตุสมผล\"** ได้ เช่น packet ที่ dest port = 80 พร้อม ACK bit set ทั้งที่**ไม่เคยมีการสร้าง TCP connection มาก่อนเลย** (ไม่มี SYN handshake) — filter แบบ stateless ไม่มีทางรู้ได้เพราะดูแค่ทีละ packet"}, {"type": "subheading", "content": "Stateful Packet Filtering"}, {"type": "note", "content": "**Stateful filter** ติดตามสถานะของทุก TCP connection: ติดตามการสร้าง connection (SYN) และการปิด (FIN) เพื่อพิจารณาว่า packet ที่เข้า/ออกนั้น \"สมเหตุสมผล\" หรือไม่ (สอดคล้องกับ connection ที่มีอยู่จริงหรือเปล่า) — timeout connection ที่ไม่มีการเคลื่อนไหว (inactive) แล้วเลิกรับ packet ของ connection นั้น\n\n**การ implement**: ACL ถูกเพิ่ม column พิเศษเพื่อระบุว่าต้อง**เช็ค connection state table**ก่อนอนุญาต packet หรือไม่ — เช่นกฎที่อนุญาต incoming TCP พร้อม ACK bit จะถูกกำกับด้วย \"check connection\" เพื่อยืนยันว่ามี connection ที่ SYN ไปแล้วจริงๆ ก่อนอนุญาตให้ผ่าน"}, {"type": "subheading", "content": "Application Gateway"}, {"type": "note", "content": "กรอง packet โดยดูทั้ง **application data** ไม่ใช่แค่ header ของ IP/TCP/UDP — ตัวอย่าง: อนุญาตเฉพาะ internal user ที่ได้รับอนุญาตให้ telnet ออกไปข้างนอก\n\n**ขั้นตอน**: (1) บังคับให้ผู้ใช้ telnet ทุกคนต้อง telnet **ผ่าน application gateway** เท่านั้น (2) สำหรับผู้ใช้ที่ได้รับอนุญาต gateway สร้าง telnet connection ไปยัง destination host จริง แล้ว **relay ข้อมูลระหว่าง 2 connection** (host-to-gateway และ gateway-to-remote-host) (3) router filter บล็อก telnet connection ทั้งหมดที่**ไม่ได้มาจาก gateway**"}, {"type": "warning", "content": "**ข้อจำกัดของ Firewall/Gateway**: **IP spoofing** — router ไม่มีทางรู้แน่ชัดว่าข้อมูล \"จริงๆ แล้ว\" มาจาก source ที่อ้างไว้หรือไม่ | ถ้ามีหลาย application ที่ต้องการการจัดการพิเศษ แต่ละตัวต้องมี application gateway ของตัวเอง | client software ต้องรู้วิธีติดต่อ gateway (เช่นต้องตั้งค่า IP ของ proxy ใน web browser เอง) | filter มักใช้นโยบาย \"all-or-nothing\" กับ UDP (ยากที่จะกรองแบบละเอียด) | มี **trade-off ระหว่างระดับการสื่อสารกับโลกภายนอกและระดับความปลอดภัย** เสมอ — แม้แต่ site ที่ได้รับการป้องกันอย่างดีก็ยังคงถูกโจมตีสำเร็จได้"}, {"type": "subheading", "content": "Intrusion Detection System (IDS)"}, {"type": "note", "content": "Packet filtering ทำงานที่ระดับ **TCP/IP header เท่านั้น** ไม่มีการตรวจสอบความสัมพันธ์ระหว่าง session ต่างๆ — **IDS** ก้าวไปไกลกว่านั้น:\n\n- **Deep packet inspection**: ตรวจดู**เนื้อหาของ packet** (เช่น เทียบ character string ในตัว packet กับฐานข้อมูลของ virus/attack string ที่รู้จัก)\n- **ตรวจสอบความสัมพันธ์ระหว่างหลาย packet**: port scanning, network mapping, DoS attack — ซึ่งไม่สามารถตรวจจับได้จาก packet เดี่ยวๆ\n\n**การ deploy หลาย IDS**: มักวาง IDS sensor ไว้หลายจุดในเครือข่าย เพื่อตรวจสอบประเภทต่างกัน — เช่น ใน **demilitarized zone (DMZ)** ที่มี web server, DNS server, FTP server มักมี IDS sensor คอยเฝ้าระวังแยกต่างหากจาก firewall หลักที่กั้นระหว่าง internal network กับ Internet"}, {"type": "diagram", "layout": "flow", "title": "Firewall: การกรอง Packet ขาเข้า", "actors": ["Packet ขาเข้า", "Firewall\n(ตรวจ ACL / State Table)", "Internal Host\n(ถ้าอนุญาต)"], "steps": [{"from": 0, "to": 1, "label": "Packet มาถึง", "note": "ตรวจสอบ source/destination/port"}, {"from": 1, "to": 2, "label": "อนุญาตผ่าน (Allow)", "note": "ตรงกับกฎที่อนุญาตไว้ — ถ้าไม่ตรงจะถูก Drop ทันที"}]}]}, {"title": "สรุปท้ายบท: Chapter 8 — Network Security", "body": "บทนี้เป็นบทสุดท้ายของหนังสือ ครอบคลุมเทคนิคพื้นฐานของ network security และการนำไปประยุกต์ใช้ในสถานการณ์จริงหลากหลายรูปแบบ", "blocks": [{"type": "subheading", "content": "เทคนิคพื้นฐาน (Basic Techniques)"}, {"type": "table", "content": "<table><tr><th>เทคนิค</th><th>สรุปสั้น</th></tr><tr><td>Cryptography</td><td>Symmetric key (DES, AES) และ Public key (RSA) — รากฐานของทุกอย่าง</td></tr><tr><td>Message Integrity</td><td>Hash function (MD5, SHA-1), message digest, digital signature</td></tr><tr><td>End-point Authentication</td><td>วิวัฒนาการจาก ap1.0 ถึง ap5.0 — nonce, public key, การแก้ปัญหา man-in-the-middle ด้วย certificate/CA</td></tr></table>"}, {"type": "subheading", "content": "การประยุกต์ใช้ในสถานการณ์จริง (Security Scenarios)"}, {"type": "table", "content": "<table><tr><th>สถานการณ์</th><th>เทคนิคที่ใช้</th></tr><tr><td>Secure e-mail</td><td>รวม symmetric key (ความเร็ว) + public key (แลกเปลี่ยน key, ยืนยันตัวตน) + hash (integrity)</td></tr><tr><td>Secure transport (TLS)</td><td>Handshake + key derivation + record-based data transfer + secure closure — ใช้ https ทุกวันนี้</td></tr><tr><td>IPsec</td><td>Network-layer security ผ่าน AH/ESP protocol, SA, IKE key exchange</td></tr><tr><td>802.11, 4G/5G</td><td>Wireless-specific authentication/encryption ผ่าน AS/HSS, EAP/RADIUS, mutual authentication</td></tr><tr><td>Operational security</td><td>Firewall (stateless/stateful packet filter, application gateway) และ IDS (deep packet inspection)</td></tr></table>"}, {"type": "note", "content": "**ข้อสังเกตสำคัญ**: หัวข้อทั้งหมดใน chapter นี้แสดงให้เห็นว่า **เทคนิค cryptography พื้นฐานเพียงไม่กี่อย่าง** (symmetric/public key encryption, hashing, digital signature, nonce) ถูกนำไปผสมผสานใช้ซ้ำแล้วซ้ำเล่าในบริบทที่แตกต่างกันโดยสิ้นเชิง — ตั้งแต่ระดับ application (email) ไปจนถึงระดับ transport (TLS), network (IPsec), และ link layer (WiFi/4G/5G) — เป็นตัวอย่างที่ดีของหลักการ **layering** ที่ปรากฏซ้ำตลอดทั้งเล่ม: ปัญหาเดียวกัน (การรักษาความปลอดภัยในการสื่อสาร) ถูกแก้ด้วยชุดเครื่องมือ (toolbox) เดียวกัน เพียงแค่ประยุกต์ใช้ในบริบทของแต่ละ layer ที่ต่างกันไป"}, {"type": "warning", "content": "จบหลักสูตรทั้ง 8 บทของ **Computer Networking: A Top-Down Approach** — เดินทางจาก Application Layer (บทที่ 2) ลงมาถึง Physical/Link Layer (บทที่ 6-7) แล้วปิดท้ายด้วยหัวข้อ **Security** ที่ตัดผ่านทุก layer ของ protocol stack — ครบถ้วนตามโครงสร้างของวิชา Computer Networking ระดับมหาวิทยาลัย"}]}];

function renderTOC(){
  const toc = document.getElementById("tocList");
  toc.innerHTML = "";
  SECTIONS.forEach((sec, idx)=>{
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = "#section_"+idx;
    a.textContent = sec.title;
    a.dataset.idx = idx;
    li.appendChild(a);
    toc.appendChild(li);
  });
}

function escapeXml(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function fmtTspans(text, x){
  return String(text==null?"":text).split("\n").map(function(line,i){
    return '<tspan x="'+x+'" dy="'+(i===0?0:15)+'">'+escapeXml(line)+'</tspan>';
  }).join("");
}

function renderDiagramBlock(block, secIdx, blockIdx){
  const uid = "dg_"+secIdx+"_"+blockIdx;
  const layout = block.layout || "lifeline";
  const actors = block.actors || [];
  const steps = block.steps || [];
  const n = actors.length;
  const W = 680;
  const margin = 76;
  const nodesX = [];
  for(let i=0;i<n;i++){ nodesX.push(n===1 ? W/2 : margin + i*((W-2*margin)/Math.max(1,n-1))); }
  let inner = "";
  let H = 0;

  if(layout === "flow"){
    const boxY = 50, boxH = 46;
    const boxW = Math.min(128, Math.max(70,(W-2*margin)/Math.max(1,n-1)-14));
    H = 168;
    actors.forEach(function(a,i){
      inner += '<rect class="diagram-node-box" x="'+(nodesX[i]-boxW/2)+'" y="'+boxY+'" width="'+boxW+'" height="'+boxH+'" rx="7"></rect>';
      inner += '<text class="diagram-actor-label" x="'+nodesX[i]+'" y="'+(boxY+boxH/2-6)+'" text-anchor="middle">'+fmtTspans(a, nodesX[i])+'</text>';
    });
    steps.forEach(function(st,i){
      const x1 = nodesX[st.from]+boxW/2+3, x2 = nodesX[st.to]-boxW/2-3;
      const y = boxY+boxH/2;
      const pid = uid+"_p"+i, mid = uid+"_m"+i;
      inner += '<path id="'+pid+'" class="diagram-arrow-path" d="M '+x1+' '+y+' L '+x2+' '+y+'"></path>';
      inner += '<text class="diagram-arrow-label" x="'+((x1+x2)/2)+'" y="'+(boxY-12)+'" text-anchor="middle">'+escapeXml(st.label||"")+'</text>';
      inner += '<circle id="'+mid+'d" class="diagram-glow-dot" r="6.5" cx="'+x1+'" cy="'+y+'">'
             + '<animateMotion id="'+mid+'" begin="indefinite" dur="0.75s" fill="freeze" path="M '+x1+' '+y+' L '+x2+' '+y+'"></animateMotion>'
             + '<animate attributeName="opacity" begin="'+mid+'.begin" dur="0.05s" from="0" to="1" fill="freeze"></animate>'
             + '<animate attributeName="opacity" begin="'+mid+'.end" dur="0.5s" from="1" to="0" fill="freeze"></animate>'
             + '</circle>';
    });
  } else {
    const rowH = 64, topY = 12, boxH = 38;
    H = topY + boxH + steps.length*rowH + 26;
    const boxW = Math.min(160, Math.max(80,(W-2*margin)/Math.max(1,n-1)-10));
    actors.forEach(function(a,i){
      inner += '<rect class="diagram-node-box" x="'+(nodesX[i]-boxW/2)+'" y="'+topY+'" width="'+boxW+'" height="'+boxH+'" rx="7"></rect>';
      inner += '<text class="diagram-actor-label" x="'+nodesX[i]+'" y="'+(topY+boxH/2-6)+'" text-anchor="middle">'+fmtTspans(a, nodesX[i])+'</text>';
      inner += '<line class="diagram-lifeline" x1="'+nodesX[i]+'" y1="'+(topY+boxH)+'" x2="'+nodesX[i]+'" y2="'+(H-8)+'"></line>';
    });
    steps.forEach(function(st,i){
      const y = topY+boxH+22 + i*rowH;
      const x1 = nodesX[st.from], x2 = nodesX[st.to];
      const pid = uid+"_p"+i, mid = uid+"_m"+i;
      inner += '<path id="'+pid+'" class="diagram-arrow-path" d="M '+x1+' '+y+' L '+x2+' '+y+'"></path>';
      inner += '<text class="diagram-arrow-label" x="'+((x1+x2)/2)+'" y="'+(y-9)+'" text-anchor="middle">'+escapeXml(st.label||"")+'</text>';
      inner += '<circle id="'+mid+'d" class="diagram-glow-dot" r="6.5" cx="'+x1+'" cy="'+y+'">'
             + '<animateMotion id="'+mid+'" begin="indefinite" dur="0.75s" fill="freeze" path="M '+x1+' '+y+' L '+x2+' '+y+'"></animateMotion>'
             + '<animate attributeName="opacity" begin="'+mid+'.begin" dur="0.05s" from="0" to="1" fill="freeze"></animate>'
             + '<animate attributeName="opacity" begin="'+mid+'.end" dur="0.5s" from="1" to="0" fill="freeze"></animate>'
             + '</circle>';
    });
  }

  const svg = '<svg class="diagram-svg" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" preserveAspectRatio="xMidYMid meet">'+inner+'</svg>';

  let stepsHtml = '<ol class="diagram-steps-list">';
  steps.forEach(function(st,i){
    stepsHtml += '<li><span class="step-num">'+(i+1)+'</span><strong>'+escapeXml(st.label||"")+'</strong>'+(st.note?(' — '+escapeXml(st.note)):'')+'</li>';
  });
  stepsHtml += '</ol>';

  return '<div class="diagram-block" id="'+uid+'">'
       + '<h4><span>🔀 '+escapeXml(block.title||"")+'</span><button class="diagram-play-btn" data-diagram-id="'+uid+'">&#9654; เล่นแอนิเมชัน / Play animation</button></h4>'
       + '<div class="diagram-svg-wrap">'+svg+'</div>'
       + stepsHtml
       + '</div>';
}

function diagramPlay(containerId){
  const wrap = document.getElementById(containerId);
  if(!wrap) return;
  const svg = wrap.querySelector('svg');
  const paths = svg.querySelectorAll('.diagram-arrow-path');
  const dots = svg.querySelectorAll('.diagram-glow-dot');
  const items = wrap.querySelectorAll('.diagram-steps-list li');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  items.forEach(function(li){ li.classList.remove('step-active'); });
  if(reduced){ return; }
  const stepDur = 850;
  paths.forEach(function(p){
    const len = p.getTotalLength();
    p.style.transition = 'none';
    p.style.strokeDasharray = len;
    p.style.strokeDashoffset = len;
  });
  void svg.getBoundingClientRect();
  paths.forEach(function(p,i){
    setTimeout(function(){
      p.style.transition = 'stroke-dashoffset '+(stepDur-100)+'ms ease';
      p.style.strokeDashoffset = 0;
      const anim = dots[i] ? dots[i].querySelector('animateMotion') : null;
      if(anim){ try{ anim.beginElement(); }catch(e){} }
      if(items[i]) items[i].classList.add('step-active');
    }, i*stepDur);
  });
}

function wireDiagramButtons(){
  document.querySelectorAll('.diagram-play-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ diagramPlay(btn.dataset.diagramId); });
  });
}

function renderContent(){
  const main = document.getElementById("mainArea");
  main.innerHTML = "";
  SECTIONS.forEach((sec, idx)=>{
    const card = document.createElement("div");
    card.className = "section-card";
    card.id = "section_"+idx;
    let html = "<h2>"+sec.title+"</h2>";
    if(sec.body){
      html += '<div class="body-text">'+sec.body+'</div>';
    }
    (sec.blocks || []).forEach((block, bi)=>{
      if(block.type === "note"){
        html += '<div class="callout callout-note"><span class="callout-title">หมายเหตุ / Note</span>'+escapeXml(block.content)+'</div>';
      } else if(block.type === "example"){
        html += '<div class="callout callout-example"><span class="callout-title">ตัวอย่าง / Example</span>'+escapeXml(block.content)+'</div>';
      } else if(block.type === "warning"){
        html += '<div class="callout callout-warning"><span class="callout-title">ข้อควรระวัง / Warning</span>'+escapeXml(block.content)+'</div>';
      } else if(block.type === "formula"){
        html += '<div class="callout callout-formula"><span class="callout-title">'+(block.label || "สูตร / Formula")+'</span>'+escapeXml(block.content)+'</div>';
      } else if(block.type === "subheading"){
        html += '<h3>'+block.content+'</h3>';
      } else if(block.type === "table"){
        html += block.content;
      } else if(block.type === "image"){
        html += '<div class="image-block"><img src="'+block.src+'" alt="'+(block.alt || "")+'" loading="lazy">';
        if(block.caption){
          html += '<div class="image-caption">'+block.caption+'</div>';
        }
        html += '</div>';
      } else if(block.type === "diagram"){
        html += renderDiagramBlock(block, idx, bi);
      }
    });
    card.innerHTML = html;
    main.appendChild(card);
  });

  if(window.renderMathInElement){
    renderMathInElement(main, {
      delimiters: [
        {left: "$$", right: "$$", display: true},
        {left: "$", right: "$", display: false}
      ]
    });
  }
}

function setupScrollSpy(){
  const links = document.querySelectorAll(".toc-list a");
  const sections = document.querySelectorAll(".section-card");
  window.addEventListener("scroll", ()=>{
    let currentIdx = 0;
    sections.forEach((sec, idx)=>{
      const rect = sec.getBoundingClientRect();
      if(rect.top <= 100) currentIdx = idx;
    });
    links.forEach(l=>l.classList.remove("active"));
    if(links[currentIdx]) links[currentIdx].classList.add("active");
  });
}

function setupReveal(){
  const cards = document.querySelectorAll('.section-card');
  if(!('IntersectionObserver' in window)){
    cards.forEach(function(c){ c.classList.add('revealed'); });
    return;
  }
  const io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){ e.target.classList.add('revealed'); io.unobserve(e.target); }
    });
  }, {threshold:0.08, rootMargin:'0px 0px -60px 0px'});
  cards.forEach(function(c){ io.observe(c); });
}

let fontScale = parseFloat(localStorage.getItem('netbook_fontScale')||'1');
function setFontScale(v){
  fontScale = Math.min(1.3, Math.max(0.85, Math.round(v*10)/10));
  try{ localStorage.setItem('netbook_fontScale', fontScale); }catch(e){}
  document.documentElement.style.setProperty('--fontScale', fontScale);
}

function updateProgress(){
  const el = document.documentElement;
  const max = el.scrollHeight - el.clientHeight;
  const pct = max>0 ? (el.scrollTop/max*100) : 0;
  const bar = document.getElementById('readProgress');
  if(bar) bar.style.width = pct+'%';
  const btt = document.getElementById('backToTop');
  if(btt){ if(el.scrollTop>420){ btt.classList.add('show'); } else { btt.classList.remove('show'); } }
}

renderTOC();
renderContent();
setupScrollSpy();
setupReveal();
wireDiagramButtons();
setFontScale(fontScale);

window.addEventListener('scroll', updateProgress);
const backToTopBtn = document.getElementById('backToTop');
if(backToTopBtn){ backToTopBtn.addEventListener('click', function(){ window.scrollTo({top:0,behavior:'smooth'}); }); }
const fontMinusBtn = document.getElementById('fontMinus');
if(fontMinusBtn){ fontMinusBtn.addEventListener('click', function(){ setFontScale(fontScale-0.1); }); }
const fontPlusBtn = document.getElementById('fontPlus');
if(fontPlusBtn){ fontPlusBtn.addEventListener('click', function(){ setFontScale(fontScale+0.1); }); }

</script>
